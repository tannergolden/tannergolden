# The badges under the header, rendered by tannergolden/badges into
# assets/badges/. The static row is the conventional four, as plates in the
# print the banners are drawn in: rainbowprint, so they change colour with the
# header. The live row is two gold
# plates whose values .github/workflows/health.yml measures and sets, so
# either can go yellow or red. Fields: tannergolden/badges/docs/badges.example.yml.

badges:
  - name: status
    label: Status
    message: Active
    icon: pulse
    style: blueprint-for-the-badge
    print: rainbowprint
    link: ./
  - name: role
    label: Role
    message: Profile
    icon: home
    style: blueprint-for-the-badge
    print: rainbowprint
    link: ./
  - name: context
    label: Context
    message: AI Infrastructure
    icon: chip
    style: blueprint-for-the-badge
    print: rainbowprint
    link: ./
  - name: license
    label: License
    message: MIT
    icon: scale
    style: blueprint-for-the-badge
    print: rainbowprint
    link: ./LICENSE

  - name: standards-ci
    label: Standards CI
    message: Passing
    label_color: gold
    message_color: green
    icon: check
    style: blueprint-for-the-badge
    reserve: Failing, No Data
    link: https://github.com/tannergolden/standards/actions/workflows/self-checks.yml
  - name: last-commit
    label: Last Commit
    message: This Week
    label_color: gold
    message_color: green
    icon: commit
    style: blueprint-for-the-badge
    reserve: This Month, Over a Month, No Data
    link: https://github.com/tannergolden?tab=repositories
