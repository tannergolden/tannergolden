# The badges this page draws for itself, rendered by tannergolden/emblems into
# assets/badges/. Edit this file, then `make badges`; the workflow re-renders
# the two dynamic ones on every run through `--set`.
#
# Each entry:
#   name           basename (kebab-case, unique); renders to static/<name>.svg,
#                  or dynamic/<name>.svg for a gold (health) label
#   label          left segment text
#   message        right segment text
#   label_color    palette token or '#RRGGBB' - static: black, dynamic-health: gold
#   message_color  palette token or '#RRGGBB' - carries the semantic meaning
#   icon           a key from the icon registry (optional)
#   style          for-the-badge (default) | flat | flat-square
#   link           where the badge points when embedded (reference only)
#
# THE STACK BADGES CARRY NO LABEL. The table's row header already says
# Languages, Tooling or Operations, so a left segment repeating it five
# times across a row is the same word over and over and nothing else. An
# empty label renders a single segment: the icon and the name.
#
# STYLE IS SPLIT ON PURPOSE. The four identity badges in the header keep
# `for-the-badge`, which is what the documentation standard specifies for a
# header and what every other repository on this account wears. Everything
# in the body, the two live badges and the stack, is `flat-square`: those
# sit inline with text and read as content rather than as a masthead.

badges:
  # --- Identity: black label, header, for-the-badge -------------------------
  - name: status
    label: Status
    message: Active
    label_color: black
    message_color: green
    icon: pulse
    link: ./
  - name: role
    label: Role
    message: Profile
    label_color: black
    message_color: pink
    icon: book
    link: ./
  - name: context
    label: Context
    message: Automation
    label_color: black
    message_color: purple
    icon: gear
    link: ./
  - name: license
    label: License
    message: MIT
    label_color: black
    message_color: yellow
    icon: scale
    link: ./LICENSE

  # --- Live: gold label, traffic-light message, rewritten by the workflow ---
  - name: availability
    label: Availability
    message: Not Available
    label_color: gold
    message_color: red
    icon: pulse
    link: https://github.com/tannergolden/tannergolden
  - name: dispatches
    label: Workflow
    message: Passing
    label_color: gold
    message_color: green
    icon: clock
    style: flat-square
    link: https://github.com/tannergolden/tannergolden/actions/workflows/dispatches.yml
  - name: month
    label: This month
    message: '3'
    label_color: gold
    message_color: green
    icon: commit
    style: flat-square
    link: ./dispatches/

  # --- Stack: black label, flat-square, body ------------------------------------
