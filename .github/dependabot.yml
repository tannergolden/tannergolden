# =============================================================================
# Dependabot - automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# =============================================================================
# GitHub reads this file ONLY from the repository that owns it, so it cannot
# be shared and has to live here.
#
# Only `github-actions`: the scripts are standard-library Python, so the
# pinned actions in the workflows are the profile's only dependencies. Every
# update is grouped into one pull request a month, titled as a Conventional
# Commit, `build(deps): ...`, so a merged update reads like every other commit.
# =============================================================================

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '07:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
