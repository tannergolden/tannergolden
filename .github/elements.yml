# The schematic under About Me, drawn by the banners' elements kit
# (tannergolden/banners/elements) into assets/elements/. Written by hand: edit
# a box or a wire and the Elements workflow redraws it on the next push. Every
# field: tannergolden/banners/docs/Elements-Kit.md. The kit lays the boxes out
# from the wires, so a wire that skips a column would run through a box: the
# kits' hours, in EST, sit on their boxes rather than on wires from Markdown.
print: blackprint
subject: tannergolden
elements:
  how-it-fits:
    kind: schematic
    title: Schematic of tannergolden
    desc: 'Standards holds the rules and the reusable workflows every repository calls at v1, and the Golden Path template
      follows them by link, so every new repository starts from it. A repository adds one Markdown stub, which runs the kits
      that draw this page: the header and footer at 00:00, the badges at 08:00 and the trophies at 16:00 EST. The header sets
      the page''s print, the blackprint, and the badges, the schematic and the placards match it.'
    caption: HOW IT FITS TOGETHER  ·  TIMES IN EST  ·  NOT TO SCALE
    groups:
      page: THIS README  ·  EVERY IMAGE DRAWN, NEVER FETCHED
    boxes:
      standards:
        title: Standards
        path: reusable workflows @v1
        icon: scale
      path:
        title: Golden Path
        path: use this template
        icon: compass
      repos:
        title: Every repository
        path: .github/workflows/
        icon: layers
      markdown:
        title: Markdown
        path: workflows/markdown.yml
        icon: sync
      header:
        title: Header and footer
        path: banners@v1 · 00:00
        icon: grid
        in: page
        note: 1
      trophies:
        title: Trophies
        path: trophies@v1 · 16:00
        icon: trophy
        in: page
      badges:
        title: Badges
        path: badges@v1 · 08:00
        icon: tag
        in: page
      drawings:
        title: Schematic and placards
        path: banners/elements@v1
        icon: layers
        in: page
        note: 2
    wires:
    - - standards
      - path
      - BY LINK
    - - path
      - repos
      - TEMPLATE
    - - repos
      - markdown
      - ONE STUB
    - - markdown
      - header
      - RUNS
    - - markdown
      - trophies
      - RUNS
    - - header
      - badges
      - PRINT
    - - header
      - drawings
      - PRINT
    notes:
    - - 1
      - SETS THE PAGE'S PRINT; THE REST MATCHES IT
    - - 2
      - REDRAWN AFTER EVERY MARKDOWN RUN
