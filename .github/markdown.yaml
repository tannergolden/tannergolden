    desc: "#43768: bump to python 3.14."
    cells:
      - ["Stars", "160K"]
      - ["Language", "PYTHON"]
      - ["Opened", "9 OCT"]
  issue-2:
    kind: "placard"
    owner: "rtk-ai"
    name: "rtk"
