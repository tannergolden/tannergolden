# The page's settings, read by tannergolden/markdown on every run of the
# Markdown stub (.github/workflows/markdown.yml), which names the page's one
# theme. Whatever is not written here is read from GitHub: the name, the bio
# and every figure. Every key and its default:
# https://github.com/tannergolden/markdown/blob/Development/docs/references/Settings.md

# The README tells time in EST, so the page's day, and a holiday's set with
# it, changes over at midnight EST.
timezone: EST

# My birthday, the month and the day: on it the whole page is drawn in the
# kit's Birthday set for the day, over the medieval design and any holiday's
# set, and handed back at the next midnight. The year stays out of this
# public file, so the cake carries no age.
birthday: 01-17

banners:
  motto: Built to be rebuilt.
  # More general notes, numbered after the motto: the second says how to read
  # every time on the page.
  notes:
    - All times in EST.
  # Where to find me and what I work in, before any count that is still small.
  figures: [account, repositories, contributions, language, since, site]
  closing: Measured, never typed.
  # The four buttons under the footer, in this order: everything published,
  # then the three repositories a developer should open first. The standards
  # every repository follows, the template every new one starts from, and
  # the kit that draws this page.
  links:
    Repositories: https://github.com/tannergolden?tab=repositories
    Standards: https://github.com/tannergolden/standards
    Golden Path: https://github.com/tannergolden/path
    Markdown: https://github.com/tannergolden/markdown

# The row under the header: the conventional three, then two live badges the
# run measures, whose gold labels say so and whose colour can go yellow or
# red. In the page's print, every one is drawn as its plate.
badges:
  - name: status
    label: Status
    message: Active
    icon: pulse
    link: ./
  - name: context
    label: Context
    message: Reproducibility
    icon: chip
    link: ./
  - name: license
    label: License
    message: MIT
    icon: scale
    link: ./LICENSE
  # Whether tannergolden/standards passes its own checks.
  - name: standards-ci
    label: Standards CI
    icon: check
    reserve: Failing, No Data
    link: https://github.com/tannergolden/standards/actions/workflows/self-checks.yml
    measure:
      workflow: self-checks.yml
      repository: tannergolden/standards
      branch: Development
  # How long ago I last committed anywhere; the kit's refreshes and the
  # bot's commits never count.
  - name: last-commit
    label: Last Commit
    icon: commit
    reserve: This Month, Over a Month, No Data
    link: https://github.com/tannergolden?tab=repositories
    measure: last-commit

# The drawings in the README's body, each where its markers stand. The
# schematic is written by hand; the kit lays its boxes out from the wires.
# Its labels are short enough for the pixel sets the page is drawn in, the
# Illuminated, the holidays' and the birthday's, to set whole: a set cuts a
# label too long for its room short with an ellipsis.
elements:
  how-it-fits:
    kind: schematic
    title: Schematic of tannergolden
    desc: >-
      Standards holds the rules and the reusable workflows every repository
      calls at v1, and the Golden Path template follows them by link, so every
      new repository starts from it. A repository adds one Markdown stub, and
      once a day, at 00:00 EST, the kit it calls measures the page and redraws
      what moved in one commit: the header and footer, the badges, this
      schematic and the placards, and the trophies. The stub names the page's
      one theme, the medieval collection's Illuminated, and every part is drawn
      in it, or in a holiday's set around each holiday, or in the Birthday set
      on my birthday, with Capricorn's roundel on every header.
    caption: HOW IT ALL FITS  ·  TIMES IN EST  ·  NOT TO SCALE
    groups:
      page: THIS README  ·  DRAWN, NEVER FETCHED
    boxes:
      standards: {title: Standards, path: reusable workflows @v1, icon: scale}
      path: {title: Golden Path, path: use this template, icon: compass}
      repos: {title: Every repository, path: .github/workflows/, icon: layers}
      markdown: {title: Markdown, path: one stub · 00:00, icon: sync, note: 1}
      header: {title: Header and footer, path: name and figures, icon: grid, in: page}
      badges: {title: Badges, path: two of them live, icon: tag, in: page}
      drawings: {title: 'Schematic, placards', path: placards picked weekly, icon: layers, in: page, note: 2}
      trophies: {title: Trophies, path: the case and its history, icon: trophy, in: page}
    wires:
      - [standards, path, BY LINK]
      - [path, repos, TEMPLATE]
      - [repos, markdown, ONE STUB]
      # One run draws all four, so one of the four wires says so.
      - [markdown, header]
      - [markdown, badges]
      - [markdown, drawings]
      - [markdown, trophies, DRAWS]
    notes:
      - [1, NAMES THE ONE THEME EVERY PART IS DRAWN IN]
      - [2, PLACARDS PICKED WEDNESDAYS AND FRIDAYS]
  # The two repositories on this account that shipped most recently. Every
  # Wednesday .github/scripts/releases.py rewrites the lines between the next
  # two, and nothing else in this file.
  # releases:start
  release-1:
    kind: "placard"
    owner: "tannergolden"
    name: "markdown"
    icon: "package"
    link: "https://github.com/tannergolden/markdown/releases/latest"
    desc: "Automated SVG generator for README headers, badges, trophies, and footers, rendered locally from a single stub to bypass API rate limits."
    cells:
      - ["Release", "V1.16.0"]
      - ["Published", "13 OCT"]
      - ["Pinned as", "@V1"]
  release-2:
    kind: "placard"
    owner: "tannergolden"
    name: "standards"
    icon: "package"
    link: "https://github.com/tannergolden/standards/releases/latest"
    desc: "Documented engineering standards, plus the reusable workflows and composite actions that enforce them for any toolchain."
    cells:
      - ["Release", "V1.13.2"]
      - ["Published", "13 OCT"]
      - ["Pinned as", "@V1"]
  # releases:end
  # The two good first issues. Every Friday .github/scripts/issue.py rewrites
  # the lines between the next two, and nothing else in this file.
  # issues:start
  issue-1:
    kind: "placard"
    owner: "langgenius"
    name: "dify"
    icon: "flag"
    link: "https://github.com/langgenius/dify/issues/43768"
    desc: "#43768: bump to python 3.14."
    cells:
      - ["Stars", "159K"]
      - ["Language", "PYTHON"]
      - ["Opened", "9 OCT"]
  issue-2:
    kind: "placard"
    owner: "immich-app"
    name: "immich"
    icon: "flag"
    link: "https://github.com/immich-app/immich/issues/32476"
    desc: "#32476: Ui inconsistency in mobile app Library Tab."
    cells:
      - ["Stars", "116K"]
      - ["Language", "TYPESCRIPT"]
      - ["Opened", "15 OCT"]
  # issues:end
  # The games on this page, in their tiers: each board, whose turn it is and
  # until when, and every legal move as a link to its ready-made issue, or
  # for two days after a game ends, its final board. After every move,
  # .github/scripts/games.py rewrites the lines between a game's two markers,
  # and chess.py chess's; twice an hour clock.py rewrites them all; and nothing
  # else in this file.
  # tictac:start
  tictac:
    kind: "tictac"
    board: "........./........./........./........./....G..../........./........./...G...../........."
    places: "house"
    opens: "github"
    game: 1
