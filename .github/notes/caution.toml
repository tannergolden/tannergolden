# Caution: something hard to undo. An action that is destructive, irreversible or security-critical.
# 1,000 notes, 250 per level. Drawn by .github/scripts/notes.py; every note
# added makes the rotation longer. No en or em dashes: the script refuses them.

[[note]]
level = "beginner"
topic = "Security"
text = "A secret pushed to a public repository is exposed the moment it lands, even if the next commit deletes it. Revoke and rotate it first, then clean the history."

[[note]]
level = "beginner"
topic = "Git"
text = "Running `git init` in your home folder puts every file beneath it into one repository, and a single `git add .` then stages SSH keys, browser data and documents. Run `git init` only inside a project's own folder."

[[note]]
level = "beginner"
topic = "Shell"
text = "`rm` does not move files to a trash folder: they are gone as soon as it runs. When deleting by pattern, use `rm -i` to confirm each file, and read the full path once more before pressing Enter."

[[note]]
level = "beginner"
topic = "Security"
text = "A development server started with `--host 0.0.0.0` accepts connections from every device on the network, so on cafe or conference Wi-Fi strangers can reach your unfinished app and its debug pages. Bind to `127.0.0.1` instead."

[[note]]
level = "beginner"
topic = "Databases"
text = "Databases from Firebase or Supabase are reached straight from the browser with a public key, so a table left without security rules or row-level security can be read and overwritten by anyone. Lock down access before any real data goes in."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Deleting a repository on GitHub also deletes its issues, pull requests, wiki and releases, not just the code. If you only want to stop working on it, archive it instead, which makes it read-only."

[[note]]
level = "beginner"
topic = "Linux"
text = "`chmod -R 777` lets every user and process on the machine modify or replace those files. Grant only what is needed, which is usually `644` for files and `755` for directories."

[[note]]
level = "beginner"
topic = "Git"
text = "`git clean -fd` permanently deletes untracked files and folders; nothing goes to a trash folder. Preview with `git clean -nd` first, and leave out `-x` unless you also mean to delete ignored files such as `.env`."

[[note]]
level = "beginner"
topic = "Python"
text = "Never `pickle.load` data from a file or network source you do not trust: unpickling can run arbitrary code on your machine. Use JSON for data that comes from other people."

[[note]]
level = "beginner"
topic = "Containers"
text = "Mounting your home folder into a container, as with `-v \"$HOME\":/data`, lets anything inside it read and change your SSH keys, tokens and files. Mount only the project folder, and add `:ro` when the container only needs to read it."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "Base64 is an encoding, not encryption: anyone can reverse it with `base64 -d`. Never use it to hide passwords or tokens in config files or source code."

[[note]]
level = "beginner"
topic = "Web"
text = "Deploying by copying your project folder to a web server can publish the `.git` directory, letting anyone download the full history and any secrets in it. Deploy only the built files, or block access to `/.git`."

[[note]]
level = "beginner"
topic = "Shell"
text = "Adding `.` or an empty entry to your `PATH` makes the shell run programs from whatever folder you are in, so a file named `ls` in a downloaded project runs instead of the real command. Keep the current directory out of `PATH` and type `./script` instead."

[[note]]
level = "beginner"
topic = "GitHub"
text = "In GitHub Codespaces, setting a forwarded port's visibility to Public lets anyone with its address reach that server without signing in. Keep ports private, and share them only with the people who need them."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Set a billing budget alert as soon as you open a cloud account. A leaked key or a forgotten server can otherwise run up charges you only discover when the monthly bill arrives."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "`npm audit fix --force` may upgrade packages across major versions and break your app. Run it on a separate branch from a clean commit, then run your tests before merging."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Silencing a certificate error with `curl -k` or `verify=False` in Python `requests` turns off the check that you are talking to the real server. Fix the certificate problem instead of skipping it."

[[note]]
level = "beginner"
topic = "Linux"
text = "Unplugging a USB drive right after copying can lose the files, because Linux may still hold the data in memory and write it out later. Eject the drive in your file manager, or run `sync` and `umount` first, and wait until it finishes."

[[note]]
level = "beginner"
topic = "Data"
text = "When cleaning a dataset, keep the original file untouched and save each result under a new name. If you overwrite the raw data, a mistake in one step can never be undone."

[[note]]
level = "beginner"
topic = "Containers"
text = "Docker Desktop's Reset to factory defaults and Clean / Purge data options delete every image, container and volume on your machine, including local databases. Back up the volumes you care about before using them to fix a problem."

[[note]]
level = "beginner"
topic = "Git"
text = "`git restore <file>` (or the older `git checkout -- <file>`) overwrites your unstaged edits to that file, and Git keeps no copy of them. Commit or stash first if you might want them later."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Letting a coding assistant run terminal commands without asking means a wrong suggestion, such as `rm -rf` in the wrong folder or `git push --force`, runs at once. Keep command approval on, and read each command before you allow it."

[[note]]
level = "beginner"
topic = "Security"
text = "Calling `eval()` on user input in Python or JavaScript lets that input run any code with your program's permissions. To turn text into data, use a parser such as `json.loads` or `JSON.parse`."

[[note]]
level = "beginner"
topic = "Databases"
text = "Leaving a web admin tool such as phpMyAdmin or Adminer reachable on a public server gives attackers a login page to your database, and old versions have had serious flaws. Keep it off the internet, or reach it through a VPN or SSH tunnel."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Changing a private repository to public publishes its entire history, including files that were committed and later deleted. Search the history for keys and passwords before you switch it."

[[note]]
level = "beginner"
topic = "Networking"
text = "When changing SSH server settings, such as turning off password logins, keep your current session open and test a new login from a second terminal. If logins broke, the open session is your way back in."

[[note]]
level = "beginner"
topic = "Python"
text = "`shutil.rmtree(path)` deletes a folder and everything inside it immediately, with no trash and no prompt. Print the path and check it before the call, especially when it is built from variables."

[[note]]
level = "beginner"
topic = "Testing"
text = "Make sure your tests can never connect to the production database: a test that empties tables during setup will wipe real data. Use a separate test database and have the setup refuse any other one."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "Check a package's exact name before installing it: attackers publish look-alikes with one letter changed, and register names that AI assistants tend to make up. Copy the name from the project's official docs."

[[note]]
level = "beginner"
topic = "Regex"
text = "With regex mode on in your editor's Find and Replace, `.` matches any character, so replacing `v1.0` also rewrites `v100` and `v1x0`. Check the match count and a few of the matches before you press Replace All."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Printing a token or password to debug a login problem leaves it in logs, terminal scrollback and screenshots. Print only its length or its last four characters to check that it is the right one."

[[note]]
level = "beginner"
topic = "GitHub"
text = "When you create a GitHub personal access token, give it an expiration date and only the access the job needs. A token with no expiry and broad scopes keeps working for whoever finds it, long after you forgot it existed."

[[note]]
level = "beginner"
topic = "Cloud"
text = "In Amazon S3, a deleted object is gone for good unless versioning was turned on for the bucket before the delete. Enable versioning on buckets that hold data you cannot recreate."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Setting `element.innerHTML` to text a user typed lets them inject HTML, including event handlers that run their JavaScript in your page. Use `element.textContent` when you only need to show text."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Saving a file in a legacy encoding such as Windows-1252 can replace every character that encoding lacks, such as emoji or Chinese text, with `?`, and the saved file no longer holds the originals. Keep text files in UTF-8."

[[note]]
level = "beginner"
topic = "SQL"
text = "Building SQL by pasting user input into a string lets an attacker rewrite the query and read or delete your data. Use placeholders instead, as in `cursor.execute(\"SELECT * FROM users WHERE id = ?\", (user_id,))`."

[[note]]
level = "beginner"
topic = "Containers"
text = "A secret added to an image with `COPY` or `ENV` stays readable in the image even if a later step deletes the file, and anyone who pulls the image can extract it. Pass secrets in at run time instead."

[[note]]
level = "beginner"
topic = "Code review"
text = "Don't approve a pull request that adds a binary, a minified script or an encoded blob you can't read: the diff can't show what it does. Ask for the source and the build step that produces it."

[[note]]
level = "beginner"
topic = "Git"
text = "Never rewrite commits that are already on a shared branch with `git commit --amend` or `git rebase`: everyone who pulled them ends up with conflicting history. Undo a shared commit with `git revert` instead."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`fs.writeFileSync(path, data)` silently replaces a file that already exists; pass `{ flag: 'wx' }` so the call fails instead of overwriting, or write under a new name and rename it once you have checked the result."

[[note]]
level = "beginner"
topic = "Web"
text = "Checks that run only in browser JavaScript can be skipped by anyone who sends requests to your server directly. Validate input and check permissions on the server as well."

[[note]]
level = "beginner"
topic = "Time"
text = "Opening a CSV in Excel and saving it can silently turn values such as `1-2`, `3/4` or `SEPT1` into dates, a problem common enough that human genes were renamed to avoid it. Import such columns as text, or edit CSV files in a text editor."

[[note]]
level = "beginner"
topic = "Releases"
text = "Renaming a published package creates a brand-new package: existing users stay on the old name and never see your updates unless you tell them, for example with a final release or a deprecation notice on the old name."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Reading a file with `errors=\"ignore\"` in Python silently drops the bytes it cannot decode, so writing the text back destroys them. Find the file's real encoding before you rewrite it."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Once a tag like `v1.0.0` is pushed, do not move it: Git does not update a tag that people already fetched, so the same name ends up meaning different code on different machines. Release a new version instead."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Example commands in a README should use placeholders such as `YOUR_API_KEY`, never your real token or internal hostnames: readers copy them, and search engines index them."

[[note]]
level = "beginner"
topic = "DNS"
text = "Don't delete DNS records just because you don't recognize them. Entries such as `_dmarc` or `s1._domainkey` and odd-looking verification values often keep your email delivered and connected services working; find out what each is for first."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Editor extensions run with your user's permissions and can read any of your files, including SSH keys. Install only well-known ones and remove those you no longer use, since an update can change what one does."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Copying a `node_modules` folder or a virtual environment to another computer often breaks it: compiled packages are built for one operating system and CPU, and virtual environments hold absolute paths. Reinstall from the dependency file."

[[note]]
level = "beginner"
topic = "Time"
text = "A local time stored without its UTC offset is ambiguous for good: on the night clocks go back, two different moments both read `01:30`. Store timestamps in UTC, or together with their offset."

[[note]]
level = "beginner"
topic = "Git"
text = "`git stash clear` deletes every stash at once without asking, and dropped stashes are hard to get back. Check `git stash list` and remove single entries with `git stash drop stash@{2}` instead."

[[note]]
level = "beginner"
topic = "Time"
text = "Copying files with plain `cp` stamps each copy with the current time, so the original modification dates are lost once you delete the originals. Use `cp -p` or `rsync -a`, which keep them."

[[note]]
level = "beginner"
topic = "Security"
text = "Before pasting an error log or config file into a forum, issue or chat, remove passwords, tokens and connection strings. Once posted, the text can be copied, cached and indexed."

[[note]]
level = "beginner"
topic = "Databases"
text = "Free tiers of hosted databases can pause, expire or delete inactive instances under their terms. Keep your own regular dump, such as from `pg_dump`, of anything you would miss, rather than trusting the provider's copy to stay."

[[note]]
level = "beginner"
topic = "Code review"
text = "Once a pull request is merged, its commits are on the target branch, and it can't be reopened or unmerged. Check that the latest commit passed its checks before you click Merge, and undo a mistake with the Revert button."

[[note]]
level = "beginner"
topic = "Python"
text = "`~/.pypirc` keeps your PyPI API token in plain text, so never copy it into a project folder that gets committed. Use a token scoped to a single project, and revoke it on PyPI the moment it leaks."

[[note]]
level = "beginner"
topic = "Python"
text = "Don't rerun a Python script with `sudo` to get past a `PermissionError`: it then runs with full control of the machine, so a bug or a wrong path can delete or change system files. Fix the ownership or permissions of the files it needs instead."

[[note]]
level = "beginner"
topic = "Containers"
text = "Files written inside a container's own filesystem are deleted along with the container. Keep anything you need, such as a database's data folder, in a volume or a bind mount."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "Store user passwords with a slow password hashing function such as bcrypt, scrypt or Argon2, never as plain text or a fast hash like MD5 or SHA-256, which is cracked quickly once the database leaks."

[[note]]
level = "beginner"
topic = "Web"
text = "Never paste code into your browser's developer console because a website, video or stranger told you to. It runs as you on that page and can take over your logged-in session."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Opening SSH or a database port to `0.0.0.0/0` in a firewall rule or security group lets the whole internet try to log in. Allow only your own IP address, and remove the rule when you are done."

[[note]]
level = "beginner"
topic = "Git"
text = "Deleting the folder and cloning again to escape a messy state also deletes unpushed commits, stashes, local branches and ignored files like `.env`. Try `git merge --abort` or `git rebase --abort` first, or copy the folder aside."

[[note]]
level = "beginner"
topic = "Shell"
text = "A stray space turns `rm *.log` into `rm * .log`, which deletes every file in the folder. Run `ls` with the same pattern first to see exactly what it matches."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Deleting `package-lock.json` to fix an install error throws away the exact versions your app was tested with, and the next install may pull newer, breaking ones. Bring it back with `git restore package-lock.json`."

[[note]]
level = "beginner"
topic = "Networking"
text = "If SSH warns that the remote host identification has changed, do not just delete the old key and reconnect. Find out why the server's key changed first, because an interception attempt looks exactly like this."

[[note]]
level = "beginner"
topic = "Linux"
text = "GNU `rm` refuses `rm -rf /` by default, but that guard does not cover `rm -rf /*`, which the shell expands into every top-level directory before `rm` runs. Stop and reread any delete that starts at `/`."

[[note]]
level = "beginner"
topic = "Data"
text = "Excel shows at most 1,048,576 rows, so opening a larger CSV loads only the first part, and saving the file writes back just those rows. Check the row count, with `wc -l` for example, before opening a big file in a spreadsheet."

[[note]]
level = "beginner"
topic = "Java"
text = "Don't generate passwords, session IDs or reset tokens with `java.util.Random` or `Math.random()`: their output can be predicted from earlier values. Use `java.security.SecureRandom` instead."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Turn on branch protection for `main` on GitHub, so a mistaken force push or branch deletion is rejected instead of rewriting the history your whole team relies on."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Don't debug by editing code directly on a live server: a typo takes the site down, and the fix never reaches Git, so the next deploy silently undoes it. Reproduce the bug locally, then deploy the fix."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Calling `process.exit()` right after starting async work, such as `fs.writeFile` or a database save, ends Node before that work finishes and loses the data; `await` the work and let the process exit on its own."

[[note]]
level = "beginner"
topic = "Git"
text = "Removing the `.git` folder erases the project's local history: every commit, branch and stash that was never pushed is gone, even though the current files stay. Push or back up the repository first."

[[note]]
level = "beginner"
topic = "Data"
text = "Opening a CSV file in a spreadsheet app and saving it can silently change the data: leading zeros disappear, long numbers turn into scientific notation and some text becomes dates. Work on a copy."

[[note]]
level = "beginner"
topic = "Incidents"
text = "After moving a site to a new server, keep the old one untouched for a week or two before deleting it. Anything you forgot to copy, like uploads, scheduled jobs or a database, is easy to recover from it and gone once it is deleted."

[[note]]
level = "beginner"
topic = "Security"
text = "Never share or copy your SSH private key, the `id_ed25519` file without `.pub`. Only the `.pub` file goes to servers and GitHub; anyone holding the private file can log in as you."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Values typed into `workflow_dispatch` inputs are not secrets: they are never masked, so any step that prints them, or a `run-name` built from them, shows them in plain text. Never pass passwords or tokens as inputs; store them as secrets."

[[note]]
level = "beginner"
topic = "SQL"
text = "`DROP TABLE` deletes a table and every row in it at once. In MySQL it also commits immediately, so even an open transaction cannot roll it back. Take a backup before dropping anything."

[[note]]
level = "beginner"
topic = "Observability"
text = "Writing log files inside your web server's public folder lets anyone who guesses the path download them, with every error, email address and token they contain. Keep logs outside the folder the server publishes."

[[note]]
level = "beginner"
topic = "Linux"
text = "`userdel -r` deletes the user's home directory and mail spool along with the account. Archive the home directory first if anything in it might still be needed."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Don't use your cloud account's root user for daily work, and never create access keys for it. Turn on multi-factor authentication for root and work as a separate user with limited permissions."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "In front-end frameworks, environment variables with a public prefix such as `VITE_` or `NEXT_PUBLIC_` are built into the JavaScript sent to every browser. Never give a secret one of those prefixes."

[[note]]
level = "beginner"
topic = "Shell"
text = "A command cannot safely read and write the same file: in `sort data.txt > data.txt`, the shell empties `data.txt` before `sort` reads it. Write to a new file, or use `sort -o data.txt data.txt`, which handles this."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Setting `NODE_TLS_REJECT_UNAUTHORIZED=0` to get past a certificate error turns off certificate checking for every HTTPS request the Node process makes; fix the chain, or trust your company's CA with `NODE_EXTRA_CA_CERTS`."

[[note]]
level = "beginner"
topic = "Git"
text = "`git rm file.txt` deletes the file from your disk as well as from Git. To stop tracking a file but keep your copy, such as a config file you meant to ignore, use `git rm --cached file.txt`."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "Container images from unknown publishers can hide malware such as cryptocurrency miners. Prefer official or verified images, and read the Dockerfile behind an image when one is published."

[[note]]
level = "beginner"
topic = "Python"
text = "Don't install packages into your operating system's Python with `sudo pip install` or `--break-system-packages`: you can break tools the system depends on. Create a virtual environment with `python3 -m venv .venv`."

[[note]]
level = "beginner"
topic = "DNS"
text = "If you delete a hosted site or cloud app but leave a DNS record pointing at it, someone else may claim that target and serve their content on your domain. Remove the DNS record when you remove the service."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "`pip freeze` writes lines like `mylib @ file:///home/ana/mylib` for packages installed from a local folder, and those lines fail on every other machine. Read the file before you commit it."

[[note]]
level = "beginner"
topic = "Tooling"
text = "A project-wide Replace All, a codemod or a linter's `--fix` can change hundreds of files at once. Start from a clean commit so `git diff` shows every change and `git restore .` can undo them."

[[note]]
level = "beginner"
topic = "Security"
text = "Protect your SSH private key with a passphrase; `ssh-keygen -p -f ~/.ssh/id_ed25519` adds one to an existing key. A copied key file is then much harder for someone else to use."

[[note]]
level = "beginner"
topic = "Data"
text = "A blind find-and-replace across a data file also changes matches inside other values: replacing `NA` with nothing turns `NATHAN` into `THAN`. Match whole cells or whole words, and keep the original file."

[[note]]
level = "beginner"
topic = "Java"
text = "Never build SQL by gluing strings together, as in `\"SELECT * FROM users WHERE name = '\" + name + \"'\"`: a name containing a quote rewrites the query. Use a `PreparedStatement` with `?` placeholders and `setString`."

[[note]]
level = "beginner"
topic = "Web"
text = "Hiding an admin page at a secret URL is not protection: URLs leak through browser history, logs and shared links. Require a login and check the user's permissions on the server."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Save your GitHub two-factor recovery codes somewhere safe that is not your phone. If you lose your authentication device without them, GitHub support may be unable to give the account back."

[[note]]
level = "beginner"
topic = "Linux"
text = "Read the package list before confirming `sudo apt remove` or `sudo apt autoremove`: removing one package can take others that depend on it, sometimes including your whole desktop environment."

[[note]]
level = "beginner"
topic = "Code review"
text = "Read changes to files under `.github/workflows` line by line before approving a pull request. Once merged, that code runs with your repository's token and secrets."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "Before upgrading your Python packages, save the working set with `pip freeze > requirements-before.txt`. If something breaks, `pip install -r requirements-before.txt` puts those versions back."

[[note]]
level = "beginner"
topic = "Git"
text = "`git stash` leaves untracked files behind by default, so a new file you thought was saved is still loose, and a later `git clean` deletes it. Use `git stash -u` to include untracked files."

[[note]]
level = "beginner"
topic = "Incidents"
text = "If you break or delete something shared, tell your team right away. Backups, reflogs and logs are easiest to use early, and a quiet fix attempt can overwrite what could still have been recovered."

[[note]]
level = "beginner"
topic = "Observability"
text = "Logging whole request bodies or user objects can write passwords and card numbers into log files that are kept and copied for months. Log only the fields you need and mask anything sensitive."

[[note]]
level = "beginner"
topic = "Teams"
text = "Don't copy your employer's or a client's code into a personal public repository or gist, even as a portfolio sample. The code usually belongs to them, may contain secrets, and can't be fully unpublished once it's out."

[[note]]
level = "beginner"
topic = "Shell"
text = "Unquoted variables split on spaces: with `file='old notes.txt'`, `rm $file` tries to delete `old` and `notes.txt`. Always write `rm \"$file\"`."

[[note]]
level = "beginner"
topic = "Security"
text = "Running `npm install`, `make` or the setup script of a project a stranger sent you, such as a take-home test, executes their code on your machine with your permissions. Do it in a throwaway virtual machine or container."

[[note]]
level = "beginner"
topic = "SQL"
text = "In MySQL, `UPDATE t SET a = 1 AND b = 2` does not set two columns: it sets `a` to the result of `1 AND b = 2`. Separate assignments with a comma, as in `SET a = 1, b = 2`."

[[note]]
level = "beginner"
topic = "GitHub"
text = "A secret gist is only unlisted, not private: anyone who has the link can read it. Never paste passwords, keys or private data into any gist."

[[note]]
level = "beginner"
topic = "Linux"
text = "Before `sudo reboot` or `sudo shutdown now`, run `hostname` to check which machine your terminal is on. In a forgotten SSH session, you restart the server instead of your laptop."

[[note]]
level = "beginner"
topic = "Python"
text = "`os.listdir(folder)` returns bare names, so calling `os.remove(name)` in a loop acts on files in the current directory, not in `folder`. Build each path with `os.path.join(folder, name)`."

[[note]]
level = "beginner"
topic = "Containers"
text = "Mounting `/var/run/docker.sock` into a container gives it full control of Docker on the host, which amounts to root access. Only do it for tools you trust completely."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "Data encrypted with a key or passphrase you lose is gone for good: there is no reset link. Keep encryption keys and passphrases in a password manager, and keep a backup of it."

[[note]]
level = "beginner"
topic = "Web"
text = "Saving user uploads inside your web server's public folder under their original names can let someone upload a script and run it on your server. Store uploads outside the web root and choose your own file names."

[[note]]
level = "beginner"
topic = "Cloud"
text = "On AWS, terminating an EC2 instance deletes its root volume by default, along with any files stored only there. Stop the instance instead, or snapshot the volume first, if you might need the data."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Avoid `sudo npm install -g`: it runs package install scripts as root. Use a Node version manager, or point npm's global prefix at a folder in your home directory, so global installs need no `sudo`."

[[note]]
level = "beginner"
topic = "Linux"
text = "Before editing a config file under `/etc`, copy it, for example with `sudo cp nginx.conf nginx.conf.bak`. If the new setting breaks something, copy the original back instead of rebuilding it from memory."

[[note]]
level = "beginner"
topic = "Web"
text = "Hidden form fields, `disabled` inputs and prices shown in the page can all be edited in DevTools before a form is sent; never trust them on the server, and look up prices and permissions there instead."

[[note]]
level = "beginner"
topic = "Teams"
text = "Ask before running scripts, migrations or deletes against a shared database or staging server. Teammates may depend on that data, and you may not know whether a backup exists until you need one."

[[note]]
level = "beginner"
topic = "Networking"
text = "On an Ubuntu server, run `sudo ufw allow OpenSSH` before `sudo ufw enable`, or the firewall can cut off the SSH connection you are using to configure it."

[[note]]
level = "beginner"
topic = "Data"
text = "`df.to_csv(\"results.csv\")` in pandas replaces an existing file with that name without asking. Put a date or run number in output file names so earlier results are not overwritten."

[[note]]
level = "beginner"
topic = "Debugging"
text = "A HAR file exported from your browser's network panel contains cookies and authorization headers that let someone log in as you. Remove them, or export a sanitized version, before sharing it."

[[note]]
level = "beginner"
topic = "GitHub"
text = "An SSH key added to your GitHub account can reach every repository you can. For a server that needs one repository, add a deploy key to that repository instead; it is read-only unless you allow writes."

[[note]]
level = "beginner"
topic = "Security"
text = "Dotfiles pushed to a public repository publish any tokens you exported in `.bashrc` or `.zshrc`. Keep secrets in a separate file that your shell sources but Git never tracks."

[[note]]
level = "beginner"
topic = "HTTP"
text = "A login form served over plain HTTP sends the password in readable form to anyone on the network path, such as others on a shared Wi-Fi. Serve every page over HTTPS."

[[note]]
level = "beginner"
topic = "Databases"
text = "Django's `manage.py flush` deletes all data from the tables of the configured database. Check which database your settings point to before running it, especially on a server."

[[note]]
level = "beginner"
topic = "Python"
text = "In Python, `input()` shows a password on screen as it is typed and leaves it in terminal scrollback. Use `getpass.getpass()`, which reads it without echoing."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "GitHub Actions hides a secret in logs only when it appears exactly as stored. The same secret base64-encoded, split up or printed with spaces between the characters shows up in plain text."

[[note]]
level = "beginner"
topic = "Data"
text = "Saving a workbook as CSV keeps only the current sheet and replaces every formula with its last value. Save the CSV as a separate file and keep the original workbook, or the other sheets and formulas are gone."

[[note]]
level = "beginner"
topic = "Linux"
text = "When a disk fills up, don't free space by deleting files under `/var` at random: package databases and logs there may be needed. Find what is large with `sudo du -sh /var/*` and remove only what you understand."

[[note]]
level = "beginner"
topic = "Incidents"
text = "If your site or server is hacked, deleting the files you notice is not enough: attackers usually leave other ways back in. Take it offline, restore from a backup made before the break-in and change every password and key it used."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Making a cloud storage bucket public lets anyone on the internet download its files, and often list them too. To share one file, create a signed URL that expires instead."

[[note]]
level = "beginner"
topic = "Git"
text = "Resolving a conflicted file with `git checkout --theirs` keeps the other side's entire version, dropping your changes elsewhere in that file too. During a rebase, `--ours` and `--theirs` also swap meaning."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "Every `uses:` line in a GitHub Actions workflow runs someone else's code with access to your repository token. Use actions from sources you trust, pinned to a full commit SHA rather than a tag that can be moved."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Anything in `localStorage` can be read by every script running on your page, including one injected through a bug. Don't keep passwords or long-lived tokens there."

[[note]]
level = "beginner"
topic = "Shell"
text = "GNU `sed -i` edits files in place without keeping a backup. Write `sed -i.bak 's/old/new/' file.txt` to keep the original as `file.txt.bak`; that form also works with the BSD `sed` on macOS."

[[note]]
level = "beginner"
topic = "APIs"
text = "Before calling an API's delete endpoint in a loop, run the loop once with the call replaced by a `print` of each ID. A wrong filter deletes real records, and most APIs have no undo."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Removing or renaming a public function in a patch or minor release breaks every project that picks up updates automatically. Under semantic versioning, that change needs a new major version."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Pasting code or JSON into an online formatter, converter or chat tool sends it to someone else's server. Strip secrets and private data first, or use a local tool such as `python3 -m json.tool`."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Releasing a static public IP address, such as an AWS Elastic IP, gives it back to the provider, which can hand it to another customer's server, and you usually cannot get it back. Keep the address until nothing sends traffic to it."

[[note]]
level = "beginner"
topic = "Security"
text = "Change the default password on anything you put online, such as an admin panel, database or router. Lists of default logins are public, and bots try them constantly."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Making a public repository private does not recall anything: existing clones, forks and cached copies stay out there. Treat anything that was ever public, especially a secret, as published."

[[note]]
level = "beginner"
topic = "Java"
text = "A JDBC connection commits every statement on its own by default, so if the third of three related updates fails, the first two stay in the database. Call `setAutoCommit(false)`, then `commit()` at the end and `rollback()` on error."

[[note]]
level = "beginner"
topic = "Go"
text = "`os.RemoveAll(filepath.Join(dir, name))` deletes all of `dir` when `name` is empty, because `Join` ignores empty parts. Check every variable part of a path before deleting anything built from it."

[[note]]
level = "beginner"
topic = "DNS"
text = "When you move a domain to a new DNS provider, copy every existing record first. Missing `MX` records stop email delivery, and messages sent in the meantime may bounce."

[[note]]
level = "beginner"
topic = "Git"
text = "`git add .` stages every new and changed file under the current folder, including files like `credentials.json` that `.gitignore` does not cover. Run `git status` and read the list before you commit."

[[note]]
level = "beginner"
topic = "Releases"
text = "Before uploading a release archive, list what is inside with `tar -tzf release.tar.gz` or `unzip -l release.zip`. A build step can sweep in `.env`, logs or other files Git ignores."

[[note]]
level = "beginner"
topic = "Linux"
text = "`pkill python` stops every process you own whose name matches, not just the one you meant. See which processes match with `pgrep -a python` first, or stop the right one by its PID."

[[note]]
level = "beginner"
topic = "Web"
text = "Listing a private path in `robots.txt` does not hide it: the file is public and points anyone who reads it straight to that path. Protect private pages with a login instead."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "Python's `random` module and JavaScript's `Math.random()` are predictable, so tokens made with them can be guessed. Use `secrets.token_urlsafe()` in Python or `crypto.getRandomValues()` in JavaScript for passwords, keys and reset links."

[[note]]
level = "beginner"
topic = "Unicode"
text = "If GitHub warns that a file contains hidden or bidirectional Unicode text, inspect it before merging. Such characters can make code display differently from how the compiler reads it."

[[note]]
level = "beginner"
topic = "Databases"
text = "Sequelize's `sequelize.sync({ force: true })` drops and recreates the table of every model, deleting all their rows; it is meant for throwaway development data. Use migrations for any database whose data you want to keep."

[[note]]
level = "beginner"
topic = "Teams"
text = "Give each teammate their own account and key instead of sharing one login. When someone leaves, you can remove just their access instead of changing everything everyone uses."

[[note]]
level = "beginner"
topic = "CI"
text = "On a public repository, CI logs are public too. A debug step that runs `env` or `printenv` can print tokens that are not registered as secrets, and anyone can read them."

[[note]]
level = "beginner"
topic = "Git"
text = "In `git rebase -i`, deleting a line from the todo list drops that commit from the branch. Mark commits you mean to remove with `drop` so the intent is visible, and use `git rebase --abort` if the plan goes wrong."

[[note]]
level = "beginner"
topic = "Web"
text = "Data kept only in `localStorage` disappears when a user clears browsing data, browses privately or switches devices, and Safari can delete it after a week without a visit; save anything users cannot afford to lose on a server."

[[note]]
level = "beginner"
topic = "Security"
text = "Never approve a sign-in prompt on your phone that you did not start: attackers who already have your password send repeated prompts, hoping you will tap Approve. Deny it and change the password."

[[note]]
level = "beginner"
topic = "SQL"
text = "Before running a destructive SQL script, check which database you are connected to, with `SELECT current_database();` in PostgreSQL or `SELECT DATABASE();` in MySQL. A test script run on production cannot be taken back."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Before deleting a codespace, commit and push your branch: deleting it removes any changes that exist only inside it. Unused codespaces are also deleted automatically after a retention period."

[[note]]
level = "beginner"
topic = "Linux"
text = "Don't stay in a root shell, opened with `sudo -i` or `sudo su`, for routine work: every typo there runs with full power over the system. Use `sudo` for the single command that needs it."

[[note]]
level = "beginner"
topic = "Python"
text = "PyYAML's `yaml.load` with `Loader=yaml.Loader`, or `yaml.unsafe_load`, can build arbitrary Python objects from the file, which lets crafted YAML run code. For YAML you did not write, use `yaml.safe_load`."

[[note]]
level = "beginner"
topic = "Containers"
text = "`docker rm -f $(docker ps -aq)` force-removes every container on the machine, not just your project's, along with any data they kept outside volumes. Remove containers by name instead."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Deleting an Azure resource group deletes every resource inside it, including databases and storage accounts. Read the resource list before you type the group's name to confirm."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "A delete button that acts instantly, with no confirmation or undo, is easy to trigger by accident with a keyboard, voice control or an unsteady hand; ask for confirmation, or offer undo, for anything that destroys data."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "`curl ... | bash` runs a script from the internet before you can read it, with your permissions. Download it to a file, read it, and run it only if you trust both the script and the site serving it."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Deploying by overwriting the files on your server in place leaves no previous version to go back to when the new one breaks. Keep each release in its own directory or image and switch between them, so going back takes one step."

[[note]]
level = "beginner"
topic = "Git"
text = "Putting a token inside a Git remote URL stores it in plain text in `.git/config`, and `git remote -v` prints it for anyone looking at your screen. Let a credential helper or an SSH key handle authentication instead."

[[note]]
level = "beginner"
topic = "Data"
text = "Sorting one column in a spreadsheet without selecting the rest of the table reorders that column alone and scrambles which values belong to which row. Select the whole table before sorting."

[[note]]
level = "beginner"
topic = "Cloud"
text = "AWS shows the private key of a new key pair only once, when you create it, and keeps no copy. Save the `.pem` file somewhere safe right away; if you lose it, that key can no longer get you into the servers that use it."

[[note]]
level = "beginner"
topic = "Shell"
text = "Never paste a command you cannot read. A line like `:(){ :|:& };:` is a fork bomb: it keeps starting copies of itself until the machine stops responding."

[[note]]
level = "beginner"
topic = "SQL"
text = "`DELETE FROM users WHERE name = 'Sam'` removes every user named Sam, not just the one you meant. Look up the row's primary key with a `SELECT`, then delete by that key, as in `WHERE id = 42`."

[[note]]
level = "beginner"
topic = "Python"
text = "Python does not expand `~`, so `os.makedirs(\"~/data\")` creates a folder literally named `~` in the current directory. Remove it with `rm -r ./~`, never `rm -r ~`, which targets your home folder."

[[note]]
level = "beginner"
topic = "Linux"
text = "Many Linux systems empty `/tmp` at boot or clean it on a schedule, so files kept there can vanish. Keep work you care about in your home folder or a project directory."

[[note]]
level = "beginner"
topic = "Security"
text = "If a laptop holding your SSH keys or access tokens is lost or stolen, remove those keys from GitHub and revoke the tokens right away; each one keeps working until you do."

[[note]]
level = "beginner"
topic = "Unicode"
text = "A Cyrillic `а` looks identical to a Latin `a`, so a link can show a domain that looks right and still lead to a copy of the site. Let your password manager fill logins; it will not fill them on a look-alike domain."

[[note]]
level = "beginner"
topic = "Testing"
text = "Try a script that renames, moves or deletes files on a copy of the folder first. A bug in a loop over real files can damage hundreds of them before you notice, with no undo."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Renaming your GitHub account frees the old username for anyone to claim. If someone takes it and creates a repository with a matching name, links to your old repository lead to theirs."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "Don't invent your own encryption, such as XOR with a secret word or a clever character shuffle: homemade schemes are easy to break. Use a well-reviewed library and its high-level functions."

[[note]]
level = "beginner"
topic = "Linux"
text = "Deleting the lock files under `/var/lib/dpkg` because `apt` reports another process holds them can corrupt the package database if that process is still running. Wait for it to finish, or find it with `ps aux | grep apt`."

[[note]]
level = "beginner"
topic = "Teams"
text = "Pasting company code, logs or customer data into an online formatter, paste site or chatbot hands it to a third party you don't control. Check your team's rules first, and strip secrets and personal data from anything you share."

[[note]]
level = "beginner"
topic = "Shell"
text = "A file whose name starts with `-`, such as `-rf`, is read as an option when `*` expands, so `rm *` can turn into a recursive, forced delete. Write `rm ./*` or `rm -- *` instead."

[[note]]
level = "beginner"
topic = "APIs"
text = "When your API returns a user, choose the fields to send. Serializing the whole database row can leak password hashes, email addresses or internal flags to anyone who calls it."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Sharing a disk snapshot or machine image publicly shares every file on it, including SSH keys, `.env` files and shell history. Share images only with the specific accounts that need them."

[[note]]
level = "beginner"
topic = "Rust"
text = "Publishing to crates.io is permanent: a version can be yanked but never deleted or replaced, and its code stays downloadable. Check the file list with `cargo package --list` and try `cargo publish --dry-run` first."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "A session timeout that throws away a half-filled form punishes people who need more time, such as screen reader users or anyone with a motor disability; warn before it expires, let users extend it, and keep what they typed."

[[note]]
level = "beginner"
topic = "Testing"
text = "Use addresses at `example.com` or another domain reserved for testing in test data and seed scripts. A made-up address like `test@gmail.com` may belong to a real person, who then receives your test emails."

[[note]]
level = "beginner"
topic = "Go"
text = "Create files that hold secrets with mode `0o600`, as in `os.WriteFile(path, key, 0o600)`. The `0o644` common in examples lets every user on the machine read them, and the mode is applied only when the file is created."

[[note]]
level = "beginner"
topic = "SQL"
text = "In a subquery, a column the inner table lacks silently refers to the outer one: if `users` has no `user_id`, `DELETE FROM orders WHERE user_id IN (SELECT user_id FROM users)` can delete every row. Qualify columns, as in `users.id`."

[[note]]
level = "beginner"
topic = "Containers"
text = "Running a container with `--privileged` gives it access to all of the host's devices and removes most of its isolation. Don't add it just to make a permission error go away."

[[note]]
level = "beginner"
topic = "Documentation"
text = "When documenting a destructive command, say plainly what it deletes and show the dry-run form first. Readers copy and paste commands without reading the text around them."

[[note]]
level = "beginner"
topic = "Security"
text = "`git config credential.helper store` saves your username and token unencrypted in `~/.git-credentials`. Prefer your system's keychain helper, such as `osxkeychain` on macOS or Git Credential Manager on Windows."

[[note]]
level = "beginner"
topic = "Rust"
text = "Don't delete `Cargo.lock` to get past a build error: the next build resolves every dependency to its newest compatible version, pulling in many untested upgrades at once. Update just the crate you need with `cargo update -p name`."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Don't report a security hole in a public issue: the details are public the moment you submit. Use the project's private vulnerability reporting, or the contact listed in its `SECURITY.md`."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Assigning a user-supplied URL to `location.href` or to a link's `href` can run a `javascript:` URL in your page. Check `new URL(value).protocol` and allow only `https:` and `http:`."

[[note]]
level = "beginner"
topic = "Networking"
text = "Forwarding a port on your home router to your computer puts that service on the public internet, where it is scanned constantly. Close the forward when you are done, and never expose databases or remote desktop this way."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Turn on deletion protection for a cloud database you care about. While it is on, a delete request fails until someone deliberately switches the setting off first."

[[note]]
level = "beginner"
topic = "Time"
text = "A cleanup job that deletes records older than a cutoff will delete almost everything if the cutoff is off by a unit, such as milliseconds read as seconds. Print the cutoff date and the number of matching rows before enabling it."

[[note]]
level = "beginner"
topic = "Shell"
text = "With GNU `rm`, `rm -rf mylink/` with a trailing slash follows a symlink and empties the directory it points to, while `rm mylink` removes only the link. Leave the slash off when deleting a symlink."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Pointing a load-testing tool such as `ab` or `wrk` at a site you do not own can take it down and counts as an attack; test only servers you run, ideally a staging copy of your own site."

[[note]]
level = "beginner"
topic = "Data"
text = "Don't commit real customer or user data to a repository, even a private one; use made-up sample data. Deleting the file later leaves it in the Git history."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "An `.npmrc` with an `_authToken` line committed to a repository publishes your registry token. Keep the token in the `.npmrc` in your home folder, or reference an environment variable with `${NPM_TOKEN}`."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Don't attach a self-hosted runner to a public repository: a pull request from a stranger can run workflow code on your machine. Use GitHub-hosted runners for public projects."

[[note]]
level = "beginner"
topic = "Performance"
text = "Only load-test systems you own or have written permission to test. A flood of requests to someone else's site looks exactly like an attack, and it can get your IP address or account blocked."

[[note]]
level = "beginner"
topic = "C"
text = "Never use `gets()` in C: it cannot know the buffer's size, so long input overwrites memory, and C11 removed it. Use `fgets(buf, sizeof buf, stdin)`, and give `scanf` a width such as `%99s`."

[[note]]
level = "beginner"
topic = "Git"
text = "A large file committed once, such as a video, a dataset or `node_modules`, stays in the repository's history after you delete it, and every future clone downloads it. Add such files to `.gitignore` before your first `git add .`."

[[note]]
level = "beginner"
topic = "Git"
text = "`git push origin :feature`, with a leading colon, deletes the remote branch `feature`, the same as `git push origin --delete feature`. Read push commands twice, and make sure a branch is merged before removing it."

[[note]]
level = "beginner"
topic = "Shell"
text = "A password typed into a command, as in `curl -u me:secret`, is saved in your shell history and visible in the process list while it runs. Leave it out, as in `curl -u me`, and curl prompts for it."

[[note]]
level = "beginner"
topic = "Rust"
text = "`cargo fix` and `cargo clippy --fix` rewrite your source files in place, and they refuse to run on uncommitted changes. Commit first rather than passing `--allow-dirty`, so you can review or undo the edits."

[[note]]
level = "beginner"
topic = "Shell"
text = "Piping `yes` into a command, or adding `-y` or `--force`, answers every prompt at once, including the one that would have stopped a mistake. Run a destructive command without them the first time and read what it asks."

[[note]]
level = "beginner"
topic = "Shell"
text = "Recalling a command with the up arrow or `Ctrl+R` and pressing Enter at once can rerun an old `rm` or `git reset --hard` in the wrong folder. Read the recalled line before you run it."

[[note]]
level = "beginner"
topic = "Shell"
text = "An alias such as `alias rm='rm -i'` protects only your interactive shell: scripts, `sudo rm` and other machines use plain `rm`. Don't let the alias make you careless with deletes."

[[note]]
level = "beginner"
topic = "Linux"
text = "`apt purge` deletes a package's system-wide configuration files along with the program. Use `apt remove` if you may reinstall it and want to keep the settings you changed."

[[note]]
level = "beginner"
topic = "Linux"
text = "Cron runs jobs from your home folder with a minimal `PATH`, so a script that deletes with a relative path like `rm -rf tmp/*` may hit the wrong place. Use absolute paths, and start the script with `cd /path/to/job || exit 1`."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Exposing a local dev server through a tunneling tool publishes it to the whole internet, including debug pages and admin routes with no login; share it only briefly, and never with debug mode on."

[[note]]
level = "beginner"
topic = "C"
text = "`fopen(path, \"w\")` wipes an existing file the moment it opens it. When you must not overwrite, open with `\"wx\"` (C11), which fails if the file already exists."

[[note]]
level = "beginner"
topic = "Security"
text = "Close `.env` files, password managers and terminals that show tokens before screen sharing, streaming or recording a demo. One visible frame is enough for someone to copy a key."

[[note]]
level = "beginner"
topic = "Security"
text = "Don't write `echo mypassword | sudo -S` in a script: anyone who can read the file, or a copy of it, gets your password. Run the whole script with `sudo` instead, or let `sudo` prompt when it needs the password."

[[note]]
level = "beginner"
topic = "APIs"
text = "A bug that calls a paid API in a loop, such as a retry with no limit, can run up a large bill before you notice; set a spending cap or budget alert with the provider, and limit retries in your code."

[[note]]
level = "beginner"
topic = "Python"
text = "Extracting an untrusted tar archive with Python's `tarfile` can write files outside the target folder through entries with `..` or absolute paths. Pass `filter=\"data\"` to `extractall()`, which rejects such entries."

[[note]]
level = "beginner"
topic = "Python"
text = "On Linux and macOS, `os.rename(src, dst)` silently replaces an existing file at `dst`; on Windows it raises `FileExistsError` instead. Check whether `dst` exists first when that file matters."

[[note]]
level = "beginner"
topic = "C"
text = "Data written with `fprintf` or `fwrite` waits in a buffer until `fflush`, `fclose` or a normal exit, so a crash loses it. Call `fflush` after records that must not be lost, and `fclose` every file you write."

[[note]]
level = "beginner"
topic = "GitHub"
text = "The email in your `user.email` setting is published in every commit you push, and changing it later does not change old commits. Use the noreply address GitHub provides if you want to keep your email private."

[[note]]
level = "beginner"
topic = "GitHub"
text = "An authorized third-party app keeps acting on your GitHub account within the scopes you granted until you revoke it. Review the authorized apps in your settings and remove the ones you no longer use."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Anything in the branch or folder that GitHub Pages publishes is served on the web, including drafts, backups and `.env` files you forgot were there. Keep private files out of that folder entirely."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Never publish a fix that switches off a safety check, such as `chmod -R 777`, `curl -k` or `git config http.sslVerify false`, as the answer in a README. Readers copy it and leave it on for good; document the real fix instead."

[[note]]
level = "beginner"
topic = "GitHub"
text = "If GitHub blocks a push because it found a secret, don't bypass the block: remove the secret from your unpushed commits, and rotate it if it was ever pushed or shared anywhere else."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Keep personal details such as your phone number, home address or date of birth out of READMEs, profiles and commits. Public repositories are scraped and archived, and deleting the text later leaves those copies in place."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Deleting your GitHub account permanently removes the repositories and gists it owns. Transfer the ones others rely on, and back up the rest, before you delete it."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "When the same file is open in two editors, or in an editor while a script rewrites it, whichever saves last silently overwrites the other's changes. Close one before editing, or reload the file when your editor warns it changed on disk."

[[note]]
level = "beginner"
topic = "SQL"
text = "SQL dumps and tutorial setup scripts often start each table with `DROP TABLE IF EXISTS`, which deletes your existing table of that name. Read the whole script before running it against a database that holds data."

[[note]]
level = "beginner"
topic = "SQL"
text = "Before a bulk `UPDATE` you are unsure of, copy the table with `CREATE TABLE users_backup AS SELECT * FROM users;` so you can compare the results or restore the old values."

[[note]]
level = "beginner"
topic = "SQL"
text = "In many SQL editors, pressing Run with nothing selected executes the whole file, including a `DELETE` or `DROP` further down. Select the statement you mean to run, or keep destructive statements in a separate file."

[[note]]
level = "beginner"
topic = "Databases"
text = "A backup you have never restored may not work. Before deleting or migrating data, restore your latest backup into a scratch database once to confirm you can actually get the data back."

[[note]]
level = "beginner"
topic = "APIs"
text = "Regenerating an API key usually disables the old one at once, breaking every script and server still using it; find each place that uses the key first, or create a second key before retiring the old one if the service allows."

[[note]]
level = "beginner"
topic = "Containers"
text = "`docker login` saves your registry password in `~/.docker/config.json`, merely base64-encoded, unless a credential helper is configured. Set up a credential helper, or log in with an access token you can revoke."

[[note]]
level = "beginner"
topic = "Networking"
text = "Sharing your local server through a tunnel service gives anyone with the link access to it, including admin pages that have no login. Stop the tunnel as soon as you no longer need it."

[[note]]
level = "beginner"
topic = "DNS"
text = "A wrong DNS record cannot be recalled: resolvers may keep serving it until its TTL runs out. Lower the TTL well before a planned change, and double-check the new value before saving it."

[[note]]
level = "beginner"
topic = "APIs"
text = "An HTTP `PUT` replaces the whole resource, so a `PUT` carrying only the fields you meant to change can erase the others. Use `PATCH` if the API supports it, or send the complete object."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "A type assertion like `data as User` checks nothing at runtime; TypeScript simply trusts you. Validate JSON from outside your program before using it for permission checks or database writes."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "A dependency on a Git branch, as in `github:user/lib#main`, can change under you: every fresh resolve picks up whatever the branch holds that day, and a force push can rewrite it. Pin a tag or a commit hash."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Commit or stash before trying fixes at random: a debugging session that edits ten files can leave you unable to find your way back to the last version that worked."

[[note]]
level = "beginner"
topic = "CI"
text = "Re-running an old deploy job in CI deploys that job's original commit, which can overwrite newer code in production. Start a fresh deploy from the current branch instead."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "A deploy workflow triggered by `on: push` with no branch filter deploys every branch anyone pushes. Limit it with `branches: [main]` under `push`."

[[note]]
level = "beginner"
topic = "CI"
text = "Running a project's deploy script from your laptop to see what it does can deploy to production for real, with whatever credentials your machine has. Read the script first, and point it at a staging target."

[[note]]
level = "beginner"
topic = "Data"
text = "Removing names from a dataset does not make it anonymous: combinations such as ZIP code, birth date and gender can identify people. Published data cannot be recalled, so check what could identify someone before sharing it."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Keeping a Git repository in a folder synced by Dropbox, OneDrive or iCloud can corrupt it when the sync tool copies half-written files or creates conflicting copies. Sync code between machines by pushing to a remote instead."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Editor settings folders such as `.vscode` and `.idea` can hold tokens, database passwords and local paths in their run configurations. Check them before committing, or add them to `.gitignore`."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Don't fix a migration or schema error by dropping and recreating the database unless it holds nothing you need: the error goes away because all the data does. Back it up first, or fix the migration itself."

[[note]]
level = "beginner"
topic = "C"
text = "Never pass user text as the format string, as in `printf(name)`: a `%s` or `%n` inside it makes `printf` read or write memory it should not. Write `printf(\"%s\", name)` instead."

[[note]]
level = "beginner"
topic = "C"
text = "After `free(p)`, set `p = NULL`. Freeing the same pointer twice, or using it after `free`, corrupts memory in ways that may crash much later or open a security hole."

[[note]]
level = "beginner"
topic = "Teams"
text = "Don't send passwords or keys through team chat or email: messages are stored, searched and synced to every device. Share them through a password manager or a secrets tool built for it."

[[note]]
level = "beginner"
topic = "Infrastructure as code"
text = "`terraform apply` deletes resources whenever its plan says so, not only `terraform destroy`. Read the summary line, such as `Plan: 0 to add, 0 to change, 3 to destroy.`, before you type `yes`."

[[note]]
level = "beginner"
topic = "Security"
text = "When a site tells you your password leaked, change it on every other site where you reused it, starting with your email account, which can reset all the others."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "A cron job that runs every minute but sometimes takes longer lets two copies run at once and overwrite each other's output. Run it as `flock -n /tmp/job.lock ./job.sh` so a second copy exits instead of starting."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git push --force` can erase a teammate's commits. Use `git push --force-with-lease`, which refuses when the remote has moved since you last fetched."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git reset --hard` throws away uncommitted changes to tracked files, and the reflog cannot bring them back because they were never committed. Run `git stash` first if there is any chance you still want them."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git clean -fdx` deletes untracked files and directories, ignored ones included, such as `.env` files and local config. Preview with `git clean -ndx`, or choose what to delete with `git clean -i`."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git gc --prune=now` deletes unreachable objects immediately, and Git's docs warn it can corrupt the repository if another Git process is writing to it at the same time. Keep the default two-week grace period unless you are purging on purpose."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git branch -D` deletes a branch even when its commits exist nowhere else. Prefer `-d`, which refuses unmerged branches; after a mistaken `-D`, recreate the branch from the hash Git printed, with `git branch <name> <sha>`."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git push --mirror` makes the remote match your local refs exactly: it force-updates remote branches and deletes every branch and tag you do not have locally. Push the specific branches or tags you mean instead."

[[note]]
level = "intermediate"
topic = "Git"
text = "A leading `+` in a push refspec, as in `git push origin +main`, forces that update exactly like `--force`, overwriting whatever the remote branch held. Read refspecs in scripts and aliases carefully before running them."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Deleting an issue on GitHub is permanent: its whole discussion goes with it, and there is no trash to restore it from. Close the issue or lock the conversation instead, unless the content itself must go."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git reflog expire --expire=now --all` followed by `git gc --prune=now` destroys the safety net that lets you recover lost commits. Run that pair only when you mean to purge data for good, such as after removing a leaked file."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git worktree remove --force` deletes a worktree even when it has uncommitted or untracked changes. Run it without `--force` first: Git then refuses to remove a dirty worktree, giving you a chance to save that work."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git rebase -i` rewrites commits, and a wrong squash or deleted line can drop work. Create a backup first with `git branch pre-rebase`, so `git reset --hard pre-rebase` restores the original branch if the result looks wrong."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Making a public GitHub repository private permanently erases its stars and watchers, and making it public again doesn't bring them back. To retire a project, archive it instead."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "On a repository owned by a personal GitHub account, every collaborator gets write access; there are no finer roles. Move the repository to an organization when someone should only read or triage."

[[note]]
level = "intermediate"
topic = "Git"
text = "After you `git rm --cached` a tracked config file and push, every teammate who pulls that commit has the file deleted from their working tree. Warn them to back it up, or commit a template such as `config.example` instead."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git reset --hard origin/main` removes any local commits you have not pushed from your branch. Create a branch at your current commit first, with `git branch keep-local`, so nothing depends on digging through the reflog."

[[note]]
level = "intermediate"
topic = "Code review"
text = "The Merge without waiting for requirements option that admins see skips every review and check the branch rule demands. Use it only for real emergencies, and explain why in the pull request so the bypass is visible afterward."

[[note]]
level = "intermediate"
topic = "Git"
text = "During a merge, `git checkout --theirs <file>` replaces the whole file with the other branch's version, discarding your side's changes even in hunks that merged cleanly. Resolve conflicts hunk by hunk unless you truly want to drop your side."

[[note]]
level = "intermediate"
topic = "Git"
text = "A large binary that is committed and pushed stays in every future clone, even after a later commit deletes it; only a history rewrite removes it. Check `git diff --cached --stat` before committing, and keep large assets out of the repository."

[[note]]
level = "intermediate"
topic = "Code review"
text = "A one-character change in an access rule, such as `users/*` becoming `*`, can grant access to everything. When a pull request edits permissions, check what each changed pattern actually matches, not just how small the diff is."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "Moving a published tag with `git tag -f` and a force push does not fix clones that already have it, because `git fetch` will not overwrite an existing tag without `--force`. Publish a new tag, such as `v1.2.1`, instead."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Don't resolve review threads someone else opened before they agree: resolving hides the concern from everyone scanning the pull request, and where resolution is required it also unblocks the merge. Let reviewers resolve their own blocking comments."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Don't paste customer data, such as emails, addresses or payment details, into team chat or tickets while debugging. Those tools are widely readable, keep messages for years and rarely get the protections your production systems have."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Never push, deploy or approve from a teammate's logged-in machine or account, even to save time. The audit trail then names the wrong person, and their access, not yours, carries whatever goes wrong."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Editing a GitHub comment to remove a pasted secret does not erase it: the edit history keeps the old text, and notification emails may already have gone out. Rotate the secret, then delete that revision from the edit history."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Approving an access review without checking each entry turns a control into a formality, and unused admin rights survive every round. Remove any access its holder can't justify, and let them ask again if they need it."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Preview deployments of docs branches often sit at public addresses, so an unannounced feature or an internal page can leak before release. Put previews behind authentication, or keep confidential pages out of them."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "A GitHub Pages site is public on the internet by default, even when its repository is private. Never publish from a branch or folder that also holds internal documents or data."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "A deploy key with write access lets anyone holding it push to the repository, including over unprotected branches. Keep deploy keys read-only unless the job truly needs to push, and remove keys for retired servers."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "When docs move to a new domain, keep the old one registered and redirecting for years. If it lapses, anyone can buy it and serve their own pages, or malware, at the addresses in every old link and tutorial."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`rm -rf \"$dir\"/*` with an empty or unset `$dir` expands to `rm -rf /*`. Write `\"${dir:?}\"/*` so the shell aborts with an error when the variable is unset or empty."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`usermod -G docker alice` replaces all of Alice's supplementary groups with `docker`, silently removing her from groups such as `sudo` or `wheel`. Add groups with `usermod -aG`, and check the result with `id alice`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "In Bash, `set -o noclobber` makes `>` refuse to overwrite an existing file, so a mistyped redirect cannot wipe data. Write `>|` when you really mean to overwrite."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`find . -delete -name '*.log'` deletes everything below `.`, because `find` evaluates its expression from left to right. Run the command with `-print` in place of `-delete` first, then swap it in as the last action."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`find ... | xargs rm` splits file names on spaces and newlines, so `old notes.txt` becomes two arguments that can match other files. Use `find ... -print0 | xargs -0 rm`, or let `find` remove them with `-delete`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`mv` and `cp` replace an existing destination file without asking. Add `-i` to be prompted, or `-n` to never overwrite, when moving files into a directory that may already contain the same names."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Rebooting, losing the SSH session or pressing `Ctrl+C` during `apt upgrade` can leave packages half-configured. Run long upgrades inside `tmux`, and if one is interrupted, finish it with `sudo dpkg --configure -a` before installing anything else."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Passwords typed as command arguments land in your shell history and are visible to other users through `ps`. Read secrets from a file or an environment variable, or prompt with Bash's `read -rs` so nothing is echoed or saved."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Unquoted `$file` in `rm $file` is split on spaces and expanded as a glob, so a name like `a *.txt` can delete every `.txt` file. Quote every expansion: `rm -- \"$file\"`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Exporting API keys in `~/.bashrc` hands them to every program you start, including tools that log their environment or upload crash reports. Load a secret only for the command that needs it, as in `API_KEY=$(cat ~/.secrets/api) ./deploy.sh`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`eval` on a string built from user input runs any command hidden inside it. Keep commands in Bash arrays and run them as `\"${cmd[@]}\"`, passing each input as its own quoted argument."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "A `clean` target such as `rm -rf $(BUILD_DIR)/*` deletes from `/` when `BUILD_DIR` is unset or misspelled, because make expands undefined variables to nothing. Fail early with `$(if $(BUILD_DIR),,$(error BUILD_DIR is empty))`, or use a fixed relative path."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`source .env` runs the file as shell code, so any command hidden in a shared or downloaded `.env`, such as `$(...)` inside a value, executes in your shell. Parse such files with a dotenv library instead of sourcing them."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Fixed temporary paths like `/tmp/out.txt` can collide with another run of the same script or with a file another user created there. Create temporary files with `mktemp`, which picks an unused, unpredictable name."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`chmod -R 777` makes every file writable and executable by every user on the machine, turning a permissions error into a security hole. Fix ownership with `chown`, or grant access to a shared group instead."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`dd` overwrites its `of=` target without asking, so one wrong device name destroys a disk. Confirm the device with `lsblk` right before running it, and check that `if=` and `of=` are not swapped."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`kill -9` stops a process without letting it flush buffers, finish writing files or remove its lock and temporary files. Send a plain `kill` (`SIGTERM`) first, and escalate to `SIGKILL` only if it does not exit."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`crontab -r` deletes your entire crontab without asking, and `r` sits right next to `e` on the keyboard. Keep a backup with `crontab -l > crontab.bak` before editing."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Editing `/etc/sudoers` directly can save a syntax error that locks everyone out of `sudo`. Always use `visudo`, which checks the syntax before saving, and edit files in `/etc/sudoers.d/` with `visudo -f`."

[[note]]
level = "intermediate"
topic = "Linux"
text = "A bad line in `/etc/fstab` can stop a machine from booting cleanly. After editing it, run `findmnt --verify` and `mount -a` to catch mistakes while you can still fix them."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Restarting `sshd` with a broken config can lock you out of a remote server. Validate it with `sshd -t`, keep your current session open, and confirm that a new login works before disconnecting."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`rm -rf` descends into anything mounted below the target, such as a bind mount inside a chroot, and deletes the files there too. Unmount first, or add GNU `rm`'s `--one-file-system` to skip other file systems."

[[note]]
level = "intermediate"
topic = "SQL"
text = "A `DELETE` or `UPDATE` without a `WHERE` clause changes every row in the table. Run the condition as a `SELECT` first, and start the `mysql` client with `--safe-updates` so statements with neither a key condition nor a `LIMIT` are rejected."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Building SQL with string formatting, as in `f\"SELECT * FROM users WHERE name = '{name}'\"`, lets crafted input rewrite the query and read or delete any table. Use your driver's placeholders (`?`, `%s` or `$1`) so values are never parsed as SQL."

[[note]]
level = "intermediate"
topic = "SQL"
text = "`UPDATE products SET price = (SELECT n.price FROM new_prices n WHERE n.id = products.id)` sets `price` to `NULL` in every row without a match in `new_prices`. Add `WHERE EXISTS` with the same condition, or update through a join."

[[note]]
level = "intermediate"
topic = "SQL"
text = "In PostgreSQL, `UPDATE t SET ... FROM other` without a condition linking the two tables updates every row of `t` with values from an arbitrary row of `other`. Write the join as a `SELECT` first and check which rows and values it produces."

[[note]]
level = "intermediate"
topic = "SQL"
text = "`ALTER TABLE ... DROP COLUMN` deletes that column's data in every row, and no later migration can bring it back. Stop reading the column in code first, back up its values, and drop it in a later release."

[[note]]
level = "intermediate"
topic = "SQL"
text = "In `psql` and the `mysql` client, autocommit is on, so each statement you type is permanent as soon as it succeeds. Type `BEGIN;` before manual changes, check the results, then finish with `COMMIT;` or `ROLLBACK;`."

[[note]]
level = "intermediate"
topic = "SQL"
text = "A foreign key declared `ON DELETE CASCADE` turns one `DELETE` of a customer into the deletion of every order and invoice that references it, and of their children in turn. Trace the cascade chain before deleting parent rows."

[[note]]
level = "intermediate"
topic = "SQL"
text = "In PostgreSQL, `DROP TABLE ... CASCADE` also drops every view that depends on the table and the foreign key constraints that point at it. Run the command without `CASCADE` first: the error names the dependent objects."

[[note]]
level = "intermediate"
topic = "SQL"
text = "MySQL's `REPLACE INTO` deletes the conflicting row and inserts a new one, so columns you leave out reset to their defaults and `ON DELETE CASCADE` children are deleted. Use `INSERT ... ON DUPLICATE KEY UPDATE` to change only the columns you name."

[[note]]
level = "intermediate"
topic = "SQL"
text = "In `DELETE FROM orders WHERE id IN (SELECT id FROM refunds)`, if `refunds` has no `id` column, SQL quietly uses `orders.id` and the condition matches every row whenever `refunds` is not empty. Qualify subquery columns, as in `refunds.order_id`, so a typo fails loudly."

[[note]]
level = "intermediate"
topic = "SQL"
text = "MySQL's multi-table `DELETE t1, t2 FROM t1 JOIN t2 ...` removes matching rows from every table listed before `FROM`. Name only the table you mean to delete from, as in `DELETE t1 FROM t1 JOIN t2 ...`."

[[note]]
level = "intermediate"
topic = "SQL"
text = "In MySQL, `DELETE FROM logs WHERE level = 'debug' LIMIT 1000` without `ORDER BY` removes whichever matching rows the server finds first, not necessarily the oldest. Add `ORDER BY id` when it matters which rows go."

[[note]]
level = "intermediate"
topic = "Databases"
text = "`pg_restore --clean` drops each object in the dump before recreating it, so aimed at the wrong database it replaces that database's tables. Check the `-d` target and host right before running it, and back up the target first."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Redis `FLUSHALL` deletes every key in every database on the server, and `FLUSHDB` every key in the current one, with no confirmation. Check which host `redis-cli` is connected to, and deny both commands to application users with ACL rules."

[[note]]
level = "intermediate"
topic = "Databases"
text = "A database listening on a public address with a default or empty password is found by automated scanners and can be wiped or held for ransom. Bind it to a private network or `127.0.0.1`, and require a strong password even there."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Copying a SQLite database with `cp` while the app is writing can produce a corrupt copy, and recent commits may still sit in the `-wal` file. Use the `sqlite3` shell's `.backup` command or `VACUUM INTO` instead."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Dropping a unique index or constraint, even briefly for a bulk load, lets duplicate rows in, and recreating it then fails until someone cleans them up by hand. Deduplicate the incoming data instead and keep the constraint in place."

[[note]]
level = "intermediate"
topic = "Databases"
text = "`SET FOREIGN_KEY_CHECKS = 0` in MySQL lets in rows that reference missing parents, and setting it back to 1 does not check the rows already loaded. Orphans stay until you hunt them down with a `LEFT JOIN`; keep checks on unless the load order is guaranteed."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Writing directly to a MySQL replica makes it drift from the primary, and replication can later stop on a conflicting row. Set `super_read_only` on replicas so even administrator accounts cannot write to them by accident."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Resetting a sequence with `ALTER SEQUENCE ... RESTART` makes new rows reuse IDs that logs, caches, URLs or other services still associate with deleted records. Leave sequences alone; gaps in IDs are harmless."

[[note]]
level = "intermediate"
topic = "Databases"
text = "With strict mode off, MySQL cuts strings that are too long for their column and clamps out-of-range numbers to the column's limit, raising only a warning. Keep `STRICT_TRANS_TABLES` in `sql_mode`, so such writes fail instead of corrupting data."

[[note]]
level = "intermediate"
topic = "Data"
text = "Copying a production database dump to your laptop or a shared staging server spreads real customer data to places with weaker protection. Develop against anonymized or generated data, and keep production dumps inside production."

[[note]]
level = "intermediate"
topic = "Data"
text = "User-supplied text that starts with `=`, `+`, `-` or `@` becomes a live formula when your CSV export is opened in a spreadsheet app. Prefix such cells with a single quote, or export a format that spreadsheets do not evaluate."

[[note]]
level = "intermediate"
topic = "Data"
text = "A one-off script that rewrites records in bulk has no undo. Export the rows it will touch first, give it a `--dry-run` mode that only prints the changes, and run it on a small batch before the full set."

[[note]]
level = "intermediate"
topic = "Data"
text = "Jupyter saves cell outputs inside the `.ipynb` file, so a cell that printed a token or customer rows gets committed along with the code. Clear all outputs before committing, or strip them automatically with a pre-commit hook."

[[note]]
level = "intermediate"
topic = "Data"
text = "pandas `DataFrame.to_sql(..., if_exists=\"replace\")` drops the existing table and creates a new one, losing its other rows, indexes, constraints and grants. Load into a staging table with `if_exists=\"append\"` and merge from there."

[[note]]
level = "intermediate"
topic = "Data"
text = "Opening a CSV in a spreadsheet app and saving it can permanently turn IDs like `00123` into `123` and codes like `MARCH1` into dates. Import those columns as text, or transform the file with a script instead."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Two copies of a cron job or migration running at once can apply the same change twice or interleave their writes. Guard such jobs with a lock, such as `flock` on a single host or a database advisory lock across hosts."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Checking `os.path.exists(path)` before creating a file leaves a window in which another process can create it or plant a symlink there. Open with mode `\"x\"` instead: it creates the file atomically and fails if anything already exists at that path."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Reading a balance into your code, changing it and writing it back lets two concurrent requests overwrite each other. Update it in one statement, such as `UPDATE accounts SET balance = balance - 10 WHERE id = 7`, or lock the row with `SELECT ... FOR UPDATE`."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Caching a personalized response under a key that leaves out the user, such as the URL alone, serves one user's account page to everyone who asks next. Put the user or tenant ID in the cache key, or do not cache that response."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Pointing a load test at production without warning the on-call team can cause the very outage you were testing for, along with an autoscaling bill. Test a production-like staging environment, or schedule the test and stop at the first errors."

[[note]]
level = "intermediate"
topic = "Regex"
text = "In PostgreSQL, `DELETE FROM users WHERE email ~ 'test'` removes every row whose email contains `test` anywhere, such as `contest.org` addresses, because regex matches are unanchored. Run the same `WHERE` in a `SELECT count(*)` first, and anchor the pattern."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Invisible bidirectional control characters can make source code display in a different order from how the compiler reads it, hiding a malicious change in review. Reject pull requests that add unexpected ones, and turn on your editor's warnings for them."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "One character outside the GSM 7-bit alphabet, such as an emoji or a curly apostrophe, switches a whole SMS to UCS-2, cutting a segment from 160 to 70 characters. Check bulk message templates before sending, since every extra segment is billed."

[[note]]
level = "intermediate"
topic = "Time"
text = "Changing a production server's time zone shifts when every `cron` job fires and splits your logs between two offsets. Keep servers on UTC and handle local time in the application."

[[note]]
level = "intermediate"
topic = "Time"
text = "Setting a server's clock by hand with `date -s` can jump time backward, confusing token expiry checks, TLS validation and anything that orders events by time. Let NTP keep the clock right, as with `timedatectl set-ntp true` on systemd machines."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "If the only way to remove user data is a hard `DELETE`, a bug or a mistaken click cannot be undone. Mark rows as deleted with a column such as `deleted_at`, and purge them later with a scheduled job."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "A staging environment that shares a database, bucket or queue with production lets a test run corrupt live data or send real emails. Give each environment its own stateful resources and its own credentials."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Terminating a misbehaving or compromised server destroys the memory, logs and disk state you need to find out what happened. Take it out of the load balancer, snapshot its disk and copy its logs before you replace it."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Rolling back a release by also running its migration's `down` step can delete data written since the release went out. Roll back the application code, keep the schema, and fix forward."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Purging a queue to clear a backlog during an incident deletes every message in it, including real orders or payments. Move the messages to a holding or dead-letter queue first, and replay them once the cause is fixed."

[[note]]
level = "intermediate"
topic = "Testing"
text = "A test suite that truncates tables during setup will just as happily truncate production if `DATABASE_URL` points there. Make the fixture refuse to run unless the database name or host marks it as a test database."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Integration tests configured with live API keys can send real emails, charge real cards or post to real channels. Use the provider's test mode or sandbox keys in test settings, and make the suite stop if a live key appears."

[[note]]
level = "intermediate"
topic = "Testing"
text = "`jest -u` rewrites every failing snapshot to match the current output, turning a real regression into the new expected result. Update snapshots one test at a time and read the snapshot diff in the pull request."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Tests that create and delete files under real paths, such as your home directory, can erase your own data when a path is built wrong. Give each test its own temporary directory, such as pytest's `tmp_path` fixture."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Flask's debug mode serves the interactive Werkzeug debugger, which runs any Python code typed into an error page, guarded only by a PIN. Never enable debug mode on a server that anyone else can reach."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Starting Node with `--inspect=0.0.0.0:9229` lets anyone who can reach that port attach a debugger and run code in your process. Keep the inspector on its default `127.0.0.1` and reach remote processes through an SSH tunnel."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Turning a firewall off to see whether it is blocking something leaves the host exposed if you forget, or get interrupted, before turning it back on. Add one narrow allow rule instead, and remove it again if it does not help."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "A debugger breakpoint in a production process can pause request handling for every user until someone resumes it. Investigate live systems with logs, metrics or logpoints that record values without stopping the program."

[[note]]
level = "intermediate"
topic = "Security"
text = "Deleting a leaked key in a new commit leaves it in the history of every clone and fork, where scanners may already have found it. Revoke and replace the key first; cleaning up the history comes second."

[[note]]
level = "intermediate"
topic = "Security"
text = "`ssh -A` forwards your SSH agent, so anyone with root on that server can use your keys to log in elsewhere as you while you are connected. Reach inner hosts through a jump host with `ssh -J` instead."

[[note]]
level = "intermediate"
topic = "Security"
text = "A feature that fetches any URL a user supplies can be pointed at internal services or the cloud metadata address `169.254.169.254`, which can hand out credentials. Allow only expected hosts, and block private and link-local addresses after DNS resolution."

[[note]]
level = "intermediate"
topic = "Security"
text = "A token pasted into a chat, ticket or shared document is copied into systems you do not control, with history you cannot fully erase. Share secrets through a secrets manager, and rotate any secret that was ever pasted."

[[note]]
level = "intermediate"
topic = "Security"
text = "Losing your only two-factor device without saved recovery codes can lock you out of an account for good. Store the recovery codes offline when you turn on 2FA, and register a second method such as a hardware security key."

[[note]]
level = "intermediate"
topic = "Security"
text = "Keeping production credentials in your everyday shell or `.env` means a mistyped command or a local test can change live data. Use separate credentials per environment, and take production access only when you need it."

[[note]]
level = "intermediate"
topic = "Security"
text = "A `NOPASSWD: ALL` sudoers entry for a service account turns any bug in that service into full root access. Allow only the exact commands it needs, with their arguments, in a file under `/etc/sudoers.d/`."

[[note]]
level = "intermediate"
topic = "Security"
text = "A hard-coded admin password or bypass flag added for testing ships to every environment and can be found by anyone who reads the code or the binary. Create test accounts through setup scripts that production never runs."

[[note]]
level = "intermediate"
topic = "Security"
text = "`-o StrictHostKeyChecking=no` in scripts makes SSH accept any host key, so a machine in the middle can capture credentials and commands. Distribute known host keys, or use `StrictHostKeyChecking=accept-new`, which still rejects a changed key."

[[note]]
level = "intermediate"
topic = "Security"
text = "On many services, changing a password leaves existing sessions and issued tokens working, so an attacker who is already in stays in. After a suspected compromise, also sign out every session and revoke tokens and keys."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "`Cipher.getInstance(\"AES\")` in Java quietly means `AES/ECB/PKCS5Padding` with the default provider, which leaks patterns and has no integrity check. Always name the full transformation, such as `AES/GCM/NoPadding`."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "Every `repo:` entry in `.pre-commit-config.yaml` downloads third-party code and runs it on each developer's machine at commit time. Pin `rev` to a full commit hash for hooks you do not control, and review updates."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "`npm install --legacy-peer-deps` or `--force` gets past an `ERESOLVE` error by ignoring the peer dependency ranges packages declared, so the conflict can come back as runtime errors. Align the versions instead."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "Changing a JSON field's type, such as sending an ID as a string where it used to be a number, breaks clients that expect the old type even though the name is unchanged. Keep the old field as it was and send the new form under a new name, such as `id_str`."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Decoding a JWT is not verifying it: reading the payload without checking the signature, or accepting `alg: none`, trusts whatever the client wrote. Verify every token with the expected key and an explicit list of allowed algorithms."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "If a TLS private key leaks, installing a new certificate is not enough: the old one stays valid until it expires, and whoever holds the key can impersonate your site. Revoke the old certificate and issue the new one with a new key."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Opening a user-supplied URL with `window.open(url)` gives that page a `window.opener` handle it can use to send your tab to a phishing copy of your site; pass `'noopener'` as the third argument, as in `window.open(url, '_blank', 'noopener')`."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`path.join(uploadDir, name)` happily resolves a name like `../../.ssh/id_rsa` to a path outside the folder; call `path.resolve` and check that the result starts with the upload directory plus `path.sep` before reading or writing."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`child_process.exec()` hands its whole string to a shell, so a file name like `x; rm -rf ~` taken from user input runs as a command; use `execFile()` or `spawn()` with an argument array, which skip the shell."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Assigning a `User` to a variable typed `PublicUser` does not remove its other properties, so sending it as JSON still includes `passwordHash`; types never strip data at runtime, so copy the allowed fields into a new object."

[[note]]
level = "intermediate"
topic = "Web"
text = "Publishing source maps next to your production bundles lets anyone read your original source, including comments and internal URLs; upload them only to your error tracker, or serve them to authenticated staff."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "A long `max-age` on a URL whose content can change leaves browsers holding the old copy until it expires, and you cannot purge their caches. Use long lifetimes only for file names that contain a content hash."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Browsers may cache a `301 Moved Permanently` indefinitely, so a mistaken one keeps sending returning visitors to the wrong URL after you fix the server. Use a `302` or `307` redirect until the move is final."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Any key shipped inside a web page or mobile app can be extracted by its users. Keep secret API keys on your server, and have the client call your backend, which adds the key and enforces limits."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Automatically retrying a `POST` that charges a card or places an order can do it twice when the first attempt succeeded but its response was lost. Send an idempotency key with each operation so the server can recognize a repeat."

[[note]]
level = "intermediate"
topic = "Web"
text = "Apps served from different paths of one origin, such as GitHub Pages project sites under the same `username.github.io`, share cookies and `localStorage`, so a bug in one can read or wipe the other's data; give sensitive apps their own origin."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Running a destructive action on `mousedown` or `pointerdown` removes the chance to slide off the button and cancel, which people with tremors rely on; trigger actions on `click`, which fires only when the pointer is released over the target."

[[note]]
level = "intermediate"
topic = "APIs"
text = "A bulk delete or update endpoint that treats a missing filter as \"everything\" turns one client bug into a wiped table. Reject requests with an empty filter, and cap how many records one call may change."

[[note]]
level = "intermediate"
topic = "Web"
text = "Setting `innerHTML`, or React's `dangerouslySetInnerHTML`, from user text lets that user inject scripts that run as your site. Use `textContent` or normal rendering for text, and pass HTML you must render through a maintained sanitizer."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "A single-letter shortcut such as `d` for delete can fire when a speech input user's dictated words arrive as keystrokes, or when someone mistypes; let users turn such shortcuts off or remap them, or require a modifier key."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "`curl --location-trusted` sends your `-u` credentials and an `Authorization` header to whatever host a redirect points to; use plain `-L`, which drops them once a redirect leaves the original host."

[[note]]
level = "intermediate"
topic = "Web"
text = "A broken service worker keeps controlling your site for returning visitors and can serve stale files after you fix the server. Keep a way out ready: a replacement worker that calls `self.registration.unregister()`."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Honoring a `_method` form field or query parameter lets a plain cross-site form `POST` act as `DELETE` or `PUT`, bypassing protections that assume those methods always need a CORS preflight; turn method override off, or require a CSRF token with it."

[[note]]
level = "intermediate"
topic = "Web"
text = "A login page that redirects to any `?next=` URL turns your domain into a tool for phishing. Parse the target against your own origin and redirect only when the origin stays the same, or match it against an allowlist."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "A HAR file saved from DevTools holds every cookie, token and form field from the recording, so sending one to a vendor's support can hand over live sessions; use a sanitized export or strip secrets, and sign out afterward."

[[note]]
level = "intermediate"
topic = "Networking"
text = "`iptables -F` deletes the rules but keeps each chain's policy, so on a server whose `INPUT` policy is `DROP` it cuts off your SSH session. Test rule changes with `iptables-apply`, which rolls back unless you confirm in time."

[[note]]
level = "intermediate"
topic = "Networking"
text = "FTP, Telnet and HTTP without TLS send passwords in plain text that anyone on the network path can read. Use SFTP, SSH and HTTPS instead, and turn the old services off."

[[note]]
level = "intermediate"
topic = "Networking"
text = "When `ssh` reports that a host key has changed, deleting the old entry without asking why lets a machine in the middle capture your session. Confirm the new fingerprint with the server's owner before running `ssh-keygen -R <host>`."

[[note]]
level = "intermediate"
topic = "DNS"
text = "Allowing DNS zone transfers (AXFR) from any address lets anyone download your whole zone, including every internal-looking host name. Restrict transfers to your secondary servers' addresses, ideally authenticated with TSIG keys."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Renaming a metric or label silently breaks every dashboard and alert that uses the old name, since their queries simply return nothing. Find the metric's users first, and emit both names during the change."

[[note]]
level = "intermediate"
topic = "DNS"
text = "When a domain expires, anyone can register it and receive email sent to it, including password resets for accounts tied to those addresses. Turn on auto-renew and keep the registrar's contact details current."

[[note]]
level = "intermediate"
topic = "Time"
text = "`ALTER COLUMN ... TYPE timestamptz` in PostgreSQL reads every existing `timestamp` value as local time in the session's `TimeZone`, so running it under the wrong setting shifts them all. State what the old values meant, as in `USING created_at AT TIME ZONE 'UTC'`."

[[note]]
level = "intermediate"
topic = "Regex"
text = "A validation regex without anchors accepts any input that merely contains a match, so `[a-z0-9]+` approves `abc; rm -rf /`. Match the whole string, as with `re.fullmatch` in Python or `^...$` in JavaScript."

[[note]]
level = "intermediate"
topic = "Code review"
text = "GitHub collapses large diffs and generated files such as lockfiles, so a harmful change can hide where no reviewer looks. Expand every changed file before approving, and question lockfile changes nobody asked for."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Renaming or deleting a published docs page breaks every link to it from search results, forums and other sites, and you can't fix links you don't own. Add a redirect from the old path whenever you move a page."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Readers copy example commands from docs as they are, so a real token, internal hostname or customer ID in an example leaks or gets used against production. Use obvious placeholders such as `<your-token>` and reserved names such as `example.com`."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Screenshots in issues and docs often capture a token, internal URL or customer record in a corner of the screen. Check and crop every image before posting, since removing it from the page later may not delete the uploaded file."

[[note]]
level = "intermediate"
topic = "Teams"
text = "A shared admin login cannot be revoked for one person and hides who did what. Give everyone their own account with only the roles they need, so access can be removed one person at a time."

[[note]]
level = "intermediate"
topic = "Teams"
text = "When someone leaves, their personal access tokens, SSH keys and cloud access keys keep working until someone revokes them. Keep an offboarding checklist and remove every kind of access on their last day."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Restarting a busy database to clear an incident can make it worse: shutdown and log replay can take minutes, and it returns with a cold cache that slows every query. Find and cancel the offending queries first, for example with `pg_cancel_backend()` in PostgreSQL."

[[note]]
level = "intermediate"
topic = "Python"
text = "Flask keeps the session in a cookie signed with `SECRET_KEY`, so anyone who learns the key, from a public repository for example, can forge a session and log in as any user. Generate a long random key for each environment and keep it out of the code."

[[note]]
level = "intermediate"
topic = "Python"
text = "Django's `QuerySet.update()` writes straight to the database without calling each model's `save()` or sending `pre_save` and `post_save` signals, so audit records and derived fields maintained there silently go stale. Loop and call `save()` where that logic matters."

[[note]]
level = "intermediate"
topic = "Python"
text = "`subprocess.run(f\"convert {name}\", shell=True)` lets a file name like `x; rm -rf ~` run its own command. Pass a list of arguments without `shell=True`, as in `subprocess.run([\"convert\", name])`."

[[note]]
level = "intermediate"
topic = "Python"
text = "`eval()` on user input runs whatever expression it contains, including calls such as `__import__(\"os\").system(...)`. Parse literals with `ast.literal_eval`, or parse data as JSON."

[[note]]
level = "intermediate"
topic = "Python"
text = "`shutil.rmtree()` deletes a whole directory tree at once, with no prompt and no trash. Resolve the path and confirm it lies inside the directory you expect, for example with `Path.resolve()` and `is_relative_to()`, before calling it."

[[note]]
level = "intermediate"
topic = "Java"
text = "`orphanRemoval = true` on a JPA collection deletes a child row as soon as it is removed from the collection, and `CascadeType.REMOVE` deletes children along with their parent. Enable them only for children that can't exist on their own."

[[note]]
level = "intermediate"
topic = "Python"
text = "`open(path, \"w\")` empties the file the moment it opens, so a crash while writing leaves it truncated or half-written. Write to a temporary file in the same directory, then swap it in with `os.replace()`."

[[note]]
level = "intermediate"
topic = "Python"
text = "`python3 -m http.server` listens on all network interfaces by default and serves every file below the current directory, `.env` and `.git` included. Add `--bind 127.0.0.1`, and run it from a directory that holds only what you mean to share."

[[note]]
level = "intermediate"
topic = "Python"
text = "Checks written with `assert` disappear when Python runs with `-O`, so a guard like `assert user.is_admin` stops protecting anything. Raise an exception explicitly for permission and input checks."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Deep-merging untrusted JSON into an object can follow a `__proto__` key and add properties to every object in the process (prototype pollution). Skip `__proto__`, `constructor` and `prototype` keys, or merge into objects made with `Object.create(null)`."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Node's `vm` module is not a security sandbox: code run in a new context can reach the host process and escape. Run untrusted code in a separate process or container with its own limits instead."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "A `message` event listener that does not check `event.origin` acts on messages from any window, including a malicious page that opened yours. Compare `event.origin` against an exact allowlist, and give `postMessage` a specific target origin instead of `\"*\"`."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Without `\"private\": true` in `package.json`, a stray `npm publish` can push an internal package to the public registry, where its code and version number cannot be fully taken back. Set it in every package that is not meant for publishing."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Generating a new idempotency key for each retry defeats it, because the server sees every attempt as a new operation; create the key once per logical operation and send the same key with all of its retries."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Node's `Buffer.allocUnsafe()` returns memory that may still hold old data such as keys or passwords, which leaks if you send the buffer before filling it. Use `Buffer.alloc()`, which zero-fills, unless you overwrite every byte."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "TypeScript types vanish at runtime, so `req.body as User` checks nothing, and untrusted JSON can carry any shape or extra fields. Validate input at the boundary with a runtime schema check before trusting it."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Inserting a member in the middle of a numeric `enum` renumbers every member after it, so values already stored in a database or sent to clients now mean something else. Give members explicit values, or use string enums."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "TypeScript's `private` exists only at compile time, so `JSON.stringify(user)` still includes a `private passwordHash` field. Build response objects from an explicit list of fields, or use JavaScript `#private` fields."

[[note]]
level = "intermediate"
topic = "Go"
text = "Go's `text/template` does not escape anything, so rendering user input into HTML with it allows script injection. Use `html/template`, which escapes each value for its context in the page."

[[note]]
level = "intermediate"
topic = "Go"
text = "Once a Go module version has been fetched through the public module proxy, it stays cached there even if you delete the tag, and the checksum database remembers its hash. Fix a bad release with a new version and a `retract` directive in `go.mod`."

[[note]]
level = "intermediate"
topic = "Java"
text = "Extracting a zip in Java with `new File(dest, entry.getName())` accepts entry names like `../../.bashrc`, so a crafted archive writes outside `dest`. Resolve each entry with `destPath.resolve(name).normalize()` and check `startsWith(destPath)` before writing."

[[note]]
level = "intermediate"
topic = "Go"
text = "Values set with `go build -ldflags \"-X main.apiKey=...\"` end up as plain strings in the binary, and `go version -m` even prints the flags. Load secrets at runtime from the environment or a secret store instead."

[[note]]
level = "intermediate"
topic = "Go"
text = "Decoding JSON into a Go struct that already holds data leaves fields missing from the input untouched, so reusing one variable across requests can carry one user's values into the next response. Decode each message into a fresh zero value."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Building a Rust project runs its `build.rs` scripts and procedural macros with your user's permissions, and editors that analyze the project do the same when you open it. Read an untrusted project before building it, or build it in a container."

[[note]]
level = "intermediate"
topic = "Java"
text = "Calling `ObjectInputStream.readObject()` on untrusted bytes can run code through gadget classes on your classpath before your own checks see the object. Accept JSON or another data-only format, or restrict classes with an `ObjectInputFilter`."

[[note]]
level = "intermediate"
topic = "Java"
text = "Hibernate's `hibernate.hbm2ddl.auto=create-drop` drops the tables it manages when the application shuts down, and `create` drops and recreates them at startup. Keep it at `validate` or `none` outside local development, and change schemas through migrations."

[[note]]
level = "intermediate"
topic = "Java"
text = "Exposing all Spring Boot Actuator endpoints over HTTP publishes `/actuator/heapdump`, a full memory dump that can include passwords and tokens. Expose only `health` and `info` publicly, and put the rest behind authentication."

[[note]]
level = "intermediate"
topic = "Go"
text = "A Go `exec.Cmd` whose `Env` is nil passes your process's entire environment, database passwords and API tokens included, to the child program. When running third-party tools, set `cmd.Env` to only the variables they need."

[[note]]
level = "intermediate"
topic = "Rust"
text = "`std::env::set_var` can race with other threads reading the environment, including C code calling `getenv`, which is undefined behavior; the 2024 edition marks it `unsafe`. Set variables before starting threads, or pass them to child processes with `Command::env`."

[[note]]
level = "intermediate"
topic = "C"
text = "A `memset` that wipes a password buffer just before it goes out of scope can be removed by the optimizer, leaving the secret in memory. Use `explicit_bzero` (glibc, OpenBSD and FreeBSD) or another wipe the compiler must keep."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "Changing an API's error codes or HTTP status, such as returning 404 where you used to return 403, breaks clients that branch on them even though successful responses are unchanged. Treat error responses as part of the contract."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Renaming release assets or changing their download path breaks every install script, Dockerfile and package formula that fetches them by name. Keep asset names stable across releases, or publish both names for a while."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "`pip install --extra-index-url` treats both indexes as equals and installs the highest version it finds, so a public package with your internal package's name can win. Point `--index-url` at one registry that serves internal names only from your own packages."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "A one-letter typo in `npm install`, `pip install` or `cargo add` can pull in a look-alike package written to steal credentials. Copy package names from the project's official docs, and check the publisher before adding a new dependency."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Pointing tests at a shared development database lets other people's data decide whether they pass, and lets your test cleanup delete their work. Give each test run its own database, created from migrations."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "In CI, `npx some-tool` installs and runs a package that is missing from your dependencies without asking, so a typo or squatted name runs a stranger's code. Add tools to `devDependencies` so `npx` runs the locked local copy."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Deleting `package-lock.json` to escape a merge conflict makes the next install re-resolve every transitive dependency to its newest allowed version in one unreviewable change. Take one side's lockfile and rerun `npm install` instead."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Auto-merging dependency update pull requests without a passing test suite ships whatever the new version does, including a compromised release, straight to `main`. Require green checks, and review major updates by hand."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Adding a dependency under a copyleft license such as the GPL to software you distribute can oblige you to release your own source under the same terms. Check the license of every new dependency before it lands."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Edits made directly inside `node_modules` or `site-packages` vanish on the next install and never reach your teammates. Record the fix as a patch applied at install time, or fork the package and depend on your fork."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Running `pip install --upgrade` or `npm update` directly on a production server changes code that no test has run, with no lockfile to roll back to. Upgrade in the repository, test, and deploy the new lockfile."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Setting CI to `node-version: lts/*` or `python-version: 3.x` moves your builds to a new major runtime on the day it is released. Pin the exact runtime version and bump it in its own pull request."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "A breaking change released as a minor or patch version reaches every user whose range, such as `^1.4.0`, accepts it, on their next install and without warning. Publish breaking changes only in a new major version."

[[note]]
level = "intermediate"
topic = "Releases"
text = "npm never lets you reuse a version number, even after unpublishing it, and PyPI never accepts the same file name twice. Check the version, changelog and package contents before you publish, and publish from CI rather than a laptop."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Adding an `.npmignore` file makes npm stop reading `.gitignore`, so files such as `.env` that Git ignores can end up in the published package. List what to ship in the `files` field of `package.json` and check `npm pack --dry-run`."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Deleting a GitHub release permanently deletes its uploaded assets and breaks every download link to them, while the Git tag stays behind. Edit the release, or publish a newer one, instead of deleting a release people use."

[[note]]
level = "intermediate"
topic = "Rust"
text = "`String::from_utf8_unchecked` on bytes you haven't validated creates a `String` that breaks the UTF-8 guarantee the standard library relies on, which can lead to memory-safety bugs. Use `String::from_utf8`, or `from_utf8_lossy` to replace invalid bytes."

[[note]]
level = "intermediate"
topic = "Releases"
text = "`npm publish` packs your working directory as it is, including uncommitted edits and any untracked file that is not ignored. Publish from a clean checkout of a tagged commit, ideally from CI."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Deleting old build artifacts or container images that past releases point to makes rolling back impossible. Keep the artifacts of recent releases under a retention rule rather than cleaning them up by hand."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Rebuilding an old release from its tag can produce different output when dependencies are not locked, so a rollback ships code that was never tested. Commit lockfiles and roll back to the stored artifact rather than a fresh build."

[[note]]
level = "intermediate"
topic = "C"
text = "`tmpnam` and `mktemp` return only a name, and another process can create a file or symlink at that name before you open it. Use `mkstemp`, which creates and opens a unique file in one atomic step."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Restoring a plain-SQL `pg_dump` into a database that already has tables fails on each existing object but loads data wherever it can, leaving a half-restored mix. Restore into a new, empty database, with `psql --single-transaction` so any error rolls everything back."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Giving a collaborator the Admin role lets them delete the repository, change its visibility and remove branch protections. Grant the lowest role that covers the work (Read, Triage, Write or Maintain), and keep Admin for a few owners."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Setting an organization's base permission to Write or Admin grants that access to every member on every repository, including ones created later. Keep the base permission at Read or No permission, and grant more through teams."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Text copied from a web page can contain hidden characters or a trailing newline, so pasting it into a terminal can run a command before you have read it. Paste into an editor first, or keep your shell's bracketed paste mode on."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`rsync --delete` removes every file in the destination that is not in the source, so swapping source and destination, or syncing into a directory that holds other files, loses data. Run the command with `--dry-run` first and read the list of deletions."

[[note]]
level = "intermediate"
topic = "Time"
text = "Converting a text column of dates like `03/04/2024` to a real date type picks one reading for every row, so rows written in the other order are silently corrupted. Check samples from each data source first, and keep the original column until the result is verified."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`chmod u+s` on a root-owned program lets every user run it as root, so any shell escape in it becomes a root shell. Grant specific commands through `sudoers` instead of setting the setuid bit."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`echo '10.0.0.5 api' | sudo tee /etc/hosts` replaces the whole file with that one line. Use `tee -a` to append, and copy system files aside, as in `cp /etc/hosts /etc/hosts.bak`, before changing them."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`tar -xf` overwrites existing files with the same names in the current directory without asking. List the contents with `tar -tf` first, and extract into a new empty directory, or add GNU tar's `--keep-old-files`."

[[note]]
level = "intermediate"
topic = "CI"
text = "`set -x` prints every command after expansion, so a CI script that handles tokens writes them into the build log. Turn tracing off with `set +x` around lines that touch secrets, or leave it out of such scripts."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "`kubectl port-forward --address 0.0.0.0` listens on every network interface of your machine, so anyone on the same network can reach the forwarded service, such as a database, without passing the cluster's access controls. Keep the default, which binds to localhost."

[[note]]
level = "intermediate"
topic = "CI"
text = "Uploading a whole workspace as a build artifact can publish `.env` files, credentials and test database dumps to everyone who can view the build. List the exact files or directories each artifact should contain."

[[note]]
level = "intermediate"
topic = "CI"
text = "Long-lived cloud access keys stored as CI secrets keep working wherever they leak. Let jobs get short-lived credentials through your CI provider's OpenID Connect federation instead, scoped to the repository and branch."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "`kubectl drain --delete-emptydir-data` evicts pods that use `emptyDir` volumes, and whatever they stored there is deleted with them. Check what those pods keep in `emptyDir` before draining, and move anything that must survive to a persistent volume."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "A Deployment's `spec.selector` cannot be changed after creation, so editing its labels makes `kubectl apply` fail, and the usual fix, deleting and recreating the Deployment, takes all its pods down at once. Create the new Deployment beside the old one instead."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Pushing to a Docker Hub repository that does not exist yet creates it with your account's default visibility, which is public unless you changed it. Create the repository as private before pushing images that contain internal code."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Without a `permissions:` block, a workflow's `GITHUB_TOKEN` gets the repository's default permissions, which may include write access. Set `permissions: contents: read` at the top of each workflow and grant more only to jobs that need it."

[[note]]
level = "intermediate"
topic = "CI"
text = "A CI runner registration token lets whoever holds it attach their own machine to your project as a runner, where it then receives your jobs and the secrets they use. Keep such tokens out of scripts and chat, and rotate any that leak."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "GitHub never shows a secret's value again after you save it, so overwriting a repository secret discards the old value for good. Keep the source of truth in a password manager or vault, and rotate it there before updating the secret."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "Deleting a Google Cloud project shuts down every resource in it at once, and after a recovery window of about 30 days its data is gone for good. Put a lien on projects that must never be deleted, so a delete request fails until someone removes it."

[[note]]
level = "intermediate"
topic = "Containers"
text = "`docker run --privileged` gives the container nearly all of the host's kernel capabilities and devices, so a process inside can take over the host. Add only the specific capability a container needs with `--cap-add`."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "Deactivate an old cloud access key and watch for failures before deleting it. An inactive AWS access key can be switched back on if something still needed it, while a deleted one is gone and everything using it fails until redeployed."

[[note]]
level = "intermediate"
topic = "Containers"
text = "`docker compose down -v` also deletes the named volumes declared in the Compose file, which is usually where your local database keeps its data. Use plain `docker compose down` unless you want to start empty, and dump the data first."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "Ansible's `copy` and `template` modules overwrite the target file without keeping the old version. Add `backup: true` for files you did not create yourself, so a bad change can be undone from the copy Ansible leaves beside the file."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "A Terraform `import` with the wrong ID adopts some other real resource, and the next apply rewrites it to match your code. Check the imported object with `terraform state show` before you apply anything."

[[note]]
level = "intermediate"
topic = "Data"
text = "Test and staging systems loaded with real customer emails or phone numbers can send real messages, such as password resets or invoices, to those customers. Replace contact details with safe placeholders, or route all outgoing mail there to a catch-all inbox."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Using one Redis instance both as a cache with an `allkeys-lru` eviction policy and as a job queue lets eviction silently delete queued jobs under memory pressure. Keep durable data on a separate instance set to `noeviction`."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "`kubectl delete namespace` deletes every object inside it, including Deployments, Secrets, ConfigMaps and PersistentVolumeClaims. List what it holds with `kubectl get all,pvc -n <namespace>` before deleting it."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "`kubectl` acts on whatever context is current, so a command meant for staging can land on production. Check `kubectl config current-context` before any change, or pass `--context` explicitly in scripts."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Dynamically provisioned volumes usually inherit the `Delete` reclaim policy, so deleting a PersistentVolumeClaim also deletes the disk and its data. Set `persistentVolumeReclaimPolicy: Retain` on volumes that hold data you need to keep."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Kubernetes Secrets are only Base64-encoded, so anyone who can read the manifest, or `get` secrets in the namespace, has the values. Keep secret manifests out of Git unless they are encrypted, and limit who can read Secrets with RBAC."

[[note]]
level = "intermediate"
topic = "C"
text = "Writing a struct to disk with `fwrite(&rec, sizeof rec, 1, f)` bakes the compiler's padding and the machine's byte order into the file, so another platform or compiler can misread every record. Serialize each field with a fixed width and byte order."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Binding a CI or application service account to `cluster-admin` lets anyone who steals its token control the whole cluster. Give it a Role limited to the namespaces and resources it actually manages."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Deleting a CustomResourceDefinition also deletes every object of that kind in every namespace. Remove a CRD only after migrating or backing up the objects that use it."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Bulk ORM updates such as Django's `QuerySet.update()` or Rails' `update_all` send one SQL `UPDATE` and skip model validations, callbacks and signals, so audit logs and cache invalidation built on them never run. Check what those hooks do first."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "Deleting a managed database can remove its automated backups along with it. Turn on deletion protection for production databases, and take a manual final snapshot before you delete one."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "In AWS, IAM policies cannot restrict the account's root user, so an access key for it is a key to everything. Delete root access keys, protect the root user with MFA, and work through IAM roles."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "Deleting a cloud KMS key makes all data encrypted under it unreadable for good. Disable the key first and watch for errors during the waiting period, and cancel the deletion if anything still depends on it."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Recording real HTTP traffic for tests with tools such as VCR.py or Polly.JS saves the requests' API keys, tokens and cookies into cassette files that get committed. Filter credentials in the recorder's configuration before the first recording."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "A policy with `\"Action\": \"*\"` and `\"Resource\": \"*\"` gives a leaked credential full control of the account. Grant specific actions on specific resources, starting from the permissions a job actually uses."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "A `terraform plan` entry marked `-/+` destroys the existing resource before creating its replacement, which for a database means its data. Read every replacement in the plan, and set `prevent_destroy = true` in a `lifecycle` block on stateful resources."

[[note]]
level = "intermediate"
topic = "APIs"
text = "An `include` or `expand` parameter mapped straight onto your ORM relations lets callers pull in related records you never meant to expose, such as another user's payment methods; accept only a listed set of relations."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "Deleting a resource block from your Terraform code destroys the real resource on the next apply. To stop managing something while keeping it running, remove it from state with `terraform state rm` instead."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "`terraform force-unlock` or `-lock=false` lets two runs write the same state at once and corrupt it. Force-unlock only after confirming that the run holding the lock has really died."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Turning on full statement logging to debug, such as `log_statement = 'all'` in PostgreSQL, writes the values in every query, tokens and personal data included, into the server logs. Enable it briefly for one role, and clean up the logs afterwards."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Adding a label with unbounded values, such as a user ID or full URL, to a Prometheus metric creates a new time series per value and can exhaust the monitoring server's memory. Keep label values to small, fixed sets."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Opening an untrusted repository in an editor can run its code through workspace tasks, settings and extensions. Keep the editor's restricted mode, such as VS Code's Workspace Trust, on until you have read the project."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Publishing your dotfiles repository can leak tokens stored in files such as `.npmrc`, `.pypirc`, `.netrc` or your shell history. Keep credentials in separate files that the repository ignores, and scan the history before making it public."

[[note]]
level = "advanced"
topic = "Shell"
text = "`curl ... | sh` runs whatever the server sends, as you, immediately. Download the script, read it, verify its checksum or signature, then run it."

[[note]]
level = "advanced"
topic = "Shell"
text = "Printing untrusted text with `cat` sends any escape sequences in it straight to your terminal, where they can hide lines, rewrite the screen or, in some terminals, trigger actions. Inspect unknown files with `less` or `cat -v`, which show control characters instead."

[[note]]
level = "advanced"
topic = "Shell"
text = "Never splice `{}` into the script text of `find -exec sh -c`: a file named `$(rm -rf ~).txt` then runs as shell code with your permissions. Pass each name as an argument after the script and refer to it as `\"$1\"` inside."

[[note]]
level = "advanced"
topic = "Shell"
text = "If `cd` fails in `cd /srv/app/cache; rm -rf *`, the `rm` empties whatever directory you were already in. Write `cd /srv/app/cache || exit 1` before destructive commands, or give `rm` the full path."

[[note]]
level = "advanced"
topic = "Shell"
text = "`$RANDOM` is a 15-bit pseudo-random number between 0 and 32767 and easy to guess, so it must never produce passwords, tokens or unguessable file names. Use `openssl rand -hex 16`, or read from `/dev/urandom`, for anything security-related."

[[note]]
level = "advanced"
topic = "Shell"
text = "Non-interactive Bash runs the file named in `BASH_ENV` before any script, so a CI system or service that lets untrusted input set environment variables lets it run code in every later Bash step. Allowlist which variables untrusted input may set."

[[note]]
level = "advanced"
topic = "Linux"
text = "Extracting an archive as root with GNU `tar` restores the owners and modes stored in it, setuid bits included, so an untrusted archive can plant a setuid-root binary. Extract as an unprivileged user, or pass `--no-same-owner --no-same-permissions`."

[[note]]
level = "advanced"
topic = "Linux"
text = "A `umask 000` in a service or setup script makes the files it creates writable by every user, including configs, sockets and logs, and they stay that way after the script is fixed. Use `umask 027` or `077`, or set `UMask=` in the systemd unit."

[[note]]
level = "advanced"
topic = "Linux"
text = "`swapoff -a` must pull every swapped-out page back into RAM, so on a host already short of memory it can stall for minutes or wake the OOM killer, which may pick your database. Check with `free -h` that used swap fits in available memory first."

[[note]]
level = "advanced"
topic = "Shell"
text = "A predictable temp path like `/tmp/deploy.$$` lets another local user plant a symlink there first, so your script writes through it to a file of their choosing. Use `mktemp`, which creates a fresh file under a random name."

[[note]]
level = "advanced"
topic = "Shell"
text = "GNU `sed -i` on a symlink replaces the link with a regular file and leaves the real target unchanged. Pass `--follow-symlinks` to edit the file it points to, and use `-i.bak` to keep a backup."

[[note]]
level = "advanced"
topic = "Linux"
text = "When shrinking storage, shrink the filesystem with `resize2fs` before the partition or logical volume; cutting the block device first destroys whatever lay past the new end. XFS cannot be shrunk at all, and `lvreduce --resizefs` does both steps in order."

[[note]]
level = "advanced"
topic = "Linux"
text = "A classic (non-thin) LVM snapshot becomes invalid the moment writes to the origin fill its reserved space, so a backup read from it fails partway through. Size snapshots for the write rate while they exist, and remove them as soon as the backup finishes."

[[note]]
level = "advanced"
topic = "Linux"
text = "`dd of=/dev/sdb` overwrites whichever disk has that name right now, and `sdX` names can change between boots or when drives are added. Confirm the target with `lsblk` and write to a stable path under `/dev/disk/by-id/`."

[[note]]
level = "advanced"
topic = "Linux"
text = "A recursive `chmod` or `chown` on the wrong path replaces the original owners and modes with no undo. Snapshot them first with `getfacl -R dir > perms.acl`; running `setfacl --restore=perms.acl` from the same directory puts them back."

[[note]]
level = "advanced"
topic = "Linux"
text = "Running `fsck` on a mounted, writable filesystem can corrupt it, since the kernel keeps changing the structures being repaired. Unmount it first, or schedule the check for the next boot."

[[note]]
level = "advanced"
topic = "Linux"
text = "Forcing a package operation with `dpkg --force-all` or `rpm --nodeps` skips the dependency checks, and replacing or removing a core library this way can leave even the package manager unable to run. Resolve the conflict itself, or test the change on a disposable machine."

[[note]]
level = "advanced"
topic = "Linux"
text = "In `sudoers`, a `*` in command arguments also matches spaces and extra options, so allowing `/usr/bin/systemctl restart app*` also allows `systemctl restart app sshd` and more. List exact commands, or give users a root-owned wrapper script."

[[note]]
level = "advanced"
topic = "Linux"
text = "Copying a different `libc.so.6` over the system's copy breaks every dynamically linked program at once, including the `cp`, `sudo` and shell you would need to undo it. Install other glibc versions under a separate prefix, or run the software in a container."

[[note]]
level = "advanced"
topic = "Linux"
text = "`crontab jobs.txt` replaces your whole crontab with that file's contents, dropping every job not listed in it, with no prompt and no undo. Merge first, as in `crontab -l > current.txt`, and install the combined file."

[[note]]
level = "advanced"
topic = "Tooling"
text = "A key loaded into `ssh-agent` stays usable by anything that can reach the agent socket for as long as the agent runs, including forwarded sessions on other hosts. Load keys with a lifetime and confirmation, as in `ssh-add -t 1h -c`, especially keys with production access."

[[note]]
level = "advanced"
topic = "Linux"
text = "Deleting a log file that a daemon still has open frees no disk space until the daemon closes it. Empty it in place with `truncate -s 0` instead; if you already deleted it, `lsof +L1` shows which process holds it."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Editor backup and swap files such as `config.php~` or `.config.php.swp` left in a web root are served as ordinary downloads, exposing source code and credentials to anyone who guesses the name. Deny such patterns in the server, and keep editors from writing them there."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Sharing a terminal through `tmate` or a shared `tmux` socket gives every guest full control of your shell and every credential it holds, not just a view. Use a read-only link or `tmux attach -r` for demos, and end the session as soon as you finish."

[[note]]
level = "advanced"
topic = "Linux"
text = "Running `setenforce 0` to get a service working switches SELinux to permissive mode for the whole machine, and it tends to stay that way. Read the denials with `ausearch -m avc` and fix the file label or policy instead."

[[note]]
level = "advanced"
topic = "Linux"
text = "If a LUKS header is damaged or overwritten, the encrypted volume is unrecoverable even with the right passphrase. Save a copy with `cryptsetup luksHeaderBackup` and store it somewhere other than that disk."

[[note]]
level = "advanced"
topic = "Linux"
text = "`apt-get remove` also removes every installed package that depends on the one you named, which can include your SSH server or desktop. Read the full list before confirming, or preview it with `apt-get -s remove`."

[[note]]
level = "advanced"
topic = "Linux"
text = "Granting `cap_sys_admin` with `setcap` is nearly equivalent to granting root, since it covers mounting and many other admin operations. Give a binary the narrowest capability it needs, such as `cap_net_bind_service` for ports below 1024."

[[note]]
level = "advanced"
topic = "Linux"
text = "`umount -l` hides a busy filesystem immediately but keeps it in use behind the scenes, so detaching the disk afterwards can lose writes. Find what holds it with `fuser -m` or `lsof` and stop those processes instead."

[[note]]
level = "advanced"
topic = "Tooling"
text = "`sudo vim /etc/nginx/nginx.conf` runs your editor as root, so its plugins, `:!` shell commands and configuration all run with root rights. Use `sudoedit`, which edits a temporary copy as you and writes it back with root permissions."

[[note]]
level = "advanced"
topic = "Tooling"
text = "`make -n` does not make an untrusted Makefile safe to inspect: `$(shell ...)` calls run while it is parsed, and recipe lines that use `$(MAKE)` still execute. Read the Makefile itself, or run it in a throwaway container."

[[note]]
level = "advanced"
topic = "Regex"
text = "An allowlist regex such as `^app.example.com` for redirect hosts also accepts `app.example.com.evil.net` and `appXexample.com`, turning your login flow into an open redirect. Parse the URL and compare its exact host instead of matching the string."

[[note]]
level = "advanced"
topic = "Git"
text = "`git branch -D` deletes the branch's reflog along with it. Copy the hash from the `Deleted branch ... (was abc1234)` message; `git branch <name> abc1234` recreates it if you change your mind."

[[note]]
level = "advanced"
topic = "Regex"
text = "Blocking path traversal with a regex such as `\\.\\./` misses variants that are decoded or normalized later, such as `..%2f` or `..\\`, so files outside the base directory stay reachable. Resolve the final path with `os.path.realpath` and check it lies under the base."

[[note]]
level = "advanced"
topic = "Regex"
text = "A regex search-and-replace over a database dump breaks PHP-serialized values, which store each string's length, as in `s:11:\"example.com\";`, so changing a domain corrupts every such record. Use a serialization-aware tool such as WP-CLI's `wp search-replace`."

[[note]]
level = "advanced"
topic = "Git"
text = "`git merge -s ours` records a merge but discards every change from the other branch, while `-X ours` only prefers your side in conflicting hunks. Confusing the two silently drops work."

[[note]]
level = "advanced"
topic = "Regex"
text = "When you choose targets with `grep -f hosts.txt`, a blank line in the pattern file matches every line, so the destructive step that follows runs on every host. Strip empty lines first, and add `-x` so that `web1` does not also select `web10`."

[[note]]
level = "advanced"
topic = "Git"
text = "`git filter-branch` warns that its gotchas can mangle history and suggests `git filter-repo` instead. Whichever tool you use, rewrite a fresh `--mirror` clone and keep the original as a backup."

[[note]]
level = "advanced"
topic = "Git"
text = "After you purge a file from Git history, one teammate pushing a branch from an old clone puts it right back. Have everyone re-clone, and delete stale branches and forks that still carry the old commits."

[[note]]
level = "advanced"
topic = "Security"
text = "Rewriting Git history doesn't unleak a pushed secret: clones, forks, caches and CI logs may already hold copies. Revoke and rotate the credential first; scrubbing the history afterwards is only cleanup."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Switching a column to an accent- or case-insensitive collation, such as MySQL's `utf8mb4_0900_ai_ci`, makes `José` and `Jose` equal, so a unique index fails to build or a later upsert overwrites the other person's row. Query for colliding values before the change."

[[note]]
level = "advanced"
topic = "Git"
text = "Running Git inside a repository someone else created can execute commands from its `.git/config`, such as a `core.fsmonitor` hook. The `safe.directory` ownership check exists to stop this, so don't set it to `*` on shared machines."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Normalizing stored text with NFKC or NFKD rewrites it for good: `²` becomes `2`, `ﬁ` becomes `fi` and full-width letters turn into ASCII. Store text in NFC, and apply NFKC only to derived keys used for matching or uniqueness checks."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Validate input after it has been decoded and normalized, never before: a filter that runs first can be bypassed with characters that NFKC later turns into `<` or `/`, such as the full-width `＜` (U+FF1C). Normalize first, then check."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Making a private repository public exposes every commit ever pushed to it, not just the current files. Scan the full history for secrets first, or publish a new repository starting from a single clean commit."

[[note]]
level = "advanced"
topic = "GitHub"
text = "After a force-push removes a sensitive commit, GitHub can still serve it by hash through cached views and pull requests that reference it. Rotate the secret, then ask GitHub Support to purge those cached references."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Renaming a GitHub account or organization frees its old name for anyone to register, and links, `go get` paths or `uses:` lines still pointing there can start fetching their code. Update every reference before you rename."

[[note]]
level = "advanced"
topic = "Time"
text = "A retention job that deletes backups older than 30 days also deletes the last good one if new backups silently stopped weeks ago. Always keep a minimum number of backups regardless of age, and alert when the newest one is too old."

[[note]]
level = "advanced"
topic = "Time"
text = "Snowflake-style ID generators embed the clock, so if a host's clock steps backward they can hand out IDs that were already used. Make the generator refuse to issue IDs until the clock passes the last timestamp it used, and alert when that happens."

[[note]]
level = "advanced"
topic = "Time"
text = "Reducing a timestamp column's precision, as with `ALTER COLUMN ... TYPE timestamp(0)` in PostgreSQL, rounds every stored value in place, so events within the same second lose their order for good. Add a sequence column before coarsening timestamps, and back up the table first."

[[note]]
level = "advanced"
topic = "Time"
text = "If a host's clock jumps years ahead because of a faulty or spoofed time source, retention jobs delete data they now think is old, and caches and certificates expire at once. Use several NTP sources so one bad server is outvoted, and make deletion jobs sanity-check the date."

[[note]]
level = "advanced"
topic = "Databases"
text = "`ALTER TABLE ... SET UNLOGGED` speeds up PostgreSQL writes to that table, but after a crash the table is emptied, and it is never replicated to standbys. Keep it for data you can rebuild; `SET LOGGED` switches back by rewriting the table."

[[note]]
level = "advanced"
topic = "Databases"
text = "Setting `session_replication_role = replica` in PostgreSQL to speed up a bulk load also skips foreign key checks, which run as triggers, so orphaned rows go in and are never checked later. Validate the loaded data before relying on it."

[[note]]
level = "advanced"
topic = "SQL"
text = "PostgreSQL's `DROP OWNED BY` drops every object the role owns in the current database, not just its privileges. Before removing a role, run `REASSIGN OWNED BY old_role TO new_role`, then `DROP OWNED` to revoke what remains."

[[note]]
level = "advanced"
topic = "SQL"
text = "In SQL Server's `MERGE`, a `WHEN NOT MATCHED BY SOURCE THEN DELETE` clause deletes every target row missing from the source, so merging in a partial batch wipes the rest of the table. Restrict the clause with a condition, or keep deletes separate."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Actions masks secrets by matching their stored values, so a value derived from one, such as a signed token, a substring or a re-encoded copy, can print in clear. Register each derived value with `echo \"::add-mask::$value\"` before anything can print it."

[[note]]
level = "advanced"
topic = "Performance"
text = "Setting `enable_seqscan = off` server-wide in PostgreSQL to force index use makes the planner avoid sequential scans even where they are far cheaper, degrading unrelated queries. Use such planner switches only in one session, for diagnosis."

[[note]]
level = "advanced"
topic = "Data"
text = "Delta Lake refuses `VACUUM ... RETAIN 0 HOURS` until you disable its retention check, for good reason: it deletes the files that older table versions need, ending time travel and breaking queries still reading those versions. Keep the default seven days."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Writing untrusted text to `$GITHUB_ENV` lets it define variables like `NODE_OPTIONS` or `LD_PRELOAD` for every later step, which amounts to code execution. Never write values an outsider controls there; a single newline in one can add a variable."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Two deploy runs that overlap can interleave their steps and leave production on a mix of versions. Serialize them with a `concurrency` group per environment, and keep `cancel-in-progress: false` so no deploy is killed halfway."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Shortening a hash to its first 8 hex characters leaves 32 bits, so collisions become likely after about 77,000 items, and deduplicating on it then merges unrelated records. Keep at least 64 bits, or compare full hashes before deleting anything."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "A release workflow that restores a cache trusts whatever earlier runs saved there, including runs that executed untrusted code. Build published artifacts from a clean state with no cache, so a poisoned entry can't reach your users."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Store production deploy credentials as environment secrets guarded by required reviewers and branch rules, so a workflow edited on some other branch can't reach them without someone approving the job."

[[note]]
level = "advanced"
topic = "Databases"
text = "Switching PostgreSQL to `wal_level = minimal` for faster bulk loads requires turning off archiving and replication, and makes every base backup taken before the change useless for point-in-time recovery. Take a fresh base backup once you switch back."

[[note]]
level = "advanced"
topic = "Security"
text = "Authorization code that treats an error or timeout from the permission check as allowed fails open, so an outage of the policy service grants everyone access. Deny by default whenever the check cannot complete."

[[note]]
level = "advanced"
topic = "CI"
text = "A CI system that exposes secrets to builds of pull requests from forks gives them to anyone who opens one, because the pull request controls the build scripts. Run fork builds without secrets and do trusted steps after merge."

[[note]]
level = "advanced"
topic = "CI"
text = "If any branch can trigger the production deploy job, anyone with push access can ship unreviewed code. Restrict production deploys to protected branches or tags that require review before anything lands on them."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "A JWT verifier that fetches keys from the token's own `jku` or `x5u` header, or trusts a `jwk` embedded in it, lets attackers sign tokens with their own key. Take verification keys only from your issuer's configured key set."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Turning a password into an encryption key by padding or truncating it to 16 or 32 bytes gives a key with the password's small entropy and no salt. Derive keys from passwords with Argon2id, scrypt or PBKDF2 and a random salt."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "`npm install` runs the install scripts of every package in the dependency tree with your permissions. Set `ignore-scripts=true` in `.npmrc` and run the few build steps you actually need explicitly."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Cloning a VM image after its first boot copies its SSH host keys and other generated secrets to every clone, so one compromised machine can impersonate all the others. Clear them from images and generate them on each first boot."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "`pip install --trusted-host <host>` turns off certificate checks for that index, so anyone on the network path can swap the packages you install. Point pip at the right CA bundle with `--cert` instead."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "A long-lived registry token stored in CI lets whoever steals it publish malware under your package's name. Where the registry supports it, publish with short-lived OIDC credentials (trusted publishing), and require 2FA for maintainers."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "A `<script>` loaded from a third-party CDN runs with full access to your page, so a compromised CDN compromises you. Add an `integrity` hash and `crossorigin` so the browser refuses a modified file, or host the file yourself."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "`torch.load` unpickles the file it reads, so a model downloaded from an untrusted source can run code when loaded. Prefer the safetensors format, or pass `weights_only=True` when loading weights."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Exact version pins in `requirements.txt` still trust the index to serve the same files. Add `--hash=sha256:...` entries so pip rejects any artifact that changed; one hash switches hash checking on for the whole file."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "A pull request that changes `distributionUrl` in `gradle-wrapper.properties`, or replaces `gradle-wrapper.jar`, can make every build run code of the author's choosing. Set `distributionSha256Sum` and validate the wrapper JAR in CI."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "`brew tap` of a third-party repository lets its owner ship formulas that run their own install code with your permissions, updated every time you run `brew update`. Tap only repositories you trust as much as the tools themselves."

[[note]]
level = "advanced"
topic = "Python"
text = "`pip install --break-system-packages` means what it says: it can replace modules your distribution's own tools import, behind the package manager's back. Use a virtual environment, or `pipx` for command-line tools."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Importing a library's private code, such as modules whose names start with an underscore, opts you out of its compatibility promises: any patch release can change or remove it. Ask for a public API, or pin the version and wrap the call."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Downgrading a dependency to escape a new bug can put you back on a version with published vulnerabilities, and the pin that holds it there tends to outlive the bug. Record why and when to remove the pin, and check the old version's advisories."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Upgrading a dependency that you patch at install time, with a tool such as `patch-package`, can make the patch fail to apply or reapply a fix that upstream has since made differently. Review every patch whenever its package version changes."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Dropping support for an old Python version without raising `requires-python` lets pip install your new release on that interpreter, where it fails. Raise `requires-python`, and pip keeps old interpreters on your last compatible release."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "`FROM debian:stable` pulls whatever that tag points to at build time, so a compromised or broken image pushed upstream flows straight into your next build. Pin base images by digest (`FROM debian@sha256:...`) and move the pin deliberately after reviewing each update."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Changing a public Java method's return type, even to a subtype, breaks already compiled callers with `NoSuchMethodError`, although their source still compiles. Add a method with a new name and deprecate the old one until a major release."

[[note]]
level = "advanced"
topic = "Releases"
text = "A release pipeline that fails halfway and is rerun from the start stops at the first registry that already has the version, and the remaining ones never get it. Make each publish step skip targets that already hold that exact version."

[[note]]
level = "advanced"
topic = "Containers"
text = "Without a `.dockerignore`, `COPY . .` bakes `.env` files, `.git` history and local credentials into the image. Start the `.dockerignore` with `*` and re-include only what the build needs with `!` lines."

[[note]]
level = "advanced"
topic = "Releases"
text = "Pushing a new image over an existing tag like `v1.4.2` changes what every future pull gets, so new and restarted nodes can run different code than old ones. Make release tags immutable in your registry and deploy by digest."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Kubernetes Secrets are only base64-encoded, and etcd stores them unencrypted unless you configure encryption at rest. Anyone who can read the Secret object, or an etcd backup, has the value."

[[note]]
level = "advanced"
topic = "Releases"
text = "With tools that derive versions from commit messages, one stray `BREAKING CHANGE:` footer or `!` in a squashed commit publishes a new major version that cannot be taken back. Review the computed version before the publish step runs."

[[note]]
level = "advanced"
topic = "Releases"
text = "A canary that serves only employees or a single test region misses failures that depend on real customer data, devices and load. Include a random slice of real traffic before calling a release safe."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Rebuilding an old release with today's compiler or base image and shipping it under the original version gives users different bytes under the same name. Give every rebuild a new version or build number."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Permission to create pods in a namespace lets a user mount any Secret there and run as any ServiceAccount there, inheriting all their access. Grant pod creation as carefully as you would grant those secrets directly."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "A build cache keyed only on source files serves outputs built with an old compiler or different flags after you change them. Include the toolchain version, flags and environment in every cache key."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "`kubectl drain` evicts pods with no regard for availability unless a PodDisruptionBudget says otherwise, so node maintenance can evict every replica of a service at once. Define PDBs before you drain nodes."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "A build that picks up settings from your home directory, such as `~/.npmrc`, `~/.m2/settings.xml` or your global Git config, can pass for you and fail in CI or for teammates. Keep build settings in the repository."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Overwriting a published dataset or model file in place, under the same name or version, silently changes every analysis that reads it. Publish each change as a new version and keep the old ones."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "`kubectl delete pod --force --grace-period=0` on a StatefulSet pod can let a replacement start while the old pod still runs on an unreachable node, so two pods write as one identity. Confirm the node is really down first."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "A Kubernetes Job retries failed pods up to `backoffLimit` times, six by default, so a task that is not idempotent, such as sending invoices, can run again after failing halfway. Set `backoffLimit: 0` for work that must not repeat on its own."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "RBAC rights to `bind` or `escalate` roles, or to `impersonate` users and groups, let a subject grant itself any permission in its scope, up to `cluster-admin`. Grant these verbs as carefully as you would grant cluster-admin itself."

[[note]]
level = "advanced"
topic = "Containers"
text = "`docker commit` snapshots a container's whole filesystem, including credentials, shell history and temp files written at run time, into an image layer anyone who pulls it can read. Rebuild from a Dockerfile instead of committing a live container."

[[note]]
level = "advanced"
topic = "Containers"
text = "`--security-opt seccomp=unconfined` removes Docker's default syscall filter, which blocks rarely needed calls such as `keyctl` and `mount` and so shrinks the kernel attack surface a container can reach. Keep the default, or extend a copy with only the syscall you need."

[[note]]
level = "advanced"
topic = "SQL"
text = "`TRUNCATE` skips `ON DELETE` triggers, so audit rows and cleanup logic built on them never run. In MySQL and Oracle it also commits immediately and can't be rolled back; use `DELETE` when those guarantees matter."

[[note]]
level = "advanced"
topic = "CI"
text = "Never point CI tests at a production database or bucket: one wrong fixture, migration or teardown step then deletes real data. Give CI its own disposable resources, and credentials that cannot reach production at all."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "A workflow triggered by `issue_comment` runs with your secrets and a write token for any commenter, including strangers on a public repository. Before acting on a command like `/deploy`, check `github.event.comment.author_association`."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Workflows triggered by `schedule`, `issue_comment` or `workflow_run` always use the file on the default branch, so switching the default to a branch with older workflow files silently brings back those older, perhaps unsafe versions."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Objects moved to an archive storage class such as S3 Glacier Deep Archive cannot be read until a restore request finishes, which takes hours, so a lifecycle rule that archives too eagerly can leave data unavailable exactly when you need it quickly."

[[note]]
level = "advanced"
topic = "Cloud"
text = "An AWS KMS key policy that stops trusting the account, and names no administrator who still exists, makes the key unmanageable; regaining control then takes AWS Support. Keep the default statement that trusts the account."

[[note]]
level = "advanced"
topic = "Cloud"
text = "An S3 bucket policy that denies everyone except one role locks your administrators out too, and if that role is deleted, only the account's root user can remove the policy. Test deny-based bucket policies with a principal you can still use to undo them."

[[note]]
level = "advanced"
topic = "Databases"
text = "`CREATE INDEX CONCURRENTLY` avoids blocking writes, but if it fails it leaves an `INVALID` index behind that still adds overhead to every write. Drop the leftover index before retrying the build."

[[note]]
level = "advanced"
topic = "CI"
text = "A CI cleanup step that deletes cloud resources by name pattern, such as every bucket starting with `test-`, will one day match something that is not a test resource. Tag what each run creates with its run ID, and delete only by that tag."

[[note]]
level = "advanced"
topic = "Databases"
text = "Deleting files from `pg_wal` by hand to free disk space can leave PostgreSQL unable to recover or even start. Find what is retaining WAL, such as a stuck replication slot or a failing `archive_command`, and fix that instead."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "`terraform state push -force` replaces the remote state even when its serial or lineage shows your copy is older or from another project, so Terraform forgets resources or plans to recreate them. Save the current state with `terraform state pull` first."

[[note]]
level = "advanced"
topic = "Databases"
text = "A filesystem snapshot of a running database restores cleanly only if it captures every data and log volume at the same instant. Snapshotting volumes one at a time can restore to an inconsistent state; use the database's own backup tooling instead."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "In the AWS CDK, renaming a construct's ID or moving it under a different parent changes its CloudFormation logical ID, so the next deploy creates an empty replacement and deletes the old resource unless its removal policy retains it. Run `cdk diff` first."

[[note]]
level = "advanced"
topic = "Databases"
text = "A down migration that re-adds a dropped column restores the column, not the data that was in it. Before a destructive migration, copy the data aside, or leave the column in place until a later release."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "The Terraform resource `aws_iam_policy_attachment` is exclusive: it detaches its policy from every user, role and group in the account that it does not list. Use `aws_iam_role_policy_attachment` and its siblings, which leave other attachments alone."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Secrets placed in a workflow-level `env:` block reach every step of every job, including third-party actions that never needed them. Pass each secret only to the step that uses it, through that step's own `env:`."

[[note]]
level = "advanced"
topic = "Databases"
text = "Setting `fsync = off` in PostgreSQL speeds up writes but can leave the database unrecoverably corrupted after a crash or power loss. If you need faster commits, `synchronous_commit = off` risks losing only the most recent transactions."

[[note]]
level = "advanced"
topic = "Databases"
text = "PostgreSQL row-level security never applies to superusers, and applies to a table's owner only with `FORCE ROW LEVEL SECURITY`. An app connecting as the owner sees every tenant's rows, so connect as a separate, non-owner role."

[[note]]
level = "advanced"
topic = "Databases"
text = "An application that connects as a PostgreSQL superuser turns any SQL injection into command execution on the server, through `COPY ... FROM PROGRAM`. Give the app a role with only the privileges it needs."

[[note]]
level = "advanced"
topic = "Databases"
text = "A forgotten `PREPARE TRANSACTION` in PostgreSQL survives restarts, keeps its locks and blocks vacuum from cleaning up. Watch `pg_prepared_xacts`, and leave `max_prepared_transactions` at 0 unless you actually use two-phase commit."

[[note]]
level = "advanced"
topic = "Performance"
text = "Redis executes commands one at a time, so `KEYS *` on a large production instance blocks every other client until it finishes. Iterate with `SCAN`, which walks the keyspace in small batches."

[[note]]
level = "advanced"
topic = "Performance"
text = "`VACUUM FULL` rewrites the whole table under an `ACCESS EXCLUSIVE` lock and needs disk space for a complete copy, which on a large production table means an outage. Plain `VACUUM` makes dead space reusable without blocking reads or writes."

[[note]]
level = "advanced"
topic = "Performance"
text = "Changing a column's type in PostgreSQL usually rewrites the table and rebuilds its indexes while holding an `ACCESS EXCLUSIVE` lock. On a big table, add a new column, backfill it in batches and switch over instead."

[[note]]
level = "advanced"
topic = "Performance"
text = "A single `DELETE` of millions of rows holds its locks for the whole run, produces a huge burst of WAL or binlog, and can leave replicas far behind. Delete in small batches by primary key range, committing between them."

[[note]]
level = "advanced"
topic = "Networking"
text = "Applying a network change on a remote host, such as `netplan apply` with a wrong gateway, can cut off the SSH session you need to fix it. On Ubuntu, run `netplan try` instead: it reverts the change unless you confirm it within two minutes."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Dropping or renaming a column in the same release that stops using it breaks the old instances still serving traffic during the rollout. Ship the code change first, then remove the column in a later release."

[[note]]
level = "advanced"
topic = "Unicode"
text = "MySQL's `utf8` character set is a 3-byte subset that can't store emoji and other 4-byte characters, and in non-strict mode it silently truncates the value at the first one. Use `utf8mb4`."

[[note]]
level = "advanced"
topic = "DNS"
text = "Secondary nameservers transfer a zone only when its SOA serial goes up, so lowering the serial, as when switching from a date format to a small counter, leaves every secondary serving stale data until each is reloaded by hand. Only ever increase the serial."

[[note]]
level = "advanced"
topic = "Python"
text = "Unpickling runs code chosen by whoever produced the bytes, and `shelve` files and many machine learning checkpoints are pickles underneath. Never load any of them from an untrusted source; exchange data across trust boundaries as JSON or another data-only format."

[[note]]
level = "advanced"
topic = "Python"
text = "PyYAML's `yaml.safe_load` builds only plain data, while loaders such as `yaml.UnsafeLoader` can construct arbitrary Python objects from tags in the document. Use `safe_load` for anything you didn't write yourself."

[[note]]
level = "advanced"
topic = "Observability"
text = "Starting Prometheus with `--web.enable-admin-api` lets anyone who can reach its port delete series or snapshot the database through `/api/v1/admin/tsdb/`, and Prometheus has no authentication unless you configure it. Leave the flag off, or front it with an authenticating proxy."

[[note]]
level = "advanced"
topic = "Python"
text = "Never use a user-supplied string as the template for `str.format`: fields like `{0.__init__.__globals__}` walk object attributes and can expose secrets such as configuration values. Use `string.Template` or fixed templates."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Before running a data fix during an incident, copy the rows it will touch into a backup table, as with `CREATE TABLE orders_backup AS SELECT * FROM orders WHERE ...`. If the fix is wrong, you restore exactly those rows instead of the whole database."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Setting `unclean.leader.election.enable=true` in Kafka lets an out-of-sync replica become leader after a failure, silently discarding messages producers were told were committed. Keep it off for data you cannot lose, and pair `acks=all` with `min.insync.replicas=2`."

[[note]]
level = "advanced"
topic = "Testing"
text = "A load test against an endpoint that calls third-party APIs sends them your test volume too, which can use up your quota, trip their abuse detection and get your API key suspended for production as well. Stub external calls at the boundary during load tests."

[[note]]
level = "advanced"
topic = "Python"
text = "Installing a source distribution runs its build code with your permissions before you ever import the package. `pip install --only-binary :all:` refuses source distributions, so nothing gets built on your machine."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Setting `kernel.yama.ptrace_scope` to 0 so you can attach a debugger without root lets any process read and change the memory of every other process running as the same user, SSH agents and browsers included. Use `sudo gdb -p <pid>` for the one session instead."

[[note]]
level = "advanced"
topic = "Networking"
text = "With `GatewayPorts yes` in the server's `sshd_config`, `ssh -R 8080:localhost:3000 host` publishes your laptop's port 3000 on the server's public addresses instead of its loopback. Leave `GatewayPorts` off, and check `ss -tln` on the server after opening a reverse tunnel."

[[note]]
level = "advanced"
topic = "DNS"
text = "DNS-as-code tools such as OctoDNS and DNSControl treat your config as the whole zone, so records missing from it, including ones other teams created by hand, get deleted on apply. Import the live zone first, and read the planned deletions before applying."

[[note]]
level = "advanced"
topic = "Observability"
text = "W3C `baggage` entries travel with every outgoing call, including calls to third-party APIs, so user IDs or internal flags placed there leave your company. Strip baggage at your egress, and never put sensitive data in it."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Purging your entire CDN cache during an incident sends every request to the origin at once, and an origin sized for cache misses may collapse under it. Purge only the affected paths, and warm critical content before a full purge."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Auto-increment IDs generated separately on each shard, region or tenant database collide as soon as you merge or move data between them, and renumbering breaks every stored reference. Use globally unique IDs, such as UUIDs, from the start."

[[note]]
level = "advanced"
topic = "Web"
text = "Anything in `localStorage` is readable by every script on the origin, so one XSS bug can exfiltrate stored tokens. Keep session tokens in `HttpOnly`, `Secure`, `SameSite` cookies, which scripts can't read."

[[note]]
level = "advanced"
topic = "Web"
text = "Bundlers inline the environment variables your front-end code references into files that every visitor downloads. Keep secrets on the server, and treat every value in client code as public."

[[note]]
level = "advanced"
topic = "Testing"
text = "A load test against an autoscaled environment scales out as designed, and a runaway test or a script left running overnight can multiply your bill before anyone notices. Set a maximum instance count and a spending alert, and give every test a fixed end time."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Writing `c` to `/proc/sysrq-trigger` to test kdump crashes the kernel on the spot, with no clean shutdown and no flush of unwritten data. Run it only on a host drained of traffic, after `sync`, and never on a shared machine."

[[note]]
level = "advanced"
topic = "Networking"
text = "SNMP v1 and v2c authenticate with a plain-text community string, often still `public`, and a writable community lets anyone on the path change device settings. Use SNMPv3 with authentication and encryption, and keep write access off untrusted networks."

[[note]]
level = "advanced"
topic = "DNS"
text = "ACME DNS-01 automation holding an API token for your whole DNS account lets anyone who compromises that server rewrite every record, `MX` and `NS` included. Scope the token to one zone, or `CNAME` `_acme-challenge` to a separate zone and limit the token to that."

[[note]]
level = "advanced"
topic = "Observability"
text = "Error trackers that capture local variables and request data with each exception send whatever those held, passwords and tokens included, to the tracking service. Configure scrubbing of sensitive fields before turning capture on in production."

[[note]]
level = "advanced"
topic = "Go"
text = "`filepath.Join(root, name)` resolves `..` elements, so a `name` like `../../etc/passwd` yields a path outside `root`. Reject names that fail `filepath.IsLocal`, or open files through an `os.Root`, which also blocks symlink escapes."

[[note]]
level = "advanced"
topic = "Networking"
text = "`iptables-restore` replaces every chain in the tables it loads, wiping rules that Docker or Kubernetes added at runtime and breaking container networking until those services rebuild them. Use `--noflush`, or change rules through the tool that owns them."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Setting `cleanup.policy=compact` on a Kafka topic that stores an event history keeps only the latest record for each key, permanently deleting the earlier events that replays and new consumers need. Compact only topics that hold current state."

[[note]]
level = "advanced"
topic = "Go"
text = "A Go server started with `http.ListenAndServe` has no read or write timeouts, so slow clients can hold connections open indefinitely and exhaust resources. Build an `http.Server` with `ReadHeaderTimeout` and the other timeouts set."

[[note]]
level = "advanced"
topic = "Testing"
text = "Copying a production database into a test or staging environment puts customer data where access is broader, logs are verbose and backups go unmanaged, and a breach there is still a breach of real people's data. Mask or synthesize the data before it leaves production."

[[note]]
level = "advanced"
topic = "Rust"
text = "`cargo yank` doesn't delete a published crate version: existing lockfiles can still download it, so any secret inside stays public. Check exactly what will ship with `cargo package --list` before running `cargo publish`."

[[note]]
level = "advanced"
topic = "Rust"
text = "Undefined behavior from one `unsafe` block can surface far away, because the compiler optimizes safe code assuming the block upheld its invariants. Keep `unsafe` small, write down the invariant each block relies on, and run tests under Miri."

[[note]]
level = "advanced"
topic = "Rust"
text = "`std::process::exit` skips destructors, so a `BufWriter` that hasn't flushed silently loses its buffered output. Flush explicitly before exiting, or return from `main` so values are dropped normally."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Leaving `SSLKEYLOGFILE` set after debugging makes browsers and many TLS libraries keep writing session secrets to that file, and anyone holding it and a packet capture can decrypt the traffic. Set it for one process only, and delete the file afterward."

[[note]]
level = "advanced"
topic = "Java"
text = "Java's standard XML parsers resolve external entities unless configured otherwise, so parsing untrusted XML can read local files or reach internal hosts. Disable DTDs on the parser factory (the `disallow-doctype-decl` feature) before parsing."

[[note]]
level = "advanced"
topic = "Networking"
text = "Exposing the Docker daemon on TCP port 2375 without TLS gives anyone who can reach it root on the host, because they can start a privileged container that mounts `/`. Keep the daemon on its Unix socket, or require mutual TLS on port 2376."

[[note]]
level = "advanced"
topic = "DNS"
text = "If your domain's nameservers are named under another domain, such as `ns1.old-agency.net`, and that domain lapses, whoever registers it next controls your DNS. Keep nameserver domains under your own renewal monitoring, or use your DNS provider's names."

[[note]]
level = "advanced"
topic = "C"
text = "`printf(msg)` with user-controlled `msg` lets `%x` read the stack and `%n` write to memory. Always pass a literal format, as in `printf(\"%s\", msg)`, and build with `-Wformat-security`."

[[note]]
level = "advanced"
topic = "C"
text = "Signed integer overflow is undefined behavior in C, so the compiler may delete an overflow check like `if (len + 100 < len)` entirely. Compare against `INT_MAX - 100` before adding, or use `__builtin_add_overflow` in GCC and Clang."

[[note]]
level = "advanced"
topic = "C"
text = "A variable-length array or `alloca` sized by untrusted input can jump past the stack guard page into other memory. Cap the size or allocate on the heap, and build with `-fstack-clash-protection`."

[[note]]
level = "advanced"
topic = "C"
text = "Checking a path with `access()` and then calling `open()` leaves a window in which the file can be swapped for a symlink, which is exploitable in privileged programs. Open the file first, then check the descriptor with `fstat()`."

[[note]]
level = "advanced"
topic = "C"
text = "Calling `printf` or `malloc` inside a signal handler can deadlock or corrupt the heap if the signal interrupts the same function. Only set a `volatile sig_atomic_t` flag in the handler and act on it from the main loop."

[[note]]
level = "advanced"
topic = "Observability"
text = "A Grafana data source that connects with a database account able to write lets anyone who can edit a dashboard run `DELETE` or `UPDATE` from a query panel. Give data sources read-only accounts, ideally on a replica."

[[note]]
level = "advanced"
topic = "HTTP"
text = "An HSTS header with a long `max-age` and `includeSubDomains` makes browsers refuse plain HTTP on every subdomain for that whole period. Roll it out with a short `max-age`, and raise it only once every subdomain serves HTTPS."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Draining a whole region or zone during an incident moves its traffic onto the rest, and if they lack the headroom, a partial outage becomes a global one. Check spare capacity before shifting, move traffic in steps, and watch saturation as you go."

[[note]]
level = "advanced"
topic = "Networking"
text = "With the default `AllowTcpForwarding yes`, any account that can log in over SSH, even one with a restricted shell, can tunnel into every network the server reaches. Turn forwarding off in `sshd_config` and allow it only for named users in a `Match` block."

[[note]]
level = "advanced"
topic = "Testing"
text = "Test accounts in production that skip MFA, rate limits or payment checks so automated tests can run are backdoors with known credentials. Give them no special privileges, keep their credentials in your secrets manager, and rotate them like any other secret."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Crawlers, link previews and browser prefetching follow GET links, so an endpoint like `GET /items/42/delete` will eventually delete data nobody meant to. Require `POST` or `DELETE` for anything that changes state."

[[note]]
level = "advanced"
topic = "HTTP"
text = "When a proxy and a backend disagree about whether `Content-Length` or `Transfer-Encoding` defines the body, attackers can smuggle a hidden request past the proxy. Reject requests that carry both headers at the edge."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Trusting a debugging proxy's root certificate, such as the one mitmproxy or Charles generates, lets anyone who obtains its private key intercept all of that machine's HTTPS traffic. Remove it from the trust store when you finish, and never install it on servers."

[[note]]
level = "advanced"
topic = "Networking"
text = "Removing a backend from a load balancer without connection draining cuts off its in-flight requests, including half-finished uploads, payments and WebSocket sessions. Enable draining, such as a deregistration delay, and let connections finish before stopping the server."

[[note]]
level = "advanced"
topic = "DNS"
text = "A BIND `allow-update` rule that accepts dynamic updates by source address lets any host in that range, or anyone spoofing one, rewrite your zone, `MX` and `NS` records included. Require TSIG-signed updates and limit each key to its names with `update-policy`."

[[note]]
level = "advanced"
topic = "APIs"
text = "Removing or renaming a field in a public API breaks clients you can't see or update. Add the replacement alongside, mark the old field deprecated, and remove it only after measuring that clients have moved off it."

[[note]]
level = "advanced"
topic = "APIs"
text = "Binding request JSON straight onto a database model lets clients set fields you never meant to expose, like `role` or `account_id`. Copy input through an explicit allowlist of writable fields."

[[note]]
level = "advanced"
topic = "APIs"
text = "Authenticating a request isn't authorizing it: an endpoint like `GET /invoices/{id}` must also confirm the invoice belongs to the caller, or any user can walk through everyone's IDs."

[[note]]
level = "advanced"
topic = "Observability"
text = "Elasticsearch fixes a field's type from the first document that contains it, and a mapping cannot be changed in place, so if one service logs `status` as a string, numeric range queries and aggregations on it break until you reindex. Define index templates for log fields."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Point-in-time recovery can return to just before a bad write only while the logs covering that moment are retained, often a matter of days. When you find corruption, extend backup retention and pause cleanup jobs before you start investigating."

[[note]]
level = "advanced"
topic = "DNS"
text = "A subdomain delegated with `NS` records to a DNS provider where the zone has since been deleted can, at many providers, be claimed by anyone who creates that zone there, handing them the subdomain. Remove the delegation when you remove the zone."

[[note]]
level = "advanced"
topic = "Security"
text = "Never let a JWT's own header choose the verification algorithm: accepting `none`, or an HMAC token checked with your RSA public key as the secret, lets attackers forge tokens. Pin the expected algorithm in the verify call."

[[note]]
level = "advanced"
topic = "Testing"
text = "Changing a shared test server's clock to test expiry logic moves time for every process on it: cron jobs fire, tokens and certificates expire, and whatever already ran cannot be undone. Fake time for one process with `faketime`, or inject a clock."

[[note]]
level = "advanced"
topic = "Debugging"
text = "`strace` prints the data passed to `read` and `write`, so a trace of a server can record passwords, tokens and request bodies in its output file. Keep string output short with `-s`, filter calls with `-e`, and delete trace files when you finish."

[[note]]
level = "advanced"
topic = "Web"
text = "Adding `'unsafe-inline'` to `script-src` to silence CSP errors switches off most of the XSS protection CSP provides. Move inline scripts into files, or allow specific ones with nonces or hashes."

[[note]]
level = "advanced"
topic = "Web"
text = "A login flow that redirects to any `next=` value lets phishers borrow your domain and can leak OAuth codes. Accept only paths on your own origin, rejecting absolute URLs and anything starting with `//` or `/\\`."

[[note]]
level = "advanced"
topic = "Web"
text = "Deleting a broken service worker's script doesn't remove it: browsers keep running the installed worker when the update check gets a 404. Deploy a replacement worker that unregisters itself, or send a `Clear-Site-Data` header."

[[note]]
level = "advanced"
topic = "Networking"
text = "Setting `net.ipv4.ip_forward=1` on a Linux host attached to two networks, with the `iptables` `FORWARD` policy left at its default `ACCEPT`, lets machines on either side route through it to the other. Set the `FORWARD` policy to `DROP` and allow only the flows you need."

[[note]]
level = "advanced"
topic = "DNS"
text = "Signing a zone with plain NSEC lets anyone list every name in it by walking the chain of denial records, exposing internal-sounding hostnames. Use NSEC3 or online signing, which make enumeration much harder, if names should stay unlisted."

[[note]]
level = "advanced"
topic = "Security"
text = "Building password reset links from the request's `Host` header lets an attacker trigger an email whose link points at their own domain, carrying a valid token. Take the public base URL from configuration instead."

[[note]]
level = "advanced"
topic = "Security"
text = "Keeping the same session ID across login lets an attacker who planted that ID beforehand ride the authenticated session. Issue a fresh session ID whenever a user's privilege level changes, especially at login."

[[note]]
level = "advanced"
topic = "Observability"
text = "Browser session-replay tools record what users see and type, and without masking that includes passwords, card numbers and health details, sent to a third party you cannot recall them from. Mask all inputs and text by default, and unmask only reviewed fields."

[[note]]
level = "advanced"
topic = "Security"
text = "When SSH warns that a host key has changed, deleting the old line from `known_hosts` and reconnecting trusts whoever answers now. Confirm the new fingerprint through another channel before accepting it."

[[note]]
level = "advanced"
topic = "Teams"
text = "Disabling a departing engineer's SSO account doesn't revoke their personal access tokens, SSH keys on servers or knowledge of shared passwords. Keep an inventory of each person's credentials and rotate shared secrets when they leave."

[[note]]
level = "advanced"
topic = "Testing"
text = "A staging environment restored from a production backup still holds production webhook URLs, API keys and customer email addresses in its data, so its background jobs can call partners and email customers. Scrub integration settings as part of every restore."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Editing or deleting past events in an event-sourced store rewrites history that projections, audit trails and downstream consumers have already acted on, and they will not see the change. Append a correcting event instead, and rebuild projections deliberately."

[[note]]
level = "advanced"
topic = "Cloud"
text = "On AWS, instances that still allow IMDSv1 hand their role credentials to any SSRF bug that can make a GET request to the metadata service. Require IMDSv2 by setting `HttpTokens` to `required`."

[[note]]
level = "advanced"
topic = "Security"
text = "A process running as root inside a `chroot` can break out of it, because `chroot` only changes how paths resolve and was never designed as a security boundary. Drop root privileges after entering it, or isolate with namespaces or containers."

[[note]]
level = "advanced"
topic = "Testing"
text = "Mirroring production traffic to a new version also mirrors its writes: a shadow service that charges cards, sends email or writes to shared tables does it a second time. Stub side effects in the shadow, give it its own datastore, or mirror only reads."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Running `sed -i` over many files through `find` or `xargs` rewrites every one in place, so a wrong pattern corrupts them all at once with no undo. Commit or copy first, and preview the matches with `grep` or `sed -n 's/old/new/p'` before editing."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Non-cryptographic hashes such as CRC32 or MurmurHash can be collided on purpose, so using them to verify or deduplicate untrusted content lets an attacker substitute data that passes the check. Use SHA-256 or another cryptographic hash when inputs can be adversarial."

[[note]]
level = "advanced"
topic = "Java"
text = "Evaluating user input as an expression, with Spring's SpEL, Struts' OGNL or a `ScriptEngine`, gives attackers code execution on your server. Never pass untrusted strings to an expression evaluator; map user choices to fixed expressions instead."

[[note]]
level = "advanced"
topic = "Java"
text = "Enabling polymorphic type handling for untrusted JSON in Jackson, as with `activateDefaultTyping`, lets the input name classes to instantiate, which has led to many remote code execution flaws. Keep default typing off, or restrict it to an allowlist of your own types."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Enabling `nodeIntegration` or disabling `contextIsolation` in an Electron window lets any script in that page, including injected or remote content, run Node.js with full access to the user's machine. Keep the secure defaults and expose narrow APIs through a preload script."

[[note]]
level = "advanced"
topic = "Rust"
text = "Writing `unsafe impl Send` or `unsafe impl Sync` for a type that is not actually thread-safe lets safe code race on it, and the compiler will never warn about it again. Assert these only after proving every field can be moved or shared across threads."

[[note]]
level = "advanced"
topic = "Go"
text = "Converting user input to `template.HTML`, `template.JS` or `template.URL` tells `html/template` the value is already safe, so it is inserted unescaped and becomes an XSS hole. Use those types only for content you generated or sanitized yourself."

[[note]]
level = "advanced"
topic = "Rust"
text = "Letting a Rust panic unwind out of an `extern \"C\"` function into C code is undefined behavior on older compilers and an abort on newer ones, so one panic in a callback can crash or corrupt the host program. Wrap the body of every exported function in `std::panic::catch_unwind`."

[[note]]
level = "advanced"
topic = "Regex"
text = "Stripping HTML tags with a regular expression misses malformed, nested and encoded markup that browsers still execute, so it does not stop XSS. Escape output for its context, or use a maintained HTML sanitizer when you must accept markup."

[[note]]
level = "advanced"
topic = "Security"
text = "Turning off CSRF protection for an API that browsers call with cookie authentication lets any website trigger authenticated actions as your users. Keep CSRF tokens, or require a custom header that cross-site forms cannot send."

[[note]]
level = "advanced"
topic = "CI"
text = "Caching a directory that holds credentials, such as `~/.docker` or a home directory containing `.npmrc`, stores the secret in the CI cache, where other branches and pull requests can restore it. Exclude credential files from cached paths."

[[note]]
level = "advanced"
topic = "Linux"
text = "Editing `/etc/passwd`, `/etc/shadow` or `/etc/group` with an ordinary editor can race with tools that change them at the same moment, and a malformed line can lock users out. Use `vipw` and `vigr`, which lock the files while you edit."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Attaching a debugger such as `gdb` to a production process pauses it, and a breakpoint freezes a thread that may hold locks others need, so a quick look can become an outage. Prefer sampling tools such as `perf` or `py-spy`, or take a core with `gcore`."

[[note]]
level = "advanced"
topic = "Code review"
text = "Checking out a contributor's pull request and running its tests or build on your machine executes their code with your credentials and SSH keys. Read the diff first, and run untrusted changes in a disposable container or VM."

[[note]]
level = "advanced"
topic = "Security"
text = "Running an active security scanner against production submits every form and follows every link, creating, changing or deleting real data. Point it at a staging copy, or limit it to passive checks on production."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Workarounds applied during an incident, such as a firewall rule opened wide, an auth check disabled or admin rights granted, tend to outlive it. Record each one with an owner and an expiry, and undo it as part of the follow-up."

[[note]]
level = "advanced"
topic = "Tooling"
text = "A bulk rename in a shell loop can map several files to the same name, and each `mv` silently overwrites the one before it, with no undo. Print the planned `mv` commands first, and use `mv -n`, which refuses to overwrite."

[[note]]
level = "advanced"
topic = "DNS"
text = "A DNS resolver that answers recursive queries from anywhere on the internet gets abused to amplify attacks against other people, and its address ends up blocked. Restrict recursion to your own networks with access controls."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Keeping encryption keys in the same database, bucket or backup as the data they protect means anyone who gets the data gets the keys too, so the encryption buys nothing. Store keys in a KMS or another system with separate access control."

[[note]]
level = "advanced"
topic = "Data"
text = "Migrating a column to a narrower type, such as `BIGINT` to `INT`, text to a short `VARCHAR` or a timestamp to a date, can truncate or reject existing values, and the lost precision cannot be restored. Check the real range of the data and keep a copy first."

[[note]]
level = "advanced"
topic = "Containers"
text = "`docker run --network host` removes network isolation: the container can bind any host port and reach services that listen only on the host's loopback, such as local admin interfaces. Use the default bridge network and publish only the ports you need."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Allowing GitHub Actions to create and approve pull requests lets a workflow approve changes it made itself, satisfying a required review with no human involved. Keep that repository setting off, so approvals come from people."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Changing a Terraform backend without migrating the state leaves the new backend empty, so the next plan proposes creating every resource again, as duplicates or name conflicts. Run `terraform init -migrate-state` and check the state before applying."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "A Terraform module sourced from Git without a `ref`, or from a registry without a version constraint, runs whatever its author publishes next, with your cloud credentials. Pin modules to a tag or commit, and review upgrades like code."

[[note]]
level = "advanced"
topic = "Data"
text = "Deleting a user's records from your databases does not remove the copies in logs, traces, analytics events, caches and backups that captured them. Map where personal data flows before promising erasure, and keep it out of telemetry where you can."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Generating a private key or certificate with an online tool, or on a shared build host, leaves a copy with whoever runs that system. Generate keys where they will be used, or inside an HSM, and never paste private keys into websites."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Rotating a web framework's signing secret, such as Django's `SECRET_KEY`, invalidates existing sessions, password reset links and everything else it signed, logging out every user at once. Roll it over with a fallback key, such as `SECRET_KEY_FALLBACKS`."

[[note]]
level = "advanced"
topic = "Networking"
text = "A mail server configured as an open relay forwards mail for anyone, and within hours it is sending spam and its address lands on blocklists that are slow to clear. Allow relaying only for authenticated users and your own networks."

[[note]]
level = "advanced"
topic = "DNS"
text = "An SPF record ending in `+all` authorizes every server on the internet to send mail as your domain, which defeats the point of SPF and helps spoofed mail pass checks. End the record with `-all` or `~all` after listing your real senders."

[[note]]
level = "advanced"
topic = "Python"
text = "`os.chmod(path, 755)` passes the decimal number 755, which is mode `0o1363`: the owner loses read access and other users gain write access. Always write file modes as octal literals, such as `0o755`."

[[note]]
level = "advanced"
topic = "Testing"
text = "Integration tests that create real cloud resources leak them whenever a run dies before teardown, and the cost or exposed endpoints pile up unnoticed. Tag everything tests create, and sweep tagged resources older than a few hours on a schedule."

[[note]]
level = "advanced"
topic = "Observability"
text = "An unauthenticated Grafana, Prometheus or `/metrics` endpoint on the internet reveals hostnames, versions and traffic patterns, and dashboards can expose data sources with stored credentials. Keep observability tools behind authentication and private networks."

[[note]]
level = "advanced"
topic = "Releases"
text = "A pipeline that deploys every merge to production with no way to pause keeps shipping new changes on top of an ongoing incident. Add a deploy freeze switch anyone on call can flip, and make flipping it an early step in your incident runbook."

[[note]]
level = "advanced"
topic = "Teams"
text = "Production access granted for a one-off task tends to stay forever, so over the years many people hold standing access nobody reviews. Grant it with an expiry, or through just-in-time access that is requested and logged."

[[note]]
level = "advanced"
topic = "Data"
text = "Deduplicating records on a key that is not truly unique, such as a name or an email that people share, deletes real records along with the duplicates. Confirm that the key identifies one entity before deleting, and keep the removed rows until someone has checked them."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "A lock taken with Redis `SETNX` and no expiry stays held forever if its owner crashes, blocking every other worker. Set the expiry atomically with `SET key token NX PX 30000`, and release the lock only if it still holds your token."

[[note]]
level = "advanced"
topic = "Web"
text = "Adding `null` to a CORS origin allowlist lets sandboxed iframes and local files on any site make credentialed requests to your API, because browsers send `Origin: null` for them. Never allow the `null` origin."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Running your app at each commit during `git bisect` against a database you care about can apply or roll back schema migrations as old versions start up. Bisect against a disposable copy of the database, and reset it between steps."

[[note]]
level = "advanced"
topic = "Debugging"
text = "A packet capture from production contains every plaintext credential, cookie and payload that crossed the interface, and capture files get passed around casually in tickets. Capture narrowly with filters, and handle the files like secrets."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Converting a MySQL table's character set in place with `ALTER TABLE ... CONVERT TO CHARACTER SET` rewrites every row under a lock and can change column types or fail on values that no longer fit. Rehearse it on a copy and check column and index lengths first."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Setting `ACTIONS_ALLOW_UNSECURE_COMMANDS` to `true` re-enables the deprecated `set-env` and `add-path` workflow commands, so any text a step prints can inject environment variables into later steps. Leave it unset."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Shutting down members of a Raft cluster such as etcd without removing them still counts them toward the majority, so one more failure loses quorum. Remove each member with `etcdctl member remove` before decommissioning it, one at a time."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Expanding a PersistentVolumeClaim is one-way: Kubernetes cannot shrink a volume afterwards, so undoing an oversized request means migrating the data to a new, smaller volume. Increase sizes in small steps."

[[note]]
level = "advanced"
topic = "Databases"
text = "`pg_resetwal` lets a damaged PostgreSQL cluster start by discarding write-ahead log, which can leave silently inconsistent data and lost transactions. Copy the data directory first, use it only as a last resort, then dump and reload the database."

[[note]]
level = "advanced"
topic = "Networking"
text = "A service listening on all interfaces behind a NAT can still be reachable from the internet over IPv6, where hosts often have public addresses and no NAT at all. Check IPv6 firewall rules, not just IPv4 port forwarding."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Loading a model with `trust_remote_code=True` in Hugging Face Transformers runs Python code from the model repository on your machine. Read that code, and pin the model to a specific revision, before enabling it."

[[note]]
level = "advanced"
topic = "Security"
text = "Disabling signature checks on SAML assertions or OpenID Connect ID tokens to get a test login working lets anyone forge a login as any user if the setting ships. Keep validation on in every environment, and use a test identity provider instead."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Changing a Kubernetes Service to `type: LoadBalancer` on most cloud providers provisions an internet-facing load balancer by default, exposing a service you meant to keep internal. Use the provider's internal load balancer annotation, or keep it behind an ingress."

[[note]]
level = "professional"
topic = "Databases"
text = "Redeploying old code does not undo a migration that dropped a column. Change schemas in two steps, expand then contract, so every release can roll back."

[[note]]
level = "professional"
topic = "Databases"
text = "Replication is not a backup: a bad `DELETE` or `DROP TABLE` reaches every replica almost at once. Keep point-in-time recovery, or a deliberately delayed replica, that still holds the data from before the mistake."

[[note]]
level = "professional"
topic = "Data"
text = "Run data-masking scripts only on a restored copy that the script creates itself, never in place on a database chosen by connection string. Pointed at production by mistake, they overwrite real names, emails and addresses with no way back."

[[note]]
level = "professional"
topic = "Databases"
text = "Before promoting a replica, fence the old primary by stopping it or cutting it off from the network. If both accept writes, you get two diverging histories that cannot be merged automatically."

[[note]]
level = "professional"
topic = "Data"
text = "Kafka drops a consumer group's committed offsets once the group has been empty for `offsets.retention.minutes`, seven days by default; on restart it falls back to `auto.offset.reset`, and with `latest` everything produced meanwhile is skipped. Check before long pauses."

[[note]]
level = "professional"
topic = "Databases"
text = "In PostgreSQL, `DROP DATABASE` cannot run inside a transaction block, so no `ROLLBACK` can save you. Revoke `CONNECT` and rename the database first, and drop it only after a quiet period proves nothing still uses it."

[[note]]
level = "professional"
topic = "Data"
text = "Merging duplicate customer records by overwriting one with the other destroys the losing record's history and breaks the IDs that other systems still hold. Keep both, point them at a surviving ID, and log each merge so it can be reversed."

[[note]]
level = "professional"
topic = "SQL"
text = "Never give a retired status code or enum value a new meaning: old rows, backups, logs and queued events still carry it, and every one of them gets silently reinterpreted. Add a new value and leave the old one reserved."

[[note]]
level = "professional"
topic = "Databases"
text = "`pg_dump` does not include roles or tablespaces, which belong to the whole cluster. Back them up with `pg_dumpall --globals-only`, or a restore to a fresh server will error on missing owners and grants."

[[note]]
level = "professional"
topic = "Databases"
text = "In PostgreSQL, killing one backend process with `SIGKILL` makes the server end every session and run crash recovery. Stop a runaway query with `pg_cancel_backend()` or `pg_terminate_backend()` instead."

[[note]]
level = "professional"
topic = "Databases"
text = "`pg_upgrade --link` is fast because it hard-links data files into the new cluster, but once the new server starts, the old cluster can no longer be used safely. Take a backup or snapshot first so you still have a way back."

[[note]]
level = "professional"
topic = "SQL"
text = "A PostgreSQL `SECURITY DEFINER` function runs with its owner's privileges, and unless it sets its own `search_path`, a caller can plant a same-named function or table in a schema searched first and have it run with those privileges. Add `SET search_path` to the function."

[[note]]
level = "professional"
topic = "Databases"
text = "If a Redis primary with persistence turned off restarts, it comes back empty and its replicas resync to that empty dataset, wiping them too. Enable persistence on the primary, or keep it from restarting automatically."

[[note]]
level = "professional"
topic = "Databases"
text = "Keep `action.destructive_requires_name` set to `true` in Elasticsearch so deleting indices requires exact names. With it off, one `DELETE` request on a wildcard pattern removes every matching index."

[[note]]
level = "professional"
topic = "Databases"
text = "Never edit a migration that has already run in production. Some tools skip it because it is recorded as applied, others fail checksum validation, and environments drift apart; write a new migration instead."

[[note]]
level = "professional"
topic = "SQL"
text = "With soft deletes, every query must filter `WHERE deleted_at IS NULL`, and one forgotten filter in a report, export or API brings deleted records back, including data people asked you to erase. Enforce the filter in a view or a row-level security policy."

[[note]]
level = "professional"
topic = "Databases"
text = "Setting MySQL's `innodb_force_recovery` to 4 or higher can permanently corrupt data files. Start at 1, raise it one step at a time only as far as needed to start the server, dump the data, and rebuild from the dump."

[[note]]
level = "professional"
topic = "Architecture"
text = "Enforce tenant isolation in the database, for example with PostgreSQL row-level security, instead of relying on a `tenant_id` filter in every query. One forgotten filter leaks a customer's data to another, and a leak cannot be taken back."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Running migrations automatically at application startup can let several instances race to apply them during a rollout. Run migrations once as a separate deploy step, or have the tool take a database lock first."

[[note]]
level = "professional"
topic = "Databases"
text = "`PURGE BINARY LOGS` in MySQL deletes binlog files for good, and a disconnected replica that had not read them yet cannot resume replication. The purged files are also lost to point-in-time recovery, so check every replica's position and your backups first."

[[note]]
level = "professional"
topic = "Databases"
text = "Dropping a PostgreSQL logical replication slot to free disk space also discards the position of the change data capture tool that used it, such as Debezium. The tool must then take a full new snapshot, or the changes made in between are lost."

[[note]]
level = "professional"
topic = "SQL"
text = "In PostgreSQL, `UPDATE ... FROM` without a join condition pairs every target row with every source row and applies an unpredictable one. Put the join in `WHERE` and run it as a `SELECT` first to confirm one match per row."

[[note]]
level = "professional"
topic = "Databases"
text = "Killing a long-running MySQL `UPDATE` or `DELETE` does not free things at once: InnoDB must undo every change made so far, which can take as long as the statement ran, with its locks held. Restarting the server only moves that rollback into crash recovery."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Last-write-wins replication keeps whichever update carries the later timestamp, so one of two concurrent writes is silently dropped, and with clock skew it can be the newer one. Use version vectors, or merge conflicting writes in the application, for data you cannot lose."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Clearing a migration tool's lock by hand, such as releasing Liquibase's `DATABASECHANGELOGLOCK` after a deploy hung, lets two runs apply changes at once if the first is still alive. Confirm that no migration process or pod is running before you release it."

[[note]]
level = "professional"
topic = "Performance"
text = "`auto_explain.log_analyze = on` in PostgreSQL times every plan node of every statement, not only the slow ones it logs, which can slow a busy server badly. Enable it briefly, with `auto_explain.log_timing = off` or a `sample_rate` below 1."

[[note]]
level = "professional"
topic = "Performance"
text = "Changing the format of cache keys in a deploy, such as adding a prefix or a new field, makes every existing entry unreachable at once, a full cache flush in disguise that sends all traffic to the database. Roll such changes out gradually."

[[note]]
level = "professional"
topic = "Git"
text = "Changing line-ending rules in `.gitattributes` on an established repository can make every file stored with the old endings show as modified and cause conflicts on open branches. Land it in one announced commit, made with `git add --renormalize .`."

[[note]]
level = "professional"
topic = "Git"
text = "`git lfs migrate import` rewrites every commit that touched the matched files, changing all their hashes. Treat it like any history rewrite: freeze pushes, keep a mirror backup and have everyone re-clone afterward."

[[note]]
level = "professional"
topic = "Git"
text = "A clone made with `git clone --shared` borrows objects from its source, so garbage collection in the source can delete objects the clone needs and corrupt it. Run `git repack -a` in the clone to copy them in before relying on it."

[[note]]
level = "professional"
topic = "Git"
text = "Rewriting shared history changes the hash of every later commit, so every clone, fork and open pull request must be rebased or recreated. Announce a freeze and publish exact recovery steps before you force-push."

[[note]]
level = "professional"
topic = "Security"
text = "Giving an AI agent both untrusted input, such as web pages or issue text, and tools that can read secrets or push code lets instructions hidden in that input use those tools. Keep such agents away from untrusted content, or require approval for each action."

[[note]]
level = "professional"
topic = "Git"
text = "Client-side hooks are skipped with `--no-verify` and never run for anyone who has not installed them. Enforce secret scanning and required checks on the server or in CI, not only in a `pre-commit` hook."

[[note]]
level = "professional"
topic = "Git"
text = "A submodule pins a commit hash, not a branch. If upstream force-pushes that commit away and it is garbage collected, fresh clones of your repository can no longer check it out, so mirror submodules you depend on."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Some platforms tie an app's identity to the key that signs it, so losing that key can mean existing installs never accept another update. Keep app signing keys in an HSM or managed key service, with a tested backup."

[[note]]
level = "professional"
topic = "Git"
text = "Merging repositories into a monorepo by copying files discards their history, and once the old repositories are deleted, blame and log for that code are gone for good. Move each one's files into its own directory, then bring it in with `git merge --allow-unrelated-histories`."

[[note]]
level = "professional"
topic = "GitHub"
text = "Deleting a private GitHub repository also deletes every fork of it, including forks where other people keep unmerged work. Archive it instead, or give fork owners time to push their branches elsewhere."

[[note]]
level = "professional"
topic = "GitHub"
text = "Turning on required two-factor authentication for a GitHub organization immediately removes every member and outside collaborator without it, bot accounts included. Find out who lacks 2FA and warn them before you enable it."

[[note]]
level = "professional"
topic = "GitHub"
text = "A GitHub App's private key lets anyone mint tokens for every account that installed the app. Keep it in a secrets manager, never in a repository, and rotate it by adding a new key before deleting the old one."

[[note]]
level = "professional"
topic = "Code review"
text = "When an emergency change skips review, review it within a day or two anyway. Otherwise hotfixes written under pressure, often with the broadest permissions, become permanent code that nobody but the author has read."

[[note]]
level = "professional"
topic = "Code review"
text = "A codemod or mass edit merged into hundreds of repositories at once can break them all at once. Roll it out in waves, with the owners of the first batch reviewing it, before touching the rest."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "In the AWS CDK, `autoDeleteObjects: true` on a bucket adds a custom resource that empties it when the bucket is removed from the stack or the stack is destroyed, so one teardown wipes every object. Keep it off for buckets that hold real data."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Required reviewers on a GitHub environment do not stop the person who triggered a deployment from approving it unless Prevent self-review is enabled. Turn it on for production, or a single account can ship alone."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Making a private repository public also exposes its Actions history: run logs and unexpired artifacts, which may contain credentials that were never masked. Review and delete old runs and artifacts before changing visibility."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "An admission webhook with `failurePolicy: Fail` that matches every namespace blocks pod creation cluster-wide once its backend is down, including the pods that would bring it back. Exclude `kube-system` and the webhook's own namespace with a `namespaceSelector`."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "The Cluster Autoscaler may remove a node to consolidate capacity while a long batch pod is running there, killing hours of work. Annotate such pods with `cluster-autoscaler.kubernetes.io/safe-to-evict: \"false\"` so their nodes are left alone."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Setting `pod-security.kubernetes.io/enforce: restricted` on a namespace leaves running pods alone, but any pod created afterwards that breaks the rules is rejected, so the next rollout or node failure leaves the app short of pods. Start with `warn` and `audit`."

[[note]]
level = "professional"
topic = "Cloud"
text = "A deploy role that can change IAM, for example with `iam:PutRolePolicy` or `iam:AttachRolePolicy` on its own role, can grant itself any permission, so a compromised pipeline becomes account admin. Deny IAM changes to deploy roles, or cap them with a permissions boundary."

[[note]]
level = "professional"
topic = "Cloud"
text = "Backups kept in the same account as production can be deleted by the same stolen credentials or runaway script that destroyed production. Copy them to a separate account whose deletion rights nobody in production holds, and lock them against early deletion."

[[note]]
level = "professional"
topic = "Cloud"
text = "Removing an account from an AWS Organization also removes every service control policy that restricted it, so its administrators regain actions you had denied. Move accounts between organizational units instead, and check what the target unit enforces."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "`pulumi stack rm --force` deletes a stack's state even though its resources still exist, leaving them running and billing with nothing tracking them. Run `pulumi destroy` first, or export the state if the resources must live on."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "`kubectl apply --prune` deletes live objects that match its selector but are missing from your files, so a wrong label or a partial directory deletes production resources. Preview the run with `--dry-run=server` first."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "An Ansible `authorized_key` task with `exclusive: true` removes every key it does not list from that account, so one missing entry locks people or automation out of the whole fleet at once. Roll such a change out to one host first."

[[note]]
level = "professional"
topic = "Containers"
text = "Run registry garbage collection only while the registry is read-only or stopped: the open-source registry's `garbage-collect` can delete layers of an image being pushed at that moment, leaving a tag that points to missing blobs."

[[note]]
level = "professional"
topic = "CI"
text = "A code-signing key stored as a CI secret can be used by any workflow change that reaches it, so one malicious pull request can sign malware in your name. Keep signing keys in a KMS or HSM, and sign only in a protected release job."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Removing finalizers to unstick a terminating object skips the cleanup they guard, which can orphan cloud load balancers, disks or DNS records that keep running and billing. Find out why the controller is not finishing first."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "On a GitOps-managed cluster, a fix applied with `kubectl edit` or `kubectl patch` is either reverted at the next sync or left as drift that nobody can see in the repository. Make the change in Git instead."

[[note]]
level = "professional"
topic = "CI"
text = "A self-hosted runner on a cloud VM with an attached admin role hands that role to every job it runs, including jobs from branches nobody reviewed. Give runner machines no role, and let each deploy job assume its own."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "After you rename or delete a GitHub organization that publishes actions, someone else may be able to register its old name and serve code to every workflow still using `old-org/action@v1`. Update references first, and hold the old name with a placeholder organization."

[[note]]
level = "professional"
topic = "Containers"
text = "Using a registry credential with push rights as a cluster's image pull secret lets anyone who can read that Secret overwrite the images your deployments run. Give nodes and pull secrets read-only access to the registry."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "A pod running with `privileged: true`, host namespaces or a `hostPath` mount of the node's root can take over the node. Enforce the `baseline` or `restricted` Pod Security Standard on namespaces that run application workloads."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "`kubectl rollout undo` restores only the previous pod template; a ConfigMap or Secret it references stays changed. Give configuration immutable names, such as a content hash suffix, so a rollback restores code and config together."

[[note]]
level = "professional"
topic = "Python"
text = "`celery -A app purge` deletes every waiting message from the configured task queues, and there is no undo. Check which broker URL the command will use first, and limit it to the queues you mean with `-Q`."

[[note]]
level = "professional"
topic = "Python"
text = "Rolling back with `manage.py migrate app 0041` runs the reverse of every later Django migration, and reversing an `AddField` drops that column and its data. Keep migrations backward-compatible and roll forward with a fix instead."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "`kubectl replace --force` deletes the object and creates it again, so a `LoadBalancer` Service can come back with a new external address and a Deployment loses all its pods at once. Use `kubectl apply` for live objects."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "`helm uninstall` deletes every resource the release created, including PersistentVolumeClaims defined in its templates. Annotate data-holding resources with `helm.sh/resource-policy: keep` so they survive an uninstall."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "With Argo CD automated sync and pruning enabled, deleting a manifest from Git deletes the live resource. Protect stateful resources with the `argocd.argoproj.io/sync-options: Prune=false` annotation."

[[note]]
level = "professional"
topic = "Python"
text = "Changing Django's `DEFAULT_AUTO_FIELD` makes `makemigrations` alter the primary key of every model that doesn't set its own, and on large tables each change rewrites the table under a lock. Set `default_auto_field` per app, and convert big tables one at a time."

[[note]]
level = "professional"
topic = "Python"
text = "Pickles record each object's module and class name, so renaming a class or moving a module makes pickles already stored in caches, queues or databases fail to load. Keep long-lived data in JSON or another schema-based format."

[[note]]
level = "professional"
topic = "Python"
text = "Alembic's autogenerate sees a renamed table or column as a drop plus an add, so running the generated migration deletes that data. Review every generated migration and turn such pairs into `op.rename_table` or `op.alter_column(..., new_column_name=...)`."

[[note]]
level = "professional"
topic = "Java"
text = "Pointing `javax.net.ssl.trustStore` at a file that holds only your company CA replaces the JVM's default trust store, so calls to every public HTTPS service start failing. Import your CA into a copy of the default `cacerts` and point at that copy."

[[note]]
level = "professional"
topic = "Containers"
text = "Environment variables given to a container show in plain text in `docker inspect` to anyone who can read its metadata, and often end up in crash reports and debug output. Mount secrets as files from a secrets manager instead."

[[note]]
level = "professional"
topic = "Java"
text = "Flyway's `clean` drops every object in the configured schemas, tables and data included, so a wrong URL in one command wipes a production database. Keep `cleanDisabled=true`, which recent versions default to, in every shared configuration."

[[note]]
level = "professional"
topic = "Java"
text = "Redeploying a web application into a running servlet container can leak the old class loader through threads, `ThreadLocal` values or JDBC drivers it registered, so metaspace fills up after a few deploys. Restart the JVM on every deploy instead."

[[note]]
level = "professional"
topic = "Containers"
text = "`docker system prune --volumes` deletes every stopped container and then the volumes they no longer hold, so a database container that was merely stopped can lose its data. Back up volumes, or prune only images, on hosts with state."

[[note]]
level = "professional"
topic = "Java"
text = "Never expose JMX with `com.sun.management.jmxremote.authenticate=false` on a reachable port: anyone who connects can invoke MBeans, which is enough to run code inside the JVM. Keep JMX local, or require authentication and TLS."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Pull base images by digest, as in `FROM image@sha256:...`, for release builds. A tag can be repointed by whoever controls it, and your next build quietly ships whatever it points to at that moment."

[[note]]
level = "professional"
topic = "Java"
text = "A JVM started with `-agentlib:jdwp=transport=dt_socket,server=y,address=*:5005` lets anyone who reaches that port run arbitrary code, because JDWP has no authentication. Keep it out of production images, and debug through an SSH tunnel to a localhost-only port."

[[note]]
level = "professional"
topic = "Go"
text = "Setting `GOGC=off` to cut garbage collection costs, without also setting `GOMEMLIMIT`, turns collection off entirely, so the heap grows until the process is OOM-killed. Raise `GOGC` instead, or pair `GOGC=off` with a memory limit."

[[note]]
level = "professional"
topic = "Go"
text = "Importing `net/http/pprof` or `expvar` registers debug handlers on `http.DefaultServeMux`, so a service that serves the default mux publicly exposes profiles, memory stats and its command line. Serve your API on its own `http.ServeMux`."

[[note]]
level = "professional"
topic = "Cloud"
text = "On AWS, instance store volumes lose their data when the instance stops, hibernates or terminates. Keep anything you cannot rebuild on EBS or another durable store, and treat instance store as scratch space."

[[note]]
level = "professional"
topic = "Code review"
text = "An automation that approves pull requests, or an engineer with a second account that can approve their own changes, quietly turns required review into a formality. Audit which accounts and tokens can approve, and remove any that aren't real second reviewers."

[[note]]
level = "professional"
topic = "Cloud"
text = "Turn on deletion protection for production databases and load balancers, such as `DeletionProtection` on RDS. It forces a deliberate extra step before anything, including an infrastructure-as-code run, can delete them."

[[note]]
level = "professional"
topic = "Go"
text = "Renaming an exported Go struct field that has no `json` tag also renames its JSON key, so stored documents and API clients stop matching and the old values silently decode as zero. Add explicit `json` tags before refactoring such types."

[[note]]
level = "professional"
topic = "Cloud"
text = "S3 Object Lock in compliance mode cannot be shortened or removed by any user, including the root user, until retention expires. Test your settings in governance mode with short periods before using compliance mode."

[[note]]
level = "professional"
topic = "Cloud"
text = "Granting `iam:PassRole` on every resource lets a principal launch compute with any role in the account, which amounts to holding that role's permissions. Scope it to the specific role ARNs the service needs."

[[note]]
level = "professional"
topic = "Cloud"
text = "When a third-party service assumes a role in your AWS account, require an `sts:ExternalId` condition in the trust policy. Without it, another customer of that vendor could get it to act on your account."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Running Express without `NODE_ENV=production` leaves it in development mode, where the default error handler sends full stack traces to clients; set it in every production environment and check it at startup."

[[note]]
level = "professional"
topic = "Cloud"
text = "In Google Cloud, downloaded service account key files do not expire by default and get copied far beyond where you can track them. Prefer workload identity federation or attached service accounts, and block key creation by policy."

[[note]]
level = "professional"
topic = "Cloud"
text = "Test a new service control policy on a sandbox account first. An overly broad deny attached to the organization root applies to every member account at once, including the ones running production."

[[note]]
level = "professional"
topic = "Cloud"
text = "`aws secretsmanager delete-secret --force-delete-without-recovery` deletes a secret immediately, with no window to restore it. Use the default scheduled deletion so a mistake can be undone with `restore-secret`."

[[note]]
level = "professional"
topic = "Cloud"
text = "An S3 lifecycle rule with no filter applies to every object in the bucket, so a wrong expiration setting deletes production data on its next run. Scope rules by prefix or tag, and keep versioning on as a safety net."

[[note]]
level = "professional"
topic = "Cloud"
text = "`aws s3 sync --delete` removes destination objects that are missing from the source, so a wrong or empty source directory wipes the bucket prefix. Run it with `--dryrun` first and read the delete lines."

[[note]]
level = "professional"
topic = "Cloud"
text = "For SQS standard queues, a message's retention clock starts when it was first enqueued, not when it reaches the dead-letter queue. Give a DLQ a longer retention period than its source, or failed messages can expire on arrival."

[[note]]
level = "professional"
topic = "Cloud"
text = "An autoscaling group terminates instances on scale-in whether or not they are mid-job. Use lifecycle hooks or scale-in protection for workers that run long tasks, and make those tasks resumable."

[[note]]
level = "professional"
topic = "Teams"
text = "Before disabling a departing engineer's accounts, find the scheduled jobs, CI tokens and integrations that run under their identity. Revoking access can otherwise silently stop production automation that nobody knew was theirs."

[[note]]
level = "professional"
topic = "Performance"
text = "An autoscaler without a maximum can turn a traffic spike or a retry loop into a huge bill and exhaust your database connections. Set upper limits that match what your dependencies can actually handle."

[[note]]
level = "professional"
topic = "Go"
text = "Converting a `[]byte` to a `string` with `unsafe.String` to skip the copy is safe only while nobody modifies those bytes; reusing the buffer silently changes strings Go assumes are immutable, corrupting map keys. Use `string(b)` unless profiling proves the copy matters."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Serializing state into an inline `<script>` with plain `JSON.stringify` lets a user-controlled string containing `</script>` close the tag and inject markup; escape `<` as `\\u003c` in that output, or use a serializer built for embedding."

[[note]]
level = "professional"
topic = "Teams"
text = "A bot account registered with an employee's email or 2FA device becomes unrecoverable when that person leaves. Register machine accounts with a team mailbox and keep their recovery codes in the team's vault."

[[note]]
level = "professional"
topic = "Go"
text = "With `GOPROXY=direct`, builds fetch every module from its source repository, so if a dependency's repository is deleted, old releases of your service can no longer be rebuilt. Keep a module proxy, public or your own caching one, that retains every version you use."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Adding an `exports` map to a published package's `package.json` blocks every import path it does not list, such as `pkg/lib/util.js`, so consumers who relied on deep imports break; ship it only in a major release."

[[note]]
level = "professional"
topic = "Teams"
text = "Never give candidates real backlog tasks as take-home work: it asks for unpaid work on your product and exposes internal code to outsiders. Use a self-contained exercise designed for the interview."

[[note]]
level = "professional"
topic = "C"
text = "Overwriting a shared library in place with `cp` changes the file that running processes have mapped, so they can crash. Install upgrades by writing a new file and renaming it over the old one, as `install` and package managers do, which leaves running processes on the old copy."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "`terraform workspace select` changes which state every later command reads and writes. Show the workspace in your prompt and pipeline logs, and check `terraform workspace show` before any `apply` or `destroy`."

[[note]]
level = "professional"
topic = "JavaScript"
text = "A JSON body like `{\"password\": {\"$ne\": null}}` hands MongoDB an operator where your code expected a string, so a login query built from it can match without the right password; check that each field is a string before querying."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Set `DeletionPolicy` and `UpdateReplacePolicy` to `Retain` or `Snapshot` on CloudFormation resources that hold data. For most resource types the default deletes them with the stack or when an update replaces them."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "A hotfix made by hand in the cloud console is reverted by the next infrastructure-as-code apply that does not include it. Port every manual change into code right away, or it silently undoes itself during an unrelated deploy."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Run Ansible playbooks with `--check --diff` and an explicit `--limit` before the real run. An inventory pattern that matches more hosts than you meant applies the change to every one of them."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Set `serial` on Ansible plays that restart services, so a bad change reaches one batch of hosts instead of the whole fleet, and add `max_fail_percentage` to stop the rollout when a batch fails."

[[note]]
level = "professional"
topic = "Networking"
text = "Setting `SO_LINGER` with a zero timeout to avoid `TIME_WAIT` makes `close()` send a reset and discard any data not yet sent, so the peer can lose the end of a response. Reuse connections instead, or let the client close first."

[[note]]
level = "professional"
topic = "DNS"
text = "Pointing a retired hostname at a new service sends it every request that old clients still make, often with their credentials or cookies attached. Keep retired names parked on a server you control, or leave them unresolvable, until their traffic stops."

[[note]]
level = "professional"
topic = "DNS"
text = "Changing a domain's nameservers at the registrar takes effect slowly, since the parent zone's delegation is cached for hours or days. Keep the old DNS provider serving identical records until queries to it stop."

[[note]]
level = "professional"
topic = "Observability"
text = "A mistake in alert routing can send pages to a receiver nobody watches, and nothing visibly fails. Check routing changes with `amtool config routes test` against real alert labels, and send a test alert through each critical route after deploying."

[[note]]
level = "professional"
topic = "DNS"
text = "An expired domain can be registered by someone else, who then receives your email, password resets and webhook callbacks. Enable auto-renew with a payment method that will not lapse, lock transfers, and monitor expiry dates."

[[note]]
level = "professional"
topic = "DNS"
text = "Publishing a `CAA` record that omits a certificate authority you still use makes that CA refuse your next renewal. List every CA your services and vendors use before adding `CAA` records."

[[note]]
level = "professional"
topic = "DNS"
text = "Moving DMARC to `p=reject` before every legitimate sender passes SPF or DKIM alignment gets their mail rejected by receivers. Run `p=none` with aggregate reports first and fix each sender you find."

[[note]]
level = "professional"
topic = "DNS"
text = "Deleting and recreating a hosted DNS zone usually assigns it new nameservers, so the domain stops resolving until the registrar is updated. Edit records in the existing zone instead."

[[note]]
level = "professional"
topic = "Observability"
text = "Dropping or sampling logs in the pipeline to cut costs can silently discard the audit and security events an investigation or auditor needs later. Route those events to their own unsampled stream before you filter anything."

[[note]]
level = "professional"
topic = "Incidents"
text = "When recovering from bad writes, restore the backup to a separate instance and copy back only the damaged rows. Restoring over the live database also throws away every good write made since the backup was taken."

[[note]]
level = "professional"
topic = "Incidents"
text = "Publishing a root cause before it is confirmed commits you to a story that may turn out wrong, and customers remember the first explanation. Share impact and mitigation first, and name the cause only once it is verified."

[[note]]
level = "professional"
topic = "Architecture"
text = "A queue or topic whose retention is shorter than your longest plausible consumer outage deletes unprocessed messages for good. Set retention well beyond your worst recovery time, and alert on consumer lag long before it gets close."

[[note]]
level = "professional"
topic = "Architecture"
text = "A TTL index or expiry attribute on primary data, such as a MongoDB TTL index or DynamoDB TTL, deletes records automatically and for good, so a bug that writes the wrong timestamp purges live data. Use automatic expiry only for data you can afford to lose."

[[note]]
level = "professional"
topic = "Networking"
text = "With `ForwardAgent yes`, anyone with root on the remote host can use your agent to log in as you wherever your keys work, for as long as you stay connected. Reach hosts behind a bastion with `ProxyJump` instead."

[[note]]
level = "professional"
topic = "Security"
text = "Public keys copied into `authorized_keys` on every server stay valid until someone finds and removes each copy, which rarely happens when people leave. Use short-lived SSH certificates from a central CA instead."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Narrowing a parameter type or removing an exported type in a published library breaks consumers' builds even though the JavaScript is unchanged; treat types as public API and ship breaking type changes only in a major version."

[[note]]
level = "professional"
topic = "Web"
text = "`Clear-Site-Data: \"cookies\"` removes cookies for the whole registrable domain, not only the host that sent it, so a logout response from `app.example.com` also signs users out of every other `example.com` subdomain; expire your own cookies instead."

[[note]]
level = "professional"
topic = "Web"
text = "Push subscriptions are tied to your VAPID key pair, so losing or replacing it silently orphans every subscriber until each browser subscribes again; back the key pair up like a production secret and never rotate it casually."

[[note]]
level = "professional"
topic = "Web"
text = "Deploying a staging `robots.txt` with `Disallow: /`, or a `noindex` meta tag, to production tells search engines to drop your site, and rankings come back only slowly after the fix; keep environment-specific files out of the production build."

[[note]]
level = "professional"
topic = "Web"
text = "Passkeys are bound to your site's relying party ID, normally its domain, so moving sign-in to a new domain leaves every registered passkey unusable; keep the RP ID stable, or plan re-enrollment before a domain change."

[[note]]
level = "professional"
topic = "HTTP"
text = "If your CDN caches by file extension while your app ignores extra path segments, `/account/settings/x.css` returns a private page that the CDN stores and serves to others; cache only paths you explicitly mark as static."

[[note]]
level = "professional"
topic = "Web"
text = "Submitting a domain to the HSTS preload list forces HTTPS on it and every subdomain in browsers, and removal takes months to reach users. Confirm every subdomain serves HTTPS before adding `preload`."

[[note]]
level = "professional"
topic = "HTTP"
text = "A cache configured to store responses that carry `Set-Cookie` can hand one visitor's session cookie to everyone who receives that cached copy; strip `Set-Cookie` from cacheable responses, or bypass the cache whenever it is present."

[[note]]
level = "professional"
topic = "Web"
text = "A session cookie set with `Domain=example.com` is sent to every subdomain, including ones hosting third-party or user content. Omit the `Domain` attribute so the cookie stays host-only."

[[note]]
level = "professional"
topic = "HTTP"
text = "Terminating TLS at the CDN and fetching from your origin over plain HTTP exposes that traffic, cookies included, on the path between them; connect to the origin over HTTPS and have the CDN verify its certificate."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Certificates from public CAs are recorded in public Certificate Transparency logs, so requesting one for a name like `payroll-db.internal.example.com` announces it to the world. Use an internal CA for names you would rather not publish."

[[note]]
level = "professional"
topic = "HTTP"
text = "An origin server that also answers requests sent straight to its IP lets attackers skip your CDN's firewall, rate limits and caching; accept traffic only from the CDN, through its address ranges or an authenticated header."

[[note]]
level = "professional"
topic = "Supply chain"
text = "After a registry token or maintainer account leaks, revoking it is not enough: check every version published since the leak, and deprecate or yank any you did not build, because users keep installing them."

[[note]]
level = "professional"
topic = "Security"
text = "During a confirmed compromise, skip the gentle rotation order: revoke the leaked credential immediately and accept the outage. Every minute it stays valid is a minute the attacker can use it."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Installing a third-party GitHub App or CI integration with access to every repository in your organization gives its vendor, and anyone who breaches it, your source code and often your secrets. Grant it only the repositories it needs."

[[note]]
level = "professional"
topic = "Security"
text = "Before enforcing SSO or MFA across an organization, confirm a working break-glass admin path. Locking out every administrator can take a long support process to undo."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Adding a third-party APT repository with `apt-key add` trusts its key for every repository on the system, so it could replace any package. Keep the key in `/etc/apt/keyrings/` and reference it with `signed-by=` for that repository only."

[[note]]
level = "professional"
topic = "Security"
text = "Standing admin access to production for every engineer turns any stolen laptop into a production incident. Grant elevated access just in time, with an expiry and an audit trail."

[[note]]
level = "professional"
topic = "Security"
text = "Send audit logs to a separate account or append-only store that production administrators cannot modify. An attacker with admin access will otherwise delete the record of what they did."

[[note]]
level = "professional"
topic = "Security"
text = "Letting a server fetch user-supplied URLs lets attackers reach internal services and cloud metadata endpoints. Check the resolved IP against internal ranges on every request, and require IMDSv2 on AWS."

[[note]]
level = "professional"
topic = "APIs"
text = "Accepting webhooks without verifying their signature lets anyone who finds the URL forge events such as payment confirmations. Verify the HMAC over the raw request body, and reject old timestamps to stop replays."

[[note]]
level = "professional"
topic = "Security"
text = "Help desk MFA and password resets are a favorite social engineering target. Verify identity through a separate, pre-registered channel before any account recovery, never because of a convincing call or chat message."

[[note]]
level = "professional"
topic = "Debugging"
text = "Packet captures and HAR files contain cookies, bearer tokens and request bodies. Scrub them before attaching them to a ticket or vendor case, and delete them when the investigation ends."

[[note]]
level = "professional"
topic = "Security"
text = "Registering an OAuth client with wildcard or pattern-matched redirect URIs lets an attacker send authorization codes to a page they control. Register exact redirect URIs and compare them byte for byte."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Keep backup encryption keys outside the system being backed up, and test a restore using only what a real recovery would have. A key stored alongside the backups is lost, or stolen, together with them."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Pushing an automated dependency upgrade to every repository at once means one bad release breaks them all together. Roll dependency upgrades out in waves, starting with a few low-risk services, like any other change."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Rehashing stored passwords directly needs each plaintext, so waiting for logins leaves inactive accounts on the weak hash for good. Wrap every old hash in the new function now, as in `argon2(md5_hash)`, and switch each user to a direct hash at their next login."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Deleting a package version from your internal mirror or proxy breaks every build that pins it, including rollbacks to old releases. Block a bad version from new resolutions instead of removing it."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Keep an internal root CA's private key offline and issue certificates from an intermediate. If an online root is compromised, every certificate it signed must be replaced, and so must the root in every client's trust store."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Pinning a leaf certificate in a mobile app breaks the app when that certificate rotates, and installed builds cannot be fixed in time. If you pin at all, pin public keys you control and ship a backup pin that is not in use yet."

[[note]]
level = "professional"
topic = "Versioning"
text = "Rejecting input you used to accept, such as a stricter email check or a lower size limit, breaks clients even though no signature changed. Roll it out with a deprecation period, logging what would fail first."

[[note]]
level = "professional"
topic = "Versioning"
text = "Changing what an existing field means, such as switching `timeout` from seconds to milliseconds, breaks clients silently because every value still parses. Add a new field for the new meaning and deprecate the old one."

[[note]]
level = "professional"
topic = "Releases"
text = "Skipping the staged rollout for an urgent hotfix is how a quick fix becomes a second, larger outage. Send it through the same canary and stages, shortened if you must, but never removed."

[[note]]
level = "professional"
topic = "Releases"
text = "Releasing a mobile app update to every user at once leaves no way to stop a crash from reaching them all, since installed versions cannot be pulled back. Use the store's staged or phased rollout, and halt it if crash rates rise."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Adding a co-maintainer to a package you publish gives them the power to ship code to every downstream user. Vet new maintainers over time, require two-factor authentication on the registry, and review publish rights regularly."

[[note]]
level = "professional"
topic = "Releases"
text = "Changing the update URL or feed that installed desktop apps or devices check, without keeping the old one serving, strands every existing install on its current version for good. Keep old update endpoints working and redirecting."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Building release artifacts on a developer machine lets anything on it, from a malicious extension to a compromised package, slip into what you ship. Build releases in CI from a tagged commit and publish provenance for them."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Handing a package or GitHub Action you maintain to someone you do not know gives them every downstream install. Archive or deprecate it instead, and point users to a fork you trust."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Keeping build configuration only in a CI service's web settings, not in files in the repository, means old releases cannot be rebuilt the way they were built and changes leave no review trail. Define pipelines in committed files."

[[note]]
level = "professional"
topic = "Teams"
text = "Don't leave a risky production change to one engineer at night or at the end of a long shift; tired people skip steps. Schedule it for working hours, with a second person checking each step against the plan."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Deleting and regenerating a lockfile to settle a merge conflict silently upgrades every transitive dependency at once. Resolve the conflict, or let the package manager rebuild only the conflicting entries."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Depending on a Git branch, such as a requirement ending in `@main`, lets every build pick up new upstream commits that nobody reviewed. Pin Git dependencies to a full commit hash."

[[note]]
level = "professional"
topic = "Shell"
text = "An `export AWS_PROFILE=prod` or `KUBECONFIG` set during an incident stays in effect in that terminal, so a command typed an hour later for staging runs against production. Show the active environment in your prompt, and close such shells when the incident ends."

[[note]]
level = "professional"
topic = "Testing"
text = "Running heavy test or analysis queries against a production read replica can make it lag behind the primary or push hot data out of its cache, so real users reading from it get stale or slow results. Use a separate restored copy."

[[note]]
level = "professional"
topic = "Incidents"
text = "Discussing a suspected breach in a public channel or ticket can tip off the attacker and spreads unverified details. Move to a private incident channel with need-to-know membership."

[[note]]
level = "professional"
topic = "Incidents"
text = "During an incident, change one thing at a time and post each change in the incident channel with a timestamp. Parallel undocumented fixes make it impossible to know what helped or what to roll back."

[[note]]
level = "professional"
topic = "Debugging"
text = "A heap dump taken with `jcmd <pid> GC.heap_dump` or `jmap` pauses the whole JVM while it writes, which on a large heap can last long enough to fail health checks and get the instance killed mid-dump. Take it out of rotation first."

[[note]]
level = "professional"
topic = "Incidents"
text = "Restarting every instance at once to clear a bad state hits your dependencies with cold caches and fresh connection pools all together. Restart in batches and watch the downstream services."

[[note]]
level = "professional"
topic = "Incidents"
text = "Prefer rolling back to the last good release over writing a fix under pressure. A hurried forward fix is a new, untested change deployed into a system that is already failing."

[[note]]
level = "professional"
topic = "Incidents"
text = "After a breach, rotate every credential the attacker could have read, not just the ones you know were used, and revoke active sessions. One missed token restarts the incident."

[[note]]
level = "professional"
topic = "Incidents"
text = "Rehearse failing over to your disaster recovery region, and failing back, on a schedule. A first attempt made during a real disaster often stalls on a dependency nobody remembered."

[[note]]
level = "professional"
topic = "Incidents"
text = "Removing a mitigation such as a rate limit, kill switch or IP block as soon as the graphs look normal can bring the incident straight back. Keep it until the root cause is fixed and verified."

[[note]]
level = "professional"
topic = "Rust"
text = "When `main` returns, the Tokio runtime shuts down and drops every spawned task at its next `.await`, so work such as flushing a buffer or committing offsets never finishes. Track tasks in a `JoinSet` and await them during shutdown."

[[note]]
level = "professional"
topic = "APIs"
text = "Making `DELETE` on your API erase rows immediately leaves no way back when a customer's script or a stolen key deletes the wrong things; soft-delete with a restore window, and purge the data later."

[[note]]
level = "professional"
topic = "Teams"
text = "Team credentials saved in one engineer's personal password manager leave the company with them. Keep shared credentials in an organization-owned vault, where access is granted and revoked per person."

[[note]]
level = "professional"
topic = "Releases"
text = "Deleting a feature flag in the flag service before removing it from code makes the code fall back to its default value, which can silently flip the feature in production. Remove the code path first."

[[note]]
level = "professional"
topic = "Releases"
text = "Roll out configuration changes in stages, just like code. A bad value pushed to every region at once takes every region down at once."

[[note]]
level = "professional"
topic = "Releases"
text = "A hotfix shipped from a release branch but never merged back is undone by the next regular release. Merge or cherry-pick it into the main branch as part of the same fix."

[[note]]
level = "professional"
topic = "Releases"
text = "Deprecate a bad package version with `npm deprecate` rather than unpublishing it. Removal breaks every build that pins it, while a deprecation warns users and leaves their builds working."

[[note]]
level = "professional"
topic = "Releases"
text = "Send a new release to a small slice of traffic first and compare its error rate and latency with the rest before continuing. A full rollout can turn a bad release into a full outage before your alerts even fire."

[[note]]
level = "professional"
topic = "Debugging"
text = "Disabling a health check to stop a crash loop while you debug also removes what takes broken instances out of traffic, and if it is never restored, the next failure keeps receiving requests. Take the instance out of rotation instead."

[[note]]
level = "professional"
topic = "Shell"
text = "A deploy script that deletes the previous release before the new one passes health checks leaves nothing to roll back to. Keep the last few releases on disk and switch a `current` symlink atomically, with `ln -s` to a temporary name followed by `mv -T`."

[[note]]
level = "professional"
topic = "Architecture"
text = "Personal data written to an immutable event log or long-retention topic is very hard to delete on request. Keep it in a separate store referenced by ID, or encrypt it per user so deleting the key erases it."

[[note]]
level = "professional"
topic = "Architecture"
text = "Exposing sequential database IDs in public URLs leaks your growth and invites enumeration, and changing public identifiers later breaks every stored link. Choose opaque identifiers before the first external user sees one."

[[note]]
level = "professional"
topic = "Architecture"
text = "Using an email address or another mutable natural key as a primary key spreads it into foreign keys, logs and partner systems. Use a surrogate key and keep the email as a unique attribute."

[[note]]
level = "professional"
topic = "Architecture"
text = "A shard key is close to permanent, since changing it means moving all of your data. Choose one that spreads writes evenly and keeps your most common queries on a single shard."

[[note]]
level = "professional"
topic = "APIs"
text = "An export endpoint that returns a whole account's data in one call turns a single stolen token into a full breach; require a dedicated scope, rate-limit exports and alert on unusual volume."

[[note]]
level = "professional"
topic = "APIs"
text = "Removing an API version breaks every client that has not migrated, including ones you do not know about. Measure traffic per client before removal, and schedule brownouts to flush out the stragglers."

[[note]]
level = "professional"
topic = "APIs"
text = "Leaving GraphQL introspection on in production hands anyone a map of every type, field and mutation, internal ones included; disable it or limit it to authenticated staff, and never rely on unlisted fields staying secret."

[[note]]
level = "professional"
topic = "APIs"
text = "Re-sending old webhooks from a backfill or migration job hits receivers with events they already processed, possibly after newer ones; send them only to customers who opt in, marked as replays."

[[note]]
level = "professional"
topic = "APIs"
text = "Accepting webhook endpoints on plain HTTP sends event payloads, often with personal data, across the internet unencrypted; require HTTPS endpoints, and verify their certificates when you deliver."

[[note]]
level = "professional"
topic = "Performance"
text = "Reassigning Kafka partitions or rebalancing Elasticsearch shards copies whole data sets across the network, and unthrottled it can saturate disks and links under production traffic. Move a few partitions at a time, with a replication throttle set."

[[note]]
level = "professional"
topic = "Data"
text = "Adding partitions to a Kafka topic changes which partition each key maps to, breaking per-key ordering, and partitions can never be removed again. Size keyed topics generously up front."

[[note]]
level = "professional"
topic = "Data"
text = "Resetting a Kafka consumer group with `--to-earliest` replays every retained message through consumers that may send emails or charge cards again. Reset to a specific offset or time, with side effects disabled."

[[note]]
level = "professional"
topic = "Data"
text = "Run large backfills by writing to a new column or table instead of overwriting values in place. A bug in the transformation then leaves the original values intact to retry from."

[[note]]
level = "professional"
topic = "Data"
text = "In Spark, writing a partitioned table with `mode(\"overwrite\")` replaces the whole table by default, not only the partitions you wrote. Set `spark.sql.sources.partitionOverwriteMode` to `dynamic` to replace just those partitions."

[[note]]
level = "professional"
topic = "Data"
text = "Hashing emails or phone numbers does not anonymize them: the set of possible inputs is small enough to hash every candidate and match. Treat hashed identifiers as personal data."

[[note]]
level = "professional"
topic = "Data"
text = "Copying production data into staging extends every privacy and breach obligation to an environment with weaker controls. Use synthetic data or a masked extract instead."

[[note]]
level = "professional"
topic = "Observability"
text = "Request logging that captures full headers stores every bearer token and session cookie in your log system, which far more people can read than your secret store. Redact `Authorization` and `Cookie` in the logger itself."

[[note]]
level = "professional"
topic = "Observability"
text = "Give every alert silence you create during an incident an expiry. A silence without one keeps the alert off long after the fix, until the next real failure goes unnoticed."

[[note]]
level = "professional"
topic = "Observability"
text = "Shortening log or metric retention deletes history you may need for a slow-burning incident or an audit. Export older data to cheap archive storage before lowering retention."

[[note]]
level = "professional"
topic = "Rust"
text = "`bincode` and similar compact formats encode enum variants by position, so inserting, removing or reordering variants in a type you have stored or sent over the wire makes old data decode as the wrong variant. Only ever append new variants."

[[note]]
level = "professional"
topic = "Observability"
text = "Turning on debug logging across production can fill disks and log quotas quickly and records secrets that normal levels leave out. Enable it for one instance or one request type, with an automatic revert."

[[note]]
level = "professional"
topic = "Shell"
text = "A cleanup script that deletes every resource missing from an inventory query deletes everything when that query fails and returns nothing. Abort before any delete runs when the inventory is empty or much smaller than last time."

[[note]]
level = "professional"
topic = "Linux"
text = "Deleting a user leaves their files owned by a bare UID, and `useradd` can give that UID to the next account created, which then owns the old files. Find them with `find / -xdev -uid N` and reassign or remove them before deleting the account."

[[note]]
level = "professional"
topic = "Linux"
text = "Running `fsck -y` on a damaged production volume answers yes to every repair, which can clear inodes and move files into `lost+found` for good. When the data matters, image the device first, for example with `ddrescue`, and repair the copy or keep it as a fallback."

[[note]]
level = "professional"
topic = "Linux"
text = "Turning on `Unattended-Upgrade::Automatic-Reboot` with the same `Automatic-Reboot-Time` on every replica takes the whole cluster down together. Give each replica group a different time, or let an orchestrator drain and reboot hosts one by one."

[[note]]
level = "professional"
topic = "Linux"
text = "Granting a deploy user passwordless `sudo` for a program that can spawn a shell, such as an editor, `find` or `tar`, gives it full root. Allow only specific root-owned scripts the user cannot modify."

[[note]]
level = "professional"
topic = "Tooling"
text = "With tmux `synchronize-panes` or a terminal's broadcast-input mode on, every keystroke goes to all panes, so a command meant for one host runs on the whole group. Turn it off right after use, and show its state in your status line."

[[note]]
level = "professional"
topic = "Tooling"
text = "Database GUIs keep production and staging connections open side by side, so a query meant for staging runs against production after one wrong click. Color-code production connections and make them read-only by default."

[[note]]
level = "professional"
topic = "Regex"
text = "Regex-based redaction in a log pipeline only catches the secret formats you wrote patterns for, so a token in a URL or an unfamiliar key format ships to the log vendor in the clear, where you cannot recall it. Keep secrets out of log calls, and treat redaction as a backstop."

[[note]]
level = "professional"
topic = "Documentation"
text = "Keep network diagrams, firewall rules and internal hostnames out of public repositories and docs sites; together they hand attackers a map of your systems. Share them in access-controlled spaces instead."

[[note]]
level = "professional"
topic = "Teams"
text = "If only one person can reach the domain registrar, the DNS provider or the cloud root account, their absence can block an incident fix. Keep those credentials in a shared vault with at least two owners."

[[note]]
level = "professional"
topic = "Teams"
text = "Register domains, app store accounts and cloud billing under company accounts, never an employee's personal one. Recovering them after that person leaves can take months or legal action."

[[note]]
level = "professional"
topic = "Documentation"
text = "Before retiring a wiki or docs platform, export every page with its history and set up redirects. Runbooks and decisions linked from old tickets and code comments otherwise vanish, and nobody can reconstruct them."

[[note]]
level = "professional"
topic = "Teams"
text = "Deleting a departed employee's accounts outright can destroy the only copy of files, mailboxes and 2FA enrollments tied to company systems. Suspend the accounts and transfer ownership first, then delete after a retention period."

[[note]]
level = "professional"
topic = "Regex"
text = "Put new WAF or input-filter regexes into log-only mode before blocking with them, and review what they would have caught. A rule that is too broad rejects real customers, and one that backtracks badly can burn CPU on every request."

[[note]]
level = "professional"
topic = "Unicode"
text = "Changing how usernames or emails are normalized after launch can map two existing accounts to the same key or leave people unable to log in. Before switching, run the new rule over all stored values, resolve the collisions and migrate the data in the same release."

[[note]]
level = "professional"
topic = "Unicode"
text = "After migrating text between databases, compare per-row checksums of the UTF-8 bytes before decommissioning the source. Mojibake and truncated 4-byte characters pass spot checks, and once the source is gone the original text cannot be recovered."

[[note]]
level = "professional"
topic = "CI"
text = "Keep CI that runs untrusted contributions apart from CI that deploys, with different runners and different credentials. A shared runner lets a malicious build tamper with the workspace or tools the next job uses."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Buying software without accessibility requirements in the contract leaves you answerable for barriers you cannot fix yourself; write WCAG conformance, an accessibility report and remediation timelines into procurement terms."

[[note]]
level = "professional"
topic = "Documentation"
text = "Once public docs describe a behavior, such as the order of results or a field in a response, customers build on it, and removing it becomes a breaking change. Decide what is a promise before you document it, and label the rest as unspecified."

[[note]]
level = "professional"
topic = "CI"
text = "Deploy credentials that never expire stay useful to an attacker for as long as nobody notices the leak. Have each CI job obtain short-lived cloud credentials through OIDC federation instead of storing static keys."

[[note]]
level = "professional"
topic = "Documentation"
text = "Code examples in documentation get copied into production far more often than they get read critically, so an example with string-built SQL or a hard-coded key spreads that flaw everywhere. Review examples as strictly as shipping code."

[[note]]
level = "professional"
topic = "Documentation"
text = "Don't delete superseded design docs or decision records; mark them superseded and link the replacement. Code written under the old decision still exists, and without the record nobody can tell why it looks the way it does."

[[note]]
level = "professional"
topic = "Time"
text = "Changing the zone or format of timestamps a service writes, such as switching from local time to UTC, cannot be undone by rolling back the code, because rows written in between carry the new form. Record the cutover time, and let the old code read both forms first."

[[note]]
level = "professional"
topic = "Testing"
text = "Point staging and load tests at sandbox payment, email and SMS providers, never at real ones holding production data. One bad job can charge or message every customer, and sent messages cannot be recalled."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Rebuilding an old release from source rarely reproduces the exact bytes you shipped, so you cannot prove what ran in production. Keep released artifacts and their digests for as long as the release is supported."

[[note]]
level = "professional"
topic = "Tooling"
text = "Coding agents run commands with whatever credentials your shell holds. Do not run them in sessions with production access; give them sandboxes with scoped, short-lived credentials."

[[note]]
level = "professional"
topic = "Documentation"
text = "Never put destructive commands with real production hostnames or IDs in a runbook, ready to paste. Use placeholders the reader must fill in, and state what to verify before running each one."

[[note]]
level = "professional"
topic = "Unicode"
text = "Store and compare usernames after one Unicode normalization and case folding, or the same visible name written with composed and decomposed characters can register twice. Normalization does not catch lookalike letters from other scripts, so check those too."

[[note]]
level = "professional"
topic = "Time"
text = "Timestamps sent by client devices are only as right as their clocks, and users set clocks forward to skip waits or extend trials. Never use them for expiry, billing or ordering; record a server-side time, and keep the client value for display and diagnostics."

[[note]]
level = "professional"
topic = "Rust"
text = "`cargo owner --add user` grants full control of a crate, including publishing and changing owners, so one compromised account can ship malware to every user. Keep named owners few and add routine publishers through a GitHub team, which can't change owners."

[[note]]
level = "professional"
topic = "Rust"
text = "Release binaries built with `-C target-cpu=native` use every instruction set the build machine supports and crash with an illegal-instruction signal on older CPUs in your fleet. Target a named baseline such as `x86-64-v2` instead."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Setting `PYTHONHASHSEED=0` for reproducible output also turns off hash randomization, reopening hash-flooding attacks on dicts keyed by user input. Keep it out of production services."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Switching off an accessible fallback, such as a plain HTML form or a phone option, before its replacement passes an accessibility review can leave some users with no way to complete the task at all."

[[note]]
level = "professional"
topic = "C"
text = "`-ffast-math` lets the compiler assume NaN and infinity never occur, so `isnan(x)` checks can be compiled away and results change with the optimization level. Keep it out of code that validates input, or enable narrower flags such as `-fno-math-errno`."

[[note]]
level = "professional"
topic = "C"
text = "A setuid C program that calls `system()` or `popen()` runs `/bin/sh` with the caller's environment, so if the command has no full path, a crafted `PATH` makes it run the attacker's program with elevated privileges. Use `execve` with a full path and a minimal environment."

[[note]]
level = "professional"
topic = "C"
text = "When a C program drops root privileges, call `setgroups`, then `setgid`, then `setuid`, and check each return value. Once `setuid` succeeds the process can no longer change its groups, so doing it first leaves root's group access in place."

[[note]]
level = "professional"
topic = "C"
text = "Core dumps copy a process's memory to disk, private keys and passwords included. Before enabling them for a C service, restrict who can read the dump directory, and on Linux mark buffers holding secrets with `madvise(..., MADV_DONTDUMP)`."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Approximate algorithms such as HyperLogLog, sampling and count-min sketches are fine for dashboards, but their errors do not belong in billing, quotas or compliance reports that someone will audit. Keep exact counts for anything that charges or enforces."

[[note]]
level = "professional"
topic = "Concurrency"
text = "A cron job scheduled inside an application that runs several replicas fires once per replica, which for emails or charges means duplicates. Run it from a single scheduler or behind leader election."

[[note]]
level = "professional"
topic = "Performance"
text = "Flushing an entire cache in production, as with Redis `FLUSHALL`, sends every request to the database at once and can take it down. Invalidate specific keys, or let them expire gradually."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Upgrading the TypeScript that builds a published library can emit `.d.ts` syntax that older compilers cannot parse, breaking consumers on older TypeScript; test your declarations against the oldest version you support, or publish downleveled ones via `typesVersions`."

[[note]]
level = "professional"
topic = "Security"
text = "`shred` assumes the filesystem overwrites data in place; on SSDs, copy-on-write filesystems, snapshots and backups, old copies survive. Encrypt disks from the start and destroy the key when you retire them."
