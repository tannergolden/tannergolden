# Important: something that matters. A practice whose absence causes real damage over time.
# 1,000 notes, 250 per level. Drawn by .github/scripts/notes.py; every note
# added makes the rotation longer. No en or em dashes: the script refuses them.

[[note]]
level = "beginner"
topic = "Git"
text = "Write each commit message for someone reading it in six months: a short subject in the imperative, and a body that says why. The diff already says what."

[[note]]
level = "beginner"
topic = "Security"
text = "Keep passwords and API keys out of your source code. Load them from environment variables or a local config file listed in `.gitignore`, so pushing your code never pushes credentials with it."

[[note]]
level = "beginner"
topic = "Python"
text = "Follow PEP 8 names in Python: `snake_case` for functions and variables, `CapWords` for classes and `UPPER_CASE` for constants. Consistent names tell readers what kind of thing a name refers to without looking it up."

[[note]]
level = "beginner"
topic = "Networking"
text = "Give a home server a fixed address with a DHCP reservation in your router. Otherwise the router may hand it a different address after a restart, and every port forward, bookmark and config that uses the old one breaks."

[[note]]
level = "beginner"
topic = "Shell"
text = "Quote variable expansions in shell scripts, as in `\"$file\"`. Unquoted, a value containing a space or a `*` gets split and expanded, and the script ends up operating on the wrong files."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Avoid changing objects and arrays that were passed into your functions, for example by sorting an argument in place: the caller's data changes too, and the bug surfaces far from the function that caused it."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Read the entire error message and stack trace before changing any code. It usually names the file, the line and the problem, and guessing without it leads to random edits that add new bugs."

[[note]]
level = "beginner"
topic = "Git"
text = "Read what Git prints after each command. Messages such as `Your branch is behind` or `You have unmerged paths` tell you where you stand, and they usually name the exact command to continue or undo."

[[note]]
level = "beginner"
topic = "SQL"
text = "Pass values into SQL queries with placeholders, such as `?` or `%s` depending on the driver, never by gluing strings together. String-built queries allow SQL injection, which lets attackers read, change or delete your data."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Give every project a README that says what it does, how to install it and how to run it. Without one, even you will struggle to restart the project after a few months away."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Use `===` and `!==` in JavaScript instead of `==` and `!=`. The loose versions convert types before comparing, so `0 == \"\"` is `true`, and surprises like that become bugs that are hard to spot in review."

[[note]]
level = "beginner"
topic = "Data"
text = "Follow the 3-2-1 rule for anything you can't recreate: three copies, on two different kinds of storage, with one kept off-site. Copies kept in one place can all vanish in a single fire, theft or ransomware attack."

[[note]]
level = "beginner"
topic = "Git"
text = "Push your commits to a remote at the end of every work session. Until you push, your whole history lives on one disk, and a stolen laptop or a deleted folder takes all of it."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Record the Node version your project needs, in an `.nvmrc` file or the `engines` field of `package.json`; code that works on your machine can fail on a teammate's laptop or a server running an older Node."

[[note]]
level = "beginner"
topic = "Security"
text = "Install updates for your operating system, browser and developer tools promptly. Security fixes are often described in public once released, so attackers go after machines that have not installed them yet."

[[note]]
level = "beginner"
topic = "Linux"
text = "Use `sudo` only for commands that need it, not as a reflex whenever something fails. Running project tools as root leaves root-owned files in your folders and turns small mistakes into system-wide ones."

[[note]]
level = "beginner"
topic = "Time"
text = "Store dates that have no time of day, such as birthdays and due dates, as plain dates rather than timestamps at midnight. Converting such a timestamp between time zones moves it to the previous or next day."

[[note]]
level = "beginner"
topic = "Code review"
text = "Keep each pull request focused on one change. Reviewers read small pull requests carefully and skim large ones, so big mixed changes let more bugs through and take longer to merge."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Annotate function parameters: TypeScript infers a variable's type from its value, but not a parameter's type from how the function is called, so an unannotated parameter is implicitly `any`, which `noImplicitAny` reports."

[[note]]
level = "beginner"
topic = "C"
text = "Compile C with warnings enabled, for example `gcc -Wall -Wextra`. Without those flags, GCC stays quiet about many real bugs, such as `if (x = 0)` where `==` was meant, or uninitialized variables, that only show up at run time."

[[note]]
level = "beginner"
topic = "Testing"
text = "Run the whole test suite before you push, not only the tests for the code you touched. Changes often break distant code, and catching that locally is far cheaper than after a merge."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Keep input and output, such as files, network calls and printing, apart from the logic that computes results. Pure logic is easy to test and reuse, while code that mixes both needs everything running to check one calculation."

[[note]]
level = "beginner"
topic = "Security"
text = "Make your password manager's master password long and used nowhere else, and turn on two-factor authentication for the manager's account. It is the one secret that unlocks all your others."

[[note]]
level = "beginner"
topic = "Git"
text = "Make each commit one logical change, even if that means several small commits a day. When something breaks later, a focused commit is easy to find, understand and revert without undoing unrelated work."

[[note]]
level = "beginner"
topic = "Java"
text = "Compare Java strings with `.equals()`, never `==`. `==` checks whether two references point to the same object, so it can pass with string literals in tests and fail on strings read from input."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "Every so often, clone your project into a fresh folder and follow your own README from scratch. It exposes missing steps and files that only work on your machine because of something you set up months ago."

[[note]]
level = "beginner"
topic = "APIs"
text = "Return accurate HTTP status codes from your API: `404` for missing resources, `400` for bad input, `500` for server errors. A `200` with an error message in the body misleads clients, caches and monitoring that trust the status."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Let an automatic formatter such as Prettier or Black decide code style, and run it on save. Style debates end, diffs show only real changes, and code touched by many hands still reads as one."

[[note]]
level = "beginner"
topic = "Databases"
text = "Develop and test against a separate database, never the one real users depend on. A wrong query during an experiment should cost you a reset, not your users' data."

[[note]]
level = "beginner"
topic = "Go"
text = "In Go, check every returned `err` right away. Discarding one with `_` lets the program carry on with zero values such as an empty string or `nil`, and the real failure surfaces later somewhere unrelated."

[[note]]
level = "beginner"
topic = "Teams"
text = "Set a time limit, such as an hour, for being stuck before you ask for help. Some struggle teaches you a lot, but days of silent struggle cost far more than a teammate's five minutes."

[[note]]
level = "beginner"
topic = "Security"
text = "Use a password manager and a unique password for every account, developer tools included. When one site leaks its passwords, reuse lets attackers into your email, GitHub and cloud accounts as well."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Model states that cannot happen together as a union, such as `{ status: 'loading' } | { status: 'error'; message: string }`, instead of separate `isLoading` and `error` fields that allow impossible combinations."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Pick one package manager per project and stick to it: mixing npm, Yarn and pnpm leaves several lock files that disagree, so teammates end up with different versions depending on which tool they run."

[[note]]
level = "beginner"
topic = "CI"
text = "Set up continuous integration to run your tests on every push and pull request. It catches the tests you forgot to run and the code that only works on your machine, before either reaches `main`."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Reproduce a bug reliably before trying to fix it. Without a way to trigger it on demand, you can't tell whether your change fixed it or the bug simply didn't happen this time."

[[note]]
level = "beginner"
topic = "Web"
text = "Check your HTML with a validator: browsers silently repair unclosed tags and duplicate `id` values, so a page can look fine while CSS, scripts and screen readers work on a different structure than you wrote."

[[note]]
level = "beginner"
topic = "Python"
text = "Wrap conversions of user input such as `int(text)` in `try`/`except ValueError`, and ask again when they fail. Without that, one mistyped letter crashes the whole program with a traceback."

[[note]]
level = "beginner"
topic = "Git"
text = "Add a `.gitignore` in a project's first commit, covering build output, dependency folders such as `node_modules/` and local settings files. Anything committed by mistake stays in the history of every clone, even after you delete it."

[[note]]
level = "beginner"
topic = "Observability"
text = "Use your language's logging library instead of `print` for anything that runs unattended. Log levels, timestamps and a proper destination turn a vague problem into one you can trace."

[[note]]
level = "beginner"
topic = "Regex"
text = "Test every regular expression against inputs that should not match, not only ones that should. A pattern that accepts all your valid examples may also accept garbage you never tried."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Put `<meta charset=\"utf-8\">` at the top of every HTML page's `<head>` and save your files as UTF-8. Otherwise browsers may guess the encoding and turn accented letters and emoji into garbage."

[[note]]
level = "beginner"
topic = "Containers"
text = "Add a `.dockerignore` file listing `.git`, `node_modules`, `.env` and build output. Without it, the whole folder is sent to every build, making builds slower, images bigger and leaked secrets more likely."

[[note]]
level = "beginner"
topic = "Performance"
text = "Measure before you optimize: time the code or run a profiler first. Guesses about what is slow are often wrong, and optimizing code that isn't the bottleneck only makes it harder to read."

[[note]]
level = "beginner"
topic = "Java"
text = "Mark every overriding method with `@Override`. If the signature doesn't match the parent's, as with `equals(Point p)` instead of `equals(Object o)`, the compiler reports an error instead of quietly adding a new method."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Stopping a cloud server ends its compute charges but not the rest: its disks, snapshots and any reserved public IP address keep billing until you delete them. When an experiment ends, delete those too, not only the server."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "Double-check the exact name and publisher of a package before installing it. Attackers publish look-alike packages one typo away from popular ones, and installing one can run their code on your machine."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Use a set or dictionary for membership checks on large collections, not a list. In Python, `x in some_list` checks the items one by one, so code that is instant on test data slows to a crawl on real data."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "When several threads update the same variable, protect it with a lock or use a thread-safe structure. Even `count += 1` is several steps, so unprotected updates can be lost, and the bug tends to appear only under load."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Check which version of a library a tutorial was written for before following it. Functions get renamed or removed between major versions, and examples written for another version fail with confusing errors."

[[note]]
level = "beginner"
topic = "Testing"
text = "Test the edges, not just the typical case: empty lists, zero, negative numbers, missing fields and very long strings. Bugs cluster at these boundaries, and users will find them if your tests don't."

[[note]]
level = "beginner"
topic = "Git"
text = "Run `git status` before every commit and actually read the list. It is the easiest moment to notice a stray `.env` file, a huge log or an edit you never meant to include, before it becomes history."

[[note]]
level = "beginner"
topic = "Security"
text = "If a secret ever reaches a public repository, revoke it and create a new one right away. Deleting the commit is not enough, because automated scanners collect keys from public repositories all the time."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Declare JavaScript variables with `const` by default and `let` when you must reassign; avoid `var`. `var` ignores block scope, and outside strict mode, assigning to an undeclared name silently creates a global."

[[note]]
level = "beginner"
topic = "Time"
text = "Put the unit in the name of every duration setting, such as `timeout_ms` or `cache_ttl_seconds`. A bare `timeout = 30` gets read as seconds by one reader and milliseconds by another, and nothing warns you."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Add a `LICENSE` file to every public repository you want others to use. Without one, default copyright applies, and nobody may legally copy, modify or redistribute your code, even though they can read it."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Update or delete a comment whenever you change the code it describes. An outdated comment is worse than none, because readers trust it and it sends them the wrong way."

[[note]]
level = "beginner"
topic = "SQL"
text = "Give every join an `ON` condition. Listing tables with commas, as in `FROM users, orders`, without a matching `WHERE` pairs every user with every order and returns rows that look plausible but mean nothing."

[[note]]
level = "beginner"
topic = "DNS"
text = "Keep an export of your domain's DNS records, which most providers offer as a zone file download. If records are deleted by mistake or you lose the account, you can restore them instead of rebuilding them from memory."

[[note]]
level = "beginner"
topic = "Web"
text = "Check every page at phone width, with the DevTools device toolbar or a real phone, before you ship it; a layout built only at desktop width can push buttons off screen or make text too small to read."

[[note]]
level = "beginner"
topic = "Java"
text = "Keep Java fields `private` and change them only through methods. Public fields let any code set invalid values, and once other classes use them you can't add validation without breaking those classes."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Declare the page language with `<html lang=\"en\">`, or the right code for your content; screen readers use it to pick pronunciation rules, and browsers use it for hyphenation and translation offers."

[[note]]
level = "beginner"
topic = "Releases"
text = "Write your release steps down as a checklist in the repository, from running the tests to publishing. A release you do every few months from memory is exactly when a step gets skipped."

[[note]]
level = "beginner"
topic = "Linux"
text = "Give files the permissions they need instead of reaching for `chmod 777`. World-writable files and folders let any user or compromised program on the machine change them, including the scripts you run."

[[note]]
level = "beginner"
topic = "Regex"
text = "Use plain string methods such as `startswith`, `endswith`, `in` or `replace` when you are matching fixed text. A regex there invites escaping mistakes, since `.` and `+` are special, and makes simple code harder to read."

[[note]]
level = "beginner"
topic = "Code review"
text = "Read your own diff line by line before asking anyone to review it. You will catch leftover debug code and typos yourself, and reviewers can spend their attention on the real questions."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Write link text that makes sense out of context, like \"Download the annual report\" instead of \"click here\"; screen reader users often jump through a list of just the links on a page."

[[note]]
level = "beginner"
topic = "C"
text = "In C, pair every `malloc` with exactly one `free`, and set the pointer to `NULL` afterward. Leaks slowly exhaust memory in long-running programs, and freeing twice or using freed memory corrupts it."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Extract repeated code into a function once the same logic appears in three places. Copies drift apart as each gets fixed separately, and a bug fixed in one copy lives on in the others."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Give each version of a program you share its own version number, shown by a `--version` flag or on an About screen. When someone reports a bug, you then know exactly which code they were running."

[[note]]
level = "beginner"
topic = "Git"
text = "Start a new branch for each feature or fix instead of committing everything to `main`. Unfinished work then stays out of the way, and you can still ship an urgent fix from a clean `main` at any time."

[[note]]
level = "beginner"
topic = "Go"
text = "Return an `error` in Go for failures a caller can expect, such as a missing file or bad input, and save `panic` for bugs that should never happen. A library that panics on bad input takes the whole program down."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "Treat code copied from a forum or suggested by an AI assistant as untrusted until you have read it: check what each command does, and confirm that any package it installs really exists and is the one you meant."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Give forms that collect passwords or personal data `method=\"post\"`: with the default, `get`, every field ends up in the URL, where browser history, server logs and shared links keep it."

[[note]]
level = "beginner"
topic = "Databases"
text = "Change your database schema through migration files kept in version control, not by clicking through a GUI. Hand edits leave every copy of the database slightly different, and nobody can say exactly how."

[[note]]
level = "beginner"
topic = "Go"
text = "Run `go vet ./...` before committing Go code. It reports mistakes the compiler accepts, such as `Printf` calls whose format verbs don't match their arguments, before they reach your logs."

[[note]]
level = "beginner"
topic = "Teams"
text = "When you break something others rely on, say so right away and share what you're doing about it. Hiding a mistake slows the fix and costs more trust than the mistake itself."

[[note]]
level = "beginner"
topic = "HTTP"
text = "When your script fetches pages from someone else's site, pause between requests and send a `User-Agent` that says who you are; rapid anonymous requests get blocked and can overload small servers."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Never publish different code under a version number you have already released. People who installed the old one then have two different things with the same name, and bug reports stop making sense."

[[note]]
level = "beginner"
topic = "CI"
text = "Fix a failing build on `main` before starting anything new. Once people get used to a red build, a fresh failure looks just like the old one and real breakage goes unnoticed."

[[note]]
level = "beginner"
topic = "Observability"
text = "Send your app's unhandled errors somewhere you will see them, such as an error-tracking service or an alert email. Errors that only reach a log file on the server go unnoticed until users complain."

[[note]]
level = "beginner"
topic = "Data"
text = "Test your backups by actually restoring one. A backup job can fail silently for months, and you only find out on the day you need it."

[[note]]
level = "beginner"
topic = "Observability"
text = "When you log an error, include what the program was doing and with which input, such as a user ID or file name. A bare `Error: failed` tells nobody anything a few weeks later."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Store tokens for GitHub Actions in the repository's encrypted secrets and read them as `${{ secrets.NAME }}`, never in the workflow file. Workflow files are part of the repository, visible to everyone who can read the code."

[[note]]
level = "beginner"
topic = "Incidents"
text = "Keep a list of every outside service your project depends on, such as hosting, domain registrar, DNS, email and payments, with where to log in to each. When something breaks, you know every place the problem could be."

[[note]]
level = "beginner"
topic = "Testing"
text = "Check one behavior per test. A test that checks several stops at its first failed assertion, hiding the rest, and its name can no longer tell you what broke."

[[note]]
level = "beginner"
topic = "Incidents"
text = "After anything breaks in a project people use, write a short note: what happened, how you noticed, how you fixed it and what will prevent a repeat. Patterns appear after a few notes, and the next fix goes faster."

[[note]]
level = "beginner"
topic = "Security"
text = "Keep passwords, tokens and full card numbers out of your logs. Logs get copied into many tools and read by many people, and they usually live much longer than the data they mention."

[[note]]
level = "beginner"
topic = "APIs"
text = "Show users a clear message when an API call fails, and keep the rest of the page usable; code with no failure path leaves a blank area or a spinner that never stops."

[[note]]
level = "beginner"
topic = "Shell"
text = "Start every script with a shebang line such as `#!/usr/bin/env bash`. Without one, whatever program launches the file decides how to run it, and Bash-only syntax can break or fail outright."

[[note]]
level = "beginner"
topic = "Databases"
text = "Don't name tables or columns after SQL reserved words such as `order`, `user` or `group`. Every query then needs quoting, and in PostgreSQL `SELECT * FROM user` returns the current role name instead of your table."

[[note]]
level = "beginner"
topic = "Containers"
text = "Build from a specific base image version tag instead of `latest`. `latest` moves whenever the image's maintainers publish a new release, so the same `Dockerfile` can produce a different, possibly broken image next month."

[[note]]
level = "beginner"
topic = "Git"
text = "Bring the latest `main` into your working branch every day or two instead of once at the end. Small, frequent updates keep conflicts small, while weeks on a stale copy turn them into an afternoon of untangling."

[[note]]
level = "beginner"
topic = "APIs"
text = "When an API lets you choose a version, in the URL or a request header, pin the one your code was written against; otherwise the provider's next release can change responses underneath you."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Check a command's options in its own `--help` or man page before copying flags from a tutorial. The GNU, BSD (macOS) and BusyBox versions of tools like `sed`, `date` and `grep` accept different options."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Decode incoming bytes into text as soon as data enters your program, and encode only when it leaves. Mixing raw bytes and text in the middle of the code causes errors that show up only with non-ASCII input."

[[note]]
level = "beginner"
topic = "Rust"
text = "Run `cargo clippy` regularly on Rust code. It flags hundreds of common mistakes and unidiomatic patterns that still compile, and fixing them early keeps bad habits from spreading through your code."

[[note]]
level = "beginner"
topic = "CI"
text = "Give CI jobs names that say what they check, such as `lint` or `unit tests (Python 3.12)`. A failing check called `build (2)` makes everyone open the logs just to learn what broke."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "Download tools only from their official site or package manager, and compare the published checksum when one is offered (`sha256sum` on Linux, `shasum -a 256` on macOS). Tampered installers are a classic way to spread malware."

[[note]]
level = "beginner"
topic = "Databases"
text = "Store uploaded files such as images and PDFs in file or object storage, and keep only their path or key in the database. Large binary columns bloat backups and slow down every query that reads those rows."

[[note]]
level = "beginner"
topic = "Testing"
text = "Don't delete or skip a failing test just to get a green build. Find out why it fails; a test disabled \"for now\" tends to stay disabled while the bug it caught ships."

[[note]]
level = "beginner"
topic = "Git"
text = "Set `user.name` and `user.email` with `git config --global` before your first commit. Every commit records them, and correcting the author on commits you have already pushed means rewriting shared history."

[[note]]
level = "beginner"
topic = "Security"
text = "Protect your SSH private key with a passphrase and let `ssh-agent` remember it during your session. A key file without one gives anyone who copies it access to every server and repository it unlocks."

[[note]]
level = "beginner"
topic = "Python"
text = "Open files with `with open(path) as f:` so they are closed even when an error occurs. Files left open leak handles, and their last writes may not reach the disk when you expect."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Write a docstring for every function others will call, covering its inputs, its return value and the errors it raises. Without one, each caller has to read the whole function, and many will guess instead."

[[note]]
level = "beginner"
topic = "Data"
text = "Clean data with a script, not with hand edits in a spreadsheet. A script records every change and reruns in seconds when new data arrives, while hand edits cannot be reviewed or repeated."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Remove debug `print` and `console.log` lines before you commit. Left in, they clutter the output, can expose private data and bury the messages that actually matter."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Track bugs and ideas as GitHub issues rather than in your head. An issue keeps the details and discussion together, and writing `Fixes #12` in a pull request description closes it when the pull request merges into the default branch."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Never add methods to built-in prototypes such as `Array.prototype`. Every script on the page shares them, so your addition can clash with a library or with a future language feature of the same name."

[[note]]
level = "beginner"
topic = "Web"
text = "Start every HTML page with `<!DOCTYPE html>`. Without it, browsers fall back to quirks mode, which emulates old rendering bugs and makes your CSS behave differently from what the documentation describes."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Think twice before adding a package for something you could write in a few lines. Each dependency brings its own dependencies, updates and security risks, and that cost continues long after the convenience."

[[note]]
level = "beginner"
topic = "Linux"
text = "Install security updates regularly, for example with `sudo apt update && sudo apt upgrade` on Debian or Ubuntu. Unpatched machines get attacked through publicly known holes that an update had already fixed."

[[note]]
level = "beginner"
topic = "Linux"
text = "Install software through your package manager or a per-user tool rather than `sudo make install` or copying binaries into `/usr`. Files placed by hand are unknown to the package manager, so they never get updates and can't be cleanly removed."

[[note]]
level = "beginner"
topic = "Code review"
text = "Describe in each pull request how you tested the change, including the commands you ran. Reviewers can repeat the check, and later readers know which cases were covered and which were not."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Set a timeout on every outgoing HTTP request. Python's `requests` has no timeout by default, so a single unresponsive server can hang your program indefinitely."

[[note]]
level = "beginner"
topic = "C"
text = "Never use `gets` in C; read lines with `fgets`, which takes the buffer size. `gets` cannot know how big the buffer is, so long input overwrites nearby memory, and the function was removed from the C standard for that reason."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Keep functions short and focused on one job. A function that validates, calculates, saves and sends email all at once can't be tested or changed piece by piece, and every edit risks breaking the other jobs."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "Use well-reviewed libraries for encryption instead of inventing your own scheme. Homemade encryption usually looks fine in testing and falls apart as soon as someone who understands cryptography examines it."

[[note]]
level = "beginner"
topic = "Git"
text = "Keep every commit in a working state, building and passing its tests. Then `git bisect` can pinpoint the exact commit that introduced a bug; broken commits in between force you to skip them and muddy the answer."

[[note]]
level = "beginner"
topic = "Java"
text = "Give Java collections a type argument, as in `List<String>`, instead of using the raw `List`. Raw types switch off generic checks, so a wrong element slips in and fails later with a `ClassCastException` far from the mistake."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "Set and record random seeds in experiments and simulations, as in `random.seed(42)`. Without them, you can't rerun an interesting result or tell whether a change helped or just got a luckier draw."

[[note]]
level = "beginner"
topic = "Git"
text = "Name branches after what they do, such as `fix-login-timeout`, not `test2` or `my-branch`. In a list of twenty branches, a clear name is the only way to know which one to review, finish or delete."

[[note]]
level = "beginner"
topic = "Data"
text = "Check for duplicate rows before you count or sum anything: a record loaded twice doubles its share of every total, and nothing in the result looks wrong."

[[note]]
level = "beginner"
topic = "Go"
text = "In Go, write `defer f.Close()` right after checking the error from `os.Open`. Placed there, the close runs on every return path, including early returns that someone adds to the function later."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Search a project's existing issues, including closed ones, before opening a new one. Your problem may already have a fix or a workaround, and duplicates split the discussion and cost maintainers time."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Validate data from APIs, files and users at run time before giving it a TypeScript type. Types are erased when the code runs, so a cast like `as User` checks nothing and bad data travels deep before anything fails."

[[note]]
level = "beginner"
topic = "Containers"
text = "Base your images on a slim variant, such as `python:3.12-slim` rather than `python:3.12`, unless you need the extra build tools. Fewer packages mean smaller downloads and fewer vulnerabilities to patch."

[[note]]
level = "beginner"
topic = "CI"
text = "Run your linter and formatter check in CI, not only on your machine. Otherwise style problems creep back whenever someone's editor isn't set up, and reviews fill up with formatting comments."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Understand a fix before you paste it in from a forum or an AI answer. A change that makes an error disappear without you knowing why often hides the bug, or adds a new one you will meet later."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Count loops with integers, not floats. Stepping `x = 0.0` by `0.1` never reaches exactly `1.0`, so `while x != 1.0` runs forever; loop over `range(10)` and compute `i / 10` instead."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Give every issue a title that states the problem, such as `Login fails when the password contains a space`, not `Bug` or `Help`. Maintainers triage by title, and vague ones get skipped."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Reference third-party actions by a release tag or, safer still, a full commit SHA, never a branch such as `@main`. A branch can change at any moment, so a workflow that worked yesterday can run someone else's new code today."

[[note]]
level = "beginner"
topic = "Networking"
text = "Run a firewall on any server you manage and open only the ports you actually serve, such as SSH and HTTPS. Otherwise a database or admin tool you forgot was listening sits open to the whole internet."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Use your language's built-in sort and search functions instead of writing your own. They are fast and heavily tested, while a homemade version tends to hide edge-case bugs that surface on unusual input."

[[note]]
level = "beginner"
topic = "Shell"
text = "Create temporary files with `mktemp` instead of fixed names like `/tmp/output.txt`. Fixed names collide when two copies of a script run at once, and other users on the machine can tamper with them."

[[note]]
level = "beginner"
topic = "Go"
text = "When `main` returns, a Go program exits at once and any goroutines still running are stopped mid-work. Wait for them with a `sync.WaitGroup` or a channel before returning."

[[note]]
level = "beginner"
topic = "Security"
text = "Never deploy with debug mode on, such as `DEBUG = True` in Django. Debug error pages can show settings, source code and data to any visitor who manages to trigger an error."

[[note]]
level = "beginner"
topic = "Performance"
text = "Process large files line by line or in chunks instead of reading them whole. A program that calls `read()` on a small test file can run out of memory on the multi-gigabyte log it meets in real use."

[[note]]
level = "beginner"
topic = "Containers"
text = "Add a `USER` instruction to your `Dockerfile` so the app runs as an unprivileged user. Containers run as root unless told otherwise, which gives anyone who breaks into the app far more power than it needs."

[[note]]
level = "beginner"
topic = "Shell"
text = "Loop over files with a glob, as in `for f in *.txt`, not by parsing the output of `ls`. That output is meant for people to read, and names containing spaces or newlines come out split or mangled when a script reads it."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Test your code with non-ASCII input such as accented names, emoji and right-to-left text. Programs that only ever saw English data can break on real names, by crashing or by mangling them in storage."

[[note]]
level = "beginner"
topic = "Rust"
text = "Avoid `unsafe` blocks while you are learning Rust. They let you do things the compiler cannot check, and a mistake inside one can corrupt memory and break code far outside the block."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Keep storage buckets private unless their contents are meant for the whole internet. Automated scanners hunt for public buckets, and a bucket opened for a quick test is a well-known way for data to leak."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "Install editor and browser extensions only from publishers you trust, and remove the ones you no longer use. Extensions run with broad access to your files or pages, and a popular one can change owners or be hijacked."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "Don't let two programs or threads write the same file at once: their writes can interleave or overwrite each other. Give each writer its own file, or send everything through a single writer."

[[note]]
level = "beginner"
topic = "Releases"
text = "Keep a `CHANGELOG.md` with a short, user-facing entry for every release. Without it, people upgrading have to dig through your commit history to learn what changed or broke."

[[note]]
level = "beginner"
topic = "Git"
text = "Resolve merge conflicts by reading both sides, combining them deliberately and running the code before you commit the merge. Picking one side wholesale just to make the markers disappear silently discards someone's work."

[[note]]
level = "beginner"
topic = "Python"
text = "Add type hints to function signatures, as in `def total(prices: list[float]) -> float:`. They document what each function expects, and a checker such as `mypy` catches mismatches before your users do."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Treat compiler and linter warnings as bugs you haven't met yet, and fix them as they appear. Once there are dozens, the new one that matters gets lost in the noise."

[[note]]
level = "beginner"
topic = "Web"
text = "When a form fails validation, keep everything the user typed and point to the exact field that needs fixing. Wiping the form or showing one vague error at the top makes people give up on it."

[[note]]
level = "beginner"
topic = "Git"
text = "Commit working code before you try a risky change. Git can only bring back states you committed, so a checkpoint lets you throw away a failed experiment with `git restore .` instead of undoing it by hand."

[[note]]
level = "beginner"
topic = "Code review"
text = "Take review comments as feedback on the code, not on you. Asking questions and disagreeing with reasons is normal, but getting defensive teaches reviewers to hold back the comments you most need."

[[note]]
level = "beginner"
topic = "Git"
text = "Keep large binary files such as videos, datasets and archives out of Git, or track them with Git LFS. Every committed version stays in the history, so each change makes every future clone bigger and slower."

[[note]]
level = "beginner"
topic = "Git"
text = "Undo a commit that is already pushed with `git revert <commit>`, which adds a new commit reversing it. Resetting and force pushing instead rewrites history that others may have pulled, and their copies stop matching yours."

[[note]]
level = "beginner"
topic = "Git"
text = "Delete old code instead of commenting it out. Git keeps every earlier version, so you can always get it back, while commented-out blocks clutter the file and go stale as the code around them changes."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Protect `main` with a branch protection rule that requires a pull request and passing checks before merging. Otherwise one hasty push, from you or a collaborator, can put untested code where everyone builds from."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Turn on Dependabot alerts for your repositories. GitHub then tells you when a dependency you use has a known vulnerability, instead of you finding out after someone has used it against your project."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Before authorizing a GitHub App or OAuth app, read the permissions it asks for, and revoke apps you no longer use in your settings. An app with write access to all your repositories can push code as you if it is ever compromised."

[[note]]
level = "beginner"
topic = "Code review"
text = "Run the tests and the linter before you ask for a review. Making a reviewer point out a failing build or style errors wastes a round trip and trains them to expect unfinished work from you."

[[note]]
level = "beginner"
topic = "Teams"
text = "Tell your team as soon as you suspect a task will take longer than planned, not on the day it was due. Early news lets people adjust their plans; late news only lets them absorb the damage."

[[note]]
level = "beginner"
topic = "Shell"
text = "Read every command you copy from the internet before running it, and look up any part you don't understand. Commands with `sudo`, `rm -rf` or a pipe into `sh` can wreck your system or install something you never meant to."

[[note]]
level = "beginner"
topic = "Shell"
text = "Chain dependent commands with `&&`, as in `npm run build && npm start`, so each step runs only if the previous one succeeded. With `;` the next command runs even after a failure, often on missing or stale files."

[[note]]
level = "beginner"
topic = "Shell"
text = "Run `shellcheck` on your shell scripts. It catches unquoted variables, broken conditions and many other mistakes that Bash accepts silently until they meet an unusual file name or an empty value."

[[note]]
level = "beginner"
topic = "Shell"
text = "Turn command sequences you run more than twice into a script saved in your project. Commands that live only in your shell history get lost, mistyped and never reach your teammates."

[[note]]
level = "beginner"
topic = "Linux"
text = "Log in to your servers with SSH keys, and turn off password logins by setting `PasswordAuthentication no` in `sshd_config`. Servers on the internet face constant password-guessing attempts."

[[note]]
level = "beginner"
topic = "Linux"
text = "Write down every package you install and every config file you change on a server, ideally as a setup script. A machine that nobody can rebuild from notes becomes a disaster the day it fails."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Name project files and folders with plain ASCII letters, digits, hyphens and underscores. Spaces and accented letters break unquoted scripts and URLs, and some systems store the same accented name in different byte forms."

[[note]]
level = "beginner"
topic = "Python"
text = "Install packages with `python3 -m pip install ...` inside your activated virtual environment. A bare `pip` can belong to a different Python installation, so packages land where your program never looks."

[[note]]
level = "beginner"
topic = "Rust"
text = "Don't silence Rust's warning about an unused `Result` with `let _ = ...` out of habit. The warning means the call can fail, and discarding the `Result` lets a failed write go unnoticed; handle it or pass it up with `?`."

[[note]]
level = "beginner"
topic = "Python"
text = "Avoid `from module import *` in Python. It fills your namespace with names you can't see, can silently replace your own functions, and leaves readers unable to tell where a name came from."

[[note]]
level = "beginner"
topic = "Python"
text = "When you catch an exception you can't handle, log it with `logging.exception(...)` or re-raise it, so the traceback survives. Printing only the message throws away the file and line you will need later."

[[note]]
level = "beginner"
topic = "Python"
text = "Don't name variables after Python built-ins such as `list`, `dict`, `str` or `id`. The new name hides the built-in for the rest of that scope, and a later call like `list(items)` fails with a confusing `TypeError`."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Insert user-provided text into a page with `textContent`, not `innerHTML`. `innerHTML` parses the text as HTML, so a comment containing `<img src=x onerror=...>` can run code in other visitors' browsers."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Anything in your frontend JavaScript, API keys included, can be read by every visitor in the browser's developer tools. Keep secret keys on a server, and have the browser call that server instead."

[[note]]
level = "beginner"
topic = "Teams"
text = "Follow the conventions a codebase already uses, even where you would choose differently. Consistent code is easier for everyone to read; propose a new convention separately instead of mixing styles."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Never pass user input to `eval()` or `new Function()` in JavaScript. Both run the string as code with your page's full access, so a crafted input can steal data or act as the user."

[[note]]
level = "beginner"
topic = "Rust"
text = "Model states in Rust with an `enum`, as in `enum Status { Active, Suspended, Closed }`, instead of strings or boolean flags. A typo like `\"actve\"` then can't compile, and `match` makes you handle every state."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "When you must suppress a TypeScript error, use `// @ts-expect-error` with a short reason instead of `// @ts-ignore`. It errors once the problem is gone, so stale suppressions don't pile up and hide new bugs."

[[note]]
level = "beginner"
topic = "Go"
text = "In Go, add context when you return an error, as in `fmt.Errorf(\"reading config: %w\", err)`. A bare `no such file or directory` from deep inside the program says nothing about which step failed."

[[note]]
level = "beginner"
topic = "Go"
text = "Use the two-value form `price, ok := prices[item]` when a missing map key matters in Go. A plain lookup returns the zero value, so a missing price silently reads as `0`."

[[note]]
level = "beginner"
topic = "Rust"
text = "When the Rust borrow checker complains, work out which part of the code should own the data before reaching for `.clone()`. Cloning just to silence errors hides design problems and copies data on every call."

[[note]]
level = "beginner"
topic = "Rust"
text = "Take `&str` and `&[T]` parameters instead of `String` and `Vec<T>` when a Rust function only reads its input. Taking ownership forces callers to give up or clone their data, which is how `.clone()` ends up sprinkled everywhere."

[[note]]
level = "beginner"
topic = "Java"
text = "Return `Optional<T>` from Java methods that may have no result, instead of `null`. Callers then have to handle the empty case, while a forgotten `null` check surfaces later as a `NullPointerException` far from its cause."

[[note]]
level = "beginner"
topic = "Java"
text = "Build Java projects with Maven or Gradle, even small ones. The build file records dependencies and steps, so the project builds the same way on every machine instead of depending on hand-typed `javac` commands."

[[note]]
level = "beginner"
topic = "C"
text = "Pass an array's length along with the array to every C function that uses it. Inside the function the array is just a pointer, and `sizeof` gives the pointer's size, so nothing else marks where the data ends."

[[note]]
level = "beginner"
topic = "Rust"
text = "Use `v.get(i)`, which returns an `Option`, when a Rust index comes from input or a calculation. Indexing with `v[i]` panics when `i` is out of range, and the panic stops the program."

[[note]]
level = "beginner"
topic = "SQL"
text = "Wrap changes that belong together, such as moving money between two accounts, in one transaction with `BEGIN` and `COMMIT`. Without it, a crash between the two statements leaves your data half-updated."

[[note]]
level = "beginner"
topic = "SQL"
text = "Add an index on columns you often search or join by, such as `email` or `user_id`. Without one, the database reads the whole table for every query, which is instant with a hundred rows and painfully slow with millions."

[[note]]
level = "beginner"
topic = "SQL"
text = "Add `ORDER BY` whenever the order of results matters. Without it, SQL guarantees no order at all, and rows that came back sorted in testing can arrive shuffled once the table grows."

[[note]]
level = "beginner"
topic = "Databases"
text = "Store dates, numbers and true/false values in columns of matching types, not as text. Text columns accept `2024-02-31` and `ten`, sort `10` before `9`, and push every conversion into your code."

[[note]]
level = "beginner"
topic = "Databases"
text = "Store each fact in one place, such as a customer's address in one table that others refer to by ID. Copies kept in several tables drift apart when one gets updated and the others are forgotten."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Retry failed HTTP requests only a few times, waiting longer between attempts. Retrying instantly and endlessly turns a server's brief hiccup into a flood of requests that keeps it down."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Send API keys and tokens in request headers, not in URLs. URLs are saved in browser history, server logs and analytics tools, where many people can copy them."

[[note]]
level = "beginner"
topic = "APIs"
text = "Document each API endpoint's inputs, outputs and error responses, for example in an OpenAPI file. Without it, every client developer learns the API by trial and error and guesses wrong about the edge cases."

[[note]]
level = "beginner"
topic = "APIs"
text = "Read an API's rate limits before building on it, and cache responses you reuse instead of fetching them again. Scripts that ignore the limits get throttled or have their keys blocked."

[[note]]
level = "beginner"
topic = "Web"
text = "Resize and compress images before adding them to a web page. A photo straight from a phone can be several megabytes, and a page full of them loads slowly on mobile connections and uses up visitors' data."

[[note]]
level = "beginner"
topic = "Web"
text = "Test your site in at least two browser engines, such as Chrome and Firefox or Safari, before you ship. Features and CSS details differ between engines, and a page only ever tried in one can break for many visitors."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Structure pages with real headings in order, `<h1>` then `<h2>` and so on, instead of bold text styled to look like headings. Screen reader users jump between headings to navigate, and fake ones leave them without a map of the page."

[[note]]
level = "beginner"
topic = "Documentation"
text = "In setup instructions, show every command in full and say which directory to run it from. Steps like \"install the dependencies\" assume knowledge beginners don't have yet, and they stall on exactly those gaps."

[[note]]
level = "beginner"
topic = "Security"
text = "Lock your screen whenever you step away from your computer, with `Win+L` on Windows or `Ctrl+Cmd+Q` on macOS. An unlocked laptop hands anyone nearby your email, your repositories and every logged-in session."

[[note]]
level = "beginner"
topic = "Security"
text = "Turn on full-disk encryption, such as FileVault on macOS or BitLocker on Windows. Without it, whoever steals your laptop can read your code, SSH keys and saved passwords straight off the disk."

[[note]]
level = "beginner"
topic = "Security"
text = "Log in to important accounts by typing the address or using a bookmark, not through links in unexpected emails. Phishing pages copy GitHub and cloud login screens exactly, and one entered password can cost you the account."

[[note]]
level = "beginner"
topic = "C"
text = "Check whether `fopen` returned `NULL` before using the file, and report why with `perror(path)`. Reading through a null `FILE *` crashes, and without the check you never learn that the file was missing."

[[note]]
level = "beginner"
topic = "Performance"
text = "Load only what a page shows, using `LIMIT` or your framework's pagination, instead of fetching a whole table into memory. Fetching everything works on test data and times out once the table grows."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Change workflow files through a pull request instead of pushing them straight to `main`. The pull request runs your edited workflow, so a mistake fails there rather than breaking CI for everyone on the main branch."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Write down a function's assumptions, such as \"the list must be sorted\", in its doc comment. An unstated assumption gets broken by the next caller, and the bug shows up far from its cause."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Never declare a dependency with an open-ended range such as `*` or `>=1.0`. Every future major version, breaking changes included, can then be installed the next time dependencies are resolved."

[[note]]
level = "beginner"
topic = "Testing"
text = "Name tests after the behavior they check, such as `test_rejects_expired_coupon`, not `test1` or `test_function`. When one fails months later, the name alone tells you what broke."

[[note]]
level = "beginner"
topic = "Testing"
text = "Watch every new test fail at least once, for example by breaking the code on purpose. A test that can't fail, because of a typo or a wrong assertion, passes forever while checking nothing."

[[note]]
level = "beginner"
topic = "Testing"
text = "Keep unit tests away from the real network, the clock and random numbers: pass them in or replace them with fakes. Tests that depend on them fail at random, and people learn to ignore failures."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Before asking for help with a bug, cut the problem down to the smallest code that still shows it. You often find the cause while trimming, and if not, others can run your example instead of guessing."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Keep a short log while debugging: what you tried, what happened and what you ruled out. Without one you retry the same ideas, and with one you can hand a clear summary to whoever helps you."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Check your assumptions by printing or inspecting the actual values, types and lengths instead of reasoning about what they must be. Long debugging sessions usually end at a value that was never what the code assumed."

[[note]]
level = "beginner"
topic = "CI"
text = "Keep CI runs short, ideally a few minutes, by caching dependencies and splitting out slow suites. When CI takes an hour, people stop waiting for it and merge without seeing the results."

[[note]]
level = "beginner"
topic = "CI"
text = "Put your build and test steps in one script or `Makefile` target that both you and CI run. When CI runs different commands from yours, its failures are hard to reproduce and your local passes mean little."

[[note]]
level = "beginner"
topic = "Infrastructure as code"
text = "Apply infrastructure changes only from code that is committed and pushed. An apply run from edits on your laptop builds resources that exist in no repository, and the next apply from `main` quietly tries to undo them."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Pin the language version in your workflow, for example with `python-version-file: .python-version` in `actions/setup-python`. Otherwise the version can change when runner images are updated, and builds break without any change of yours."

[[note]]
level = "beginner"
topic = "Containers"
text = "Keep data that must survive, such as a database's files, in a volume. Anything written inside a container's own file system disappears when the container is removed and recreated."

[[note]]
level = "beginner"
topic = "Containers"
text = "Never bake passwords or API keys into a Docker image with `ENV` or `COPY`. Anyone who can pull the image can read them with `docker inspect` or by unpacking its layers; pass secrets in when the container starts."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Delete cloud resources as soon as an experiment ends, and name or tag each one with its purpose. Forgotten servers and disks keep costing money and keep offering attackers a way in."

[[note]]
level = "beginner"
topic = "Networking"
text = "Change the default password on every router, database and device you set up. Default credentials are printed in manuals and are the first thing automated attacks try."

[[note]]
level = "beginner"
topic = "C"
text = "Give every C header an include guard (`#ifndef CONFIG_H`, `#define CONFIG_H`, and `#endif` at the end) or `#pragma once`. Without one, a header included twice redefines its types and the build fails."

[[note]]
level = "beginner"
topic = "DNS"
text = "Expect DNS changes to spread gradually, because resolvers keep old answers until their TTL runs out. Make changes well before a launch, and keep the old server running until traffic has moved."

[[note]]
level = "beginner"
topic = "DNS"
text = "Protect your domain registrar account with a strong password and two-factor authentication. Whoever controls it can point your domain anywhere, including at a copy of your site that collects passwords."

[[note]]
level = "beginner"
topic = "Performance"
text = "Test your program with realistic amounts of data, not just the three records you typed in. Slow loops and missing indexes hide completely at tiny sizes and appear only when real data arrives."

[[note]]
level = "beginner"
topic = "Performance"
text = "Move work that doesn't change out of loops, such as opening a database connection or reading a config file. Repeating it for every item can turn a script that should take seconds into one that takes hours."

[[note]]
level = "beginner"
topic = "Observability"
text = "Set up an uptime check that alerts you when your site or API stops responding. Without one, you hear about outages from users, sometimes days after they began."

[[note]]
level = "beginner"
topic = "Performance"
text = "Log how long slow-prone operations take, such as imports, reports and exports. A duration that creeps up week by week warns you long before users start complaining."

[[note]]
level = "beginner"
topic = "Incidents"
text = "Write down how to deploy, restart and roll back your project while everything still works. During an outage you are stressed and short on time, the worst moment to rediscover those steps."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "Wait for the threads or tasks you start to finish, with `join()` or `await`, before using their results or exiting. Otherwise the program can read half-finished data or quit while work is still running."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Shuffle with a proper algorithm, such as Python's `random.shuffle` or a Fisher-Yates shuffle, not by sorting with a random comparison. Homemade shuffles are often biased, making some orders far more likely than others."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Compare floating-point numbers with a tolerance, as with Python's `math.isclose`, not with `==`. Rounding makes `0.1 + 0.2 == 0.3` false, so exact comparisons fail in ways that depend on how the values were computed."

[[note]]
level = "beginner"
topic = "Data"
text = "Parse CSV, JSON and dates with a library, not by splitting strings. Hand-rolled parsing breaks on the first quoted comma, escaped character or unusual date format, all cases libraries already handle."

[[note]]
level = "beginner"
topic = "Data"
text = "Check data as you load it: expected columns present, types correct, no impossible values such as negative ages. Problems caught at the door are easy to trace; found three steps later, they look like bugs in your analysis."

[[note]]
level = "beginner"
topic = "Regex"
text = "When you build a regex from user input or other text, escape it first, as with Python's `re.escape`. Otherwise characters such as `.`, `*` or `(` change the pattern's meaning or stop it from compiling."

[[note]]
level = "beginner"
topic = "Unicode"
text = "When shortening text, cut at character boundaries, never at a fixed number of bytes. Cutting UTF-8 in the middle of a multi-byte character leaves invalid bytes that show up as replacement characters or crash decoding."

[[note]]
level = "beginner"
topic = "Time"
text = "Do date arithmetic with your language's date library, not by adding `86400` seconds per day or 30 days per month. Months differ in length, and a local day is not always 24 hours when daylight saving time changes."

[[note]]
level = "beginner"
topic = "Code review"
text = "Answer every review comment, with a fix or a reason you disagree, before asking for another look. Unanswered comments force reviewers to reread everything to find out what changed and what was ignored."

[[note]]
level = "beginner"
topic = "Code review"
text = "When reviewing, ask about any line you don't understand instead of approving it anyway. Code that only its author understands becomes a problem the day the author is away."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Use comments to explain why the code does something unusual, not to repeat what each line does. `# add one to i` adds noise, while `# the API counts pages from 1` saves the next reader an hour."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Keep a `.env.example` file that lists every environment variable the project needs, with placeholder values. New contributors can set up the project without guessing, and nobody is tempted to pass around a real `.env`."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Pass data into functions as parameters instead of reading and changing global variables. With globals, any line anywhere can change a value, so a bug in one place shows up somewhere unrelated."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Keep settings such as URLs, file paths and limits in one config file or module, not scattered through the code. When one changes, you edit one line instead of hunting down every copy."

[[note]]
level = "beginner"
topic = "Releases"
text = "Before publishing a release, install the built package or run the build output on a clean machine or container. Files missing from the package, and paths that exist only on your laptop, show up there instead of in your users' bug reports."

[[note]]
level = "beginner"
topic = "Releases"
text = "Keep the files of your previous release available when you publish a new one. If the new version is broken, reinstalling the old one takes minutes instead of an evening of rebuilding it."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "Save the exact commands and parameters that produced each result in a script committed with the code. A number in a report that nobody can regenerate can't be checked, corrected or updated."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Run quick checks such as formatting and linting in a Git `pre-commit` hook. Problems are fixed before they are committed, instead of turning up later in CI or in review."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Keep your editor settings and shell configuration (your dotfiles) in a repository, with secrets left out. A new or wiped laptop then takes minutes to set up instead of a week of rediscovering what you had configured."

[[note]]
level = "beginner"
topic = "Teams"
text = "Ask technical questions in a shared team channel rather than in private messages. More people can answer, the answer stays searchable, and the next newcomer with the same question finds it."

[[note]]
level = "beginner"
topic = "Teams"
text = "Assign yourself to an issue, or say so in it, before you start working on it. Otherwise two people can spend days solving the same problem without knowing."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Commit a lockfile (`uv.lock`, `poetry.lock`, `package-lock.json` or a hashed `requirements.txt`). Without one, the same commit can install different code tomorrow."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "Decide and document what your public API is, since semantic versioning promises apply only to it. Mark internal modules as private, for example with a leading underscore, so changing them never counts as breaking."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Declare every package your code imports as a direct dependency. Code that relies on a package arriving transitively breaks the day the dependency that brought it in stops doing so."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Keep development-only tools such as test runners and linters out of your runtime dependencies (in npm, list them under `devDependencies`). Production installs can then skip them and ship fewer packages that could carry a vulnerability."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Read the release notes before bumping a dependency's major version. That is usually where breaking changes and migration steps are listed, and skipping them means discovering each one through a failing build or a production bug."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Remove dependencies you no longer use. An unused package still costs install time and review effort on every update, and a compromised release of it reaches your machines as easily as one you need."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Give every service a health check that exercises what it needs to serve traffic, and have deploys stop when new instances fail it. A rollout that only checks that the process started ships broken releases confidently."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Before adopting a dependency, check that it is maintained: recent releases, answered issues, more than one active maintainer. An abandoned package becomes code you have to patch yourself."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Check a package's license before you depend on it. Code published without a license gives you no permission to copy or redistribute it, and some licenses carry conditions your project may not be able to meet."

[[note]]
level = "intermediate"
topic = "CI"
text = "Make CI jobs that publish, tag or deploy safe to run twice, by checking whether their work is already done. People re-run failed pipelines, and a release that stopped halfway must not publish its packages a second time."

[[note]]
level = "intermediate"
topic = "Git"
text = "Write commit messages that say why the change was made. The diff already shows what changed; the reason is what a teammate reading `git log` or `git blame` a year later cannot recover on their own."

[[note]]
level = "intermediate"
topic = "Git"
text = "Keep each commit to one logical change. Focused commits let `git bisect` land on the real cause and let `git revert` undo one thing without dragging unrelated edits along."

[[note]]
level = "intermediate"
topic = "Git"
text = "Create a `.gitignore` before a project's first commit. Once build output or local config is tracked, adding it to `.gitignore` is not enough: you also have to untrack it with `git rm --cached`."

[[note]]
level = "intermediate"
topic = "Git"
text = "Decide as a team whether `git pull` merges or rebases, and set `pull.rebase` to match. Otherwise pulls on a busy branch keep adding commits like `Merge branch 'main' of ...` that bury the real history."

[[note]]
level = "intermediate"
topic = "Git"
text = "Merge or rebase the main branch into long-lived feature branches regularly. A branch that drifts for weeks turns one small merge into a pile of conflicts that nobody fully understands."

[[note]]
level = "intermediate"
topic = "Git"
text = "Delete branches once they are merged, both locally and on the remote. A repository with hundreds of stale branches hides the few that are active, and old ones get pushed or merged again by mistake."

[[note]]
level = "intermediate"
topic = "Git"
text = "Run the tests after resolving a merge conflict, not just once the conflict markers are gone. Two changes that are each correct can combine into wrong behavior even when the merged code compiles."

[[note]]
level = "intermediate"
topic = "Git"
text = "Read `git diff --staged` before every commit. Seeing exactly what you are about to record catches debug output, stray files and secrets while removing them is still trivial."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Turn on Require conversation resolution before merging in branch protection. Review threads then can't be forgotten: the pull request can't merge until every one of them is marked resolved."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Protect the default branch with required pull request reviews and required status checks. Without protection, a single hurried push can skip every safeguard the team relies on."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Add a `CODEOWNERS` file so pull requests touching sensitive paths automatically request review from the people who own them. Otherwise critical code can merge after review by someone who has never worked on it."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Allow only one merge method in each repository's settings, such as squash merging. Mixed methods leave some features as one commit and others as fifty, which makes history, reverts and bisecting inconsistent."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Add issue and pull request templates under `.github/` that ask for reproduction steps and testing notes. Reports that lack them cost rounds of back-and-forth before anyone can start working."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Review repository collaborators, deploy keys and installed apps whenever someone leaves or changes teams. Access that nobody revokes keeps working indefinitely."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Turn on secret scanning with push protection where your plan offers it. It rejects pushes containing many known credential formats before the secret lands in the remote's history."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Write a command-line tool's results to stdout, its progress and errors to stderr, and exit nonzero on failure. Pipes and scripts can then use the output without filtering noise and detect failures without parsing messages."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Resolve files relative to the script's own location, as in `dir=$(dirname \"${BASH_SOURCE[0]}\")`, not the current directory. A script that opens `./config.yml` works only when someone happens to run it from its own folder."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Run ShellCheck on shell scripts, both locally and in CI. It flags quoting mistakes, unset variables and non-portable syntax that otherwise surface only on the input that breaks them."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Run each service under its own unprivileged system account, created with `useradd --system`, rather than as root or your login user. A bug or compromise in one service then can't read or change the files of the others."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Clean up temporary files and background processes with a `trap` on `EXIT`, such as `trap 'rm -f \"$tmp\"' EXIT`. Without one, an error or early `exit` halfway through leaves debris behind for the next run."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Make scripts idempotent, so a second run is safe: use `mkdir -p`, create only what is missing, check before appending. Scripts that assume a clean start fail halfway on a rerun and leave a half-changed system."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Move a script to a general-purpose language once it needs data structures, JSON parsing or careful error handling. Long shell scripts are hard to test, and their quoting rules make every change risky."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Run a time sync service such as `chrony` or `systemd-timesyncd` on every server. Clock drift breaks TLS certificate checks and token expiry, and it scrambles the order of events across machines' logs."

[[note]]
level = "intermediate"
topic = "Regex"
text = "Validate structured values such as IP addresses with a parser, like Python's `ipaddress.ip_address()`, rather than a regex. A pattern such as `^\\d{1,3}(\\.\\d{1,3}){3}$` happily accepts `999.300.1.1`."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Reject or explicitly replace invalid UTF-8 at the point where data enters your system. Bad bytes passed through untouched fail later and farther away, in a JSON encoder, a strict database column or another team's service."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Keep private keys and credential files readable only by their owner (`chmod 600`). OpenSSH refuses a private key that others can read, but many other programs will use a world-readable secret without complaint."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Run long-lived processes under systemd or another supervisor instead of `nohup`. A unit with `Restart=on-failure`, enabled with `systemctl enable`, comes back after a crash or a reboot; a `nohup` job does not."

[[note]]
level = "intermediate"
topic = "Python"
text = "When mocking in Python tests, patch the name where it is used. After `from mail import send` in `orders.py`, patching `mail.send` leaves `orders.send` pointing at the real function; patch `orders.send` instead, or the test sends real mail."

[[note]]
level = "intermediate"
topic = "Python"
text = "Catch specific exceptions instead of using a bare `except:`. A bare except also catches `KeyboardInterrupt` and `SystemExit`, and it hides real bugs behind a generic fallback."

[[note]]
level = "intermediate"
topic = "Python"
text = "Give your Python classes a `__repr__` that shows their key fields. Without one, logs, error messages and the debugger show only `<Order object at 0x7f...>`, which tells you nothing when you're chasing a bug."

[[note]]
level = "intermediate"
topic = "Python"
text = "Use the `logging` module instead of `print` in services and libraries. Log records carry a level, timestamp and logger name, and they can be filtered or routed without editing code."

[[note]]
level = "intermediate"
topic = "Python"
text = "In library code, get loggers with `logging.getLogger(__name__)` and leave handlers and `basicConfig` to the application. A library that configures logging itself duplicates, reformats or hides the application's log lines."

[[note]]
level = "intermediate"
topic = "Python"
text = "Make deprecation warnings fail your tests (`-W error::DeprecationWarning`, or `filterwarnings` in the pytest configuration). They are often the only notice you get before an API you use is removed."

[[note]]
level = "intermediate"
topic = "Python"
text = "Make your project installable with a `pyproject.toml` instead of relying on the current directory being on `sys.path`. Imports that only work from one folder break in CI, in tests and on teammates' machines."

[[note]]
level = "intermediate"
topic = "Python"
text = "Use timezone-aware datetimes in Python, such as `datetime.now(timezone.utc)`. Naive datetimes carry no zone, so mixing them with aware ones raises errors or silently assumes the wrong zone."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Keep `package.json` scripts cross-platform: npm runs them with `cmd.exe` on Windows, where `rm -rf dist` or `NODE_ENV=production node app.js` fail, so use Node-based tools or small scripts when teammates use Windows."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Keep blocking and CPU-heavy work, such as `fs.readFileSync` or large loops, out of Node.js request handlers. While it runs, the event loop is stalled and every other request on that process waits."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Read and validate configuration such as `process.env` values once at startup, and exit with a clear message when one is missing, instead of letting the service boot and crash on the first request that needs it."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Remove event listeners, timers and subscriptions when a component unmounts. Leftovers keep old objects reachable, so long-lived single-page apps slowly leak memory and repeat work."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Debounce handlers for fast-firing events such as `input`, `resize` or `scroll`, so expensive work runs once the burst ends; running it on every event freezes the page and floods your API with requests."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Declare return types on exported functions: otherwise an edit deep inside the body silently changes the inferred type for every caller, and the errors appear far away instead of at the function itself."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Type array and object parameters that a function must not change as `readonly`, as in `readonly Item[]`, so an in-place `sort` or `push` on the caller's data becomes a compile error."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Prefer `unknown` to `any` for values of uncertain type, and narrow before use. An `any` switches off checking for everything derived from it, so mistakes the compiler would have caught reach production."

[[note]]
level = "intermediate"
topic = "Web"
text = "Set a size budget for your JavaScript bundles and check it in CI: every kilobyte has to be downloaded, parsed and executed, and pages bloat one dependency at a time when nobody is watching."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Validate data from outside your program (API responses, `JSON.parse` output, form input) at runtime, for example with a schema library. Types vanish at compile time, and a cast like `as User` only silences the compiler."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Enable `noUncheckedIndexedAccess` in `tsconfig.json`; `strict` does not include it. Without it, `items[i]` is typed as always defined, so an out-of-range read passes the compiler and fails at runtime."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Write tests for the failure paths too: the timeout, the malformed input, the full disk. Error-handling code runs rarely, so its bugs survive until the day it matters most, when a crash in the handler hides the original problem."

[[note]]
level = "intermediate"
topic = "Go"
text = "Pass `context.Context` through request paths in Go and stop work when it is canceled. Otherwise work for clients that already gave up keeps running and holding database connections."

[[note]]
level = "intermediate"
topic = "Go"
text = "Run `go test -race` in CI. Data races cause rare, hard-to-reproduce corruption, and the race detector only finds races on code paths your tests actually execute."

[[note]]
level = "intermediate"
topic = "Go"
text = "After looping over `rows.Next()` with Go's `database/sql`, check `rows.Err()`. The loop stops the same way on a network error as on the last row, so skipping the check can silently return partial results."

[[note]]
level = "intermediate"
topic = "Go"
text = "Set `ReadHeaderTimeout`, and usually `ReadTimeout`, `WriteTimeout` and `IdleTimeout`, on every Go `http.Server`. Left at their zero values they impose no timeout at all, so slow or idle clients can hold connections and goroutines open indefinitely."

[[note]]
level = "intermediate"
topic = "Java"
text = "Compile with `javac --release N` (or the matching Maven or Gradle setting) rather than only `-source` and `-target`. `--release` also rejects APIs missing from Java N, so a build on a newer JDK won't fail with `NoSuchMethodError` on older runtimes."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "Publish internal packages under a scope you own (such as `@yourco/` on npm) and map that scope to your private registry. Otherwise a public package with the same name can be installed in its place, an attack known as dependency confusion."

[[note]]
level = "intermediate"
topic = "Java"
text = "Keep `compareTo` consistent with `equals` in Java. `TreeSet` and `TreeMap` treat objects that compare as zero as duplicates, so if `compareTo` looks only at salary, two employees with the same salary collapse into one entry."

[[note]]
level = "intermediate"
topic = "Java"
text = "Inject a `java.time.Clock` instead of calling `Instant.now()` or `LocalDate.now()` directly. Tests can then pass `Clock.fixed(...)`, while code tied to the system clock can't be tested for midnight, month ends or daylight saving changes."

[[note]]
level = "intermediate"
topic = "Go"
text = "Put Go packages that other modules shouldn't use under an `internal/` directory. The toolchain refuses imports of them from outside the tree rooted at the parent of `internal`, so you can change them without breaking anyone."

[[note]]
level = "intermediate"
topic = "Java"
text = "Close streams, connections and statements with try-with-resources. Resources left for the garbage collector are released late or never, and connection pools and file handles run out."

[[note]]
level = "intermediate"
topic = "Java"
text = "Override `hashCode` whenever you override `equals`. Objects that are equal but hash differently get lost in a `HashMap` or `HashSet`, causing bugs far away from the class itself."

[[note]]
level = "intermediate"
topic = "Java"
text = "Pass an explicit charset whenever Java converts between bytes and text, as in `new String(bytes, StandardCharsets.UTF_8)`. Before Java 18 the default depended on the platform, so the same code could garble text on another machine."

[[note]]
level = "intermediate"
topic = "Java"
text = "Use `java.time` types such as `Instant` and `LocalDate` in new code instead of `Date`, `Calendar` and `SimpleDateFormat`. The old classes are mutable, and `SimpleDateFormat` is not thread-safe."

[[note]]
level = "intermediate"
topic = "Go"
text = "Pass Go structs that contain a `sync.Mutex` by pointer, never by value. A copy gets its own lock, so the copy and the original no longer exclude each other; `go vet` reports such copies."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Give a Rust library its own error enum instead of returning `String` or `Box<dyn Error>`. Callers can then `match` on what went wrong, such as retrying a timeout but not bad input, without parsing messages."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Keep a Rust binary's logic in `src/lib.rs` and make `src/main.rs` a thin wrapper that calls it. Integration tests in `tests/` and doc tests can only use a library crate, so code left in `main.rs` is hard to test."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Pass values to SQL through query parameters, never by building strings. Concatenated SQL is open to injection, and hand-written escaping eventually misses a case."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Index the columns that frequent queries filter and join on, and confirm with `EXPLAIN` that the index is used. A missing index is invisible on small data and turns into a full table scan as the table grows."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Name the columns you need instead of `SELECT *` in application queries. A new or reordered column then cannot silently change what the code receives, and less data crosses the network."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Wrap multi-statement writes in a transaction. If a later statement fails, the transaction rolls back the earlier ones; without it, the database keeps half an update."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "Keep a slow, obviously correct version of any clever algorithm and compare the two on thousands of random inputs in your tests. Mismatches reveal edge cases that hand-picked examples never reach."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Write down which lock protects each piece of shared state, next to its declaration, such as a `// guarded by mu` comment in Go or Java's `@GuardedBy` annotation. A rule that lives only in someone's head gets broken by the next change."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Give every table a primary key. Without one, duplicate rows creep in, and you cannot reliably update or delete a single record."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Store money in `DECIMAL` or `NUMERIC` columns, or as integer cents, never as floating point. Binary floats cannot represent most decimal amounts exactly, and rounding errors accumulate in totals."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Restore your backups into a scratch environment on a schedule. Until a restore has succeeded, you do not know whether the backups are complete, recent enough or usable at all."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Manage schema changes through versioned migration files in the repository. Changes applied by hand drift between environments until staging no longer predicts production."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Make each migration compatible with the code already running: add the new column, deploy code that uses it, and drop the old one in a later release. Otherwise a rolling deploy breaks the old instances mid-release."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Use a connection pool and set its maximum size on purpose. A connection per request wastes time on setup, and too many clients can hit the server's `max_connections` limit."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Give each thread its own database connection from a pool unless the driver documents connections as thread-safe. Interleaved use of one connection mixes up transactions and results, and the failures look random."

[[note]]
level = "intermediate"
topic = "Data"
text = "Pass explicit column types when loading data, as with `dtype=` in pandas `read_csv`, instead of relying on inference. Inferred types follow the data, so an ID column parsed as numbers today can arrive as text tomorrow."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Set a connection timeout in your database client, such as `connect_timeout` in a PostgreSQL connection string. Without one, a database that stops answering can leave requests hanging for minutes instead of failing fast."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Set a `statement_timeout` for application roles in PostgreSQL, or your database's equivalent. One runaway query can otherwise hold locks and a connection until the pool runs dry."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Declare columns `NOT NULL` unless a missing value has a real meaning. Every nullable column brings three-valued logic into the queries that touch it, and code that assumes a value is always there fails on the first `NULL`."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Log the SQL your ORM sends while you develop, with `echo=True` in SQLAlchemy's `create_engine` or Django's `connection.queries` in debug mode. Seeing the real queries exposes repeated and oversized ones before they reach production."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Keep an up-to-date map of your network: subnets, VPNs, firewall rules and which services talk to which. Without it, every connectivity problem starts by rediscovering how traffic is supposed to flow."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Watch the memory of long-running processes over days, not minutes. A leak of a few kilobytes per request looks flat in a short test and ends in an out-of-memory crash a week after release."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Protect records that people edit concurrently with optimistic locking: a version column checked in `UPDATE ... WHERE id = ? AND version = ?`, plus a check that one row changed. Without it, the last save silently overwrites earlier changes."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Set a UTF-8 locale, such as `LANG=C.UTF-8`, for services, cron jobs and containers. Under the default `C` or `POSIX` locale, some programs reject non-ASCII input or mangle it in file names and output."

[[note]]
level = "intermediate"
topic = "Security"
text = "Encrypt database backups and restrict who can read them. A backup holds the same data as production, often with none of production's access controls."

[[note]]
level = "intermediate"
topic = "Data"
text = "Use seeded or anonymized data in development and test environments rather than copies of production. Every laptop and test database holding real customer data is another place a breach can start."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Send reads that must reflect a user's own recent write to the primary database, not a read replica. Replicas lag behind, so the page shown right after a save can display the old data."

[[note]]
level = "intermediate"
topic = "Data"
text = "Define a retention period for each kind of data and run a job that deletes what has expired. Tables that only grow slow down queries, backups and restores year after year."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Fix N+1 query patterns by loading related rows in one query, with a join or `IN (...)`. One query per item adds a database round trip for every row listed, so pages slow down as lists get longer."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Set a timeout on every outbound HTTP request. Without one, a single hung dependency ties up threads or connections until your own service stops responding."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Retry failed requests only when they are safe to repeat, and use exponential backoff with jitter. Immediate retries multiply the load on a struggling service and can duplicate operations such as payments."

[[note]]
level = "intermediate"
topic = "Web"
text = "Make core tasks such as reading content and submitting forms work before JavaScript loads, or when it fails; scripts break on flaky networks, old devices and conflicting browser extensions."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Caption every video that has speech, and review auto-generated captions before publishing; uncorrected captions garble names and technical terms, leaving deaf viewers with the wrong message."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Set font sizes in `rem` rather than `px`, so text follows the reader's default font size setting; with fixed pixel sizes, people who raised that setting to read comfortably get no benefit."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Keep `GET` requests free of side effects. Crawlers, link previews and browser prefetching all issue `GET` requests on their own, so a `GET /delete?id=5` link will eventually be followed."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Choose a versioning scheme before your API's first public release, such as a `/v1/` path prefix. Without one, the first breaking change forces every client to upgrade at the same moment."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Accept an idempotency key on endpoints that create orders or move money. Clients retry after timeouts, and without deduplication a retried request can create a second order or a second charge."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Paginate every list endpoint from the start. An unpaginated endpoint works on test data, times out on production data, and adding pagination later is a breaking change for clients."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Return errors in one consistent, documented shape, for example RFC 9457 problem details. Clients can then handle failures in one place instead of parsing a different format per endpoint."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Treat removing or renaming a response field as a breaking change, even if your own frontend no longer reads it. Clients you do not know about may depend on it."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Keep a machine-readable API contract, such as an OpenAPI document, in the repository and test the implementation against it. Documentation maintained separately drifts until clients stop trusting it."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Put limits on every input: maximum body size, string length and page size. An endpoint that accepts unbounded input can be knocked over by one oversized request."

[[note]]
level = "intermediate"
topic = "Security"
text = "Verify the signature on incoming webhooks before acting on them. Without the check, anyone who discovers the endpoint URL can send forged events that your system will trust."

[[note]]
level = "intermediate"
topic = "Security"
text = "Rate-limit public endpoints, starting with login, signup and password reset. Without limits, one client can exhaust your capacity or try thousands of passwords a minute."

[[note]]
level = "intermediate"
topic = "Time"
text = "Send timestamps in APIs as ISO 8601 with an explicit offset, such as `2025-03-14T09:30:00Z`. Bare local times and formats like `03/04/2025` get read differently by different clients."

[[note]]
level = "intermediate"
topic = "Web"
text = "Deploy a Content Security Policy, starting with the `Content-Security-Policy-Report-Only` header to find violations. It restricts where scripts may load from, which limits the damage when an XSS bug slips through."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Enable gzip or Brotli compression for HTML, CSS, JavaScript and JSON responses; text often shrinks to a fraction of its size, and without it every visitor downloads the full bytes."

[[note]]
level = "intermediate"
topic = "Web"
text = "Repeat every validation on the server even when the form already validates in the browser. Client-side checks help users, but anyone can send a request that skips them."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "When you move pages, redirect each old URL with `301` or `308` to its own new address, not everything to the home page; bookmarks, links and search results then keep leading people to the right content."

[[note]]
level = "intermediate"
topic = "Web"
text = "Give images and embeds explicit `width` and `height` attributes or a CSS `aspect-ratio`. Without reserved space, the page shifts as media loads and users click the wrong thing."

[[note]]
level = "intermediate"
topic = "Security"
text = "Escape output for the context it lands in: HTML text, attributes, URLs and inline JavaScript each need different encoding. One escape function applied everywhere leaves gaps attackers can use."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Give every meaningful image descriptive `alt` text and every decorative one `alt=\"\"`. Without the attribute, screen readers may announce the file name, or nothing useful at all."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Give every API error a stable machine-readable code, such as `card_declined`, next to the human-readable message; clients that have to match on message text break as soon as someone rewords it."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Associate every form field with a visible `<label>`. Placeholder text disappears as soon as someone types and is not a reliable accessible name."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Meet WCAG AA contrast ratios: at least 4.5:1 for normal text and 3:1 for large text. Low-contrast text is hard to read for people with low vision and for everyone on a phone in sunlight."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Make every interaction work with the keyboard alone, and keep a visible focus indicator. Removing `outline` without a replacement leaves keyboard users unable to see where they are."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Never use color as the only signal, for example to mark form errors or chart series. Add text, an icon or a pattern, since many people cannot tell red from green."

[[note]]
level = "intermediate"
topic = "Security"
text = "Keep secrets out of the repository and load them from the environment or a secret manager. Anything committed stays in history, and every clone and fork keeps a copy."

[[note]]
level = "intermediate"
topic = "Security"
text = "Give each service and environment its own credentials instead of sharing one key. When one leaks, you can revoke it without breaking everything else, and access logs show which service used it."

[[note]]
level = "intermediate"
topic = "Security"
text = "Log authentication events, permission changes and denied requests. Without that trail, you cannot tell after an incident what an attacker did or which accounts they touched."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Build development and test databases from committed migrations and seed scripts, never by hand. A database someone set up manually cannot be recreated when it breaks, and tests that pass on it may fail on a fresh one."

[[note]]
level = "intermediate"
topic = "Security"
text = "Store user uploads outside the web root under names you generate. A user-chosen name like `shell.php` in a directory the server executes can turn an upload into remote code execution."

[[note]]
level = "intermediate"
topic = "Security"
text = "Use your framework's authentication and session handling, or a well-maintained library, instead of writing your own. Login code has many subtle requirements, from session rotation to reset-token expiry, that homemade versions miss."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Turn off TLS 1.0 and 1.1 on your servers and load balancers: both are formally deprecated and lack modern cipher suites. Accept TLS 1.2 and 1.3, and let the library choose strong cipher suites."

[[note]]
level = "intermediate"
topic = "Security"
text = "Check authorization on every object a request touches, not only at login. Changing `/invoices/1041` to `/invoices/1042` is the simplest attack there is, and it works wherever ownership is not verified."

[[note]]
level = "intermediate"
topic = "Security"
text = "Give every session and API token an expiry, and make it possible to revoke them. Tokens that never expire turn one leak into permanent access."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "Turn on two-factor authentication for your source hosting, cloud and package registry accounts. A phished password alone should not be enough to push code or publish a package."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "Require review from designated owners for changes to CI workflows, build scripts and dependency manifests. These files decide what runs with your secrets and what ships, so a quiet edit there is a supply chain attack."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Generate tokens and reset codes with a cryptographically secure source (`secrets` in Python, `crypto.getRandomValues` in JavaScript), never `random` or `Math.random`, whose output can be predicted."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Compare secrets such as tokens and signatures with a constant-time function (`hmac.compare_digest` in Python, `crypto.timingSafeEqual` in Node.js). Ordinary equality can reveal through its timing how many leading bytes matched."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Use a high-level, well-reviewed library such as libsodium instead of assembling cryptographic primitives yourself. Correct encryption depends on details like nonce handling and authentication that are easy to get subtly wrong."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Keep TLS certificate verification on in every HTTP client. Disabling it to get past an error (`verify=False`, `NODE_TLS_REJECT_UNAUTHORIZED=0`) tends to reach production and allows silent man-in-the-middle attacks."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Read a pull request's tests before its implementation. They show what the author meant to build and which cases they considered, and missing or thin tests are the first thing worth commenting on."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "Scan dependencies for known vulnerabilities in CI with a tool like `npm audit`, `pip-audit` or `govulncheck`. New advisories are published against versions you already ship, so last month's clean scan says little about today."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Spread reviews across the team instead of sending them all to one senior engineer. A single reviewer becomes the bottleneck for every merge, and nobody else learns the code they would have reviewed."

[[note]]
level = "intermediate"
topic = "CI"
text = "Keep CI tests away from live third-party APIs. An outage, rate limit or expired test account on their side fails your builds for reasons unrelated to your change; use fakes or recorded responses, and test real integrations in a scheduled job."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Test your setup instructions the way a newcomer would, in a fresh container or on a clean machine, whenever they change. Steps that only work because something is already installed on your laptop turn a new teammate's first day into guesswork."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Bind databases, caches and admin panels to private interfaces, and block their ports at the firewall. Anything listening on a public address gets probed by internet-wide scanners."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Apply operating system security patches on a schedule, for example with `unattended-upgrades` on Debian and Ubuntu. Servers that are never patched accumulate known vulnerabilities that attackers scan for."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "Follow semantic versioning honestly: any breaking change bumps the major version, however small. Consumers set their version ranges on the promise that minor and patch releases are safe to take."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "Deprecate before you remove: mark an API deprecated, with a warning, in one release and remove it only in a later major version. Users get time to migrate instead of a broken build."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "Version data formats, config files and message schemas, not only code. Once a format changes, consumers of an unversioned one cannot tell which shape they are reading."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Before fixing a bug, write a test that reproduces it and fails. The test proves the fix works and keeps the same bug from quietly returning in a later change."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Make tests independent of each other and of execution order. Tests that share state pass in one order and fail in another, and the failures look random."

[[note]]
level = "intermediate"
topic = "DNS"
text = "Host staging and test DNS records in a separate zone or domain from production, with their own credentials. Then a script or a person working on test records cannot change or delete the ones customers depend on."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Test behavior through public interfaces rather than private details. Tests coupled to internals break on every refactor, and a team that keeps repairing them stops trusting them."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Control time and randomness in tests: inject a clock and seed random generators. Tests that read the real clock can break around midnight, at month ends or in another time zone."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Keep the unit test suite fast enough to run before every push. Once it takes too long, people skip it locally and learn about failures from CI much later."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Test error paths, not only the happy path: timeouts, invalid input, empty results and permission failures. Untested error handling is often the code that fails during an outage."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Use coverage reports to find untested code, not as a number to hit. When the percentage becomes the goal, effort goes to trivial lines while the risky branches stay untested."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Keep some integration tests that run against real dependencies, not only mocks. A suite built entirely on mocks proves the code agrees with the mocks, not that it works with the real thing."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Block real network calls to third-party services in unit tests. Tests that depend on live external APIs fail whenever those APIs are slow, rate-limited or down."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Assert on specific results, not merely that no exception was raised. A test with weak assertions keeps passing after the code starts returning wrong answers."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Wait for a condition in asynchronous tests instead of calling `sleep`. Fixed sleeps make the suite slow and still fail on a loaded CI machine."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Test with realistic data: accented and non-Latin names, empty strings, very long values and large collections. Code tested only with `\"foo\"` and `42` breaks on the first real customer record."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "When you write an algorithm, test it at its boundaries: zero items, one item, all-equal items, already sorted input and the maximum size. Off-by-one errors and worst-case slowdowns hide at the edges."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "When you report or investigate a bug, record the exact versions, configuration and input involved. The difference between a machine where it works and one where it fails usually hides in a detail nobody wrote down."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Change one thing at a time while debugging, and write down what you tried. Changing several things at once hides which one mattered and can introduce a second bug."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Read the tests first when you review a pull request. They show what the author believes the change does, and the gap between the tests and the code is where review finds its most useful comments."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Write error messages with enough context to act on: the operation, the relevant identifier and the underlying cause. `Error: failed` forces the next person to reproduce the problem just to learn what happened."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Keep source maps or debug symbols for production builds in a private store. Without them, crash reports show minified names or raw addresses that nobody can map back to code."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "When you solve a hard bug, record the cause and the fix where others will look: the commit message, the issue or a runbook. The same symptom will come back, and the next person should not start from zero."

[[note]]
level = "intermediate"
topic = "CI"
text = "Run the same checks locally and in CI through one entry point, such as `make check` or an npm script. When CI runs commands nobody can run locally, every failure takes several push-and-wait cycles."

[[note]]
level = "intermediate"
topic = "CI"
text = "Keep the main branch green: fix or revert a broken build before merging anything else. On a red branch, new failures hide behind the old one, and nobody knows which change broke what."

[[note]]
level = "intermediate"
topic = "CI"
text = "Keep secrets out of CI logs: never echo them, and avoid `set -x` in steps that handle credentials. Log masking catches exact values, not encoded or transformed ones, and CI logs are often readable by everyone with access to the repository."

[[note]]
level = "intermediate"
topic = "CI"
text = "Upload test reports and logs as CI artifacts. When a failure happens only in CI, those files are often the only evidence you have to debug it."

[[note]]
level = "intermediate"
topic = "CI"
text = "Apply the full migration history in CI against an empty database. A migration that only works on your local copy, thanks to a table someone created by hand, fails at deploy time."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Build each release artifact once and promote that same artifact through staging and production. Rebuilding per environment can produce a binary that differs from the one you tested."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "Reach managed databases and caches over private networking rather than through public endpoints with IP allowlists. A public endpoint is one bad rule away from the whole internet, and allowlists rot as addresses change."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Declare `permissions` in every workflow, starting from `contents: read`, and widen them per job only where needed. Depending on repository settings, the default `GITHUB_TOKEN` can write, and any compromised step inherits that."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "CloudWatch Logs log groups keep data forever by default, so logs from chatty services pile up storage costs year after year. Set a retention period on every log group, ideally when you create it in code."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Give deployment workflows a `concurrency` group so two deploys to the same environment never overlap. Overlapping runs can finish out of order and leave an older version live."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Run one main process per container and let the runtime restart it when it exits. A container lives only as long as its main process, so extra services a startup script launches in the background can crash without anyone noticing."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Set a memory limit on containers that share a host, with `docker run --memory` or `mem_limit` in Compose. Without one, a leak in any container can exhaust the host's memory until the kernel starts killing processes, possibly in other containers."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Keep pull requests small and focused on one change. Large ones get skimmed and approved, so the riskiest changes receive the least real review."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Leave formatting and style to automated tools, and spend review time on behavior and design. Attention spent on spacing is attention not spent on the unhandled edge case."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Respond to review requests within about a working day. Slow reviews push authors to batch work into bigger pull requests, which makes every later review slower still."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Explain the reasoning behind review comments and label which ones block merging. Authors then fix what matters instead of guessing, and nitpicks stop holding up good changes."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Agree on a written definition of done, such as tested, documented and deployed behind a flag. Without one, done means merged to one person and running in production to another, and work slips through the gap."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Do not approve changes you do not understand; ask questions until you do. An approval tells the team that a second person believes the change is correct."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Keep a README that takes a new developer from clone to passing tests in a few commands. When setup lives only in people's heads, every new hire costs a teammate hours of hand-holding."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Update documentation in the same pull request as the code it describes. Docs promised for later rarely arrive, and stale docs mislead the people who trust them."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Document each public function's inputs, outputs, errors and side effects in its docstring or doc comment. Callers who have to read the implementation instead end up depending on its accidental details."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Add a `SECURITY.md` that explains how to report vulnerabilities privately. Without one, a researcher may open a public issue and disclose the problem to everyone before you can fix it."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Track business events such as sign-ups, orders and messages sent next to technical metrics, and alert when they drop. A bug that silently stops checkouts can leave error rates and latency perfectly normal."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Keep business logic out of HTTP handlers and UI components, in plain modules you can test directly. Logic buried in handlers can only be tested through the whole stack."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Decide how each feature degrades when a dependency fails: serve cached data, hide the feature or queue the work. Without a plan, one failing dependency takes the whole product down."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Avoid sharing one database between services owned by different teams. A shared schema couples their releases, and no one can change a table without coordinating everyone."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Read environment-specific settings such as URLs, credentials and feature flags from configuration, not constants in code. Hard-coded values force a rebuild per environment and put secrets in Git."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Run workloads through a Deployment, StatefulSet or Job rather than as bare pods. A pod created on its own is not replaced when its node fails or it gets evicted, so the app simply stays down."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "Keep secrets out of committed `.tfvars` files and variable defaults. Pass them in at run time from a secrets manager or as `TF_VAR_` environment variables in the pipeline, and mark those variables `sensitive`."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Prefer a few lines of shell over a third-party action for simple jobs such as setting a variable or calling an API with `curl`. Every action you add is code from another author that runs with your token and secrets."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Put all the team's work on its board, including support requests and quick fixes. Invisible work can't be prioritized, and the person doing it looks idle while actually being overloaded."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Add `#[must_use]` to Rust functions whose return value is the whole point, such as a method that returns a modified copy. Callers who ignore the result then get a compiler warning instead of a silent no-op."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Handle `SIGTERM` in containerized apps and shut down gracefully. A process running as PID 1 gets no default signal handling, so without a handler it ignores `SIGTERM` until the runtime kills it outright."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Set CPU and memory requests on every container, plus a memory limit. Without requests the scheduler places pods blindly, and without limits one leaking pod can starve its neighbors."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Give each pod a readiness probe that checks whether it can serve traffic. Without one, Kubernetes treats a container as ready as soon as it starts, so rolling updates send requests to pods still warming up."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Put an issue number or an owner in every TODO comment, as in `TODO(#482)`. An anonymous TODO has nobody to finish it, and years later nobody knows whether it still matters."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "Change infrastructure only through its code, whether Terraform, CloudFormation or similar. Manual console edits drift from the definitions until nobody knows the real state, and the next apply may undo them."

[[note]]
level = "intermediate"
topic = "C"
text = "Use `size_t` for sizes, lengths and array indexes in C, as the standard library does. An `int` can't hold every size on 64-bit systems, and mixing it with `size_t` produces signed and unsigned comparisons that fail for negative values."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "Review the `terraform plan` output in the pull request before anyone applies it. A one-line change can force replacement of a database, and the plan says so before it happens."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "After an incident, check the data written while it lasted, such as orders, payments and messages created by bad code or half-finished requests. Restoring service does not repair records that were already written wrong."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Move slow work such as sending email, resizing images and calling third-party APIs out of the web request and into a background job queue. Requests stay fast, and a slow provider no longer ties up your web workers."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Log in a structured format such as JSON with consistent field names. Free-form text is hard to search and aggregate, and queries break whenever someone rewords a message."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Generate a request ID at the edge, pass it to every downstream service and include it in every log line. Without it, tracing one failed request across services means guessing by timestamps."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Alert on symptoms users feel, such as error rate and latency, rather than on every internal metric. Alerts that fire without user impact teach people to ignore the pager."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Give every alert an owner and a linked runbook with the first steps to take. An alert that nobody knows how to act on gets muted, and then it misses the incident it was meant to catch."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Report latency as percentiles such as p95 and p99, not averages. An average hides the slow requests that a real share of your users hit every day."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Create test data through small factory functions with sensible defaults, such as `make_user(plan='pro')`, so each test states only the fields it cares about and a new required column means one fix, not fifty."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Write a blameless postmortem after each significant incident, with follow-up actions that have owners and due dates. Without that follow-through, the same failure comes back."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "During an incident, restore service first, by rolling back or failing over, and hunt for the root cause afterward. Debugging live while users are affected stretches the outage."

[[note]]
level = "intermediate"
topic = "Regex"
text = "Make validation patterns match the whole input: `re.fullmatch` in Python, or `^` and `$` without the multiline flag in JavaScript. An unanchored `\\d+` also accepts `42; DROP TABLE users`."

[[note]]
level = "intermediate"
topic = "Regex"
text = "Avoid nested quantifiers such as `(a+)+` in patterns that run on untrusted input. Backtracking engines, including those in Python, JavaScript and Java, can take exponential time on a crafted string and stall a server."

[[note]]
level = "intermediate"
topic = "Regex"
text = "Parse HTML, JSON and other nested formats with a real parser, not regular expressions. Patterns that handle today's samples break on the nesting, escaping and attribute order of tomorrow's input."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Pin the language runtime version in the repository with a file such as `.nvmrc` or `.python-version`. A lockfile does not help when CI and teammates run a different interpreter."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Record the inputs of every experiment or data run: code commit, data version, configuration and random seed. Without them, you cannot reproduce or explain a result later."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Pin the versions of formatters and linters in the project. An unpinned formatter release can reformat hundreds of files in an unrelated pull request, and a new lint rule can fail builds overnight."

[[note]]
level = "intermediate"
topic = "Time"
text = "Pick one precision for timestamps that cross systems and round to it on write. PostgreSQL keeps microseconds and JavaScript's `Date` keeps milliseconds, so a value that makes the round trip no longer equals the original."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Commit an `.editorconfig` file so editors that support it, natively or through a plugin, apply the same indentation, charset and final-newline rules. Without shared settings, diffs fill with whitespace noise."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Spread knowledge of each critical system across at least two people through pairing, rotation and reviews. When only one person understands a system, their vacation becomes an outage risk."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Write down team conventions for branches, commits and reviews in a `CONTRIBUTING.md`. Unwritten rules get enforced inconsistently and argued over again in every pull request."

[[note]]
level = "intermediate"
topic = "Time"
text = "Store and exchange timestamps in UTC, and convert to local time only for display. Local times are ambiguous around daylight saving changes, and mixed zones make event ordering unreliable."

[[note]]
level = "intermediate"
topic = "Time"
text = "Label every time you show people with its zone, as in `14:00 UTC` or `09:00 America/Chicago`, in dashboards, emails and incident notes. Readers spread across zones read an unlabeled time in their own, and act an hour or a day off."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "List known limitations and unsupported cases in the README. Users who hit them otherwise assume a bug, open duplicate issues, or build on behavior you never meant to support."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Use UTF-8 end to end: source files, database connections and HTTP `charset` declarations. A single mismatched layer corrupts text silently, and repairing mojibake afterward is slow and lossy."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Normalize Unicode text, usually to NFC, before comparing or storing identifiers such as usernames. The same visible text, like `é`, can be encoded as different code point sequences that compare unequal."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Profile before optimizing. Intuition about where time goes is often wrong, and optimizing the wrong code adds complexity without making anything faster."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Load test before launches and expected traffic spikes, in an environment shaped like production. Otherwise your users discover the capacity limits for you, during an outage."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Bound in-memory caches, queues and result lists. A structure that only grows eventually exhausts memory, usually at peak traffic, when a restart hurts most."

[[note]]
level = "intermediate"
topic = "C"
text = "Build with `gcc -MMD -MP` and `-include` the generated `.d` files in your Makefile. Without them, editing a header doesn't rebuild the `.c` files that include it, and you link objects compiled against a stale struct layout."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Limit concurrency when fanning out work, with a worker pool or a semaphore. One task per item works for ten items and exhausts connections or memory at ten thousand."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Make background jobs safe to run more than once. Queues typically deliver at least once, workers crash midway, and retries replay work that already partly happened."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Tag every release with an annotated tag (`git tag -a v2.1.0 -m \"Release 2.1.0\"`). A tag records exactly which commit shipped, so a bug report against a version can be reproduced and diffed."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Roll out risky changes gradually, to a canary or a small percentage of users, and watch the metrics before going further. A bad release then affects a few users instead of all of them."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Make rollback a rehearsed, one-step operation. If reverting a bad deploy takes an hour of manual work, every bad release becomes an hour-long outage."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Represent money in API payloads as an integer amount in minor units plus a currency code, as in `{\"amount\": 1999, \"currency\": \"USD\"}`; floats round, and a bare number never says which currency it is."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Debug with explicit hypotheses: before each experiment, write down what you think is wrong and what result would prove it. A prediction that fails rules a cause out, while poking around without one only adds noise."

[[note]]
level = "intermediate"
topic = "Data"
text = "Put units in field and column names, such as `timeout_ms` or `size_bytes`. Unlabeled numbers get misread by a factor of 1000, and nothing crashes to warn you."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Design every remote call for three outcomes: success, failure and unknown. A timeout does not tell you whether the other side processed the request, so recovery must handle both possibilities."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Start every workflow at `permissions: {}` and grant each job only what it needs. Depending on the repository's settings, the default token can write to your code."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Give each workload its own ServiceAccount instead of the namespace's `default` one. RBAC granted to a shared account applies to every pod that uses it, so permissions added for one app quietly extend to all the others."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "When a cloud role trusts GitHub's OIDC provider, restrict the token's `sub` claim to your repository and a branch or environment. A trust policy that checks only the audience lets workflows in any repository assume the role."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Keep deploy credentials in a GitHub environment with required reviewers, and reference that environment only from the deploy job. Its secrets reach a job only after approval, so a compromised build or test step cannot read them."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Restrict each deployment environment to protected branches or tags. Without that rule, a workflow pushed to any branch can reference the environment and receive its secrets, subject only to its other protection rules."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Set `timeout-minutes` on every job. The default is 360 minutes, so a hung test or a stalled network call can occupy a runner for six hours before GitHub cancels it."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Register self-hosted runners with `--ephemeral` so each one runs a single job and then unregisters, and build a fresh machine for the next. A persistent runner keeps whatever earlier jobs left behind: credentials, altered tools, background processes."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Send audit logs such as AWS CloudTrail from every account and region to a separate, locked-down logging account. After a breach they are the record of who did what, and an attacker with admin in one account must not be able to erase them."

[[note]]
level = "advanced"
topic = "CI"
text = "Keep the logs, test reports and artifacts of release builds for as long as the release is supported. Many CI systems expire them after weeks or months by default, and a later incident or audit then has no record of how that build was made."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Pass secrets to reusable workflows by name instead of `secrets: inherit`. Inheriting hands every secret the caller can see to the called workflow, which may live in another repository and change without your review."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Treat artifacts downloaded in a `workflow_run` workflow as untrusted input. The triggering run may have built a fork's pull request, while the `workflow_run` job holds your secrets and a more privileged token."

[[note]]
level = "advanced"
topic = "CI"
text = "Keep build and test logic in scripts or a `Makefile` in the repository and have CI call them. Logic that lives only in workflow YAML cannot be run locally, so every CI failure becomes a slow push-and-wait loop."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Avoid Terraform provisioners such as `local-exec` and `remote-exec` for configuring servers. They run only when a resource is created, Terraform cannot plan or track what they changed, and a failed one marks the resource as tainted."

[[note]]
level = "advanced"
topic = "CI"
text = "Test merges, not just branches: use a merge queue or require branches to be up to date before merging. Two pull requests that each pass on their own can still break `main` together."

[[note]]
level = "advanced"
topic = "CI"
text = "Regenerate generated code, lockfiles and docs in CI and fail on any difference with `git diff --exit-code`. Otherwise hand edits to generated files and forgotten regenerations let the source of truth drift silently."

[[note]]
level = "advanced"
topic = "CI"
text = "Run CI against the oldest and newest runtime and dependency versions you claim to support. A support range that is never tested is a guess, and users are the ones who find out it was wrong."

[[note]]
level = "advanced"
topic = "CI"
text = "Gate merges on one final job that runs with `if: always()`, `needs:` every other job and fails unless all of them succeeded. A job skipped by its `if:` condition reports success, so requiring individual jobs can let breakage through."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Keep a pepper, a secret mixed into every password hash, in a secrets manager or HSM rather than in the database. A stolen database dump then cannot be cracked offline without it."

[[note]]
level = "advanced"
topic = "Security"
text = "When your server fetches user-supplied URLs, resolve the host, reject private, loopback and link-local addresses, connect to the address you checked and recheck every redirect. Otherwise attackers reach internal services through you."

[[note]]
level = "advanced"
topic = "APIs"
text = "Check authorization on every object access, not just login: confirm the caller may read or change that specific record. An endpoint that trusts the ID in the URL lets any signed-in user page through everyone else's data."

[[note]]
level = "advanced"
topic = "APIs"
text = "Bind request bodies to an explicit allowlist of writable fields, never directly onto database models. Otherwise a client can set fields you never exposed, such as `is_admin` or `owner_id`, just by adding them to the JSON."

[[note]]
level = "advanced"
topic = "Security"
text = "Automate secret rotation and run it on a schedule. If rotating a key is a rare manual event, the day it leaks you will be learning the procedure during an incident while the old key still works."

[[note]]
level = "advanced"
topic = "Security"
text = "Give each service its own credentials, scoped to what it uses. With shared credentials you cannot tell which service leaked them, and revoking them breaks everything that depends on them at once."

[[note]]
level = "advanced"
topic = "Security"
text = "Resolve user-supplied file paths to a canonical absolute path (for example with `os.path.realpath`) and confirm the result is inside the allowed directory. Stripping `../` misses absolute paths, encodings and symlinks."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Respect backpressure when writing to Node streams: when `write()` returns `false`, wait for the `'drain'` event before writing more, or the data piles up in memory until the process runs out."

[[note]]
level = "advanced"
topic = "Security"
text = "Accept only relative paths or allowlisted hosts in redirect parameters like `?next=`. An open redirect on your domain makes phishing links look legitimate and can leak OAuth codes or tokens to an attacker's site."

[[note]]
level = "advanced"
topic = "Web"
text = "Store uploads outside the web root under generated names, and serve them with `Content-Disposition: attachment` and `X-Content-Type-Options: nosniff`. Otherwise an uploaded HTML or SVG file can run script on your origin."

[[note]]
level = "advanced"
topic = "Security"
text = "Keep an append-only audit log of security-relevant actions (logins, permission changes, new keys, data exports) where application admins cannot edit it. Without one, you cannot reconstruct what an intruder did."

[[note]]
level = "advanced"
topic = "APIs"
text = "Verify webhook signatures over the raw request body, and reject deliveries whose signed timestamp is more than a few minutes old. Re-serializing parsed JSON can change the signed bytes, and without the timestamp check a captured request can be replayed."

[[note]]
level = "advanced"
topic = "Security"
text = "Require the current password or a fresh login before changing email, password, MFA or payout details, and notify the old address. Otherwise a stolen session cookie becomes a permanent account takeover."

[[note]]
level = "advanced"
topic = "Security"
text = "Revoke all of a user's sessions and refresh tokens when their password changes or you suspect compromise. Sessions that survive a password reset leave an attacker signed in after the victim thinks they are safe."

[[note]]
level = "advanced"
topic = "Security"
text = "Rate-limit login, password reset and MFA endpoints both per account and per source address. Per-address limits alone miss guessing spread across many IPs; per-account limits alone miss one IP spraying many accounts."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Hash passwords with an algorithm built for it, such as Argon2id, scrypt or bcrypt, never plain or salted SHA-256. General-purpose hashes are fast by design, so a leaked table can be attacked at billions of guesses per second."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Store the algorithm and cost parameters with each password hash, as the PHC string format does, and rehash on successful login when they fall below current policy. Otherwise old hashes keep yesterday's strength forever."

[[note]]
level = "advanced"
topic = "Security"
text = "Follow NIST's guidance on passwords: drop forced periodic changes and composition rules, allow long passphrases, and reject new passwords found in lists of breached ones. Forced rotation mostly yields predictable variations."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Encrypt with an authenticated mode such as AES-GCM or ChaCha20-Poly1305, not bare CBC or CTR. Without authentication, ciphertext can be altered undetected, and differing error responses can become a padding oracle that decrypts data."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Split pipelines so the jobs that run tests, linters and third-party tools hold no publishing credentials, and only a final, minimal job gets the registry token. Any code a job runs can read the secrets that job holds."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Include a key identifier with every ciphertext and signed token, such as a `kid` header or a version prefix. Without one, rotating a key means guessing which key protects each record, so rotation keeps getting postponed."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Check every change to a shared Protobuf, Avro or JSON schema against the previous version in CI, in the compatibility mode your readers need. Otherwise a removed or retyped field surfaces as undecodable messages in production."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "When verifying a JWT, pass the exact algorithms you accept, for example `algorithms=[\"RS256\"]` in PyJWT, and never let the token's own `alg` header decide. Otherwise attackers can pick `none` or confuse key types."

[[note]]
level = "advanced"
topic = "Security"
text = "Keep JWT access tokens short-lived and pair them with refresh tokens you can revoke. A signed token stays valid until it expires, so without a server-side denylist a long-lived one cannot be withdrawn after a compromise."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Encrypt each customer's data under its own key when you may need to erase it everywhere. Destroying that key makes every copy unreadable, including copies in backups and replicas you cannot rewrite; this is known as crypto-shredding."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Choose RSA-OAEP for encryption and RSA-PSS or Ed25519 for signatures in new designs. PKCS#1 v1.5 encryption padding has a long history of padding-oracle attacks that keep resurfacing in new implementations."

[[note]]
level = "advanced"
topic = "Releases"
text = "Record every deploy, with version, time, author and target, in one place that incident responders check first. Many incidents start with a change, and without a deploy log the first hour goes to finding out what changed."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Pin the exact versions of code generators such as `protoc` or an OpenAPI generator, and run them through a script that uses those versions. Different generator versions emit different code from the same schema."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Align the versions of shared libraries across your services, for example with a Maven BOM or a shared pip constraints file. When a security fix lands, one version bump then covers every service instead of dozens of different upgrade paths."

[[note]]
level = "advanced"
topic = "Git"
text = "Run `git fsck --full` on your Git backups and mirrors on a schedule. Corruption in a rarely read pack goes unnoticed until the day you need to restore from it."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Generate an SBOM for every release artifact and keep it with the release. When the next widespread vulnerability lands, you can find affected builds by searching files instead of reconstructing old dependency trees."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Verify downloads against a checksum or signature obtained through a separate trusted channel. A checksum hosted beside the file only catches corruption, since an attacker who can replace the file can replace the checksum too."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Build and publish releases from CI on a protected branch or tag, never from a developer laptop. A laptop build cannot be audited or reproduced, and a compromised workstation can slip in changes that no commit contains."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Cap concurrency when you map a large list to async calls: `Promise.all(ids.map(fetchUser))` starts every request at once, which can exhaust sockets and memory or trip the other service's rate limits."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Install with `npm ci` in CI and deploy builds, not `npm install`. `npm ci` installs exactly what the lockfile records and fails if it disagrees with `package.json`, instead of quietly updating the lockfile."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Update dependencies continuously in small steps. A year of skipped updates turns a routine security patch into a multi-major-version migration done under pressure."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "In a library, declare the widest dependency ranges you actually test; in an application, pin exact versions with a lockfile. Narrow pins in a library push version conflicts onto every project that uses it."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Test your declared minimum versions, not just the newest: resolve with `uv pip compile --resolution lowest-direct` and run CI on the result. Otherwise code quietly starts needing newer releases than the ones you require."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Review a new dependency before adding it: who maintains it, how active it is, what it pulls in transitively and whether it runs install scripts. Each one is code you ship and trust, and removing it later costs more than not adding it."

[[note]]
level = "advanced"
topic = "Git"
text = "Keep every commit on your main branch buildable, and squash or fix up broken intermediate commits before merging. `git bisect` only stays fast and automatic when any commit it lands on can be built and tested."

[[note]]
level = "advanced"
topic = "Git"
text = "After a repository-wide reformat, list its commit in `.git-blame-ignore-revs` and set `blame.ignoreRevsFile` to that file. Otherwise `git blame` credits every line to the formatter and buries the history of why the code changed."

[[note]]
level = "advanced"
topic = "Git"
text = "Keep large binaries out of Git history from the start, using Git LFS or an artifact store. A full clone downloads every version ever committed, and removing them later means rewriting history for everyone."

[[note]]
level = "advanced"
topic = "Git"
text = "Commit a `.gitattributes` with `* text=auto` and explicit rules such as `*.sh text eol=lf`. Without it, each contributor's `core.autocrlf` decides line endings, and diffs fill with whole-file changes that hide the real edits."

[[note]]
level = "advanced"
topic = "Git"
text = "Sign release tags with `git tag -s` and check them with `git verify-tag` before building a release. An unsigned tag says nothing about who created it, since anyone with push access can make one."

[[note]]
level = "advanced"
topic = "Git"
text = "Set `transfer.fsckObjects` to `true` on servers and mirrors that receive pushes or fetch from sources you do not control. Git then rejects malformed objects and known-malicious trees, such as a hostile `.gitmodules`, instead of storing them."

[[note]]
level = "advanced"
topic = "Git"
text = "On self-hosted Git servers, set `receive.denyNonFastForwards` and `receive.denyDeletes` on shared repositories. Without a hosting platform's branch protection, any collaborator's force push or branch deletion is otherwise accepted."

[[note]]
level = "advanced"
topic = "GitHub"
text = "List `.github/workflows/` in `CODEOWNERS` and require code owner review for it. A workflow change can exfiltrate secrets or alter what gets released, so it deserves the scrutiny you give production code."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Give automation a GitHub App or a per-repository deploy key instead of a person's access token. A personal token acts as its owner, so its reach follows their role changes, and it breaks or lingers unnoticed when they leave."

[[note]]
level = "advanced"
topic = "GitHub"
text = "In your GitHub organization's member privileges, stop members from deleting, transferring or changing the visibility of repositories. Otherwise any repository admin can make private code public or remove a repository, with its issues, in a few clicks."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Send non-ASCII download names in `Content-Disposition` with the RFC 6266 form, `filename*=UTF-8''` followed by the percent-encoded name, plus a plain ASCII `filename=` fallback. Raw UTF-8 in headers is handled inconsistently, and users get garbled or rejected file names."

[[note]]
level = "advanced"
topic = "Shell"
text = "Put `--` before file arguments that come from variables or globs, as in `rm -- \"$f\"`. A name starting with a dash is otherwise parsed as an option, so a file called `-rf` can change what the command does."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Create PostgreSQL databases with `ENCODING 'UTF8'`, never `SQL_ASCII`, which stores whatever bytes arrive without checking them. A database's encoding cannot be changed in place later, so fixing a bad choice means a full dump and restore."

[[note]]
level = "advanced"
topic = "Shell"
text = "Pass file lists between commands with NUL separators, as in `find . -name '*.log' -print0 | xargs -0 gzip`. Lists split on spaces or newlines break on real filenames and can hand a command the wrong paths."

[[note]]
level = "advanced"
topic = "Shell"
text = "Call `curl` with `--fail` in scripts. Without it, an HTTP 404 or 500 still exits with status 0, and the error page gets saved or piped onward as though it were the real download."

[[note]]
level = "advanced"
topic = "Shell"
text = "Match the shebang to the syntax you use. `/bin/sh` is dash on Debian and Ubuntu, so a `#!/bin/sh` script that uses `[[ ]]`, arrays or `source` can work where sh is Bash and fail in a Debian-based container."

[[note]]
level = "advanced"
topic = "Time"
text = "Have scheduled jobs process the time window since their last successful run, recorded in durable storage, rather than a window computed from the current time. A run that is skipped, delayed or retried then catches up instead of silently leaving a gap in the data."

[[note]]
level = "advanced"
topic = "Linux"
text = "Raise the open-file limit for network services (`LimitNOFILE=` in the systemd unit) and monitor descriptor usage. The common default soft limit of 1024 turns a traffic spike into `EMFILE` errors on `accept()` and `open()`."

[[note]]
level = "advanced"
topic = "Linux"
text = "Cap log growth with rotation and size limits, such as `logrotate` or `SystemMaxUse=` in `journald.conf`. An unbounded log eventually fills the disk, and a full disk breaks databases, deploys and anything else that writes."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Make large renames with a syntax-aware tool, such as your IDE's rename refactoring or a codemod built on the language's parser, rather than a regex replace. Text replacement also rewrites strings, comments and unrelated identifiers that happen to share the name."

[[note]]
level = "advanced"
topic = "Regex"
text = "Cap the length of untrusted input before matching a regex against it. Simple patterns can still backtrack quadratically: a trailing-whitespace trim like `\\s+$` met a post with about 20,000 whitespace characters mid-line and took Stack Overflow down for 34 minutes in 2016."

[[note]]
level = "advanced"
topic = "Linux"
text = "Harden systemd services with directives such as `NoNewPrivileges=yes`, `ProtectSystem=strict`, `ProtectHome=yes` and `PrivateTmp=yes`, then review them with `systemd-analyze security`. A compromised service then reaches far less of the host."

[[note]]
level = "advanced"
topic = "Linux"
text = "Schedule service restarts and reboots as part of patching. A running process keeps the old, vulnerable library mapped until it restarts, and the old kernel runs until reboot, so an installed fix does nothing yet."

[[note]]
level = "advanced"
topic = "Linux"
text = "Grant a service the one capability it needs instead of running it as root: `AmbientCapabilities=CAP_NET_BIND_SERVICE` with a non-root `User=` lets a systemd service bind port 443 without any other privilege."

[[note]]
level = "advanced"
topic = "Linux"
text = "Give services memory limits, such as `MemoryMax=` in systemd or a container limit. Without one, a leak pushes the whole host into memory pressure, and the kernel OOM killer may kill a different, more important process."

[[note]]
level = "advanced"
topic = "Linux"
text = "Make the systemd journal persistent on servers (`Storage=persistent`, or create `/var/log/journal`). With volatile storage, logs live under `/run` and vanish at reboot, just when you need to know why the machine went down."

[[note]]
level = "advanced"
topic = "Python"
text = "Never call blocking code such as `time.sleep`, `requests.get` or long CPU work inside `async def` functions. One blocking call stalls every coroutine on the event loop; use async libraries or `await asyncio.to_thread(...)`."

[[note]]
level = "advanced"
topic = "Python"
text = "Keep a reference to every task you start with `asyncio.create_task`, for example in a set you remove it from when it finishes. The event loop holds only weak references, so an unreferenced task can be garbage-collected mid-run."

[[note]]
level = "advanced"
topic = "Python"
text = "Call `subprocess.run` with a list of arguments and without `shell=True`. Through a shell, any filename or value containing `;` or `$(...)` becomes part of a command, and quoting it correctly by hand is harder than it looks."

[[note]]
level = "advanced"
topic = "Python"
text = "If you catch `asyncio.CancelledError` to clean up, re-raise it. Swallowing it breaks timeouts, task groups and shutdown, which all rely on a cancelled task actually stopping."

[[note]]
level = "advanced"
topic = "Python"
text = "Never unpickle untrusted data: `pickle.loads` can run arbitrary code by design. For anything that crosses a trust boundary, use JSON, or `yaml.safe_load` for YAML."

[[note]]
level = "advanced"
topic = "Python"
text = "Handle `SIGTERM` in Python services, for example with a `signal.signal` handler that raises `SystemExit`. Python keeps the default action, which kills the process at once, so `finally` blocks and `atexit` handlers never run when an orchestrator stops it."

[[note]]
level = "advanced"
topic = "Python"
text = "Never store or share values from Python's built-in `hash()` on strings or bytes: they are salted per process, so they differ between runs. Use `hashlib` for anything persisted or sent elsewhere."

[[note]]
level = "advanced"
topic = "Python"
text = "Close files, sockets and connections with `with` blocks instead of relying on garbage collection. Reference cycles and other Python implementations delay finalization, leaking descriptors and connections under load."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Prefer immutable data and message passing to shared mutable state between threads. An immutable object can be read from any thread without locks, while every shared mutable one needs every access synchronized, forever."

[[note]]
level = "advanced"
topic = "Shell"
text = "Print data with `printf '%s\\n' \"$var\"` rather than `echo \"$var\"`. Bash's `echo` takes a value such as `-n` or `-e` as an option, and `sh` implementations such as dash expand backslash sequences, so the output silently differs from the input."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Put a timeout on every lock wait in production code, such as `tryLock` with a timeout in Java or `lock_timeout` in PostgreSQL, and log when it expires. An unbounded wait turns a deadlock or a stuck holder into a silent hang."

[[note]]
level = "advanced"
topic = "Java"
text = "When you catch `InterruptedException` and can't rethrow it, call `Thread.currentThread().interrupt()`. Throwing it cleared the thread's interrupt flag, so without that call, code further up never learns it was asked to stop, and shutdowns hang."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Enable typescript-eslint's type-aware rules such as `no-floating-promises` and `no-misused-promises`; they catch promises that are never awaited or are passed where nothing waits for them, which the compiler allows."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Move CPU-heavy work in Node, like parsing huge JSON, image processing or synchronous crypto, to `worker_threads` or a separate service. While it runs, the event loop cannot serve any other request."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Keep `@types/node` on the same major version as the Node runtime you deploy to; newer type definitions let code call APIs that production doesn't have, and the compiler can't warn you."

[[note]]
level = "advanced"
topic = "Web"
text = "Load third-party tags such as chat widgets and analytics with `async` or `defer`, or after the page becomes interactive; a synchronous third-party script that stalls blocks your whole page from rendering."

[[note]]
level = "advanced"
topic = "Web"
text = "Split a large single-page app by route with dynamic `import()`, so the first visit downloads only the code for the page it opens instead of the whole application."

[[note]]
level = "advanced"
topic = "APIs"
text = "Send 64-bit integer IDs as strings in JSON. JavaScript numbers are doubles, so `JSON.parse` silently rounds integers above `Number.MAX_SAFE_INTEGER`, and distinct IDs can collapse into the same value."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Turn on `\"strict\": true` in `tsconfig.json` when a project starts. Every month without it adds code that relies on implicit `any` and unchecked `null`, and enabling it later means fixing all of that at once."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Build custom widgets to the keyboard patterns in the ARIA Authoring Practices Guide: tabs move with arrow keys and menus close on Escape; screen reader users expect those conventions, and widgets that ignore them feel broken."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Never make a visual puzzle the only way through sign-up or checkout; offer a non-visual alternative, or use checks that need no user action, or blind and low-vision users are locked out."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Turn on request collapsing in your CDN or cache, so when a popular object expires, one request goes to the origin and the rest wait for its answer; otherwise thousands of simultaneous misses hit the origin at once."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "End a `switch` over a union with a `default` branch that assigns the value to a variable of type `never`. When someone adds a member to the union, the compiler flags every switch that does not handle it."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Set timeouts for reading request headers and bodies on every server and proxy you run; without them, clients that trickle bytes slowly (slowloris) hold connections open until the server runs out of them."

[[note]]
level = "advanced"
topic = "Go"
text = "Bound concurrency in Go with a worker pool, a buffered-channel semaphore or `errgroup`'s `SetLimit`. One goroutine per item is cheap for Go, but a million concurrent requests can knock over the database or API they call."

[[note]]
level = "advanced"
topic = "Go"
text = "Close every `resp.Body` from Go's HTTP client, and read it to the end if you want the connection reused. Unclosed bodies leak connections and goroutines until the process runs out of file descriptors."

[[note]]
level = "advanced"
topic = "Go"
text = "Wrap request bodies in `http.MaxBytesReader` before a Go handler reads or decodes them. `json.NewDecoder(r.Body)` otherwise reads whatever the client sends, and a few huge requests can exhaust the server's memory."

[[note]]
level = "advanced"
topic = "Go"
text = "Wrap errors with `%w` in `fmt.Errorf` and check them with `errors.Is` and `errors.As`, never by comparing message strings. Messages change between versions, while wrapped error chains keep the identity callers rely on."

[[note]]
level = "advanced"
topic = "Rust"
text = "Use bounded channels, such as `tokio::sync::mpsc::channel(1024)`, between async Rust stages. An unbounded channel accepts messages faster than the consumer handles them, and its queue grows until the process runs out of memory."

[[note]]
level = "advanced"
topic = "Go"
text = "Give every goroutine you start a way to finish, such as a canceled context or a closed channel. A goroutine blocked forever on a send or receive is never reclaimed, and leaks like that grow until memory runs out."

[[note]]
level = "advanced"
topic = "Go"
text = "In a memory-limited container, set `GOMEMLIMIT` somewhat below the limit. Without it, the Go garbage collector paces itself by heap growth alone, so the heap can overshoot the container limit and the process gets OOM-killed."

[[note]]
level = "advanced"
topic = "Go"
text = "Set `SetMaxOpenConns` and `SetConnMaxLifetime` on Go's `sql.DB`. The pool allows unlimited open connections by default, so a traffic spike keeps opening connections until the database refuses new ones."

[[note]]
level = "advanced"
topic = "Go"
text = "Run `govulncheck` in CI. It uses call analysis to report the known vulnerabilities your code can actually reach, so its findings are worth acting on rather than muting."

[[note]]
level = "advanced"
topic = "Go"
text = "Set `GOPRIVATE` to your organization's module path pattern. Without it, the `go` command asks the public proxy and checksum database about your private modules, leaking their paths and failing checksum verification."

[[note]]
level = "advanced"
topic = "Go"
text = "Handle `SIGTERM` by calling `http.Server.Shutdown` with a deadline. It stops accepting connections and waits for active requests to finish, whereas exiting at once drops every in-flight request on each deploy."

[[note]]
level = "advanced"
topic = "Rust"
text = "Integer overflow panics in Rust debug builds but wraps silently in release builds by default. Use `checked_*` or `saturating_*` arithmetic where overflow is possible, or set `overflow-checks = true` in the release profile."

[[note]]
level = "advanced"
topic = "Rust"
text = "Put a `// SAFETY:` comment on every `unsafe` block stating the invariant it relies on, and enforce it with Clippy's `undocumented_unsafe_blocks` lint. Unstated invariants get broken by the next person who edits nearby code."

[[note]]
level = "advanced"
topic = "Rust"
text = "Enforce Rust warnings in CI with `RUSTFLAGS=\"-D warnings\"` rather than `#![deny(warnings)]` in the source. The attribute breaks your own build, and every contributor's, whenever a new compiler release adds or tightens a lint."

[[note]]
level = "advanced"
topic = "Rust"
text = "Declare `rust-version` in `Cargo.toml` and build with exactly that toolchain in CI. Without that check, a new dependency or language feature silently raises your minimum supported Rust version."

[[note]]
level = "advanced"
topic = "Rust"
text = "Return `Result` and propagate errors with `?` in library and server code instead of calling `unwrap()` on fallible operations. A panic in a request handler kills that task or thread, and with `panic = \"abort\"` the whole process."

[[note]]
level = "advanced"
topic = "Rust"
text = "Emit `cargo:rerun-if-changed=` lines from every `build.rs`. Without any, Cargo reruns the script whenever any file in the package changes, slowing every build, and an incomplete list silently leaves generated code stale."

[[note]]
level = "advanced"
topic = "Java"
text = "Build thread pools with `ThreadPoolExecutor` and a bounded queue. `Executors.newFixedThreadPool` queues without limit and `newCachedThreadPool` creates threads without limit, so overload ends in an out-of-memory crash instead of rejections."

[[note]]
level = "advanced"
topic = "Java"
text = "Call `remove()` on `ThreadLocal` values in a `finally` block when threads are pooled. Pool threads live as long as the server, so leftover values leak memory and can hand one request's user or transaction to the next."

[[note]]
level = "advanced"
topic = "Java"
text = "Start production JVMs with `-XX:+HeapDumpOnOutOfMemoryError` and a `-XX:HeapDumpPath` on a disk with room. An out-of-memory crash without a heap dump leaves you guessing and waiting for it to happen again."

[[note]]
level = "advanced"
topic = "C"
text = "Ignore `SIGPIPE` in C servers with `signal(SIGPIPE, SIG_IGN)`, or pass `MSG_NOSIGNAL` to `send` on Linux. By default, writing to a socket the peer has closed kills the whole process instead of returning `EPIPE`."

[[note]]
level = "advanced"
topic = "Java"
text = "Never deserialize untrusted bytes with `ObjectInputStream`. If you must, install an `ObjectInputFilter` that allowlists the expected classes, because gadget chains in common libraries turn deserialization into remote code execution."

[[note]]
level = "advanced"
topic = "Java"
text = "Call `get()` on every `Future` returned by `ExecutorService.submit`, or catch and log inside the task. An exception thrown by a submitted task is stored in its `Future` and otherwise never reported."

[[note]]
level = "advanced"
topic = "Java"
text = "Run production JVMs with a continuous Flight Recorder recording (`-XX:StartFlightRecording`). When latency spikes, the recent GC, lock and allocation data is already there to dump instead of waiting for a repeat."

[[note]]
level = "advanced"
topic = "Data"
text = "Make pipeline transformations deterministic: pass the run date in as a parameter instead of calling `now()`, and avoid unseeded sampling and unordered iteration. A rerun then reproduces the original output, which backfills and debugging depend on."

[[note]]
level = "advanced"
topic = "C"
text = "Run C and C++ tests under AddressSanitizer and UndefinedBehaviorSanitizer (`-fsanitize=address,undefined`) in CI. Memory bugs often corrupt data silently in normal builds; sanitizers report the first bad access with a stack trace."

[[note]]
level = "advanced"
topic = "C"
text = "Build release binaries with hardening flags: `-D_FORTIFY_SOURCE=2` (with optimization on), `-fstack-protector-strong`, `-fPIE -pie` and `-Wl,-z,relro,-z,now`. They turn many memory-safety bugs into crashes instead of exploits."

[[note]]
level = "advanced"
topic = "C"
text = "Use `snprintf`, never `sprintf`, and compare its return value with the buffer size. A result at or above the size means the output was truncated, and ignoring that passes incomplete paths or commands along."

[[note]]
level = "advanced"
topic = "C"
text = "Before `malloc(n * size)`, check `n > SIZE_MAX / size` or use `calloc`, which checks the multiplication itself. An overflowed size allocates a tiny buffer that the following loop then writes far past."

[[note]]
level = "advanced"
topic = "C"
text = "Loop on `write()` and `send()` until every byte is written or a real error occurs. They can return a short count on sockets and pipes, and treating that as success silently truncates data."

[[note]]
level = "advanced"
topic = "C"
text = "Never pass untrusted data as a format string: write `printf(\"%s\", s)`, not `printf(s)`, and compile with `-Wformat -Wformat-security`. Conversions like `%x` and `%n` in the data can leak stack contents or write memory."

[[note]]
level = "advanced"
topic = "C"
text = "Retry blocking system calls that fail with `EINTR`. Any signal your process handles, such as `SIGCHLD` or a profiling timer, can interrupt `read`, `write` or `accept`, and code that treats that as a real error fails at random."

[[note]]
level = "advanced"
topic = "Testing"
text = "Fuzz every parser that reads untrusted input, with sanitizers enabled (for example `clang -fsanitize=fuzzer,address`). Fuzzers find the malformed inputs that hand-written tests never think to try."

[[note]]
level = "advanced"
topic = "Data"
text = "When facts join to attributes that change, such as a customer's region or plan, keep the attribute's history with `valid_from` and `valid_to` columns. Joining old orders to today's values silently rewrites past reports."

[[note]]
level = "advanced"
topic = "Data"
text = "Canonicalize data before hashing, signing or comparing it: the same JSON with reordered keys, different whitespace or another Unicode normalization form produces a different hash, so equal content looks changed."

[[note]]
level = "advanced"
topic = "SQL"
text = "Paginate large tables by key (`WHERE id > $1 ORDER BY id LIMIT 50`), not with `OFFSET`. The database still reads and discards every skipped row, so deep pages keep getting slower, and results shift under concurrent writes."

[[note]]
level = "advanced"
topic = "SQL"
text = "Build indexes on live PostgreSQL tables with `CREATE INDEX CONCURRENTLY`. A plain `CREATE INDEX` locks out inserts, updates and deletes until it finishes, which on a large table can amount to an outage for writers."

[[note]]
level = "advanced"
topic = "SQL"
text = "In PostgreSQL, run `ANALYZE` after bulk loads, large deletes and restores. Until autovacuum catches up, the planner works from stale row counts and value distributions, and a query that was fast yesterday can suddenly pick a disastrous plan."

[[note]]
level = "advanced"
topic = "Performance"
text = "Track allocation rate, not just heap size, in garbage-collected services. Code that allocates heavily keeps the collector busy and causes pause spikes even with plenty of free memory, and cutting allocations often beats tuning the GC."

[[note]]
level = "advanced"
topic = "Performance"
text = "Precompute expensive aggregates, such as dashboard totals, into summary tables refreshed on a schedule instead of computing them on every page view. Reads then cost a lookup, and freshness becomes an explicit, documented choice."

[[note]]
level = "advanced"
topic = "SQL"
text = "Replace check-then-insert with one atomic statement backed by a unique constraint, such as PostgreSQL's `INSERT ... ON CONFLICT`. Two concurrent requests can both pass the check before either one inserts."

[[note]]
level = "advanced"
topic = "SQL"
text = "Prevent lost updates in read-modify-write code: use an atomic `UPDATE ... SET n = n + 1`, lock rows with `SELECT ... FOR UPDATE`, or check a version column. At PostgreSQL's default `READ COMMITTED` level, two transactions can read the same value and both write."

[[note]]
level = "advanced"
topic = "SQL"
text = "Enforce uniqueness on normalized values, such as a unique index on `lower(email)` in PostgreSQL. A plain unique constraint lets `Ana@example.com` and `ana@example.com` register as two accounts."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Limit nesting depth when parsing untrusted JSON, XML or other nested input. Recursive parsers use stack space for every level, so a payload nested hundreds of thousands of levels deep can crash the parser or the whole process."

[[note]]
level = "advanced"
topic = "Databases"
text = "Keep at least one backup copy in a separate account or location that production credentials cannot delete or overwrite. Ransomware and attackers holding stolen admin keys go after backups first."

[[note]]
level = "advanced"
topic = "Databases"
text = "Treat replicas as availability, not backup: a bad `DELETE` or migration replicates within seconds. Keep point-in-time recovery (base backups plus archived WAL or binlogs) so you can restore to just before the mistake."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Watch your GitHub organization's audit log for changes to branch protection, rulesets and repository visibility. A protection switched off and back on looks untouched in the settings; only the log shows the gap."

[[note]]
level = "advanced"
topic = "Code review"
text = "Ask for benchmark numbers in any pull request that claims a speedup or touches a hot path. Reviewers can't see performance in a diff, and a change that should be faster often isn't."

[[note]]
level = "advanced"
topic = "Databases"
text = "Apply every schema change through versioned migrations committed to the repository. A hand-run `ALTER` in production leaves environments with slightly different schemas, and the differences surface as failures that only happen in one place."

[[note]]
level = "advanced"
topic = "Databases"
text = "Enforce invariants with database constraints such as `NOT NULL`, `UNIQUE`, `CHECK` and foreign keys, not only in application code. Every code path, script and future service that writes to the table then obeys them too."

[[note]]
level = "advanced"
topic = "Databases"
text = "Review index usage periodically (`pg_stat_user_indexes` in PostgreSQL) and drop indexes that no query or constraint needs. Every index is updated on each write and takes memory and disk, so unused ones cost throughput for nothing."

[[note]]
level = "advanced"
topic = "Databases"
text = "If you run PostgreSQL transactions at `SERIALIZABLE`, retry them on SQLSTATE `40001`. Serialization failures are how the isolation level works, and code that treats them as fatal turns correctness into random errors."

[[note]]
level = "advanced"
topic = "Databases"
text = "Run the application with a database role that can read and write rows but does not own the tables, and give migrations a separate role. An injection bug or a buggy script then cannot drop or alter the schema."

[[note]]
level = "advanced"
topic = "Databases"
text = "Partition large time-based tables so retention means dropping or detaching an old partition, not running a massive `DELETE`. Mass deletes bloat tables, churn indexes and generate huge amounts of WAL."

[[note]]
level = "advanced"
topic = "Databases"
text = "Prefer time-ordered keys, such as sequences or UUIDv7, over random UUIDv4 for primary keys on large, write-heavy B-tree indexes. Random keys scatter inserts across the whole index, causing page splits and poor cache locality."

[[note]]
level = "advanced"
topic = "Linux"
text = "Run `smartd` from smartmontools on hosts with local disks and route its warnings into your alerting. Many failing drives report growing reallocated or pending sector counts first, which leaves time to replace them while the array or replica can still rebuild."

[[note]]
level = "advanced"
topic = "Observability"
text = "Enable `pg_stat_statements` in PostgreSQL and review the top queries by total time regularly. Much of the load often comes from a few frequent queries that are each fast enough never to appear in a slow-query log."

[[note]]
level = "advanced"
topic = "Containers"
text = "Never `COPY` a secret into an image or pass it as a build argument. Deleted files survive in earlier layers and build arguments are recorded in the image history; use BuildKit secret mounts (`RUN --mount=type=secret`) instead."

[[note]]
level = "advanced"
topic = "Containers"
text = "Set a non-root `USER` in your Dockerfile. A process running as root in a container is one kernel or runtime bug, or one writable host mount, away from being root on the host."

[[note]]
level = "advanced"
topic = "Containers"
text = "Set `--pids-limit` on containers, or `pids_limit` in Compose, especially ones that run untrusted or buggy code. Without it, a fork bomb in one container can exhaust the host's process IDs and stop other services from starting processes."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Wrap user-supplied names and titles in `<bdi>` or give them `dir=\"auto\"` when you display them. Without bidirectional isolation, a right-to-left name or an embedded override character can reorder the text around it and disguise what it says."

[[note]]
level = "advanced"
topic = "Containers"
text = "Rebuild images on a schedule, not only when your code changes. An image keeps the OS packages it was built with, so one nobody touched for a year still carries every vulnerability fixed since."

[[note]]
level = "advanced"
topic = "Containers"
text = "Have containerized apps log to stdout and stderr and let the platform collect the streams. Log files written inside a container fill its writable layer, vanish with it and are invisible to the standard tooling."

[[note]]
level = "advanced"
topic = "Containers"
text = "Run containers with a read-only root filesystem (`--read-only`, or `readOnlyRootFilesystem: true` in Kubernetes) and mount writable volumes only where needed. Code an attacker gets running then cannot alter the image's binaries."

[[note]]
level = "advanced"
topic = "Code review"
text = "Check new log statements in review for secrets and personal data. A token or email address written to logs spreads to every system that stores them, and cleaning it up is far harder than removing one line."

[[note]]
level = "advanced"
topic = "Teams"
text = "Write a short team charter: what the team owns, what it does not, and how others should ask for work. Without one, requests arrive through every channel and priorities are set by whoever asks loudest."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Keep liveness probes shallow: check that the process can respond, not that its dependencies are up. A liveness probe that checks the database restarts every replica during a database outage, turning one failure into two."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Give pods a short `preStop` delay before shutdown begins. Endpoint removal and `SIGTERM` happen in parallel, so without it load balancers can keep sending new requests to a pod that is already exiting."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Define a `PodDisruptionBudget` for every replicated service. Without one, node drains during upgrades or scale-downs may evict all of its replicas at the same time."

[[note]]
level = "advanced"
topic = "Teams"
text = "Give every retrospective action item an owner and a due date, and check them at the next retrospective. Actions that nobody owns never happen, and the same complaints come back every sprint."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Kubernetes Secrets are only base64-encoded in the API. Enable encryption at rest for etcd and restrict who can `get`, `list` or `watch` Secrets, since listing a namespace's Secrets returns every value in it."

[[note]]
level = "advanced"
topic = "C"
text = "Build C shared libraries with `-fvisibility=hidden` and mark only the public API with `__attribute__((visibility(\"default\")))`. Otherwise every internal function is exported, becomes part of your ABI and can clash with symbols in the host program."

[[note]]
level = "advanced"
topic = "APIs"
text = "Offer an `expand` parameter or a batch endpoint for data clients always fetch together; otherwise a list screen that needs each item's owner makes one extra request per row, multiplying load on your API."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Set budget alerts on every cloud account, including sandboxes. A forgotten GPU instance, a runaway log sink or a leaked key mining cryptocurrency shows up on the bill long before anyone looks at a dashboard."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Put production in its own cloud account or project, separate from development and CI. An account boundary is much harder to misconfigure than per-resource policies, so a mistake or leaked key in dev stays in dev."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Block public access to object storage at the account level and grant exceptions per bucket, deliberately. Otherwise a single policy or ACL typo can publish private data to the whole internet."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Keep Terraform state in a remote backend with locking and versioning. Local state gets lost or diverges between machines, and two applies running without a lock can corrupt it."

[[note]]
level = "advanced"
topic = "Networking"
text = "Keep chatty service-to-service calls within one region or zone. A request that makes 20 sequential calls over a link with a 70 ms round trip spends well over a second on the network alone, however fast each service is."

[[note]]
level = "advanced"
topic = "Documentation"
text = "Publish documentation for every supported release, not only for `main`. Users on an older version otherwise follow instructions for features and flags their version does not have."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Run `terraform plan -detailed-exitcode` on a schedule for every environment and alert when it exits with 2, meaning changes. Manual console edits otherwise pile up as drift until an unrelated apply quietly reverts them."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Add `lifecycle { prevent_destroy = true }` to Terraform resources that hold data, and use `moved` blocks when you rename them. A renamed resource otherwise plans a destroy and recreate, and one hurried approval deletes the data."

[[note]]
level = "advanced"
topic = "DNS"
text = "Measure DNS lookup time and failure rate from your application hosts. Slow or failing resolution shows up as generic connection timeouts, so without a DNS metric you end up debugging the network or the remote service instead."

[[note]]
level = "advanced"
topic = "Observability"
text = "Have every scheduled job report success to a heartbeat check that alerts when a check-in is missed. A job that stops running logs no errors at all, so error-based alerting never notices it is gone."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Publish postmortems where the whole engineering organization can read them, not only the team involved. Other teams run the same tools and patterns, and a lesson kept in one folder gets relearned through their own outages."

[[note]]
level = "advanced"
topic = "Networking"
text = "Encrypt traffic between internal services too, ideally with mutual TLS. On a flat internal network, anyone who gains a foothold can read credentials in transit and impersonate services to each other."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Choose consistency per operation, not per system: a balance check before a withdrawal needs a strongly consistent read, while a profile page can tolerate stale data. One level everywhere either slows everything or breaks the operations that needed more."

[[note]]
level = "advanced"
topic = "DNS"
text = "Turn on auto-renewal and registrar lock for every domain you depend on, and alert on expiry dates. A lapsed domain takes down email, sites and APIs at once, and someone else may register it."

[[note]]
level = "advanced"
topic = "Testing"
text = "Test idempotency directly: deliver each message or request twice in your tests and assert that the second has no further effect. At-least-once delivery will do exactly this in production, whether or not you tested it."

[[note]]
level = "advanced"
topic = "DNS"
text = "Publish CAA records naming the certificate authorities you use. Publicly trusted CAs must check them and refuse to issue for your domain unless listed, which narrows who can mint a valid certificate for it."

[[note]]
level = "advanced"
topic = "DNS"
text = "Publish SPF, DKIM and DMARC for domains that send mail, and `v=spf1 -all` with a reject DMARC policy for domains that never do. Otherwise anyone can send convincing mail from your domain name."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Mark per-user responses `Cache-Control: private`, or `no-store` for sensitive data. Without it, a CDN or shared proxy may cache one user's page and serve it to the next."

[[note]]
level = "advanced"
topic = "APIs"
text = "Let customers create API keys limited to specific scopes, such as read-only reporting; when every key has full access to an account, each leaked key exposes all of it."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Send `Strict-Transport-Security` once the whole site works over HTTPS. Without it, any plain-HTTP request, from a typed address or an old link, can be intercepted and downgraded before your redirect arrives."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Cap request body and header sizes at the edge and in the application, and stream large uploads instead of buffering them. An endpoint that reads whole bodies into memory can be exhausted by a handful of large requests."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Make each service's timeout for a downstream call shorter than its own caller's timeout. If the inner timeout is longer, callers give up and retry while the original work is still running, multiplying the load."

[[note]]
level = "advanced"
topic = "Performance"
text = "Profile before optimizing, with production-like data and load. Guessing at bottlenecks produces complex code that speeds up the wrong thing, while the real hot spot stays untouched."

[[note]]
level = "advanced"
topic = "Performance"
text = "Watch query counts per request, not just latency, and fix N+1 patterns with batching or eager loading. A page that issues one query per row is fast with ten rows and collapses at ten thousand."

[[note]]
level = "advanced"
topic = "Performance"
text = "Give every in-process cache a size bound and an expiry. An unbounded cache is a memory leak with a hit rate, and one without expiry keeps serving stale data indefinitely."

[[note]]
level = "advanced"
topic = "Performance"
text = "Protect hot cache keys from stampedes: let one caller recompute an expired value while others wait or get the stale copy, and add jitter to expiry times. Otherwise every miss hits the database at the same moment."

[[note]]
level = "advanced"
topic = "APIs"
text = "Rate-limit by cost, not just request count: a search or export can cost a thousand times more than a simple read, so weight expensive endpoints or give them their own limits."

[[note]]
level = "advanced"
topic = "Performance"
text = "Reuse one HTTP client and its connection pool per process instead of creating one per request. A fresh client repeats DNS, TCP and TLS setup every time and can exhaust ephemeral ports under load."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Check the worst case, not the average, of any algorithm that processes input you do not control. Quicksort with a naive pivot, unbalanced search trees and naive substring search all have inputs that make them quadratic, and attackers can supply them."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Use a Bloom filter only where its errors are harmless: it can claim an item is present when it is not, but never the reverse. It can safely skip lookups for absent items; a positive answer still needs a real lookup behind it."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Compile production builds with frame pointers (`-fno-omit-frame-pointer`) or ship unwind information your profiler can use. Without either, sampling profilers and crash reporters show truncated or misattributed stacks on exactly the builds you need to understand."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Embed the commit hash and build ID in every binary and image, and report them in logs, crash reports and a version endpoint. Before you can debug a report, you need to know exactly which code produced it."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Capture thread or goroutine dumps before restarting a hung process: `jstack` or `kill -3` for a JVM, `kill -QUIT` for a Go program. Restarting clears the deadlock along with the only evidence of which locks and calls were involved."

[[note]]
level = "advanced"
topic = "Releases"
text = "Exercise your release process on every merge, for example by building and verifying a release candidate, and keep it runnable with one command. A process used every few months breaks silently and fails on the day you need an urgent security fix."

[[note]]
level = "advanced"
topic = "Releases"
text = "Derive version numbers from tags or the CI pipeline, never from files bumped by hand. Hand-edited versions collide across parallel branches, get forgotten, and let two different builds ship under one version."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Treat data your service writes to caches and queues as an interface between versions: during a rolling deploy or rollback, old and new code must each read what the other wrote. Otherwise every deploy fills the cache with entries the other version cannot parse."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Keep machine details out of build outputs: absolute paths, host names, locale and the order files are listed in. Such differences leak into archives and binaries, so two builds of one commit differ and cannot be verified against each other."

[[note]]
level = "advanced"
topic = "Observability"
text = "Attach exemplars or trace IDs to latency histograms and error logs, so a spike on a dashboard links straight to example requests. Aggregates show that something is slow; only a concrete trace shows why."

[[note]]
level = "advanced"
topic = "Observability"
text = "Instrument every pool and queue with its saturation: in-use count, wait time and rejections, not just throughput. An exhausted connection pool looks like a slow database in latency graphs, and you end up tuning the wrong thing."

[[note]]
level = "advanced"
topic = "Observability"
text = "Rate-limit or sample repeated log lines on hot paths. When a dependency fails, every request can log the same error, and the logging volume alone can saturate disks, pipelines and budgets in the middle of the incident."

[[note]]
level = "advanced"
topic = "Time"
text = "Allow a small leeway, such as a minute, when checking `exp` and `nbf` on tokens issued by another machine. Clocks drift between servers, and exact comparisons produce intermittent authentication failures that are hard to trace."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Never hold a lock while doing I/O, invoking callbacks or making network calls. The lock's hold time then depends on something outside your control, and one slow call stalls every thread waiting behind it."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Claim work items with an expiring lease, so another worker can pick them up if the lease runs out. With a permanent claim, a worker that crashes mid-task leaves its items claimed forever, and they silently never finish."

[[note]]
level = "advanced"
topic = "Testing"
text = "Test lock-free and concurrent code with tools that explore or stress thread interleavings, such as jcstress for Java or loom for Rust. Ordinary unit tests exercise a few schedules and rarely hit the one that breaks."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Choose shard and partition keys with high cardinality and evenly spread load. A key like the current date, or a tenant ID when one tenant dominates, concentrates traffic on one hot partition that adding nodes does not relieve."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Design each multi-step write for a crash between any two steps: make steps idempotent and record progress so a retry can resume. Code that assumes it runs to completion leaves half-written state after every crash, deploy or timeout."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Move data between stores in phases: write to both, backfill, compare reads from both, then switch reads and retire the old store. Switching in one step finds the mismatches in production, one customer complaint at a time."

[[note]]
level = "advanced"
topic = "Data"
text = "Write batch job output to a new location and switch consumers to it atomically, instead of overwriting in place. A job that fails halfway through an overwrite leaves readers with a mix of old and new data."

[[note]]
level = "advanced"
topic = "Data"
text = "Keep the raw input of important pipelines, such as original events or uploaded files, before transforming it. When a transformation bug surfaces, you can reprocess from the source instead of losing everything it touched."

[[note]]
level = "advanced"
topic = "Code review"
text = "Review retry, caching and locking changes against concrete scenarios: two concurrent requests, a timeout mid-operation, a retry after partial success. Such bugs pass every single-machine test and surface only under production load."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Manage focus when a single-page app changes views or opens a dialog: move focus to the new content and restore it on close. Otherwise keyboard and screen reader users stay on a stale element with no sign that anything changed."

[[note]]
level = "advanced"
topic = "Documentation"
text = "Document each service's limits and failure behavior: maximum payload, rate limits, timeouts and what it returns when a dependency is down. Callers otherwise discover them in production and build workarounds that break when the limits change."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Once a codebase builds cleanly, treat compiler and linter warnings as errors in CI, for example with `-Werror`. A tolerated warning list only grows, and the warning that signals a real bug gets lost among hundreds."

[[note]]
level = "advanced"
topic = "Performance"
text = "Compare benchmark results over repeated runs with a statistical test, on a quiet machine with CPU frequency scaling under control. Single runs can vary by several percent from noise alone, so small wins and regressions are guesses."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Put rate limits and safety checks on your own automation, such as auto-remediation, failover and scaling scripts. Automation acting on a bad signal amplifies an incident faster than any human could, for example by restarting every node at once."

[[note]]
level = "advanced"
topic = "Security"
text = "Check the `aud` and `iss` claims of every token you accept, not only its signature. A token your identity provider issued to another application is validly signed, and without an audience check it works on your API too."

[[note]]
level = "advanced"
topic = "Regex"
text = "Escape user text with `re.escape`, or your language's equivalent, before embedding it in a regular expression. Unescaped metacharacters change what the pattern matches and can turn a simple search box into a denial-of-service vector."

[[note]]
level = "advanced"
topic = "C"
text = "In C programs that spawn children, open files and sockets with close-on-exec (`O_CLOEXEC`, `SOCK_CLOEXEC`). Otherwise every child inherits them, keeping ports bound, locks held and deleted files' space in use after the parent closes its copies."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Run the previous release's client tests against every new server build. Backward-compatibility promises that are reviewed but never executed break in details like default values, field order and error codes."

[[note]]
level = "advanced"
topic = "Git"
text = "On self-hosted Git servers, turn on `core.logAllRefUpdates` so every ref change is logged. Bare repositories keep no reflog by default, so after a mistaken force push the overwritten commits are hard to find and recover."

[[note]]
level = "advanced"
topic = "Python"
text = "Do not fork a Python process that already runs threads, including through `multiprocessing` with the `fork` start method. The child inherits locks that other threads held at that moment, and it can deadlock at random; use `spawn` or `forkserver`."

[[note]]
level = "advanced"
topic = "Java"
text = "Start JVM services with `-XX:+ExitOnOutOfMemoryError` so the orchestrator restarts them. After an `OutOfMemoryError`, threads may have died mid-task and caches may be half-updated, and a JVM that limps on serves errors or corrupt results."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Attach breadcrumbs, a short trail of recent events such as requests, clicks and state changes, to every crash report. The stack trace shows where the program died; the breadcrumbs show how it got there."

[[note]]
level = "advanced"
topic = "APIs"
text = "Make pagination cursors opaque, and sign or encrypt them when they encode filters or positions. Clients that parse cursors lock you into their format, and tampered cursors can page into data the caller's filters should exclude."

[[note]]
level = "advanced"
topic = "Observability"
text = "Count retries, fallbacks and circuit-breaker trips as metrics of their own. They hide failures from users, which is their job, but without metrics they also hide a dependency's slow collapse from you."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Bind each ciphertext to its context by passing identifiers, such as the record ID and field name, as associated data to AES-GCM or ChaCha20-Poly1305. Otherwise someone with database access can swap valid ciphertexts between rows or fields, and they still decrypt."

[[note]]
level = "advanced"
topic = "Data"
text = "Load pipeline outputs with idempotent upserts keyed on natural or event IDs, so a rerun after a partial failure produces the same result. Append-only loads double-count every row that a retry writes twice."

[[note]]
level = "advanced"
topic = "Data"
text = "Do not compare aggregated floating-point results for exact equality in tests or reconciliation. Parallel and distributed sums add in varying order, and because float addition is not associative, the same data can give slightly different totals on each run."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Generate client types from the API's machine-readable schema as part of the build instead of writing them by hand. Hand-written types drift from the server, and the compiler then vouches for fields that no longer exist."

[[note]]
level = "advanced"
topic = "Python"
text = "Run related coroutines in an `asyncio.TaskGroup` (Python 3.11 and later) instead of loose `create_task` calls. When one fails, the group cancels the others and raises, rather than leaving orphaned tasks running and errors unobserved."

[[note]]
level = "advanced"
topic = "Java"
text = "Give every thread pool a thread factory that names its threads after their job, such as `orders-db-3`. Otherwise production thread dumps and profiles are full of names like `pool-7-thread-12`, and finding the stuck component takes far longer."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "A tag can move; a digest cannot. Pin container images by digest and actions by full commit SHA, and let Dependabot propose every change to the pins."

[[note]]
level = "professional"
topic = "Networking"
text = "Keep an out-of-band path to your network devices and hosts, such as a separate management network or console access. When a bad firewall or routing change cuts the main network, it is often the only way to undo the change."

[[note]]
level = "professional"
topic = "Incidents"
text = "Give every incident one commander whose job is coordination, not debugging. When the most senior engineer both leads and fixes, nobody tracks who is doing what, and parallel fixes collide."

[[note]]
level = "professional"
topic = "Incidents"
text = "After an incident, look for the same failure mode in sibling services, other regions and similar code, and fix those too. A postmortem that patches only the component that failed leaves the next outage already in place."

[[note]]
level = "professional"
topic = "Incidents"
text = "Track contributing factors across postmortems, not only each incident's own actions. When many unrelated-looking incidents share the same deploy tooling, dependency or missing test, that is where investment pays off."

[[note]]
level = "professional"
topic = "Incidents"
text = "Close an incident only after confirming recovery with the same customer-facing signals that detected it. Declaring victory on internal metrics while users still see errors reopens the incident and costs credibility."

[[note]]
level = "professional"
topic = "Incidents"
text = "Review chronic problems that never became incidents, such as recurring support tickets about the same error. Slow, repeated failures can cost more over a year than a single outage, yet they never page anyone."

[[note]]
level = "professional"
topic = "Data"
text = "Record the lineage of important datasets: which jobs produced them from which inputs. When a source turns out to be wrong, lineage tells you every report, model and export that needs fixing."

[[note]]
level = "professional"
topic = "Incidents"
text = "Set up break-glass access before you need it: an audited emergency path into production that does not depend on your SSO, VPN or other systems that may be down. Otherwise an identity outage locks responders out of the fix."

[[note]]
level = "professional"
topic = "Testing"
text = "Validate configuration in CI the way you test code: check it against a schema and start the service with it in a dry run. Config errors pass every unit test and often surface only once they reach production."

[[note]]
level = "professional"
topic = "Observability"
text = "Page only on symptoms that need a human now, such as users seeing errors or slow responses, and send everything else to a ticket queue. Pages for blips that fix themselves train on-call engineers to ignore the pager."

[[note]]
level = "professional"
topic = "Observability"
text = "Give responders read access to production dashboards, logs and traces by default, and write access through audited elevation. An incident where half the team cannot see the telemetry loses its first half hour to access requests."

[[note]]
level = "professional"
topic = "Observability"
text = "Give each team a telemetry budget for log volume, metric series and trace sampling, and show owners what they spend. Without budgets, observability costs grow faster than traffic until a cost review cuts them blindly."

[[note]]
level = "professional"
topic = "Observability"
text = "Tag every metric, log line and trace with the running version, region and zone, so any graph can be split by deploy or location. A regression confined to one version or zone otherwise averages into noise."

[[note]]
level = "professional"
topic = "Architecture"
text = "List the hard limits in your design, such as maximum message size, partition count, row size and request payload, and alert well before you approach them. Hard limits turn gradual growth into a sudden outage."

[[note]]
level = "professional"
topic = "APIs"
text = "Make bulk endpoints report a result for each item, so one bad record neither fails the whole batch nor hides partial success. Clients that cannot tell which items succeeded retry everything and create duplicates."

[[note]]
level = "professional"
topic = "Architecture"
text = "Keep caches optional for correctness: the system must stay right, if slower, when a cache is empty or down. A cache that holds the only copy of some state turns a cache restart into data loss."

[[note]]
level = "professional"
topic = "Architecture"
text = "Decide explicitly whether each system must survive a full region outage, and write the decision down. Multi-region design costs money and complexity everywhere, and an unstated assumption means nobody knows what a regional outage will do."

[[note]]
level = "professional"
topic = "Architecture"
text = "Route messages that keep failing to a dead-letter queue and alert on its size. Without one, a single poison message either blocks its queue or partition or is retried in a tight loop that burns capacity."

[[note]]
level = "professional"
topic = "Architecture"
text = "Keep business logic out of shared libraries that every service must upgrade in lockstep. A fix that requires redeploying fifty services at once turns every change into a coordinated release."

[[note]]
level = "professional"
topic = "Architecture"
text = "Keep synchronous call chains short. Availability multiplies along a chain: five dependencies at 99.9 percent each give about 99.5 percent when they fail independently, and every hop adds its latency too."

[[note]]
level = "professional"
topic = "Teams"
text = "Put the team that builds a service on call for it, instead of handing operations to a separate team. Engineers who are never paged for their own code have little reason to make it observable, debuggable and safe to deploy."

[[note]]
level = "professional"
topic = "Teams"
text = "Route interrupts, such as support questions and small requests, to one rotating person instead of the whole team. Constant context switching drains everyone's focus, while one person can batch the work and spot patterns worth fixing."

[[note]]
level = "professional"
topic = "Teams"
text = "Keep a service catalog listing each service's owning team, on-call rotation, runbooks and dashboards. During an incident, finding who owns a failing dependency should take seconds, not a search through old chat threads."

[[note]]
level = "professional"
topic = "Releases"
text = "Roll out every change progressively: a canary, then a slice of traffic, then everyone, halting automatically when error rates or latency regress. A change that reaches every server at once turns each bad deploy into a full outage."

[[note]]
level = "professional"
topic = "Releases"
text = "Make every deploy pausable, and know which steps are safe to stop between. A rollout that can only finish or be reverted forces a risky choice exactly when you are unsure what is wrong."

[[note]]
level = "professional"
topic = "Releases"
text = "Give every feature flag an owner and a removal date, and delete it once the rollout is done. Stale flags multiply untested code paths, and flipping a forgotten one years later can revive behavior nobody remembers."

[[note]]
level = "professional"
topic = "Releases"
text = "Roll out configuration changes with the same review, staging and gradual rollout as code. A config push that reaches every server at once is a deploy without safeguards, and a one-line edit can take everything down."

[[note]]
level = "professional"
topic = "Releases"
text = "Pair every release freeze with an exception process and a plan for the backlog it creates. A freeze that piles weeks of changes into the first release afterward creates the very risk it was meant to avoid."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Admit only images your own pipeline built and signed, enforced by an admission policy at deploy time. Otherwise anything pushed to a registry your clusters trust can reach production, whether or not it came from your source."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Generate signed provenance for every build that records the source commit, the builder and the build inputs. Without it, you cannot prove which source a binary came from when an auditor asks or when you suspect tampering."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Restrict network egress from CI runners and build hosts to the registries and services they need. A malicious dependency or compromised build step then has a much harder time sending your secrets or source anywhere."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Build releases on isolated, ephemeral builders that hold no standing credentials. A long-lived build server that an attacker compromises can inject code into every artifact while the source repository stays clean."

[[note]]
level = "professional"
topic = "Security"
text = "Require phishing-resistant MFA, such as security keys or passkeys, for administrators and anyone with production access. One-time codes from SMS or authenticator apps can be relayed in real time by a fake login page."

[[note]]
level = "professional"
topic = "Security"
text = "Patch internet-facing systems on a much shorter clock than internal ones, and keep a current list of what is exposed. Exploits for edge devices and public services often appear within days of a disclosure."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Use separate keys for separate purposes, such as token signing, data encryption and backups. Reusing one key couples their fates: a leak or forced rotation for one purpose breaks all the others."

[[note]]
level = "professional"
topic = "Security"
text = "Treat every laptop with production access as part of production: managed, encrypted, patched and monitored. An unmanaged machine holding a production session is an unmonitored path into your systems."

[[note]]
level = "professional"
topic = "Databases"
text = "Know how long maintenance operations take on your largest tables: index rebuilds, schema changes, vacuum and full restores. Operations that take minutes at today's size can take days at next year's, long past any maintenance window."

[[note]]
level = "professional"
topic = "Databases"
text = "Agree on a recovery time objective and a recovery point objective for each datastore, then test that restores and failover actually meet them. Until tested, the numbers are hopes that the business is already planning around."

[[note]]
level = "professional"
topic = "Databases"
text = "Run large backfills in small, throttled batches that you can pause. One huge transaction holds locks, bloats the write-ahead log and can push replicas far behind, turning a data fix into an outage."

[[note]]
level = "professional"
topic = "Databases"
text = "Test database failover under production-like load and measure how long clients take to reconnect. Connection pools, DNS caches and drivers often keep talking to the old primary well after the failover itself completes."

[[note]]
level = "professional"
topic = "Cloud"
text = "Provision enough capacity to lose one availability zone without overloading the rest. Three zones each running at 90 percent cannot absorb a zone failure: the surviving two would need 135 percent."

[[note]]
level = "professional"
topic = "Cloud"
text = "Reserve or pre-provision the capacity you will need for failover or known peaks where your provider can run short. Regional capacity is finite, and during a regional outage many customers fail over into the same neighboring region at once."

[[note]]
level = "professional"
topic = "Cloud"
text = "Tag every cloud resource with an owner and a purpose, and enforce the tags with policy. Untagged resources become orphans that nobody dares delete, and cost reviews cannot tell whom to ask."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Upgrade Kubernetes clusters on a regular schedule. Each minor release is supported for a limited time and the control plane moves one minor version per upgrade, so falling behind turns into a rushed chain of upgrades through removed APIs."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Split infrastructure state into small units by environment and component. With one giant state, every plan is slow, every apply can touch everything, and a single mistaken change has your entire estate as its blast radius."

[[note]]
level = "professional"
topic = "Documentation"
text = "Keep a current map of which services call which, generated from traces or traffic rather than drawn by hand. Hand-drawn diagrams go stale, and during an incident you need the real blast radius, not last year's picture."

[[note]]
level = "professional"
topic = "Code review"
text = "Put alert rules, dashboards and deploy pipelines through code review like application code. Mistakes there fail no test: an alert that can never fire looks exactly like a quiet system."

[[note]]
level = "professional"
topic = "Observability"
text = "Alert on the freshness of data pipelines and caches: how old the newest successful output is. A pipeline can report zero errors while quietly serving yesterday's data."

[[note]]
level = "professional"
topic = "Performance"
text = "Track cost per request or per customer next to latency and throughput. Efficiency regressions that double the bill otherwise surface only at month end, and optimizations never get credit."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Make builds hermetic: fetch every input from pinned, checksummed sources and nothing from the network mid-build. A build that downloads whatever is newest today produces a different artifact tomorrow from the same commit."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Record the toolchain versions, base image digest and lockfile behind each release. When you must patch a two-year-old release, you can then rebuild what actually shipped instead of whatever today's tools produce."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Keep the scripts, queries and data snapshots behind any number used in a decision, report or postmortem. Figures get challenged months later, and a number nobody can regenerate cannot be defended."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Rebuild releases independently and compare the results bit for bit. Only a build that reproduces exactly lets you show that a published binary came from its source and not from a tampered build machine."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Serve third-party packages and images through a proxy or mirror you control. Builds keep working when a public registry is down or rate-limits you, and you get one place to block a known-bad version everywhere."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Track end-of-life dates for every runtime, framework and OS image you run, and schedule upgrades well before support ends. After that date security fixes stop, and the upgrade becomes an emergency the day a vulnerability lands."

[[note]]
level = "professional"
topic = "Dependencies"
text = "When you fork a dependency to patch it, record why and plan to upstream the fix or drop the fork. A private fork misses upstream security fixes, and merging years of changes back later is a project of its own."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Check dependency licenses automatically in CI against a policy your legal team has approved. A package with incompatible or missing license terms found after launch can force a rewrite or a legal review under deadline."

[[note]]
level = "professional"
topic = "Versioning"
text = "Run old and new versions of an internal API side by side during a migration, and track which callers remain on the old one. A hard cutover forces every consumer to deploy on the same day, and the slowest team blocks everyone."

[[note]]
level = "professional"
topic = "Versioning"
text = "Publish a support window for each release line and end support on schedule. Supporting every version ever shipped spreads each fix across too many branches, and customers never feel pressure to upgrade."

[[note]]
level = "professional"
topic = "Versioning"
text = "Put a version field in stored and exchanged data formats, such as file headers, message envelopes and cache entries. Without one, the first incompatible change forces a flag day, because readers cannot tell old records from new."

[[note]]
level = "professional"
topic = "Data"
text = "Validate data at pipeline boundaries: row counts, null rates, value ranges and schema. A silently broken upstream feed otherwise flows into reports and models for weeks before anyone notices the numbers are wrong."

[[note]]
level = "professional"
topic = "Data"
text = "Classify data by sensitivity and record where each class is stored and copied. You cannot honor a deletion request or scope a breach when nobody knows which systems hold personal data."

[[note]]
level = "professional"
topic = "Data"
text = "Keep derived data, such as search indexes, caches and aggregates, rebuildable from its source, and test the rebuild. Derived stores drift or corrupt over time, and without a rebuild path the only fix is manual repair."

[[note]]
level = "professional"
topic = "Data"
text = "Delete data you no longer need on a schedule. Every record you keep is one you must secure, disclose in a breach and produce in legal requests, and old data rarely earns that cost."

[[note]]
level = "professional"
topic = "Time"
text = "Pick one time zone for business reporting and billing periods, and write it into the data definitions. When each team cuts days at its own midnight, totals disagree and every reconciliation becomes a hunt for missing hours."

[[note]]
level = "professional"
topic = "Time"
text = "Keep a calendar of every expiry in your systems, such as certificates, domains, API keys, licenses and signing keys, with owners and alerts. Each one is an outage scheduled in advance unless someone renews it in time."

[[note]]
level = "professional"
topic = "Networking"
text = "Send traffic to partners from fixed, documented IP addresses when they allowlist you, and record which partners depend on them. Changing NAT gateways or providers otherwise breaks integrations nobody remembered."

[[note]]
level = "professional"
topic = "Networking"
text = "Review firewall and security group rules periodically and remove any nobody can explain. Temporary openings for a migration or a vendor become permanent holes, and unexplained rules make every later change riskier."

[[note]]
level = "professional"
topic = "DNS"
text = "Manage DNS records as reviewed code, not by hand in a provider's console. A mistyped record takes down whatever depends on it, and without history you cannot even see what the correct value was."

[[note]]
level = "professional"
topic = "DNS"
text = "Serve critical domains from two independent authoritative DNS providers, kept in sync by automation. If your only DNS provider has an outage, every service on the domain becomes unreachable, however healthy it is."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Keep release signing keys in an HSM or a managed key service, never as files on build machines or laptops. A copied signing key lets an attacker produce releases your users trust, and you cannot tell forged signatures from real ones."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Keep an inventory of where you use cryptography: algorithms, key sizes, libraries and certificates. When an algorithm is weakened or a library has a critical flaw, you need to find every use within days, not months."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Rotate token signing keys with an overlap: publish the new public key, wait until verifiers have fetched it, start signing with it, and retire the old key only after its tokens expire. A one-step switch rejects valid tokens in flight."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Back up encryption keys as carefully as the data they protect, and test recovering them. Losing a key is the same as deleting everything it encrypted, backups included."

[[note]]
level = "professional"
topic = "Testing"
text = "Test how your service behaves when each dependency is slow, not only when it is down. Missing or long timeouts turn a slow dependency into exhausted threads and a full outage, which a simple down test never shows."

[[note]]
level = "professional"
topic = "Testing"
text = "Run consumer contract tests in the provider's CI so a change that breaks a known client fails before merge. Otherwise integration breakage is discovered in staging or production, after both sides have moved on."

[[note]]
level = "professional"
topic = "Testing"
text = "Run a few end-to-end smoke tests against production after every deploy, using dedicated test accounts. Staging cannot catch production-only configuration, and a smoke test finds the break before customers do."

[[note]]
level = "professional"
topic = "CI"
text = "Treat your CI system as production infrastructure, with monitoring, capacity planning and an owner. When CI is down or slow, nobody can ship fixes, including the fix for an ongoing incident."

[[note]]
level = "professional"
topic = "CI"
text = "Treat CI duration as a team metric and keep the main pipeline fast. When feedback takes an hour, engineers batch changes, skip runs and merge on hope, and problems surface later and cost more."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Restrict which actions your organization's workflows may use to an allowlist of vetted and internal actions. Otherwise any workflow can pull in arbitrary third-party code that runs with its repository's token and secrets."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Scope organization-level Actions secrets to the repositories that need them instead of making them available to all. A secret visible to every repository can be read by any workflow in any of them, including ones with weaker review."

[[note]]
level = "professional"
topic = "GitHub"
text = "Keep the list of GitHub organization owners short and review it regularly. An owner can change any repository's protections, secrets and settings, so every extra owner account is another path to your whole codebase."

[[note]]
level = "professional"
topic = "GitHub"
text = "Review the GitHub Apps, OAuth apps and deploy keys that can reach your organization, and remove unused ones. Each is a standing credential into your code, and a breach wherever it is held becomes a breach of your repositories."

[[note]]
level = "professional"
topic = "Git"
text = "Back up your Git hosting, including issues, pull requests and wikis, not only the repositories. Clones preserve code history, but review discussions and decisions live only on the hosting platform."

[[note]]
level = "professional"
topic = "Testing"
text = "Test recovery procedures, such as restoring a database or rebuilding a node, with people other than their authors. Runbooks that only their authors can follow fail the first time someone else needs them at night."

[[note]]
level = "professional"
topic = "Containers"
text = "Set registry retention rules that never delete images that are running or recently deployed. Aggressive cleanup removes the image a rollback or a new node needs, and pods fail with `ImagePullBackOff` at the worst time."

[[note]]
level = "professional"
topic = "Containers"
text = "Maintain a small set of approved, minimal base images for the whole organization, owned by one team. Dozens of teams choosing their own bases multiply the packages you must patch and the images nobody updates."

[[note]]
level = "professional"
topic = "HTTP"
text = "Check how your CDN caches error responses and set short, explicit TTLs for them. A `500` or `404` cached at the edge keeps failing for every user long after the origin has recovered or the page exists."

[[note]]
level = "professional"
topic = "HTTP"
text = "Let caches serve stale content when the origin fails, with `stale-if-error` or your CDN's equivalent. For many pages, slightly old data is far better than an error, and the origin gets room to recover."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Build accessibility into your shared component library, so every team gets labeled controls, focus handling and sufficient contrast by default. Fixing one component fixes every screen that uses it; fixing screens one by one never finishes."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Declare every package your code imports in that project's own `package.json`: with hoisted `node_modules`, an undeclared import often resolves by accident and then breaks when an unrelated upgrade stops pulling it in."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Decide what happens when two instances of a singleton job or elected leader run at once, and make that case safe. Partitions and slow shutdowns make brief overlaps normal, and code that assumes exclusivity corrupts data when they happen."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Prevent scheduled jobs from overlapping, with a lock or the scheduler's concurrency setting, unless they are safe to run in parallel. A job that runs longer than its interval otherwise piles up copies that fight over the same data."

[[note]]
level = "professional"
topic = "Debugging"
text = "Build a safe way to turn on detailed tracing for one customer or request in production without a redeploy. Many bugs depend on data or configuration that exists only in production, so local reproduction fails."

[[note]]
level = "professional"
topic = "Debugging"
text = "Keep past incidents searchable by symptom, error message and component. A responder who finds that the same error meant a full disk last spring saves the hour it would take to rediscover that."

[[note]]
level = "professional"
topic = "Linux"
text = "Keep kernel parameters, resource limits and sysctl settings for production hosts in configuration management, with the reason for each. Hand-tuned hosts lose their settings on rebuild, and the problem they fixed quietly returns."

[[note]]
level = "professional"
topic = "Tooling"
text = "Define development environments in code, such as a container image or dev container configuration, and use the same definition in CI. Hand-configured machines drift until bugs appear on one laptop or only in CI."

[[note]]
level = "professional"
topic = "Shell"
text = "Keep scripts that touch production in version control, reviewed and tested like application code. One-off scripts left on a bastion host become critical tools that nobody can read, audit or change safely."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Pin the exact TypeScript version and upgrade it in dedicated changes: TypeScript does not follow semantic versioning, and minor releases routinely add checks that fail builds across a large codebase."

[[note]]
level = "professional"
topic = "Incidents"
text = "Pause unrelated deploys and changes while an incident is open. A deploy landing mid-incident adds a new variable, can hide whether a mitigation worked and makes the timeline harder to read."

[[note]]
level = "professional"
topic = "Incidents"
text = "Record every production change, including deploys, flag flips, config pushes and infrastructure applies, in one searchable timeline. The first question in most incidents is what changed, and answering it from five tools wastes the first hour."

[[note]]
level = "professional"
topic = "Python"
text = "Standardize on one Python packaging and lock tool across your services. When each repository uses its own mix of pip, Poetry, Pipenv and hand-edited requirement files, every security patch needs a different procedure and some services get missed."

[[note]]
level = "professional"
topic = "Incidents"
text = "Hand off long incidents explicitly: the outgoing commander summarizes the state, open hypotheses and owners, then says who leads now. Implicit handoffs at shift change leave the incident with two commanders or none."

[[note]]
level = "professional"
topic = "Incidents"
text = "Rehearse failures in game days: take down a dependency or a zone on purpose, with a rollback plan and people watching. Recovery steps that are never exercised tend to fail when needed, usually at a step nobody remembered."

[[note]]
level = "professional"
topic = "Incidents"
text = "Send customer updates on a fixed schedule during an incident, even when the update is that you are still investigating. Silence drives support tickets and speculation, and customers lose trust faster than they lose service."

[[note]]
level = "professional"
topic = "Incidents"
text = "When you suspect an intrusion, preserve evidence before cleaning up: snapshot disks, keep logs and write down what you do. Rebuilding the host first destroys what you need to learn how the attacker got in and what else they touched."

[[note]]
level = "professional"
topic = "Incidents"
text = "Run a tabletop exercise for a security breach: who decides to take systems offline, who speaks to customers and regulators, who preserves evidence. Notification deadlines in many jurisdictions run from when you learn of a breach, not when you finish investigating."

[[note]]
level = "professional"
topic = "Observability"
text = "Count wrong, empty and slow responses as failures in your SLIs, not only error status codes. A service that returns `200` with an empty result during an outage looks perfectly healthy to a status-code metric."

[[note]]
level = "professional"
topic = "Observability"
text = "Alert on queue age or consumer lag, not just on whether consumers are running. A consumer that is up but falling behind looks healthy until messages expire or users notice hours of delay."

[[note]]
level = "professional"
topic = "Observability"
text = "Give every service a standard dashboard of the four golden signals: latency, traffic, errors and saturation. Responders from other teams can then read any service's health in an incident without learning its custom views."

[[note]]
level = "professional"
topic = "Observability"
text = "Alert on how fast you are spending your error budget, measured over both a short and a long window, rather than on raw error counts. Burn-rate alerts page for real threats to the objective and stay quiet during brief blips."

[[note]]
level = "professional"
topic = "Observability"
text = "Sample traces deliberately: keep every error and slow request and sample routine successes. Uniform sampling at a low rate throws away most of the rare failures you actually need to debug."

[[note]]
level = "professional"
topic = "Observability"
text = "Give every alert an owning team, and review alerts that fired without anyone acting on them each month. Ownerless alerts accumulate until the pager is noise, and nobody feels entitled to delete them."

[[note]]
level = "professional"
topic = "Architecture"
text = "Split a service only along boundaries where teams and data can be owned independently. Services that must deploy together or share a database keep a monolith's coupling and add network failures on top."

[[note]]
level = "professional"
topic = "Architecture"
text = "Make it possible to drain traffic from a zone or region with one tested action. When a zone is degraded rather than down, moving traffic away is often the fastest mitigation, and improvising it live is slow."

[[note]]
level = "professional"
topic = "Architecture"
text = "Limit blast radius by dividing large systems into independent cells or shards with their own capacity and dependencies. When everything is one global deployment, any bad change or poison request can take down every customer at once."

[[note]]
level = "professional"
topic = "Architecture"
text = "Design data planes to keep serving on their last known configuration when the control plane fails. If handling a failure requires the control plane, a control plane outage becomes a total outage instead of a pause in changes."

[[note]]
level = "professional"
topic = "Architecture"
text = "Adopt a new database, language or queue only when its benefit outweighs years of operating it. Each one brings on-call knowledge, upgrades, backups and security patches that someone must own long after launch."

[[note]]
level = "professional"
topic = "Architecture"
text = "Plan for a cold cache: know what load the database sees with the cache empty, and warm it or rate-limit accordingly. A cache absorbing 95 percent of reads turns a flush or restart into a twentyfold spike on the database."

[[note]]
level = "professional"
topic = "APIs"
text = "Sign the webhooks you send, rotate the signing secret with an overlap period, and document how receivers verify. Unsigned webhooks let anyone who learns a receiver's URL forge events in your name."

[[note]]
level = "professional"
topic = "APIs"
text = "Have clients ignore unknown fields and unknown enum values instead of failing on them. Otherwise every additive server change breaks strict clients, and the API can never evolve safely."

[[note]]
level = "professional"
topic = "Releases"
text = "Have the author of each change watch its deploy until it has proven itself, instead of merging and walking away. Regressions are cheapest to catch in the first minutes, while the author still remembers exactly what changed."

[[note]]
level = "professional"
topic = "APIs"
text = "Enforce rate limits and quotas per tenant or API key, not only globally. With a global limit alone, one customer's runaway script uses up the shared capacity and every other customer sees errors."

[[note]]
level = "professional"
topic = "APIs"
text = "Deliver webhooks with retries and backoff, and let customers replay missed events. Receivers go down, and a webhook sent once and forgotten loses data that the customer will ask about later."

[[note]]
level = "professional"
topic = "Teams"
text = "End every on-call shift with a short written handoff: open issues, noisy alerts, pending changes. Without it, the next person rediscovers the same problems, and slow-burning issues fall between shifts."

[[note]]
level = "professional"
topic = "Teams"
text = "Track pages per on-call shift and treat a noisy rotation as a bug to fix. Exhausted engineers miss the real alert among false ones, and the people who can leave the rotation eventually do."

[[note]]
level = "professional"
topic = "Teams"
text = "Measure toil, the manual and repetitive operations work, and cap how much of the team's time it may take. Toil grows with the system, and a team that only fights fires never builds the automation that would stop them."

[[note]]
level = "professional"
topic = "Teams"
text = "Transfer service ownership explicitly: hand over runbooks, alerts, dashboards and known issues, and update everything that routes pages. Reorganizations otherwise leave orphaned services whose alerts page nobody."

[[note]]
level = "professional"
topic = "Security"
text = "Revoke access through a written offboarding checklist tied to your identity provider: SSO, cloud accounts, tokens, SSH keys and shared passwords. Access that outlives employment is a standing breach risk."

[[note]]
level = "professional"
topic = "Security"
text = "Review who has production access every quarter and remove what is no longer needed. Permissions accumulate as people change roles, and each unused grant is one more account whose compromise reaches production."

[[note]]
level = "professional"
topic = "Security"
text = "Require a second person to approve high-risk production actions such as bulk data deletion, permission grants and key changes. A two-person rule catches mistakes and stops a single compromised account from doing irreversible damage."

[[note]]
level = "professional"
topic = "Security"
text = "Log reads of your most sensitive data, such as customer exports and payment details, not only changes to it. Data is stolen through reads, and without access logs you cannot tell whose records were exposed."

[[note]]
level = "professional"
topic = "Security"
text = "Threat-model new systems during design: what an attacker wants, how they could get it and which controls stop them. Security added after launch costs far more and usually leaves the architecture's weak points in place."

[[note]]
level = "professional"
topic = "Databases"
text = "Keep remote calls out of database transactions: never hold a transaction open across an HTTP request or a queue publish. A slow remote call then holds locks and old row versions, and one sluggish dependency stalls unrelated queries."

[[note]]
level = "professional"
topic = "Databases"
text = "Run analytics and ad hoc reports against a replica or a warehouse, not the primary database. One heavy query can saturate I/O and slow every customer request, and in MVCC databases a long one holds back cleanup of old row versions."

[[note]]
level = "professional"
topic = "Databases"
text = "Treat major database version upgrades as projects, rehearsed on a copy of production data. Query planner changes and removed features show up only with real data, and rolling back a major upgrade is often hard or impossible."

[[note]]
level = "professional"
topic = "Databases"
text = "Size connection pools against the database's total connection limit across all instances, including autoscaling peaks. Twenty pods with pools of 50 need 1,000 connections, and scaling out during a spike can lock everyone out."

[[note]]
level = "professional"
topic = "Databases"
text = "Keep a tested procedure for restoring a single table or a few rows, not only the whole database. Many real recoveries involve one bad migration or script, and a full restore to fix one table can roll back hours of other writes."

[[note]]
level = "professional"
topic = "Cloud"
text = "Keep an exit plan for each critical managed service: how you would export the data and what could replace it. Discovering during a price change or a long outage that an export takes weeks leaves you with no options."

[[note]]
level = "professional"
topic = "Cloud"
text = "Set maximum sizes on autoscaling groups and alert when a group reaches its ceiling. With no ceiling, a retry storm or bug can scale you into a huge bill; with a ceiling but no alert, you silently stop scaling under real demand."

[[note]]
level = "professional"
topic = "Cloud"
text = "Test failover to your standby region regularly, with real traffic. An untested standby drifts: missing capacity, stale configuration, expired certificates, and the failover fails just when the primary does."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Bind namespaced roles to people and pipelines instead of `cluster-admin`. A leaked kubeconfig with cluster-wide rights can read every Secret and run any workload on any node."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Set a `ResourceQuota` and a `LimitRange` on shared namespaces. Without them, one team's runaway deployment can consume the cluster's capacity and leave other teams' pods stuck in `Pending`."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Version shared infrastructure modules and pin each environment to a release. A module referenced from a moving branch changes production the next time anyone applies, whether or not they touched it."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Read every destroy and replace in a plan before approving it, and have CI flag plans that contain them. A small attribute change can force a resource to be replaced, and replacing a database or disk deletes its data."

[[note]]
level = "professional"
topic = "Documentation"
text = "Keep runbooks next to the code they describe and update them in the same pull request as the change. Runbooks in a separate wiki go stale silently, and an outdated one misleads responders during an incident."

[[note]]
level = "professional"
topic = "Documentation"
text = "Have each new hire follow the onboarding and setup docs exactly and fix what breaks. Docs that only veterans read decay silently, and every new engineer loses days to the same missing steps."

[[note]]
level = "professional"
topic = "Code review"
text = "Ask for a second reviewer on changes that weaken safety checks: skipped tests, lowered coverage thresholds, relaxed lint rules or widened permissions. They look small in a diff and remove protection for everything merged after them."

[[note]]
level = "professional"
topic = "Performance"
text = "Set performance budgets for key metrics, such as p99 latency, memory or page weight, and fail CI when a change exceeds them. Regressions of a few percent each pass review unnoticed and add up to a slow product."

[[note]]
level = "professional"
topic = "Releases"
text = "Test your rollback path as often as your deploy path. A rollback that has not been exercised can fail on a migration, a cache format or a config change, exactly when you are relying on it."

[[note]]
level = "professional"
topic = "Releases"
text = "Deploy small changes often instead of large batches rarely. A deploy with one change is easy to diagnose and roll back; one with fifty turns every incident into a hunt for the change that caused it."

[[note]]
level = "professional"
topic = "Releases"
text = "Keep the previous version deployable, and ideally still running, until the new one has proven itself under real traffic. A rollback that must first rebuild or reprovision takes time you may not have."

[[note]]
level = "professional"
topic = "Releases"
text = "Schedule risky deploys for when the people who can fix them are awake and available, and avoid starting them just before a weekend or holiday. The same failure costs far more when responders are tired, few and hard to reach."

[[note]]
level = "professional"
topic = "Releases"
text = "Assume old client versions stay in use for years, especially mobile apps. Keep the server compatible with them, or build a forced-upgrade mechanism into the client before you ever need it."

[[note]]
level = "professional"
topic = "Teams"
text = "Reduce how many teams a routine change must coordinate across; if ordinary features need three teams to agree, redraw ownership or interfaces. Every handoff adds waiting, and delivery slows to the pace of the busiest team."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Build leader election and coordination on an established consensus system, such as etcd, ZooKeeper or a mature Raft library. Homegrown consensus protocols fail in partition and timing cases that take years of testing to find."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Wait a few days before adopting newly published dependency versions, except for urgent security fixes. Compromised releases are often caught and pulled quickly, and a short delay keeps you from being among the first to install one."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Keep a written process for critical vulnerabilities in dependencies: who triages, how fast fixes must ship and how exceptions are recorded. Improvising that process during the next widespread emergency costs days."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Know who can publish each package, image and release you distribute, and review that list when people change roles. Former contributors with lingering publish rights are an easy path to a malicious release."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Pull third-party code into production only through reviewed dependency changes, never through scripts that fetch the latest version at deploy or boot time. A `curl | sh` in a startup script runs whatever the remote serves that day."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Treat vendors that run code or hold data for you as part of your supply chain: review their security practices and breach notification terms, and limit what you share. Their incident becomes yours, often before they tell you."

[[note]]
level = "professional"
topic = "Documentation"
text = "Write a short design document before building anything that will take weeks or touch several teams, and circulate it for review. A flaw found in a two-page document costs an afternoon; found after launch, it costs a migration."

[[note]]
level = "professional"
topic = "Teams"
text = "Reserve a fixed share of each planning cycle for reliability and maintenance work. When each item must beat features on its own merits, cleanup never happens until an outage forces it."

[[note]]
level = "professional"
topic = "Teams"
text = "Measure delivery with team-level trends such as lead time and change failure rate, never as individual rankings. Metrics tied to individuals get gamed, and then the numbers stop telling you anything."

[[note]]
level = "professional"
topic = "Teams"
text = "Write down the expectations for each on-call rotation: response times, escalation, handoffs and compensation. Unwritten expectations vary by person, and the most conscientious engineers end up absorbing the load."

[[note]]
level = "professional"
topic = "Git"
text = "Make sure you can ship a critical fix while your Git host is down: keep an up-to-date mirror and know which build and deploy steps depend on the host. Otherwise a hosting outage during an incident also blocks the fix."

[[note]]
level = "professional"
topic = "Security"
text = "Use separate credentials and keys for each environment, and make sure staging credentials cannot touch production. Shared secrets let a leak from the least protected environment reach the most protected one."

[[note]]
level = "professional"
topic = "Security"
text = "Inventory every service account and API key with an owner and a purpose, and disable ones unused for months. Orphaned machine credentials are rarely monitored, and many never expire on their own."

[[note]]
level = "professional"
topic = "Security"
text = "When someone leaves or changes roles, rotate the shared secrets they could see, such as service passwords, API keys and break-glass codes. Offboarding that removes the person but not what they knew leaves working credentials outside."

[[note]]
level = "professional"
topic = "Security"
text = "Make sure you can revoke every class of credential quickly and at scale: sessions, API keys, tokens and certificates. After a breach you may need to invalidate all of them, and discovering there is no mechanism wastes the critical hours."

[[note]]
level = "professional"
topic = "Databases"
text = "Alert on database disk usage by projected time until full, not only on a fixed percentage. A static threshold fires too late on a fast-growing disk and too early on a slow one, and a full disk on a primary means a long outage."

[[note]]
level = "professional"
topic = "Networking"
text = "Document the timeouts at every hop of a request path: load balancers, proxies, gateways and services. Mismatched idle and request timeouts between layers produce intermittent `502` and `504` errors that no single component's logs explain."

[[note]]
level = "professional"
topic = "Databases"
text = "Review every migration for its locking behavior, not only its correctness: know whether each statement rewrites the table or waits for an exclusive lock. A migration that is instant on test data can block production writes for an hour."

[[note]]
level = "professional"
topic = "SQL"
text = "Check the query plans of new queries against production-sized data before release. A query that is fast on a small test database can scan millions of rows in production, where different statistics lead the planner elsewhere."

[[note]]
level = "professional"
topic = "Cloud"
text = "Enforce guardrails at the organization level, such as blocking unused regions and preventing audit logs from being disabled. Account-level policies can be changed by anyone who gains admin in that account; organization policies stay in force."

[[note]]
level = "professional"
topic = "Cloud"
text = "Read the shared responsibility model for every managed service you adopt: backups, patching, encryption and access settings often remain your job. Assuming the provider handles them is how data ends up unrecoverable or public."

[[note]]
level = "professional"
topic = "Containers"
text = "Keep an inventory of which image digests run in which clusters, with a software bill of materials for each, so when a new vulnerability is announced you can tell in minutes where the affected package runs."

[[note]]
level = "professional"
topic = "Cloud"
text = "Estimate data transfer costs when placing services across zones, regions and providers. Cross-zone and cross-region traffic is often billed per gigabyte, and a chatty service split across boundaries can cost more in transfer than in compute."

[[note]]
level = "professional"
topic = "Cloud"
text = "Show each team the cloud cost of the services it owns every month. When nobody sees the bill for their own choices, oversized instances, forgotten environments and verbose logging keep running for years."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Give cluster add-ons, such as the ingress controller, CoreDNS and the CNI plugin, owners and an upgrade schedule. They sit in every request path and are easy to forget until a cluster upgrade breaks them."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Restrict who can run `kubectl exec` in production and record every session through API audit logging. A shell in a pod bypasses your deploy pipeline, and without a record you cannot tell what was changed."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Assign priority classes so critical services outrank batch and experimental workloads. When a cluster runs short, the scheduler then preempts the work that can wait instead of your checkout service."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Practice recreating a cluster from nothing using only your repositories and pipelines. Objects someone once applied by hand are discovered missing during a disaster, when the new cluster fails to run what the old one did."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Give the pipeline that applies infrastructure its own narrowly scoped identity, and keep broad admin credentials off laptops. Whoever can run an apply can change anything in its scope, so that scope is your blast radius."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Practice state surgery before you need it: importing, moving and removing resources from state in a sandbox. Refactors and incidents eventually demand it, and learning it on production state risks orphaning or destroying live resources."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Check infrastructure plans against policy in CI: no public storage, encryption required, approved regions only. Reviewers miss one line in a long plan; an automated policy check does not."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Build every environment from the same modules with different variables, not from copied directories. Copies drift apart, and staging stops predicting what the same change will do in production."

[[note]]
level = "professional"
topic = "Documentation"
text = "Comment every surprising configuration value with its reason and the incident or ticket behind it. Unexplained values get cleaned up by the next engineer, and the old outage comes back with them."

[[note]]
level = "professional"
topic = "Documentation"
text = "Run a production readiness review before launching a service: alerts, dashboards, runbooks, backups, capacity and an on-call owner. Launching first and filling the gaps later means the first incident finds them for you."

[[note]]
level = "professional"
topic = "Data"
text = "Decide where each customer's data may be stored, processed and backed up before expanding into new countries. Retrofitting data residency onto a single global database is a major migration, and contracts may already promise it."

[[note]]
level = "professional"
topic = "Code review"
text = "Require a reviewer with domain knowledge for changes to authentication, authorization, cryptography and billing, enforced with code owners. Subtle flaws in those areas are easy for a general reviewer to miss and expensive to discover in production."

[[note]]
level = "professional"
topic = "Code review"
text = "In review, ask how a change will be deployed, observed and rolled back, not only whether the code is correct. Code that is correct but cannot be rolled back or observed still causes outages."

[[note]]
level = "professional"
topic = "Performance"
text = "Load test past your expected peak until something breaks, and record how it fails. Knowing whether overload brings slowdowns, errors or a crash loop decides your alerts, limits and runbooks."

[[note]]
level = "professional"
topic = "Performance"
text = "Warm new instances before they take full traffic: prime caches and connection pools, or ramp traffic up gradually. A cold instance at full load serves its first minutes slowly and can fail health checks into a restart loop."

[[note]]
level = "professional"
topic = "Architecture"
text = "When two systems must agree, such as billing and entitlements, run a reconciliation job that compares them and alerts on drift. Writes across systems fail partially, and without reconciliation mismatches surface as customer complaints."

[[note]]
level = "professional"
topic = "Observability"
text = "Run monitoring and alerting on infrastructure separate from what they watch, with capacity of their own. When metrics and logs flow through the cluster that is failing, they disappear exactly when you need them."

[[note]]
level = "professional"
topic = "Observability"
text = "Define service level objectives from the user's point of view, such as successful checkouts within two seconds, not from server metrics like CPU. Objectives users cannot feel lead teams to optimize numbers that do not matter."

[[note]]
level = "professional"
topic = "Architecture"
text = "Put an expiry on queued work such as jobs, messages and scheduled tasks, and skip or dead-letter items whose result no longer matters. Stale work processed after an outage delays the fresh work users are waiting for."

[[note]]
level = "professional"
topic = "Architecture"
text = "Know which of your dependencies share a failure domain, including SaaS vendors that run in your cloud region. One regional outage can take down your service and the tools you would use to respond, all at once."

[[note]]
level = "professional"
topic = "Incidents"
text = "Estimate customer impact early: which customers, which features and since when. Severity, communication and mitigation order all depend on it, and scope reconstructed from memory later is usually wrong."

[[note]]
level = "professional"
topic = "Incidents"
text = "Review near misses as seriously as outages. A failover that barely worked or an alert that fired by luck exposes the same weaknesses as an outage, without the cost of learning them the hard way."

[[note]]
level = "professional"
topic = "Incidents"
text = "Measure time to detect for every incident and ask how you could have known sooner. When customers report problems before your alerts do, the gap is in your monitoring, and no fix to the failing component will close it."

[[note]]
level = "professional"
topic = "Incidents"
text = "Page the owners of a failing dependency early instead of working around it alone. They may already know the cause, and a fix improvised from outside can make their recovery harder."

[[note]]
level = "professional"
topic = "Observability"
text = "Keep enough metric history to compare today with last week and last quarter. Many problems show up only as slow trends, such as creeping latency or memory use, which short retention hides."

[[note]]
level = "professional"
topic = "Dependencies"
text = "For critical dependencies, check how many people actively maintain them, and fund or contribute to the ones you rely on. A project kept alive by one volunteer can stall or change hands overnight, and your roadmap then depends on theirs."

[[note]]
level = "professional"
topic = "Observability"
text = "Measure performance where users experience it, with real-user monitoring in browsers and apps, not only server timings. A fast API behind heavy scripts or a distant edge still feels slow to the people using it."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Include people who use assistive technology in usability testing of major flows. Automated checks and developers trying a screen reader for the first time both miss problems that daily users hit within seconds."

[[note]]
level = "professional"
topic = "Architecture"
text = "Isolate batch and background workloads from latency-sensitive traffic, on separate instances, pools or replicas. A nightly job sharing resources with user requests turns every heavy run into a slowdown for customers."

[[note]]
level = "professional"
topic = "Architecture"
text = "Give each tenant, feature or job type its own pool of workers or connections when one of them could exhaust the rest. Bulkheads keep a flood of slow requests in one area from starving everything else."

[[note]]
level = "professional"
topic = "Architecture"
text = "Put a circuit breaker around calls to each critical dependency, so that once it fails repeatedly you stop calling it for a while. Sending full traffic to a struggling service keeps it down and ties up your own threads waiting on it."

[[note]]
level = "professional"
topic = "Web"
text = "Collect JavaScript errors from real users' browsers, tagged with the release and mapped through source maps; many front-end failures never reach your servers, so server dashboards stay green while pages are broken."

[[note]]
level = "professional"
topic = "Linux"
text = "Standardize on one Linux distribution and base configuration across the fleet where you can. Each extra variant multiplies patching, tooling and on-call knowledge, and incidents take longer on the odd host out."

[[note]]
level = "professional"
topic = "APIs"
text = "Let customers hold two active API keys at once so they can rotate without downtime. With a single key, rotation means an outage, so nobody rotates, and leaked keys stay valid for years."

[[note]]
level = "professional"
topic = "Data"
text = "Make cleanup jobs, such as retention deletes and deduplication, report how much they remove and alert when the count jumps. A bug in a job that deletes by design removes live data at scale without raising a single error."

[[note]]
level = "professional"
topic = "HTTP"
text = "Design cache invalidation before an incident needs it: tag CDN responses with the content they include, so one purge clears every page that shows a changed item instead of waiting out TTLs."

[[note]]
level = "professional"
topic = "Time"
text = "Record both event time and processing time in data pipelines, and decide how late-arriving data is handled. Mixing the two makes daily totals change after the fact and hides upstream delays."

[[note]]
level = "professional"
topic = "Architecture"
text = "Know which foundational services every host depends on, such as DNS, time sync, the identity provider and the internal certificate authority, and test losing each. They rarely fail, so their failure modes go untested, and when they fail everything fails together."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Route all writes for one entity through a single owner, such as one partition per account or one actor per order, so ordering and conflicts are settled in one place. Coordinating many writers per key needs distributed locks that fail in subtle ways."

[[note]]
level = "professional"
topic = "Networking"
text = "Know your DDoS protection before you need it: which layers your provider absorbs, what triggers mitigation and whom to call. Arranging protection in the middle of an attack costs hours you do not have."

[[note]]
level = "professional"
topic = "Networking"
text = "Monitor every network path production depends on, including VPN tunnels, peering links and NAT gateways. These fail quietly, and a saturated NAT gateway or a dropped tunnel shows up as scattered timeouts across unrelated services."

[[note]]
level = "professional"
topic = "DNS"
text = "Monitor your authoritative DNS from several networks and check that the answers match what you expect. A broken delegation or a stale record at one provider fails for part of the internet while checks from inside your network pass."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Use vetted, high-level cryptography libraries, and have specialists review any new cryptographic design. Protocols built from correct primitives still fail in how they combine them, and ordinary testing rarely reveals it."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Avoid sharing one wildcard certificate's private key across many teams and servers. A leak from any of them exposes every subdomain, and replacing the certificate means a coordinated change everywhere at once."

[[note]]
level = "professional"
topic = "Testing"
text = "Keep a staging environment that matches production in versions, configuration and topology, or accept that it cannot catch configuration bugs. A staging stack with different load balancers, flags or data shapes passes changes that fail in production."

[[note]]
level = "professional"
topic = "CI"
text = "Separate the fast checks that gate every merge from slow suites that run on a schedule, and alert an owner when a scheduled run fails. Slow tests on every pull request stall the team, while unwatched nightly runs can fail for weeks unnoticed."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "On public repositories, require approval before workflows run for pull requests from first-time contributors. Otherwise any new account can open a pull request that runs its code on your CI, whether to mine cryptocurrency or to probe your setup."

[[note]]
level = "professional"
topic = "GitHub"
text = "Apply branch protection through organization-wide rulesets instead of configuring each repository by hand. Hand-configured protection is missing on whichever repositories nobody remembered, and those are the ones an attacker finds."

[[note]]
level = "professional"
topic = "Git"
text = "Integrate work into the main branch at least daily, hiding unfinished features behind flags, instead of keeping long-lived feature branches. Branches that live for weeks drift apart until merging them is a risky project of its own."

[[note]]
level = "professional"
topic = "Linux"
text = "Replace servers instead of patching them by hand: bake a new image and roll it out. Hand-maintained servers drift into unique snowflakes whose exact state nobody can rebuild after a failure."

[[note]]
level = "professional"
topic = "Shell"
text = "Have operational scripts log what they changed to a place that outlives the terminal session. When a script misbehaves in production, output that scrolled away is the only record of what it touched."

[[note]]
level = "professional"
topic = "Web"
text = "Control who can add third-party scripts to your site, including through tag managers. Each script runs with the same access as your own code, so it can read forms and change pages, which makes marketing tags part of your security boundary."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Include accessibility in your definition of done and your release checks, not in a later cleanup project. Retrofitting it after launch costs far more, and inaccessible products carry legal risk in many jurisdictions."

[[note]]
level = "professional"
topic = "Debugging"
text = "Allow core dumps on production hosts, with size limits, restricted access and a place to collect them. A crash that leaves no dump often has to happen again, maybe several times, before anyone understands it."

[[note]]
level = "professional"
topic = "Tooling"
text = "Give internal tools and scripts the same ownership as services: a named team, a repository and a way to report bugs. Unowned tools rot until the one that deploys or restores something fails in an emergency."

[[note]]
level = "professional"
topic = "Unicode"
text = "Decide how your product compares and sorts names, including case folding, accents and locale-aware collation, and apply the same rules in the database, search and application. Inconsistent rules create duplicate accounts and records that search cannot find."

[[note]]
level = "professional"
topic = "Performance"
text = "Give each user-facing request a latency budget and split it among the calls it makes. When a page must render in 300 ms through five sequential calls, every new dependency or retry has to fit inside that total."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Rebuild an old supported release from scratch on a schedule to prove you still can. Expired certificates, vanished packages and retired build images break old builds silently, and you find out when a customer needs a patch."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Track third-party code that no package manager sees, such as vendored libraries, copied source files and binaries checked into repositories. Vulnerability scanners report only what they can identify, so untracked copies stay unpatched."

[[note]]
level = "professional"
topic = "Security"
text = "Let support staff act as a customer only through an audited impersonation feature that records who did it and why. Shared support logins and direct database edits leave no trail, and they are an easy path for an insider or attacker."

[[note]]
level = "professional"
topic = "Security"
text = "Route security alerts, such as impossible logins or disabled audit logging, to an on-call rotation with runbooks, not to a shared inbox. Detection that nobody reads for days gives an intruder days."

[[note]]
level = "professional"
topic = "Databases"
text = "Correct production data through a reviewed, tested procedure with an audit trail, not with statements typed into a live console. Ad hoc fixes are how one typo turns a small data problem into a large one."

[[note]]
level = "professional"
topic = "Databases"
text = "Give each database a named owning team, even when several services read from it. A database that everyone uses and nobody owns misses upgrades, capacity planning and index cleanup until it fails."

[[note]]
level = "professional"
topic = "Cloud"
text = "Clean up non-production environments automatically, with an expiry on every temporary stack. Forgotten test environments keep costing money, and their stale software and open access become the easiest way in."

[[note]]
level = "professional"
topic = "Performance"
text = "Load test with realistic traffic mixes and data sizes, including cache misses and the expensive endpoints. A test that hammers one cached URL measures the cache, not the capacity of the system behind it."

[[note]]
level = "professional"
topic = "Teams"
text = "Write down the escalation path for every critical service: who to page, who may approve risky mitigations and who talks to customers. In the middle of an outage, nobody should be searching for who has authority."

[[note]]
level = "professional"
topic = "Releases"
text = "Automate the release process end to end, from version bump to publish, and run it the same way every time. Manual steps get skipped or done out of order under pressure, and the release that matters most is the one done in a hurry."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Check manifests and charts for deprecated API versions before every cluster upgrade. Once an API version is removed, applying those manifests fails outright, often in the middle of an urgent deploy."

[[note]]
level = "professional"
topic = "Code review"
text = "Review lockfile changes in pull requests, at least by checking which packages were added and which versions moved. A dependency swap or an unexpected new package hides easily inside a thousand-line lockfile diff."

[[note]]
level = "professional"
topic = "SQL"
text = "Give reporting and support staff read-only database roles, scoped to the tables they need, instead of the application's credentials. Shared application credentials let a mistyped query change production data, and the audit log cannot tell who ran it."
