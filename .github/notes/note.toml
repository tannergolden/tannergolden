# Note: something to know. A fact or concept that changes how you think about a tool or practice.
# 1,000 notes, 250 per level. Drawn by .github/scripts/notes.py; every note
# added makes the rotation longer. No en or em dashes: the script refuses them.

[[note]]
level = "beginner"
topic = "Git"
text = "For at least 30 days, `git reflog` keeps every commit your branch has pointed at, so work lost to a bad reset or rebase can usually be recovered: find it in the reflog and run `git branch rescue <sha>`."

[[note]]
level = "beginner"
topic = "Git"
text = "Git stores each commit as a snapshot of every tracked file, not as a list of changes; unchanged files are reused rather than copied, and diffs are computed only when you ask for one."

[[note]]
level = "beginner"
topic = "Git"
text = "`git add` stages a file as it is at that moment, so if you edit it again before committing, the commit gets the staged version, not your latest edit, until you run `git add` again."

[[note]]
level = "beginner"
topic = "Git"
text = "A Git branch is just a name that points to one commit and moves forward each time you commit on it, which is why creating a branch is instant and copies no files."

[[note]]
level = "beginner"
topic = "Git"
text = "`HEAD` is Git's name for the commit you currently have checked out; normally it points to a branch, and when it points straight at a commit instead, Git calls that a detached HEAD."

[[note]]
level = "beginner"
topic = "Git"
text = "A tag is a fixed name for one commit, such as `v1.0`: unlike a branch, it does not move when you make new commits, which is why tags are used to mark releases."

[[note]]
level = "beginner"
topic = "Git"
text = "Git merges edits to different parts of a file on its own; a merge conflict happens only when both sides changed the same lines, or lines directly next to each other."

[[note]]
level = "beginner"
topic = "Git"
text = "A commit's ID is a hash of its snapshot, parent commits, author, dates and message, so changing any of them, even rewording the message with `git commit --amend`, creates a new commit with a new ID."

[[note]]
level = "beginner"
topic = "Git"
text = "Git accepts any unambiguous prefix of a commit ID that is at least four characters long, so the short IDs printed by `git log --oneline` work wherever a full ID does."

[[note]]
level = "beginner"
topic = "Git"
text = "`origin` is just the name `git clone` gives the remote you cloned from, and you can rename it or add more remotes, though commands such as `git fetch` still fall back to `origin` when nothing else is configured."

[[note]]
level = "beginner"
topic = "Git"
text = "`git fetch` downloads new commits from a remote without touching your files or local branches, while `git pull` runs a fetch and then merges or rebases the result into your current branch."

[[note]]
level = "beginner"
topic = "Git"
text = "If a branch exists only on the remote, `git switch fix-login` creates a local `fix-login` branch that tracks `origin/fix-login`, so you can pick up a teammate's work in one step."

[[note]]
level = "beginner"
topic = "Git"
text = "By default `git log` lists only the commits reachable from `HEAD`, so work on other branches is missing from its output unless you name those branches or pass `--all`."

[[note]]
level = "beginner"
topic = "GitHub"
text = "A public GitHub repository with exactly the same name as your username is special: its README is shown at the top of your profile page, above your pinned repositories."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Forking and cloning are different: a fork copies a repository into your GitHub account, on GitHub's servers, while `git clone` copies a repository onto your machine, and the two are often used together."

[[note]]
level = "beginner"
topic = "Git"
text = "Git does not record renames; it stores the new snapshot and detects a rename afterward by comparing file contents, which is why `git log --follow` can trace one file across renames."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Starring a GitHub repository bookmarks it and shows appreciation, while Watching is what subscribes you to its notifications, so you can star projects without flooding your inbox."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Commits count on your GitHub contribution graph only once they reach a repository's default branch or its `gh-pages` branch, and not while they sit in a fork, so unmerged work does not show yet."

[[note]]
level = "beginner"
topic = "Git"
text = "`git revert` undoes a commit by adding a new commit with the opposite changes, so history stays intact, whereas `git reset` moves the branch back so later commits drop out of it."

[[note]]
level = "beginner"
topic = "Git"
text = "A commit exists only in your local repository until you `git push` it; before that nobody else can see it, and it is not backed up anywhere except your own disk."

[[note]]
level = "beginner"
topic = "Shell"
text = "Every command finishes with an exit status: `0` means success and any other number means failure, and `$?` holds the status of the command that just finished."

[[note]]
level = "beginner"
topic = "Shell"
text = "Bash arithmetic works only with whole numbers: `$((7 / 2))` gives `3` because the remainder is dropped, and `$((1.5 + 1))` is a syntax error. Tools such as `awk` and `bc` handle decimals."

[[note]]
level = "beginner"
topic = "Shell"
text = "Inside double quotes the shell still expands `$VAR` and `$(command)`, but inside single quotes nothing is expanded, so `echo '$HOME'` prints the literal text `$HOME`."

[[note]]
level = "beginner"
topic = "Shell"
text = "Inside a script, `$1`, `$2` and so on hold the arguments it was started with, `$#` holds how many there are, and `$0` holds the name that was used to run the script."

[[note]]
level = "beginner"
topic = "Shell"
text = "Many commands, such as `cat`, `sort` or `grep pattern`, read standard input when you give them no file name, so in a terminal they sit waiting for you to type, which looks like a hang."

[[note]]
level = "beginner"
topic = "Linux"
text = "`wc -l` counts newline characters rather than lines, so a file whose last line has no newline at the end reports one line fewer than your editor shows."

[[note]]
level = "beginner"
topic = "Shell"
text = "`>` replaces a file's contents with a command's output, while `>>` appends to the end; both create the file first if it does not exist."

[[note]]
level = "beginner"
topic = "Shell"
text = "`>` redirects only standard output; error messages travel on a separate stream, standard error, so they still reach the screen unless you redirect them too with `2>`."

[[note]]
level = "beginner"
topic = "Shell"
text = "A pipe `|` feeds one command's standard output into the next command's standard input, which is how small tools like `grep`, `sort` and `wc` combine into bigger jobs."

[[note]]
level = "beginner"
topic = "Shell"
text = "For a command that is not built into the shell, Bash searches the directories in `PATH` from left to right and runs the first match; `type name` shows what a name resolves to."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Running `make` with no target builds the first target in the Makefile, not counting special ones like `.PHONY`, which is why projects usually put `all` or `help` at the top."

[[note]]
level = "beginner"
topic = "Tooling"
text = "A formatter changes only layout, such as spacing and line breaks, and never what the code does, while a linter reports likely bugs and risky patterns; most projects run one of each."

[[note]]
level = "beginner"
topic = "Shell"
text = "A script runs in a child process, so a `cd` or variable it sets disappears when it ends; `source script.sh` runs it in your current shell instead, so those changes stay."

[[note]]
level = "beginner"
topic = "Regex"
text = "In a regex, `^` at the start of a pattern anchors the match to the beginning of the text, but as the first character inside square brackets it negates the set, so `[^0-9]` matches any character that is not a digit."

[[note]]
level = "beginner"
topic = "Regex"
text = "Curly braces set repetition counts in a regex: `[0-9]{3}` matches exactly three digits, `{2,4}` means two to four and `{2,}` means two or more of the item just before the brace."

[[note]]
level = "beginner"
topic = "Shell"
text = "`Ctrl+C` interrupts the running program, while `Ctrl+D` on an empty line sends end of input, which is why it exits the Python prompt or closes a shell."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Every plain ASCII file is already valid UTF-8, because UTF-8 stores the first 128 characters as the same single bytes ASCII uses; that backward compatibility is a big part of why UTF-8 became the default."

[[note]]
level = "beginner"
topic = "Unicode"
text = "An empty box in place of a character, sometimes called tofu, usually means the font has no glyph for it, not that the text is corrupt; the character is still there and appears in a font that covers it."

[[note]]
level = "beginner"
topic = "Shell"
text = "`$(command)` is replaced by that command's output before the line runs, so `echo \"Today is $(date +%A)\"` prints the name of the current weekday."

[[note]]
level = "beginner"
topic = "Time"
text = "A year is a leap year if it divides by 4, except century years, which must also divide by 400: 2000 was a leap year, while 1900 and 2100 are not. A bare `year % 4 == 0` check gets 2100 wrong."

[[note]]
level = "beginner"
topic = "Linux"
text = "Linux has a single directory tree starting at `/`; extra disks and USB drives are attached (mounted) at a folder inside it, such as under `/mnt` or `/media`, instead of getting drive letters."

[[note]]
level = "beginner"
topic = "Linux"
text = "In `ls -l` output, a permission string like `rwxr-xr--` lists read, write and execute rights for the file's owner, its group and everyone else, in that order."

[[note]]
level = "beginner"
topic = "Linux"
text = "In `chmod 755`, each digit is a sum of read (4), write (2) and execute (1) for owner, group and others, so 755 means `rwx` for the owner and `r-x` for everyone else."

[[note]]
level = "beginner"
topic = "Linux"
text = "On a directory, execute permission is the right to enter it and reach the files inside; without it you cannot `cd` into the directory, even if you can list the names it contains."

[[note]]
level = "beginner"
topic = "Time"
text = "Not every time zone is a whole number of hours away from UTC: India uses +05:30 and Nepal +05:45, so code that stores offsets as whole hours gets their local times wrong."

[[note]]
level = "beginner"
topic = "Linux"
text = "Linux does not use file extensions to decide how to run a file; the execute permission and the file's contents, such as its shebang line, decide, so `.sh` is only a naming convention."

[[note]]
level = "beginner"
topic = "CI"
text = "Continuous integration means merging small changes into the shared branch often, with an automated build and test run for each one, so a problem shows up while the change that caused it is still small and fresh in mind."

[[note]]
level = "beginner"
topic = "Linux"
text = "Files whose names begin with a dot, like `.bashrc` or `.gitignore`, are hidden only by convention: `ls` skips them unless you pass `-a`, but they are ordinary files."

[[note]]
level = "beginner"
topic = "CI"
text = "Continuous delivery keeps every change that passes the pipeline ready to release at any moment; continuous deployment goes one step further and releases each passing change to users automatically."

[[note]]
level = "beginner"
topic = "Linux"
text = "A symbolic link is a small file that stores the path of another file; if that target is moved or deleted, the link stays behind but points at nothing."

[[note]]
level = "beginner"
topic = "Linux"
text = "Linux exposes much of the system as files: devices appear under `/dev` and details of running processes under `/proc`, and anything written to `/dev/null` is simply discarded."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "In a GitHub Actions step, `uses:` runs a ready-made action, usually one someone else published, referenced as `owner/repo@version`, while `run:` runs your own shell commands on the runner."

[[note]]
level = "beginner"
topic = "Linux"
text = "Most commands, like `ls` and `grep`, are separate programs stored in folders such as `/usr/bin`, while a few, like `cd` and `export`, are built into the shell because they change the shell's own state."

[[note]]
level = "beginner"
topic = "Linux"
text = "A path starting with `/` is absolute and means the same thing from any directory; any other path, like `src/app.py` or `../notes`, is resolved from your current directory."

[[note]]
level = "beginner"
topic = "Linux"
text = "Every directory contains two special entries, `.` for itself and `..` for its parent, which is why `cd ..` moves up a level and `./run.sh` names the file in the current folder."

[[note]]
level = "beginner"
topic = "Linux"
text = "Linux distributions install software through a package manager, such as `apt` on Debian and Ubuntu or `dnf` on Fedora, which also resolves dependencies and applies updates."

[[note]]
level = "beginner"
topic = "Python"
text = "Python's `int()` drops the fractional part instead of rounding: `int(3.9)` is `3` and `int(-3.9)` is `-3`. Use `round()` for the nearest whole number, or `math.floor()` to always round down."

[[note]]
level = "beginner"
topic = "Python"
text = "Python allows chained comparisons: `0 < x < 10` means `0 < x and x < 10`, with `x` evaluated only once, so a range check reads the way you would write it in math."

[[note]]
level = "beginner"
topic = "Python"
text = "In Python 3, `/` always produces a float, so `6 / 3` is `2.0`, while `//` divides and rounds down, so `7 // 2` is `3`. Use `//` on integers when you need an integer result, such as a list index."

[[note]]
level = "beginner"
topic = "Python"
text = "Lists can't be dictionary keys or set members because they can change after creation; Python raises `TypeError: unhashable type: 'list'`. A tuple of immutable values works as a key instead."

[[note]]
level = "beginner"
topic = "Python"
text = "Python uses indentation to mark blocks, so it is part of the syntax rather than style; a line indented differently from the rest of its block raises `IndentationError`."

[[note]]
level = "beginner"
topic = "Python"
text = "`range(5)` yields 0 through 4, and slices follow the same rule: `s[1:4]` includes index 1 but stops before index 4, so it holds three items."

[[note]]
level = "beginner"
topic = "Python"
text = "Python strings are immutable: methods like `s.upper()` and `s.replace()` return a new string and leave `s` unchanged, so the result has to be assigned somewhere."

[[note]]
level = "beginner"
topic = "Java"
text = "Java spells length three ways: an array has a `length` field (`arr.length`), a `String` has a `length()` method, and a collection such as an `ArrayList` has a `size()` method."

[[note]]
level = "beginner"
topic = "Python"
text = "In Python, `0`, `None`, `\"\"` and empty containers like `[]` and `{}` count as false in an `if`, so `if items:` is a check that a list is not empty."

[[note]]
level = "beginner"
topic = "Java"
text = "Java collections hold only objects, not primitives, so you write `List<Integer>` rather than `List<int>`; Java converts between `int` and `Integer` automatically as you add and read values."

[[note]]
level = "beginner"
topic = "Java"
text = "Java refuses to compile code that reads a local variable before assigning it, reporting that it might not have been initialized; fields, by contrast, start at `0`, `false` or `null`."

[[note]]
level = "beginner"
topic = "Python"
text = "`(1)` is just the number 1 in parentheses; a one-element tuple needs a trailing comma, `(1,)`, because the comma, not the parentheses, is what makes a tuple."

[[note]]
level = "beginner"
topic = "Java"
text = "Declaring a variable `final` in Java stops you from assigning it again, not from changing the object it refers to: after `final List<String> names = new ArrayList<>();`, `names.add(\"x\")` still works."

[[note]]
level = "beginner"
topic = "Python"
text = "Python integers have no fixed size, so `2 ** 100` is computed exactly, unlike C or Java, where integer types have a fixed width and overflow."

[[note]]
level = "beginner"
topic = "Java"
text = "Java always passes arguments by value, and for an object that value is a reference: a method can change the object you pass in, but assigning a new object to its parameter leaves your variable alone."

[[note]]
level = "beginner"
topic = "Python"
text = "`list.copy()` makes a shallow copy: the new outer list is independent, but any lists nested inside it are still shared with the original."

[[note]]
level = "beginner"
topic = "Python"
text = "In Python, `and` and `or` return one of their operands rather than `True` or `False`, so `name or \"guest\"` evaluates to `\"guest\"` when `name` is empty."

[[note]]
level = "beginner"
topic = "Go"
text = "Go has only one loop keyword, `for`: `for i := 0; i < n; i++` counts, `for x < 10` works like a while loop, and a bare `for` repeats until a `break` or `return`."

[[note]]
level = "beginner"
topic = "Go"
text = "Go never converts between numeric types on its own: adding an `int` variable to a `float64` variable is a compile error, so you write the conversion yourself, as in `float64(n) * price`."

[[note]]
level = "beginner"
topic = "Python"
text = "Python caches compiled bytecode as `.pyc` files in `__pycache__` folders; they are rebuilt automatically whenever the source changes, so they are safe to delete and are usually left out of Git."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "JavaScript strings are immutable: `toUpperCase()`, `trim()` and `replace()` all return a new string and leave the original untouched, and assigning to `str[0]` is ignored, or throws in strict mode."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`typeof` returns `\"object\"` for arrays just as for plain objects, so it cannot tell them apart; `Array.isArray(value)` is the reliable test for an array."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "JavaScript's `number` type is a 64-bit float, so integers are exact only up to `Number.MAX_SAFE_INTEGER` (2^53 - 1); beyond that, `BigInt` keeps them exact."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Scripts in `package.json` run with the project's `node_modules/.bin` folder added to the `PATH`, so a script can call a tool installed as a dependency, such as `eslint`, without a global install."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "When you import a package written in plain JavaScript, TypeScript looks for its types in a separate `@types/<name>` package, such as `@types/express`, which the community maintains for many libraries."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "A tuple type like `[string, number]` fixes both the length and the type at each position, so a function can return two different kinds of value in one array and callers still get exact types."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "TypeScript adds type syntax on top of JavaScript, so a project can switch over one file at a time: with `allowJs` enabled, `.ts` and `.js` files import each other in the same build."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`fetch()` returns a Promise right away instead of the response, so code that needs the data must `await` it or pass a callback to `.then()`."

[[note]]
level = "beginner"
topic = "Web"
text = "`event.preventDefault()` stops the browser's built-in action, such as following a link or submitting a form, while `event.stopPropagation()` only stops the event from reaching parent elements."

[[note]]
level = "beginner"
topic = "Web"
text = "Vertical margins between block elements collapse: a 20px bottom margin above a 30px top margin leaves a 30px gap, not 50px, while items inside a flex or grid container keep both margins."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`+` concatenates when either side is a string, so `\"5\" + 1` is `\"51\"`, but `-` always converts to numbers, so `\"5\" - 1` is `4`."

[[note]]
level = "beginner"
topic = "Web"
text = "`sessionStorage` belongs to a single browser tab and is cleared when that tab closes, while `localStorage` is shared by every tab from the same origin and survives browser restarts."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`parseInt(\"42px\")` returns `42` because it stops reading at the first non-digit, while `Number(\"42px\")` returns `NaN` because the whole string must be numeric."

[[note]]
level = "beginner"
topic = "Web"
text = "Every browser applies a default stylesheet, which is why a page with no CSS of its own still has a margin around `body`, bold headings and indented lists; resets and normalize stylesheets remove or even out those defaults."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Function declarations are hoisted, so a `function greet() {}` can be called above the line where it is written, but a function stored in a `const` cannot."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`array.map()` returns a new array built from the callback's results, while `forEach()` always returns `undefined`, so it is only useful for side effects."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Node.js runs JavaScript outside the browser, so browser objects like `window` and `document` do not exist there, while Node adds its own, such as `process`."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "A JavaScript function keeps access to the variables in scope where it was created, even after the outer function has returned; this is called a closure."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "WCAG, the guidelines most accessibility laws refer to, groups its requirements under four principles: content must be perceivable, operable, understandable and robust."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`value ?? fallback` uses the fallback only when `value` is `null` or `undefined`, while `value || fallback` also replaces `0`, `\"\"` and `false`."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "TypeScript's types are erased when it compiles to JavaScript, so they catch mistakes before the program runs but do not check data that arrives at runtime, such as a parsed JSON response."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "TypeScript infers types from values, so `let count = 0` already has type `number` without an annotation, and assigning a string to it later is an error."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Accessibility work helps far more people than those with permanent disabilities: captions help someone on a noisy train, and full keyboard support helps a user with a broken wrist."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Elements such as `<header>`, `<nav>`, `<main>` and `<footer>` create landmarks that screen reader users can jump between directly, which a page built only from `<div>` elements does not offer."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "TypeScript compares object types by shape: an object that has every property an interface requires counts as that interface, even though it never declares that it implements it."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "For a value of type `string | number`, TypeScript allows only operations valid for both types until a check such as `typeof value === \"string\"` narrows it down."

[[note]]
level = "beginner"
topic = "Go"
text = "A Go program starts in `func main()` in package `main`; a package with any other name builds a library that other packages import, and `go run` refuses to run it."

[[note]]
level = "beginner"
topic = "Go"
text = "Go has no classes: you attach methods to a type with a receiver, as in `func (p Point) Dist() float64`, and a type satisfies an interface just by having its methods, with no `implements` keyword."

[[note]]
level = "beginner"
topic = "Go"
text = "In Go, capitalization controls visibility: a name that starts with an uppercase letter, like `fmt.Println`, is exported from its package, and a lowercase one is private to it."

[[note]]
level = "beginner"
topic = "Go"
text = "Go variables declared without a value start at their type's zero value: `0` for numbers, `\"\"` for strings, `false` for booleans and `nil` for pointers, slices and maps."

[[note]]
level = "beginner"
topic = "Go"
text = "In Go, `:=` declares a new variable and assigns it in one step, while `=` only assigns to a variable that already exists."

[[note]]
level = "beginner"
topic = "Rust"
text = "Rust variables are immutable by default, so after `let x = 5;` the compiler rejects `x = 6;` until you declare the variable as `let mut x`."

[[note]]
level = "beginner"
topic = "Rust"
text = "Rust has no null value; something that may be absent has type `Option<T>`, which is either `Some(value)` or `None`, and the compiler makes you handle both cases."

[[note]]
level = "beginner"
topic = "Rust"
text = "Rust lets you declare a new variable with an existing name, as in `let x = x + 1;`, which shadows the old one; unlike `mut`, shadowing can also change the type, as in `let spaces = spaces.len();`."

[[note]]
level = "beginner"
topic = "Rust"
text = "Rust has two main string types: `String` owns its text and can grow, while `&str` borrows text stored elsewhere. String literals like `\"hi\"` are `&str`, and `.to_string()` makes an owned copy."

[[note]]
level = "beginner"
topic = "Rust"
text = "A Rust block's last expression, written without a semicolon, is the block's value, so a function can end with `a + b`. Adding a semicolon makes it a statement whose value is `()`, and a function declared to return a number stops compiling."

[[note]]
level = "beginner"
topic = "Rust"
text = "A Rust `match` must cover every possible value, so forgetting an enum variant is a compile error rather than a runtime bug; a `_` arm handles all the remaining cases."

[[note]]
level = "beginner"
topic = "Java"
text = "Java's `int` is a 32-bit type that wraps on overflow without any error, so `Integer.MAX_VALUE + 1` equals `Integer.MIN_VALUE`."

[[note]]
level = "beginner"
topic = "Java"
text = "Java makes you handle checked exceptions such as `IOException` at compile time, by catching them or declaring them with `throws`, while unchecked ones like `NullPointerException` need neither."

[[note]]
level = "beginner"
topic = "Java"
text = "Java source compiles to bytecode in `.class` files that the Java Virtual Machine runs, so the same compiled program runs on any operating system with a compatible JVM."

[[note]]
level = "beginner"
topic = "Java"
text = "In Java, `'A' + 1` is the `int` 66, not the character `'B'`, because arithmetic promotes a `char` to its numeric code; a cast, `(char) ('A' + 1)`, turns it back."

[[note]]
level = "beginner"
topic = "C"
text = "C strings are arrays of characters that end with a zero byte (`'\\0'`), so `strlen` has to scan the whole string to find its length, and a missing terminator makes it read past the end."

[[note]]
level = "beginner"
topic = "C"
text = "Dividing two integers in C discards the fraction: `7 / 2` is `3` and `1 / 3` is `0`. Make one operand floating point, as in `7 / 2.0`, to get `3.5`."

[[note]]
level = "beginner"
topic = "C"
text = "Local variables in C are not initialized for you: until you assign one, its value is indeterminate, whatever happened to be in that memory, and using it is a bug."

[[note]]
level = "beginner"
topic = "C"
text = "The C standard fixes no size for `int`, only a minimum of 16 bits, though it is 32 bits on common desktop systems. When the exact width matters, use `<stdint.h>` types such as `int32_t` or `uint8_t`."

[[note]]
level = "beginner"
topic = "C"
text = "The value `main` returns becomes your program's exit status: `0` or `EXIT_SUCCESS` tells the shell or a calling script that it succeeded, and a nonzero value such as `EXIT_FAILURE` signals failure."

[[note]]
level = "beginner"
topic = "C"
text = "`#include <stdio.h>` pastes that header's text into your file before compiling. The header only declares functions like `printf`; the linker takes their compiled code from the C library."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "A workflow file with a YAML mistake, such as a wrong indent, does not run at all: GitHub lists the run in the Actions tab with the error and the line it found it on, and no job starts."

[[note]]
level = "beginner"
topic = "SQL"
text = "In PostgreSQL and MySQL, a column alias defined in `SELECT`, such as `price * qty AS total`, cannot be used in `WHERE`, which is evaluated first. Repeat the expression there; `ORDER BY total` does work."

[[note]]
level = "beginner"
topic = "SQL"
text = "Without `ORDER BY`, a SQL query returns rows in no guaranteed order; they may come back in insertion order today and in a different order after the data or the query plan changes."

[[note]]
level = "beginner"
topic = "SQL"
text = "SQL keywords are case-insensitive, so `SELECT` and `select` are the same, but whether `'a' = 'A'` is true depends on the database and the column's collation."

[[note]]
level = "beginner"
topic = "SQL"
text = "In standard SQL, single quotes delimit strings (`'text'`) and double quotes delimit identifiers such as column names, though some databases, such as MySQL, also accept double-quoted strings by default."

[[note]]
level = "beginner"
topic = "SQL"
text = "Aggregate functions skip `NULL`: `COUNT(email)` counts only rows that have an email and `AVG(score)` averages only rows with a score, while `COUNT(*)` counts every row."

[[note]]
level = "beginner"
topic = "SQL"
text = "Joining `customers` to `orders` returns one row per matching pair, so a customer with three orders appears three times, with that customer's columns repeated on each row."

[[note]]
level = "beginner"
topic = "Databases"
text = "Deleting rows from SQLite does not shrink the database file: the freed pages stay inside it for later inserts to reuse, and only `VACUUM` rebuilds the file and hands the space back."

[[note]]
level = "beginner"
topic = "SQL"
text = "In `LIKE` patterns, `%` matches any run of characters, including none, and `_` matches exactly one, so `'a%'` finds every value that starts with `a`."

[[note]]
level = "beginner"
topic = "Databases"
text = "A relational database checks every row against a schema of tables, columns and types defined in advance, while document stores such as MongoDB accept records of any shape and leave that checking to your code."

[[note]]
level = "beginner"
topic = "SQL"
text = "`LIMIT` is not part of standard SQL: PostgreSQL, MySQL and SQLite support it, SQL Server uses `TOP`, and the standard's own spelling is `FETCH FIRST n ROWS ONLY`."

[[note]]
level = "beginner"
topic = "Databases"
text = "Redis keeps its whole dataset in memory, so reads and writes are very fast but the data must fit in RAM. It usually sits beside a main database as a cache, queue or session store rather than replacing it."

[[note]]
level = "beginner"
topic = "Databases"
text = "SQLite keeps an entire database in one ordinary file and runs inside your program as a library, so there is no separate database server to install or start."

[[note]]
level = "beginner"
topic = "Data"
text = "One extreme value can drag an average far from the typical case: salaries of 30,000, 35,000, 40,000 and 10 million average over 2.5 million, while the median, the middle value, is 37,500."

[[note]]
level = "beginner"
topic = "Databases"
text = "A transaction makes several statements succeed or fail as a unit: `COMMIT` keeps all of their changes, and `ROLLBACK` or a crash before the commit leaves none of them."

[[note]]
level = "beginner"
topic = "Data"
text = "In CSV, a field containing a comma or a line break is wrapped in quotes, and any quote character inside that field is written twice, so `\"say \"\"hi\"\", then go\"` is one field."

[[note]]
level = "beginner"
topic = "HTTP"
text = "HTTP status codes are grouped by their first digit: 2xx means success, 3xx a redirect, 4xx a problem with the request and 5xx a failure on the server."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Phones ship with screen readers, VoiceOver on iOS and TalkBack on Android, which read each element aloud as the user swipes, so mobile pages need the same labels and structure as desktop ones."

[[note]]
level = "beginner"
topic = "HTTP"
text = "A `404 Not Found` does not prove that a page never existed; some sites answer 404 instead of 403 on purpose so they do not reveal that a private resource is there."

[[note]]
level = "beginner"
topic = "HTTP"
text = "HTTP is stateless: each request stands on its own, and a login seems to persist only because the browser sends a cookie or token with every request."

[[note]]
level = "beginner"
topic = "HTTP"
text = "`GET` requests are meant only to read: browsers, caches and link previewers may repeat or prefetch them, so actions that change data belong in `POST`, `PUT` or `DELETE`."

[[note]]
level = "beginner"
topic = "HTTP"
text = "HTTP Basic authentication sends the username and password only base64-encoded, which anyone who sees the request can decode, so it is safe to use only over HTTPS."

[[note]]
level = "beginner"
topic = "HTTP"
text = "The `Content-Type` header tells the receiver how to interpret a body, such as `application/json` or `text/html`; with the wrong value, a server may reject perfectly valid data."

[[note]]
level = "beginner"
topic = "HTTP"
text = "The `Accept` request header tells the server which formats the client can handle, such as `application/json`, and some servers answer with HTML or XML unless the client asks for JSON."

[[note]]
level = "beginner"
topic = "HTTP"
text = "A `500 Internal Server Error` says only that the server failed while handling the request; the actual cause is in the server's logs, not in anything the browser can show."

[[note]]
level = "beginner"
topic = "HTTP"
text = "A redirect response carries the new address in its `Location` header; browsers follow it automatically, but `curl` does not unless you pass `-L`."

[[note]]
level = "beginner"
topic = "APIs"
text = "JSON has only six kinds of values: strings, numbers, booleans, `null`, arrays and objects, so dates, binary data and very large integers travel as strings or numbers by convention."

[[note]]
level = "beginner"
topic = "APIs"
text = "In a REST API, the URL names a resource and the HTTP method says what to do with it, so `GET /users/42` reads a user, `PATCH /users/42` changes it and `DELETE /users/42` removes it."

[[note]]
level = "beginner"
topic = "APIs"
text = "A webhook reverses the usual direction of an API: instead of your code polling for changes, the service sends an HTTP request to a URL you registered whenever something happens."

[[note]]
level = "beginner"
topic = "APIs"
text = "Many APIs return long lists one page at a time, so a single request brings back only the first batch; the response includes a cursor, link or page number for fetching the next one."

[[note]]
level = "beginner"
topic = "Web"
text = "View Source shows the HTML the server sent, while the Elements or Inspector panel in developer tools shows the live page after JavaScript has changed it, and the two can differ a lot."

[[note]]
level = "beginner"
topic = "Web"
text = "A `<script>` in the `<head>` runs before the rest of the page is parsed, so code that looks up elements finds nothing unless the script uses `defer` or waits for `DOMContentLoaded`."

[[note]]
level = "beginner"
topic = "Web"
text = "In CSS, when two rules set the same property on an element, the more specific selector wins, and between equally specific rules the one that comes later wins."

[[note]]
level = "beginner"
topic = "Containers"
text = "`docker run` downloads an image only when it is not already on your machine; after that it reuses the local copy, so a newer image pushed under the same tag is not used until you run `docker pull`."

[[note]]
level = "beginner"
topic = "Web"
text = "A CORS error is enforced by the browser, not the server: the request may well have reached the server, but the browser withholds the response because the server did not allow your page's origin."

[[note]]
level = "beginner"
topic = "Web"
text = "HTML collapses whitespace by default: several spaces or line breaks in the source render as a single space, so visual spacing has to come from CSS, not from how the markup is laid out."

[[note]]
level = "beginner"
topic = "Containers"
text = "On macOS, Docker Desktop runs your Linux containers inside a small Linux virtual machine, which is why folders you bind-mount from your Mac are noticeably slower there than on a Linux host."

[[note]]
level = "beginner"
topic = "Web"
text = "Relative paths in HTML resolve against the page's own address, so `images/logo.png` breaks on a page inside a subfolder, while `/images/logo.png` always starts from the site root."

[[note]]
level = "beginner"
topic = "Code review"
text = "A GitHub pull request has four tabs: Conversation for the discussion, Commits for each commit, Checks for CI results and Files changed for the diff you actually review."

[[note]]
level = "beginner"
topic = "Containers"
text = "An image name with no registry in front, such as `redis:7`, is pulled from Docker Hub, and a name with no tag, such as plain `redis`, means the tag `latest`."

[[note]]
level = "beginner"
topic = "Code review"
text = "A GitHub review ends as Comment, Approve or Request changes: a comment gives feedback without a verdict, while the other two say whether the reviewer thinks the change should merge as it is."

[[note]]
level = "beginner"
topic = "Kubernetes"
text = "Kubernetes spreads containers across a group of machines called a cluster, picking a machine for each based on the CPU and memory it asks for, and starts replacements on other machines when one fails."

[[note]]
level = "beginner"
topic = "Code review"
text = "In a diff, lines starting with `-` were removed and lines starting with `+` were added; unchanged lines around them are context, and a header like `@@ -12,7 +12,9 @@` gives the line numbers."

[[note]]
level = "beginner"
topic = "Data"
text = "Percentage changes do not cancel out: a price that drops 50% must rise 100% to get back to where it was, and a 10% gain followed by a 10% loss leaves you 1% below the start."

[[note]]
level = "beginner"
topic = "Kubernetes"
text = "The smallest thing Kubernetes runs is a pod: one or more containers that share an IP address and storage volumes and always run together on the same machine."

[[note]]
level = "beginner"
topic = "Security"
text = "Deleting a password from a file in a new commit does not remove it from Git history; anyone with a copy of the repository can still read it in the earlier commit."

[[note]]
level = "beginner"
topic = "Security"
text = "Everything sent to the browser, including JavaScript source and any API key inside it, can be read by the person using the page, so secrets have to stay on the server."

[[note]]
level = "beginner"
topic = "Security"
text = "Checks in the browser only improve the user experience: anyone can send requests straight to your server, bypassing your form, so the server has to validate every input again."

[[note]]
level = "beginner"
topic = "Security"
text = "After you log in, a site recognizes you by a session cookie, so anyone who steals that cookie, through malware or a malicious browser extension, is signed in as you without your password or two-factor code."

[[note]]
level = "beginner"
topic = "Security"
text = "The browser padlock means the connection is encrypted and the certificate matches the domain; it says nothing about whether the site itself is honest."

[[note]]
level = "beginner"
topic = "Security"
text = "A password's strength comes mostly from its length and randomness: four or five words picked at random make a passphrase that is easier to remember and far harder to guess than a short one like `P@ssw0rd1`."

[[note]]
level = "beginner"
topic = "Security"
text = "Python's `random` module is predictable by design, which suits games and simulations, while passwords and tokens need the `secrets` module, which draws on the operating system's secure source."

[[note]]
level = "beginner"
topic = "Security"
text = "A `.env` file keeps secrets out of your code only by convention: Git does not ignore it unless an ignore rule, usually a line in `.gitignore`, says so, which is how new projects end up committing one by accident."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "Hashing is not encryption: a proper password hash cannot be turned back into the password, so a site that can email you your current password is storing it in a recoverable form."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "A cryptographic hash such as SHA-256 turns any input into a fixed-size fingerprint, and changing a single character of the input produces a completely different hash."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "The six-digit codes in an authenticator app are computed from a secret shared once, usually through a QR code, and the current time, so they work offline and change every 30 seconds."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "An SSH key pair has a private key that never leaves your machine and a public key you can share freely; a server holding the public key can verify you without ever seeing the private one."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "MD5 and SHA-1 are broken as security hashes: attackers can craft two different files with the same hash. They still catch accidental corruption, but use SHA-256 or stronger when a hash has to stop tampering."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "HTTPS encrypts data only between your device and the server, which can read everything you send. End-to-end encryption keeps the keys on the users' devices, so even the company running the servers cannot read the messages."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Installing one package usually installs many, because each dependency brings dependencies of its own; these indirect packages are called transitive dependencies."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "Public package registries accept uploads from anyone, and no one reviews the code before it goes live. Being installable with one command says nothing about whether a package is safe, or even whether it works."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Python ships a large standard library: `json`, `csv`, `datetime` and `urllib.parse` cover tasks people often install packages for, so check the built-in modules before adding a dependency."

[[note]]
level = "beginner"
topic = "Versioning"
text = "A commit hash names exact code but says nothing about order, which is why projects also publish version numbers: `1.4.0` is clearly newer than `1.3.9`, while `3f9a1c2` and `b07e4d1` cannot be compared by eye."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Not every project uses semantic versioning. Calendar versioning uses dates instead: Ubuntu `24.04` came out in April 2024, and such a number tells you when a release was made, not how much it changed."

[[note]]
level = "beginner"
topic = "Releases"
text = "An LTS (long-term support) release keeps getting security fixes for years, while the releases between LTS versions are supported only briefly. Node.js, for example, gives LTS status only to even-numbered major versions."

[[note]]
level = "beginner"
topic = "Versioning"
text = "In npm version ranges, `^1.2.3` accepts any `1.x.x` release from 1.2.3 up, while `~1.2.3` accepts only `1.2.x` patch releases."

[[note]]
level = "beginner"
topic = "Networking"
text = "Network speeds are quoted in bits per second but file sizes in bytes, and a byte is 8 bits, so a 100 Mbit/s connection moves at most about 12.5 megabytes per second."

[[note]]
level = "beginner"
topic = "DNS"
text = "A `TXT` record holds free-form text, and services use it to check that you control a domain: they give you a value to publish, then look it up before trusting the domain."

[[note]]
level = "beginner"
topic = "Observability"
text = "Logs, metrics and traces answer different questions: a log line records one event, a metric tracks a number such as requests per second over time, and a trace shows how long each step of a single request took, across services."

[[note]]
level = "beginner"
topic = "Incidents"
text = "Many outages involve no code change at all: an expired domain or TLS certificate, a full disk or a used-up quota can take down an app that has not been touched in months."

[[note]]
level = "beginner"
topic = "Incidents"
text = "When one shared piece fails, such as the database or the login service, every feature that depends on it fails too, so an outage often shows many different errors with a single cause."

[[note]]
level = "beginner"
topic = "Debugging"
text = "When a compiler or interpreter reports many errors at once, the first one is usually the real problem; the rest are often side effects of the parser losing its place."

[[note]]
level = "beginner"
topic = "Debugging"
text = "An error's line number is where the problem was detected, which can be well after the actual mistake, as when a missing closing brace in JavaScript or C is reported at the end of the file."

[[note]]
level = "beginner"
topic = "Debugging"
text = "`NullPointerException` in Java, `Cannot read properties of undefined` in JavaScript and `'NoneType' object has no attribute` in Python are the same bug: a value you expected was missing."

[[note]]
level = "beginner"
topic = "Architecture"
text = "A single point of failure is any one part whose loss stops the whole system, such as the only server, the only database or the one person who knows the deploy password."

[[note]]
level = "beginner"
topic = "Testing"
text = "The test pyramid describes a healthy mix: many fast unit tests, fewer integration tests and a handful of end-to-end tests, because tests get slower and more fragile as they cover more of the system."

[[note]]
level = "beginner"
topic = "Testing"
text = "Test runners report failure through a non-zero exit code, which is how CI and scripts know a run failed; a wrapper script that ignores that code can report success after tests failed."

[[note]]
level = "beginner"
topic = "Debugging"
text = "A segmentation fault means a program touched memory it may not access, usually through a bad pointer or an out-of-range index, and the operating system stopped it."

[[note]]
level = "beginner"
topic = "Debugging"
text = "In a browser, JavaScript errors appear in the developer tools console rather than on the page, so a blank or half-working page often has an error message waiting there."

[[note]]
level = "beginner"
topic = "Kubernetes"
text = "Kubernetes is declarative: you describe the state you want in a manifest, such as three running copies of an app, and its controllers keep working until the cluster matches that description."

[[note]]
level = "beginner"
topic = "CI"
text = "When CI fails but your own machine passes, the difference is often something your laptop has and the repository lacks, such as an uncommitted file, a globally installed tool or an environment variable."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "GitHub Actions workflows are YAML files in `.github/workflows/`, and GitHub runs each one automatically on the events listed under its `on:` key, such as `push` or `pull_request`."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Each job in a GitHub Actions workflow normally starts on a fresh virtual machine that holds none of your files, which is why jobs begin by checking out the repository and why nothing carries over from one job to the next."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Git is the version control tool that runs on your own machine, while GitHub is a hosting service built around it, so Git works fully offline and with any other host."

[[note]]
level = "beginner"
topic = "GitHub"
text = "A GitHub pull request lives on GitHub, not in your repository: it is a page proposing to merge one branch into another, where people review, discuss and test the change before it lands."

[[note]]
level = "beginner"
topic = "Teams"
text = "The XY problem is asking for help with your attempted fix (Y) instead of your actual goal (X); stating the goal first often reveals a simpler route than the one you were stuck on."

[[note]]
level = "beginner"
topic = "Teams"
text = "Impostor syndrome, the feeling of being a fraud despite evidence of your skill, is common among programmers at every level; not knowing things and asking about them is a normal part of the job."

[[note]]
level = "beginner"
topic = "Teams"
text = "In pair programming, two people share one task at one computer: the driver types while the navigator reviews each line and thinks ahead, and they swap roles often."

[[note]]
level = "beginner"
topic = "Teams"
text = "Many teams practice collective code ownership, an idea from Extreme Programming: anyone may improve any part of the codebase, so a teammate changing code you wrote is normal, not personal."

[[note]]
level = "beginner"
topic = "Documentation"
text = "`README.md` is written in Markdown, where `#` starts a heading, `**text**` makes bold and `-` starts a list item; GitHub renders it as formatted text below the file list."

[[note]]
level = "beginner"
topic = "Containers"
text = "A container image is a packaged filesystem plus settings for running a program, and a container is one running instance of it, so many containers can start from the same image."

[[note]]
level = "beginner"
topic = "Cloud"
text = "A cloud region is a geographic area such as Frankfurt or Oregon, and most regions contain several availability zones, groups of data centers with separate power and networking, so one zone can fail while the others keep running."

[[note]]
level = "beginner"
topic = "Cloud"
text = "With IaaS you rent virtual machines and manage the operating system yourself, with PaaS you hand over your code and the provider runs the servers, and with SaaS you simply use software someone else runs."

[[note]]
level = "beginner"
topic = "Debugging"
text = "A syntax error stops code before it starts running, a runtime error crashes it partway through, and a logic error gives wrong results with no error at all, which is why logic errors take longest to find."

[[note]]
level = "beginner"
topic = "Networking"
text = "An IP address identifies a machine and a port identifies a program on it, so one computer can run a web server on port 80 and a database on port 5432 at the same time."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Comments are ignored when your program runs, so they never slow it down; their real cost is upkeep, since every comment must be kept true as the code around it changes."

[[note]]
level = "beginner"
topic = "DNS"
text = "DNS answers are cached for as long as each record's TTL allows, so a change to a domain's records can take minutes or hours to be seen everywhere."

[[note]]
level = "beginner"
topic = "DNS"
text = "On Linux and macOS, the `/etc/hosts` file maps names to IP addresses on your own machine and is normally checked before DNS, which makes it handy for pointing a name at a local server."

[[note]]
level = "beginner"
topic = "DNS"
text = "A domain's `A` record points to an IPv4 address, an `AAAA` record to an IPv6 address, and a `CNAME` record makes one name an alias for another."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "A stable sort keeps items that compare equal in their original order. Python's `sorted` is stable, so sorting people by name and then by team leaves each team's members in name order."

[[note]]
level = "beginner"
topic = "Performance"
text = "Checking `x in some_list` scans the list item by item, while `x in some_set` jumps almost straight to the answer, so for repeated lookups a set gets far faster as the data grows."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Big O notation describes how work grows with input size: doubling the input roughly doubles the time of an O(n) loop but quadruples that of O(n^2) nested loops over the same data."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Binary search needs about 20 comparisons to find an item among a million sorted entries, because each step halves the range, but it only works if the data is sorted."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Python allows about 1,000 nested calls by default (see `sys.getrecursionlimit()`), so a correct recursive function that walks a long list or a deep tree can still crash with `RecursionError` where a loop would not."

[[note]]
level = "beginner"
topic = "Data"
text = "JSON is stricter than JavaScript object syntax: keys must be in double quotes, strings cannot use single quotes, and trailing commas and comments are not allowed."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "Concurrency means juggling several tasks so they all make progress; parallelism means running them at the same instant on separate CPU cores. One core can run many tasks concurrently but never in parallel."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "Threads inside one program share its memory and can read each other's variables, while separate processes each get their own memory and exchange data through pipes, files, sockets or a database."

[[note]]
level = "beginner"
topic = "Performance"
text = "Reading memory takes about a hundred nanoseconds, an SSD read tens of microseconds or more, and a request to another machine at least a fraction of a millisecond, so extra disk and network trips usually dominate running time."

[[note]]
level = "beginner"
topic = "Infrastructure as code"
text = "Infrastructure as code means describing servers, networks and databases in files kept in version control, so an environment can be reviewed, rebuilt and copied like code instead of clicked together by hand."

[[note]]
level = "beginner"
topic = "Regex"
text = "In GNU `grep`'s default basic syntax, `+`, `?` and `|` are ordinary characters, so a pattern like `a+` needs `grep -E` to mean one or more `a`."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Good names are documentation that cannot drift: a function called `send_invoice_email` explains itself, while one called `process2` needs a comment that may go stale."

[[note]]
level = "beginner"
topic = "Regex"
text = "Python applies its own string escapes before the regex engine sees a pattern, so in a normal string `\"\\b\"` is a backspace character; a raw string like `r\"\\bcat\\b\"` passes the backslashes through."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Unicode gives each character a number, its code point, such as `U+00E9` for `é`; UTF-8 stores ASCII characters in one byte and others in two to four, so byte length and character count can differ."

[[note]]
level = "beginner"
topic = "Performance"
text = "Latency is how long one request takes; throughput is how many requests finish per second. Adding servers raises throughput, but it does not make any single slow request faster."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "When code works on your machine but fails on a teammate's, the cause is usually something outside the repository: a different language version, a package you installed by hand, an environment variable or a local file."

[[note]]
level = "beginner"
topic = "Unicode"
text = "A file's bytes mean nothing without knowing their encoding: reading UTF-8 text as Windows-1252 turns `é` into `Ã©`, a garbling known as mojibake."

[[note]]
level = "beginner"
topic = "Time"
text = "In JavaScript's `Date`, months are numbered from 0, so `new Date(2024, 0, 15)` is January 15 and month `11` is December, while days of the month start at 1."

[[note]]
level = "beginner"
topic = "Time"
text = "Unix time counts the seconds since midnight UTC on January 1, 1970, so the same number means the same instant everywhere, whatever the local time zone."

[[note]]
level = "beginner"
topic = "Infrastructure as code"
text = "Terraform on its own knows nothing about any cloud: plugins called providers translate each resource block into API calls, which is how one tool can manage AWS servers, GitHub repositories and DNS records alike."

[[note]]
level = "beginner"
topic = "Time"
text = "`Date.now()` in JavaScript returns milliseconds since 1970, while Python's `time.time()` returns seconds, so passing a value from one to the other is off by a factor of 1000."

[[note]]
level = "beginner"
topic = "Time"
text = "ISO 8601 dates such as `2024-03-05` sort correctly as plain text because the largest unit comes first, unlike `03/05/2024`, which also reads as different dates in the US and Europe."

[[note]]
level = "beginner"
topic = "Code review"
text = "Reviewers can only judge what they can see, so a pull request description that explains why the change is needed and how it was tested lets them check the reasoning, not just the code."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Tools such as Javadoc, rustdoc and Sphinx turn specially formatted comments into browsable reference pages, which is why many languages reserve a comment style for documentation."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Text files on Windows traditionally end lines with CRLF (`\\r\\n`) while Linux and macOS use LF (`\\n`), so a file that switches between them shows every line as changed in a diff."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "File names are case-insensitive by default on macOS and Windows but case-sensitive on Linux, so `open(\"Data.csv\")` can find `data.csv` on your laptop and then fail on a Linux server or in CI."

[[note]]
level = "beginner"
topic = "Security"
text = "The principle of least privilege says each person, program and key gets only the access it needs. When one of them is compromised, the damage stays limited to that small set of permissions."

[[note]]
level = "beginner"
topic = "Observability"
text = "Python's `logging` module shows only `WARNING` and above by default, so `logging.info()` and `logging.debug()` messages stay hidden until you lower the level."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "In Semantic Versioning, only a MAJOR bump may break you. Below `1.0.0` anything may change at any time, so treat `0.x` releases as unstable."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "In SemVer, a pre-release such as `2.0.0-rc.1` ranks below the final `2.0.0`, and npm ranges like `^1.2.0` do not match pre-releases such as `1.3.0-beta.1` at all."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "SemVer ignores build metadata after a plus sign when ordering versions, so `1.4.0+build.7` and `1.4.0+build.9` have the same precedence."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "For a command-line tool, the public API includes its flags, exit codes and any output format that scripts parse, so under semantic versioning changing one of them calls for a new major version."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "`npm install <pkg>` installs whatever the `latest` dist-tag points to, not the highest version number. Publish a beta with `npm publish --tag next`, and only users who ask for `<pkg>@next` get it."

[[note]]
level = "intermediate"
topic = "Git"
text = "Conceptually, each Git commit records a full snapshot of the project rather than a diff; tools like `git diff` and `git show` compute changes on the fly by comparing snapshots."

[[note]]
level = "intermediate"
topic = "Git"
text = "Rebasing rewrites history: every replayed commit gets a new hash because its parent changed, so anyone who built on the old commits must reconcile two copies of the same work."

[[note]]
level = "intermediate"
topic = "Git"
text = "Each commit records an author and a committer: after a rebase, cherry-pick or applied patch, the committer is whoever replayed it, and `git log --format=fuller` shows both people with their dates."

[[note]]
level = "intermediate"
topic = "Git"
text = "In `git log main..topic`, the two dots mean commits reachable from `topic` but not from `main`, which is exactly the set of commits that merging `topic` into `main` would bring in."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git stash` saves staged and unstaged changes to tracked files only; new untracked files stay in the working tree unless you add `-u` (`--include-untracked`)."

[[note]]
level = "intermediate"
topic = "Git"
text = "`HEAD~2` is the first parent of the first parent, while `HEAD^2` is the second parent of a merge commit; `HEAD~1` and `HEAD^` mean the same thing."

[[note]]
level = "intermediate"
topic = "Git"
text = "The staging area is a real file, `.git/index`, that lists every tracked file for the next commit, not only your changes; `git ls-files -s` prints each entry's mode, blob hash and path."

[[note]]
level = "intermediate"
topic = "Git"
text = "Squash merging adds a single new commit with no ancestry link to your branch's commits, so Git can't tell the branch was merged and `git branch --merged` won't list it."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git log --since` and `--until` filter on committer date, not author date, so a commit written months ago but rebased yesterday shows up as yesterday's work in date-limited logs and reports."

[[note]]
level = "intermediate"
topic = "Git"
text = "Remote-tracking refs like `origin/main` are your repository's last record of the remote: with the default refspec only a fetch or a push moves them, so they can be days behind what the server actually holds."

[[note]]
level = "intermediate"
topic = "Git"
text = "When the branch you merge into has gained no commits since you branched off, `git merge` simply moves its pointer forward, a fast-forward, and records no merge commit unless you pass `--no-ff`."

[[note]]
level = "intermediate"
topic = "Git"
text = "Git records only whether a file is executable, not its owner or other permission bits, so tightening a file's mode is never committed; on Windows, mark a script executable with `git update-index --chmod=+x <file>`."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "A public repository named `.github` in an organization or user account supplies default community files, such as `CONTRIBUTING.md`, `SECURITY.md` and issue templates, to every repository that lacks its own."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "A `CODEOWNERS` file only requests reviews from owners; their approval becomes mandatory only when branch protection or a ruleset turns on required review from code owners."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Commits made through GitHub's web interface, including file edits and merges done with the merge button, are signed with GitHub's own key and show as Verified even if you never set up signing."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "When a pull request comes from a fork with Allow edits by maintainers checked, people with push access to the upstream repository can push commits straight to the contributor's branch."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "GitHub's Update branch button brings a lagging branch up to date by merging the latest base into it, which adds a merge commit; its rebase option rewrites your commits instead, so pull before pushing more work."

[[note]]
level = "intermediate"
topic = "Code review"
text = "When the lines a GitHub review comment points at change in a later push, the comment is marked Outdated and collapsed, so unresolved feedback can drop out of sight."

[[note]]
level = "intermediate"
topic = "Code review"
text = "With required reviews turned on, a Request changes review on GitHub blocks merging until that reviewer approves or someone with permission dismisses the review."

[[note]]
level = "intermediate"
topic = "Code review"
text = "\"Given enough eyeballs, all bugs are shallow\" is Eric Raymond's Linus's law, and it holds only when the eyes actually read the code: Heartbleed sat in widely used OpenSSL code for about two years."

[[note]]
level = "intermediate"
topic = "Code review"
text = "When a review is requested from a GitHub team, including through `CODEOWNERS`, one approving member satisfies it, so a team request does not mean the whole team read the change."

[[note]]
level = "intermediate"
topic = "Code review"
text = "`git diff --color-moved` colors moved lines differently from real additions and deletions, so a refactor that relocates code doesn't hide the few lines that actually changed."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Google's published code review guidelines say to approve a change once it definitely improves the overall health of the code, even if it isn't perfect, because there is no perfect code, only better code."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Parkinson's law of triviality, or bikeshedding, is a group's habit of spending the most time on the easiest topics: a committee waves through a nuclear plant, then argues at length about the staff bike shed."

[[note]]
level = "intermediate"
topic = "Releases"
text = "The Keep a Changelog convention groups each release's entries under Added, Changed, Deprecated, Removed, Fixed and Security, with an Unreleased section on top that collects changes as they merge."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Rolling back code doesn't roll back data: if the new version migrated or wrote data in a new format, the previous version may be unable to read it."

[[note]]
level = "intermediate"
topic = "Releases"
text = "`git describe` considers only annotated tags by default and ignores lightweight ones unless you pass `--tags`, which matters for build scripts that derive version numbers from tags."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`\"$@\"` expands to every argument as a separate word, keeping spaces inside each one, while `\"$*\"` joins them into one string separated by the first character of `IFS`; to pass arguments along, you almost always want `\"$@\"`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Commands in parentheses, as in `(cd build && make)`, run in a subshell, so the directory change and any variables vanish afterward; braces, as in `{ cd build && make; }`, group commands in the current shell, so the changes stay."

[[note]]
level = "intermediate"
topic = "Shell"
text = "An unquoted `$var` undergoes word splitting and glob expansion, so a filename containing a space turns into two arguments, while `\"$var\"` stays one."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Exit status 126 means a command was found but couldn't be executed, 127 means it wasn't found, and a status of 128 plus N usually means the process died from signal N."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Bash reads `~/.bash_profile` (or `~/.profile`) only for login shells, such as an SSH session, and `~/.bashrc` for other interactive shells, so a setting can work in one and not the other; many setups source `~/.bashrc` from `~/.bash_profile`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Exit statuses are stored in 8 bits, so `exit 256` reports success as 0, `exit 300` becomes 44 and `exit -1` becomes 255; keep custom codes between 1 and 125, since higher values have special meanings in the shell."

[[note]]
level = "intermediate"
topic = "Shell"
text = "In Bash, a glob that matches nothing is passed along literally by default, so `rm *.tmp` in a directory without such files looks for a file actually named `*.tmp`."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Your `umask` removes permission bits from every file you create: programs usually ask for read and write for everyone, so the common mask `022` leaves new files as `rw-r--r--`, and a mask of `077` makes them private to you."

[[note]]
level = "intermediate"
topic = "Linux"
text = "A hard link, made with `ln` without `-s`, is a second name for the same file rather than a pointer to a path: all names share contents and permissions, the data is freed only when the last name goes, and links can't span file systems."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "In GNU make, a variable defined with `=` is expanded again each time it is used, so it sees later assignments, while `:=` expands once where it is defined; the difference matters for slow `$(shell ...)` calls."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "`make` stops at the first recipe command that exits nonzero, but a leading `-`, as in `-rm build.log`, tells it to ignore that one failure, print `(ignored)` and carry on."

[[note]]
level = "intermediate"
topic = "Regex"
text = "The POSIX regex engines behind `grep -E`, `sed -E` and `awk` have no lazy quantifiers, so `.*?` there is still greedy; to stop at the first comma, match a negated class such as `[^,]*` instead."

[[note]]
level = "intermediate"
topic = "Regex"
text = "When the pattern passed to Python's `re.split` has a capturing group, the separators appear in the result: `re.split(r'(,)', 'a,b')` returns `['a', ',', 'b']`. A non-capturing `(?:...)` group leaves them out."

[[note]]
level = "intermediate"
topic = "Regex"
text = "The HTML `pattern` attribute must match the whole value, as if wrapped in `^(?:` and `)$`, so `pattern=\"[0-9]+\"` rejects `12a`, while the same regex in JavaScript's `test()` finds the digits and passes it."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "The replacement character (U+FFFD, usually shown as a question mark in a diamond) is what a decoder inserts for bytes that are invalid in the encoding it assumed; once saved, the original characters are gone for good."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Terminals give most CJK characters and emoji two columns and combining accents none, so padding table columns by `len()` misaligns them; measure display width with a function such as `wcswidth` instead."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "No tool can know a text file's encoding for certain: detectors such as `chardet` and your editor guess from byte patterns, and short files or Latin-1 versus Windows-1252 are often ambiguous. Ask whoever produced the file."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Hofstadter's law, from Douglas Hofstadter's 1979 book Gödel, Escher, Bach, says a task always takes longer than you expect, even when you take Hofstadter's law into account."

[[note]]
level = "intermediate"
topic = "Python"
text = "Default argument values are evaluated once, when the `def` statement runs, so a mutable default such as `[]` or `{}` is shared by every call that doesn't pass that argument."

[[note]]
level = "intermediate"
topic = "Python"
text = "A Python generator can be consumed only once: after `total = sum(g)`, a second pass such as `list(g)` returns `[]` without any error, so build a list first if you need the values twice."

[[note]]
level = "intermediate"
topic = "Python"
text = "A module's top-level code runs only the first time it is imported in a process; later imports return the cached module from `sys.modules`, so edits to the file take effect only after a restart or `importlib.reload`."

[[note]]
level = "intermediate"
topic = "Python"
text = "Activating a virtual environment only puts its `bin` directory (`Scripts` on Windows) first on `PATH`, so running `.venv/bin/python` or `.venv/bin/pytest` directly uses the environment without activating it."

[[note]]
level = "intermediate"
topic = "Java"
text = "Java's `var` infers a local variable's type at compile time, and the variable keeps that static type: `var names = new ArrayList<String>()` declares an `ArrayList<String>`, not a dynamically typed value."

[[note]]
level = "intermediate"
topic = "Java"
text = "Standard functional interfaces such as `Function` declare no checked exceptions, so a lambda passed to `stream().map(...)` can't call a method that throws `IOException` unless it catches the exception itself."

[[note]]
level = "intermediate"
topic = "Java"
text = "`HashMap` iterates in no particular order, and the order can change as the map grows; `LinkedHashMap` keeps insertion order and `TreeMap` keeps keys sorted, so pick the class that gives the order you rely on."

[[note]]
level = "intermediate"
topic = "Go"
text = "A Go string is a sequence of bytes, so `len(\"héllo\")` is 6, while `for i, r := range s` decodes UTF-8 and yields each rune (code point) together with its byte offset."

[[note]]
level = "intermediate"
topic = "Go"
text = "Since Go 1.22, each iteration of a `for` loop has its own loop variable, so closures and goroutines capture that iteration's value; modules whose `go.mod` declares an older `go` version keep the old shared variable."

[[note]]
level = "intermediate"
topic = "Go"
text = "Methods with pointer receivers belong only to the pointer type, so if `Save` is declared on `*User`, a plain `User` value doesn't satisfy an interface that requires `Save`, while `&user` does."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Lifetime annotations such as `'a` never change how long a value lives; they tell the compiler how the lifetimes of references relate, so it can reject any reference that could outlive its data."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Code inside ES modules and `class` bodies always runs in strict mode, so assigning to an undeclared variable there throws a `ReferenceError` instead of quietly creating a global."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`forEach` ignores the promises its callback returns, so `items.forEach(async (x) => { await save(x) })` starts every save and moves on without waiting for any of them."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`Promise.all` rejects as soon as one promise rejects, but the other operations keep running; `Promise.allSettled` waits for all of them and reports each outcome."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`let` and `const` are hoisted but left uninitialized, so reading one before its declaration throws a `ReferenceError` (the temporal dead zone), whereas a `var` would just be `undefined`."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "An `async` function runs synchronously until its first `await`, so its opening code executes before the caller's next line, and even an early `throw` there becomes a rejected promise rather than an exception."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Node runs a module's code once and caches the result, so every `import` or `require` of that file gets the same instance, and state kept at the module's top level is shared across the whole process."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Calling a generator function runs none of its body: it returns an iterator, and the code only advances to the next `yield` each time `next()` is called, which lets generators describe endless sequences lazily."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Two `interface` declarations with the same name merge into one, which is how you can add fields to a library type such as `Window`, while declaring a `type` alias twice is an error."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "The type `{}` accepts every value except `null` and `undefined`, strings and numbers included, so it does not mean an empty object; `object` means any non-primitive, and `Record<string, never>` an empty one."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "`const mode = 'dark'` gets the literal type `'dark'`, but `let mode = 'dark'` widens to `string`, which is why the `let` version is rejected where `'dark' | 'light'` is expected."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Spread syntax and `Object.assign` make shallow copies, so nested objects are still shared between the copy and the original; `structuredClone()` makes a deep copy."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Under `strict`, the variable in `catch (err)` has type `unknown`, because JavaScript code can throw any value, not just `Error` objects, so it must be narrowed before `err.message` is read."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "`value as User` is a type assertion, not a conversion: it changes what the compiler believes without touching the value, which can hide a real mismatch."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Callers of an overloaded function see only its overload signatures, never the implementation signature, so the implementation must handle every overload while its own looser parameter types stay hidden."

[[note]]
level = "intermediate"
topic = "Web"
text = "`z-index` only orders elements within the same stacking context, so a child with `z-index: 9999` cannot rise above content outside a parent that creates one, as `transform` or an `opacity` below 1 does."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "By default, `tsc` still emits JavaScript when the code has type errors; the `noEmitOnError` option makes it skip output in that case."

[[note]]
level = "intermediate"
topic = "Web"
text = "The CSS `:has()` selector matches an element by what it contains, as in `form:has(input:invalid)`, so styling a parent based on its children no longer needs JavaScript."

[[note]]
level = "intermediate"
topic = "Rust"
text = "The `?` operator passes an error through `From::from` before returning it, so implementing `From<std::io::Error>` for your own error type lets `?` work directly on I/O calls."

[[note]]
level = "intermediate"
topic = "Rust"
text = "A closure borrows the variables it uses unless you write `move`, which makes it take ownership of them; closures passed to `std::thread::spawn` usually need `move`, since the thread may outlive the function that started it."

[[note]]
level = "intermediate"
topic = "C"
text = "`static` means two things in C: on a local variable, it keeps the value between calls and starts at zero; on a file-level function or variable, it hides that name from other source files."

[[note]]
level = "intermediate"
topic = "C"
text = "In a C declaration, `const` applies to what is on its left, or to the type if nothing is: `const char *p` points to characters you can't change, while `char *const p` is a pointer you can't reassign."

[[note]]
level = "intermediate"
topic = "Go"
text = "Comparing `time.Time` values with `==` also compares their location and monotonic clock reading, so two values for the same instant can be unequal; the `Equal` method compares instants."

[[note]]
level = "intermediate"
topic = "C"
text = "An `undefined reference to` error comes from the linker, not the compiler: your C code compiled, but none of the object files or libraries on the command line defined that function."

[[note]]
level = "intermediate"
topic = "C"
text = "Compilers insert padding so struct members stay aligned, so `struct { char c; int n; }` usually has a `sizeof` of 8, not 5. Ordering members from largest to smallest alignment often makes a struct smaller."

[[note]]
level = "intermediate"
topic = "Rust"
text = "`cargo build` uses the unoptimized debug profile by default, which can run many times slower than `cargo build --release`, so timing a debug build misleads."

[[note]]
level = "intermediate"
topic = "Networking"
text = "UDP has no connection setup and no acknowledgments, so a sender never learns that a datagram was lost; applications built on UDP, such as DNS lookups and video calls, add their own retries or simply tolerate the loss."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Rust's `Mutex<T>` owns the data it protects, so the data is reachable only through the guard returned by `lock()`, and the lock is released when that guard is dropped."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "JavaScript's `%` is a remainder that keeps the sign of the left operand, so `-7 % 3` is `-1`, not `2`; stepping an index backward around an array needs `((i % n) + n) % n`."

[[note]]
level = "intermediate"
topic = "Networking"
text = "CIDR notation counts the fixed leading bits of an address: `10.0.0.0/24` covers the 256 addresses from `10.0.0.0` to `10.0.0.255`, and each step down in the suffix, such as `/23`, doubles the range."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Most TypeScript syntax is simply erased, but `enum`, `namespace` and constructor parameter properties generate JavaScript of their own, which is why Node's built-in type stripping rejects them and the `erasableSyntaxOnly` option forbids them."

[[note]]
level = "intermediate"
topic = "Java"
text = "`String.toLowerCase()` without arguments uses the default locale, so on a Turkish system `\"TITLE\".toLowerCase()` yields a dotless `ı`; `toLowerCase(Locale.ROOT)` is locale-independent."

[[note]]
level = "intermediate"
topic = "DNS"
text = "The `search` line in `/etc/resolv.conf` lets short names resolve: with `search corp.example.com`, a lookup of `db` also tries `db.corp.example.com`, which is why a bare hostname can work on one machine and fail on another."

[[note]]
level = "intermediate"
topic = "Web"
text = "`DOMContentLoaded` fires once the HTML is parsed and deferred scripts have run, while `load` also waits for every image, stylesheet and iframe, so setup code that only needs the DOM should not wait for `load`."

[[note]]
level = "intermediate"
topic = "Observability"
text = "The twelve-factor app convention treats logs as an event stream: the app writes them to stdout and leaves collection, routing and storage to its environment, which is how Docker and Kubernetes gather container logs."

[[note]]
level = "intermediate"
topic = "Regex"
text = "In most regex engines `.` doesn't match a newline unless a flag enables it, such as `re.DOTALL` in Python or `s` in JavaScript."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "String length depends on the language: for `é`, Python's `len` counts code points and gives 1, while Go's `len` and Rust's `str::len` count UTF-8 bytes and give 2; count characters with `utf8.RuneCountInString` or `.chars().count()`."

[[note]]
level = "intermediate"
topic = "Time"
text = "Linux keeps three times per file: access (`atime`), content modification (`mtime`) and status change (`ctime`), which moves on any metadata change such as `chmod`; `ctime` is not creation time, which newer `stat` shows as `Birth`."

[[note]]
level = "intermediate"
topic = "Regex"
text = "In Python 3, `\\d` in a `str` pattern matches any Unicode decimal digit, including Arabic-Indic digits, not only `0-9`; the `re.ASCII` flag restricts it."

[[note]]
level = "intermediate"
topic = "Time"
text = "The US and Europe switch to and from daylight saving time on different dates, so for a few weeks each year New York is four hours behind London instead of five; take such differences from a time zone database, never a fixed offset."

[[note]]
level = "intermediate"
topic = "SQL"
text = "When values tie, `ROW_NUMBER()` still numbers the rows 1, 2, 3 in an arbitrary order, `RANK()` gives 1, 1, 3 and `DENSE_RANK()` gives 1, 1, 2, so the function you pick decides how ties are reported."

[[note]]
level = "intermediate"
topic = "SQL"
text = "A `UNIQUE` column accepts any number of `NULL` values in PostgreSQL, MySQL and SQLite, because no two `NULL`s count as equal. SQL Server allows just one, and PostgreSQL can be told to with `UNIQUE NULLS NOT DISTINCT`."

[[note]]
level = "intermediate"
topic = "SQL"
text = "PostgreSQL treats `NULL` as larger than every value, so it sorts last in ascending order and first with `DESC`, while MySQL and SQLite put `NULL` first in ascending order. Add `NULLS FIRST` or `NULLS LAST` where supported."

[[note]]
level = "intermediate"
topic = "SQL"
text = "A view is a saved query that runs each time you select from it, so it is always current but never faster than that query, while a materialized view stores the result and stays stale until it is refreshed."

[[note]]
level = "intermediate"
topic = "SQL"
text = "`WHERE` filters rows before grouping and `HAVING` filters groups after aggregation, which is why a condition like `COUNT(*) > 1` can only go in `HAVING`."

[[note]]
level = "intermediate"
topic = "SQL"
text = "`LIMIT ... OFFSET` gets slower on later pages because the database still reads and discards every skipped row, while keyset pagination (`WHERE id > ?` with `ORDER BY id`) seeks straight to the next page."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Databases make commits survive crashes with a write-ahead log: each change is appended to a log and flushed to disk before the commit is confirmed, and after a crash the log is replayed to restore it."

[[note]]
level = "intermediate"
topic = "Databases"
text = "In PostgreSQL, `text` and `varchar(n)` are stored and processed the same way, and the length limit is only a check. Use `varchar(n)` when the limit is a real business rule, not in the hope of speed."

[[note]]
level = "intermediate"
topic = "Databases"
text = "In SQLite, an `INTEGER PRIMARY KEY` is an alias for the rowid, and without `AUTOINCREMENT` a new row can get the ID of a deleted row that held the highest ID. Add `AUTOINCREMENT` if IDs must never come back."

[[note]]
level = "intermediate"
topic = "Data"
text = "Parquet and Avro files carry their schema inside the file, so column names and types travel with the data, while a program reading CSV has to guess every column's type or be told it."

[[note]]
level = "intermediate"
topic = "Data"
text = "Every analytics table has a grain, the exact thing one row represents, such as one order or one line item. Joining or summing tables of different grains repeats the coarser rows, so totals come out inflated without any error."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Each index speeds up some reads but adds work to every insert and delete, and to updates of the indexed columns, because the index must be kept in sync with the table."

[[note]]
level = "intermediate"
topic = "Data"
text = "Records a person would call duplicates rarely match byte for byte: `Acme Inc.` and `ACME, Inc` differ in case and punctuation, so deduplication needs a normalized comparison key, not the raw values."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "Breadth-first search explores a graph level by level, so the first time it reaches a node it has found a path with the fewest edges; depth-first search gives no such guarantee."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "No sort that works by comparing pairs of items can beat about n log n comparisons in the worst case; counting sort and radix sort get past that limit only by exploiting the keys, such as small integer ranges."

[[note]]
level = "intermediate"
topic = "Databases"
text = "PostgreSQL can run `CREATE TABLE` and `ALTER TABLE` inside a transaction and roll them back, while MySQL commits implicitly around most DDL, so a failed MySQL migration can leave partial changes behind."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "Appending to a Python list, a Java `ArrayList` or a Go slice is amortized O(1): the backing array is sometimes copied into a bigger one, but capacity grows by a constant factor, so the average cost per append stays constant."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "Greedy algorithms can miss the best answer: making 6 from coins worth 1, 3 and 4 by always taking the largest coin gives 4 + 1 + 1, three coins, while 3 + 3 needs only two."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "A lock protects data only if every access to that data takes it, reads included: locking the writers alone still lets a reader see a half-updated record or a torn value."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Replicas typically apply changes asynchronously, so a read sent to a replica right after a write to the primary can return stale data."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "CPU-bound work gains nothing from more threads than cores, since the extra threads only add switching, while I/O-bound work can use many more threads than cores because most of them sit waiting."

[[note]]
level = "intermediate"
topic = "Web"
text = "Scripts with `type=\"module\"` are deferred by default and get their own scope, so their top-level variables do not become globals that other scripts on the page can read."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "`401 Unauthorized` really means unauthenticated, that no valid credentials were sent, while `403 Forbidden` means the server knows who you are and still refuses."

[[note]]
level = "intermediate"
topic = "Web"
text = "`innerText` returns only the text that is rendered and forces a layout to work that out, while `textContent` returns all text in the element, hidden parts included, without triggering layout."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Keyboard focus follows the order of elements in the HTML, not their position on screen, so CSS that rearranges content with `order`, `row-reverse` or grid placement can make focus jump around the page."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "HTTP header names are case-insensitive, so `Content-Type` and `content-type` are the same header, and HTTP/2 transmits every header name in lowercase."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "WCAG's contrast rules also cover the non-text parts of an interface: input borders, icons that carry meaning and focus indicators need a contrast ratio of at least 3:1 against what surrounds them."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "WCAG 2.2 asks for pointer targets of at least 24 by 24 CSS pixels, or enough space around smaller ones, because tiny, crowded buttons are hard to hit with a tremor or on a moving bus."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Someone using a screen magnifier sees only a small part of the page at a time, so an error or status message that appears far from the control they just used can go completely unnoticed."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "A `405 Method Not Allowed` response must carry an `Allow` header listing the methods the resource supports, so a client that sent `PUT` can see that only `GET` and `POST` are accepted."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "`415 Unsupported Media Type` means the server cannot read the body format you sent, often because `Content-Type` is missing, while `406 Not Acceptable` means it cannot produce any format your `Accept` header allows."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "HTTP/1.1 connections are persistent by default, so a client can send many requests over one TCP connection, and a `Connection: close` header asks to end it after the current response."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "One IP address can host many websites because each HTTP/1.1 request names its site in the `Host` header, and an HTTPS client names it even earlier, during the TLS handshake, through SNI."

[[note]]
level = "intermediate"
topic = "APIs"
text = "A client-side timeout doesn't cancel anything on the server: the request may still complete after the client gave up, so a blind retry can perform the action twice."

[[note]]
level = "intermediate"
topic = "APIs"
text = "An API key identifies the calling application, while an OAuth access token stands for a user's delegated permission, limited to the scopes that user approved and usually short-lived."

[[note]]
level = "intermediate"
topic = "Web"
text = "The same-origin policy compares scheme, host and port, so one site served over HTTP and HTTPS, or on two ports, counts as separate origins."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Many APIs answer well-formed JSON that fails validation, such as an order with a negative quantity, with `422 Unprocessable Content`, keeping `400 Bad Request` for bodies they cannot parse at all."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Some APIs version by date: each account is pinned to the version that was current when it first called the API, and a request header opts into newer ones, so two clients can see different response shapes from one endpoint."

[[note]]
level = "intermediate"
topic = "APIs"
text = "gRPC reports failures with its own status codes, such as `NOT_FOUND` or `DEADLINE_EXCEEDED`, carried in trailers, so a failed call usually arrives with HTTP status 200 and only the gRPC status shows the error."

[[note]]
level = "intermediate"
topic = "APIs"
text = "GraphQL lets each client pick the fields it needs, so one request can fetch exactly what a screen shows, but queries usually go out as `POST`, so responses can't be cached by URL the way REST `GET` responses can."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Tom Cargill's ninety-ninety rule jokes that the first 90 percent of the code takes the first 90 percent of the time, and the remaining 10 percent takes the other 90 percent."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "`async` code in Python and JavaScript runs its tasks on one thread and switches between them at each `await`, so it helps a program wait on many network calls at once but does not make calculations any faster."

[[note]]
level = "intermediate"
topic = "Performance"
text = "A cache with a 90% hit rate still sends one request in ten to the backend, and raising it to 99% cuts backend traffic tenfold, which is why small gains in hit rate matter so much."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Instrumenting profilers such as Python's `cProfile` add overhead to every function call, so code made of many tiny calls looks slower under them than it really is; sampling profilers distort far less."

[[note]]
level = "intermediate"
topic = "Data"
text = "YAML 1.1 parsers such as PyYAML read unquoted `yes`, `no`, `on` and `off` as booleans, so a country code written as `NO` becomes `false`."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Paul Graham's essay \"Maker's Schedule, Manager's Schedule\" explains why one meeting can wreck a programmer's afternoon: makers need long unbroken blocks, while managers work in hourly slots."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Screen readers announce state from attributes, not styling: a toggle that only changes color is silent, while `aria-pressed`, `aria-checked` or `aria-selected` make it announce pressed, checked or selected."

[[note]]
level = "intermediate"
topic = "Teams"
text = "A directly responsible individual, or DRI, is the one person accountable for a task or decision; when a whole team owns something without a named DRI, nobody feels they must push it forward."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "A five whys analysis follows a single chain of causes, so it tends to stop at one root cause, while most incidents have several contributing factors that all had to be present. Asking what else had to be true finds the rest."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "The SemVer spec's first rule is that software must declare its public API, in code or in documentation; without that written boundary, nobody can say whether a release broke compatibility."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Python's `doctest` and Rust's documentation tests run the examples in docs as tests, so an example that drifts from the code fails the test run instead of misleading readers."

[[note]]
level = "intermediate"
topic = "Security"
text = "Deleting a file in a new commit doesn't remove it from history: every clone still contains the old commits, so a secret that was ever pushed has to be treated as leaked and rotated."

[[note]]
level = "intermediate"
topic = "Security"
text = "An allowlist of accepted values, file types or hosts fails safe when something new appears, while a denylist lets through every attack its authors did not think of, such as a new encoding or URL scheme."

[[note]]
level = "intermediate"
topic = "Security"
text = "Defense in depth assumes every control will fail sometimes, so it layers independent ones: input validation, parameterized queries and a database user without admin rights each stop attacks the others miss."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Encryption at rest protects stolen disks and backups, but the database decrypts data for any query it accepts, so it does nothing against SQL injection or a leaked application password."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Getting a TLS certificate never requires handing over the private key: you send the certificate authority a certificate signing request (CSR) that contains only the public key, and the authority signs that."

[[note]]
level = "intermediate"
topic = "Security"
text = "Unpickling runs code chosen by whoever created the data, so calling `pickle.loads` on untrusted input lets its author execute code on your machine."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "In January 2022, the author of the popular npm packages `colors` and `faker` published sabotaged versions on purpose, one of which printed text in an endless loop; projects that took new versions automatically broke."

[[note]]
level = "intermediate"
topic = "Security"
text = "Parameterized queries keep values separate from the SQL text, so input is always treated as data and can never change the structure of the query."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "In October 2021, attackers took over the npm account behind `ua-parser-js`, a package downloaded millions of times a week, and published versions that installed a cryptocurrency miner and a password stealer."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "`peerDependencies` name a package the host project must provide, such as the React version a component library works with. npm installs peers automatically and stops with `ERESOLVE` when two packages demand incompatible versions."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "An HMAC proves a message came from someone holding the shared key and wasn't altered, which a plain hash can't do, since anyone can recompute a hash of modified data."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "`pip install \"requests[socks]\"` installs a package plus the optional dependencies of its `socks` extra. Quote the argument, because shells such as zsh treat square brackets as a filename pattern."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "A release yanked on PyPI is not deleted: pip skips it when resolving a range but still installs it for an exact `==` pin, so projects locked to that version keep building while new installs avoid it."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "A requirement marked `// indirect` in `go.mod` is one that no package in your module imports directly; it is listed because some dependency needs at least that version."

[[note]]
level = "intermediate"
topic = "Security"
text = "Every process you start inherits your environment variables, and crash reporters, debug pages and CI steps that run `env` often print them all, so a secret kept in the environment travels further than you might expect."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Supporting an older release line means backporting each fix: cherry-picking it from `main` onto a branch such as `release/2.x`, then testing and releasing that line separately."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Git stores file contents and the executable bit but not modification times or other permissions, so a fresh clone stamps every file with the checkout time, and anything that embeds file dates differs between clones."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "npm ignores the `package-lock.json` of your dependencies, so a library's lockfile never reaches its users; they resolve the ranges in its `package.json` themselves."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "`devDependencies` aren't installed when your package is installed as someone else's dependency, so runtime code that imports one works in development and fails for users."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "A range such as `>=2.0` has no upper bound, so a future major release with breaking changes can be picked up by the next fresh install."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Pinning only direct dependencies in `requirements.txt` leaves every transitive dependency free to change between installs, so two builds of the same commit can differ."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "bcrypt's cost factor is a power of two: raising it by one doubles the time each hash takes, for your login server and for an attacker's guesses alike."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "A requirement like `serde = \"1.0\"` in `Cargo.toml` means `^1.0`, not exactly `1.0`, so Cargo picks the newest compatible `1.x` release when resolving and records that choice in `Cargo.lock`."

[[note]]
level = "intermediate"
topic = "Networking"
text = "`traceroute` maps a path by sending probes with increasing TTL values, so each router reports back when a probe expires there; routers set not to reply show up as `* * *` even while traffic passes through them normally."

[[note]]
level = "intermediate"
topic = "Testing"
text = "A test that has never failed proves little: watching it fail before the fix, or after deliberately breaking the code, shows that it can actually detect the bug."

[[note]]
level = "intermediate"
topic = "Testing"
text = "`mock.patch` replaces a name where it is looked up: if `app.py` does `from utils import fetch`, patching `utils.fetch` leaves `app.fetch` untouched, so the target has to be `app.fetch`."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Snapshot tests check that output hasn't changed, not that it is correct, so accepting an updated snapshot without reading the diff approves whatever the code now does."

[[note]]
level = "intermediate"
topic = "Networking"
text = "A stateful firewall remembers connections and lets their replies back in automatically, while a stateless packet filter judges each packet alone, so it also needs rules for replies arriving on the client's ephemeral ports."

[[note]]
level = "intermediate"
topic = "Testing"
text = "A pytest fixture with `scope=\"session\"` is created once for the whole run, so a test that mutates it can change the outcome of tests that run after it."

[[note]]
level = "intermediate"
topic = "DNS"
text = "`NXDOMAIN` means a name does not exist at all, while `NOERROR` with an empty answer means the name exists but has no record of the type you asked for; `dig` shows which in its `status:` line."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Tests that read the current time or use unseeded randomness are nondeterministic by construction; an injected clock and a fixed seed make them repeatable."

[[note]]
level = "intermediate"
topic = "Testing"
text = "In test-double terms, a stub returns canned answers, a mock also verifies how it was called, and a fake is a working lightweight implementation such as an in-memory database."

[[note]]
level = "intermediate"
topic = "Testing"
text = "`go test` caches successful package results and replays them when nothing relevant has changed; `-count=1` forces the tests to run again."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Tests that share a database can pass alone and fail together; running each test inside a transaction that is rolled back afterward keeps them independent."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Python tracebacks list the most recent call last, so the line that raised is at the bottom, while Java and JavaScript stack traces put the throwing frame first."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "`breakpoint()` drops into `pdb` by default, and setting the environment variable `PYTHONBREAKPOINT=0` turns every `breakpoint()` call into a no-op."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "`raise NewError(...) from err` keeps the original exception attached, and the traceback shows both, joined by the line \"The above exception was the direct cause of the following exception\"."

[[note]]
level = "intermediate"
topic = "DNS"
text = "Each `MX` record carries a preference number, and sending servers try the mail host with the lowest number first, moving to higher numbers only when it cannot be reached."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "`git log -S <string>` finds commits that changed the number of occurrences of a string, which pinpoints when a function, constant or config key was added or removed."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Node's `console.log` prints nested objects only two levels deep and shows anything deeper as `[Object]`; `console.dir(obj, { depth: null })` prints the whole structure."

[[note]]
level = "intermediate"
topic = "CI"
text = "CI runners start from a clean machine, so a test that passes locally can fail there because it quietly depended on a file, environment variable or service that only exists on your machine."

[[note]]
level = "intermediate"
topic = "CI"
text = "A CI cache is an optimization, not storage: caches can be evicted at any time, so a build has to be correct on a cache miss, just slower."

[[note]]
level = "intermediate"
topic = "CI"
text = "CI judges each step only by its exit code, so a script that prints errors but exits with status 0 still shows as passing."

[[note]]
level = "intermediate"
topic = "CI"
text = "Two pull requests can each pass CI and still break `main` once both are merged; a merge queue catches this by testing each change on top of the ones queued ahead of it."

[[note]]
level = "intermediate"
topic = "CI"
text = "Hosted CI services expose built-in variables describing the run, such as `GITHUB_SHA` in GitHub Actions or `CI_COMMIT_SHA` in GitLab CI, so scripts can learn the commit, branch or pull request without calling Git."

[[note]]
level = "intermediate"
topic = "CI"
text = "Because CI configuration lives in the repository, a pull request can change the very pipeline that checks it, for example by deleting a test step, so changes to CI files deserve the same review as code."

[[note]]
level = "intermediate"
topic = "CI"
text = "A pipeline's total duration is set by its longest chain of jobs that wait on each other, not by the sum of all jobs, so speeding up a job outside that chain makes no difference to when the pipeline finishes."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Setting `container:` on a GitHub Actions job runs all of its steps inside that Docker image on a Linux runner, so the job gets the image's tools and libraries instead of whatever the runner has installed."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "A composite action packages steps that run inside the job that calls it, on the same runner, while a reusable workflow supplies whole jobs, each of which picks its own runner with `runs-on`."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Configuration variables, read as `${{ vars.NAME }}`, hold non-secret settings such as a region or a URL; unlike secrets they are not masked in logs, and their values stay readable in the repository settings."

[[note]]
level = "intermediate"
topic = "Containers"
text = "In a Dockerfile, `CMD` is only a default: any arguments after the image name in `docker run` replace it, while an exec-form `ENTRYPOINT` stays in place and receives those arguments."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Compose uses the `.env` file beside `compose.yaml` to fill `${VAR}` placeholders in the Compose file itself; its values reach a container only when the file passes them on through `environment` or `env_file`."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Podman runs containers without a background daemon, and in rootless mode maps root inside the container to your own unprivileged user, so a process that breaks out gets only your permissions."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Docker's build cache is invalidated from the first changed instruction onward, which is why Dockerfiles copy dependency manifests and install packages before copying the rest of the source."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Pods get a new IP address whenever they are recreated, so clients reach them through a Service, which keeps a stable virtual IP and DNS name and forwards traffic to whichever pods match its selector."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "`CrashLoopBackOff` means the kubelet keeps restarting a crashing container with growing delays, up to five minutes between attempts; the reason it crashes is in the container's own logs."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Inside a cluster, a pod reaches a Service by its bare name only from the same namespace; from another namespace it needs `name.namespace`, and the full name on a default cluster is `name.namespace.svc.cluster.local`."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Values passed with `--build-arg` can end up in the image's history and metadata, so a secret supplied that way can be read by anyone who pulls the image."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "An Ingress object does nothing by itself: the cluster needs an ingress controller that watches Ingress objects and configures a proxy, and the annotations that tune its behavior belong to whichever controller you run."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "An Amazon SQS standard queue delivers each message at least once, occasionally more than once and not always in the order sent, so consumers must tolerate duplicates; FIFO queues add ordering and deduplication."

[[note]]
level = "intermediate"
topic = "CI"
text = "In GitLab CI, a job normally waits for every job in the previous stage, but a job with `needs:` starts as soon as the jobs it lists finish, which turns the stages into a graph and can shorten the pipeline a lot."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "A Terraform apply is not a transaction: when one resource fails partway, the ones already created or changed stay that way and are recorded in state, and the next apply carries on from there rather than rolling anything back."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "A general purpose S3 bucket has no real directories: a key like `logs/app/today.log` is one flat name, and the folders a console shows are just shared prefixes."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "cloud-init runs a server's user-data script only on the first boot of an instance, so changing the user data of an existing server does nothing until that server is replaced or the script is rerun by hand."

[[note]]
level = "intermediate"
topic = "Containers"
text = "`docker run --restart always` brings a container back whenever the Docker daemon starts, even one you had stopped by hand, while `--restart unless-stopped` leaves containers you stopped yourself alone."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "A GitHub Actions matrix need not be a full cross product: `exclude` drops specific combinations, and `include` adds extra variables to matching combinations or adds new ones."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Prometheus has distinct metric types: a counter only goes up, such as requests served; a gauge goes up and down, such as queue length; and a histogram counts observations into buckets so percentiles can be estimated later."

[[note]]
level = "intermediate"
topic = "Observability"
text = "OpenTelemetry is a vendor-neutral standard for emitting traces, metrics and logs, so code instrumented once can send its data to a different backend by changing exporter or Collector configuration instead of code."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Paging tools escalate a page nobody acknowledges within a set time, usually to a secondary on-call engineer, so acknowledging promptly tells everyone the alert has an owner and stops the escalation."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "During an outage many graphs move at once: CPU drops because requests fail fast, and queues grow because consumers stall. The most dramatic graph is often an effect of the failure, not its cause."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "A stateless service keeps no per-user data in its own memory between requests, so any instance can serve any request and instances can be added, restarted or replaced without logging anyone out."

[[note]]
level = "intermediate"
topic = "DNS"
text = "On most Unix-like systems, entries in `/etc/hosts` take precedence over DNS, a common reason one machine resolves a name differently from every other."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Big-O hides constant factors: for small collections, a linear scan over a contiguous array often beats a hash lookup thanks to CPU cache locality."

[[note]]
level = "intermediate"
topic = "Performance"
text = "By Amdahl's law, speeding up a part that takes 10% of the runtime can save at most 10% overall, however fast that part becomes."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Building a string by repeated concatenation in a loop can take quadratic time because each step may copy everything built so far, while collecting the parts and joining once is linear."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Awaiting inside a loop runs independent requests one after another; starting them all and awaiting `Promise.all` lets them run concurrently and finish in roughly the time of the slowest."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "A queue between two services lets the producer keep accepting work while the consumer is slow or down, at the cost of results arriving later and a backlog that someone has to watch."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Test code favors readable repetition over clever reuse: a test that spells out its own setup can be understood on its own, while heavy shared helpers force you to read several files to see why it failed."

[[note]]
level = "intermediate"
topic = "Observability"
text = "A request or trace ID passed between services and included in every log line lets you follow a single request across all the systems it touched."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Structured logs, such as JSON with consistent field names, can be filtered and aggregated by field, while free-text logs need fragile regex parsing."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "A blameless postmortem asks how the system allowed a mistake to cause harm rather than who made it, because people stop sharing what really happened when they expect blame."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "`count += 1` is not guaranteed to be atomic in Python, GIL or not: it is a separate read, add and write, so concurrent threads can lose increments without a lock."

[[note]]
level = "intermediate"
topic = "Performance"
text = "NumPy operations on whole arrays, such as `prices * quantities`, run in compiled code, so they are typically many times faster than a Python loop doing the same arithmetic one element at a time."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "By Go convention, a doc comment starts with the name it documents, as in `// ParseConfig reads...`, and sits directly above the declaration, where `go doc` and pkg.go.dev pick it up."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "`threading.Lock` isn't reentrant: a thread that tries to acquire a lock it already holds blocks forever, while `threading.RLock` allows nested acquisition by the same thread."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "With `Transfer-Encoding: chunked`, an HTTP/1.1 server can start streaming a response before it knows the total length; HTTP/2 and HTTP/3 forbid that header and mark the end of a body with their own framing instead."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Javadoc uses the first sentence of a doc comment as the summary in method and class lists, so a first sentence that only makes sense alongside the rest of the comment produces a useless summary."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "Checking membership in a list is O(n) while a set lookup is O(1) on average, so a list check inside a loop can quietly turn linear code quadratic."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "With cache-aside, the application reads the cache, loads from the database on a miss and fills the cache itself; with write-through, every write updates the cache too, so reads rarely miss but each write pays the extra cost."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "README-driven development, from a 2010 essay by Tom Preston-Werner, means writing the README before the code, so you design the interface from a user's point of view while changes are still cheap."

[[note]]
level = "intermediate"
topic = "APIs"
text = "JSON Merge Patch (`application/merge-patch+json`) sends a partial document in which `null` deletes a field, while JSON Patch (`application/json-patch+json`) sends a list of operations such as `add`, `remove` and `replace`."

[[note]]
level = "intermediate"
topic = "Time"
text = "Adding `timedelta(hours=24)` to a Python `datetime` that carries a `zoneinfo` time zone keeps the same wall-clock time across a DST change, so the real elapsed time can be 23 or 25 hours."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "A GitHub wiki is a separate Git repository: clone it by adding `.wiki` before `.git` in the repository's clone address, then edit pages locally and push them like code."

[[note]]
level = "intermediate"
topic = "Time"
text = "PostgreSQL's `timestamptz` stores an absolute instant and displays it in the session's time zone, while `timestamp` stores a wall-clock value with no zone at all."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "An exception raised inside a task submitted to a `concurrent.futures` executor is stored in its future and raised only when you call `result()`, so a task whose result nobody checks fails silently."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "A breaking schema or API change can be split into safe steps, known as expand and contract: add the new form, move every reader and writer over, then remove the old one."

[[note]]
level = "intermediate"
topic = "Security"
text = "Hashing a password in the browser before sending it does not protect it: the hash simply becomes the password, and anyone who captures it can replay it. Send the password over HTTPS and hash it on the server."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Piping a Python script into `head` can end in `BrokenPipeError`: `head` exits after printing its lines, and the script's next write finds the pipe closed. It signals an early reader exit, not a bug in your logic."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "A hung process using no CPU is usually blocked, waiting on a lock, the network or disk, while one pinned at 100 percent is spinning in a loop, so checking CPU usage tells you which kind of hang to chase."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Scheduled workflows run in UTC, can start late when GitHub is busy, and are switched off in a public repository after 60 days without activity."

[[note]]
level = "advanced"
topic = "Containers"
text = "With overlay storage, the first write to a file that comes from an image layer copies the whole file into the container's writable layer, so appending one line to a large file baked into the image is slow and stores it twice."

[[note]]
level = "advanced"
topic = "Containers"
text = "`STOPSIGNAL` in a Dockerfile sets the signal that `docker stop` sends first; the official nginx image sets `SIGQUIT`, which nginx treats as a graceful shutdown, while `SIGTERM` would make it stop without finishing open requests."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "A workflow run can restore caches created on its own branch, on the default branch and, for pull requests, on the base branch, but never caches from a sibling feature branch."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "A `concurrency` group holds at most one running and one pending run: when another run queues, the pending one is canceled, so intermediate runs can vanish even without `cancel-in-progress`."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "A step's `if` gets an implicit `success()` unless it calls a status function such as `always()`, `failure()` or `cancelled()`, so `if: github.ref == 'refs/heads/main'` still skips after an earlier failure."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "An `${{ }}` expression inside `run` is pasted into the script text before the shell starts, so a crafted pull request title can inject commands; values passed through `env` arrive as data instead."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "A job output that contains a secret is redacted on the runner and never reaches dependent jobs, which see an empty string rather than an error."

[[note]]
level = "advanced"
topic = "Time"
text = "The tz database zones `Etc/GMT+5` and `Etc/GMT-3` follow the POSIX sign convention, so `Etc/GMT+5` is five hours behind UTC and `Etc/GMT-3` three hours ahead, the opposite of what most readers expect from the names."

[[note]]
level = "advanced"
topic = "Git"
text = "Git stores a full snapshot per commit, not a diff: each commit points to a tree of every file, and deltas exist only as a compression detail inside packfiles."

[[note]]
level = "advanced"
topic = "Git"
text = "A commit's hash covers its tree, its parents, the author and committer with timestamps, and the message, so rebasing onto a new base yields new hashes even when every diff is identical."

[[note]]
level = "advanced"
topic = "Git"
text = "`git hash-object` does not match `sha1sum` for the same file because Git hashes a header holding the object type and size, followed by the content."

[[note]]
level = "advanced"
topic = "Git"
text = "After criss-cross merges, two branches can have more than one best common ancestor, which `git merge-base --all` lists; Git's default merge strategy first merges those ancestors into a virtual base, then merges your branches against it."

[[note]]
level = "advanced"
topic = "Git"
text = "`git log -S` finds commits that change the number of occurrences of a string, whereas `-G` finds commits whose diff has an added or removed line matching a regex, even if the count stays the same."

[[note]]
level = "advanced"
topic = "Git"
text = "A push of several refs is not all-or-nothing by default: if the server rejects one branch, the others still update. `git push --atomic` asks the server to apply every ref update or none of them."

[[note]]
level = "advanced"
topic = "Git"
text = "A submodule appears in the parent repository's tree as a single entry of mode `160000` holding a commit hash from the other repository, which is why the parent's diff shows only a `Subproject commit` line changing."

[[note]]
level = "advanced"
topic = "Git"
text = "`git bisect run` treats a script's exit code 0 as good, 125 as skip and any other code from 1 to 127 as bad, while codes above 127 abort the bisection."

[[note]]
level = "advanced"
topic = "GitHub"
text = "When several GitHub rulesets target the same branch, their rules are combined and the most restrictive version of each rule applies; rulesets also stack with any classic branch protection rule on that branch."

[[note]]
level = "advanced"
topic = "GitHub"
text = "A pull request diff is a three-dot comparison against the merge base, so commits that land on the base branch after you branched do not appear in it."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Required status checks match by check name, so renaming a CI job leaves protected pull requests waiting for a check that will never report."

[[note]]
level = "advanced"
topic = "GitHub"
text = "For a pull request that merges cleanly, GitHub keeps a trial merge of its head into the base at `refs/pull/<n>/merge`, and CI triggered by the pull request usually tests that merge, not the branch tip you pushed."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Repositories in a fork network share storage, so a commit pushed to any fork can be viewed through the parent repository by its hash, even after the fork is deleted."

[[note]]
level = "advanced"
topic = "Shell"
text = "Inside a subshell or a pipeline stage, `$$` still expands to the PID of the main shell, not the current process; Bash's `$BASHPID` gives the PID of the process actually running, which matters for lock files and `kill`."

[[note]]
level = "advanced"
topic = "Shell"
text = "Without `set -o pipefail`, a pipeline's exit status is that of its last command, so `make | tee build.log` reports success even when the build failed."

[[note]]
level = "advanced"
topic = "Shell"
text = "Bash runs each part of a pipeline in a subshell (unless `shopt -s lastpipe` applies), so variables assigned inside `cmd | while read -r line` are lost when the loop ends."

[[note]]
level = "advanced"
topic = "Linux"
text = "Mounting a file system on a directory hides the files already in it without deleting them, so data written there before the mount still fills the parent file system where `du` can't see it; bind-mount the parent elsewhere to reach it."

[[note]]
level = "advanced"
topic = "Shell"
text = "In `sh -c 'script' a b`, the first argument after the script becomes `$0`, not `$1`, which is why `find -exec sh -c '...' sh {} +` passes a placeholder `sh` first."

[[note]]
level = "advanced"
topic = "Shell"
text = "Bash reports a process killed by a signal as exit status 128 plus the signal number, so 137 means `SIGKILL` (often the OOM killer) and 143 means `SIGTERM`."

[[note]]
level = "advanced"
topic = "Shell"
text = "Command substitution strips every trailing newline from the output, so `$(cat file)` cannot preserve the blank lines at the end of a file."

[[note]]
level = "advanced"
topic = "Shell"
text = "Bash arithmetic reads a leading zero as octal, so `$((08 + 1))` fails with a base error; `$((10#08 + 1))` forces base 10, which matters when parsing dates and times."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Parallel builds with `make -j` expose missing dependency declarations: a target that always happened to build after its prerequisite in serial order may now start first, so the build fails intermittently, depending on timing."

[[note]]
level = "advanced"
topic = "Linux"
text = "Linux load average counts tasks in uninterruptible sleep (state `D`) as well as runnable ones, so stuck disk or NFS I/O can push it high while the CPUs sit idle."

[[note]]
level = "advanced"
topic = "Regex"
text = "Python's `re` module accepts only fixed-width lookbehind, so `(?<=\\$\\d+)` fails with `look-behind requires fixed-width pattern`, while .NET and modern JavaScript engines accept variable-width lookbehind."

[[note]]
level = "advanced"
topic = "Linux"
text = "A zombie process has already exited and released its memory, keeping only its process table entry and PID until its parent calls `wait`; ending the parent lets `init` or a subreaper adopt and reap it."

[[note]]
level = "advanced"
topic = "Linux"
text = "`fork` does not copy a process's memory up front: parent and child share pages copy-on-write, and a page is duplicated only when one side writes to it, so memory use can approach double while a busy parent keeps writing."

[[note]]
level = "advanced"
topic = "Linux"
text = "On local filesystems, permissions are checked when a file is opened, so a process that already holds a descriptor keeps reading after you `chmod` the file or remove the user from its group."

[[note]]
level = "advanced"
topic = "Linux"
text = "Linux ignores the setuid bit on scripts started through `#!`, because the gap between the kernel checking the file and the interpreter opening it let attackers swap the file."

[[note]]
level = "advanced"
topic = "Linux"
text = "On Linux, the kernel passes everything after the interpreter in a `#!` line as a single argument, so `#!/usr/bin/env python3 -u` fails unless you use GNU `env -S`."

[[note]]
level = "advanced"
topic = "Linux"
text = "`fsync` on a new file is not guaranteed to make its directory entry durable; after a crash the file can vanish unless the parent directory is also synced."

[[note]]
level = "advanced"
topic = "Python"
text = "In standard CPython, the GIL lets only one thread run Python bytecode at a time, but it is released during blocking I/O and by many C extensions, so threads still speed up I/O-bound work."

[[note]]
level = "advanced"
topic = "Python"
text = "CPython frees most objects the moment their reference count reaches zero; the cyclic garbage collector exists only to reclaim objects caught in reference cycles."

[[note]]
level = "advanced"
topic = "Python"
text = "String and bytes hashes are randomized per process unless `PYTHONHASHSEED` is set, so iterating a `set` of strings can yield a different order on every run."

[[note]]
level = "advanced"
topic = "Python"
text = "`functools.lru_cache` on a method includes `self` in every cache key, so an instance stays alive while any of its entries remain cached, which with `maxsize=None` means indefinitely."

[[note]]
level = "advanced"
topic = "Python"
text = "Closures capture variables, not values, so lambdas created in a loop all see the loop variable's final value unless it is bound as a default argument."

[[note]]
level = "advanced"
topic = "Python"
text = "Defining `__eq__` in a class without also defining `__hash__` sets `__hash__` to `None`, so its instances become unhashable and can no longer be set members or dictionary keys."

[[note]]
level = "advanced"
topic = "Python"
text = "The `spawn` start method, the default for `multiprocessing` on Windows and macOS, re-imports the main module in every child, so code outside an `if __name__ == \"__main__\":` guard runs again in each worker."

[[note]]
level = "advanced"
topic = "Python"
text = "`round()` in Python 3 rounds halves to the nearest even number, so `round(2.5)` is `2`, and `round(2.675, 2)` gives `2.67` because that float is stored slightly below the half."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Promise callbacks run as microtasks, and the microtask queue drains completely before the next task, so a `setTimeout(fn, 0)` callback waits behind every queued `.then` handler."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "ES module imports are live bindings: if the exporting module later reassigns an exported `let`, every importer sees the new value, whereas a value destructured from `require()` is a one-time copy."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "`Array.prototype.sort` compares elements as strings unless given a comparator, so `[10, 9, 1].sort()` returns `[1, 10, 9]`."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "V8 gives objects hidden classes based on which properties they have and the order they were added in, so objects built with differing property orders, or with properties deleted, can slow down hot code that reads them."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "JavaScript bitwise operators convert numbers to 32-bit integers (signed for all but `>>>`), so `2 ** 32 | 0` is `0` and the `x | 0` idiom silently wraps large values."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "`this` inside an arrow function comes from the enclosing scope and cannot be changed by `call`, `apply` or `bind`, which is why arrow functions make poor object methods."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "`WeakMap` holds its keys weakly, so data attached to an object through a `WeakMap` becomes collectable along with the object, whereas a `Map` keeps both alive."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Node.js treats an unhandled promise rejection as an uncaught exception by default, so a single forgotten `.catch` can crash the whole process."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "A conditional type like `T extends string ? A : B` is applied to each member separately when `T` is a bare type parameter that receives a union; writing `[T] extends [string]` tests the union as a whole."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Type compatibility in TypeScript is structural: any value with the right shape satisfies a type regardless of its class, although a `private` member makes a class compatible only with itself and its subclasses."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Under `strictFunctionTypes`, parameters of function-typed properties are checked contravariantly, but methods declared with method syntax are still checked bivariantly, which is unsound."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Arrays are covariant in TypeScript, so a `Dog[]` can be passed where `Animal[]` is expected and then have a `Cat` pushed into it without a compile error."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Indexing an array or record yields `T`, not `T | undefined`, unless `noUncheckedIndexedAccess` is enabled, so out-of-range reads type-check as if they always succeed."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "A function type that returns `void` still accepts functions that return a value, which is why `items.forEach(x => list.push(x))` type-checks even though `push` returns a number."

[[note]]
level = "advanced"
topic = "Python"
text = "`super()` calls the next class in the instance's method resolution order (`type(self).__mro__`), not necessarily the parent, so under multiple inheritance a mixin's `super().save()` can call a sibling class."

[[note]]
level = "advanced"
topic = "Go"
text = "`append` may write into the existing backing array when capacity allows, so two slices taken from the same parent can silently overwrite each other's elements."

[[note]]
level = "advanced"
topic = "Go"
text = "The Go runtime often detects concurrent writes to a map and stops the program with a fatal error that `recover` cannot catch, rather than a panic."

[[note]]
level = "advanced"
topic = "Go"
text = "`defer` evaluates the deferred call's arguments immediately, when the `defer` statement runs; only the call itself waits until the surrounding function returns."

[[note]]
level = "advanced"
topic = "Go"
text = "Sending on a closed channel panics, receiving from one returns the zero value at once, and both sending and receiving on a nil channel block forever."

[[note]]
level = "advanced"
topic = "Go"
text = "When several `select` cases are ready, Go picks one of them uniformly at random, so listing a case first gives it no priority."

[[note]]
level = "advanced"
topic = "Java"
text = "HotSpot first interprets bytecode and compiles a method to optimized machine code only after it has run many times, so the early iterations of a naive microbenchmark time the interpreter; JMH handles warm-up for you."

[[note]]
level = "advanced"
topic = "Java"
text = "The JVM runs a class's static initializer once, on first use, and guarantees that it is thread-safe, which is why a nested holder class gives a lazily created singleton without explicit locking."

[[note]]
level = "advanced"
topic = "Rust"
text = "Safe Rust prevents data races but not memory leaks: an `Rc` or `Arc` reference cycle is never freed, which is why `std::mem::forget` is not marked `unsafe`."

[[note]]
level = "advanced"
topic = "Rust"
text = "`unsafe` does not switch off the borrow checker; it only permits a few extra operations, such as dereferencing raw pointers and calling `unsafe` functions."

[[note]]
level = "advanced"
topic = "Rust"
text = "`Send` and `Sync` are auto traits: the compiler implements them for a type when all its fields do, which is how a struct holding an `Rc` is kept out of other threads."

[[note]]
level = "advanced"
topic = "Rust"
text = "Rust futures are lazy: calling an `async fn` only builds a state machine, and none of its body runs until the future is awaited or polled."

[[note]]
level = "advanced"
topic = "Rust"
text = "Holding a `std::sync::MutexGuard` across an `.await` makes the whole future `!Send`, so passing it to a spawner that requires `Send`, such as `tokio::spawn`, fails to compile."

[[note]]
level = "advanced"
topic = "Rust"
text = "Rust strings are UTF-8, so `s[0]` does not compile, and slicing with a byte range that splits a multibyte character panics at runtime."

[[note]]
level = "advanced"
topic = "Go"
text = "Deleting keys from a Go map does not shrink it: the map keeps the memory it grew to, so one that once held millions of entries stays large. Copy the remaining entries into a new map to release that memory."

[[note]]
level = "advanced"
topic = "Java"
text = "A `volatile` field guarantees visibility and ordering, but `count++` on it is still a separate read and write, so concurrent increments get lost without an `AtomicInteger` or a lock."

[[note]]
level = "advanced"
topic = "Java"
text = "`-Xmx` limits only the Java heap; thread stacks, metaspace, the code cache and direct buffers live outside it, so a JVM's resident memory can exceed `-Xmx` and trip a container limit."

[[note]]
level = "advanced"
topic = "Java"
text = "Java generics are erased at runtime, so `List<String>` and `List<Integer>` share one class, and two methods cannot be overloaded on those parameter types alone."

[[note]]
level = "advanced"
topic = "Java"
text = "A `return` inside a `finally` block discards any exception thrown in the `try`, so the caller gets a normal result and the error disappears."

[[note]]
level = "advanced"
topic = "Java"
text = "Double-checked locking in Java is broken unless the field is `volatile`, because another thread can see the reference before the constructor's writes become visible."

[[note]]
level = "advanced"
topic = "C"
text = "Signed integer overflow is undefined behavior in C, so the compiler may assume `x + 1 > x` always holds and delete an overflow check written that way."

[[note]]
level = "advanced"
topic = "C"
text = "`strncpy` adds no terminating null when the source is at least as long as the limit, and it pads shorter copies with zeros up to the full length."

[[note]]
level = "advanced"
topic = "C"
text = "`volatile` in C stops the compiler from caching or removing accesses, but it makes nothing atomic and orders nothing between threads; that takes `_Atomic` or locks."

[[note]]
level = "advanced"
topic = "C"
text = "Reading an object through a pointer to an incompatible type breaks strict aliasing, so pointer-cast type punning can miscompile at higher optimization levels; `memcpy` is the portable way."

[[note]]
level = "advanced"
topic = "C"
text = "Plain `char` is signed on x86 but unsigned on ARM Linux, so storing `getchar()` results or bytes above 127 in a `char` behaves differently across platforms."

[[note]]
level = "advanced"
topic = "C"
text = "`p = realloc(p, n)` leaks the original block when `realloc` fails, because it returns `NULL` but leaves the old allocation in place."

[[note]]
level = "advanced"
topic = "C"
text = "`errno` is meaningful only right after a call reports failure, since successful library calls are allowed to change it."

[[note]]
level = "advanced"
topic = "SQL"
text = "A foreign key declared `DEFERRABLE INITIALLY DEFERRED` is checked at commit instead of after each statement, so one transaction can insert two rows that reference each other in either order. PostgreSQL and SQLite support it; MySQL does not."

[[note]]
level = "advanced"
topic = "SQL"
text = "A B-tree index on `(a, b)` is sorted by `a` first, so it serves filters on `a` or on `a` and `b`, but a filter on `b` alone can use it only through a full or skip scan."

[[note]]
level = "advanced"
topic = "SQL"
text = "In PostgreSQL, `SELECT ... FOR UPDATE` over a join locks the matching rows of every joined table; `FOR UPDATE OF orders` locks only the `orders` rows and leaves lookup tables free for other writers."

[[note]]
level = "advanced"
topic = "SQL"
text = "A filter such as `r.status = 'active'` on the right table of a `LEFT JOIN`, placed in `WHERE` instead of `ON`, removes the null-extended rows and quietly makes it an inner join."

[[note]]
level = "advanced"
topic = "Databases"
text = "In PostgreSQL, adding a column with a constant default is a quick catalog change, but a volatile default such as `clock_timestamp()` or `gen_random_uuid()` rewrites the whole table under an exclusive lock."

[[note]]
level = "advanced"
topic = "SQL"
text = "Query parameters protect values only: table names, column names and sort directions cannot be bound as parameters, so they need an allowlist."

[[note]]
level = "advanced"
topic = "SQL"
text = "Window functions are evaluated after `WHERE`, `GROUP BY` and `HAVING`, so filtering on `ROW_NUMBER()` in standard SQL requires a subquery or CTE."

[[note]]
level = "advanced"
topic = "Databases"
text = "PostgreSQL delivers a `NOTIFY` only when the sending transaction commits, and only to sessions listening at that moment, so a listener that reconnects misses everything sent while it was away."

[[note]]
level = "advanced"
topic = "Databases"
text = "PostgreSQL defaults to Read Committed and MySQL's InnoDB to Repeatable Read, so the same transaction code can see different data after moving between them."

[[note]]
level = "advanced"
topic = "Databases"
text = "Repeatable Read in PostgreSQL is snapshot isolation, which still permits write skew: two transactions read the same data, then write different rows, and together break an invariant that only `SERIALIZABLE` or explicit locking protects."

[[note]]
level = "advanced"
topic = "Data"
text = "A trend that holds in every group can reverse when the groups are combined, known as Simpson's paradox: one treatment can do better for both mild and severe cases yet worse overall, because it got more of the severe ones."

[[note]]
level = "advanced"
topic = "Data"
text = "Parquet stores minimum and maximum values for each column chunk, so query engines skip row groups that cannot match a filter; sorting data by a commonly filtered column before writing makes that skipping far more effective."

[[note]]
level = "advanced"
topic = "Databases"
text = "Sequence values in PostgreSQL are never rolled back, so identity columns develop gaps after failed inserts and cannot serve as gapless invoice numbers."

[[note]]
level = "advanced"
topic = "Databases"
text = "`SELECT COUNT(*)` in PostgreSQL must scan the table or an index, because under MVCC each transaction may see a different set of rows, so no single stored count exists."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Dijkstra's algorithm assumes no edge has a negative weight; with one, it can finalize a node too early and return a wrong shortest path. Bellman-Ford handles negative weights and also detects negative cycles."

[[note]]
level = "advanced"
topic = "HTTP"
text = "`Cache-Control: no-cache` does not forbid caching; it lets caches store the response but requires revalidation before each reuse, whereas `no-store` forbids storing it at all."

[[note]]
level = "advanced"
topic = "HTTP"
text = "HTTP/2 multiplexes many streams over one TCP connection, so a single lost packet stalls every stream until it is retransmitted; HTTP/3 runs over QUIC partly to remove that head-of-line blocking."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Clients may turn a `POST` into a `GET` when following a 301 or 302 redirect, while 307 and 308 require the method and body to be preserved."

[[note]]
level = "advanced"
topic = "Web"
text = "The back/forward cache restores a page from memory with its JavaScript state intact and fires `pageshow` with `event.persisted` set to `true` instead of reloading, so data fetched only on load can be stale."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Browsers, link previewers and crawlers send `GET` requests freely, so an endpoint that changes state on `GET` will be triggered by visits nobody intended."

[[note]]
level = "advanced"
topic = "HTTP"
text = "A shared cache keys responses by URL unless `Vary` names the request headers that change them, so a missing `Vary: Accept-Encoding` or `Vary: Cookie` can serve one client's variant to another."

[[note]]
level = "advanced"
topic = "Web"
text = "A service worker controls only pages under the path its script is served from, so `/js/sw.js` cannot control `/` unless the response widens the allowed scope with a `Service-Worker-Allowed` header."

[[note]]
level = "advanced"
topic = "APIs"
text = "An idempotency key makes a `POST` safe to retry: the server stores the first result under the client-supplied key and returns it again for any duplicate request."

[[note]]
level = "advanced"
topic = "APIs"
text = "Offset pagination can skip or repeat items when rows are inserted or deleted between page requests, while cursor pagination anchored to the last seen key stays consistent."

[[note]]
level = "advanced"
topic = "APIs"
text = "Exponential backoff without jitter keeps clients that failed together retrying together, so each retry wave hits the recovering service as a synchronized spike."

[[note]]
level = "advanced"
topic = "APIs"
text = "Webhooks are usually delivered at least once and in no guaranteed order, so a handler can see the same event twice, or an old event after a newer one."

[[note]]
level = "advanced"
topic = "Web"
text = "Cookies are isolated by host but not by port, so two services on different ports of the same host can read and overwrite each other's cookies."

[[note]]
level = "advanced"
topic = "Web"
text = "`SameSite=Lax` cookies still go out on top-level `GET` navigations from other sites, but not on cross-site `POST` submissions, iframes or `fetch` calls."

[[note]]
level = "advanced"
topic = "Web"
text = "CORS mainly controls what a browser page may read: a simple cross-origin `POST` is still sent and processed by the server, only its response is hidden, and non-browser clients ignore CORS entirely."

[[note]]
level = "advanced"
topic = "Web"
text = "`HttpOnly` hides a cookie from JavaScript, yet the browser still attaches it to matching requests, so it limits token theft through XSS but does nothing against CSRF."

[[note]]
level = "advanced"
topic = "Web"
text = "Chromium-based browsers and Firefox treat pages served from `localhost` as a secure context even over plain HTTP, so features that require HTTPS work locally and then fail on an HTTP staging host."

[[note]]
level = "advanced"
topic = "Web"
text = "Reading a layout property such as `offsetHeight` right after changing styles forces the browser to compute layout synchronously, and doing it in a loop causes layout thrashing."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "`role=\"button\"` on a `div` only changes what assistive technology announces; the element still gets no keyboard focus and no Enter or Space activation unless you add them."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "`display: none` and `visibility: hidden` hide content from screen readers as well as from sight, so text meant only for screen readers needs a visually hidden clipping style instead."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "`aria-hidden=\"true\"` removes an element from the accessibility tree but not from the tab order, so a focusable child can still receive keyboard focus while hidden from screen readers."

[[note]]
level = "advanced"
topic = "Security"
text = "Comparing a secret token with `==` can leak it through timing, because the comparison usually stops at the first mismatched byte; `hmac.compare_digest` and similar functions avoid that early exit."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "A package page's repository link, and the stars shown beside it, are whatever the publisher entered unless the registry marks them as verified, so a malicious package can borrow a popular project's reputation."

[[note]]
level = "advanced"
topic = "Security"
text = "A server-side URL fetcher that can reach internal addresses exposes cloud metadata endpoints such as `169.254.169.254`, which can hand instance credentials to an attacker."

[[note]]
level = "advanced"
topic = "Security"
text = "A signed JWT is encoded, not encrypted: anyone holding it can base64-decode the payload, so it must not carry data the bearer should not read."

[[note]]
level = "advanced"
topic = "Security"
text = "bcrypt uses at most 72 bytes of its input: some implementations reject longer passwords, while others silently ignore the excess, so two long passwords sharing their first 72 bytes hash identically."

[[note]]
level = "advanced"
topic = "Security"
text = "Checking a path with `access()` and then opening it leaves a window in which an attacker can swap in a symlink; checks made on the already opened descriptor, such as `fstat`, do not have that race."

[[note]]
level = "advanced"
topic = "Security"
text = "Deserializing untrusted input with Python's `pickle` or Java's native serialization can execute arbitrary code, because the data itself decides which objects are built and which methods run."

[[note]]
level = "advanced"
topic = "Security"
text = "Command-line arguments are visible to every local user through `ps` and `/proc/<pid>/cmdline` on typical Linux systems, so a password passed as a flag is exposed."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Encryption without authentication, such as AES-CBC alone, lets an attacker modify ciphertext undetected, while AEAD modes like AES-GCM and ChaCha20-Poly1305 reject tampered messages."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "GitHub generates a tag's Source code archives on demand, and in early 2023 a Git upgrade changed their compressed bytes and broke builds that pinned their checksums. Pin checksums only for assets you upload yourself."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Computing a MAC as `sha256(key + message)` is open to length extension, letting an attacker append data and produce a valid tag; HMAC's construction is immune to it."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "On a flat JVM classpath the first JAR containing a class wins, so two libraries needing different versions of one dependency both get whichever comes first; shading gives a library its own renamed copy."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Ephemeral Diffie-Hellman gives forward secrecy: a server key stolen later cannot decrypt recorded sessions, and every full TLS 1.3 handshake uses it."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "ECB mode encrypts identical plaintext blocks to identical ciphertext blocks, so patterns in the data, such as the outline of an image, survive encryption."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "A password salt does not need to be secret: its job is to make identical passwords hash differently and make precomputed tables useless, so it is stored in plain text next to the hash."

[[note]]
level = "advanced"
topic = "Versioning"
text = "On Linux, a shared library carries a soname such as `libssl.so.3` that programs record when they are linked; a library whose ABI breaks gets a new soname, so old and new major versions can be installed side by side."

[[note]]
level = "advanced"
topic = "Releases"
text = "Routing canary traffic per request lets one user's page loads hop between old and new versions, mixing assets, API shapes and cached data; assigning canary cohorts per user or session keeps each experience consistent."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "By default a `.pyc` file stores its source file's modification time. Hash-based `.pyc` files, made with `python -m compileall --invalidation-mode checked-hash`, store a source hash instead, so their bytes do not depend on checkout time."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Installing a Python source distribution runs its build backend, including any `setup.py`, so `pip install` of an sdist executes the package's code before you ever import it."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Go's minimal version selection builds with the lowest version that satisfies every `go.mod` requirement, not the newest release, so upgrades happen only when some module asks for them."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Cargo can link two semver-incompatible versions of one crate into a single binary as different crates, so their types do not interoperate even when they look identical."

[[note]]
level = "advanced"
topic = "Go"
text = "A small slice cut from a large one keeps the whole backing array reachable, so keeping `buf[:16]` of a 100 MB read pins all 100 MB. Copy the part you need, for example with `bytes.Clone(buf[:16])`."

[[note]]
level = "advanced"
topic = "Code review"
text = "Hunks in a diff are computed, not recorded: Git's default Myers algorithm can pair unrelated lines such as lone closing braces, so the same change may read far more clearly with `--diff-algorithm=histogram` or `patience`."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Semantic Versioning treats `0.y.z` as initial development where anything may change, and npm's caret follows suit: `^0.2.3` allows only `0.2.x`, not `0.3.0`."

[[note]]
level = "advanced"
topic = "Versioning"
text = "In SemVer, a pre-release sorts before its release, numeric identifiers compare as numbers (`rc.2` before `rc.10`), and build metadata after `+` is ignored for precedence."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Python versions follow PEP 440, not SemVer: `1.0.dev1` sorts before `1.0a1`, and `1.0.post1` sorts after `1.0`."

[[note]]
level = "advanced"
topic = "Testing"
text = "Line coverage records which lines ran, not whether any assertion checked their results, so a suite can reach full coverage while verifying almost nothing."

[[note]]
level = "advanced"
topic = "Testing"
text = "Mutation testing makes small changes to the code, such as turning `<` into `<=`, and reports every mutant your tests fail to catch, which measures what coverage cannot."

[[note]]
level = "advanced"
topic = "Testing"
text = "Property-based testing generates many inputs from a specification and, when one fails, shrinks it to a minimal counterexample, often finding edge cases nobody thought to write."

[[note]]
level = "advanced"
topic = "Testing"
text = "Running a test suite in random order exposes tests that pass only because an earlier test left shared state behind, a common source of flakiness."

[[note]]
level = "advanced"
topic = "Debugging"
text = "`strace -f` shows every system call a program and its children make on Linux, so a failing `open` or `openat` with `ENOENT` reveals exactly which file path a tool was looking for."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Adding logging or attaching a debugger changes a program's timing, so race conditions often disappear while you observe them and return in production."

[[note]]
level = "advanced"
topic = "Debugging"
text = "AddressSanitizer (`-fsanitize=address` in GCC and Clang) reports out-of-bounds accesses and use-after-free where they happen, rather than where the corrupted memory later causes a crash."

[[note]]
level = "advanced"
topic = "Debugging"
text = "In optimized builds the compiler reorders, inlines and removes code, so a debugger may jump between lines or report variables as optimized out even though the program is correct."

[[note]]
level = "advanced"
topic = "CI"
text = "A passing check on a pull request tested it against the base branch as it was then, so once other pull requests merge, the combination is untested until something reruns it; merge queues close that gap."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Scaling a StatefulSet down removes its highest-numbered pods but by default keeps their PersistentVolumeClaims, so scaling back up reattaches each ordinal to its old data; `persistentVolumeClaimRetentionPolicy` changes that."

[[note]]
level = "advanced"
topic = "CI"
text = "Automatic retries of failed tests turn intermittent failures green, so real race conditions in the code under test go unreported until they appear in production."

[[note]]
level = "advanced"
topic = "Containers"
text = "Containers share the host kernel, so a kernel vulnerability can break isolation between them, whereas each virtual machine runs its own kernel."

[[note]]
level = "advanced"
topic = "Containers"
text = "Deleting a file in a later Dockerfile instruction does not shrink the image, because the file still exists in the earlier layer; it has to be removed in the same `RUN` that created it."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Server-side apply records a field manager for every field, so when a second tool applies a different value to a field another manager owns, the request fails with a conflict instead of silently overwriting it; `--force-conflicts` takes ownership."

[[note]]
level = "advanced"
topic = "Cloud"
text = "When AWS Lambda runs a function asynchronously, as for S3 or SNS events, it retries a failed invocation twice by default, and an event can occasionally arrive more than once anyway, so handlers must be idempotent."

[[note]]
level = "advanced"
topic = "Linux"
text = "`/proc/<pid>/environ` shows the environment a process started with, not what it has changed since: variables set later with `setenv` or `os.environ` usually do not appear there, so it can disagree with what the program actually uses."

[[note]]
level = "advanced"
topic = "Containers"
text = "`EXPOSE` records a port in image metadata but publishes nothing; the port is reachable from the host only when mapped with `-p`, or with `-P`, which publishes every exposed port."

[[note]]
level = "advanced"
topic = "Containers"
text = "With default bridge networking, `localhost` inside a container means the container itself, so an app bound to `127.0.0.1` cannot receive published traffic and the host's loopback services are out of reach."

[[note]]
level = "advanced"
topic = "CI"
text = "Build tools such as Bazel key each cached result on a hash of every input to that build or test step, so with a shared remote cache CI skips targets whose inputs did not change; this only holds when steps are hermetic."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "A failed CloudFormation update rolls back on its own, but if the rollback fails too, the stack sits in `UPDATE_ROLLBACK_FAILED` and accepts no updates until you run `continue-update-rollback`, which can skip resources that cannot roll back."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "GitHub Actions expressions ignore case when comparing strings: `==`, `contains()` and `startsWith()` all do, so a condition written for the branch `release` also matches `Release`. Do case-sensitive checks in a shell step."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Hitting a memory limit gets a container OOM-killed once the kernel cannot reclaim enough, while hitting a CPU limit only slows it down, because CPU time can be withheld but memory in use cannot."

[[note]]
level = "advanced"
topic = "Rust"
text = "`Option<&T>`, `Option<Box<T>>` and `Option<NonZeroU32>` take no more space than the value inside, because Rust stores `None` in a bit pattern the inner type can never hold, such as the null pointer."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Windows screen readers such as NVDA and JAWS read pages in a virtual browse mode that takes over letter keys for quick navigation, and switch to a focus or forms mode in fields and widgets, which is why custom widgets need correct roles to get keystrokes."

[[note]]
level = "advanced"
topic = "Code review"
text = "Two pull requests that touch different lines can still break each other, such as one renaming a function the other starts calling; each passed review and CI against the old `main`, so the failure appears only after both merge."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Standard S3 buckets and most object stores have no real directories: a prefix is just part of each key, so renaming a folder means copying and deleting every object under it."

[[note]]
level = "advanced"
topic = "Cloud"
text = "In AWS IAM, an explicit `Deny` in any applicable policy overrides every `Allow`, so a deny in a service control policy cannot be granted back further down."

[[note]]
level = "advanced"
topic = "Rust"
text = "Generic Rust functions are monomorphized: the compiler emits a separate copy for each concrete type they are used with, which makes calls fast but grows binaries and compile times; `&dyn Trait` compiles once and dispatches through a vtable."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Terraform state can contain secrets in plain text, such as generated database passwords, even when they are marked `sensitive`, which only hides them from CLI output."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "A `<section>` element is exposed as a region landmark only when it has an accessible name, for example via `aria-labelledby` pointing at its heading; unnamed sections add nothing to the landmark list."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Terraform resources created with `count` are keyed by index, so removing an item from the middle of the list shifts the rest and recreates them; `for_each` keys by name instead."

[[note]]
level = "advanced"
topic = "Networking"
text = "TCP delivers a byte stream, not messages: one `send` can arrive split across several `recv` calls and several sends can arrive merged, so protocols need their own framing."

[[note]]
level = "advanced"
topic = "Networking"
text = "The side that closes a TCP connection first keeps it in `TIME_WAIT` for twice the maximum segment lifetime, so a client opening many short connections can exhaust its ephemeral ports."

[[note]]
level = "advanced"
topic = "Networking"
text = "When a link is saturated, oversized buffers in routers and modems queue packets instead of dropping them, so latency for everything on that link can climb to hundreds of milliseconds; this is called bufferbloat."

[[note]]
level = "advanced"
topic = "Networking"
text = "If ICMP \"fragmentation needed\" messages are blocked, path MTU discovery fails silently: small packets get through and large ones vanish, so connections hang after the handshake."

[[note]]
level = "advanced"
topic = "Networking"
text = "With Linux defaults, `connect` to a host that silently drops SYN packets keeps retrying for about two minutes, so clients need their own connect timeout."

[[note]]
level = "advanced"
topic = "DNS"
text = "When a domain's nameservers live inside the domain itself, such as `ns1.example.com` serving `example.com`, the parent zone must also publish their addresses as glue records, or resolvers could never reach them."

[[note]]
level = "advanced"
topic = "Networking"
text = "\"Connection refused\" usually means a TCP reset came back because nothing listens on that port, while a connect timeout means no answer at all, typically from a firewall silently dropping packets or a host that is down."

[[note]]
level = "advanced"
topic = "Observability"
text = "Prometheus `increase()` extrapolates to the edges of its range window, so over a counter that only moves in whole steps it can return a fraction like 2.5; read it as an estimate, not an exact count of events."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Gray failures, such as a disk that is slow but not dead or a node that drops some requests, often do more damage than clean crashes, because health checks keep passing and automatic failover never triggers."

[[note]]
level = "advanced"
topic = "DNS"
text = "DNS falls back to TCP when a response is too large for UDP, so a firewall that blocks TCP port 53 breaks only some lookups, typically those with DNSSEC or many records."

[[note]]
level = "advanced"
topic = "Architecture"
text = "A thin event such as `order 42 changed` makes every consumer call the source service back for details, so each event multiplies load on it, while an event carrying the new state lets consumers work alone, at the cost of larger, versioned payloads."

[[note]]
level = "advanced"
topic = "DNS"
text = "Some clients cache DNS answers on their own terms, ignoring or extending TTLs, so lowering a TTL before a migration only helps resolvers and applications that honor it."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "No known algorithm solves NP-hard problems such as the traveling salesman or bin packing quickly for every input, so real schedulers and route planners settle for heuristics, approximations or time-limited solvers."

[[note]]
level = "advanced"
topic = "Performance"
text = "Amdahl's law caps parallel speedup by the serial fraction: if 10% of the work cannot be parallelized, no number of cores makes it more than 10 times faster."

[[note]]
level = "advanced"
topic = "Performance"
text = "As a server's utilization approaches 100%, queueing delay grows without bound, so response times at 90% load are several times worse than at 50% even though capacity remains."

[[note]]
level = "advanced"
topic = "Performance"
text = "Two threads writing different variables that share a cache line force that line to bounce between cores, an effect called false sharing that can make parallel code slower than serial."

[[note]]
level = "advanced"
topic = "Performance"
text = "Load generators that wait for each response before sending the next request stop sending during a stall, so they underreport latency, a flaw known as coordinated omission."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "In a livelock, threads keep reacting to each other, such as two that retry after a conflict with the same fixed delay, so none is blocked yet none makes progress; random jitter in the retry delay breaks the symmetry."

[[note]]
level = "advanced"
topic = "Performance"
text = "Traversing a linked list is often far slower than scanning an array of the same length, because each node can be a cache miss while an array streams through the prefetcher."

[[note]]
level = "advanced"
topic = "Testing"
text = "Differential testing feeds the same inputs to two implementations, such as the old and new version of a parser or your code and a reference library, and flags any disagreement, so no expected outputs need to be written."

[[note]]
level = "advanced"
topic = "Observability"
text = "Averaging p99 latencies across hosts does not give a p99 of anything; percentiles have to be computed from merged histograms or raw data."

[[note]]
level = "advanced"
topic = "Teams"
text = "Little's law applies to a team's work queue: average lead time equals work in progress divided by throughput, so starting more tasks at once, at the same delivery rate, makes each one take longer to finish."

[[note]]
level = "advanced"
topic = "Observability"
text = "Counters reset to zero when a process restarts, which Prometheus's `rate()` and `increase()` account for, while naive subtraction of two samples produces negative or wildly wrong values."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Deploys and configuration changes trigger a large share of outages, so rolling back the most recent change is often the fastest mitigation, even before anyone understands the cause."

[[note]]
level = "advanced"
topic = "HTTP"
text = "A response with no `Cache-Control` or `Expires` header can still be cached: if it carries `Last-Modified`, caches may reuse it heuristically for a fraction of the time since then, commonly 10%."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Code with no data races can still have race conditions: two correctly locked steps, like checking a balance and then withdrawing, can interleave with another thread between them."

[[note]]
level = "advanced"
topic = "Performance"
text = "Freeing memory often does not shrink a process: allocators such as glibc `malloc` keep many freed pages for reuse rather than returning them to the OS, so a resident size that stays high after a spike is not proof of a leak."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Compilers and CPUs reorder memory operations, so without locks or atomics, one thread can observe another thread's writes in a different order than they appear in the code."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Condition variables can wake a waiter spuriously or after another thread has already consumed the state change, so every wait belongs inside a loop that rechecks its condition."

[[note]]
level = "advanced"
topic = "Documentation"
text = "Sphinx's `autodoc` extension documents Python code by importing each module, not by parsing it, so anything a module does at import time, such as reading settings or opening connections, also runs during the docs build."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Tasks that block waiting for other tasks submitted to the same bounded thread pool can deadlock once every worker is busy waiting, with the tasks they need stuck in the queue."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "In event-loop runtimes such as `asyncio` and Node.js, one blocking call or CPU-heavy callback stalls every other task, because the loop regains control only when the running code yields."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "By the birthday bound, 64-bit random IDs reach even odds of a collision after about five billion values, near 2^32, far sooner than the size of the 2^64 space suggests."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Hash tables are O(1) on average but O(n) when keys collide, and attackers who choose keys can force collisions unless the hash function is keyed, which is why many runtimes randomize string hashing."

[[note]]
level = "advanced"
topic = "C"
text = "C leaves the evaluation order of function arguments unspecified, so `f(next(), next())` may call either `next()` first, and modifying a variable twice without sequencing, as in `i = i++ + 1`, is undefined behavior."

[[note]]
level = "advanced"
topic = "HTTP"
text = "`Set-Cookie` is the one common header that cannot be folded into a comma-separated list, because cookie attributes such as `Expires` contain commas, so each cookie needs its own header line."

[[note]]
level = "advanced"
topic = "Data"
text = "`NaN` is not equal to itself and is neither less nor greater than any number, so a single `NaN` can scramble a sort and slip past deduplication or equality joins."

[[note]]
level = "advanced"
topic = "Data"
text = "Spreadsheet apps convert values that look like dates or numbers on import, which is why human gene symbols such as `SEPT2` were renamed and why leading zeros vanish from ZIP codes."

[[note]]
level = "advanced"
topic = "Data"
text = "CSV has no single enforced standard: RFC 4180 describes a common dialect, but delimiters, quoting, line endings and encodings vary between tools, so round trips can corrupt data."

[[note]]
level = "advanced"
topic = "Data"
text = "Columnar formats such as Parquet store each column contiguously, so a query that reads three columns of a wide table reads only those columns, and similar values compress well together."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Linux file names are byte strings that may hold any byte except `/` and NUL, so they need not be valid UTF-8; Python represents undecodable bytes as lone surrogates (`surrogateescape`), and `os.fsencode()` recovers the original bytes."

[[note]]
level = "advanced"
topic = "Regex"
text = "In Python, `$` also matches just before a trailing newline, so `^\\d+$` accepts `\"123\\n\"`; `re.fullmatch` or `\\Z` anchors to the true end of the string."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Text labeled ISO-8859-1 is often really Windows-1252, which puts the euro sign, curly quotes and dashes in bytes 0x80 to 0x9F; for that reason the WHATWG Encoding Standard that browsers follow decodes a `latin1` label as windows-1252."

[[note]]
level = "advanced"
topic = "Regex"
text = "In GNU `grep -E` and GNU `sed`, `\\d` matches a literal `d`, not a digit: POSIX regular expressions spell digits `[0-9]` or `[[:digit:]]`, and GNU grep accepts Perl's `\\d` only with `-P`."

[[note]]
level = "advanced"
topic = "Unicode"
text = "The same visible `é` can be one code point (U+00E9) or `e` followed by a combining accent (U+0301), and the two compare unequal until both are normalized, for example to NFC."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Case-insensitive matching needs case folding, not lowercasing: `\"Straße\".lower()` keeps the `ß`, while `casefold()` turns it into `ss`, so it matches `\"STRASSE\"`."

[[note]]
level = "advanced"
topic = "Time"
text = "Unix time treats every day as exactly 86,400 seconds, so leap seconds are not counted: subtracting two timestamps that straddle one gives a result one second short of the true elapsed time."

[[note]]
level = "advanced"
topic = "Time"
text = "On Linux, `CLOCK_MONOTONIC` stops while the system is suspended, so a timeout measured with it ignores time spent asleep; `CLOCK_BOOTTIME` is also monotonic but keeps counting through suspend."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Sorting strings by code point is not alphabetical order in most languages: accented letters such as `é` land after `z`, and correct order needs locale-aware collation."

[[note]]
level = "advanced"
topic = "Time"
text = "The wall clock can jump backward or forward when NTP steps it or someone changes it, so durations should be measured with a monotonic clock such as `time.monotonic()` or `CLOCK_MONOTONIC`."

[[note]]
level = "advanced"
topic = "Time"
text = "Around daylight saving transitions some local times never happen and others happen twice, so a local timestamp without an offset can be missing or ambiguous."

[[note]]
level = "advanced"
topic = "Time"
text = "A future appointment stored as UTC breaks if the time zone's rules change before the date, so future local events are safer stored as local time plus a zone ID such as `Europe/Paris`."

[[note]]
level = "advanced"
topic = "Time"
text = "A fixed offset like `-05:00` is not a time zone: it cannot tell you when daylight saving applies, whereas an IANA zone such as `America/New_York` carries the rules."

[[note]]
level = "advanced"
topic = "Time"
text = "`datetime.utcnow()` returns a naive datetime, so calling `.timestamp()` on it treats the value as local time and yields the wrong instant unless the machine runs in UTC."

[[note]]
level = "advanced"
topic = "Code review"
text = "A diff shows what changed, not what should have changed: a missing test, a caller that was not updated or an absent error path never appears in the lines under review."

[[note]]
level = "advanced"
topic = "Documentation"
text = "Python docstrings are runtime objects stored in `__doc__`, so tools like `help()` and `doctest` read them, and `python -OO` strips them, breaking code that relies on them."

[[note]]
level = "advanced"
topic = "APIs"
text = "In GraphQL, an error in a non-null field nulls out its nearest nullable parent, so marking many fields non-null lets one failing resolver blank out a whole section of the response."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Writing to a database and publishing an event are two separate operations, so a crash between them loses one; the outbox pattern stores the event in the same transaction and publishes it afterward."

[[note]]
level = "advanced"
topic = "Documentation"
text = "The C4 model draws software architecture at four zoom levels: system context, containers (separately running units such as an app or a database), components and code, so each diagram answers one question for one audience."

[[note]]
level = "advanced"
topic = "Architecture"
text = "When a hot cache key expires, every request that misses at the same moment goes to the backend at once, a thundering herd that request coalescing or early refresh prevents."

[[note]]
level = "advanced"
topic = "Releases"
text = "Feature flags separate deploying code from releasing it: code ships turned off and is enabled later, so rolling back a feature becomes a configuration change rather than a deploy."

[[note]]
level = "advanced"
topic = "C"
text = "Because dereferencing a null pointer is undefined, GCC may delete an `if (p == NULL)` check that comes after `*p` has already been read. The Linux kernel builds with `-fno-delete-null-pointer-checks` for this reason."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Build tools that embed the current time make every build byte-different; honoring the `SOURCE_DATE_EPOCH` environment variable is the common convention for fixing those timestamps."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "`tar` records file order, modification times and owners, so identical files can produce different archives; GNU tar's `--sort=name`, `--mtime` and `--owner` options normalize them."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Floating-point results can differ across CPUs, compilers and optimization flags, for example when fused multiply-add is used, so bit-identical numeric output across machines is not guaranteed."

[[note]]
level = "advanced"
topic = "APIs"
text = "In proto3, a scalar field holding its default value, such as `0` or an empty string, is not written to the wire, so the receiver cannot tell it from an unset field unless the field is declared `optional`."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Each line of a Makefile recipe runs in its own shell, so a `cd` or variable assignment on one line has no effect on the next unless the lines are joined or GNU make's `.ONESHELL` is set."

[[note]]
level = "advanced"
topic = "Tooling"
text = "`make` decides what to rebuild by comparing modification times, so a file restored with an old timestamp or a skewed clock can make it skip work that is needed."

[[note]]
level = "advanced"
topic = "Tooling"
text = "`git blame` can skip bulk formatting commits listed in the file named by `blame.ignoreRevsFile`, attributing each line to the last meaningful change instead of the reformat."

[[note]]
level = "advanced"
topic = "Teams"
text = "Conway's law observes that systems tend to mirror the communication structure of the organizations that build them, so reorganizing teams tends to reshape the architecture too."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Build provenance records which source, workflow and steps produced an artifact. `actions/attest-build-provenance` signs it with Sigstore, and anyone can check it with `gh attestation verify`."

[[note]]
level = "professional"
topic = "Networking"
text = "Routers spread traffic over equal-cost paths by hashing each flow's addresses and ports, so every packet of one connection takes the same path: a single large transfer cannot use more than one link, and one faulty link hurts only the flows hashed onto it."

[[note]]
level = "professional"
topic = "Incidents"
text = "The Swiss cheese model, from psychologist James Reason, pictures each defense as a slice with holes: an accident happens only when the holes in every layer line up, so tightening any one layer can stop it."

[[note]]
level = "professional"
topic = "Incidents"
text = "MTTR is ambiguous: teams use it for mean time to repair, recover, restore or respond, so MTTR figures from different organizations or tools are rarely comparable without their definitions."

[[note]]
level = "professional"
topic = "Incidents"
text = "Mitigation and resolution are separate milestones: a rollback or failover can end customer impact quickly, while the fix for the underlying defect can ship days later without extending the outage."

[[note]]
level = "professional"
topic = "Incidents"
text = "A blameless postmortem assumes people made reasonable decisions with the information they had, which surfaces the conditions that made an error easy instead of teaching engineers to hide their mistakes."

[[note]]
level = "professional"
topic = "Incidents"
text = "The incident commander role comes from the Incident Command System, first built for wildfire response: one person coordinates and delegates the hands-on work, so someone always holds the whole picture."

[[note]]
level = "professional"
topic = "Observability"
text = "An SLA is a contract with consequences such as service credits, while an SLO is an internal target; SLOs are usually set stricter than the SLA so a team is warned well before it owes anyone anything."

[[note]]
level = "professional"
topic = "Observability"
text = "An error budget is the unreliability an SLO permits: a 99.9% availability target over 30 days allows about 43 minutes of downtime, and a 99.99% target allows about 4.3 minutes."

[[note]]
level = "professional"
topic = "Observability"
text = "When you keep only a sample of events, recording the sample rate on each kept event lets queries weight events by it and still report correct totals, even when errors, slow requests and routine traffic are sampled at different rates."

[[note]]
level = "professional"
topic = "SQL"
text = "PostgreSQL's planner treats filter columns as independent, so `city = 'Paris' AND country = 'FR'` gets a row estimate far too low; `CREATE STATISTICS` on the two columns, followed by `ANALYZE`, teaches it the correlation."

[[note]]
level = "professional"
topic = "Databases"
text = "InnoDB stores each table as a B-tree ordered by its primary key, and every secondary index entry carries a copy of that key, so a wide primary key, such as a long string or a composite of several columns, enlarges every index on the table."

[[note]]
level = "professional"
topic = "Databases"
text = "In leaderless stores such as Cassandra, a read is sure to see the latest acknowledged write only when read and write replica counts overlap, R + W > N; with three replicas, `ONE` for both can return stale data."

[[note]]
level = "professional"
topic = "Data"
text = "A gzip file can only be decompressed from its start, so Spark and similar engines hand one huge `.csv.gz` to a single task; many smaller files, or a splittable format such as Parquet, let the work spread across the cluster."

[[note]]
level = "professional"
topic = "Data"
text = "Change data capture tools such as Debezium read the database's write-ahead log or binlog, so they see every committed change in commit order, including writes from scripts and admins that bypass the application."

[[note]]
level = "professional"
topic = "Incidents"
text = "Incident counts make a poor reliability target: a goal on the count rewards not declaring incidents, so a team that declares early and often can be the more reliable one, while a team with few incidents may simply not be reporting them."

[[note]]
level = "professional"
topic = "Observability"
text = "Prometheus `histogram_quantile()` assumes observations are spread evenly within each bucket, so with bucket bounds at 100 ms and 1 s, a p99 that falls between them is interpolated and can be off by hundreds of milliseconds."

[[note]]
level = "professional"
topic = "Observability"
text = "Symptom-based alerts on the errors and latency users see catch failures nobody predicted, while cause-based alerts such as high CPU often fire with no user impact and train on-call engineers to ignore pages."

[[note]]
level = "professional"
topic = "Architecture"
text = "Two-phase commit can block: if the coordinator fails after every participant has voted yes, they must hold their locks until it recovers, since none of them can safely decide alone whether to commit or abort."

[[note]]
level = "professional"
topic = "Observability"
text = "Head-based sampling decides whether to keep a trace when it starts, so it cannot favor traces that later turn out slow or failed; tail-based sampling decides after the trace completes, at the cost of buffering spans."

[[note]]
level = "professional"
topic = "Testing"
text = "Flakiness compounds with suite size: if each of 1,000 tests fails spuriously once in 1,000 runs, about 63 percent of full runs fail for no reason, so a suite of individually reliable tests can still be red most of the time."

[[note]]
level = "professional"
topic = "Architecture"
text = "The CAP theorem only forces a choice during a network partition: a replicated system must then either refuse some requests to stay consistent or keep answering with possibly stale data."

[[note]]
level = "professional"
topic = "Architecture"
text = "PACELC extends CAP: even without a partition, a replicated system must choose between lower latency and stronger consistency, which is the trade-off most systems actually face day to day."

[[note]]
level = "professional"
topic = "Architecture"
text = "Exactly-once delivery is impossible over an unreliable network; systems that advertise exactly-once get exactly-once effects by combining at-least-once delivery with idempotent or transactional processing."

[[note]]
level = "professional"
topic = "Architecture"
text = "Gall's law observes that a complex system that works has always evolved from a simple system that worked, while a complex system designed from scratch never works and cannot be patched into working."

[[note]]
level = "professional"
topic = "Architecture"
text = "A saga replaces one distributed transaction with a chain of local transactions plus compensating actions, which means other readers can observe intermediate states that a single ACID transaction would hide."

[[note]]
level = "professional"
topic = "Architecture"
text = "Retries multiply across layers: when three layers of callers each make up to three attempts, one user request can reach the failing service at the bottom 27 times, right when it is struggling."

[[note]]
level = "professional"
topic = "Architecture"
text = "A metastable failure persists after its trigger is gone: retries, cold caches or queue backlogs keep the system overloaded, so it stays down until load is shed instead of recovering by itself."

[[note]]
level = "professional"
topic = "Architecture"
text = "Cell-based architecture splits a service into independent copies, each serving a subset of customers, so a bad deploy, poison request or noisy tenant takes down one cell rather than the whole service."

[[note]]
level = "professional"
topic = "Architecture"
text = "Shuffle sharding gives each customer a random combination of a few workers out of many, so a customer whose requests crash their workers shares that exact combination with almost no one else."

[[note]]
level = "professional"
topic = "Debugging"
text = "On virtual machines, the `st` (steal) figure in `top` or `vmstat` is time your virtual CPU was ready to run while the hypervisor ran something else; high steal slows a service in ways no profile of its own code can explain."

[[note]]
level = "professional"
topic = "Architecture"
text = "Consensus protocols such as Raft need a majority, so a five-node cluster tolerates two failures while a four-node cluster tolerates only one, which is why consensus clusters usually have an odd number of members."

[[note]]
level = "professional"
topic = "Teams"
text = "Amy Edmondson defines psychological safety as a shared belief that a team is safe for interpersonal risk-taking; Google's Project Aristotle ranked it the most important of the five dynamics it found in effective teams."

[[note]]
level = "professional"
topic = "Teams"
text = "Google's SRE book defines toil as manual, repetitive, automatable, tactical work with no enduring value that grows linearly with the service, and aims to keep it below 50% of each SRE's time."

[[note]]
level = "professional"
topic = "Teams"
text = "Brooks's law says adding people to a late software project makes it later: newcomers need ramp-up time from people who are already busy, and communication paths grow as n(n-1)/2 with team size."

[[note]]
level = "professional"
topic = "Teams"
text = "Goodhart's law, usually paraphrased as 'when a measure becomes a target, it ceases to be a good measure', is why story points, coverage percentages and ticket counts get gamed once they drive performance reviews."

[[note]]
level = "professional"
topic = "Teams"
text = "Team Topologies names four team types (stream-aligned, platform, enabling, complicated-subsystem) and three interaction modes (collaboration, X-as-a-Service, facilitating) for designing team boundaries."

[[note]]
level = "professional"
topic = "Teams"
text = "DORA's four key metrics (deployment frequency, lead time for changes, change failure rate and time to restore service) showed that high-performing teams achieve speed and stability together rather than trading one for the other."

[[note]]
level = "professional"
topic = "Supply chain"
text = "The SolarWinds Orion compromise inserted its backdoor during the build, so customers received a properly signed release even though the source repository looked clean: a signature proves who shipped it, not what went in."

[[note]]
level = "professional"
topic = "Supply chain"
text = "The xz utils backdoor found in 2024 was activated by a modified build script that existed only in the release tarballs, not in the Git repository, so reviewers reading the repository never saw the code that switched it on."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Dependency confusion exploits resolvers that check public registries for names meant to be internal: an attacker publishes the internal name publicly with a higher version, and builds install it instead."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Sigstore keyless signing ties a signature to an OIDC identity through a short-lived Fulcio certificate and records it in the Rekor transparency log, so there is no long-lived private key to steal."

[[note]]
level = "professional"
topic = "Supply chain"
text = "SLSA's build track raises the bar in levels: provenance exists, then it is signed by a hosted build platform, then the platform is hardened so builds cannot tamper with one another or reach the signing key."

[[note]]
level = "professional"
topic = "Supply chain"
text = "A VEX document states whether a product is actually affected by a vulnerability in one of its components, letting scanners suppress findings for vulnerable code that is present but never executed."

[[note]]
level = "professional"
topic = "Security"
text = "CVSS rates how severe a vulnerability is in the abstract, not how likely it is to be exploited; EPSS estimates the probability of exploitation in the next 30 days, and CISA's KEV catalog lists ones already exploited."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "With the default `externalTrafficPolicy: Cluster`, a LoadBalancer or NodePort Service can forward traffic to a pod on another node and source-NATs it, so the pod sees a node IP; `Local` keeps the client IP but uses only nodes with a ready local pod."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "The 2025 `tj-actions/changed-files` compromise made the action dump CI secrets from runner memory into workflow logs, and since logs of public repositories are public, any secret it printed there had to be treated as leaked."

[[note]]
level = "professional"
topic = "Testing"
text = "Canary analysis is more reliable when the canary is compared with a fresh baseline of the old version, deployed at the same time and size, rather than with the long-running fleet, whose warm caches and long uptime bias the comparison."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "A CPU request works as a relative weight: on a busy node, containers get CPU time in proportion to their requests, and on an idle one they can use more, so requests protect a workload without the throttling that CPU limits add."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "CPU limits are enforced with CFS quota per 100 ms period, so a multithreaded container can burn its quota early in the period and then sit throttled, adding latency even when average CPU looks low."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "The Kubernetes scheduler only decides where new pods go and never moves running ones, so after you add nodes or change affinity rules, old placements stay until pods are recreated; the descheduler project exists to evict them for that."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Pods whose containers all set CPU and memory requests equal to their limits get the `Guaranteed` QoS class, which makes them the least likely to be evicted when a node runs short of memory."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "The `terraform_remote_state` data source needs read access to the other configuration's entire state snapshot, secrets included, not just its outputs; publishing shared values to a store such as SSM Parameter Store limits what consumers can see."

[[note]]
level = "professional"
topic = "Cloud"
text = "Committed-use discounts, such as AWS Savings Plans or reserved instances, bill the committed amount for the whole term whether you use it or not, so commit only to the steady baseline you are sure of and leave peaks on demand."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Kubernetes gives a terminating pod `terminationGracePeriodSeconds` (30 seconds by default) before SIGKILL, and any `preStop` hook runs before SIGTERM inside that same budget, so a slow hook leaves less time for the application to shut down."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "PodDisruptionBudgets only limit voluntary disruptions such as node drains and cluster upgrades; they do nothing against involuntary ones like a node crash or a kernel panic."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "etcd enforces a storage quota, 2 GiB by default; when the database hits it, etcd raises a `NOSPACE` alarm and rejects writes, so the Kubernetes API stops accepting changes until you compact, defragment and disarm the alarm."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Kube-proxy balances connections, not requests, so long-lived HTTP/2 connections such as gRPC channels stay pinned to the pods they first reached, and new replicas get no traffic from existing clients."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Node runs `fs` calls, `dns.lookup()`, async `crypto.pbkdf2()` and zlib compression on libuv's thread pool, which has four threads by default, so a burst of slow DNS lookups can queue file reads behind them until `UV_THREADPOOL_SIZE` is raised."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "NetworkPolicy objects are enforced only by a network plugin that implements them; on a cluster whose CNI lacks support, the API accepts the policies and nothing blocks any traffic."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Once any NetworkPolicy selects a pod for ingress, that pod rejects all ingress not allowed by some policy, so the first policy applied in a namespace can cut off traffic nobody thought to list."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "The Horizontal Pod Autoscaler computes replicas as `ceil(current * currentMetric / target)`, and CPU utilization is measured against requests, so pods without CPU requests cannot scale on utilization."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Taints repel pods and tolerations merely permit scheduling onto tainted nodes; a toleration does not attract a pod to those nodes, which is what node affinity is for."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Kubernetes controllers are level-triggered: they repeatedly compare desired and observed state instead of reacting to each event once, so a missed event is corrected on the next reconcile."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "A Deployment's rolling update defaults to 25% `maxUnavailable` and 25% `maxSurge`, and `revisionHistoryLimit` keeps 10 old ReplicaSets by default, which is what `kubectl rollout undo` rolls back to."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "etcd holds all Kubernetes cluster state, so an etcd snapshot restores objects such as Deployments and Secrets but not the data inside persistent volumes, which needs its own backup."

[[note]]
level = "professional"
topic = "Cloud"
text = "Amazon RDS Multi-AZ failover points the database's DNS name at the standby, so clients that cache DNS results for long, such as JVMs set to cache lookups forever, keep trying the failed host; keep client DNS caching short."

[[note]]
level = "professional"
topic = "Containers"
text = "The kernel does not apply default signal actions to PID 1, so a process running as PID 1 in a container ignores SIGTERM unless it installs a handler, and `docker stop` then falls back to SIGKILL after 10 seconds."

[[note]]
level = "professional"
topic = "Containers"
text = "Shell-form `ENTRYPOINT ./server` runs as a subcommand of `/bin/sh -c`, which Docker's documentation warns does not pass signals, so the server may never see the SIGTERM from `docker stop`; exec form `ENTRYPOINT [\"./server\"]` avoids the shell."

[[note]]
level = "professional"
topic = "CI"
text = "CI runners are virtual machines on shared hardware, so their speed varies from run to run, and a benchmark compared with numbers from an earlier run mostly measures that noise. Run the baseline and the candidate in the same job."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "A `GITHUB_TOKEN` stops working when its job finishes, or after 24 hours at most, so a stolen one is useful only while that job is still running, unlike a personal access token, which works until it expires or is revoked."

[[note]]
level = "professional"
topic = "Containers"
text = "Docker publishes container ports by inserting its own iptables rules, which bypass host firewalls such as UFW, so a port published with `-p 8080:80` can be reachable from the internet despite a deny rule."

[[note]]
level = "professional"
topic = "Containers"
text = "Docker gives each container a 64 MB `/dev/shm` by default, which headless browsers and PostgreSQL parallel queries can easily exhaust; `--shm-size` raises the limit."

[[note]]
level = "professional"
topic = "Containers"
text = "With `\"live-restore\": true` in Docker's `daemon.json`, containers keep running while the daemon is stopped or upgraded; without it, restarting `dockerd` shuts down every running container on the host."

[[note]]
level = "professional"
topic = "Containers"
text = "Alpine-based images use musl instead of glibc, so dynamically linked binaries built against glibc generally fail to run there, and Python packages need `musllinux` wheels or a compiler to build from source."

[[note]]
level = "professional"
topic = "Containers"
text = "Without user namespaces, UID 0 inside a container is UID 0 on the host kernel, limited only by dropped capabilities, seccomp and LSMs, so a container escape as root is root on the node."

[[note]]
level = "professional"
topic = "Cloud"
text = "AWS gives a two-minute warning before reclaiming a Spot Instance, so workloads on spot capacity must be able to checkpoint or drain within that window."

[[note]]
level = "professional"
topic = "TypeScript"
text = "`skipLibCheck` skips type checking of every `.d.ts` file, not only those in `node_modules`, so it speeds up large builds but also hides errors in your own hand-written declarations and clashes between two versions of a types package."

[[note]]
level = "professional"
topic = "Cloud"
text = "Most AWS service quotas apply per account and per region, so a failover region whose limits were never raised can refuse to launch the capacity your primary region was running."

[[note]]
level = "professional"
topic = "Code review"
text = "At Google, each change needs an LGTM from a reviewer, approval from an owner of the affected code and approval from someone with readability in the language; a single reviewer can satisfy all three."

[[note]]
level = "professional"
topic = "Cloud"
text = "Amazon S3 is strongly consistent for reads after writes but offers no locks between concurrent writers: two clients writing the same key race and the latest write wins, unless they use conditional writes that check the object first."

[[note]]
level = "professional"
topic = "Cloud"
text = "AWS Lambda reuses execution environments between invocations, so objects created outside the handler, such as database connections, persist across calls, and so does any state you did not mean to keep."

[[note]]
level = "professional"
topic = "Cloud"
text = "AWS KMS never deletes a key immediately: scheduling deletion imposes a waiting period of 7 to 30 days, because data encrypted under a deleted key is unrecoverable."

[[note]]
level = "professional"
topic = "Security"
text = "Zero trust means granting access per request based on verified user and device identity, never on network location, so an attacker who gets onto the internal network or VPN gains no access just by being there."

[[note]]
level = "professional"
topic = "Cloud"
text = "Automatic key rotation in AWS KMS adds new key material for future encryptions but keeps the old material to decrypt existing data, so rotation alone never re-encrypts anything already stored."

[[note]]
level = "professional"
topic = "Cloud"
text = "The 2019 Capital One breach used SSRF through a misconfigured web application firewall to pull IAM credentials from the EC2 metadata service; IMDSv2 blocks that simple kind of SSRF by requiring a session token obtained with a `PUT`."

[[note]]
level = "professional"
topic = "Security"
text = "RFC 4122, the original UUID specification, warns against assuming UUIDs are hard to guess or using them as security capabilities, and its time-based version embeds a timestamp and often a MAC address."

[[note]]
level = "professional"
topic = "Code review"
text = "Linux kernel commits record review in trailers such as `Reviewed-by:`, `Acked-by:` and `Tested-by:`, so who checked a change, and how, stays in the Git history instead of in a review tool that may not outlive it."

[[note]]
level = "professional"
topic = "Testing"
text = "A chaos experiment starts from a steady-state hypothesis: a measurable signal of normal behavior, such as orders completed per minute, that should hold while a fault is injected. Without one, an experiment shows only that something happened."

[[note]]
level = "professional"
topic = "Code review"
text = "Formal code review dates to Michael Fagan's inspections at IBM in the 1970s: scheduled meetings with set roles such as moderator, reader and author. The pull request is a lightweight, asynchronous descendant."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Two installed copies of one library, such as a second one nested under a plugin, make its classes with private members incompatible with each other, and TypeScript rejects mixing them with `Types have separate declarations of a private property`."

[[note]]
level = "professional"
topic = "GitHub"
text = "With vigilant mode enabled, GitHub marks unsigned commits attributed to you as Unverified, so a commit that merely sets your email as its author no longer looks as trustworthy as one you actually signed."

[[note]]
level = "professional"
topic = "Debugging"
text = "At scale, rare is routine: a bug that hits one request in a million fires about 86 times a day at 1,000 requests per second, so failing to reproduce it in a test environment says little about production."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "`terraform plan -refresh-only` shows how real infrastructure has drifted from state, and applying it with `terraform apply -refresh-only` records the drift without changing any resources."

[[note]]
level = "professional"
topic = "GitHub"
text = "Besides its hourly request quota, GitHub's API enforces secondary rate limits on bursts, such as too many concurrent requests or content created too quickly, so a bulk script can be throttled while its quota still shows plenty left."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "GitOps controllers pull desired state from Git and continuously reconcile the cluster toward it, so with self-healing enabled a manual `kubectl edit` to anything Git defines is undone on the next sync."

[[note]]
level = "professional"
topic = "Web"
text = "While a synchronous script blocks the HTML parser, the browser's preload scanner keeps reading ahead and starts downloading later images, scripts and stylesheets, which is why resources injected by JavaScript start loading later than ones in the markup."

[[note]]
level = "professional"
topic = "GitHub"
text = "A pull request that edits the code owners file doesn't change who must review it: GitHub applies the version on the base branch, so new ownership rules take effect only after the change merges."

[[note]]
level = "professional"
topic = "Networking"
text = "TCP incast happens when many servers answer one client at the same moment, as in a fan-out query: their combined burst overflows the switch port's buffer, packets drop, and flows stall on retransmission timeouts far longer than the request itself."

[[note]]
level = "professional"
topic = "Networking"
text = "On Linux, TCP's initial retransmission timeout is one second, so a single lost SYN adds about a second to connection setup, which is why latency histograms often show a bump near one second."

[[note]]
level = "professional"
topic = "JavaScript"
text = "A package that ships both CommonJS and ES module builds can be loaded twice in one app, once in each format, so `instanceof` checks fail and module-level state splits between the copies (the dual package hazard)."

[[note]]
level = "professional"
topic = "Networking"
text = "Light in optical fiber travels at roughly 200,000 km per second, so a round trip between cities 6,000 km apart takes at least 60 ms no matter how fast the servers are."

[[note]]
level = "professional"
topic = "Networking"
text = "A single TCP connection's throughput is capped at its window size divided by the round-trip time: a 64 KB window over a 100 ms path cannot exceed about 5 Mbit/s, however fast the link."

[[note]]
level = "professional"
topic = "Networking"
text = "When a backend's keep-alive timeout is shorter than its load balancer's idle timeout, the backend closes connections the balancer still considers reusable, producing sporadic 502 errors."

[[note]]
level = "professional"
topic = "Networking"
text = "Anycast announces the same IP address from many sites over BGP, so clients reach the nearest one; a routing change mid-connection can move a TCP flow to a site that has no state for it."

[[note]]
level = "professional"
topic = "Networking"
text = "Happy Eyeballs clients race IPv6 and IPv4 connection attempts and keep whichever succeeds first, so a broken IPv6 path costs a short delay instead of a hung connection."

[[note]]
level = "professional"
topic = "Networking"
text = "VPC peering refuses networks with overlapping CIDR ranges, and connecting overlapping networks over a VPN requires NAT, so a casually chosen address plan can force renumbering when networks later need to talk."

[[note]]
level = "professional"
topic = "Debugging"
text = "tcpdump on Linux captures packets before netfilter decides their fate, so seeing a packet arrive in a capture does not prove the firewall let it through to the application."

[[note]]
level = "professional"
topic = "Linux"
text = "When the Linux connection-tracking table fills, the kernel drops new connections and logs `nf_conntrack: table full, dropping packet`, an outage that looks like random packet loss on busy NAT or proxy hosts."

[[note]]
level = "professional"
topic = "Incidents"
text = "On October 4, 2021, a backbone maintenance command disconnected Facebook's data centers, and its DNS servers then withdrew their own BGP routes, which also cut off the internal tools engineers needed to recover."

[[note]]
level = "professional"
topic = "DNS"
text = "Negative answers are cached too: an NXDOMAIN is cached for the lesser of the zone SOA's TTL and its minimum field, so querying a name before creating it can keep it looking absent for that long."

[[note]]
level = "professional"
topic = "Linux"
text = "In cgroup v2, crossing `memory.high` throttles a group and forces it to reclaim memory, while hitting `memory.max` invokes the OOM killer, so a systemd `MemoryHigh=` set below `MemoryMax=` gives a service a slowdown zone before any kill."

[[note]]
level = "professional"
topic = "DNS"
text = "A dangling CNAME pointing at a deleted cloud resource, such as a storage bucket or app hostname, lets whoever claims that resource next serve content on your subdomain."

[[note]]
level = "professional"
topic = "DNS"
text = "DNSSEC proves an answer came from the zone owner but does not hide it, while DNS over HTTPS or TLS encrypts the path to the resolver but does not prove the data is authentic."

[[note]]
level = "professional"
topic = "DNS"
text = "glibc does not cache DNS answers itself, so without a local cache such as `systemd-resolved` or `nscd`, every `getaddrinfo()` call from every process goes to the configured resolver."

[[note]]
level = "professional"
topic = "DNS"
text = "In October 2016 the Mirai botnet's attack on DNS provider Dyn made many large sites unreachable, because their domains depended on a single DNS provider with no secondary."

[[note]]
level = "professional"
topic = "DNS"
text = "The `.com` TLD servers publish delegation NS records with a two-day TTL, so after a domain moves to new nameservers, resolvers that cached the old delegation keep querying the old servers until it expires."

[[note]]
level = "professional"
topic = "DNS"
text = "DNS rebinding makes an attacker's hostname resolve first to their server and then to an internal address, letting a page in the victim's browser reach internal services; validating the `Host` header on those services defeats it."

[[note]]
level = "professional"
topic = "Accessibility"
text = "WCAG conformance applies to full pages and complete processes, so if one step of a checkout, such as an embedded third-party payment form, fails a criterion, the whole process does not conform."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Node empties the whole `process.nextTick` queue before the event loop moves on, so callbacks that keep scheduling more `nextTick` work can starve I/O and timers indefinitely, while `setImmediate` yields between runs."

[[note]]
level = "professional"
topic = "Databases"
text = "PostgreSQL's `UPDATE` writes a new row version and leaves the old one as a dead tuple for `VACUUM`, so update-heavy tables bloat whenever autovacuum cannot keep up."

[[note]]
level = "professional"
topic = "Databases"
text = "PostgreSQL transaction IDs are 32-bit, so autovacuum must freeze old rows before the counter wraps; if it falls far enough behind, the server stops assigning new IDs and refuses writes to protect data."

[[note]]
level = "professional"
topic = "Databases"
text = "A long-running transaction in PostgreSQL holds back the cleanup horizon, so `VACUUM` cannot remove rows that died after it started, and busy tables keep growing until it ends."

[[note]]
level = "professional"
topic = "Databases"
text = "A PostgreSQL replication slot retains WAL until its consumer confirms it, so an abandoned slot can fill the primary's disk; `max_slot_wal_keep_size` caps how much it may hold."

[[note]]
level = "professional"
topic = "Databases"
text = "An `ALTER TABLE` waiting for its `ACCESS EXCLUSIVE` lock in PostgreSQL blocks every later query on that table, even plain `SELECT`s, so a migration stuck behind one long query can stall all traffic; `lock_timeout` bounds the wait."

[[note]]
level = "professional"
topic = "Algorithms"
text = "A count-min sketch estimates how often each item appears in a stream using fixed memory: collisions can make its counts too high but never too low, which suits finding the most frequent items."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Lamport timestamps give events numbers consistent with causality but cannot tell whether two events were concurrent; vector clocks can, at the cost of carrying one counter per node in every message."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Serializability means transactions over many objects behave as if run one at a time in some order; linearizability means each single operation takes effect instantly in real-time order. A system can offer either without the other."

[[note]]
level = "professional"
topic = "Performance"
text = "Throughput often peaks and then falls as you add nodes or threads, because coordination costs such as locking and cache coherence grow faster than capacity; the Universal Scalability Law models this decline, which Amdahl's law does not."

[[note]]
level = "professional"
topic = "Databases"
text = "Each PostgreSQL connection is a separate backend process, so thousands of mostly idle connections waste memory; poolers such as PgBouncer multiplex many clients onto a few server connections."

[[note]]
level = "professional"
topic = "Databases"
text = "In transaction pooling mode, PgBouncer can hand each transaction a different server connection, so session state such as `SET` parameters, advisory locks and `LISTEN` does not carry over between transactions."

[[note]]
level = "professional"
topic = "Databases"
text = "On a PostgreSQL hot standby, long queries can be canceled when replay must remove rows they might still read; `hot_standby_feedback` prevents that by holding back cleanup on the primary instead."

[[note]]
level = "professional"
topic = "Databases"
text = "Point-in-time recovery needs a base backup plus an unbroken archive of WAL from that backup onward; one missing segment stops recovery at that point, however much WAL exists after it."

[[note]]
level = "professional"
topic = "Databases"
text = "`synchronous_commit = off` in PostgreSQL can lose the last few transactions reported as committed after a crash, but it never corrupts the database or leaves it inconsistent."

[[note]]
level = "professional"
topic = "Databases"
text = "Redis executes commands on a single main thread, so one slow command such as `KEYS *` or a `DEL` of a huge key blocks every other client until it finishes."

[[note]]
level = "professional"
topic = "Databases"
text = "Redis defaults to the `noeviction` policy, so when it reaches `maxmemory` it returns errors on writes instead of evicting keys, which surprises teams that assumed it behaves like a cache."

[[note]]
level = "professional"
topic = "Performance"
text = "With simultaneous multithreading, two logical CPUs share one physical core, so a host reporting 50% CPU utilization may already have its cores nearly busy, and doubling the load will not double throughput."

[[note]]
level = "professional"
topic = "SQL"
text = "`SELECT ... FOR UPDATE SKIP LOCKED` lets many workers claim rows from a jobs table without waiting on each other, which is how PostgreSQL and MySQL tables can serve as simple job queues."

[[note]]
level = "professional"
topic = "Git"
text = "The Developer Certificate of Origin is a statement, not a signature: `git commit -s` adds a `Signed-off-by:` trailer asserting you have the right to submit the change, and proves nothing cryptographically about who wrote it."

[[note]]
level = "professional"
topic = "SQL"
text = "PostgreSQL sequences are not transactional: a rolled-back insert still consumes its value, so gaps in generated IDs are normal and do not indicate lost rows."

[[note]]
level = "professional"
topic = "TypeScript"
text = "TypeScript has two incompatible decorator implementations: the legacy one behind `experimentalDecorators`, which many frameworks were built on, and standard ECMAScript decorators, used when that flag is off."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Type-level code that multiplies unions, such as a template literal type built from several string unions, can hit the compiler's limits and fail with a union type too complex to represent, or make checking crawl."

[[note]]
level = "professional"
topic = "Web"
text = "`SharedArrayBuffer` is available only to cross-origin isolated pages, which must send `Cross-Origin-Opener-Policy: same-origin` and a `Cross-Origin-Embedder-Policy` such as `require-corp`, a defense against Spectre-style timing attacks."

[[note]]
level = "professional"
topic = "Web"
text = "Browsers now partition third-party storage by top-level site: an iframe embedded on two different sites gets a separate `localStorage`, IndexedDB and cache on each, and many browsers also partition or block its cookies."

[[note]]
level = "professional"
topic = "HTTP"
text = "The HTTP/2 Rapid Reset attack (CVE-2023-44487) opened and immediately canceled streams, so servers did work for requests that never counted against the concurrent stream limit."

[[note]]
level = "professional"
topic = "HTTP"
text = "HTTP request smuggling happens when a front end and a back end disagree on where a request ends, typically over `Content-Length` versus `Transfer-Encoding`, letting an attacker prepend data to another user's request."

[[note]]
level = "professional"
topic = "HTTP"
text = "A 502 from a gateway means the upstream returned an invalid response or dropped the connection, while a 504 means it did not answer in time, which points an investigation toward crashes or toward slowness."

[[note]]
level = "professional"
topic = "HTTP"
text = "HTTP defines `PUT` and `DELETE` as idempotent and `POST` as not, which is why clients and proxies may automatically retry the former after a connection failure but should not retry the latter."

[[note]]
level = "professional"
topic = "APIs"
text = "An idempotency key sent with a request lets the server recognize a retry and return the original result, so a client can safely repeat a payment after a timeout without charging twice."

[[note]]
level = "professional"
topic = "Accessibility"
text = "The European Accessibility Act has applied since June 2025 to many consumer products and services sold in the EU, including online shops, banking and e-books, making accessibility a legal requirement for them."

[[note]]
level = "professional"
topic = "APIs"
text = "Protocol Buffers' binary format carries field numbers, not names, so renaming a field stays compatible there, but reusing a deleted field's number misreads old data; the `reserved` keyword prevents that reuse."

[[note]]
level = "professional"
topic = "APIs"
text = "With `ETag` and `If-Match`, an HTTP API gets optimistic concurrency: a write carrying a stale tag fails with `412 Precondition Failed` instead of silently overwriting someone else's change."

[[note]]
level = "professional"
topic = "APIs"
text = "gRPC sends the caller's deadline with each call as a `grpc-timeout` header, so a server that passes its incoming context to downstream calls stops work the original client has already abandoned."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Enterprise and government buyers often ask for an Accessibility Conformance Report, usually built on the VPAT template, which states how a product meets each WCAG success criterion and where it falls short."

[[note]]
level = "professional"
topic = "APIs"
text = "A single GraphQL query can fan out into thousands of resolver calls through nested lists, which is why GraphQL servers limit query depth or compute a query cost before executing it."

[[note]]
level = "professional"
topic = "Cryptography"
text = "FIPS 140 validation covers a specific build of a cryptographic module, not an algorithm: calling AES from an unvalidated library does not meet a FIPS requirement, even with approved algorithms and key sizes."

[[note]]
level = "professional"
topic = "Cryptography"
text = "ECDSA leaks the private key when two signatures share a nonce, which is how Sony's PlayStation 3 signing key was recovered in 2010; Ed25519 derives each nonce from the key and message to rule that failure out."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Shamir's secret sharing splits a key into shares so that any chosen number of them, say three of five, can rebuild it while fewer reveal nothing, which is how root keys are held without trusting any single person."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Ken Thompson's Turing Award lecture \"Reflections on Trusting Trust\" showed a compiler can plant a backdoor in the programs it builds, including new copies of itself, that no source review would find; diverse double-compiling can detect it."

[[note]]
level = "professional"
topic = "Versioning"
text = "Inside a monorepo that builds everything at head, internal libraries have no version numbers: whoever changes a library must update or stay compatible with every caller in the same change."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Harvest now, decrypt later is why key exchange is moving to post-quantum algorithms before signatures: recorded traffic can be decrypted years later, but a signature has to be forged while it is still being checked."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Kerckhoffs's principle holds that a cryptosystem should stay secure even if everything except the key is public, which is why a secret algorithm is treated as a warning sign rather than a defense."

[[note]]
level = "professional"
topic = "Security"
text = "JWT verifiers that trust the token's own `alg` header can be tricked into accepting `none`, or into checking an RS256 token as HS256 with the public key as the secret, so the verifier must fix the expected algorithm."

[[note]]
level = "professional"
topic = "Releases"
text = "A release train leaves on a fixed schedule with whatever is ready; a feature that misses it waits for the next one, which keeps dates predictable and stops one late change from holding up everyone else's."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Vendoring dependencies into the repository makes builds independent of registries and puts every dependency change through code review, at the cost of a larger repository and updates you must run deliberately."

[[note]]
level = "professional"
topic = "Concurrency"
text = "False sharing happens when threads write different variables that sit on the same cache line, typically 64 bytes on x86, so cores keep invalidating each other's caches even though no data is shared."

[[note]]
level = "professional"
topic = "Concurrency"
text = "x86 has a strong memory model (TSO) while ARM allows much more reordering, so lock-free code that works on x86 without proper atomics or barriers can fail once it runs on ARM servers."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Mars Pathfinder kept resetting in 1997 because of priority inversion: a low-priority task held a mutex a high-priority task needed, and engineers fixed it remotely by enabling priority inheritance on that mutex."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Deadlock requires four conditions at once: mutual exclusion, hold and wait, no preemption, and circular wait; acquiring locks in one global order removes circular wait and with it the deadlock."

[[note]]
level = "professional"
topic = "Concurrency"
text = "The ABA problem fools compare-and-swap: a value changes from A to B and back to A between a read and the CAS, which then succeeds even though the structure underneath changed, as with a recycled node pointer."

[[note]]
level = "professional"
topic = "Concurrency"
text = "A blocking call inside an async task stalls every other task scheduled on that event loop or executor thread, which is why async runtimes provide separate thread pools for blocking work."

[[note]]
level = "professional"
topic = "Time"
text = "In zones with daylight saving time, some local times occur twice in autumn and some never occur in spring, so a job scheduled at a local time inside those windows can run twice or not at all."

[[note]]
level = "professional"
topic = "Time"
text = "Cloudflare's DNS outage on January 1, 2017 came from a leap second: Go's wall clock stepped back, a duration went negative, and code that assumed it never could panicked."

[[note]]
level = "professional"
topic = "Time"
text = "The June 2012 leap second triggered a Linux kernel timer bug that left many Java and MySQL processes spinning at full CPU until their servers were rebooted or had their clocks reset."

[[note]]
level = "professional"
topic = "Unicode"
text = "A correct UTF-8 decoder rejects overlong forms such as `C0 AF`, a two-byte spelling of `/`; Microsoft IIS accepted them in 2000, and `..%c0%af` walked out of the web root. Decode with a strict decoder that refuses invalid sequences."

[[note]]
level = "professional"
topic = "Unicode"
text = "ZIP archives mark UTF-8 file names with a flag bit; when it is unset, readers are supposed to decode names as IBM code page 437, which is why names written by tools that use a local legacy encoding arrive garbled elsewhere."

[[note]]
level = "professional"
topic = "Time"
text = "Google Spanner's TrueTime exposes clock uncertainty as an interval and makes each commit wait out that uncertainty, which is how it assigns timestamps that respect real-time order across datacenters."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Reproducible builds let independent parties rebuild from the same source and get bit-for-bit identical artifacts, turning trust in one build server into something anyone can verify."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Nix and Guix address every package by a hash of all its build inputs and build it in a sandbox, so a pinned configuration resolves to the same dependency graph on any machine, down to the C library."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Timestamps, file ordering in archives and absolute build paths are common sources of unreproducible builds; Go's `-trimpath` flag, for example, removes local file system paths from compiled binaries."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Rebuilding an unchanged Dockerfile later can install different packages, because `apt-get install` without pinned versions takes whatever the mirror serves that day; Debian's snapshot archive serves the repository as it was at any past moment."

[[note]]
level = "professional"
topic = "Unicode"
text = "Each language runtime bundles its own version of the Unicode data, so two services can disagree about a recently added character: one sees a letter with case mappings, the other an unassigned code point, and validation or sorting differs."

[[note]]
level = "professional"
topic = "DNS"
text = "Geo-DNS answers depend on where a query appears to come from, which is the recursive resolver rather than the user; EDNS Client Subnet lets a resolver pass on part of the client's address, so users of a distant public resolver still reach a nearby endpoint."

[[note]]
level = "professional"
topic = "Dependencies"
text = "The 2016 removal of `left-pad` from npm broke builds across the ecosystem and led npm to restrict unpublishing packages that other packages depend on."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Python installs one version of each package per environment, so two dependencies that require incompatible versions of a third cannot both be satisfied, whereas npm can nest separate copies."

[[note]]
level = "professional"
topic = "Versioning"
text = "Under npm's semver rules, `^1.2.3` accepts anything below 2.0.0, but `^0.2.3` accepts only versions below 0.3.0, because a 0.x minor bump is treated as potentially breaking."

[[note]]
level = "professional"
topic = "Versioning"
text = "In SemVer, `1.0.0-rc.10` sorts after `1.0.0-rc.9` because numeric identifiers compare as numbers, but `1.0.0-rc10` sorts before `1.0.0-rc9` because it is compared as text."

[[note]]
level = "professional"
topic = "Versioning"
text = "Backward compatibility means new code can read old data and forward compatibility means old code can read new data; a rolling deploy needs both, because old and new versions run side by side."

[[note]]
level = "professional"
topic = "Releases"
text = "Knight Capital lost hundreds of millions of dollars in about 45 minutes in 2012 after a deploy missed one of eight servers and a repurposed feature flag reactivated old code on it."

[[note]]
level = "professional"
topic = "Releases"
text = "The July 2024 CrowdStrike outage came from a content update rather than new code, sent to its whole Windows fleet at once; it crashed about 8.5 million machines, which is why configuration and content need staged rollouts too."

[[note]]
level = "professional"
topic = "HTTP"
text = "Compressing HTTPS responses that contain both a secret, such as a CSRF token, and text an attacker can influence can leak that secret through changes in response size; this is the BREACH attack."

[[note]]
level = "professional"
topic = "Releases"
text = "Building an artifact once and promoting the same bytes through staging and production guarantees that what was tested is what ships; rebuilding per environment quietly breaks that guarantee."

[[note]]
level = "professional"
topic = "Releases"
text = "Traffic mirroring copies live requests to a new version and discards its responses, which tests real load safely only if the mirrored version's writes and other side effects are disabled."

[[note]]
level = "professional"
topic = "CI"
text = "Graydon Hoare's 'not rocket science rule' is to automatically maintain a repository of code that always passes all its tests, by testing each change merged with main before it lands."

[[note]]
level = "professional"
topic = "CI"
text = "A merge queue tests each pull request combined with the latest main and the PRs ahead of it, catching semantic conflicts where two individually green changes break the build together."

[[note]]
level = "professional"
topic = "CI"
text = "A flaky test fails on some runs without any code change, and once a team learns to rerun red builds by reflex, genuine failures get rerun until green and merged too."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Events caused by the `GITHUB_TOKEN`, other than `workflow_dispatch` and `repository_dispatch`, do not start new workflow runs, which prevents a workflow from triggering itself recursively."

[[note]]
level = "professional"
topic = "Git"
text = "On a Git server, reachability bitmaps written by `git repack -b` let clones and fetches work out which objects to send without walking every commit, which cuts the CPU cost of serving a large repository."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "`actions/checkout` persists the job's token for later Git commands by default, so any code running in the job can read it; `persist-credentials: false` turns that off."

[[note]]
level = "professional"
topic = "Git"
text = "Since the 2017 SHAttered collision, Git has by default used a hardened SHA-1 that detects that class of attack, and new repositories can use SHA-256 object names with `git init --object-format=sha256`."

[[note]]
level = "professional"
topic = "Git"
text = "A partial clone with `git clone --filter=blob:none` downloads commits and trees up front and fetches file contents on demand, which makes huge repositories practical without giving up full history."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Self-hosted runners can keep state between jobs, so on a public repository a fork's pull request can run code that persists on the machine or reaches its network; GitHub recommends them only for private repositories."

[[note]]
level = "professional"
topic = "Git"
text = "Git's author and committer fields are free text that anyone can set to any name and email, so only a signature verified against a known key ties a commit to a real identity."

[[note]]
level = "professional"
topic = "Documentation"
text = "Amazon replaced slide decks in senior meetings with narrative memos of up to six pages, read in silence at the start of the meeting; full sentences expose gaps in reasoning that bullet points hide."

[[note]]
level = "professional"
topic = "Documentation"
text = "RFC 2119 defines MUST, SHOULD and MAY for specifications, and RFC 8174 clarifies that they carry that meaning only in capitals; using them consistently lets readers tell hard requirements from recommendations."

[[note]]
level = "professional"
topic = "Testing"
text = "Jepsen tests distributed databases by injecting network partitions, clock skew and crashes while recording operation histories, then checks those histories against the consistency guarantees the database claims."

[[note]]
level = "professional"
topic = "Testing"
text = "Deterministic simulation testing, popularized by FoundationDB, runs a whole distributed system in one thread with simulated network, disk and clocks, so any failing run can be replayed exactly from its seed."

[[note]]
level = "professional"
topic = "Testing"
text = "Mutation testing changes the code under test in small ways, such as flipping a comparison, and checks whether any test fails, measuring what line coverage cannot: whether the tests would notice a wrong result."

[[note]]
level = "professional"
topic = "Debugging"
text = "In a flame graph, width is the share of samples that include a function and the x-axis is sorted alphabetically, not by time, so wide plateaus show where CPU goes, not when it went there."

[[note]]
level = "professional"
topic = "Debugging"
text = "CPU profilers only sample threads that are running, so time spent blocked on locks, disk or network never appears in them; off-CPU analysis is what shows where a slow request actually waited."

[[note]]
level = "professional"
topic = "Time"
text = "NTP daemons correct small offsets by slewing, running the clock slightly fast or slow so time never jumps; they step it only for large offsets, as `ntpd` does above 128 ms or chrony when its `makestep` setting allows, and that is when wall-clock jumps happen."

[[note]]
level = "professional"
topic = "Tooling"
text = "A shared build cache hands out wrong artifacts whenever a cache key misses an input, such as the compiler version, an environment variable or a file read outside the declared inputs, so an undeclared input is a correctness bug."

[[note]]
level = "professional"
topic = "Linux"
text = "With Linux's default overcommit, `malloc` usually succeeds even when memory is short, because pages are only backed when touched; the failure arrives later as the OOM killer ending some process."

[[note]]
level = "professional"
topic = "Regex"
text = "POSIX regex tools such as `grep -E` return the longest match at the leftmost position, while backtracking engines in Python, JavaScript and Perl take the first alternative that works, so `ab|abcd` finds `abcd` with `grep -oE` but only `ab` in Python."

[[note]]
level = "professional"
topic = "Code review"
text = "Chesterton's fence is the principle that a rule or check should not be removed until its purpose is understood; odd-looking guards in old code often encode an incident nobody wrote down."

[[note]]
level = "professional"
topic = "Code review"
text = "Bacchelli and Bird's study of code review at Microsoft found that developers name finding defects as the main motivation, yet most review comments concern code improvements and understanding rather than bugs."

[[note]]
level = "professional"
topic = "Documentation"
text = "An architecture decision record captures the context, the decision and its consequences, so a future reader learns why the system is shaped this way, not just what it does."

[[note]]
level = "professional"
topic = "Documentation"
text = "The Diátaxis framework divides documentation into tutorials, how-to guides, reference and explanation, because each serves a different need and mixing them makes all four harder to use."

[[note]]
level = "professional"
topic = "HTTP"
text = "TLS 1.3 early data lets a returning client send its first request without waiting for the handshake, but an attacker can replay that data, so servers should accept only idempotent requests in it and can answer others with `425 Too Early`."

[[note]]
level = "professional"
topic = "Data"
text = "A Kafka consumer group can have at most one active consumer per partition, so adding consumers beyond the partition count leaves the extras idle instead of adding throughput."

[[note]]
level = "professional"
topic = "Data"
text = "Kafka deletes old log segments by time or size whether or not anyone consumed them, while log compaction instead keeps the latest record for each key, turning a topic into a durable table of current values."

[[note]]
level = "professional"
topic = "HTTP"
text = "Browsers may reuse one HTTP/2 connection for several hostnames that share an IP address and a certificate, so a server can receive requests for hosts it doesn't serve; `421 Misdirected Request` tells the client to retry on a new connection."

[[note]]
level = "professional"
topic = "Algorithms"
text = "A Bloom filter can return false positives but never false negatives, which is why LSM-tree databases often keep one per data file to skip files that definitely do not contain a key."

[[note]]
level = "professional"
topic = "Regex"
text = "Atomic groups `(?>...)` and possessive quantifiers such as `a++` never give back characters once matched, which cuts off the backtracking behind many runaway patterns; Java, PCRE and Python 3.11 or later support both."

[[note]]
level = "professional"
topic = "Architecture"
text = "A statically stable design keeps working through a dependency failure without making any changes, for example by running spare capacity in every zone ahead of time rather than launching new instances after a zone fails."

[[note]]
level = "professional"
topic = "Java"
text = "Log4Shell (CVE-2021-44228) was triggered simply by logging an attacker-controlled string, because Log4j 2 evaluated `${jndi:...}` lookups inside log messages and could load remote code."

[[note]]
level = "professional"
topic = "APIs"
text = "Compatibility runs in opposite directions for requests and responses: a server can safely start accepting more, such as a new optional parameter, but must not start returning less, such as dropping a field or making one nullable."

[[note]]
level = "professional"
topic = "Python"
text = "In Python, `logger.debug(f\"...\")` builds the string even when debug logging is off, while `logger.debug(\"%s\", value)` defers formatting until a handler actually emits the record."

[[note]]
level = "professional"
topic = "APIs"
text = "Being liberal in what you accept, the robustness principle, lets clients come to depend on malformed input you tolerated, so each leniency becomes a permanent part of the API that you cannot tighten later without breaking someone."

[[note]]
level = "professional"
topic = "C"
text = "Heartbleed was a missing bounds check in OpenSSL's TLS heartbeat extension that let a client read up to 64 KB of server memory per request, including private keys and session data."

[[note]]
level = "professional"
topic = "C"
text = "Signed 32-bit `time_t` overflows at 03:14:07 UTC on 19 January 2038, and file formats, database columns and embedded devices that store 32-bit timestamps stay affected even after operating systems move on."

[[note]]
level = "professional"
topic = "Web"
text = "Chromium-based browsers treat a cookie with no `SameSite` attribute as `Lax`, so it is not sent on cross-site subresource requests, but other browsers differ, so CSRF defenses cannot rely on that default."

[[note]]
level = "professional"
topic = "APIs"
text = "Returning a total count with every page makes the database count the whole filtered result on each request, and that gets slow on large tables; many APIs return only a `has_more` flag or make the total optional."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Accessibility regulations such as the US Section 508 standards and the European standard EN 301 549 reference WCAG level AA, which is why AA, not AAA, is the usual conformance target for products."

[[note]]
level = "professional"
topic = "Regex"
text = "Cloudflare's July 2019 global outage came from a WAF rule containing `.*(?:.*=.*)`, whose nested wildcards sent the backtracking regex engine through an enormous number of match attempts and exhausted CPU on every core serving HTTP."

[[note]]
level = "professional"
topic = "Regex"
text = "RE2 and Go's `regexp` package guarantee matching in time linear in the input by leaving out backreferences and lookaround, which rules out catastrophic backtracking for untrusted patterns and input."

[[note]]
level = "professional"
topic = "Shell"
text = "Shellshock (CVE-2014-6271) let Bash execute commands appended to function definitions it imported from environment variables, and CGI servers put HTTP headers into exactly such variables."

[[note]]
level = "professional"
topic = "Tooling"
text = "`diffoscope` compares two build outputs recursively, unpacking archives and disassembling binaries, so a failed reproducibility check points to the exact files and bytes that differ."

[[note]]
level = "professional"
topic = "Performance"
text = "Hedged requests send a second copy of a request once the typical p95 latency has passed and use whichever reply arrives first, cutting tail latency at the cost of a few percent more load."

[[note]]
level = "professional"
topic = "Incidents"
text = "Near misses expose the same weaknesses as outages at no cost to customers, which is why mature incident programs review events that were caught in time, not only those that caused damage."

[[note]]
level = "professional"
topic = "Incidents"
text = "A backup that has never been restored is an unverified assumption: restore drills often uncover missing data, expired credentials and recovery times far longer than anyone planned for."

[[note]]
level = "professional"
topic = "Observability"
text = "A burn rate of 1 consumes the error budget exactly over the SLO window; multiwindow burn-rate alerts page on fast burns, such as 14.4 over an hour, and open tickets for slow ones."

[[note]]
level = "professional"
topic = "Observability"
text = "An always-firing dead man's switch alert, routed to an external service that pages when it stops arriving, proves the alerting pipeline works; otherwise a broken pipeline looks exactly like a quiet night."

[[note]]
level = "professional"
topic = "Architecture"
text = "A circuit breaker stops calling a failing dependency for a cool-down period and then lets a trial request through, so callers fail fast instead of tying up threads on timeouts that will not succeed."

[[note]]
level = "professional"
topic = "Architecture"
text = "Load shedding rejects excess requests early with a fast error, which keeps latency normal for the requests a service accepts; accepting everything under overload can make every request time out."

[[note]]
level = "professional"
topic = "Teams"
text = "Google's SRE book derives a minimum of eight engineers for a single-site 24/7 on-call rotation with a primary and a secondary, so each person is on call about one week in four."

[[note]]
level = "professional"
topic = "Teams"
text = "The bus factor is the number of people who would have to disappear before a project stalls for lack of knowledge; a bus factor of one is a single point of failure in the team, not only in the code."

[[note]]
level = "professional"
topic = "Supply chain"
text = "In the 2018 `event-stream` incident, a volunteer given publish rights to the popular npm package added a dependency, `flatmap-stream`, carrying code that targeted a specific Bitcoin wallet app."

[[note]]
level = "professional"
topic = "Supply chain"
text = "In the 2021 Codecov breach, attackers modified the company's Bash uploader script, so CI pipelines that fetched and ran it during the compromise sent their environment variables, including secrets, to an attacker's server."

[[note]]
level = "professional"
topic = "Supply chain"
text = "PyPI's Trusted Publishing lets a CI workflow exchange its OIDC identity for a short-lived upload token, so no long-lived API token has to sit in repository secrets waiting to leak."
