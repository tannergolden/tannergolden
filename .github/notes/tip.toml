# Tip: something to try. A concrete technique, command or habit with an immediate payoff.
# 1,000 notes, 250 per level. Drawn by .github/scripts/notes.py; every note
# added makes the rotation longer. No en or em dashes: the script refuses them.

[[note]]
level = "beginner"
topic = "Git"
text = "Stage part of a file with `git add -p`: Git shows each change in turn, so a commit holds one idea instead of everything you touched."

[[note]]
level = "beginner"
topic = "Git"
text = "If you forgot a file in your last commit, stage it and run `git commit --amend --no-edit`: the commit is replaced by one that includes the file and keeps the same message. Do this only before you push."

[[note]]
level = "beginner"
topic = "Git"
text = "See your whole history at a glance with `git log --oneline --graph --all`: one line per commit, with branches and merges drawn on the left."

[[note]]
level = "beginner"
topic = "Git"
text = "Run `git log -p -- <file>` to see every commit that changed one file, newest first, each with the exact lines it added and removed."

[[note]]
level = "beginner"
topic = "Git"
text = "Unstage a file without losing your edits using `git restore --staged <file>`: the changes stay in your working directory, just out of the next commit."

[[note]]
level = "beginner"
topic = "Git"
text = "Start each task on its own branch with `git switch -c <name>`, which creates the branch and moves you onto it in one step."

[[note]]
level = "beginner"
topic = "Git"
text = "Jump back to the branch you were on before with `git switch -`; run it again to bounce between the two branches."

[[note]]
level = "beginner"
topic = "Git"
text = "Run `git status -s` for a compact view with one line per file: `M` in the first column means staged, `M` in the second means changed but not staged, and `??` marks untracked files."

[[note]]
level = "beginner"
topic = "Git"
text = "Run `git <command> -h`, such as `git commit -h`, for a one-screen summary of that command's options; `git help <command>` opens the full manual page."

[[note]]
level = "beginner"
topic = "Git"
text = "Find out who last changed each line, and in which commit, with `git blame <file>`; add `-L 40,60` to look only at lines 40 to 60."

[[note]]
level = "beginner"
topic = "Git"
text = "Print a file as it was in an older commit with `git show HEAD~2:path/to/file`, using the path from the repository root; your working copy stays untouched."

[[note]]
level = "beginner"
topic = "Git"
text = "Save typing with Git aliases: after `git config --global alias.st status`, running `git st` does the same as `git status`."

[[note]]
level = "beginner"
topic = "GitHub"
text = "In GitHub issues and comments, put code between lines of three backticks and write the language name after the opening ones, such as `python`; GitHub then highlights it and keeps its indentation."

[[note]]
level = "beginner"
topic = "Git"
text = "Write commit subjects as short commands, like `Add login form` or `Fix crash on empty input`, so `git log --oneline` reads like a list of changes."

[[note]]
level = "beginner"
topic = "GitHub"
text = "To hear about new versions of a project without getting every issue and comment, click Watch on its GitHub page, choose Custom and tick only Releases."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Filter a repository's issues with qualifiers in the search box, such as `is:open label:bug author:@me`, instead of scrolling the whole list; the same syntax works for pull requests."

[[note]]
level = "beginner"
topic = "Git"
text = "Run `git branch -vv` to list your branches with the remote branch each one tracks and how many commits it is ahead or behind, as of your last fetch."

[[note]]
level = "beginner"
topic = "Git"
text = "Run `git commit -v` to see the full diff below the message while you write it, so the message describes what actually changed."

[[note]]
level = "beginner"
topic = "Git"
text = "Tell Git who you are once per machine with `git config --global user.name \"Your Name\"` and `git config --global user.email you@example.com`, so every commit is credited to you."

[[note]]
level = "beginner"
topic = "Git"
text = "Run `git show` to see your latest commit's message and full diff; pass a hash, as in `git show a1b2c3d`, to inspect any other commit the same way."

[[note]]
level = "beginner"
topic = "Shell"
text = "Press `Ctrl+R` in bash or zsh and start typing to search your command history; press `Ctrl+R` again to step back to older matches."

[[note]]
level = "beginner"
topic = "Shell"
text = "In bash and zsh, type `sudo !!` to rerun the previous command with admin rights after a permission error; `!!` expands to the last command you ran."

[[note]]
level = "beginner"
topic = "Shell"
text = "Run `cd -` to jump back to the directory you were just in; running it again flips you back, which is handy when working between two folders."

[[note]]
level = "beginner"
topic = "Shell"
text = "Press Tab to complete file and command names, and press it twice to list every option when what you typed so far matches more than one."

[[note]]
level = "beginner"
topic = "Shell"
text = "In bash, `Ctrl+A` and `Ctrl+E` jump to the start and end of the line, `Ctrl+W` deletes the word before the cursor and `Ctrl+U` deletes everything before it."

[[note]]
level = "beginner"
topic = "Shell"
text = "Reuse the last argument of the previous command with `!$` in bash or zsh: after `mkdir new-project`, running `cd !$` takes you straight into it."

[[note]]
level = "beginner"
topic = "Shell"
text = "Check whether the last command succeeded with `echo $?` in bash or zsh: `0` means success, and any other number is an error code set by the program."

[[note]]
level = "beginner"
topic = "Time"
text = "Get the current Unix time in seconds with `date +%s`, handy for timing a step or naming a file; with GNU `date`, `date +%s%3N` gives milliseconds."

[[note]]
level = "beginner"
topic = "Shell"
text = "Pipe long output into `less`, as in `ps aux | less`, then press `/` to search, `n` for the next match and `q` to quit."

[[note]]
level = "beginner"
topic = "Shell"
text = "Save a command's output to a file while still watching it on screen by piping it through `tee`, as in `npm test | tee test.log`."

[[note]]
level = "beginner"
topic = "Tooling"
text = "When you can't remember which command does something, search the manual page descriptions with `man -k compress` (or `apropos compress`) and read the matching entries."

[[note]]
level = "beginner"
topic = "Shell"
text = "Make a quick backup before editing with brace expansion in bash or zsh: `cp config.yml{,.bak}` expands to `cp config.yml config.yml.bak`."

[[note]]
level = "beginner"
topic = "Shell"
text = "Define shortcuts for commands you type often, like `alias gs='git status'`, and add them to `~/.bashrc` or `~/.zshrc` so every new terminal has them."

[[note]]
level = "beginner"
topic = "Shell"
text = "See exactly what runs when you type a command with `type -a ls` in bash; it lists aliases, functions and every matching file on your `PATH`, in the order they are tried."

[[note]]
level = "beginner"
topic = "Shell"
text = "Put quotes around paths that contain spaces, as in `cd \"My Projects\"`; without them the shell splits the name into separate arguments."

[[note]]
level = "beginner"
topic = "Shell"
text = "In bash and zsh, set an environment variable for a single command by putting it in front, as in `DEBUG=1 npm start`; the rest of your session is unaffected."

[[note]]
level = "beginner"
topic = "Shell"
text = "Pause a running program in bash or zsh with `Ctrl+Z`, then type `bg` to let it continue in the background or `fg` to bring it back to the front."

[[note]]
level = "beginner"
topic = "Shell"
text = "Insert a command's output into another command with `$(...)`, as in `echo \"Backup from $(date +%F)\"` or `cd \"$(git rev-parse --show-toplevel)\"` to reach the repository root."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Manual pages are grouped in numbered sections, so `man crontab` shows the command while `man 5 crontab` shows the file format; `man -f crontab` lists every section that has a page by that name."

[[note]]
level = "beginner"
topic = "Shell"
text = "Open the current folder in your file manager with `open .` on macOS, `xdg-open .` on most Linux desktops or `explorer .` on Windows."

[[note]]
level = "beginner"
topic = "Linux"
text = "Make a script runnable with `chmod +x deploy.sh`, then start it with `./deploy.sh`; the `./` tells the shell to look in the current folder."

[[note]]
level = "beginner"
topic = "Tooling"
text = "If your terminal fills with strange symbols after you print a binary file, type `reset` and press Enter, even if what you type doesn't show properly; it restores the terminal's normal settings."

[[note]]
level = "beginner"
topic = "Regex"
text = "See only the active lines of a config file with `grep -Ev '^[[:space:]]*(#|$)' app.conf`, which hides comment lines and lines that are empty or contain only spaces."

[[note]]
level = "beginner"
topic = "Linux"
text = "List everything in a folder, including hidden dotfiles, with permissions and readable sizes using `ls -lah`."

[[note]]
level = "beginner"
topic = "Linux"
text = "List files with the newest at the bottom using `ls -ltr`, handy for spotting the file you just downloaded or the log written most recently."

[[note]]
level = "beginner"
topic = "Linux"
text = "Create nested folders in one command with `mkdir -p src/components/buttons`; `-p` also stops it from complaining when a folder already exists."

[[note]]
level = "beginner"
topic = "Linux"
text = "Search inside files with `grep -rn \"parseDate\" src/`: `-r` searches folders recursively and `-n` prints the line number of each match."

[[note]]
level = "beginner"
topic = "Regex"
text = "To search for text that starts with a dash, such as `-v`, write `grep -e '-v' file` or `grep -- '-v' file`; otherwise `grep` reads the pattern as one of its own options."

[[note]]
level = "beginner"
topic = "Linux"
text = "Follow a log file as new lines arrive with `tail -f app.log`; press `Ctrl+C` when you are done watching."

[[note]]
level = "beginner"
topic = "Linux"
text = "Peek at a large file without opening it in full: `head -n 20 file` prints the first 20 lines and `tail -n 20 file` the last 20."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Press `.` while viewing a repository on GitHub to open it in a browser-based editor, where you can browse and edit files without cloning anything."

[[note]]
level = "beginner"
topic = "Code review"
text = "When reviewing on GitHub, click Start a review instead of Add single comment: your comments stay pending until you submit, and the author gets all of them together in one notification."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Press `y` while viewing a file on GitHub to switch the address to a permalink for the current commit, so line links you share keep pointing at the same code."

[[note]]
level = "beginner"
topic = "Code review"
text = "After you fix a review comment, reply with the commit that fixed it, such as `Fixed in a1b2c3d`; GitHub turns the hash into a link, so the reviewer can check just that change."

[[note]]
level = "beginner"
topic = "Code review"
text = "Word review comments about the code, not the person: \"this loop skips the last item\" lands better than \"you forgot the last item\" and keeps the discussion on the fix."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Look for issues labeled `good first issue` when you want to start contributing to open source; maintainers use the label for tasks suited to newcomers."

[[note]]
level = "beginner"
topic = "Teams"
text = "Keep a running log of what you worked on and learned each day; it makes standups, performance reviews and your next job application much easier to write."

[[note]]
level = "beginner"
topic = "Teams"
text = "When you ask for help in chat, paste the error message as text rather than a screenshot, so others can search for it and copy parts of it into their own terminal."

[[note]]
level = "beginner"
topic = "Documentation"
text = "When you edit a Markdown file on GitHub, open the Preview tab before committing to catch broken lists, headings and links while they are still easy to fix."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Link to other files in your repository with relative paths such as `docs/setup.md`, not full GitHub addresses, so the links keep working on other branches, in forks and in local copies."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Write checklists in issues and pull requests with `- [ ]` lines; GitHub renders them as checkboxes you can tick off as the work gets done."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Pin your best repositories to your GitHub profile so visitors see finished projects first instead of forks and half-done experiments."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Add a one-line description and a few topics to each GitHub repository so people, including your future self, can tell what it does and find it in search."

[[note]]
level = "beginner"
topic = "GitHub"
text = "Link an issue in another repository by writing `owner/repo#123` in a comment; GitHub turns it into a link and adds a reference on that issue."

[[note]]
level = "beginner"
topic = "GitHub"
text = "When you report a bug on GitHub, include the steps to reproduce it, what you expected and what happened instead, so maintainers can act without a round of questions."

[[note]]
level = "beginner"
topic = "Security"
text = "Where a site offers passkeys, use one: you sign in with your device's fingerprint, face or PIN, and there is no password that a fake login page could trick you into typing."

[[note]]
level = "beginner"
topic = "Networking"
text = "Stop `ping` after a few packets with `ping -c 4 example.com` on Linux or macOS; without `-c` it keeps going until you press Ctrl+C, while Windows sends four by default."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Run `node --watch app.js` while you develop, and Node restarts your script every time you save it or any file it imports, without installing a separate reload tool."

[[note]]
level = "beginner"
topic = "Python"
text = "Print a variable with its name by adding `=` inside an f-string: `print(f\"{total=}\")` prints something like `total=42`."

[[note]]
level = "beginner"
topic = "Python"
text = "Drop `breakpoint()` into your code to pause there in the debugger; type `p name` to print a variable, `n` to run the next line and `c` to continue."

[[note]]
level = "beginner"
topic = "Python"
text = "Run a script with `python3 -i script.py` to land in an interactive prompt when it finishes, with all its variables still there to inspect."

[[note]]
level = "beginner"
topic = "Python"
text = "In the Python prompt, `help(str.split)` shows the documentation for a function and `dir(obj)` lists the attributes and methods an object has."

[[note]]
level = "beginner"
topic = "Python"
text = "Loop with `enumerate(items)` when you need both the position and the value, instead of `range(len(items))`; pass `start=1` to count from one."

[[note]]
level = "beginner"
topic = "Python"
text = "Walk two lists side by side with `zip(names, scores)`, which pairs items up and stops at the end of the shorter list."

[[note]]
level = "beginner"
topic = "Networking"
text = "To open your dev server from a phone on the same Wi-Fi, start it listening on all interfaces, as with `flask run --host=0.0.0.0` or `vite --host`, then browse to your computer's local IP address and port."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Add `// @ts-check` as the first line of a plain JavaScript file, and editors such as VS Code type-check it with TypeScript, flagging typos and wrong arguments without converting the file."

[[note]]
level = "beginner"
topic = "Python"
text = "Count things in one line with `collections.Counter`: `Counter(words).most_common(3)` returns the three most frequent items with their counts."

[[note]]
level = "beginner"
topic = "Python"
text = "Read a dictionary key that might be missing with `d.get(\"key\", default)`, which returns the default instead of raising `KeyError`."

[[note]]
level = "beginner"
topic = "Python"
text = "Sort by any field with a key function, as in `sorted(users, key=lambda u: u[\"age\"])`; add `reverse=True` to put the largest first."

[[note]]
level = "beginner"
topic = "Python"
text = "Build a list in one readable line with a comprehension: `[n * 2 for n in nums if n > 0]` filters and transforms at the same time."

[[note]]
level = "beginner"
topic = "Python"
text = "Build file paths with `pathlib`: `Path(\"data\") / \"input.csv\"` joins the parts with the right separator for your operating system."

[[note]]
level = "beginner"
topic = "Python"
text = "Print large nested dictionaries and lists with `pprint.pprint(data)`, which spreads them over indented lines instead of one long line."

[[note]]
level = "beginner"
topic = "Python"
text = "Combine a list of strings with `\", \".join(names)` instead of adding them together in a loop; it is shorter and never leaves a trailing separator."

[[note]]
level = "beginner"
topic = "Observability"
text = "Use `console.error` for problems and `console.log` for normal output in Node: errors then go to stderr, so `node app.js > out.log` still shows them on screen, and log tools can tell the two apart."

[[note]]
level = "beginner"
topic = "Python"
text = "Parse command-line options with the standard `argparse` module; it checks the arguments for you and generates a `--help` message automatically."

[[note]]
level = "beginner"
topic = "Python"
text = "Format numbers for display inside f-strings: `f\"{price:.2f}\"` shows two decimal places and `f\"{count:,}\"` adds thousands separators."

[[note]]
level = "beginner"
topic = "Linux"
text = "See which Linux distribution and release you are running with `cat /etc/os-release` before following install instructions written for a specific one."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Count characters rather than bytes with `wc -m`: in a UTF-8 locale, `printf 'é' | wc -m` prints 1 while `wc -c` prints 2, because `é` takes two bytes."

[[note]]
level = "beginner"
topic = "Shell"
text = "Fix a typo in the command you just ran with `^old^new` in bash or zsh: after `git comit -m wip`, typing `^comit^commit` runs it again with the first match replaced."

[[note]]
level = "beginner"
topic = "Linux"
text = "Unpack an archive with `tar -xzf file.tar.gz` and create one with `tar -czf backup.tar.gz folder/`: `x` extracts, `c` creates, `z` uses gzip and `f` names the file."

[[note]]
level = "beginner"
topic = "Linux"
text = "On Linux, find a running program's process ID with `pgrep -a node`, then stop it with `kill <pid>`, which gives it a chance to shut down cleanly, before reaching for `kill -9`."

[[note]]
level = "beginner"
topic = "Linux"
text = "Check memory on Linux with `free -h`, and watch the busiest processes live with `top`; press `q` to quit it."

[[note]]
level = "beginner"
topic = "Linux"
text = "Identify an unknown file with `file name`; it looks at the contents rather than the extension and reports things like PNG image or ASCII text."

[[note]]
level = "beginner"
topic = "Linux"
text = "Print every directory on your `PATH` on its own line with `echo \"$PATH\" | tr ':' '\\n'` to see where the shell looks for commands."

[[note]]
level = "beginner"
topic = "Security"
text = "Load secrets like API keys from environment variables, as in `os.environ[\"API_KEY\"]`, instead of writing them into your source code."

[[note]]
level = "beginner"
topic = "Security"
text = "If SSH warns that your private key's permissions are too open and ignores the key, run `chmod 600 ~/.ssh/id_ed25519`: SSH refuses private keys that other users on the machine could read."

[[note]]
level = "beginner"
topic = "Cryptography"
text = "Create an SSH key with `ssh-keygen -t ed25519 -C \"you@example.com\"`: Ed25519 keys are short, fast and secure, and the comment helps you recognize the key later in lists such as your GitHub settings."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Remove a package with `npm uninstall <pkg>`, which also updates `package.json` and the lockfile; with pip, run `pip uninstall <pkg>` and delete its line from `requirements.txt` yourself."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Log an array of objects with `console.table(rows)` to see it as a table, with one row per item and one column per property."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Get the last element of an array with `items.at(-1)`: negative indexes count back from the end, whereas `items[-1]` just looks up a property named `\"-1\"` and returns `undefined`."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Pad numbers for display with `String(n).padStart(2, '0')`, which turns `7` into `\"07\"`, handy for building times like `09:05` or fixed-width codes."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Get the first matching item with `users.find((u) => u.id === id)`, which returns that element or `undefined`; use `filter` when you want every match as an array."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Pretty-print data with `JSON.stringify(obj, null, 2)` to see nested objects and arrays indented by two spaces per level."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Add a `debugger;` statement to your code and keep the browser DevTools open: execution pauses on that line when it runs, so you can inspect every variable in scope."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Read nested properties safely with optional chaining: `user?.address?.city` gives `undefined` instead of throwing when `user` or `address` is missing."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Loop over an array with both index and value using `for (const [i, item] of items.entries())`, which gives you each position and element together without a separate counter variable."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Turn on `noUnusedLocals` and `noUnusedParameters` in `tsconfig.json` to get errors for variables and parameters you declared but never use, which often point at a typo or unfinished code."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Remove duplicates from an array with `[...new Set(items)]`, which keeps the first occurrence of each value in its original order."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Read long TypeScript errors from the bottom up: the first line states the general mismatch, and the last indented lines name the exact property and types that don't fit."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Wrap `await` calls in `try...catch`, so a failed request becomes an error you can handle and report instead of an unhandled rejection."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Ctrl-click (Cmd-click on macOS) a function or type in VS Code to jump to its definition, including the `.d.ts` file where a library declares it, to see exactly what it accepts and returns."

[[note]]
level = "beginner"
topic = "Web"
text = "Use specific input types such as `type=\"email\"`, `type=\"tel\"` and `type=\"date\"`: phones show a matching keyboard or date picker, and browsers check some formats for you before the form submits."

[[note]]
level = "beginner"
topic = "Web"
text = "Make a show-and-hide section with `<details>` and `<summary>`: it opens and closes without any JavaScript, and works with the keyboard and screen readers out of the box."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Zoom your page to 200% with Ctrl and + (Cmd and + on macOS): text should stay readable, with nothing cut off, overlapping or forcing you to scroll sideways to read a line."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Chrome DevTools can simulate blurred vision and several kinds of color blindness: open the Rendering panel and pick an option under Emulate vision deficiencies to check your page."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Hover over a variable in an editor with TypeScript support to see the type it inferred; often you do not need to write the annotation yourself."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Save a response to a file with `curl -o page.html <url>`, or use `-O` to keep the file name from the end of the URL, instead of letting the body scroll past in your terminal."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Describe a fixed set of choices with a union of string literals, like `type Size = \"s\" | \"m\" | \"l\"`, so an invalid value such as `\"xl\"` becomes a compile error."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Run `npx tsc --noEmit --watch` in a spare terminal: it re-checks the whole project on every save and lists every type error, including ones in files you don't have open."

[[note]]
level = "beginner"
topic = "Observability"
text = "Search a log for errors along with the lines around them using `grep -n -C 3 ERROR app.log`; the lines just before an error usually show what the program was doing when it failed."

[[note]]
level = "beginner"
topic = "Go"
text = "Read Go documentation without leaving the terminal: `go doc strings.Split` prints the function's signature and description."

[[note]]
level = "beginner"
topic = "Go"
text = "Print a struct together with its field names using `fmt.Printf(\"%+v\\n\", s)`; `%T` prints a value's type when you are unsure what you have."

[[note]]
level = "beginner"
topic = "Web"
text = "Center anything inside a box with `display: grid; place-items: center;` on the parent; it centers the child both horizontally and vertically without margins or transforms."

[[note]]
level = "beginner"
topic = "Rust"
text = "Run `cargo check` while you work; it type-checks your code without building a binary, so it finishes much faster than `cargo build`."

[[note]]
level = "beginner"
topic = "Rust"
text = "Wrap an expression in `dbg!(...)` to print the file, line, expression and value to stderr; it returns the value, so it fits inside existing code."

[[note]]
level = "beginner"
topic = "Rust"
text = "Get a longer explanation of any Rust compiler error, with an example, by passing its code to `rustc --explain`, as in `rustc --explain E0382`."

[[note]]
level = "beginner"
topic = "Rust"
text = "In a function that returns a `Result`, put `?` after a call that can fail; it hands the error back to the caller right away, saving you a `match` on every call."

[[note]]
level = "beginner"
topic = "Rust"
text = "Add `#[derive(Debug)]` to your structs so you can print them with `{:?}`, or with `{:#?}` for an indented multi-line view."

[[note]]
level = "beginner"
topic = "Rust"
text = "Prefer `.expect(\"config file should exist\")` to `.unwrap()`; when it panics, the message tells you which assumption failed."

[[note]]
level = "beginner"
topic = "Java"
text = "Try Java snippets without creating a project by running `jshell`: type an expression, see the result immediately, and type `/exit` to leave."

[[note]]
level = "beginner"
topic = "Java"
text = "Run a single-file program directly with `java Hello.java`; the launcher compiles it in memory, so you can skip `javac` for quick experiments."

[[note]]
level = "beginner"
topic = "Incidents"
text = "When your site seems down, try it from your phone on mobile data instead of your home Wi-Fi: if it loads there, the problem is your network or computer, not the site."

[[note]]
level = "beginner"
topic = "Java"
text = "Print an array's contents with `Arrays.toString(arr)`; printing the array itself shows only a type code and hash, like `[I@1b6d3586`."

[[note]]
level = "beginner"
topic = "Java"
text = "Use a record for simple data holders, as in `record Point(int x, int y) {}`; Java generates the constructor, accessors, `equals`, `hashCode` and `toString`."

[[note]]
level = "beginner"
topic = "C"
text = "Compile C with warnings and debug info, as in `gcc -Wall -Wextra -g prog.c -o prog`; the warnings catch many beginner mistakes and `-g` lets a debugger show your source lines."

[[note]]
level = "beginner"
topic = "Web"
text = "Add `max-width: 100%; height: auto;` to images in your stylesheet, so large pictures shrink to fit narrow screens instead of overflowing, while keeping their proportions."

[[note]]
level = "beginner"
topic = "C"
text = "When a C program crashes, start it with `gdb ./prog`, type `run`, and after the crash type `bt` to see the chain of function calls that led there."

[[note]]
level = "beginner"
topic = "C"
text = "Look up C library functions with `man 3 printf`; plain `man printf` opens the page for the shell command of the same name."

[[note]]
level = "beginner"
topic = "DNS"
text = "Check when a domain expires and which registrar holds it with `whois example.com`; renewing before that date keeps your site and email from disappearing."

[[note]]
level = "beginner"
topic = "Testing"
text = "Run a single Go test by name with `go test -run TestParse ./...`; `-run` takes a regular expression, and adding `-v` prints each test as it runs."

[[note]]
level = "beginner"
topic = "Performance"
text = "In Java, build strings inside loops with a `StringBuilder` and call `toString()` once at the end, instead of creating a new string with `+` on every pass."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Run `cargo doc --open` in a Rust project to browse documentation for your own code and every dependency, matching the exact versions you use."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Run `npm view <pkg> versions` to list every published version of a package, and `npm view <pkg> version` for the current latest, before choosing what to put in `package.json`."

[[note]]
level = "beginner"
topic = "Networking"
text = "Add `-v` when an `ssh` connection fails, as in `ssh -v user@host`, to see each step it takes: which server it reached, which keys it offered and where the login stopped; `-vvv` shows even more."

[[note]]
level = "beginner"
topic = "Testing"
text = "Run `pytest -x` to stop at the first failing test, and `pytest -k login` to run only the tests whose names match `login`."

[[note]]
level = "beginner"
topic = "Testing"
text = "Rerun only the tests that failed last time with `pytest --lf`, then run the full suite once they pass."

[[note]]
level = "beginner"
topic = "Testing"
text = "Node has a test runner built in: import `test` from `node:test`, write your checks with `node:assert`, and run them with `node --test`."

[[note]]
level = "beginner"
topic = "Testing"
text = "Python ships with a test framework: write `unittest.TestCase` classes in files named `test_*.py` and run them all with `python3 -m unittest`."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Read a Python traceback from the bottom up: the last line names the error, and the entries above it trace the calls that led there, so start with the lowest one in your own file."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Search for an error message by pasting its exact text in quotes, after removing the parts specific to your machine such as file paths, names and line numbers."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Explain your code out loud, line by line, to a colleague or even a rubber duck; saying what each line should do often exposes the one that does something else."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Shrink a failing case step by step: delete code or input until the bug disappears, and the last thing you removed points to the cause."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Find the commit that broke something with `git bisect start`, then mark one bad and one good commit; Git checks out midpoints for you to test until it names the culprit. Finish with `git bisect reset`."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Run a shell script with `bash -x script.sh` to print each command, with its variables already expanded, just before it runs."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Print suspicious strings with `repr()`, as in `print(repr(line))`, to reveal hidden spaces, tabs and newline characters that plain `print` hides."

[[note]]
level = "beginner"
topic = "Debugging"
text = "When a tutorial's commands fail, compare your tool versions with `node --version`, `python3 --version` or `git --version`; many errors come from following instructions written for a different release."

[[note]]
level = "beginner"
topic = "Debugging"
text = "When a change seems to have no effect, add an obvious print at the top of the file; if it never appears, you are not running the code you think you are."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Add `import sys; print(sys.executable)` to your script when a package you just installed seems to be missing; it shows which Python is actually running the code."

[[note]]
level = "beginner"
topic = "Debugging"
text = "When an error points at a line that looks fine, check the line above it too; a missing bracket, quote or semicolon is often reported where the parser gives up."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Open the browser console first when a web page misbehaves; JavaScript errors show up there with the file name and line number that caused them."

[[note]]
level = "beginner"
topic = "Testing"
text = "Structure each test in three steps, arrange, act and assert: set up the inputs, call the one thing you are testing, then check the result."

[[note]]
level = "beginner"
topic = "DNS"
text = "After a DNS change, clear your own machine's cache with `sudo resolvectl flush-caches` on Linux with systemd-resolved, `sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder` on macOS or `ipconfig /flushdns` on Windows."

[[note]]
level = "beginner"
topic = "Observability"
text = "Give every log line a time and a level: in Python, `logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(name)s: %(message)s')` shows when each message was written, how serious it is and which module wrote it."

[[note]]
level = "beginner"
topic = "Linux"
text = "Skip the header line of a CSV file with `tail -n +2 data.csv`: a `+` before the number means start at that line, rather than show that many lines from the end."

[[note]]
level = "beginner"
topic = "Tooling"
text = "If `git commit` opens Vim, press `Esc`, type `:wq` and press Enter to save and quit; to get a different editor next time, run `git config --global core.editor nano`."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Run a linter, such as `ruff check .` for Python or ESLint for JavaScript; it flags unused variables and likely bugs before you even run the code."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Give long commands you run often a short name, such as a `Makefile` target or a `package.json` script, so `make test` or `npm test` is all you need to remember."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Learn your editor's go-to-definition and find-all-references commands; they show where something is defined and everywhere it is used, faster than a text search."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Run `npm run` with no script name to list every script defined in the project's `package.json`."

[[note]]
level = "beginner"
topic = "SQL"
text = "Add `LIMIT 10` to exploratory queries in PostgreSQL, MySQL or SQLite to see a handful of rows instead of a screen flooded with thousands."

[[note]]
level = "beginner"
topic = "SQL"
text = "Test for missing values with `IS NULL` or `IS NOT NULL`; a comparison like `col = NULL` is never true, so it silently matches no rows."

[[note]]
level = "beginner"
topic = "SQL"
text = "Count rows per category with `SELECT status, COUNT(*) FROM orders GROUP BY status`, which returns one row per status with the number of orders in it."

[[note]]
level = "beginner"
topic = "SQL"
text = "Count unique values with `COUNT(DISTINCT city)`, which counts each different city once and ignores `NULL`, while `COUNT(city)` counts every row that has a city."

[[note]]
level = "beginner"
topic = "SQL"
text = "Use `LEFT JOIN` when you need every row from the first table even without a match in the second; the missing columns come back as `NULL`."

[[note]]
level = "beginner"
topic = "SQL"
text = "Fill in blanks in query results with `COALESCE`, as in `COALESCE(nickname, name)`, which returns the first of its arguments that is not `NULL`."

[[note]]
level = "beginner"
topic = "SQL"
text = "Label rows inside a query with `CASE`, SQL's version of if and else, as in `CASE WHEN total >= 100 THEN 'large' ELSE 'small' END AS size`."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Print just the status code of a request with `curl -s -o /dev/null -w '%{http_code}\\n' <url>`, a quick way to check whether a page answers 200, 404 or 500."

[[note]]
level = "beginner"
topic = "Web"
text = "Right-click any element on a page and choose Inspect to see every CSS rule applied to it, with overridden declarations crossed out."

[[note]]
level = "beginner"
topic = "Web"
text = "Add `* { outline: 1px solid red; }` to your stylesheet for a moment to see the box around every element and spot what is overflowing."

[[note]]
level = "beginner"
topic = "APIs"
text = "Pipe API responses through `jq` to pretty-print them and pull out fields, as in `curl -s <url> | jq '.items[0].name'`, instead of squinting at one long line of JSON."

[[note]]
level = "beginner"
topic = "APIs"
text = "When an API call fails with a `400`, print the response body as well as the status code; most APIs explain there exactly which field or parameter was wrong."

[[note]]
level = "beginner"
topic = "Databases"
text = "Practice SQL without installing a server: Python's built-in `sqlite3` module creates a database file with `sqlite3.connect('shop.db')`, and `sqlite3.connect(':memory:')` gives a throwaway one."

[[note]]
level = "beginner"
topic = "Containers"
text = "Copy a file out of a container, even one that has already stopped, with `docker cp mycontainer:/app/output.log .`, and copy a file into it by swapping the two arguments."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Mark the header cells of a data table with `<th>` instead of bold `<td>` cells, so screen readers announce the matching column or row header as a user moves from cell to cell."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Open the Network tab in your browser's DevTools before reloading to see every request the page makes, with its status code, size and timing."

[[note]]
level = "beginner"
topic = "Databases"
text = "In `psql`, type `\\?` to list every backslash command and `\\h CREATE INDEX` to see the syntax of a SQL command, without leaving the prompt to search the docs."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Send JSON with curl by adding `-H \"Content-Type: application/json\"` to `-d '{\"name\": \"Ada\"}'`; without that header, curl labels the body as form data. `-d` also makes the request a POST."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Right-click a request in the DevTools Network tab and copy it as cURL to replay the exact same request from your terminal, headers and all."

[[note]]
level = "beginner"
topic = "Containers"
text = "Run `docker stats` to see live CPU, memory and network use for each running container; it quickly shows which one is slowing your computer down."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Replace a bare number such as `86400` with a named constant like `SECONDS_PER_DAY`; the code then says what the number means, and changing it happens in one place."

[[note]]
level = "beginner"
topic = "APIs"
text = "Call `response.raise_for_status()` after a `requests` call to turn 4xx and 5xx responses into exceptions instead of carrying on with an error page."

[[note]]
level = "beginner"
topic = "APIs"
text = "Save a real API response to a JSON file and load it in your tests, so they run offline and quickly instead of calling the live service every time."

[[note]]
level = "beginner"
topic = "Regex"
text = "Write Python regular expressions as raw strings, like `r\"\\d{3}-\\d{4}\"`, so backslashes reach the regex engine instead of being read as string escapes."

[[note]]
level = "beginner"
topic = "Regex"
text = "Use anchors when validating input: `^\\d+$` requires the whole line to be digits, while `\\d+` alone also matches the `123` inside `abc123`."

[[note]]
level = "beginner"
topic = "Regex"
text = "Match whole words with `\\b`: the pattern `\\bcat\\b` finds `cat` on its own but not inside `concatenate` or `cats`."

[[note]]
level = "beginner"
topic = "Regex"
text = "Add `?` after `*` or `+` to make it lazy: in `[a] and [b]`, the pattern `\\[.*\\]` matches the whole text, while `\\[.*?\\]` stops at `[a]`."

[[note]]
level = "beginner"
topic = "Data"
text = "Keep full precision in stored and calculated values, and round only when you display them, as with `f\"{total:.2f}\"` in Python; rounding at every step lets small errors add up."

[[note]]
level = "beginner"
topic = "Containers"
text = "Name your containers when you start them, as in `docker run -d --name web nginx`, so later commands can say `docker logs web` or `docker stop web` instead of a generated name or ID."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Put your mouse aside and move through your page with Tab, Shift+Tab and Enter; anything you cannot reach, or cannot see focused, needs fixing."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Connect each form field to a `<label>` by giving the label a `for` attribute that matches the field's `id`; clicking the label then focuses the field, and screen readers announce it."

[[note]]
level = "beginner"
topic = "HTTP"
text = "In Firefox's Network panel, right-click a request and choose Edit and Resend to change a header or the body and send it again, without leaving the browser."

[[note]]
level = "beginner"
topic = "Data"
text = "Save data with `json.dump(data, f, indent=2)` instead of the default single line: the indented file is readable in an editor, and Git diffs show exactly which values changed."

[[note]]
level = "beginner"
topic = "Containers"
text = "Run a command inside a running container with `docker exec -it web sh` to look around its files and environment; typing `exit` then leaves the shell without stopping the container, unlike exiting `docker run -it`."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Write comments that explain why the code does something, like a workaround or a business rule; the code itself already shows what it does."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Write down setup steps while you do them for the first time; that list becomes the install section of your README with almost no extra work."

[[note]]
level = "beginner"
topic = "Testing"
text = "Run `npx jest --watch` while you work: after each save it reruns only the tests related to files you changed, so you see a break seconds after you make it."

[[note]]
level = "beginner"
topic = "Code review"
text = "Keep each pull request focused on one change; a short diff gets a faster and more careful review than one that mixes a feature, a refactor and a formatting pass."

[[note]]
level = "beginner"
topic = "Code review"
text = "In a pull request description, say what changed, why, and how to test it, and add a screenshot when the change is visible in the interface."

[[note]]
level = "beginner"
topic = "Releases"
text = "Attach built files to a GitHub release with `gh release create v1.0.0 dist/*`, so users download exactly the files you tested instead of building from source themselves."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "When you ask for help with a bug, include the exact versions involved, such as the output of `python3 --version` and `pip freeze`, or `node --version` and `npm ls`; many bugs appear only in one version."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Install tools you only need while developing, such as test runners and linters, with `npm install --save-dev`, keeping them apart from what your app needs to run."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Print an installed package's version from Python with `importlib.metadata.version(\"requests\")`, which works even for packages that define no `__version__` attribute."

[[note]]
level = "beginner"
topic = "Performance"
text = "Measure before optimizing: put `time` in front of a command, as in `time python3 script.py`, to get a real number you can compare after each change."

[[note]]
level = "beginner"
topic = "Performance"
text = "Find where a Python script spends its time with `python3 -m cProfile -s cumtime script.py`, which lists functions sorted by cumulative time."

[[note]]
level = "beginner"
topic = "Performance"
text = "Time a section of JavaScript with `console.time(\"load\")` before it and `console.timeEnd(\"load\")` after it; the two labels must match."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Check membership with a `set` or `dict` instead of a list inside loops; `x in my_set` stays fast as the collection grows, while a list is searched item by item."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Trace your algorithm by hand on a tiny input, writing down every variable after each step; where your notes and the real output differ, the logic went wrong."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Pass `encoding=\"utf-8\"` when you open text files in Python, so your code reads and writes them the same way on every operating system."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Identify a mysterious character in Python with `unicodedata.name(ch)`, which returns names like `NO-BREAK SPACE`, or with `hex(ord(ch))` for its code point."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Find where a value belongs in a sorted list with `bisect.bisect_left(scores, x)` from Python's standard library, which uses binary search instead of a scan; `bisect.insort` inserts while keeping the list sorted."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Fold noisy output in a GitHub Actions log by printing `::group::Install dependencies` before it and `::endgroup::` after it; the log then shows that part as one line you can expand."

[[note]]
level = "beginner"
topic = "Data"
text = "Pretty-print and check a JSON file with `python3 -m json.tool data.json`; if the JSON is invalid, it reports the line and column where parsing failed."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Check that brackets are balanced with a stack: push each opening bracket, and on each closing one pop and compare; the text is balanced only if every pop matches and the stack ends empty."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "Give each thread or task its own result list and combine the lists after they all finish, instead of having every worker append to one shared structure; nothing shared means nothing to lock."

[[note]]
level = "beginner"
topic = "Data"
text = "Count how often each line appears with `sort file | uniq -c | sort -rn`; `uniq` only merges adjacent duplicates, which is why the first `sort` is needed."

[[note]]
level = "beginner"
topic = "Databases"
text = "In `psql`, `\\dt` lists the tables, `\\d users` shows the columns, types and indexes of `users`, and `\\x auto` switches rows too wide for the screen to a vertical layout."

[[note]]
level = "beginner"
topic = "Databases"
text = "In the `sqlite3` shell, `.tables` lists the tables, `.schema users` shows how a table was created, and `.headers on` adds column names to results."

[[note]]
level = "beginner"
topic = "Databases"
text = "Save every schema change as a numbered SQL migration file in your repository, so anyone can rebuild the database from scratch by running them in order."

[[note]]
level = "beginner"
topic = "Incidents"
text = "When something that worked yesterday is broken today, list what changed before you start debugging: `git log --since=yesterday --oneline` shows every commit since then, and the cause is often among them."

[[note]]
level = "beginner"
topic = "DNS"
text = "Look up a domain's DNS records with `dig example.com` or `nslookup example.com`; with `dig`, add a type such as `MX` or `TXT` after the name to see those records."

[[note]]
level = "beginner"
topic = "Containers"
text = "Try a Linux distribution without installing it using `docker run --rm -it ubuntu bash`; `-it` gives you an interactive shell and `--rm` deletes the container when you exit."

[[note]]
level = "beginner"
topic = "Containers"
text = "When a container starts and immediately stops, run `docker ps -a` to find it and `docker logs <container>` to read what it printed before exiting."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Add `workflow_dispatch:` under a workflow's `on:` key to get a button in the Actions tab for running it by hand."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Start your first workflow from the Actions tab of your repository: GitHub suggests ready-made workflows for the languages it detects, which you can commit as they are and adjust later."

[[note]]
level = "beginner"
topic = "CI"
text = "Before debugging a red CI check on your pull request, look at the latest run on `main`: if it fails the same way there, the problem came from elsewhere and your change is not the cause."

[[note]]
level = "beginner"
topic = "CI"
text = "When a CI run fails, scroll up to the first error in the log rather than reading only the last lines; later errors are often knock-on effects of the first."

[[note]]
level = "beginner"
topic = "CI"
text = "To learn how a project is built and tested, read its CI configuration, such as the files in `.github/workflows/` or `.gitlab-ci.yml`; it lists the exact setup steps and commands a change has to pass."

[[note]]
level = "beginner"
topic = "APIs"
text = "If an API publishes interactive documentation, such as a Swagger UI page, use its Try it out button to send real requests and see the exact responses before you write any code."

[[note]]
level = "beginner"
topic = "Testing"
text = "Put a short example in a Python docstring as a `>>>` line followed by the expected output, then run `python3 -m doctest -v file.py` to check that the example still gives that output."

[[note]]
level = "beginner"
topic = "Teams"
text = "Give yourself a time limit when stuck, such as 30 minutes, then ask for help and share what you have already ruled out; a short question often saves hours."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Split a long function into smaller ones that each do one job and have a name saying what that job is; each piece is then easier to test and debug."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Start with the simplest design that works: one app and one database carry most projects a long way. Add caches, queues or separate services only when you can point to a problem they solve."

[[note]]
level = "beginner"
topic = "Testing"
text = "In pytest, write a plain `assert result == expected`: when it fails, pytest prints both values and highlights where they differ, so you rarely need special assertion methods."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "Stop a background thread cleanly with a `threading.Event`: the worker loops on `while not stop.is_set():`, and the main program calls `stop.set()` and then `join()` to wait for it to finish its current pass."

[[note]]
level = "beginner"
topic = "Performance"
text = "Stop at the first match with `any()`, as in `any(x > 100 for x in values)`, which quits as soon as one item qualifies, instead of building a whole filtered list just to check its length."

[[note]]
level = "beginner"
topic = "Cloud"
text = "Try cloud commands in your browser with your provider's cloud shell, such as AWS CloudShell or Google Cloud Shell: it opens a terminal with the provider's CLI already installed and signed in as you."

[[note]]
level = "beginner"
topic = "Supply chain"
text = "Before installing a package, check that the name is spelled exactly right and that the project looks maintained; lookalike names of popular packages are a known way to spread malware."

[[note]]
level = "beginner"
topic = "Performance"
text = "Pass a generator straight to `sum()`, as in `sum(x * x for x in nums)`, to total values without building a list first; on large inputs this saves the memory the whole list would take."

[[note]]
level = "beginner"
topic = "Cloud"
text = "SSH refuses a private key file that other users can read, so after downloading a key pair for a cloud server, run `chmod 400 key.pem` before connecting with `ssh -i key.pem user@host`."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Learn the three stepping buttons of your debugger: step over runs the current line and stops at the next, step into enters the function that line calls, and step out finishes the current function and stops in its caller."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Start Bash scripts with `set -euo pipefail`: stop at the first failing command, treat unset variables as errors, and fail a pipeline when any stage fails."

[[note]]
level = "intermediate"
topic = "Shell"
text = "In a Bash script, create scratch space with `tmp=$(mktemp -d)` and add `trap 'rm -rf \"$tmp\"' EXIT` right after it, so the directory is removed whether the script succeeds, fails or is interrupted."

[[note]]
level = "intermediate"
topic = "Time"
text = "Time the steps of a Bash script with the built-in `SECONDS` variable: set `SECONDS=0` before a step and log `$SECONDS` after it to get the elapsed whole seconds without calling `date`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Pipe `find . -name '*.log' -print0` into `xargs -0 gzip` so file names containing spaces, quotes or even newlines reach the command intact."

[[note]]
level = "intermediate"
topic = "Shell"
text = "End `find -exec` with `+` instead of `\\;`, as in `find . -name '*.tmp' -exec rm {} +`, so many files go to each command and far fewer processes start."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Compare the output of two commands without temporary files using process substitution: `diff <(sort old.txt) <(sort new.txt)` works in Bash and Zsh."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Check for required tools at the top of a script with `command -v jq >/dev/null || { echo 'jq is required' >&2; exit 1; }`; `command -v` is POSIX, unlike `which`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Give a variable a default with `${PORT:-8080}`: it expands to the value of `PORT` when that is set and non-empty, and to `8080` otherwise."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Fail fast on missing configuration with `: \"${API_URL:?API_URL must be set}\"`; if the variable is unset or empty, the shell prints the message and the script exits."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Trim paths without calling `sed` or `basename`: `${file%.tar.gz}` drops a suffix, `${path##*/}` keeps the file name and `${path%/*}` keeps the directory."

[[note]]
level = "intermediate"
topic = "Regex"
text = "Print only the part of a file between two markers with `sed -n '/BEGIN/,/END/p' file`; each range starts at a line matching the first pattern and runs through the next line matching the second."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Add `-r` when a `jq` result feeds another command, as in `jq -r '.[].name' users.json | sort`; without it, strings keep their JSON double quotes and escapes."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Python's `json.dumps` escapes every non-ASCII character as `\\uXXXX` by default, so `é` becomes `\\u00e9`; pass `ensure_ascii=False`, and write the file as UTF-8, to keep the text readable."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Press `Ctrl-X Ctrl-E` in Bash to open the current command line in your editor (`$VISUAL` or `$EDITOR`); when you save and quit, the edited command runs."

[[note]]
level = "intermediate"
topic = "Git"
text = "Find the commit that introduced or removed a string with `git log -S 'retryCount' --oneline`; it lists only commits that change how many times the string occurs."

[[note]]
level = "intermediate"
topic = "Git"
text = "Run `git config --global fetch.prune true` so every fetch deletes remote-tracking branches that no longer exist on the server; otherwise `git branch -r` keeps listing branches deleted months ago."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Store answers you type often, such as a request for reproduction steps, as saved replies in your GitHub settings, then insert them from the toolbar of any comment box."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Review prose and long config lines with `git diff --word-diff`, which marks just the changed words inline instead of showing whole lines as removed and re-added."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Post a short written update in the team channel each week: what shipped, what is blocked and what is next. It can replace a status meeting, and teammates in other time zones get the same picture."

[[note]]
level = "intermediate"
topic = "Git"
text = "Search only tracked files with `git grep -n 'TODO'`, which skips untracked and ignored files like build output; add a tag or commit, as in `git grep -n 'TODO' v2.0`, to search an older version."

[[note]]
level = "intermediate"
topic = "Git"
text = "Follow one function's history with `git log -L :parse_config:src/config.py`; Git shows only the commits that changed that function, each with a diff of just its lines."

[[note]]
level = "intermediate"
topic = "Git"
text = "Read a file as it is on another branch or commit without switching: `git show main:src/app.js`, or `git show HEAD~3:src/app.js` for three commits ago."

[[note]]
level = "intermediate"
topic = "Git"
text = "Take a single file from another branch with `git restore --source=main -- config/settings.py`; only that file in your working tree changes, and nothing is merged."

[[note]]
level = "intermediate"
topic = "Git"
text = "Backport a fix with `git cherry-pick -x <sha>`: Git appends `(cherry picked from commit ...)` to the message, so the original and the copy can be traced to each other."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Before time off, write a short handoff in the issue or team channel: your open pull requests, the state of each branch and who can decide in your place, so your work keeps moving without you."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Check the links in your docs in CI: renamed files and moved pages break relative links without any build error, and readers find the dead ones long before you do."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Type a lookup table as `Record<Status, string>`, where `Status` is a union, and TypeScript reports every missing key, so adding a new status fails the build until each table handles it."

[[note]]
level = "intermediate"
topic = "Git"
text = "Run `git diff origin/main...HEAD` (three dots) to see only what your branch changed since it forked from `main`, which is what a pull request shows."

[[note]]
level = "intermediate"
topic = "Git"
text = "Run `git diff --check` before committing: it flags trailing whitespace and leftover conflict markers and exits non-zero; add `--cached` to check staged changes in a pre-commit hook."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Pin a short summary to the top of the incident channel, covering current impact, who is leading and when the next update is due, and edit it as things change, so people joining late need not scroll back."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Add a `CODEOWNERS` file in `.github/`, the repository root or `docs/`, and GitHub automatically requests reviews from the owners of every path a pull request touches."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Open a draft pull request early to run CI and get feedback on the approach; code owners are not requested for review until you mark it ready for review."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Check out a teammate's pull request locally with `gh pr checkout 123`; the GitHub CLI fetches the branch, even from a fork, and switches to it."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Press `t` in a GitHub repository to open the file finder, then type part of a path to jump to any file on the current branch."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Serialize only chosen fields with `JSON.stringify(user, ['id', 'name'])`: an array as the second argument acts as an allowlist of property names, applied at every level of nesting."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Credit a pairing partner by ending the commit message with a `Co-authored-by: Name <email>` trailer; GitHub then shows both people as authors of the commit."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Tick the Viewed checkbox on each file as you work through a large pull request; GitHub collapses the file and unmarks it again if it changes afterwards."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Follow a systemd service's logs with `journalctl -u myapp -f`, or add `--since '1 hour ago'` to see only recent entries instead of the whole history."

[[note]]
level = "intermediate"
topic = "Linux"
text = "After a reboot or deploy, run `systemctl --failed` to list every systemd unit that failed, then `systemctl status <unit>` to see its state and latest log lines."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Generate a starting manifest instead of writing YAML from memory: `kubectl create deployment web --image=nginx --dry-run=client -o yaml > web.yaml` writes the object to a file without creating it."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Check the `available` column of `free -h`, not `free`: Linux fills otherwise unused memory with disk cache and gives it back to programs when they need it."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "Keep a sliding window of recent items with `collections.deque(maxlen=100)`: once it is full, each `append` drops the oldest item automatically, which suits moving averages and recent-history buffers."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Find what is filling a disk with `du -sh * | sort -h`; GNU `sort -h` orders human-readable sizes like `512K`, `40M` and `2G` correctly."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Follow rotated logs with `tail -F` instead of `tail -f`: it notices when the file is replaced, reopens it by name and keeps going."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Run `lsof -i :8080` to find the process holding port 8080, the usual culprit behind an \"address already in use\" error, on Linux or macOS."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Check whether a TCP port is reachable from where you are with `nc -zv db.internal 5432`; it reports whether the connection succeeds without sending any data."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Reach a database that only a bastion host can see with `ssh -L 5433:db.internal:5432 bastion`, then point your client at `localhost:5433`."

[[note]]
level = "intermediate"
topic = "Networking"
text = "On Linux, `ip -br addr` prints one line per network interface with its addresses, and `ip route get 10.0.0.5` shows which interface and gateway traffic to that address would use."

[[note]]
level = "intermediate"
topic = "DNS"
text = "Run `dig +noall +answer api.example.com` twice against the same resolver: if the TTL counts down between runs, you are seeing a cached answer, and the number is how many seconds that resolver will keep serving it."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "When only some requests fail, compare the failing ones with the rest: the attribute they share, such as a region, app version, host, browser or customer plan, usually points straight at the cause."

[[note]]
level = "intermediate"
topic = "DNS"
text = "Test a new server before moving DNS: `curl --resolve app.example.com:443:203.0.113.10` followed by the site's usual URL connects to that IP but still sends the real hostname for TLS and `Host`."

[[note]]
level = "intermediate"
topic = "Python"
text = "Add `@functools.lru_cache` above a pure function that gets called repeatedly with the same arguments, and repeat calls return the stored result instead of recomputing it; `cache_info()` shows hits and misses."

[[note]]
level = "intermediate"
topic = "Python"
text = "Inside an `except` block, write `raise ConfigError('invalid port') from err`: the traceback then presents the original error as the direct cause instead of as a second failure during handling."

[[note]]
level = "intermediate"
topic = "Python"
text = "Run external commands with `subprocess.run(['git', 'status'], check=True, capture_output=True, text=True)`: a non-zero exit raises `CalledProcessError`, and the output arrives as strings in `.stdout` and `.stderr`."

[[note]]
level = "intermediate"
topic = "Python"
text = "Replace hand-written `__init__`, `__repr__` and `__eq__` methods with `@dataclass`, which generates them from the annotated fields; add `frozen=True` to make instances immutable."

[[note]]
level = "intermediate"
topic = "Python"
text = "Group items without checking for missing keys using `collections.defaultdict(list)`: `groups[key].append(item)` creates the empty list the first time each key appears."

[[note]]
level = "intermediate"
topic = "Python"
text = "Ignore one expected exception without an empty `except` block: `with contextlib.suppress(FileNotFoundError): os.remove(path)` deletes the file if it exists and carries on if it does not."

[[note]]
level = "intermediate"
topic = "Python"
text = "Call `logger.exception('sync failed')` inside an `except` block instead of `logger.error(str(e))`; it logs at ERROR level and attaches the full traceback, so you can see where the failure started."

[[note]]
level = "intermediate"
topic = "Python"
text = "Install the package you are developing with `python3 -m pip install -e .` in its virtual environment; imports then load straight from your source tree, so edits take effect without reinstalling."

[[note]]
level = "intermediate"
topic = "Python"
text = "Open data files that ship with your code relative to the module, as in `Path(__file__).resolve().parent / 'schema.sql'`, so the script works no matter which directory it is started from."

[[note]]
level = "intermediate"
topic = "Python"
text = "Sort by several fields at once by returning a tuple from the key function: `sorted(players, key=lambda p: (p.team, -p.score))` orders by team, then by highest score within each team."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Log variables inside an object literal, as in `console.log({ user, total })`, and the output labels each value with its variable name, so several logged values never get mixed up."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Drop `console.count('render')` into a function to log how many times it has run so far, a quick way to spot components or handlers that fire far more often than you expect."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Pass extra flags to the command behind an npm script by putting them after `--`: `npm test -- --watch` hands `--watch` to your test runner instead of to npm itself."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Build a transformed copy of an object in one expression: `Object.fromEntries(Object.entries(prices).map(([k, v]) => [k, v * 2]))` doubles every value and leaves `prices` untouched."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Format money with `Intl.NumberFormat` instead of string math: `new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(1234.5)` returns `$1,234.50`."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Store lookups keyed by user input in a `Map` rather than a plain object: any value can be a key, `.size` counts the entries, and inherited names like `constructor` can never collide with your data."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Give options defaults while unpacking them: `const { retries = 3, timeout = 5000 } = options;` fills in a value only when that property is `undefined`, so an explicit `0` is kept."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Cancel a stale `fetch` when a newer one replaces it, as on each keystroke in a search box: create an `AbortController`, pass its `signal` to `fetch`, and call `abort()` before starting the next request."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Derive a union type from a constant list with `as const`: after `const roles = ['admin', 'editor'] as const`, the type `(typeof roles)[number]` is `'admin' | 'editor'`, so the list and the type cannot drift apart."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Reuse the type a function already returns with `ReturnType<typeof createStore>`, or `Awaited<ReturnType<typeof fetchUser>>` for an async one, so the type follows the function when it changes."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Derive related types instead of copying fields: `Partial<User>` makes every field optional, `Pick<User, 'id' | 'name'>` keeps only those two, and `Omit<User, 'password'>` drops one."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Write `import type { User } from './types'` for imports used only as types; the whole line is erased from the output, so it can never load a module or create a runtime import cycle."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Write a type guard such as `function isUser(x: unknown): x is User` to check data once; wherever it returns `true`, TypeScript narrows the value to `User` without any casts."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Run `tsc --showConfig` to print the compiler options that actually apply after every `extends` is merged, which settles which `tsconfig.json` setting wins."

[[note]]
level = "intermediate"
topic = "Go"
text = "Write table-driven tests that call `t.Run(tc.name, ...)` for each case: a failure names the exact case, and `go test -run 'TestParse/empty'` reruns just that one."

[[note]]
level = "intermediate"
topic = "Go"
text = "Call `t.Helper()` at the top of a test helper function, and failures are reported at the line in the test that called the helper instead of inside the helper."

[[note]]
level = "intermediate"
topic = "Go"
text = "Use `t.TempDir()` for scratch files in Go tests: each call returns a fresh directory that the testing package deletes automatically when the test and its subtests finish."

[[note]]
level = "intermediate"
topic = "Go"
text = "Bound outgoing calls with `ctx, cancel := context.WithTimeout(ctx, 2*time.Second)` followed by `defer cancel()`; any function that respects the context stops waiting once the deadline passes."

[[note]]
level = "intermediate"
topic = "Go"
text = "Pull a specific error type out of a wrapped chain with `errors.As`: after `var pathErr *fs.PathError`, `errors.As(err, &pathErr)` fills it in so you can read fields like `pathErr.Path`."

[[note]]
level = "intermediate"
topic = "Web"
text = "Serve responsive images with `srcset` and `sizes`, as in `<img srcset=\"a-480.jpg 480w, a-960.jpg 960w\" sizes=\"(max-width: 600px) 100vw, 50vw\">`, so phones download a small file instead of the desktop one."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Add `-- --nocapture` to `cargo test` to see `println!` output from passing tests; by default the test harness captures it and shows it only for tests that fail."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Run a panicking program with `RUST_BACKTRACE=1` set, as in `RUST_BACKTRACE=1 cargo run`, to print the chain of calls that led to the panic instead of just its message."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Convert an `Option` into a `Result` with `.ok_or(MyError::Missing)?`, or `ok_or_else` when building the error is costly, so `?` can return early from a function that returns `Result`."

[[note]]
level = "intermediate"
topic = "Java"
text = "Open files, sockets and JDBC connections in a try-with-resources header, as in `try (var in = Files.newBufferedReader(path))`; Java closes them when the block exits, even when an exception is thrown."

[[note]]
level = "intermediate"
topic = "Java"
text = "Group a list in one pass with `orders.stream().collect(Collectors.groupingBy(Order::status))`, which returns a `Map` from each status to the orders that have it."

[[note]]
level = "intermediate"
topic = "Java"
text = "Build a map of lists without null checks: `map.computeIfAbsent(key, k -> new ArrayList<>()).add(value)` creates the list only the first time the key appears."

[[note]]
level = "intermediate"
topic = "DNS"
text = "Check that all of a domain's authoritative nameservers agree with `dig +nssearch example.com`: it prints the SOA serial each one serves, so a server that missed a change stands out."

[[note]]
level = "intermediate"
topic = "C"
text = "Compile a single-file program without writing a Makefile: `make prog CFLAGS='-Wall -g'` uses Make's built-in rules to build `prog` from `prog.c`."

[[note]]
level = "intermediate"
topic = "C"
text = "On Linux, run `valgrind --leak-check=full ./prog` to list each memory leak along with the stack trace of the allocation that was never freed."

[[note]]
level = "intermediate"
topic = "C"
text = "Compile with `-fsanitize=undefined` in GCC or Clang to catch undefined behavior such as signed integer overflow and out-of-range shifts when it happens, reported with the file and line."

[[note]]
level = "intermediate"
topic = "Git"
text = "Keep editor and OS clutter such as `.DS_Store` or `.idea/` out of every repository with one personal ignore file, set by `git config --global core.excludesFile ~/.gitignore_global`, instead of adding it to each project's `.gitignore`."

[[note]]
level = "intermediate"
topic = "Git"
text = "Undo a commit that is already on a shared branch with `git revert <sha>`: it adds a new commit that reverses the change, so nobody else's history has to be rewritten."

[[note]]
level = "intermediate"
topic = "Git"
text = "Find out which releases shipped a fix with `git tag --contains <sha>`; `git branch -r --contains <sha>` lists the remote branches that already have it."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Build a command's arguments in a Bash array, as in `args=(--output \"$out\" --verbose)`, then run `cmd \"${args[@]}\"`; each element stays exactly one argument, even when it contains spaces."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Quote the here-document delimiter, as in `cat <<'EOF' > deploy.sh`, and the shell leaves `$variables` and `$(commands)` inside it untouched, which is what you want when generating a script or config file."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Run downloads or other slow jobs in parallel with `xargs -P`: `xargs -n 1 -P 8 curl -sSO < urls.txt` fetches up to eight URLs at a time, one per `curl` process."

[[note]]
level = "intermediate"
topic = "Regex"
text = "Name your capture groups, as in `(?P<year>\\d{4})` in Python or `(?<year>\\d{4})` in JavaScript, then read `m['year']` or `m.groups.year`; the code keeps working when someone adds a group earlier in the pattern."

[[note]]
level = "intermediate"
topic = "Web"
text = "Detect when an element scrolls into view with an `IntersectionObserver` instead of a `scroll` listener that measures positions; the browser tracks the geometry and calls you only when visibility changes."

[[note]]
level = "intermediate"
topic = "Regex"
text = "Wrap user-supplied text in `re.escape()` before building a pattern from it, so characters like `.`, `+` and `(` match literally instead of changing what the regex means."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Compare strings case-insensitively in Python with `a.casefold() == b.casefold()`; unlike `lower()`, `casefold()` also folds characters such as the German `ß` to `ss`."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Put `EXPLAIN` in front of a slow query to see the plan the database chose; in PostgreSQL, a `Seq Scan` over a big table where you expected an `Index Scan` usually points to a missing or unusable index."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Get generated values back from a write with `RETURNING`, as in `INSERT INTO users (email) VALUES ($1) RETURNING id, created_at`, which PostgreSQL and SQLite support; it saves a second query."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Break a long query into named steps with `WITH`: each common table expression works like a temporary view, and you can debug the query by selecting from one step at a time."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Diff two tables with the same columns using `SELECT * FROM orders EXCEPT SELECT * FROM orders_copy`, which returns rows missing from the copy; run it both ways to verify a migration in PostgreSQL or SQLite."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Count several conditions in one pass with `COUNT(*) FILTER (WHERE status = 'paid')` in PostgreSQL, or the portable `SUM(CASE WHEN status = 'paid' THEN 1 ELSE 0 END)`."

[[note]]
level = "intermediate"
topic = "SQL"
text = "In PostgreSQL, where dividing by zero aborts the whole query, write `revenue / NULLIF(orders, 0)`: rows with no orders get `NULL` instead of an error."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Chart daily activity in PostgreSQL by grouping on `date_trunc('day', created_at)`, and left join from `generate_series()` over the date range so days with no rows show up as zero instead of vanishing."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Collapse a one-to-many join into one row per parent with `string_agg(tag, ', ')` in PostgreSQL or `group_concat(tag, ', ')` in SQLite, instead of stitching rows together in application code."

[[note]]
level = "intermediate"
topic = "Databases"
text = "In `psql`, turn on `\\timing` to print how long each query takes, and use `\\watch 5` to rerun a query every five seconds while you wait for a backfill or a lock to clear."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Keep database passwords out of scripts and shell history with a `~/.pgpass` file of `host:port:database:user:password` lines; `psql` and other libpq clients use it only when its permissions are `0600` or stricter."

[[note]]
level = "intermediate"
topic = "Databases"
text = "List running PostgreSQL queries, longest first, with `SELECT pid, now() - query_start AS age, query FROM pg_stat_activity WHERE state = 'active' ORDER BY age DESC`; `pg_cancel_backend(pid)` stops one without closing its connection."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Run SQL scripts with `psql -v ON_ERROR_STOP=1 -f migrate.sql`: by default `psql` reports a failed statement, keeps executing the rest and still exits 0, while this setting stops at the first error with a non-zero exit."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Export query results to a CSV on your own machine with `\\copy (SELECT id, email FROM users) TO 'users.csv' CSV HEADER` in `psql`; unlike plain `COPY ... TO`, it writes the file on the client, not on the database server."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Let the database reject bad data with a named `CHECK` constraint, such as `CONSTRAINT amount_positive CHECK (amount > 0)`; the error message then names the exact rule that was broken."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Run one test over many inputs with `@pytest.mark.parametrize('raw, expected', [('1', 1), (' 2 ', 2)])`; pytest reports each case separately, so one bad input cannot hide the others."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Put a `type` and a `version` field in every message you publish to a queue, so consumers can route by type and handle old and new formats side by side while a change rolls out."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Change environment variables for a single test with pytest's `monkeypatch` fixture, as in `monkeypatch.setenv('FEATURE_X', '1')`; the original value comes back when the test ends, even if it fails."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Let Hypothesis hunt for edge cases: decorate a test with `@given(st.lists(st.integers()))` and it runs the test on many generated inputs, then shrinks any failure to the smallest input that still breaks it."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Run `pytest --pdb` to open the debugger right where a test fails, with the failing frame's local variables ready to inspect."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Assert both the exception type and its message with `with pytest.raises(ValueError, match='negative'):`; `match` is a regular expression searched for in the error message."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Pass `autospec=True` to `mock.patch` so the mock takes on the real function's signature; a call with the wrong arguments then fails the test instead of passing silently."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "Update CloudFormation stacks through a change set: `aws cloudformation create-change-set` lists every resource the update would add, modify or replace, and nothing changes until you run `execute-change-set`."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Test code that waits on timers without really waiting: call `jest.useFakeTimers()`, trigger the code, then `jest.advanceTimersByTime(5000)` to run everything scheduled in the next five seconds at once."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Run `pytest --cov=myapp --cov-report=term-missing` with the pytest-cov plugin to list the exact line numbers no test executes, which tells you far more than the coverage percentage."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Handle results in the order they finish with `concurrent.futures.as_completed(futures)`: it yields each future as soon as its task completes, so one slow download does not hold up processing of the fast ones."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Find the script that keeps changing an element: right-click the element in the Elements panel of Chrome DevTools, choose Break on and then subtree modifications, and the debugger pauses on the line that makes the change."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Set a conditional breakpoint instead of adding a debug `if`: right-click a breakpoint in VS Code or a line number in browser DevTools, enter an expression such as `order.id === 42`, and execution pauses only then."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Call `console.trace('stale cart')` where an unexpected value appears: it prints the label and the full call stack without throwing, which reveals which caller led there."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Debug Node code with real breakpoints: start it with `node --inspect-brk server.js`, which pauses before the first line, then attach your editor's debugger or Chrome DevTools."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "On a button that opens a menu or panel, toggle `aria-expanded` between `true` and `false` as it opens and closes, so screen reader users hear whether the content is currently shown."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Run `DEBUG=express:* node app.js` to turn on the internal logging that Express and many other Node libraries emit through the `debug` package, without editing any code."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "When a program fails to start with a shared library error on Linux, run `ldd ./app`: every library it cannot find is marked `not found`, so you know exactly which one to install."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Add `-v` to a `curl` command to see the whole exchange: lines starting with `>` are the request headers curl sent and lines starting with `<` are the response headers, so you can confirm an auth header really went out."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "In scripts, call `curl -fsS --max-time 30`: `-f` turns HTTP errors into a non-zero exit code, `-sS` hides the progress meter but still prints errors, and `--max-time` caps the whole transfer."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Send an `ETag` with cacheable responses and answer a request whose `If-None-Match` matches it with `304 Not Modified` and no body; clients then revalidate their copy without downloading it again."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Send `Cache-Control: no-store` on responses that contain personal data, so browsers and shared caches do not keep a copy of them."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Make a browser download a response as a file by sending `Content-Disposition: attachment; filename=\"report.csv\"`; the filename in that header becomes the saved file's name."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Answer a successful form POST with a `303 See Other` redirect to a results page; the browser follows it with a GET, so refreshing the page does not submit the form again."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Answer a successful create with `201 Created` and a `Location` header that points at the new resource, so clients learn its address without a second lookup."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Group related radio buttons or checkboxes in a `<fieldset>` with a `<legend>` holding the question, so screen readers announce the question along with each option."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Read the GitHub API's `X-RateLimit-Remaining` and `X-RateLimit-Reset` headers in scripts that make many calls, and sleep until the reset time when the remaining count reaches zero."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Verify each webhook before acting on it: compute an HMAC of the raw request body with the shared secret and compare it to the signature header, such as GitHub's `X-Hub-Signature-256`, in constant time."

[[note]]
level = "intermediate"
topic = "Web"
text = "Tick Disable cache in the DevTools Network tab while you develop; as long as DevTools stays open, every reload fetches fresh files instead of cached ones."

[[note]]
level = "intermediate"
topic = "Web"
text = "Choose a slower network from the throttling menu in the DevTools Network tab to see your loading states, spinners and layout shifts the way users on weak connections do."

[[note]]
level = "intermediate"
topic = "Web"
text = "Refer to the element currently selected in the Elements panel as `$0` in the DevTools console of Chrome or Firefox, so you can inspect it or call its methods without writing a selector."

[[note]]
level = "intermediate"
topic = "Web"
text = "Define colors and spacing once as CSS custom properties, such as `--brand: #0a7;` on `:root`, and use `var(--brand)` everywhere; a theme change is then a single edit, even at runtime from JavaScript."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Give icon-only buttons a name with `aria-label`, as in `<button aria-label=\"Close\">`; without it, a screen reader has nothing to announce but the word button."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Keep a login session across curl calls with a cookie jar: `-c cookies.txt` saves the cookies a server sets, and `-b cookies.txt` sends them back on later requests."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Make the first focusable element on each page a skip link, such as `<a href=\"#main\">Skip to content</a>`, so keyboard users can jump past the navigation instead of tabbing through it every time."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Test your own pages with a screen reader: `Cmd+F5` toggles VoiceOver on macOS, and NVDA is a free screen reader for Windows; listen for unlabeled buttons and headings out of order."

[[note]]
level = "intermediate"
topic = "Security"
text = "Pass values to SQL as query parameters, as in `cur.execute('SELECT * FROM users WHERE email = %s', (email,))` with psycopg, instead of formatting them into the string; the driver then never lets data run as SQL."

[[note]]
level = "intermediate"
topic = "Security"
text = "Protect your SSH private key with a passphrase and add `AddKeysToAgent yes` to `~/.ssh/config`: the running agent keeps the key after its first use, and a stolen copy of the file cannot be used without the passphrase."

[[note]]
level = "intermediate"
topic = "Security"
text = "Sign commits with the SSH key you already have: set `gpg.format` to `ssh`, point `user.signingkey` at your public key and turn on `commit.gpgsign`; GitHub shows them as Verified once the key is added as a signing key."

[[note]]
level = "intermediate"
topic = "Security"
text = "Check whether a secrets file was ever committed with `git log --all --oneline -- .env`; any output means the file is somewhere in history, so treat every secret in it as leaked and rotate it."

[[note]]
level = "intermediate"
topic = "Security"
text = "Run a secret scanner such as gitleaks as a pre-commit hook, so an API key pasted into a config file is caught on your machine before it ever reaches a commit or a push."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Compare tokens and HMAC signatures with `hmac.compare_digest(a, b)` in Python instead of `==`, which can return as soon as a byte differs and so leak how much of a guess was right."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Query elements in UI tests by role and accessible name, as with Testing Library's `getByRole('button', { name: 'Save' })`; when a test cannot find the button that way, a screen reader user cannot either."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "Run `ssh-keygen -lf ~/.ssh/id_ed25519.pub` to print a key's fingerprint, and compare it with the fingerprints GitHub lists in your SSH key settings to find out which key a machine is really using."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "Turn on Dependabot version updates with a `.github/dependabot.yml` that lists each `package-ecosystem`, its `directory` and a `schedule`; outdated dependencies then arrive as small pull requests with release notes attached."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Wrap each third-party API in a small client module of your own, with methods named for your needs such as `charge(order)`; switching vendors or faking the API in tests then touches one file."

[[note]]
level = "intermediate"
topic = "Supply chain"
text = "Before adding an unfamiliar npm package, run `npm view <pkg> scripts` to see whether it defines `preinstall`, `install` or `postinstall` scripts, which would run on your machine during installation."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Run `npm outdated` before upgrading: for each dependency it shows the installed version, the newest one your `package.json` range allows (Wanted) and the newest release overall (Latest)."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "List Python packages that have newer releases with `python3 -m pip list --outdated`, and see which installed packages rely on one with `python3 -m pip show <name>`, whose `Required-by` line names them."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Record exact versions when you add npm packages, with `npm install --save-exact <pkg>` or `save-exact=true` in `.npmrc`, so `package.json` states the version you tested instead of a `^` range."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Keep only your direct Python dependencies in `requirements.in` and let `pip-compile` from pip-tools write a fully pinned `requirements.txt`; upgrading is then one command, and every pin is reviewable in the diff."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Print a Maven project's full dependency tree with `mvn dependency:tree`, or run `./gradlew dependencies` for Gradle, to find which library pulls in a conflicting version."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "Upgrade one Go dependency with `go get example.com/lib@v1.4.2`, or `@latest`, then run `go mod tidy`; `go.mod` and `go.sum` record the exact version for everyone who builds the module."

[[note]]
level = "intermediate"
topic = "Data"
text = "Query a CSV with SQL, no server needed: in the `sqlite3` shell, `.import --csv sales.csv sales` creates a `sales` table whose columns are named after the header row, ready for `SELECT` and `GROUP BY`."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "Bump a package with `npm version patch`, `minor` or `major`: in a Git repository it updates `package.json`, commits the change and creates a matching `v1.2.4`-style tag in one step."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "Use a tilde range such as `~1.4.2` when a dependency should get patch releases only: it accepts `1.4.x` from `1.4.2` upward, while `^1.4.2` would also accept `1.5.0`."

[[note]]
level = "intermediate"
topic = "CI"
text = "Write test results as JUnit XML, as with `pytest --junitxml=report.xml`, and have CI publish the file; failures then appear by test name in the CI interface instead of only in raw logs."

[[note]]
level = "intermediate"
topic = "CI"
text = "Run ESLint in CI with `--max-warnings 0`, so warnings fail the build; otherwise they pile up unnoticed, since a pipeline that stays green gives nobody a reason to look."

[[note]]
level = "intermediate"
topic = "CI"
text = "Run `pre-commit run --all-files` as a CI step, so the formatting and lint hooks that developers run locally also check every pull request, including commits from anyone who skipped the hooks."

[[note]]
level = "intermediate"
topic = "CI"
text = "Reproduce CI-only behavior locally by setting `CI=true`, the variable GitHub Actions and most CI services set; Jest, for example, then fails on a missing snapshot instead of writing a new one."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Cache dependencies with the setup actions' own option, such as `cache: npm` on `actions/setup-node` or `cache: pip` on `actions/setup-python`, instead of writing a separate cache step."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Pass a value to later steps by appending `name=value` to the file in `$GITHUB_OUTPUT`, then read it as `steps.<id>.outputs.name`; the step that writes it needs an `id`."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Test against a real database in GitHub Actions by declaring it under `services:`, such as a `postgres` image with its port mapped, and your steps can reach it on `localhost`."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Limit a workflow to the files it cares about with a `paths:` filter under `push` or `pull_request`, as in `paths: ['docs/**']` for a docs build, so unrelated changes do not trigger it."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Test on several operating systems at once with `strategy.matrix`, as in `os: [ubuntu-latest, windows-latest, macos-latest]` with `runs-on: ${{ matrix.os }}`; GitHub runs one job per entry."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Guard deploy steps with `if: github.ref == 'refs/heads/main' && github.event_name == 'push'`, so one workflow can run the tests on every pull request without ever deploying from one."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Lint workflow files with `actionlint` before pushing: it catches YAML mistakes, unknown `${{ }}` context names and, with shellcheck installed, bugs in `run:` scripts that GitHub would report only after a failed run."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Run a tool without installing it by mounting your project into a container: `docker run --rm -v \"$PWD\":/work -w /work python:3 python script.py` runs the script with the image's Python in your folder."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Order a Dockerfile so dependencies install before the source arrives: `COPY package.json package-lock.json ./`, `RUN npm ci`, then `COPY . .`; a code-only change then reuses the cached dependency layer."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Use a multi-stage build: compile in a first stage such as `FROM golang AS build`, then `COPY --from=build /out/app /app` into a small runtime image that carries no compiler or source code."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Follow one service's output with `docker compose logs -f api`, and open a shell in it with `docker compose exec api sh` to check files, environment variables and network access from its point of view."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Publish a development database on your machine only, with `-p 127.0.0.1:5432:5432`; a plain `-p 5432:5432` listens on every network interface, so anyone on the same network can reach it."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Run `docker compose config` to print the configuration Compose will actually use, with variables substituted and override files merged, when a setting does not seem to take effect."

[[note]]
level = "intermediate"
topic = "Containers"
text = "See what is using disk space in Docker with `docker system df`, then reclaim it with `docker image prune` for dangling images and `docker builder prune` for the build cache."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Start with `kubectl describe pod <name>` when a pod will not run: the Events section at the bottom explains `Pending`, `ImagePullBackOff` and failing probes in plain words."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Reach a cluster service from your laptop with `kubectl port-forward svc/api 8080:80`: requests to `localhost:8080` go to port 80 of the service, and nothing is exposed publicly."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Look up any manifest field from the terminal: `kubectl explain deployment.spec.strategy` prints its type and description, and adding `--recursive` lists every nested field."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "Use a named profile per cloud account, as in `aws configure --profile staging` followed by `AWS_PROFILE=staging aws s3 ls`, so every command makes clear which account it targets."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "Shape AWS CLI output with `--query` and `--output text`, as in `aws ec2 describe-instances --query 'Reservations[].Instances[].InstanceId' --output text`, instead of parsing JSON with ad hoc text tools."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "Add `terraform fmt -check` and `terraform validate` to CI: the first fails on unformatted files and the second catches invalid references and arguments, both without touching real infrastructure."

[[note]]
level = "intermediate"
topic = "Infrastructure as code"
text = "Try an expression in `terraform console` before putting it in your configuration: `cidrsubnet(\"10.0.0.0/16\", 8, 2)` prints `\"10.0.2.0/24\"`, and your variables and locals are available there too."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Add a `.github/pull_request_template.md` with headings such as What, Why and How to test; GitHub pre-fills the description of every new pull request with it."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Open a pull request from the terminal with `gh pr create --fill`, which takes the title and body from your commits, and check its CI status afterwards with `gh pr checks`."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Turn on auto-merge for a pull request, or run `gh pr merge --auto --squash`, and GitHub merges it on its own as soon as the required reviews and status checks pass."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Link a range of lines when discussing code on GitHub: click the first line number in a file, Shift-click the last, and the page address now highlights exactly those lines."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Keep an eye on a changing value with `watch -n 5 -d 'df -h'` on Linux: it reruns the command every five seconds and highlights whatever changed since the previous run."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Run a heavy job at the lowest CPU priority with `nice -n 19 make -j8`, so your editor, terminal and services get the processor first while the build uses whatever is left."

[[note]]
level = "intermediate"
topic = "Linux"
text = "List an archive's contents before extracting it with `tar -tzf release.tar.gz | head`, which shows whether it unpacks into its own folder or scatters files into the current one."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Run `systemctl cat nginx` to print a unit file together with every drop-in that overrides it, so you see the configuration systemd actually uses instead of guessing which file wins."

[[note]]
level = "intermediate"
topic = "Networking"
text = "List listening TCP ports and the processes behind them on Linux with `ss -tlnp`; run it with `sudo` to see the owners of sockets that belong to other users."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Give servers short names in `~/.ssh/config` with a `Host db1` block that sets `HostName`, `User`, `Port` and `IdentityFile`; `ssh db1`, `scp` and `rsync` then all use those settings."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Check whether packets reach a machine at all with `sudo tcpdump -i any -n port 5432` on Linux; if nothing shows up while a client connects, the problem is a firewall or route, not your service."

[[note]]
level = "intermediate"
topic = "CI"
text = "Retry only the network call that flakes, as with `curl --retry 5 --retry-connrefused`, instead of rerunning the whole CI job; download hiccups stop failing builds, while real test failures still do."

[[note]]
level = "intermediate"
topic = "DNS"
text = "Look up the name an IP address maps back to with `dig -x 203.0.113.10 +short`; mail servers and some logs rely on these reverse (PTR) records, which the owner of the address block, usually your hosting provider, controls."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Time a small Python snippet with `python3 -m timeit -s 'import json; s = json.dumps(list(range(1000)))' 'json.loads(s)'`, which repeats the statement many times and reports the time per loop."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Add `-benchmem` to `go test -bench=.` to see memory allocated per operation next to the time; bringing `allocs/op` down is often the quickest win in a hot path."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Batch database writes: one multi-row `INSERT`, or `executemany()` inside a single transaction, is far faster than committing each row separately, which pays a round trip and a disk flush every time."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Record a page load in the DevTools Performance panel to see which scripts block the main thread; tasks longer than 50 ms are flagged as long tasks and are what make a page feel sluggish."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Emit logs as JSON objects with fixed field names such as `level`, `msg` and `request_id`, so you can filter them with `jq` or your log platform instead of grepping free-form text."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Generate a request ID where a request enters your system, return it in a header such as `X-Request-ID` and include it in every log line, so one failing request can be followed across services."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Pass values to Python's logger as arguments, as in `logger.debug('loaded %s rows', count)`, rather than as an f-string; the message is then formatted only when that level is actually enabled."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Create each module's logger with `logging.getLogger(__name__)`: log lines then show which module wrote them, and you can quiet one noisy module with `setLevel` without touching the rest."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Early in an outage, check the status pages of your cloud provider and key third-party services before digging into your own code; a problem upstream explains many sudden failures."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Run blocking I/O calls in parallel from Python with `concurrent.futures.ThreadPoolExecutor`: `list(pool.map(fetch, urls))` fetches several pages at once and returns the results in input order."

[[note]]
level = "intermediate"
topic = "Databases"
text = "See how much disk a PostgreSQL table really takes, indexes and TOAST data included, with `SELECT pg_size_pretty(pg_total_relation_size('orders'))`; `pg_relation_size` counts the main table alone."

[[note]]
level = "intermediate"
topic = "Data"
text = "Count JSON records by a field with `jq 'group_by(.status) | map({status: .[0].status, n: length})' orders.json`, which sorts the records into groups and reports the size of each."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "Get the top entries without sorting everything with `heapq.nlargest(10, items, key=score)`; for a small count and a big list, it is faster than `sorted(items, key=score, reverse=True)[:10]`."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "Answer many range-sum questions quickly with prefix sums: build `prefix = [0, *itertools.accumulate(values)]` once, and the sum of `values[i:j]` is then `prefix[j] - prefix[i]`, with no loop per question."

[[note]]
level = "intermediate"
topic = "Data"
text = "Find the lines that are new in one list compared with another using `comm -13 <(sort yesterday.txt) <(sort today.txt)`; `comm` needs sorted input, and `-13` hides lines unique to the first file and lines in both."

[[note]]
level = "intermediate"
topic = "Data"
text = "Total a column of a simple CSV without a spreadsheet: `awk -F, 'NR > 1 { total += $3 } END { print total }' sales.csv` skips the header row and sums the third field."

[[note]]
level = "intermediate"
topic = "Data"
text = "Take a random sample of lines with GNU `shuf -n 1000 big.log`, a quick way to eyeball a huge file or to build a small test fixture from real data."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Read CSV files exported from Excel with `open(path, encoding='utf-8-sig')` in Python; it removes the byte order mark that would otherwise stick to the first column name."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Convert a Latin-1 file to UTF-8 with `iconv -f ISO-8859-1 -t UTF-8 old.txt > new.txt`, after `file -i old.txt` on Linux has reported which charset it uses."

[[note]]
level = "intermediate"
topic = "Time"
text = "Stamp logs and file names with `date -u +%Y-%m-%dT%H:%M:%SZ`, an ISO 8601 time in UTC that sorts correctly as plain text and means the same moment to every reader."

[[note]]
level = "intermediate"
topic = "Time"
text = "Convert times between zones in Python with `zoneinfo`: `dt.astimezone(ZoneInfo('America/New_York'))` applies the offset that was in effect on that date, daylight saving time included."

[[note]]
level = "intermediate"
topic = "Time"
text = "Check the time in another zone from the shell with `TZ=Asia/Tokyo date`; setting `TZ` in front of one command changes only that command's idea of local time."

[[note]]
level = "intermediate"
topic = "Code review"
text = "When a pull request re-indents code, turn on Hide whitespace in the diff settings of the Files changed tab, or run `git diff -w` locally, to see only the lines that really changed."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Prefix optional review comments with `nit:` so the author can tell a matter of taste from something that must change before the pull request merges."

[[note]]
level = "intermediate"
topic = "Code review"
text = "When a fix is small, write it as a suggested change in your review comment; the author can apply it with one click, and the resulting commit credits you as a co-author."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Write a `CONTRIBUTING.md` with the exact commands to set up the project, run the tests and run the linters; GitHub links to it when people open an issue or a pull request."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Save one real webhook delivery's headers and raw body, then replay it with `curl --data-binary @body.json` while you build the handler; unlike `-d`, it sends the bytes unchanged, so signature checks still pass."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Draw diagrams as text in a Markdown code block marked `mermaid`; GitHub renders it as a diagram, and changes to it show up in diffs like any other text."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Pass collaborators such as a database client or a clock into a function or constructor instead of creating them inside it; tests can then hand in simple fakes without any patching."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Keep business rules in plain functions that take data and return data, and push database, HTTP and file access into a thin outer layer; the core then runs in fast tests without mocks."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Draft release notes automatically with `gh release create v1.4.0 --generate-notes`; GitHub lists the pull requests merged and the new contributors since the previous release."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Run `npm pack --dry-run` before publishing to list every file that would go into the package tarball, so stray test data, build leftovers or secrets are caught before they ship."

[[note]]
level = "intermediate"
topic = "Releases"
text = "Rehearse a Python release on TestPyPI with `twine upload --repository testpypi dist/*`, then install it from there into a clean virtual environment before uploading to the real index."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Return validation errors as a list with a field path and a message for each, such as `{\"field\": \"address.zip\", \"message\": \"required\"}`, so a client can mark every invalid field at once."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Commit a `.devcontainer/devcontainer.json`, and VS Code or GitHub Codespaces can build the same development environment for everyone, with the right tools and extensions already installed."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Run your test suite with `TZ=UTC` set, both locally and in CI, so tests that format or parse local times behave the same on every developer's machine."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "After adding a `.pre-commit-config.yaml`, run `pre-commit install` once per clone; the configured formatters and linters then check your staged files every time you commit."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Hand work between Python threads with `queue.Queue`, which does its own locking: producers call `put()`, consumers call `get()` and then `task_done()`, and `q.join()` waits until every item has been processed."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Use direnv to load project settings automatically: put `export` lines in a `.envrc`, run `direnv allow` once, and the variables are set when you enter the folder and unset when you leave."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Start long jobs on a remote machine inside `tmux new -s deploy`; if your SSH connection drops, `tmux attach -t deploy` puts you back in the same session with the job still running."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Comment on an issue or assign it to yourself before you start working on it, so two people do not quietly fix the same bug in parallel."

[[note]]
level = "advanced"
topic = "Git"
text = "`git bisect run ./test.sh` binary-searches history for the commit that broke a test. Have the script exit `125` for a commit that cannot be built, and bisect skips it."

[[note]]
level = "advanced"
topic = "Git"
text = "Compare two branches with `git log --oneline --cherry-mark --left-right main...feature`: commits whose changes already exist on the other side, such as cherry-picks, are marked `=` instead of `<` or `>`."

[[note]]
level = "advanced"
topic = "Git"
text = "`git log -S 'retryBudget'` lists commits that changed how many times a string appears, which finds where it was introduced or deleted; `-G` takes a regex and matches any added or removed line instead."

[[note]]
level = "advanced"
topic = "Git"
text = "`git log -L :parse_header:src/http.c` shows the history of a single function, with a diff of only that function for each commit that touched it."

[[note]]
level = "advanced"
topic = "Git"
text = "Right after a rebase, `git range-diff main ORIG_HEAD HEAD` pairs each old commit with its rewritten version and shows what changed between them, so you can confirm the rebase did only what you meant."

[[note]]
level = "advanced"
topic = "Git"
text = "`git rebase -x 'make test' main` replays your branch and runs the tests after every commit, stopping at the first one that fails, so each commit in a series is known to build and pass."

[[note]]
level = "advanced"
topic = "Git"
text = "When you stack branches, rebase with `--update-refs` (or set `rebase.updateRefs`) and Git moves every branch that points into the rebased range, not just the one you have checked out."

[[note]]
level = "advanced"
topic = "Git"
text = "`git bisect start --first-parent` makes bisect test only commits on the mainline, so it names the merge that introduced a regression instead of a half-finished commit inside a feature branch."

[[note]]
level = "advanced"
topic = "Git"
text = "Bisect works for any change, not just bugs: `git bisect start --term-old=slow --term-new=fast` lets you mark commits with `git bisect slow` and `git bisect fast` while hunting a speedup."

[[note]]
level = "advanced"
topic = "Git"
text = "Check whether two branches merge cleanly without touching your working tree or index: `git merge-tree --write-tree main feature` prints the merged tree's ID, lists any conflicts and exits with status 1 if there are some."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Add `.patch` to the end of a GitHub pull request or commit address to download it as an email-style patch, which `git am` applies with the original authors and messages intact."

[[note]]
level = "advanced"
topic = "GitHub"
text = "In GitHub's blame view, click the icon next to a line's commit to view blame prior to that change, stepping back through the line's history one change at a time, past reformatting commits."

[[note]]
level = "advanced"
topic = "Git"
text = "Use `git diff --color-moved=zebra` (or set `diff.colorMoved`) to show relocated blocks in their own colors instead of as deletions plus additions, which makes a code move easy to review."

[[note]]
level = "advanced"
topic = "Git"
text = "During a merge conflict, `git show :1:path/to/file` prints the common ancestor's version, `:2:` prints yours and `:3:` theirs, which often explains a conflict faster than the markers."

[[note]]
level = "advanced"
topic = "Git"
text = "Set `merge.conflictStyle` to `zdiff3` and every conflict block also shows the common ancestor's text, so you can see what each side changed rather than guessing from two versions."

[[note]]
level = "advanced"
topic = "Shell"
text = "Add `shopt -s inherit_errexit` to bash scripts that use `set -e`; otherwise `-e` is switched off inside `$(...)`, so in `out=$(step1; step2)` a failing `step1` is ignored and `step2` still runs."

[[note]]
level = "advanced"
topic = "Shell"
text = "Set `PS4='+ ${BASH_SOURCE}:${LINENO}: '` (in single quotes) before `set -x`, and every traced command is prefixed with its file and line number."

[[note]]
level = "advanced"
topic = "Shell"
text = "Put `local -` at the top of a bash function and any `set` options it changes, such as `set +e` or `set -x`, are restored automatically when the function returns."

[[note]]
level = "advanced"
topic = "Shell"
text = "Cap parallelism in plain bash: start jobs in a loop and, whenever N are running, call `wait -n`, which returns as soon as any one of them finishes."

[[note]]
level = "advanced"
topic = "Shell"
text = "Pair an `ERR` trap with `set -E` in bash so the trap is inherited by functions and subshells and reports the line that actually failed, not just the line that called the function."

[[note]]
level = "advanced"
topic = "Shell"
text = "In bash, `${PIPESTATUS[@]}` holds the exit status of each stage of the last pipeline, so you can tell which command in `a | b | c` failed; read it immediately, before any other command runs."

[[note]]
level = "advanced"
topic = "Linux"
text = "When `df` says a disk is full but `du` cannot find the space, `lsof +L1` lists deleted files that processes still hold open; restarting the process, or truncating the file through `/proc/PID/fd/N`, frees it."

[[note]]
level = "advanced"
topic = "Linux"
text = "`strace -f -Z -e trace=%file ./app` prints only the file-related system calls that failed, which usually exposes the missing config file or wrong search path in seconds."

[[note]]
level = "advanced"
topic = "Testing"
text = "Test disk-full handling without filling a disk: `strace -e inject=write:error=ENOSPC:when=3+ ./app` makes the third and every later `write` fail with `ENOSPC`."

[[note]]
level = "advanced"
topic = "Linux"
text = "Read `/proc/pressure/cpu`, `memory` and `io` to see what share of time tasks were stalled waiting on each resource, a more direct saturation signal than load average."

[[note]]
level = "advanced"
topic = "Shell"
text = "Read a file into a Bash array, one element per line, with `mapfile -t hosts < hosts.txt`; `-t` strips each newline, `${#hosts[@]}` gives the count, and lines with spaces stay whole, unlike `for h in $(cat hosts.txt)`."

[[note]]
level = "advanced"
topic = "Linux"
text = "After an unexpected reboot, `journalctl -b -1 -p warning` shows warnings and worse from the previous boot, provided the journal is stored persistently."

[[note]]
level = "advanced"
topic = "Security"
text = "`systemd-analyze security myapp.service` scores a unit's exposure and lists the sandboxing settings it lacks, such as `ProtectSystem=`, `PrivateTmp=` and `NoNewPrivileges=`."

[[note]]
level = "advanced"
topic = "Security"
text = "Let a server bind port 443 without root: `setcap 'cap_net_bind_service=+ep' /usr/local/bin/server` grants only that capability. Reapply it after upgrades, because a replaced binary loses it."

[[note]]
level = "advanced"
topic = "Python"
text = "Run `python -X importtime -c 'import app' 2> imports.log` to get the time spent in every import, nested ones included, when a CLI or serverless function starts slowly."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Let the load balancer eject bad backends with outlier detection, such as Envoy's `outlier_detection` on consecutive 5xx responses, so one broken instance stops getting traffic even while its health check still passes."

[[note]]
level = "advanced"
topic = "Python"
text = "With `tracemalloc.start()` running, take two snapshots minutes apart and call `new.compare_to(old, 'lineno')`; the top entries are the source lines whose allocations keep growing."

[[note]]
level = "advanced"
topic = "Python"
text = "`python -m pdb -c continue script.py` runs the script normally and opens the debugger at the frame where an uncaught exception was raised, with all locals intact."

[[note]]
level = "advanced"
topic = "Python"
text = "In a pre-fork server, call `gc.disable()` early in the parent, `gc.freeze()` just before forking and `gc.enable()` in each worker, so collections never touch inherited objects and their pages stay shared."

[[note]]
level = "advanced"
topic = "Python"
text = "Parse money and other exact values with `json.loads(text, parse_float=decimal.Decimal)`, so `0.1` arrives as `Decimal('0.1')` instead of the nearest binary float."

[[note]]
level = "advanced"
topic = "Python"
text = "Run your test suite under `python -X dev` to enable asyncio debug mode, surface `ResourceWarning` for unclosed files and sockets, and add debug hooks to the memory allocators."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Start Node with `--cpu-prof` and it writes a `.cpuprofile` file on exit; load it into Chrome DevTools to see a flame chart of where the time went."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Give each outgoing request a deadline with `fetch(url, { signal: AbortSignal.timeout(5000) })`; otherwise a stalled upstream can hold the call open far longer than your caller will wait."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Track event-loop blocking in Node with `monitorEventLoopDelay()` from `node:perf_hooks`: call `enable()` and export `percentile(99)` as a metric; spikes mean synchronous work is starving other requests."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Turn on `noUncheckedIndexedAccess` and `arr[i]` or `record[key]` becomes `T | undefined`, so the compiler makes you handle the missing-element case that `strict` alone ignores."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "`const routes = { home: '/' } satisfies Record<string, string>` checks the object against the type without widening it, so `routes.home` stays known and `routes.typo` is still an error."

[[note]]
level = "advanced"
topic = "Go"
text = "Run `go test -race ./...` in CI and in long soak tests; the detector only reports races that actually occur during execution, so broader coverage finds more of them."

[[note]]
level = "advanced"
topic = "Go"
text = "`go test -count=1` skips the test result cache; use it for tests that talk to a database or network service, because Go cannot tell when those inputs change."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Find what allocates memory in Python with `tracemalloc`: call `tracemalloc.start()`, run the workload, then print `tracemalloc.take_snapshot().statistics('lineno')[:10]` for the ten lines allocating the most."

[[note]]
level = "advanced"
topic = "Go"
text = "`go build -gcflags=-m` prints the compiler's inlining and escape-analysis decisions, including which variables are moved to the heap, the first thing to check when cutting allocations."

[[note]]
level = "advanced"
topic = "Rust"
text = "`cargo tree -d` lists crates built in more than one version; then `cargo tree -i <crate>@<version>` shows which dependency pulls in the version you want gone."

[[note]]
level = "advanced"
topic = "Rust"
text = "`cargo build --timings` writes an HTML report of how long each crate took and how well the build parallelized, pointing at the crates worth splitting or trimming."

[[note]]
level = "advanced"
topic = "SQL"
text = "In PostgreSQL, `EXPLAIN ANALYZE` really executes the statement, so check a write with `BEGIN; EXPLAIN ANALYZE UPDATE ...; ROLLBACK;` to see its plan and timings without keeping the change."

[[note]]
level = "advanced"
topic = "SQL"
text = "`EXPLAIN (ANALYZE, BUFFERS)` in PostgreSQL adds, for each plan node, how many pages were found in shared buffers and how many had to be read, which separates a cold cache from a plan that simply touches too much data."

[[note]]
level = "advanced"
topic = "SQL"
text = "Get the top three orders per customer in PostgreSQL with `FROM customers c CROSS JOIN LATERAL (SELECT * FROM orders o WHERE o.customer_id = c.id ORDER BY o.total DESC LIMIT 3) t`; an index on `(customer_id, total)` keeps each lookup short."

[[note]]
level = "advanced"
topic = "SQL"
text = "Get subtotals and a grand total in one query with `GROUP BY ROLLUP (region, product)` in PostgreSQL, or `GROUP BY region, product WITH ROLLUP` in MySQL; `GROUPING(region)` tells subtotal rows apart from real `NULL`s."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Build a matrix at run time: have a setup job write a JSON array to a job output, then set `strategy.matrix.target` to `${{ fromJSON(needs.setup.outputs.targets) }}` so later jobs fan out over exactly the targets it chose."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Print `::error file=src/app.py,line=42::Invalid config` from a step to create an annotation: GitHub lists it on the run's summary and shows it on that line of the pull request's changed files."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Let experimental matrix entries fail without failing the run: add them with `include` and `experimental: true`, then set `continue-on-error: ${{ matrix.experimental }}` on the job, so a nightly toolchain can break without blocking merges."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Before deploying code that needs a new schema, run the migration as a Kubernetes Job and wait for it with `kubectl wait --for=condition=complete job/migrate --timeout=10m`, so the pipeline stops if the migration fails or hangs."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Append Markdown to the file named by `$GITHUB_STEP_SUMMARY` and it renders on the run's summary page, a good home for test counts and benchmark tables that would otherwise hide in logs."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "`kubectl logs deploy/api` shows logs from only one of the Deployment's pods; to see all of them, select by label and prefix each line with its pod name: `kubectl logs -l app=api --prefix --tail=50`."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "When a workflow fails mysteriously, re-run it with debug logging enabled, or set the `ACTIONS_STEP_DEBUG` secret or variable to `true`, to get the runner's detailed step output."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Set `strategy.fail-fast: false` on a test matrix so one failing combination does not cancel the rest, and you see every platform and version that actually breaks."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Set `defaults.run.shell: bash` explicitly: steps then run with `bash -eo pipefail`, while the implicit default is plain `bash -e`, which lets a failure early in a pipeline pass unnoticed."

[[note]]
level = "advanced"
topic = "Containers"
text = "Add a `test` stage to a multi-stage Dockerfile and run it in CI with `docker build --target test .`; the tests run in the same environment as the build, and BuildKit skips that stage when building the final image."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Replace long-lived cloud keys in CI with OIDC: grant the job `id-token: write` and let it exchange its signed token for short-lived credentials that the cloud side scopes to your repository."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Fetch any pull request without extra tools: `git fetch origin pull/123/head:pr-123` creates a local branch from the PR's head commit, even when it comes from a fork."

[[note]]
level = "advanced"
topic = "GitHub"
text = "`gh run view <run-id> --log-failed` prints only the logs of the steps that failed, which is much faster than scrolling through the web UI for the one error line."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Mark generated files with `linguist-generated=true` in `.gitattributes` and GitHub collapses them in pull request diffs, so reviewers spend their attention on hand-written code."

[[note]]
level = "advanced"
topic = "GitHub"
text = "If you use a merge queue, add the `merge_group` event to every required workflow's triggers; otherwise the required checks never run for queued changes and nothing merges."

[[note]]
level = "advanced"
topic = "GitHub"
text = "`gh api repos/{owner}/{repo}/pulls --paginate --jq '.[].title'` walks every page of an API result, and `gh` fills in the owner and repository from your current checkout."

[[note]]
level = "advanced"
topic = "CI"
text = "Make CI fail on a stale lockfile with `npm ci`, `cargo build --locked` or `uv sync --locked`; each refuses to proceed when the lockfile no longer matches the manifest instead of silently updating it."

[[note]]
level = "advanced"
topic = "Releases"
text = "Before cutting a patch release, run `git cherry -v release/1.4 main`: lines starting with `+` are commits on `main` whose changes are not yet on the release branch, and `-` marks ones already picked."

[[note]]
level = "advanced"
topic = "CI"
text = "Run a scheduled CI job that resolves the newest allowed versions of your dependencies and runs the tests, so upstream breakage shows up there instead of in the next unrelated pull request."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Adopt an existing resource with an `import` block (`to = aws_s3_bucket.logs`, `id = \"my-logs\"`), then run `terraform plan -generate-config-out=generated.tf` to have Terraform draft its configuration for you."

[[note]]
level = "advanced"
topic = "CI"
text = "Key CI caches on a hash of the lockfile, such as `hashFiles('**/package-lock.json')` in GitHub Actions, with a broader restore key as a fallback, so the cache refreshes exactly when dependencies change."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Test Terraform modules with `terraform test`: `.tftest.hcl` files hold `run` blocks with `assert` conditions, and a run with `command = plan` checks planned values without creating any real infrastructure."

[[note]]
level = "advanced"
topic = "Containers"
text = "Pass build credentials with `RUN --mount=type=secret,id=npmrc,target=/root/.npmrc npm ci` and `docker build --secret id=npmrc,src=$HOME/.npmrc`; the file exists only during that step and never lands in a layer."

[[note]]
level = "advanced"
topic = "Containers"
text = "Run containers with `--init` (or bake in a small init like `tini`) when your app would otherwise be PID 1, so signals are forwarded properly and zombie processes get reaped."

[[note]]
level = "advanced"
topic = "Containers"
text = "Debug a container that has no shell by joining its namespaces from a tools image: `docker run -it --rm --network container:app --pid container:app busybox sh`."

[[note]]
level = "advanced"
topic = "Containers"
text = "`docker inspect -f '{{.State.OOMKilled}}' app` tells you whether the kernel killed a container for exceeding its memory limit; exit code 137 alone only says it received `SIGKILL`."

[[note]]
level = "advanced"
topic = "Containers"
text = "`docker build --progress=plain --no-cache` reruns every step and prints its complete output instead of the collapsed live view, which is what you want when debugging a failing `RUN` locally."

[[note]]
level = "advanced"
topic = "Containers"
text = "`docker diff app` lists files a container has added, changed or deleted relative to its image, a quick way to find logs, caches or temp files filling its writable layer."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Pin base images by digest, as in `FROM node:lts-slim@sha256:<digest>`, so a rebuild next month starts from the same bytes; let a bot propose digest updates instead of drifting silently."

[[note]]
level = "advanced"
topic = "Cloud"
text = "In AWS, let a database's security group accept traffic from the app servers' security group rather than from their IP range; the rule then keeps working as instances scale out or change addresses."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "`kubectl logs mypod --previous` shows output from the container's last terminated instance, which is where the stack trace lives when a pod is stuck in `CrashLoopBackOff`."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "`kubectl get events -A --sort-by=.metadata.creationTimestamp` lists events in time order across namespaces, quickly revealing failed scheduling, image pulls and probe failures around an outage."

[[note]]
level = "advanced"
topic = "CI"
text = "In a monorepo, find what a pull request touched with `git diff --name-only origin/main...HEAD` and run only the affected jobs; fetch enough history to include the merge base, and still run everything on `main`."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Give slow-booting apps a `startupProbe`: liveness and readiness probes are held off until it succeeds, so the kubelet stops killing pods that are simply still warming up."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Wrap a code path in `performance.mark('parse-start')` and `performance.measure('parse', 'parse-start')`, and the measure appears as a named span in the DevTools Performance timeline, lined up with network and rendering work."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Check manifests against the live cluster without changing it: `kubectl apply --dry-run=server -f app.yaml` runs validation and admission webhooks, and `kubectl diff -f app.yaml` shows what would change."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Build a read-only mode you can switch on at runtime: during a database failover or a risky migration, users keep browsing while writes pause, which beats taking the whole site down."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Connect Node streams with `pipeline()` from `node:stream/promises` rather than `.pipe()`: it reports an error from any stage in one place and destroys every stream in the chain, so failures don't leak file handles."

[[note]]
level = "advanced"
topic = "HTTP"
text = "`curl --resolve api.example.com:443:10.0.0.7` pins that hostname to one backend IP while keeping the real name for SNI, certificate checks and the `Host` header, ideal for testing one server behind a load balancer."

[[note]]
level = "advanced"
topic = "HTTP"
text = "`curl -sS -D - -o /dev/null <url>` prints just the response headers of a real GET, unlike `curl -I`, which sends a `HEAD` request that some servers and proxies answer differently."

[[note]]
level = "advanced"
topic = "Web"
text = "Serve fingerprinted assets like `app.3f9a1c.js` with `Cache-Control: public, max-age=31536000, immutable`, so browsers never revalidate them; each new build gets a new filename anyway."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Add `stale-while-revalidate=60` to `Cache-Control`, and caches that support it serve a slightly stale response instantly while fetching a fresh copy in the background."

[[note]]
level = "advanced"
topic = "APIs"
text = "Send `Retry-After` with 429 and 503 responses and make your own clients honor it, so retries arrive when the server can take them rather than in one synchronized burst."

[[note]]
level = "advanced"
topic = "APIs"
text = "Accept an `Idempotency-Key` header on POST endpoints that create things: store the first response under that key and replay it for retries, so a client timeout never creates a duplicate order."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Raise `Error.stackTraceLimit` when stack traces are cut off before they reach your code: V8 keeps only 10 frames by default, and `Error.stackTraceLimit = 50` or Node's `--stack-trace-limit=50` shows more."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Extract a type from inside another with `infer`: `type ElementOf<T> = T extends readonly (infer U)[] ? U : never` gives the item type of any array or tuple type."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "When TypeScript resolves an import to the wrong types or can't find a module, run `tsc --traceResolution` to print every path it tried for each import and the file it finally picked."

[[note]]
level = "advanced"
topic = "Security"
text = "Name session cookies with the `__Host-` prefix: browsers then accept them only with `Secure`, `Path=/` and no `Domain`, so a sibling subdomain cannot set or overwrite them."

[[note]]
level = "advanced"
topic = "Web"
text = "Give the main hero image `fetchpriority=\"high\"` and never `loading=\"lazy\"`; lazy-loading the largest above-the-fold image directly delays Largest Contentful Paint."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Put async status messages, like save confirmations or result counts, in an `aria-live=\"polite\"` region that exists at page load, so screen readers announce updates without moving focus."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Honor `prefers-reduced-motion: reduce` in CSS by disabling or shortening parallax, autoplaying carousels and large transitions for users who have asked their OS for less motion."

[[note]]
level = "advanced"
topic = "Web"
text = "Preload a critical web font with `<link rel=\"preload\" href=\"/fonts/body.woff2\" as=\"font\" type=\"font/woff2\" crossorigin>`; without `crossorigin` the preload doesn't match the font request and the file downloads twice."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Check certificate expiry from cron or monitoring with `openssl x509 -in cert.pem -noout -checkend 2592000`, which exits non-zero if the certificate expires within 30 days."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "To confirm a certificate matches a private key, compare `openssl x509 -in cert.pem -noout -pubkey` with `openssl pkey -in key.pem -pubout`; the outputs are identical for a matching pair of any key type."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Generate tokens and keys with a cryptographic RNG, such as `openssl rand -hex 32` or Python's `secrets.token_urlsafe(32)`, never with `random` or a timestamp, which an attacker can predict."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Install Python dependencies with `pip install --require-hashes -r requirements.txt`, so pip rejects any file whose hash differs from the one you locked, even if an index or mirror is compromised."

[[note]]
level = "advanced"
topic = "Versioning"
text = "`npm version prerelease --preid=rc` turns `1.4.0` into `1.4.1-rc.0`, and running it again gives `1.4.1-rc.1`; `npm version preminor --preid=beta` starts a `1.5.0-beta.0` line instead."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Hold back brand-new dependency releases for a few days with a cutoff like uv's `--exclude-newer` or Renovate's `minimumReleaseAge`, giving the ecosystem time to catch and yank a malicious version."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "`npm explain <pkg>` shows every dependency path that pulls a package into `node_modules`, the fastest way to see which direct dependency to upgrade for a transitive fix."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "`go list -m -u all` lists every module in your build, with the newest available version in brackets next to any that can be upgraded, so you can review upgrades before running `go get`."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "`go mod why -m golang.org/x/text` prints the shortest import path from your module to that dependency, which shows whether it is really needed and which package needs it."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Run `pip check` after installing into an environment: it verifies that every installed package's declared requirements are satisfied, catching conflicts that install order let slip through."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Stamp builds with `git describe --tags --dirty --always`, which yields names like `v2.3.1-14-g3f9a1c2-dirty`: the last tag, commits since it, the commit hash and an uncommitted-changes marker."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Grab stacks from a hung native process with `gdb -p <pid> -batch -ex 'thread apply all bt'`: it attaches, prints every thread's backtrace and detaches, pausing the process only briefly."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Capture a flaky failure once with `rr record ./app`, then `rr replay` it as often as needed; set a watchpoint on the corrupted value and `reverse-continue` to land on the write that changed it."

[[note]]
level = "advanced"
topic = "Debugging"
text = "In gdb, `watch -l obj->state` watches that memory address rather than the expression, stopping at the exact line that writes it even after the variable goes out of scope."

[[note]]
level = "advanced"
topic = "Java"
text = "Send `kill -3 <pid>` to a JVM and it prints a thread dump to its standard output and keeps running; lock owners are shown, and any Java-level deadlock is reported at the end."

[[note]]
level = "advanced"
topic = "Go"
text = "`kill -QUIT <pid>` makes a Go program dump every goroutine's stack, which pinpoints deadlocks, but it also exits; use `/debug/pprof/goroutine?debug=2` when the process must stay up."

[[note]]
level = "advanced"
topic = "Networking"
text = "Measure raw throughput between two hosts with `iperf3 -s` on one and `iperf3 -c <host>` on the other, adding `-R` to test the reverse direction; if iperf is fast and your transfer is slow, the network is not the bottleneck."

[[note]]
level = "advanced"
topic = "DNS"
text = "When a name fails with `SERVFAIL` from a validating resolver, repeat the query with `dig +cd`: if an answer comes back with checking disabled, DNSSEC validation is what is failing."

[[note]]
level = "advanced"
topic = "Observability"
text = "Alert before a disk fills, not once it is full: `predict_linear(node_filesystem_avail_bytes[6h], 4 * 3600) < 0` fires when the last six hours' trend would use up the space within four hours."

[[note]]
level = "advanced"
topic = "Networking"
text = "Rehearse bad networks on a Linux test host with `tc qdisc add dev eth0 root netem delay 200ms loss 1%`, and remove it afterwards with `tc qdisc del dev eth0 root`."

[[note]]
level = "advanced"
topic = "DNS"
text = "`dig +trace example.com` follows delegation from the root servers down to the authoritative ones, showing exactly where a broken or stale NS record sends resolvers astray."

[[note]]
level = "advanced"
topic = "Incidents"
text = "During an incident, share dashboard links with an absolute time range: a link set to the last hour shows a different window by the time someone opens it, and the spike you meant is gone from the postmortem."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Enforce layering rules in CI with a tool that fails the build on forbidden dependencies, such as import-linter for Python, ArchUnit for Java or dependency-cruiser for JavaScript, so the design does not erode one shortcut at a time."

[[note]]
level = "advanced"
topic = "Performance"
text = "Benchmark on a quiet machine: pin the process with `taskset -c 2 ./bench`, do warm-up runs first, and compare distributions over many repetitions rather than a single number."

[[note]]
level = "advanced"
topic = "Performance"
text = "Sample a live process with `perf record -g -p <pid> -- sleep 30` and read it with `perf report`; build with frame pointers or pass `--call-graph dwarf` to get complete stacks."

[[note]]
level = "advanced"
topic = "Debugging"
text = "When a process hits `Too many open files`, count its descriptors with `ls /proc/<pid>/fd | wc -l` a few times under steady load: a number that keeps climbing is a leak, which raising the limit would only postpone."

[[note]]
level = "advanced"
topic = "Performance"
text = "GNU `/usr/bin/time -v ./job` reports peak memory as \"Maximum resident set size\", an easy way to size a container limit from a real run instead of a guess."

[[note]]
level = "advanced"
topic = "Observability"
text = "Compute latency percentiles in PromQL with `histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))`; summing the rates by `le` before the quantile is what keeps the math valid."

[[note]]
level = "advanced"
topic = "Observability"
text = "Expose a `build_info` gauge with value 1 and labels for version and commit; joined into dashboards, it shows at a glance which deploy a regression started with."

[[note]]
level = "advanced"
topic = "Code review"
text = "Before reading a large pull request, list the files it adds with `git diff --name-only --diff-filter=A main...HEAD`; new scripts, dependencies and binaries often deserve the closest look."

[[note]]
level = "advanced"
topic = "Incidents"
text = "When it takes only seconds, grab a thread dump, a profile and recent logs before restarting a misbehaving service; the restart destroys the state that explains the failure."

[[note]]
level = "advanced"
topic = "Databases"
text = "Index a PostgreSQL `jsonb` column with `CREATE INDEX ON events USING gin (payload)` and filter by containment, `payload @> '{\"type\": \"signup\"}'`, which that index serves; `payload->>'type' = 'signup'` needs an expression index instead."

[[note]]
level = "advanced"
topic = "Databases"
text = "Get a quick row estimate for a huge PostgreSQL table with `SELECT reltuples::bigint FROM pg_class WHERE relname = 'events'`, the figure the last `VACUUM` or `ANALYZE` stored, instead of waiting on a full `COUNT(*)`."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Acquire multiple locks in one global order everywhere, such as ascending account ID, and those code paths can no longer deadlock against each other."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Declare a type parameter as `const`, as in `function route<const T extends readonly string[]>(paths: T)`, and callers' literals are inferred as literal types without writing `as const` at every call."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Sample k items uniformly from a stream of unknown length with reservoir sampling: keep the first k, then let item n replace a random slot with probability k/n."

[[note]]
level = "advanced"
topic = "Data"
text = "Pass `validate=\"many_to_one\"` to `pandas.merge` when each left row should match at most one right row; a duplicated key on the right then raises `MergeError` instead of silently multiplying rows."

[[note]]
level = "advanced"
topic = "Data"
text = "Make file outputs atomic: write to a temporary file in the same directory, `fsync` it, then `rename` it over the target, so readers see the old file or the new one, never half of it."

[[note]]
level = "advanced"
topic = "Data"
text = "Convert a large JSON array into JSON Lines with `jq -c '.[]' big.json > big.jsonl`, so line-oriented tools like `split`, `grep` and `wc -l` can work on one record at a time."

[[note]]
level = "advanced"
topic = "Linux"
text = "React to new files without polling using `inotifywait -m -e close_write incoming/` from inotify-tools: it prints a line each time a file there is closed after writing, so a `while read` loop can process uploads as they land."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Pass shell values into `jq` with `--arg`, as in `jq --arg u \"$user\" '.[] | select(.name == $u)'`, instead of pasting them into the filter text, where a quote or backslash in the value breaks or changes the filter."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Compare user-entered strings after normalizing them with `s.normalize('NFC')` in JavaScript or `unicodedata.normalize('NFC', s)` in Python; otherwise an `é` typed two different ways compares unequal."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Count user-perceived characters with `Intl.Segmenter` and `granularity: 'grapheme'`; `str.length` counts UTF-16 code units, so a thumbs-up emoji with a skin tone has a length of 4."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Scan source for bidirectional control characters with GNU `grep -nP '[\\x{202A}-\\x{202E}\\x{2066}-\\x{2069}]'` in a UTF-8 locale; they can make code display differently from how it compiles."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Compare the speed of two commands with `hyperfine 'cmd-a' 'cmd-b'`: it runs each one many times, reports the mean and spread, and warns when outliers or a cold first run skew the result; `--warmup 3` fills caches first."

[[note]]
level = "advanced"
topic = "Time"
text = "`date -u -d @1700000000` turns a Unix timestamp into a readable UTC date with GNU date; on macOS and the BSDs the equivalent is `date -u -r 1700000000`."

[[note]]
level = "advanced"
topic = "Time"
text = "Test far-future dates without touching the system clock: `faketime '2038-01-19 03:14:08' ./app` (from libfaketime) fakes the clock for that one process through `LD_PRELOAD`, so not for static binaries."

[[note]]
level = "advanced"
topic = "Code review"
text = "Review a multi-commit pull request in order with `git log -p --reverse main..HEAD`; well-split commits read like a story, and a tangled one is a good reason to ask for a split."

[[note]]
level = "advanced"
topic = "Networking"
text = "Check a Linux interface's own counters with `ip -s link show eth0`; receive drops and errors that climb while clients see timeouts point at the host or its network card, not at the remote end."

[[note]]
level = "advanced"
topic = "C"
text = "When a macro misbehaves, run `gcc -E file.c` (or `clang -E`) to see the preprocessed source; `#define SQ(x) x*x` expands `SQ(a+1)` to `a+1*a+1`, which the output makes obvious."

[[note]]
level = "advanced"
topic = "C"
text = "Pin struct layouts that must match a file format or wire protocol with `static_assert(sizeof(struct hdr) == 16, \"hdr layout changed\")` from `<assert.h>` in C11, so a padding change breaks the build instead of the data."

[[note]]
level = "advanced"
topic = "C"
text = "Compile release builds with `-O2 -D_FORTIFY_SOURCE=2`, and glibc swaps calls like `memcpy` and `strcpy` for checked versions that abort on overflows of buffers whose size the compiler knows; the checks need optimization turned on."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Catch data races in C and C++ by compiling tests with `-fsanitize=thread` in GCC or Clang; ThreadSanitizer reports each race with the stacks of both conflicting accesses and where each thread was created."

[[note]]
level = "advanced"
topic = "Debugging"
text = "On hosts using systemd-coredump, `coredumpctl list` shows recent crashes and `coredumpctl gdb <pid>` opens the saved core in gdb, so you can inspect the exact state at the crash after the fact."

[[note]]
level = "advanced"
topic = "Web"
text = "Send analytics as a user leaves with `navigator.sendBeacon(url, data)` from a `visibilitychange` handler; the browser queues the request even while the page unloads, where an ordinary `fetch` may be canceled."

[[note]]
level = "advanced"
topic = "Code review"
text = "When re-reviewing a pull request on GitHub, open Files changed and choose Show changes since your last review from the commits menu, so you read only what was pushed after your previous pass."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Add an S3 lifecycle rule with `AbortIncompleteMultipartUpload`: parts of uploads that never completed do not appear in normal object listings, yet they are stored and billed until something deletes them."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Give private subnets an S3 gateway VPC endpoint, so their S3 traffic stays on the AWS network and bypasses the NAT gateway, which removes NAT data-processing charges for that traffic."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Let clients upload large files straight to object storage with a short-lived presigned URL that your backend generates, so the bytes never pass through your application servers."

[[note]]
level = "advanced"
topic = "Web"
text = "Open the Coverage panel in Chrome DevTools and reload to see how many bytes of each CSS and JavaScript file the page actually used, a quick way to find code worth splitting or removing."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Rename a Terraform resource with a `moved` block (`from = aws_instance.old`, `to = aws_instance.web`) rather than by editing its address alone, and the plan shows a move instead of a destroy and re-create."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Set `scroll-padding-top` on the `html` element to your sticky header's height, so elements brought into view by Tab or by an anchor link don't end up hidden underneath the header."

[[note]]
level = "advanced"
topic = "Teams"
text = "Give estimates as ranges, such as three to six days, and name the biggest unknown; a single number hides the uncertainty and quietly turns into a deadline."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Open `terraform console` to evaluate expressions, locals and functions against your real configuration and state, which is much quicker than a full plan when debugging a `for_each` or a `cidrsubnet` call."

[[note]]
level = "advanced"
topic = "Teams"
text = "Give every design discussion a named decider and a decision date; open-ended threads drift for weeks, while a deadline pulls the remaining objections into the open."

[[note]]
level = "advanced"
topic = "Documentation"
text = "Write Go examples as `Example` functions in `_test.go` files ending with an `// Output:` comment: `go test` runs them and fails when the output changes, and generated package docs show them beside the API."

[[note]]
level = "advanced"
topic = "Documentation"
text = "Run the examples in your docs as tests: `pytest --doctest-modules` executes the `>>>` examples in docstrings, and `cargo test` runs the code blocks in a Rust library's doc comments, so examples cannot quietly rot."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Generate `compile_commands.json` for C and C++ projects, with `-DCMAKE_EXPORT_COMPILE_COMMANDS=ON` in CMake or `bear -- make` otherwise, so clangd and clang-tidy see the exact flags each file is built with."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Cache C and C++ compilation with `ccache` by setting `CC=\"ccache gcc\"` or CMake's `CMAKE_C_COMPILER_LAUNCHER=ccache`; rebuilds after a branch switch or a clean then reuse earlier object files."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Rerun tests whenever a file changes with `entr`: `git ls-files | entr -c make test` watches every tracked file and clears the screen before each run."

[[note]]
level = "advanced"
topic = "Teams"
text = "Before a large change, circulate a one-page design doc covering the problem, the proposed approach and the alternatives you rejected; objections cost far less there than in review of finished code."

[[note]]
level = "advanced"
topic = "Teams"
text = "Run a pre-mortem before a risky launch: ask the team to assume it failed badly, list the likeliest reasons, then add a check, an alert or a rollback step for each one."

[[note]]
level = "advanced"
topic = "Testing"
text = "Try property-based testing with Hypothesis in Python: `@given(st.text())` feeds your function many generated inputs and, when one fails, shrinks it to a minimal failing example."

[[note]]
level = "advanced"
topic = "Testing"
text = "Fuzz Go parsers with native fuzzing: write `func FuzzParse(f *testing.F)`, seed it with `f.Add`, and run `go test -fuzz=FuzzParse`; failing inputs are saved under `testdata/fuzz` and rerun as regular tests."

[[note]]
level = "advanced"
topic = "Testing"
text = "Chase a flaky Go test with `go test -run '^TestCheckout$' -count=200 -race`, which repeats just that test under the race detector and surfaces timing-dependent failures that a single run hides."

[[note]]
level = "advanced"
topic = "Testing"
text = "Add `-shuffle=on` to `go test` to run tests in random order; the seed is printed, and `-shuffle=<seed>` replays the same order when a hidden dependency between tests appears."

[[note]]
level = "advanced"
topic = "Testing"
text = "`pytest --durations=10` lists the ten slowest test phases after the run, which often points at a fixture with the wrong scope or a stray `sleep` rather than slow code."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Order tasks by their dependencies with Python's `graphlib.TopologicalSorter`: `static_order()` yields each item after everything it depends on, and a dependency cycle raises `CycleError` instead of looping."

[[note]]
level = "advanced"
topic = "SQL"
text = "Add non-key columns to a PostgreSQL index with `INCLUDE`, as in `CREATE INDEX ON orders (customer_id) INCLUDE (total)`, so queries reading only those columns can use an index-only scan."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Group items linked by pairwise matches, such as accounts that share an email or a phone number, with a union-find structure; with path compression and union by rank, each merge or lookup takes nearly constant time."

[[note]]
level = "advanced"
topic = "SQL"
text = "Fetch the latest row per group in PostgreSQL with `SELECT DISTINCT ON (user_id) * FROM events ORDER BY user_id, created_at DESC`, a shorter form than a window function with `ROW_NUMBER()`."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Use `SELECT ... FOR UPDATE NOWAIT` when an action should fail fast if another session is already changing the row: PostgreSQL and MySQL then raise an error at once instead of waiting for the lock."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Split a hot lock into stripes: keep an array of, say, 16 locks and pick one with `hash(key) % 16`, so updates to different keys rarely contend while each key is still guarded by exactly one lock."

[[note]]
level = "advanced"
topic = "Databases"
text = "Set `idle_in_transaction_session_timeout` in PostgreSQL so a session that opens a transaction and then stalls is terminated, releasing its locks and letting vacuum clean up behind it."

[[note]]
level = "advanced"
topic = "Databases"
text = "Set `log_min_duration_statement = '500ms'` in PostgreSQL to log every statement that runs longer than that, with its duration, which catches slow queries that never show up in local testing."

[[note]]
level = "advanced"
topic = "Databases"
text = "Take PostgreSQL backups with `pg_dump -Fc`: the custom format is compressed, `pg_restore -j 4` can restore it in parallel, and `pg_restore -t` can pull out a single table."

[[note]]
level = "advanced"
topic = "Databases"
text = "Switch SQLite to write-ahead logging with `PRAGMA journal_mode=WAL;`: readers no longer block the writer and the writer no longer blocks readers, which cuts `database is locked` errors in busy apps."

[[note]]
level = "advanced"
topic = "Java"
text = "Record a low-overhead production profile with Java Flight Recorder: `jcmd <pid> JFR.start duration=60s filename=app.jfr`, then open the file in JDK Mission Control or read it on the command line with `jfr print`."

[[note]]
level = "advanced"
topic = "Java"
text = "Start JVMs with `-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps`, so the first `OutOfMemoryError` leaves a heap dump showing what filled memory instead of a bare stack trace."

[[note]]
level = "advanced"
topic = "DNS"
text = "Check DNSSEC yourself with `delv example.com`, which validates the chain of signatures locally and prints `; fully validated` or the reason validation failed, instead of trusting a resolver's word."

[[note]]
level = "advanced"
topic = "Rust"
text = "Test `unsafe` Rust under Miri with `cargo +nightly miri test`: it interprets the program and reports undefined behavior, such as out-of-bounds reads and aliasing violations, that ordinary test runs pass straight through."

[[note]]
level = "advanced"
topic = "Rust"
text = "Add `debug = true` under `[profile.release]` in `Cargo.toml` while profiling: the code stays optimized, and perf or a flame graph can attribute samples to source lines and inlined functions."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Draw SVG icons with `fill: currentColor`, so they follow the text color around them, including the system colors that Windows forced-colors mode substitutes, instead of vanishing against a changed background."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "When you replace the focus outline with a `box-shadow`, also set `outline: 2px solid transparent`: Windows forced-colors mode removes box shadows but repaints that transparent outline in a visible system color."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Carry a request ID through every `await` in Node with `AsyncLocalStorage` from `node:async_hooks`: set it with `run()` in middleware, then read it with `getStore()` in your logger."

[[note]]
level = "advanced"
topic = "Python"
text = "Add `slots=True` to `@dataclass` (Python 3.10 and later) for classes with millions of instances: objects lose their per-instance `__dict__`, which saves memory and speeds up attribute access."

[[note]]
level = "advanced"
topic = "Python"
text = "Use `contextlib.ExitStack` when the number of resources is only known at runtime: call `stack.enter_context(open(p))` in a loop, and every file is closed on exit, even if a later open fails."

[[note]]
level = "advanced"
topic = "Performance"
text = "Turn a `perf` recording into a flame graph with the FlameGraph scripts, `perf script | stackcollapse-perf.pl | flamegraph.pl > cpu.svg`, then look for the widest frames, which are where the time goes."

[[note]]
level = "advanced"
topic = "Git"
text = "Fix an earlier commit in a series with `git commit --fixup=<sha>`, then run `git rebase -i --autosquash main`: Git moves each fixup under its target and marks it to be folded in, so you only confirm the todo list."

[[note]]
level = "advanced"
topic = "Git"
text = "In a large monorepo, `git sparse-checkout set services/api` limits the working tree to that directory, plus the files directly in its parent directories and the root, so status, builds and editors stop crawling through code you never touch."

[[note]]
level = "advanced"
topic = "Documentation"
text = "Build Sphinx docs in CI with `sphinx-build -W`, which turns warnings such as broken cross-references into a failed build instead of a log line nobody reads."

[[note]]
level = "advanced"
topic = "GitHub"
text = "Trigger a `workflow_dispatch` workflow from the terminal with `gh workflow run deploy.yml -f environment=staging`, then follow it with `gh run watch` instead of clicking through the Actions tab."

[[note]]
level = "advanced"
topic = "Shell"
text = "Send `set -x` output to its own file in bash: run `exec 5> trace.log`, then set `BASH_XTRACEFD=5`, and the trace no longer mixes with the script's stderr or confuses tools that parse it."

[[note]]
level = "advanced"
topic = "Shell"
text = "Put `exec > >(tee -a run.log) 2>&1` near the top of a bash script to copy all later output, stdout and stderr alike, into a log file while still showing it on the terminal."

[[note]]
level = "advanced"
topic = "Linux"
text = "Stop overlapping cron runs with `flock -n /var/lock/report.lock ./report.sh`: if the previous run still holds the lock, the new one exits at once instead of piling up behind it."

[[note]]
level = "advanced"
topic = "Linux"
text = "Check the limits a running process really has with `cat /proc/<pid>/limits`; a service started by systemd can have a very different open-files limit from the one `ulimit -n` shows in your shell."

[[note]]
level = "advanced"
topic = "Regex"
text = "In Python's `re.sub`, write `\\g<1>` instead of `\\1` when a digit follows the group in the replacement: `\\10` means group 10, so `re.sub(r'(\\d)', r'\\g<1>0', s)` is how you append a zero to each digit."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Test a cleartext HTTP/2 backend with `curl --http2-prior-knowledge <url>`; plain `--http2` on an unencrypted `http:` URL only asks to upgrade from HTTP/1.1, which many servers ignore."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Stop mixing up IDs with branded types: `type UserId = string & { readonly __brand: 'UserId' }` is still a plain string at runtime, but the compiler rejects an `OrderId` passed where a `UserId` is expected."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "When type checking gets slow, `tsc --extendedDiagnostics` prints time and memory per phase, and `tsc --generateTrace trace` records a trace showing which files and types take the longest to check."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "When rethrowing, attach the original error with `throw new Error('loading config failed', { cause: err })`; the underlying failure stays available as `error.cause`, and Node prints it along with the new error."

[[note]]
level = "advanced"
topic = "Go"
text = "Run a Go service with `GODEBUG=gctrace=1` to print one line per garbage collection with heap sizes before and after, the heap goal and pause times, a quick check on whether GC is behind a latency problem."

[[note]]
level = "advanced"
topic = "Go"
text = "`go tool pprof -http=:8080 cpu.prof` opens an interactive web view of a Go profile with a flame graph, a call graph and source annotations, which is much easier to explore than the text prompt."

[[note]]
level = "advanced"
topic = "Web"
text = "Add `<link rel=\"preconnect\">` for a critical third-party origin, such as your font or API host, so the browser starts DNS, TCP and TLS setup early instead of waiting until it discovers the first request there."

[[note]]
level = "advanced"
topic = "Web"
text = "Apply `content-visibility: auto` to long offscreen sections of a page, and the browser skips their layout and painting until they near the viewport; pair it with `contain-intrinsic-size` so the scrollbar stays stable."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Mark a closed off-canvas menu or the page behind a custom overlay with the `inert` attribute: its elements can no longer be focused or clicked and drop out of the accessibility tree, with no `tabindex` juggling."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Build Rust releases with `cargo build --locked`: it fails if `Cargo.lock` is missing or would need to change, instead of quietly resolving new versions on the build machine."

[[note]]
level = "advanced"
topic = "Security"
text = "Issue short-lived SSH certificates instead of spreading public keys: `ssh-keygen -s ca_key -I alice -n alice -V +8h id_ed25519.pub` signs a key valid for eight hours, and servers trust the CA through `TrustedUserCAKeys`."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "`openssl s_client -connect example.com:443 -servername example.com -showcerts </dev/null` prints the certificate chain the server actually sends, exposing a missing intermediate that browsers may paper over."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Add Subresource Integrity to scripts loaded from a CDN, as in `<script src=\"...\" integrity=\"sha384-...\" crossorigin=\"anonymous\">`, so the browser refuses to run the file if its contents ever change."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Run `govulncheck ./...` on Go projects: it checks your dependencies against the Go vulnerability database and uses your call graph to separate vulnerable functions your code reaches from ones it merely imports."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Ship a breaking change to a Go module under a new major version path, such as `example.com/lib/v2` in `go.mod`, so v1 and v2 can be imported side by side and existing users are never upgraded by surprise."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Mark public Rust enums and structs `#[non_exhaustive]`: downstream crates must then use a wildcard arm or `..` in patterns, so adding a variant or field later is not a breaking change."

[[note]]
level = "advanced"
topic = "Regex"
text = "GNU `sed` can change case in a replacement: `sed -E 's/\\b(.)/\\u\\1/g'` capitalizes every word, and `\\U` up to `\\E` uppercases a whole span. The BSD `sed` on macOS lacks these escapes, so such scripts aren't portable."

[[note]]
level = "advanced"
topic = "Observability"
text = "Find which metrics use the most series in Prometheus with `topk(10, count by (__name__) ({__name__=~'.+'}))`; a single metric with one runaway label often accounts for most of the memory."

[[note]]
level = "advanced"
topic = "Networking"
text = "Capture traffic on a server with `tcpdump -i any -nn -w cap.pcap port 443`, then open the file in Wireshark on your machine, where you can follow streams and spot retransmissions and resets."

[[note]]
level = "advanced"
topic = "DNS"
text = "Query the authoritative server directly with `dig @ns1.example.com api.example.com +norecurse` to see what it really serves right now, bypassing every cache between you and it."

[[note]]
level = "advanced"
topic = "Performance"
text = "Drive load tests at a fixed arrival rate rather than with N clients in a loop: looping clients wait for slow responses and send less, hiding exactly the queueing delay you are trying to measure."

[[note]]
level = "advanced"
topic = "Performance"
text = "For benchmarks that must be stable in noisy CI, count instructions with `valgrind --tool=callgrind ./bench` instead of timing runs; the counts barely vary between runs, and `callgrind_annotate` shows where they go."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Add `-w '%{json}'` to a curl command to print every transfer detail it tracks, such as status, HTTP version, remote IP and each timing phase, as one JSON object you can filter with `jq`."

[[note]]
level = "advanced"
topic = "Documentation"
text = "Add `#![warn(missing_docs)]` to a Rust library's root so the compiler flags every public item without a doc comment, and CI keeps new APIs documented."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Repair text that was decoded with the wrong codec by reversing the mistake: in Python, `'CafÃ©'.encode('cp1252').decode('utf-8')` gives back `Café`; for mixed damage, the `ftfy` library detects and fixes common cases."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Run related goroutines with `errgroup.WithContext` from `golang.org/x/sync/errgroup`: `Wait` returns the first error, and the shared context is canceled so the other goroutines can stop early."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Collapse duplicate concurrent work with Go's `singleflight.Group`: when many requests miss the cache for the same key at once, one call does the fetch and the rest share its result."

[[note]]
level = "advanced"
topic = "Performance"
text = "Send many Redis commands in one round trip with pipelining, as with `pipe = r.pipeline(transaction=False)` in redis-py followed by `pipe.execute()`; a thousand `SET`s then pay for one network wait instead of a thousand."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Give shared caches a different lifetime from browsers with `s-maxage`: `Cache-Control: max-age=60, s-maxage=86400` lets the CDN keep a page for a day, purged on deploy, while browsers recheck every minute."

[[note]]
level = "advanced"
topic = "Data"
text = "Make batch jobs safe to rerun: write each run's output to a partition keyed by its logical date and overwrite that partition, so a retry replaces the data instead of appending duplicates."

[[note]]
level = "advanced"
topic = "Data"
text = "Turn JSON records into CSV with `jq -r '.[] | [.id, .name, .email] | @csv'`; `@csv` quotes and escapes every field correctly, which hand-built string joins often get wrong."

[[note]]
level = "advanced"
topic = "Regex"
text = "Write complex Python regexes with `re.VERBOSE`: whitespace in the pattern is ignored and `#` starts a comment, so you can split the pattern over several lines and label each part."

[[note]]
level = "advanced"
topic = "Time"
text = "List the exact moments a time zone changes its offset with `zdump -v -c 2025,2027 Europe/Berlin`, then use those instants as test cases for code that has to handle daylight saving time."

[[note]]
level = "advanced"
topic = "Code review"
text = "Review re-indented code with `git diff -w` or the hide-whitespace option in GitHub's diff view; whitespace-only changes disappear, so the real edits stand out."

[[note]]
level = "advanced"
topic = "APIs"
text = "Batch GraphQL resolver lookups with a DataLoader-style loader, which collects the IDs requested during one tick of the event loop and fetches them in a single query instead of one query per list item."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Check a certificate chain before deploying it with `openssl verify -CAfile root.pem -untrusted intermediate.pem server.pem`; `OK` means the intermediates you plan to serve link your certificate to that root."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Before adopting a dependency, `npm pack <pkg>` downloads its published tarball without installing it or running any scripts, and `tar -tzf` on the file lists exactly what it would put on your machine."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Build Go release binaries with `go build -trimpath`, which strips local file system paths from the binary, so builds from different checkouts or machines can match byte for byte."

[[note]]
level = "advanced"
topic = "APIs"
text = "For work that outlasts a request, return `202 Accepted` with a `Location` header pointing at a status resource the client can poll, instead of holding the connection open until the job finishes."

[[note]]
level = "advanced"
topic = "APIs"
text = "Announce an endpoint's retirement in-band with the `Sunset` response header (RFC 8594), which carries the date after which it may stop working, so clients can log and alert on it long before it does."

[[note]]
level = "professional"
topic = "CI"
text = "Set `concurrency` with `cancel-in-progress: true` on pull-request workflows, so a new push cancels the run it replaces. Leave it off deploy jobs, where a half-finished run is worse than a queued one."

[[note]]
level = "professional"
topic = "CI"
text = "Put the pipeline's real logic in a script in the repo, such as `scripts/ci.sh` or a `make ci` target, and keep the CI config down to calling it; anyone can then reproduce a failing job locally without pushing."

[[note]]
level = "professional"
topic = "CI"
text = "Split test shards by historical run time rather than by file count, so parallel jobs finish at about the same moment and the slowest shard stops setting your merge time."

[[note]]
level = "professional"
topic = "CI"
text = "Move a flaky test into a separate non-blocking job with a named owner and a ticket instead of adding blanket retries; retries hide real race conditions along with the noise."

[[note]]
level = "professional"
topic = "CI"
text = "Run the full test suite on a nightly schedule against the default branch as well; scheduled runs catch expiring certificates, date-dependent tests and upstream breakage that no pull request triggers."

[[note]]
level = "professional"
topic = "CI"
text = "Pin the CI runner image and toolchain versions instead of tracking `latest`, and bump them in dedicated pull requests, so a red build points at either your change or the upgrade, never both."

[[note]]
level = "professional"
topic = "CI"
text = "Key dependency caches on a hash of the lockfile and fall back to a prefix match on a miss, so an unchanged lockfile restores exactly and a changed one still starts from a warm cache."

[[note]]
level = "professional"
topic = "CI"
text = "Export per-job CI durations and failure rates to your metrics system and review the p95 weekly; the slowest job, not the average one, sets how long every merge waits."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Keep spare cluster capacity warm with placeholder pods in a `PriorityClass` with a slightly negative value such as `-1`: real workloads preempt them at once, and the cluster autoscaler adds nodes for the evicted placeholders in the background."

[[note]]
level = "professional"
topic = "CI"
text = "Print the commit SHA, runner image and tool versions at the top of every CI job log, so a failure from weeks ago can be reproduced without guessing what the environment was."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Get a shell on a node without SSH using `kubectl debug node/<node> -it --image=ubuntu`: the debug pod runs in the node's host namespaces with the node's root filesystem mounted at `/host`."

[[note]]
level = "professional"
topic = "Cloud"
text = "Let AWS IAM Access Analyzer generate a policy from a role's recorded CloudTrail activity, then use it to replace the role's broad permissions with the actions it actually called."

[[note]]
level = "professional"
topic = "Observability"
text = "Mark every deploy, config change and feature-flag flip as an annotation on your main dashboards. During an incident, a spike that lines up with a marker points to a likely cause in seconds instead of a search through chat history."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Set `default_tags` in the Terraform AWS provider block so every resource it creates gets owner, service and environment tags without repeating them in each resource block."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Mask values fetched at runtime, such as a token from a vault, with `echo \"::add-mask::$TOKEN\"` before anything prints them; values from the `secrets` context are masked automatically, runtime values are not."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Wrap operational chores such as reprocessing a queue or rotating a key in `workflow_dispatch` workflows with typed `inputs`; you get an audit trail and access control instead of scripts that only run from one laptop."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Share one pipeline across many repositories as a reusable workflow (`on: workflow_call`), so a fix to the build or a security hardening lands everywhere through one pull request."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Gate production deploys with a GitHub environment that has required reviewers and branch restrictions; its secrets are released only to jobs that pass those rules."

[[note]]
level = "professional"
topic = "Containers"
text = "Keep BuildKit's layer cache across ephemeral CI runners by storing it in a registry with `--cache-to type=registry,ref=<repo>:buildcache,mode=max` and reading it back with `--cache-from type=registry,ref=<repo>:buildcache`."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Add a final step with `if: failure()` that uploads logs, dumps or screenshots with `actions/upload-artifact`, so a red run can be diagnosed without rerunning it."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Register self-hosted runners with `./config.sh --ephemeral` and give each job a fresh machine or container, so nothing a job leaves behind, including a compromised dependency, carries into the next one."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Set `timeout-minutes` on every job to a small multiple of its normal duration; a hung test otherwise holds a runner until the much longer platform default runs out."

[[note]]
level = "professional"
topic = "CI"
text = "Deploy each pull request to a short-lived preview environment with its own URL and tear it down automatically when the pull request closes, so reviewers can try the change and nothing lingers to cost money."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Before printing untrusted text in a step, such as a pull request body or a downloaded log, run `echo \"::stop-commands::$TOKEN\"` with a random token so lines starting with `::` are not treated as workflow commands; `echo \"::$TOKEN::\"` resumes them."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Give an aggregate required-check job `if: always()` and make it fail unless every `needs` result is `success`; a job skipped because a dependency failed can count as passing for branch protection."

[[note]]
level = "professional"
topic = "Code review"
text = "Track how long your team's pull requests wait for a first review; a growing wait shows up as bigger, riskier batches of change well before anyone complains about it."

[[note]]
level = "professional"
topic = "Documentation"
text = "Put an owner and a last-reviewed date at the top of every internal doc; a page with no owner is never updated, and the date tells readers how far to trust it."

[[note]]
level = "professional"
topic = "GitHub"
text = "Enable private vulnerability reporting on public repositories, so researchers can send you a draft security advisory instead of opening a public issue about an unpatched bug."

[[note]]
level = "professional"
topic = "GitHub"
text = "Audit settings across an organization with `gh api --paginate` and `--jq`, for example listing every repository with its default branch, instead of clicking through settings pages one by one."

[[note]]
level = "professional"
topic = "GitHub"
text = "Turn on secret scanning push protection, so pushes containing recognized credentials are blocked before they reach the remote; rejecting a push is far cheaper than rotating a leaked key."

[[note]]
level = "professional"
topic = "Networking"
text = "Check whether a Linux host has been refusing connections at full accept queues with `nstat -az TcpExtListenOverflows TcpExtListenDrops`; counters that keep rising mean the application is not calling `accept()` fast enough."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Set flags for a Node process you don't launch directly, such as one started by a framework CLI or a container entrypoint, through the `NODE_OPTIONS` environment variable, as in `NODE_OPTIONS=--max-old-space-size=2048`."

[[note]]
level = "professional"
topic = "Git"
text = "List bulk-formatting commits in `.git-blame-ignore-revs` and run `git config blame.ignoreRevsFile .git-blame-ignore-revs`, so blame skips them; GitHub's blame view honors the file as well."

[[note]]
level = "professional"
topic = "Git"
text = "Start a hotfix in a second directory with `git worktree add -b hotfix ../hotfix origin/main`; your feature branch, its build output and uncommitted work stay untouched."

[[note]]
level = "professional"
topic = "Git"
text = "Re-review a force-pushed pull request with `git range-diff main <old-tip> <new-tip>`; it pairs up the commits and shows only how each one changed between the two versions."

[[note]]
level = "professional"
topic = "Git"
text = "Run `git config rerere.enabled true` before a long rebase or repeated merges; Git records how you resolved each conflict and reapplies the resolution when the same conflict returns."

[[note]]
level = "professional"
topic = "Databases"
text = "Watch long PostgreSQL operations from another session: `pg_stat_progress_create_index`, `pg_stat_progress_vacuum` and `pg_stat_progress_copy` show each one's current phase and how many blocks or tuples it has processed."

[[note]]
level = "professional"
topic = "Git"
text = "See what actually landed on main with `git log --first-parent main`; it shows one entry per merge and hides the individual commits of each merged branch."

[[note]]
level = "professional"
topic = "Git"
text = "Revert a bad merge with `git revert -m 1 <merge>`; before merging the fixed branch again, revert that revert, or Git treats the branch's original commits as already merged and leaves them out."

[[note]]
level = "professional"
topic = "Git"
text = "Run `git maintenance start` in large repositories to schedule background prefetch, commit-graph and repack tasks, keeping everyday commands like `git status` and `git log` fast."

[[note]]
level = "professional"
topic = "Git"
text = "Blame through refactors with `git blame -w -C -C -C <file>`; ignoring whitespace and searching every commit for moved or copied lines points at the real author, not whoever moved the code."

[[note]]
level = "professional"
topic = "Git"
text = "Add `--force-if-includes` to `git push --force-with-lease` (or set `push.useForceIfIncludes`), so a background fetch cannot satisfy the lease and let you overwrite commits you never saw."

[[note]]
level = "professional"
topic = "Incidents"
text = "Declare an incident as soon as you suspect customer impact; downgrading a false alarm costs minutes, while declaring late loses the early timeline and the help you needed."

[[note]]
level = "professional"
topic = "DNS"
text = "Before deleting a DNS name, turn on query logging at your resolvers or DNS provider for a while and see who still looks it up; those clients are the ones that will break, and the logs show where they are."

[[note]]
level = "professional"
topic = "Incidents"
text = "Mitigate before you diagnose: if the trouble started with a deploy or a flag change, roll it back first and investigate the cause once users are no longer affected."

[[note]]
level = "professional"
topic = "Incidents"
text = "Post status updates on a fixed cadence, such as every 30 minutes, even when nothing has changed; a predictable \"next update at 14:30 UTC\" stops the stream of pings asking for news."

[[note]]
level = "professional"
topic = "Incidents"
text = "Keep a timestamped log in the incident channel as you work, noting what you saw and what you changed in UTC; rebuilding the timeline from memory afterward is slow and unreliable."

[[note]]
level = "professional"
topic = "Incidents"
text = "Announce in the incident channel what you are about to change before you change it; it stops two responders from restarting the same service or undoing each other's fixes."

[[note]]
level = "professional"
topic = "Incidents"
text = "Start the postmortem timeline at the change that triggered the incident, not at the first alert, so you measure detection delay as well as time to recover."

[[note]]
level = "professional"
topic = "Incidents"
text = "In postmortems, ask what made each action seem reasonable at the time; the answers surface missing signals, misleading dashboards and unclear runbooks that blame would hide."

[[note]]
level = "professional"
topic = "Observability"
text = "Configure Alertmanager `inhibit_rules` so a cause alert, such as a whole cluster or data center being down, suppresses the dozens of symptom alerts it triggers, and on-call gets the one page that explains the rest."

[[note]]
level = "professional"
topic = "Incidents"
text = "Run game days: break something on purpose in staging, or carefully in production, and let on-call respond with the real runbooks and tools, so gaps surface before a real outage does."

[[note]]
level = "professional"
topic = "Incidents"
text = "Define severity levels by customer impact, such as \"checkout failing for all users\", rather than by cause, so the first responder can pick a level within a minute without diagnosing anything."

[[note]]
level = "professional"
topic = "Incidents"
text = "Test your break-glass access on a schedule: sign in with the emergency account, confirm the login raises an alert, then rotate the credentials; an untested path tends to fail exactly when you need it."

[[note]]
level = "professional"
topic = "Incidents"
text = "When an incident outlasts a shift, hand off in writing: current impact, what has been tried, the working theory and the next step, so the incoming commander does not start from zero."

[[note]]
level = "professional"
topic = "Incidents"
text = "Ask what changed first: put deploys, config pushes, feature flag flips, certificate renewals and traffic shifts on one timeline next to the moment errors started."

[[note]]
level = "professional"
topic = "Incidents"
text = "Pause unrelated deploys while an incident is open; every extra change adds noise to your graphs and another suspect to rule out."

[[note]]
level = "professional"
topic = "Incidents"
text = "On Linux, record your terminal during incident response with `script -f incident.log`; the postmortem then gets the exact commands and output instead of recollection."

[[note]]
level = "professional"
topic = "Observability"
text = "Page on error-budget burn rate measured over two windows, such as one hour and five minutes, so alerts fire fast for real outages and clear soon after recovery instead of on every brief spike."

[[note]]
level = "professional"
topic = "Observability"
text = "Page on symptoms users feel, such as error rate and latency at the edge, and route cause signals like CPU or disk usage to dashboards and tickets; you get fewer pages, and each one matters."

[[note]]
level = "professional"
topic = "Architecture"
text = "Tag each request with a criticality, such as critical or sheddable, where it enters the system and pass it on with every downstream call, so an overloaded service drops batch and background work before user-facing requests."

[[note]]
level = "professional"
topic = "Observability"
text = "Emit one wide, structured event per request carrying everything you know (route, customer tier, build, timings, error class) instead of scattered log lines; you can then slice an incident by any field."

[[note]]
level = "professional"
topic = "Observability"
text = "Propagate the W3C `traceparent` header through every service call, queue message and background job, so one trace ID follows a request from the edge to the database."

[[note]]
level = "professional"
topic = "Testing"
text = "Unit-test Prometheus alerting rules with `promtool test rules`: feed synthetic series and assert which alerts fire at which times, so a refactored expression or a renamed label cannot silently stop an alert from firing."

[[note]]
level = "professional"
topic = "Observability"
text = "Keep user IDs, request IDs and raw URLs out of metric labels, since each distinct value creates a new time series; put high-cardinality fields in logs and trace attributes instead."

[[note]]
level = "professional"
topic = "Observability"
text = "Link a runbook from every alert's annotations; the page should say what the alert means, how to confirm user impact and what the first safe mitigation is."

[[note]]
level = "professional"
topic = "Debugging"
text = "Snapshot a stuck process with `gcore <pid>`: it pauses the process only while writing a core file, then lets it continue, so you can restart the service and still inspect the stuck state in gdb afterward."

[[note]]
level = "professional"
topic = "Observability"
text = "Alert on `absent(up{job=\"payments\"})` as well as on errors: when a target vanishes from scraping, its error-rate alerts go quiet instead of firing, and only an absence check notices the silence."

[[note]]
level = "professional"
topic = "Observability"
text = "Use a `rate()` range of at least four times the scrape interval in PromQL; with shorter windows, a single missed scrape leaves too few samples and the graph shows gaps."

[[note]]
level = "professional"
topic = "Observability"
text = "Add an `absent(up{job=\"api\"})` alert for each critical scrape job; ordinary rules evaluate to nothing when a target disappears entirely, so they never fire."

[[note]]
level = "professional"
topic = "Testing"
text = "Run soak tests that hold normal load for many hours; memory leaks, connection-pool exhaustion and slowly filling disks show up only over time, which a short load test never reaches."

[[note]]
level = "professional"
topic = "Observability"
text = "Build dashboards with the RED method (rate, errors, duration) for each service and the USE method (utilization, saturation, errors) for each resource, so every panel answers a known question."

[[note]]
level = "professional"
topic = "Observability"
text = "Run synthetic checks against public endpoints from outside your network and cloud provider; internal health checks miss DNS, CDN and certificate failures that users hit."

[[note]]
level = "professional"
topic = "Observability"
text = "Make log levels adjustable at runtime through an admin endpoint or config reload, so you can turn on debug logging for one service during an incident without a redeploy."

[[note]]
level = "professional"
topic = "Observability"
text = "Review each week's pages in a short recurring meeting and delete or retune any alert that needed no action; every noisy alert trains on-call to ignore the next one."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Generate an SBOM in SPDX or CycloneDX format for every release and store it with the artifact; when the next widely exploited library bug lands, you can answer \"are we affected\" in minutes."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Sign container images and release artifacts in CI with `cosign` keyless signing, and verify both the signature and the expected signer identity at deploy time."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Load tracing or APM instrumentation with `node --import ./instrument.mjs app.mjs`, so it runs before any application module is imported and can patch them; importing it from inside the app is often too late for ES modules."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Run `npm ci --ignore-scripts` in CI and enable install scripts only for the few packages that truly need them; lifecycle scripts are how many malicious packages run code on install."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Configure your dependency update bot to wait several days after a release before proposing it, so a compromised version is more likely to be caught and pulled before it reaches your builds."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Run `npm audit signatures` in CI to verify registry signatures and provenance attestations for the packages in your dependency tree."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Map your npm scope to your private registry in `.npmrc` with an `@yourorg:registry=` line, so internal package names are never resolved from the public registry."

[[note]]
level = "professional"
topic = "Databases"
text = "Measure replication lag from the PostgreSQL primary with `SELECT application_name, replay_lag FROM pg_stat_replication`; `replay_lag` shows, as a time interval, how far each standby is behind in applying changes."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Serve dependencies through an internal caching proxy for each package ecosystem; builds keep working when upstream packages vanish, and you can block a known-bad version in one place."

[[note]]
level = "professional"
topic = "Testing"
text = "Push load tests past your expected peak until something fails, and note which resource saturates first; the breaking point and the first bottleneck tell you far more than a pass at the planned load."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Commit `go.sum` and keep the checksum database (`GOSUMDB`) enabled; run `go mod verify` to confirm the modules in your local cache have not changed since download."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Require two people for every release: protect release tags and put publishing jobs behind an environment with required reviewers, so one compromised account cannot ship alone."

[[note]]
level = "professional"
topic = "Security"
text = "Replace SSH agent forwarding with `ssh -J bastion target` (ProxyJump); the bastion only relays an encrypted connection, so a compromised bastion cannot use your keys."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Run `tsc --listFilesOnly` to print every file the compiler loads, then stop; stray test fixtures, generated code or a whole `node_modules` folder in that list explain slow type checks."

[[note]]
level = "professional"
topic = "Security"
text = "Plant canary credentials, such as unused API keys that alert on any use, in config files, backups and wikis attackers are likely to search; any hit is a high-signal intrusion alert."

[[note]]
level = "professional"
topic = "Security"
text = "Threat-model each design review with STRIDE (spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege) to find missing controls before any code exists."

[[note]]
level = "professional"
topic = "Security"
text = "Serve admin and debug endpoints on a separate port that the public load balancer never routes to, rather than relying on a path check inside the main listener."

[[note]]
level = "professional"
topic = "Security"
text = "Audit production access on a schedule: export who holds admin roles, have each owner confirm or revoke, and remove anything left unconfirmed by default."

[[note]]
level = "professional"
topic = "Security"
text = "Rotate a credential by overlapping: issue the new secret, deploy it everywhere, confirm the old one sees no traffic, then revoke it; a hard cutover turns routine rotation into an outage."

[[note]]
level = "professional"
topic = "Security"
text = "Rehearse a leaked-secret response: pick a production credential and rotate it end to end while timing each step; the slowest steps are what to automate before a real leak."

[[note]]
level = "professional"
topic = "Security"
text = "Keep encrypted secrets in the repository with `sops`, which encrypts values but leaves keys readable, so diffs and reviews still show which setting changed."

[[note]]
level = "professional"
topic = "Cloud"
text = "Require IMDSv2 on AWS instances (`aws ec2 modify-instance-metadata-options --instance-id <id> --http-tokens required`), so the metadata service demands a session token that a typical SSRF request cannot obtain."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Add `lifecycle { ignore_changes = [desired_capacity] }` to an autoscaling group managed by Terraform, so each apply stops resetting a value the autoscaler adjusts at run time."

[[note]]
level = "professional"
topic = "SQL"
text = "For huge append-only tables whose rows arrive in time order, try a PostgreSQL BRIN index, `CREATE INDEX ON events USING brin (created_at)`: it stores only a value range per block range, so it stays tiny yet lets range queries skip most of the table."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Roll back a bad release with `kubectl rollout undo deployment/api`, then check `kubectl rollout history deployment/api` to confirm which revision is now live."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Run `kubectl rollout status deployment/api --timeout=5m` as the last deploy step, so the pipeline fails when new pods never become ready instead of reporting a green deploy."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Preview an apply with `kubectl diff -f manifests/`; it asks the API server for a dry run, so the diff reflects defaulting and validation, not just the YAML you wrote."

[[note]]
level = "professional"
topic = "Testing"
text = "Inject delays and errors into a share of requests at the service mesh, for example with the `fault` block of an Istio `VirtualService`, to test timeouts, retries and fallbacks without changing application code."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Read why a pod crashed with `kubectl logs api-7d9f --previous`, which shows the output of the container instance that died; plain `kubectl logs` shows only the restarted one."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Enable `declarationMap` when you publish a TypeScript library along with its sources: Go to Definition in your users' editors then jumps to the original `.ts` code instead of the `.d.ts` declarations."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Audit what a workload can do with `kubectl auth can-i --list --as=system:serviceaccount:prod:api -n prod` before granting it more RBAC permissions."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Start each namespace with a default-deny `NetworkPolicy` and allow flows explicitly; policies only take effect if your network plugin enforces them, so test that a blocked connection actually fails."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Set `automountServiceAccountToken: false` on pods that never call the Kubernetes API, so a compromised container finds no cluster credentials to steal."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Spread replicas across zones with `topologySpreadConstraints` on `topology.kubernetes.io/zone`, so losing one zone takes out a fraction of capacity instead of the whole service."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Set a numeric user in your Dockerfile, such as `USER 10001`, so Kubernetes can enforce `runAsNonRoot`; with a user name instead of a UID, the kubelet cannot verify it and refuses to start the container."

[[note]]
level = "professional"
topic = "SQL"
text = "Bulk-load PostgreSQL with `COPY events FROM STDIN (FORMAT csv)`, or `\\copy` in `psql`, instead of row-by-row `INSERT`s: it streams all rows through one command, skipping per-statement parsing and round trips, and is typically far faster."

[[note]]
level = "professional"
topic = "Debugging"
text = "For a process stuck in `D` state that ignores even `kill -9`, read `/proc/<pid>/stack` as root to see the kernel call chain it is blocked in, which is often an NFS server or a failing disk."

[[note]]
level = "professional"
topic = "Web"
text = "Send `Cross-Origin-Opener-Policy: same-origin` from pages that handle accounts or payments, so cross-origin windows they open, or that open them, are cut off and cannot navigate or probe them through a window reference."

[[note]]
level = "professional"
topic = "Performance"
text = "On SSD storage, lower PostgreSQL's `random_page_cost` from its default of 4, which models spinning disks, to around 1.1. Otherwise the planner overprices index scans and chooses sequential scans too often."

[[note]]
level = "professional"
topic = "Containers"
text = "Keep package caches between builds with `RUN --mount=type=cache,target=/root/.cache/pip pip install -r requirements.txt`; the cache survives layer invalidation and never ships in the image."

[[note]]
level = "professional"
topic = "Containers"
text = "Run containers with `--read-only`, a `--tmpfs /tmp` for scratch space, and `--cap-drop=ALL` plus only the capabilities you need, so an attacker who gains code execution has far less to work with."

[[note]]
level = "professional"
topic = "Containers"
text = "Add `org.opencontainers.image.revision` and `org.opencontainers.image.source` labels to every image, so anyone looking at a running container can trace it to the exact commit."

[[note]]
level = "professional"
topic = "Containers"
text = "Build multi-architecture images in one step with `docker buildx build --platform linux/amd64,linux/arm64 --push`, so ARM nodes pull a native image instead of failing or running under emulation."

[[note]]
level = "professional"
topic = "Debugging"
text = "When one host in a fleet misbehaves, diff it against a healthy peer with the same role: package versions, kernel, sysctl values, config files and image ID. A difference found in minutes often beats hours of profiling."

[[note]]
level = "professional"
topic = "SQL"
text = "Load PostgreSQL's `auto_explain` module and set `auto_explain.log_min_duration = '1s'` to log the actual plan of each slow statement, capturing the plan production used rather than the one `EXPLAIN` shows you later."

[[note]]
level = "professional"
topic = "Databases"
text = "Start Postgres migrations with `SET lock_timeout = '5s'`; a DDL statement stuck behind a long query then fails and can be retried, instead of making every later query queue behind its lock request."

[[note]]
level = "professional"
topic = "Databases"
text = "Catch schema drift by dumping each environment's schema with `pg_dump --schema-only` and diffing the files; changes someone applied by hand in production show up line by line."

[[note]]
level = "professional"
topic = "Databases"
text = "Rank Postgres queries by `total_exec_time` in `pg_stat_statements`; a fast query that runs millions of times often costs more than the slow one everyone complains about."

[[note]]
level = "professional"
topic = "Databases"
text = "Spot the tables autovacuum is falling behind on with `SELECT relname, n_dead_tup, last_autovacuum FROM pg_stat_user_tables ORDER BY n_dead_tup DESC LIMIT 10`, and tune those tables' vacuum settings first."

[[note]]
level = "professional"
topic = "Data"
text = "Add provenance columns such as `_source_file` and `_loaded_at` to every row a pipeline loads; when bad data turns up, one query shows which file and which run brought it in."

[[note]]
level = "professional"
topic = "Databases"
text = "Add a Postgres foreign key or check constraint with `NOT VALID`, then run `VALIDATE CONSTRAINT` as a separate statement; validation scans existing rows without blocking writes."

[[note]]
level = "professional"
topic = "Databases"
text = "Find blocked sessions and their blockers in Postgres with `SELECT pid, pg_blocking_pids(pid), query FROM pg_stat_activity WHERE cardinality(pg_blocking_pids(pid)) > 0;`."

[[note]]
level = "professional"
topic = "Databases"
text = "Set `application_name` in each service's database connection string, so `pg_stat_activity` shows which service owns a slow query or an idle transaction."

[[note]]
level = "professional"
topic = "Databases"
text = "Run large backfills and deletes in batches of a few thousand rows keyed by primary key, committing each batch and pausing between them, so replicas keep up and locks stay short."

[[note]]
level = "professional"
topic = "Data"
text = "Sample users deterministically by hashing their ID and keeping those whose hash falls in a fixed range; unlike `random()`, every run and every table picks the same users, so joins across sampled tables still line up."

[[note]]
level = "professional"
topic = "Databases"
text = "Index foreign key columns on the referencing side yourself; Postgres does not create those indexes, and without one every delete of a parent row scans the child table."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Compare large datasets across two sites with a Merkle tree: hash ranges of rows, compare the top-level hashes, and descend only into ranges whose hashes differ, so finding a few changed rows moves very little data."

[[note]]
level = "professional"
topic = "SQL"
text = "Page through large tables with keyset pagination, `WHERE (created_at, id) > ($1, $2) ORDER BY created_at, id LIMIT 100`; unlike `OFFSET`, each page costs the same however deep you go."

[[note]]
level = "professional"
topic = "SQL"
text = "Make retried writes idempotent in Postgres with `INSERT ... ON CONFLICT (key) DO NOTHING` or `DO UPDATE`, so a redelivered message or repeated request does not create a duplicate row."

[[note]]
level = "professional"
topic = "SQL"
text = "Index only the rows you query with a partial index, such as `CREATE INDEX ON jobs (run_at) WHERE status = 'pending'`; it stays small even when the table holds years of finished jobs."

[[note]]
level = "professional"
topic = "SQL"
text = "Index an expression exactly as you query it, such as `CREATE INDEX ON users (lower(email))` for `WHERE lower(email) = $1`; a plain index on `email` cannot serve that filter."

[[note]]
level = "professional"
topic = "SQL"
text = "Wrap a manual production `UPDATE` or `DELETE` in `BEGIN`, check the reported row count, and only then `COMMIT`; a wrong `WHERE` clause becomes a `ROLLBACK` instead of a restore."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Set `log_lock_waits = on` in PostgreSQL to log every statement that waits longer than `deadlock_timeout`, one second by default, for a lock, along with the process IDs holding it."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Run a job on one instance at a time with `SELECT pg_try_advisory_lock(42)`; it returns false immediately if another session holds the lock, and Postgres releases it if the session dies."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Pair distributed locks with fencing tokens: the lock service hands out an increasing number with each grant, and storage rejects writes carrying an older one, so a paused former holder cannot corrupt data."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Use optimistic concurrency for read-modify-write: `UPDATE ... SET version = version + 1 WHERE id = $1 AND version = $2`; zero rows updated means someone else changed the row first, so reload and retry."

[[note]]
level = "professional"
topic = "Performance"
text = "Spread fleet-wide scheduled work with random jitter, such as `RandomizedDelaySec=` on systemd timers, so thousands of hosts do not hit the same API or database in the same minute."

[[note]]
level = "professional"
topic = "Performance"
text = "Run `perf stat -e cycles,instructions ./app` to get instructions per cycle: a hot loop running well under one per cycle is often stalled on memory, so improving data layout pays off more than cutting instructions."

[[note]]
level = "professional"
topic = "Web"
text = "Block your analytics, chat or ad vendor's domain with request blocking in Chrome DevTools and reload: the page should still render and work, because a slow or failing vendor must not take your site down with it."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Export the fields of `process.memoryUsage()` as metrics from Node services: a steadily rising `heapUsed` points at a JavaScript object leak, while `rss` climbing over a flat heap points at buffers or native memory."

[[note]]
level = "professional"
topic = "Performance"
text = "Run continuous profiling in production at a low sampling rate, so when latency regresses you can diff profiles from before and after the deploy instead of trying to reproduce it."

[[note]]
level = "professional"
topic = "Performance"
text = "When `EXPLAIN ANALYZE` in PostgreSQL shows `Sort Method: external merge`, the sort spilled to disk because it did not fit in `work_mem`. Raise it for that session or role, as with `SET work_mem = '256MB'`, rather than server-wide."

[[note]]
level = "professional"
topic = "Architecture"
text = "Propagate a deadline rather than fixed per-hop timeouts: each service passes on the time remaining, so downstream work stops as soon as the original caller has given up."

[[note]]
level = "professional"
topic = "Debugging"
text = "Count system calls per process across a whole Linux host with `bpftrace -e 'tracepoint:raw_syscalls:sys_enter { @[comm] = count(); }'`, then press Ctrl+C to see which program is hammering the kernel."

[[note]]
level = "professional"
topic = "Architecture"
text = "Give each downstream dependency its own connection pool or concurrency limit, a bulkhead, so one slow dependency cannot tie up the threads that serve every other request."

[[note]]
level = "professional"
topic = "Architecture"
text = "Shed load early when overloaded: reject excess requests at the front door with a fast `503` and a `Retry-After` header, instead of queueing them until everything times out."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Start Node services with `--report-uncaught-exception` and `--report-on-fatalerror`, so a crash writes a diagnostic report: a JSON file with stacks, heap statistics, resource usage and loaded libraries."

[[note]]
level = "professional"
topic = "Architecture"
text = "Replace a legacy system incrementally with the strangler fig pattern: put a proxy in front, move one route at a time to the new service, and keep each step small and reversible."

[[note]]
level = "professional"
topic = "Teams"
text = "Rotate an \"interrupt\" role each week, so one person handles pages, questions and small requests while the rest of the team gets uninterrupted focus time."

[[note]]
level = "professional"
topic = "Teams"
text = "Have each new engineer ship a small real change to production in their first week, paired with a buddy; it tests your onboarding docs and dev setup faster than any checklist review."

[[note]]
level = "professional"
topic = "Teams"
text = "Bring new on-call engineers in through shadowing and then reverse shadowing, where they lead and you watch, before they carry the pager alone."

[[note]]
level = "professional"
topic = "Releases"
text = "Decouple deploy from release with feature flags: ship code dark, enable it for internal users, then ramp up by percentage, and switch it off without a deploy if metrics move."

[[note]]
level = "professional"
topic = "Releases"
text = "Give every feature flag an owner and an expiry date when you create it, and have a check fail once the date passes; stale flags become untested code paths nobody dares delete."

[[note]]
level = "professional"
topic = "Releases"
text = "Canary each release to a small share of traffic and compare its error rate and latency with the stable version automatically, promoting only when the canary is no worse."

[[note]]
level = "professional"
topic = "Releases"
text = "Add bake time between rollout stages, such as one region, a pause, then the rest; many failures only appear after caches expire, scheduled jobs run or traffic peaks."

[[note]]
level = "professional"
topic = "Releases"
text = "Make rollback run through the same pipeline as a deploy, pointing at the previous artifact, so the rollback path is exercised with every release instead of rotting until you need it."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Triage accessibility audit findings by the user journeys they block, such as sign-up and checkout, rather than by page or issue count, so the first fixes remove the barriers that stop people completely."

[[note]]
level = "professional"
topic = "Linux"
text = "Get a first read on a struggling host with `vmstat 1`: run queue (`r`), blocked tasks (`b`), swap-in and swap-out, I/O wait and CPU split, refreshed every second."

[[note]]
level = "professional"
topic = "Linux"
text = "Confirm an OOM kill from the kernel log with `journalctl -k | grep -i 'out of memory'`; each entry names the killed process and how much memory it held."

[[note]]
level = "professional"
topic = "Linux"
text = "Override a packaged systemd unit with `systemctl edit nginx.service`, which writes a drop-in under `/etc/systemd/system/nginx.service.d/`, so package upgrades never overwrite your changes."

[[note]]
level = "professional"
topic = "Linux"
text = "Check whether installed files still match their packages with `rpm -Va` on RHEL-family systems or `debsums -c` on Debian and Ubuntu; after a suspected intrusion or a botched manual fix, they list the files that changed."

[[note]]
level = "professional"
topic = "Linux"
text = "Check `/proc/pressure/memory` and `/proc/pressure/io` for stall time; they show how often tasks wait on memory or disk, contention that free-memory and utilization graphs miss."

[[note]]
level = "professional"
topic = "Tooling"
text = "Speed up repeated SSH connections by adding `ControlMaster auto`, `ControlPath ~/.ssh/cm-%r@%h:%p` and `ControlPersist 10m` to a `Host` block in `~/.ssh/config`; later `ssh`, `scp` and `rsync` calls reuse the open connection."

[[note]]
level = "professional"
topic = "Linux"
text = "Cap an ad hoc job with `systemd-run --scope -p MemoryMax=2G -p CPUQuota=50% ./backfill.sh`, so a one-off script cannot starve the services running on the same host."

[[note]]
level = "professional"
topic = "Networking"
text = "Show retransmits, round-trip time and congestion window for each TCP connection with `ss -ti`; a climbing `retrans` count toward one peer points to loss on that path, not a slow application."

[[note]]
level = "professional"
topic = "Networking"
text = "Test the path MTU on Linux with `ping -M do -s 1472 <host>`, which forbids fragmentation; 1472 bytes of payload plus 28 bytes of headers fill a 1500-byte packet, so a failure means a smaller MTU on the path."

[[note]]
level = "professional"
topic = "Networking"
text = "Ask the kernel which route, interface and source address it will use for a destination with `ip route get 10.20.0.5`; it applies policy routing rules and sends no packets."

[[note]]
level = "professional"
topic = "Networking"
text = "Get a per-hop loss and latency report with `mtr -rw -c 100 <host>`; loss that starts at one hop and continues to the destination matters, while loss at a single middle hop is often just rate-limited ICMP."

[[note]]
level = "professional"
topic = "DNS"
text = "Lower a record's TTL at least one old-TTL period before a planned migration, so resolvers pick up the change within minutes at cutover; raise it again once the move is stable."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Store large sets of integer IDs, such as the users in each audience segment, as Roaring bitmaps: they compress both dense and sparse ranges well and compute unions and intersections over millions of IDs quickly."

[[note]]
level = "professional"
topic = "DNS"
text = "Shift traffic between old and new endpoints gradually with weighted DNS records, such as 95 to 5 and then 50 to 50, watching errors at each step; cached answers mean each step takes effect over the record's TTL."

[[note]]
level = "professional"
topic = "DNS"
text = "Check the negative-caching TTL in your zone's SOA record before launching a hostname that clients already query; resolvers keep returning the cached NXDOMAIN until it expires."

[[note]]
level = "professional"
topic = "DNS"
text = "Lower `ndots` in the pod's `dnsConfig` for Kubernetes services that call many external hosts; with the default `ndots:5`, a lookup of a name like `api.example.com` first tries every cluster search domain."

[[note]]
level = "professional"
topic = "HTTP"
text = "Break a slow request into phases with `curl -s -o /dev/null -w '%{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}\\n' <url>`; the cumulative times separate DNS, TCP, TLS and server work."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Guard a library's public types in CI with type tests: lines marked `// @ts-expect-error` that must fail to compile, next to calls that must succeed, so a type regression breaks the build before users see it."

[[note]]
level = "professional"
topic = "TypeScript"
text = "When a bundler emits your library's JavaScript, run `tsc --emitDeclarationOnly --declaration` to produce the matching `.d.ts` files, so the published types come straight from the compiler."

[[note]]
level = "professional"
topic = "HTTP"
text = "Report backend phase timings in a `Server-Timing` response header, such as `db;dur=53, render;dur=12`; browser dev tools show them in the request's timing view."

[[note]]
level = "professional"
topic = "Web"
text = "Enforce Trusted Types with `Content-Security-Policy: require-trusted-types-for 'script'`: in supporting browsers, sinks such as `innerHTML` then reject plain strings, which blocks most DOM-based XSS at the source."

[[note]]
level = "professional"
topic = "Web"
text = "Switch off browser features your site never uses, such as camera, microphone and geolocation, with a `Permissions-Policy` header, so an injected or third-party script cannot request them either."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Ask designers to annotate heading levels, landmarks, focus order and accessible names on mockups, so developers build them in from the start instead of guessing or retrofitting them after an audit."

[[note]]
level = "professional"
topic = "APIs"
text = "Paginate with opaque cursors (an encoded last-seen key) rather than page numbers, so clients cannot depend on your storage layout and pages stay consistent while rows are added."

[[note]]
level = "professional"
topic = "Cloud"
text = "Enforce tags such as `owner`, `service` and `environment` on every cloud resource with policy, so you can attribute costs and find who to ask about an unknown instance."

[[note]]
level = "professional"
topic = "Cloud"
text = "Set budget alerts per account or project below the expected monthly spend, so a runaway autoscaler or a forgotten test cluster gets noticed within days rather than on the invoice."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Publish an accessibility statement that lists known issues and a way to report barriers; users get a better route than a complaint, and you hear about problems your own audits missed."

[[note]]
level = "professional"
topic = "Cloud"
text = "Check service quotas before a launch or migration and request increases early; approvals can take days, and hitting a limit mid-scale-up looks exactly like an outage."

[[note]]
level = "professional"
topic = "HTTP"
text = "Send `Timing-Allow-Origin` from your CDN and API hosts: without it, the browser's Resource Timing entries for cross-origin requests hide DNS, connect and server wait times from your real-user monitoring."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Detect drift with a scheduled `terraform plan -detailed-exitcode`: exit code 2 means real infrastructure no longer matches the code, 0 means no changes and 1 means an error."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Protect stateful resources such as databases with `lifecycle { prevent_destroy = true }`; any plan that would destroy them fails until someone deliberately removes the guard."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Run a command under a cluster-wide mutex with `etcdctl lock deploy ./deploy.sh`: etcd grants the lock to one caller at a time and releases it when the command exits or, if the client dies, when its lease expires."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Test plans against policy in CI by exporting them with `terraform show -json tfplan` and checking the JSON with a policy engine such as OPA."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Force a patched version of a vulnerable transitive dependency with `overrides` in `package.json` (npm) or `resolutions` (Yarn) while you wait for the direct dependency to ship a fix."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Ask why a package is in your tree before upgrading or removing it: `npm explain <pkg>`, `go mod why -m <module>` or `cargo tree -i <crate>` show the chain that pulls it in."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Group routine dependency updates into one pull request per ecosystem each week and let security updates arrive individually, so reviewers see a manageable stream instead of dozens of PRs."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Set `SOURCE_DATE_EPOCH` from the commit time (`git log -1 --format=%ct`) in release builds; many compilers, archivers and image builders use it instead of the current time, so rebuilds produce identical output."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Verify a build is reproducible by building the same commit twice in clean environments and comparing hashes; `diffoscope` then shows exactly which bytes differ when they do not match."

[[note]]
level = "professional"
topic = "Tooling"
text = "Wrap cron jobs in `chronic` from moreutils: it swallows a command's output when it succeeds and prints all of it when it fails, so cron mail arrives only for runs that actually broke."

[[note]]
level = "professional"
topic = "Shell"
text = "Restart a service across hosts with GNU `parallel -j 4 --halt soon,fail=1 ssh {} sudo systemctl restart app :::: hosts.txt`; after the first failure it starts no new hosts, so a bad change stops spreading."

[[note]]
level = "professional"
topic = "Shell"
text = "Wrap network calls in operational scripts with `timeout`, as in `timeout 30 curl -fsS \"$URL\"`, so a hung dependency fails the step with exit code 124 instead of stalling a deploy indefinitely."

[[note]]
level = "professional"
topic = "Networking"
text = "Keep client IP addresses through a TCP load balancer with the PROXY protocol, which prepends the original addresses to each connection; enable it on the balancer and the backend together, since either side alone breaks every connection."

[[note]]
level = "professional"
topic = "Regex"
text = "Before a regex runs on untrusted input, time it on hostile strings of growing length, such as a long run of the characters it repeats plus one that forces a failure. If doubling the length quadruples the time or worse, the pattern backtracks and needs a rewrite."

[[note]]
level = "professional"
topic = "Python"
text = "Set `PYTHONFAULTHANDLER=1` for Python services so a segfault or other fatal signal prints every thread's traceback; `faulthandler.register(signal.SIGUSR1)` also dumps them on demand without stopping the process."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Start Node services with `--enable-source-maps`, so stack traces from bundled or transpiled code point at your original source files and line numbers."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Start Node with `--heapsnapshot-signal=SIGUSR2`, and `kill -USR2 <pid>` then writes a heap snapshot you can open in Chrome DevTools without restarting the leaking process; expect a pause while it writes."

[[note]]
level = "professional"
topic = "HTTP"
text = "Send `103 Early Hints` with `Link` preload headers from your edge while the origin is still rendering the page, so browsers start fetching critical CSS and fonts during the server's think time."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Speed up type checking in a large monorepo with project references (`composite: true` and `tsc --build`), so CI rebuilds only the projects whose inputs changed."

[[note]]
level = "professional"
topic = "Go"
text = "Import `net/http/pprof` and serve it on an internal-only port; `go tool pprof` can then pull CPU, heap or goroutine profiles from `/debug/pprof/` on a live service without a redeploy."

[[note]]
level = "professional"
topic = "Go"
text = "Set `GOMEMLIMIT` a little below a Go service's container memory limit; the garbage collector then works harder as usage approaches it, instead of letting the heap grow until the kernel OOM-kills the process."

[[note]]
level = "professional"
topic = "Rust"
text = "Run `cargo deny check` in CI to fail builds on crates with known security advisories, disallowed licenses, banned crates or unexpected sources, all configured in one `deny.toml`."

[[note]]
level = "professional"
topic = "APIs"
text = "Before cutting an API over to a rewritten backend, mirror a sample of production read requests to it and diff the responses; each mismatch is behavior some client may rely on that no spec mentions."

[[note]]
level = "professional"
topic = "Java"
text = "Take three thread dumps a few seconds apart with `jcmd <pid> Thread.print`; threads sitting on the same frame in every dump show where a hung JVM is actually stuck."

[[note]]
level = "professional"
topic = "Data"
text = "Compact the many small files that streaming and frequent batch jobs write into fewer large ones on a schedule. Engines such as Spark and Trino pay a fixed cost to list and open each file, so millions of tiny Parquet files slow every query."

[[note]]
level = "professional"
topic = "C"
text = "Build test and fuzzing binaries with `-fsanitize=address,undefined`; AddressSanitizer and UBSan turn silent memory corruption and undefined behavior into an immediate report with a stack trace."

[[note]]
level = "professional"
topic = "C"
text = "Keep debug info out of shipped binaries but on hand: `objcopy --only-keep-debug app app.debug`, `strip --strip-debug app`, then `objcopy --add-gnu-debuglink=app.debug app`, and archive each build's `.debug` file for core dumps."

[[note]]
level = "professional"
topic = "HTTP"
text = "Check the `Cache-Status` response header (RFC 9211) where your CDN or proxy supports it: each cache in the path reports whether it served a hit or forwarded the request, and often why."

[[note]]
level = "professional"
topic = "APIs"
text = "Give API keys a fixed, recognizable prefix such as `acme_live_`, so secret scanners can find leaked keys reliably and support staff can tell live keys from test keys at a glance."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Run an automated checker such as axe-core against your key pages in CI and fail on new violations; it catches missing labels, low contrast and invalid ARIA before a release does."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Before each major release, walk your critical flows using only the keyboard and then with a screen reader such as VoiceOver or NVDA; automated checks cannot tell you whether a flow is actually usable."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Monitor Certificate Transparency logs for your domains; browsers require publicly trusted certificates to be logged, so you learn about any certificate issued for your names, including ones nobody requested."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Use envelope encryption: encrypt each object with its own data key and store that key wrapped by a KMS key; rotating the master key then means re-wrapping small data keys, not re-encrypting all your data."

[[note]]
level = "professional"
topic = "Architecture"
text = "Replace fixed concurrency limits with adaptive ones that adjust to measured latency, such as Envoy's adaptive concurrency filter or Netflix's concurrency-limits library, so each service finds its own safe capacity as conditions change."

[[note]]
level = "professional"
topic = "Versioning"
text = "Write commit messages in the Conventional Commits format (`feat:`, `fix:`, `feat!:` for breaking changes) and let a release tool derive the next semantic version and the changelog from them."

[[note]]
level = "professional"
topic = "Testing"
text = "Add property-based tests for parsers and serializers with a library such as Hypothesis or fast-check; asserting `decode(encode(x)) == x` over generated inputs finds edge cases nobody wrote down."

[[note]]
level = "professional"
topic = "Testing"
text = "Run integration tests against real databases and brokers started per run with Testcontainers instead of mocks, so queries, migrations and driver behavior are tested the way they run in production."

[[note]]
level = "professional"
topic = "Testing"
text = "Run mutation testing with a tool such as Stryker, PIT or mutmut on critical modules; each surviving mutant marks logic your tests execute but never actually check."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Count distinct values over huge streams with HyperLogLog, such as Redis `PFADD` and `PFCOUNT` or `APPROX_COUNT_DISTINCT` in many SQL warehouses; it needs kilobytes of memory for about 1% error."

[[note]]
level = "professional"
topic = "APIs"
text = "Diff each change's OpenAPI document against the last released version in CI and fail the build on breaking changes, such as a removed field or a newly required parameter, before any client notices."

[[note]]
level = "professional"
topic = "Time"
text = "During an incident, convert a time someone reports in their zone to UTC with GNU `date -u -d 'TZ=\"Asia/Kolkata\" 2025-06-01 14:30'`, which prints 09:00 UTC using that zone's real rules for the date instead of offset math done by hand."

[[note]]
level = "professional"
topic = "Data"
text = "Put automated data quality checks between pipeline stages, such as row counts against the previous run, null rates and key uniqueness, and halt the pipeline when one fails, before bad data reaches dashboards."

[[note]]
level = "professional"
topic = "Regex"
text = "In .NET, build any `Regex` that runs on untrusted input with a `matchTimeout`, such as `TimeSpan.FromMilliseconds(100)`; a pathological match then throws `RegexMatchTimeoutException` instead of pinning a CPU core."

[[note]]
level = "professional"
topic = "Regex"
text = "Validate whole strings in Python with `re.fullmatch` rather than `re.match` and `^...$`: `$` also matches before a trailing newline, so `\"admin\\n\"` passes a check meant to allow only `admin`."

[[note]]
level = "professional"
topic = "Time"
text = "During an incident, read logs with `journalctl --utc` or `-o short-iso`, so every host's entries carry UTC or an explicit offset and line up with other systems instead of each server's local time."

[[note]]
level = "professional"
topic = "Unicode"
text = "Count and truncate user-visible text by grapheme clusters, for example with `Intl.Segmenter` in JavaScript, not by code units; slicing by index can split an emoji or an accented letter in half."

[[note]]
level = "professional"
topic = "Shell"
text = "Run a local script on a remote host without copying it there: `ssh web1 'bash -s' < check.sh` feeds the script to the remote shell, and `ssh web1 'bash -s -- --verbose' < check.sh` also passes it arguments."

[[note]]
level = "professional"
topic = "Time"
text = "When logs from different hosts disagree or short-lived tokens are rejected as not yet valid, check clock sync with `chronyc tracking` or `timedatectl`; a few seconds of skew is enough to cause both."

[[note]]
level = "professional"
topic = "Code review"
text = "Keep pull requests small and stack larger work as a chain of dependent PRs; small diffs get faster and more careful reviews, while a huge one tends to be skimmed and approved."

[[note]]
level = "professional"
topic = "Code review"
text = "Add a pull request template with short sections for risk, rollout plan and rollback, so authors think about deploying the change before a reviewer has to ask."

[[note]]
level = "professional"
topic = "Documentation"
text = "Record significant technical decisions as short ADRs (context, decision, consequences) in the repository; the reasoning survives reorgs and departures, and settled debates stay settled."

[[note]]
level = "professional"
topic = "Documentation"
text = "Give every service repository a README that names the owning team and on-call rotation, links dashboards and runbooks, and shows how to deploy and roll back; responders look there first."

[[note]]
level = "professional"
topic = "Tooling"
text = "Pin language runtimes and CLI tools per repository in a `.tool-versions` file read by asdf or mise, so every engineer and CI job runs the same versions without a setup document."

[[note]]
level = "professional"
topic = "Unicode"
text = "When text arrives garbled, log its raw bytes at each hop, for example with `s.encode('utf-8').hex()` in Python or `xxd`, and find the first layer where they change; judging by how the text looks on screen misleads."

[[note]]
level = "professional"
topic = "Debugging"
text = "See what a hung Python process is doing with `py-spy dump --pid <pid>`; it prints every thread's current stack without restarting or instrumenting the process."

[[note]]
level = "professional"
topic = "Debugging"
text = "On Linux, attach `strace -f -tt -p <pid>` briefly to a stuck process to see which system call it is blocked in, such as a `connect` or `futex` that never returns; tracing slows the process down."

[[note]]
level = "professional"
topic = "Teams"
text = "Have on-call engineers log every manual, repetitive task they perform, then spend part of each sprint automating the most frequent ones; the log turns toil from a vague complaint into a ranked backlog."

[[note]]
level = "professional"
topic = "Teams"
text = "For teams spread across time zones, run a follow-the-sun on-call rotation that hands the pager over at the end of each region's working day, so nobody is routinely woken at night."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Record the exact input data version, such as a snapshot ID or a content hash, with every report or model you produce, so any result can be regenerated later from the same inputs."
