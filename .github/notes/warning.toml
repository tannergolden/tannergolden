# Warning: something to watch for. A pitfall, surprising behavior or common mistake, and how to avoid it.
# 1,000 notes, 250 per level. Drawn by .github/scripts/notes.py; every note
# added makes the rotation longer. No en or em dashes: the script refuses them.

[[note]]
level = "beginner"
topic = "Git"
text = "`.gitignore` only affects files Git is not tracking yet. To stop tracking a file that is already committed, run `git rm --cached <file>` and commit."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "In Jupyter, an event loop is already running, so `asyncio.run(main())` fails with a `RuntimeError`. Write `await main()` directly in the cell instead; notebooks accept top-level `await`."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "With `var`, every callback created in a loop shares one variable, so `for (var i = 0; i < 3; i++) setTimeout(() => console.log(i))` logs `3` three times; declare the counter with `let` to get a fresh `i` on each pass."

[[note]]
level = "beginner"
topic = "Git"
text = "`git branch feature` creates a branch but leaves you on the current one, so your next commits still land there. Use `git switch -c feature` to create the branch and move to it."

[[note]]
level = "beginner"
topic = "Git"
text = "`git merge feature` brings `feature` into the branch you are on, not the other way around. Switch to the branch that should receive the changes before you merge."

[[note]]
level = "beginner"
topic = "Shell"
text = "In interactive Bash and Zsh, `!` triggers history expansion even inside double quotes, so `git commit -m \"Fixed it!!\"` pastes your previous command into the message. Use single quotes around text that contains `!`."

[[note]]
level = "beginner"
topic = "Incidents"
text = "A link shared on a busy site can bring more visitors in an hour than your small server sees in a month, and it slows or crashes just as people arrive. Cache pages or put a CDN in front before you promote a launch."

[[note]]
level = "beginner"
topic = "Git"
text = "Uncommitted changes follow you when you switch branches, as long as they do not conflict. Commit or stash them first, or your work may end up committed on the wrong branch."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "Changes a worker process makes to a global variable stay in that process: with `multiprocessing`, each worker has its own copy of memory, so a global counter in the parent still reads 0 afterward. Return results from the workers instead."

[[note]]
level = "beginner"
topic = "Git"
text = "Git tracks files, not folders, so an empty directory never makes it into a commit. Put a placeholder file inside; `.gitkeep` is a common name, though Git gives it no special meaning."

[[note]]
level = "beginner"
topic = "Git"
text = "On macOS and Windows, renaming `readme.md` to `README.md` in a file manager often goes unnoticed by Git, because those file systems ignore case by default. Use `git mv readme.md README.md` instead."

[[note]]
level = "beginner"
topic = "Git"
text = "Amending a commit you already pushed rewrites it, so a plain `git push` is then rejected. Amend only commits that exist just on your machine; fix pushed ones with a new commit."

[[note]]
level = "beginner"
topic = "Git"
text = "On a new branch, `git push` fails with \"has no upstream branch\" by default. Run `git push -u origin <branch>` the first time; after that, a plain `git push` works."

[[note]]
level = "beginner"
topic = "Git"
text = "`error: src refspec main does not match any` means there is no local branch called `main`: you may have no commits yet, or your branch is named `master`. Commit first, and check the name with `git branch`."

[[note]]
level = "beginner"
topic = "Git"
text = "Conflict markers like `<<<<<<<` do not stop `git add`: Git marks the file resolved even if they are still in it. Search the file for leftover markers before you commit the merge."

[[note]]
level = "beginner"
topic = "Git"
text = "If a new file never shows up in `git status`, an ignore rule is probably hiding it. `git check-ignore -v <file>` prints the matching rule and the file that rule came from."

[[note]]
level = "beginner"
topic = "Git"
text = "Deleting a large file in a later commit does not shrink the repository, because earlier commits still contain it. Keep build output, videos and big datasets out of Git from the start."

[[note]]
level = "beginner"
topic = "Git"
text = "When people on Windows and on macOS or Linux share a repository, line-ending differences can make every line of a file look changed. A `.gitattributes` file containing `* text=auto` lets Git normalize them."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "A string `enum` accepts only its own members, so `paint('red')` is a type error even though `Color.Red` is `'red'` at runtime; if callers should pass plain strings, use a union such as `'red' | 'blue'` instead."

[[note]]
level = "beginner"
topic = "GitHub"
text = "An open pull request follows its branch, so every commit you push there joins it. Push review fixes to the same branch, and start unrelated work on a new one."

[[note]]
level = "beginner"
topic = "GitHub"
text = "`Closes #12` in a pull request description closes the issue only when the pull request is merged into the default branch. Merging it into any other branch leaves the issue open."

[[note]]
level = "beginner"
topic = "GitHub"
text = "A fork does not follow the original repository: new upstream commits never reach it on their own. Sync it with the Sync fork button, or pull from an `upstream` remote, before starting new work."

[[note]]
level = "beginner"
topic = "GitHub"
text = "GitHub does not accept your account password for `git push` over HTTPS. Authenticate with a personal access token, a credential manager or an SSH key instead."

[[note]]
level = "beginner"
topic = "GitHub"
text = "A GitHub Pages project site usually lives under `/repo-name/`, so root-relative links like `/style.css` point outside it and break. Use relative paths such as `style.css` instead."

[[note]]
level = "beginner"
topic = "Shell"
text = "Bash reads the longest possible variable name, so `$file_backup` means the variable `file_backup`, which is usually empty, not `$file` followed by `_backup`. Write `${file}_backup` to mark where the name ends."

[[note]]
level = "beginner"
topic = "Architecture"
text = "On many hosting platforms and in containers, the local disk is wiped on every deploy or restart, so user uploads saved next to your code disappear. Store files in object storage or a database instead."

[[note]]
level = "beginner"
topic = "GitHub"
text = "When you open a pull request from a fork, GitHub may target the original project instead of your fork. Check the base repository and branch at the top of the form before creating it."

[[note]]
level = "beginner"
topic = "Shell"
text = "Bash assignments cannot have spaces around `=`: `name = value` tries to run a command called `name`. Write `name=value`."

[[note]]
level = "beginner"
topic = "Shell"
text = "An unquoted variable is split on spaces, so `cp $file backup/` fails for a file named `my notes.txt`. Wrap variables in double quotes: `cp \"$file\" backup/`."

[[note]]
level = "beginner"
topic = "Shell"
text = "Single quotes stop the shell from expanding variables, so `echo 'Hello $USER'` prints `$USER` literally. Use double quotes when you want the value."

[[note]]
level = "beginner"
topic = "Shell"
text = "Running `./setup.sh` starts a new shell, so any `cd` or `export` inside it is gone when the script ends. Use `source setup.sh` when the script should change your current shell."

[[note]]
level = "beginner"
topic = "Shell"
text = "Closing a terminal window stops the programs started from it, including ones sent to the background with `&`. Start long jobs with `nohup`, or run them inside `tmux` or `screen`, so they survive when the window closes."

[[note]]
level = "beginner"
topic = "Shell"
text = "In Bash, `*` skips hidden files, so `cp -r src/* dest/` leaves out files like `.env` and `.gitignore`. Copy a folder's full contents with `cp -r src/. dest/` instead."

[[note]]
level = "beginner"
topic = "Linux"
text = "`cp -r photos backup` copies the folder as `backup` when `backup` does not exist yet, but as `backup/photos` when it does, so running the same command twice nests a second copy inside the first."

[[note]]
level = "beginner"
topic = "Shell"
text = "Paths with spaces need quotes or escapes: in Bash, `cd My Documents` fails with \"too many arguments\". Write `cd \"My Documents\"` or `cd My\\ Documents`."

[[note]]
level = "beginner"
topic = "Shell"
text = "A `#!/bin/bash` line works only as the very first line of a script, with nothing before it, not even a blank line or a space. Anywhere else, it is just a comment."

[[note]]
level = "beginner"
topic = "Shell"
text = "On Linux and macOS, typing `script.sh` gives \"command not found\" even in the script's own folder, because the current directory is not in `PATH`. Run it as `./script.sh`."

[[note]]
level = "beginner"
topic = "Shell"
text = "`[` is a command, so it needs spaces around it: `if [$x -eq 1]` fails with \"command not found\". Write `if [ \"$x\" -eq 1 ]`."

[[note]]
level = "beginner"
topic = "Linux"
text = "In most Linux terminal windows, `Ctrl+C` stops the running command instead of copying text. Copy with `Ctrl+Shift+C` and paste with `Ctrl+Shift+V`, or select text and middle-click to paste it."

[[note]]
level = "beginner"
topic = "Shell"
text = "A variable set with `name=value` is visible only in the current shell. Programs you start, like `python3 app.py`, see it only after you `export` it."

[[note]]
level = "beginner"
topic = "Shell"
text = "Editing `~/.bashrc` does not change terminals that are already open. Run `source ~/.bashrc`, or open a new terminal, to load the change."

[[note]]
level = "beginner"
topic = "Shell"
text = "A tilde inside quotes stays literal, so `\"~/notes.txt\"` points into a folder named `~` in the current directory. Write `\"$HOME/notes.txt\"` when the path needs quotes."

[[note]]
level = "beginner"
topic = "Shell"
text = "Redirection order matters: `cmd > out.log 2>&1` sends both output and errors to the file, but `cmd 2>&1 > out.log` still prints errors to the terminal."

[[note]]
level = "beginner"
topic = "Shell"
text = "`cd build; make` runs `make` even when `cd` fails, in whatever directory you happen to be in. Join dependent commands with `&&` so the second runs only if the first succeeds."

[[note]]
level = "beginner"
topic = "Shell"
text = "Quote the pattern you pass to `find`: in `find . -name *.txt`, the shell may expand `*.txt` into file names before `find` sees it. Write `find . -name '*.txt'`."

[[note]]
level = "beginner"
topic = "Concurrency"
text = "Threads and async tasks finish in whatever order the scheduler and the network allow, not the order you started them, and it can change from run to run. Collect results with `asyncio.gather` or `executor.map`, which return them in input order."

[[note]]
level = "beginner"
topic = "Releases"
text = "Once a version is published to npm or PyPI, you cannot replace its files, even by deleting the release. Test the package build first, and publish any fix under a new version number."

[[note]]
level = "beginner"
topic = "Linux"
text = "Linux file names are case-sensitive, so `Logo.png` and `logo.png` are different files. A path with the wrong case can work on Windows or macOS and then fail once the code runs on a Linux server."

[[note]]
level = "beginner"
topic = "Linux"
text = "Names that start with a dot, like `.env` or `.git`, are hidden from a plain `ls`. Before concluding a file is missing, list the folder with `ls -a`."

[[note]]
level = "beginner"
topic = "Linux"
text = "`locate` searches a database of file names that is usually rebuilt only once a day, so it misses files created since then and still lists deleted ones. Use `find` for up-to-date results, or run `sudo updatedb` first."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Editor project searches often skip files listed in `.gitignore` and folders such as `node_modules`, so an empty result does not prove the text is absent. Check the search's exclude settings, or confirm with `grep -r`."

[[note]]
level = "beginner"
topic = "Linux"
text = "On Debian and Ubuntu, `sudo apt update` only refreshes the list of available packages and installs nothing. Run `sudo apt upgrade` afterward to actually update your software."

[[note]]
level = "beginner"
topic = "Linux"
text = "In Bash, a backslash is an escape character, not a path separator: `cd docs\\notes` becomes `cd docsnotes` and fails. Use forward slashes on Linux and macOS, as in `cd docs/notes`."

[[note]]
level = "beginner"
topic = "Tooling"
text = "In many terminals, `Ctrl+S` freezes the screen, which looks like a crash: the program keeps running but nothing new appears. Press `Ctrl+Q` to unfreeze it, and add `stty -ixon` to your `~/.bashrc` to turn the behavior off."

[[note]]
level = "beginner"
topic = "Linux"
text = "`sudo echo text > /etc/myapp.conf` fails with \"Permission denied\" because the redirection runs in your own shell, not as root. Use `echo text | sudo tee /etc/myapp.conf` instead."

[[note]]
level = "beginner"
topic = "Linux"
text = "`mv notes.txt backup` renames the file to `backup` when no folder by that name exists. On Linux, write `mv notes.txt backup/`: the trailing slash makes a missing folder an error instead of a rename."

[[note]]
level = "beginner"
topic = "Cloud"
text = "In the AWS console, servers and databases appear only under the region they were created in, so they seem to vanish when the region selector at the top shows another one. Check it before assuming something was deleted."

[[note]]
level = "beginner"
topic = "Linux"
text = "Ctrl+Z does not quit a terminal program; it suspends it, and the paused process keeps holding its files and network ports. Use Ctrl+C to stop it, or `fg` to resume a suspended one."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "`tsc` compiles `.ts` files but does not copy CSS, HTML, images or other assets into `outDir`, so code that loads them by relative path works in development and breaks in the built output; copy them in a separate build step."

[[note]]
level = "beginner"
topic = "Regex"
text = "`grep` reads its pattern as a regular expression, so `grep 'items[0]' app.js` looks for `items0` and misses the text `items[0]`. Add `-F` to search for exactly the characters you typed."

[[note]]
level = "beginner"
topic = "Python"
text = "`\"one two \".split(\" \")` returns `['one', 'two', '']`: splitting on a single space yields empty strings for extra or trailing spaces. Call `split()` with no argument to split on any run of whitespace."

[[note]]
level = "beginner"
topic = "Architecture"
text = "Storing a value that changes over time, such as a person's age, makes it wrong as soon as time passes. Store the fact it comes from, such as the date of birth, and calculate the age when you need it."

[[note]]
level = "beginner"
topic = "Python"
text = "A file named `random.py`, `email.py` or `csv.py` in your project hides the standard library module of that name, causing confusing import errors. Give your own files distinct names."

[[note]]
level = "beginner"
topic = "Python"
text = "`input()` always returns a string, so `input() + 1` raises `TypeError`. Convert it first, with `int(input())` or `float(input())`."

[[note]]
level = "beginner"
topic = "Python"
text = "Removing items from a list while looping over it skips elements, because the positions shift under the loop. Loop over a copy with `for x in items[:]`, or build a new list."

[[note]]
level = "beginner"
topic = "Python"
text = "`list.sort()` sorts in place and returns `None`, so `nums = nums.sort()` throws your list away. Call `nums.sort()` on its own line, or write `nums = sorted(nums)`."

[[note]]
level = "beginner"
topic = "Python"
text = "`b = a` does not copy a list: both names refer to the same list, so changing one changes the other. Use `b = a.copy()` when you need a separate list."

[[note]]
level = "beginner"
topic = "Performance"
text = "A data file takes far more memory once loaded into Python than on disk: every number and string becomes a separate object with its own overhead, so a 1 GB CSV read into lists and dicts can need several gigabytes of RAM."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Adding `maximum-scale=1` or `user-scalable=no` to the viewport meta tag stops people from pinch-zooming your page in browsers that honor it; leave zoom enabled so low-vision users can enlarge text."

[[note]]
level = "beginner"
topic = "Python"
text = "String methods return a new string, so `name.strip()` alone leaves `name` unchanged. Assign the result back: `name = name.strip()`."

[[note]]
level = "beginner"
topic = "Python"
text = "`range(1, 10)` stops at 9: the end value is never included. Write `range(1, 11)` to count from 1 to 10."

[[note]]
level = "beginner"
topic = "Python"
text = "A function that prints its result instead of returning it gives back `None`, so `total = add(2, 3)` stores `None`. Use `return` to hand a value to the caller."

[[note]]
level = "beginner"
topic = "Python"
text = "`if x == 1 or 2:` is always true, because it means `(x == 1) or 2` and `2` counts as true. Write `if x in (1, 2):` instead."

[[note]]
level = "beginner"
topic = "Python"
text = "Assigning to a global variable inside a function makes that name local for the whole function, so reading it earlier raises `UnboundLocalError`. Pass values in as arguments and return results."

[[note]]
level = "beginner"
topic = "Python"
text = "Top-level code in a Python file runs every time the file is imported. Put script-only code under `if __name__ == \"__main__\":` so importing the module does not run it."

[[note]]
level = "beginner"
topic = "Regex"
text = "A regex quantifier repeats only the item right before it, so `ha+` matches all of `haaa` but only the first `ha` of `hahaha`. Put the part you want repeated in a group, as in `(ha)+`."

[[note]]
level = "beginner"
topic = "Python"
text = "`\"test.txt\".rstrip(\".txt\")` returns `\"tes\"`, because the `strip` methods remove any of the given characters, not a suffix. Use `removesuffix(\".txt\")` instead."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "An empty array is truthy in JavaScript, and so is an empty object, so `if (results)` passes even when nothing was found; test `results.length > 0` instead."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`[10, 1, 2].sort()` returns `[1, 10, 2]`, because the default sort compares values as strings. Pass a compare function for numbers: `nums.sort((a, b) => a - b)`."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "In a destructured parameter, `function greet({ name: string })` doesn't type `name`: it renames it to a variable called `string`. Put the type after the pattern: `function greet({ name }: { name: string })`."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`[\"1\", \"2\", \"3\"].map(parseInt)` returns `[1, NaN, NaN]`, because `map` passes each index as the radix argument. Use `.map(Number)` or `.map(s => parseInt(s, 10))`."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`const` prevents reassigning the variable, not changing what it holds: `items.push(4)` still works on a `const items` array. Use `Object.freeze()` if the contents must not change."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "Write `string`, `number` and `boolean` in lowercase in type annotations; the capitalized `String`, `Number` and `Boolean` name wrapper object types, which cause confusing errors when mixed with real primitives."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Form field values are always strings, so `input.value + 1` gives `\"51\"` when the field holds `5`. Convert with `Number(input.value)` before doing math."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "Without `await`, `const res = fetch(url)` gives you a Promise, not a response, so `res.json()` fails. Write `await fetch(url)` inside an `async` function."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`[1, 2] === [1, 2]` is `false`: arrays and objects compare by reference, not by contents. Compare their elements yourself when you need to know if the contents match."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "A `return` with its value on the next line returns `undefined`, because JavaScript inserts a semicolon right after `return`. Start the value on the same line as `return`."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`for...in` over an array loops over its indexes, as strings, not its values. Use `for...of` to loop over the values."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "An arrow function returning an object literal needs parentheses: `() => { id: 1 }` returns `undefined`, while `() => ({ id: 1 })` returns the object."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`setTimeout(update(), 1000)` calls `update` immediately and schedules its return value. Pass the function itself, `setTimeout(update, 1000)`, and do the same for event listeners."

[[note]]
level = "beginner"
topic = "JavaScript"
text = "`count || 10` also replaces `0` and `\"\"` with `10`, because they are falsy. Use `count ?? 10` to fall back only when the value is `null` or `undefined`."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "`const pair = ['id', 42]` is inferred as `(string | number)[]`, not as a tuple, so TypeScript treats `pair[1]` as possibly a string; annotate it as `[string, number]` or add `as const`."

[[note]]
level = "beginner"
topic = "Web"
text = "An HTTPS page cannot load scripts, stylesheets or `fetch` calls over plain `http:` URLs; browsers block them as mixed content, so a feature that worked locally breaks once deployed. Load every resource over HTTPS."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Audio that starts playing on its own talks over screen readers, and users may struggle to find the control that stops it; don't autoplay sound, or put a pause button at the very start of the page."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Links that open a new tab without saying so disorient screen reader and magnifier users, whose Back button then does nothing; say so in the link text, or keep ordinary links in the same tab."

[[note]]
level = "beginner"
topic = "HTTP"
text = "A `204 No Content` response has an empty body, so `await response.json()` on it throws a parse error; check `response.status` before reading the body."

[[note]]
level = "beginner"
topic = "TypeScript"
text = "The `!` in `input!.value` only tells the compiler the value is not `null`; if it is, your code still crashes at runtime. Check for `null` instead of asserting it away."

[[note]]
level = "beginner"
topic = "HTTP"
text = "`localhost` and `127.0.0.1` count as different sites to a browser, so cookies and `localStorage` saved on one are missing on the other, and a CORS rule for one doesn't cover the other."

[[note]]
level = "beginner"
topic = "APIs"
text = "JSON keys are case-sensitive, so reading `data.userid` when the API sends `userId` quietly gives `undefined` instead of an error; copy field names exactly from a real response."

[[note]]
level = "beginner"
topic = "Go"
text = "Go refuses to compile a program with an unused variable or import. Delete it, or write `_ = x` for a variable you will use later."

[[note]]
level = "beginner"
topic = "Observability"
text = "A log file your app keeps appending to grows until the disk fills and the app crashes. Rotate logs with `logrotate` or a rotating handler such as Python's `logging.handlers.RotatingFileHandler`."

[[note]]
level = "beginner"
topic = "Go"
text = "Go deliberately varies map iteration order, so output built by ranging over a map can change between runs. Sort the keys first when you need a stable order."

[[note]]
level = "beginner"
topic = "Performance"
text = "Adding rows to a pandas DataFrame one at a time with `pd.concat` inside a loop copies the whole frame on every pass, so the loop gets slower as it grows. Collect the rows in a list and build the DataFrame once at the end."

[[note]]
level = "beginner"
topic = "Go"
text = "`x := 2` inside an `if` or `for` block declares a new `x` that hides the outer one, so the outer value never changes. Use `x = 2` to assign to the existing variable."

[[note]]
level = "beginner"
topic = "Go"
text = "In `for i, v := range items`, `v` is a copy of each element, so changing `v` leaves the slice untouched. Assign through the index instead: `items[i] = newValue`."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Content that flashes more than three times per second can trigger seizures in people with photosensitive epilepsy; keep animations, GIFs and videos below that rate, or avoid flashing altogether."

[[note]]
level = "beginner"
topic = "Rust"
text = "`unwrap()` panics when the value is `None` or an `Err`, crashing your program. Handle both cases with `match`, `if let` or the `?` operator wherever bad input is possible."

[[note]]
level = "beginner"
topic = "Rust"
text = "Rust does not let you index a `String` with `s[0]`, because one character can take several bytes. Use `s.chars().next()` or `s.chars().nth(i)` to get characters."

[[note]]
level = "beginner"
topic = "Rust"
text = "Assigning a `String` to another variable moves it: after `let b = a;`, using `a` is a compile error. Borrow it with `&a`, or call `a.clone()` if you really need two copies."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Text pasted from web pages or chat apps can carry invisible characters such as a zero-width space, so two strings that look identical compare unequal. In Python, `print(repr(s))` reveals them as escapes like `\\u200b`."

[[note]]
level = "beginner"
topic = "Java"
text = "`Scanner.nextInt()` leaves the newline in the input, so the next `nextLine()` returns an empty string. Call `nextLine()` once more to consume it, or read every line with `nextLine()` and parse it."

[[note]]
level = "beginner"
topic = "Java"
text = "Java's `String.split` takes a regular expression, so `\"a.b.c\".split(\".\")` returns an empty array: `.` matches every character. Escape it as `split(\"\\\\.\")` to split on a literal dot."

[[note]]
level = "beginner"
topic = "Java"
text = "`javac` rejects a public class whose name does not match its file: `public class Main` must be saved as `Main.java`, with the same capitalization."

[[note]]
level = "beginner"
topic = "Java"
text = "Adding two `char` values gives an `int`: `'a' + 'b'` is `195`, not `\"ab\"`. Start with a string, as in `\"\" + 'a' + 'b'`, when you want text."

[[note]]
level = "beginner"
topic = "Java"
text = "In a classic `switch` statement, a `case` without `break` falls through and runs the next case too. End each case with `break`, or use the arrow form `case X ->`, which never falls through."

[[note]]
level = "beginner"
topic = "Java"
text = "`Arrays.asList(...)` and `List.of(...)` return lists you cannot grow, so `add` throws `UnsupportedOperationException`. Copy them into `new ArrayList<>(...)` when you need to add or remove items."

[[note]]
level = "beginner"
topic = "C"
text = "`if (x = 5)` assigns 5 to `x` and is always true. Use `==` to compare, and compile with `gcc -Wall`, which warns about assignments used as conditions."

[[note]]
level = "beginner"
topic = "C"
text = "`char s[5] = \"hello\";` is valid C but leaves no room for the terminating `\\0`, so string functions read past the end. Write `char s[] = \"hello\";` and let the compiler size it."

[[note]]
level = "beginner"
topic = "C"
text = "`scanf(\"%d\", n)` passes the value of `n` instead of its address, which can crash or corrupt memory. Write `scanf(\"%d\", &n)`, and compile with `-Wall` so format mistakes are flagged."

[[note]]
level = "beginner"
topic = "C"
text = "Local variables in C start with whatever was left in memory, not zero. Initialize every variable when you declare it, as in `int count = 0;`."

[[note]]
level = "beginner"
topic = "C"
text = "C does not check array bounds: writing to `arr[10]` in a 10-element array can silently overwrite other variables. Loop with `i < 10`, not `i <= 10`."

[[note]]
level = "beginner"
topic = "C"
text = "A stray semicolon in `if (x > 0);` ends the `if` right there, so the block below always runs. Compile with `-Wextra`, which warns about the empty body."

[[note]]
level = "beginner"
topic = "C"
text = "`fgets` keeps the newline in the buffer, so `strcmp(buf, \"yes\")` fails after the user types `yes`. Strip it first with `buf[strcspn(buf, \"\\n\")] = '\\0';`."

[[note]]
level = "beginner"
topic = "SQL"
text = "`WHERE email = NULL` never matches, because any comparison with `NULL` gives unknown rather than true. Use `WHERE email IS NULL` instead."

[[note]]
level = "beginner"
topic = "SQL"
text = "`COUNT(column)` skips rows where that column is `NULL`, while `COUNT(*)` counts every row. Pick the one that answers your actual question."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "A naive recursive Fibonacci, `fib(n - 1) + fib(n - 2)`, recomputes the same values over and over, so its running time grows exponentially and `fib(40)` makes hundreds of millions of calls. Use a loop, or cache the results."

[[note]]
level = "beginner"
topic = "SQL"
text = "In PostgreSQL, double quotes mark a column or table name, so `WHERE name = \"Ana\"` looks for a column called `Ana`. Put text values in single quotes: `'Ana'`."

[[note]]
level = "beginner"
topic = "SQL"
text = "In PostgreSQL and SQLite, dividing two integers drops the remainder: `SELECT 1 / 2` returns `0`. Write `1.0 / 2`, or cast one side to a decimal type, when you need a fraction."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Sorting strings compares character codes, so every uppercase letter comes before every lowercase one (`'Zebra'` before `'apple'`) and `'item10'` sorts before `'item9'`. Sort with `key=str.lower`, or a natural sort for embedded numbers."

[[note]]
level = "beginner"
topic = "SQL"
text = "`AND` binds tighter than `OR`, so `WHERE a = 1 OR b = 2 AND c = 3` means `a = 1 OR (b = 2 AND c = 3)`. Add parentheses to make the grouping explicit."

[[note]]
level = "beginner"
topic = "SQL"
text = "`SELECT DISTINCT city, name` removes only rows where both columns repeat, not repeated cities. `DISTINCT` always applies to the whole selected row."

[[note]]
level = "beginner"
topic = "SQL"
text = "Arithmetic with `NULL` gives `NULL`, so `price + tax` is `NULL` whenever `tax` is missing. Use `COALESCE(tax, 0)` when a missing value should count as zero."

[[note]]
level = "beginner"
topic = "SQL"
text = "`UNION` removes duplicate rows from the combined result, which can silently drop data you meant to keep. Use `UNION ALL` to keep every row."

[[note]]
level = "beginner"
topic = "SQL"
text = "A single quote inside a SQL string must be doubled, as in `'O''Brien'`. Better yet, pass values as query parameters and let the database driver handle the quoting."

[[note]]
level = "beginner"
topic = "Data"
text = "Values that look identical can differ by case or stray spaces, so `'Paris'`, `'paris'` and `'Paris '` count as three cities and joins between them fail. Strip and normalize text columns when you load the data."

[[note]]
level = "beginner"
topic = "Databases"
text = "By default, SQLite lets you store text in an `INTEGER` column without any error. Check values in your code before inserting them, rather than relying on declared column types."

[[note]]
level = "beginner"
topic = "Databases"
text = "Auto-increment IDs are not a row count: deleted rows and failed inserts can leave gaps. Use `COUNT(*)` to count rows, and let the database assign new IDs instead of computing `MAX(id) + 1`."

[[note]]
level = "beginner"
topic = "Databases"
text = "Python's `sqlite3` module opens a transaction before an `INSERT` or `UPDATE`, and closing the connection without `conn.commit()` discards those changes. Commit, or use `with conn:` to commit automatically."

[[note]]
level = "beginner"
topic = "Databases"
text = "`LIKE` is case-sensitive in PostgreSQL but case-insensitive in MySQL's default setup and, for ASCII letters, in SQLite. In PostgreSQL, use `ILIKE` for case-insensitive matching."

[[note]]
level = "beginner"
topic = "Databases"
text = "Storing several values in one column, like `'red,green,blue'`, makes them hard to search, count or update. Put each value in its own row of a related table."

[[note]]
level = "beginner"
topic = "HTTP"
text = "`fetch` rejects only on network failures; a 404 or 500 response still resolves normally. Check `response.ok` before using the body."

[[note]]
level = "beginner"
topic = "Data"
text = "A rise from 10% to 15% is 5 percentage points but a 50% increase. Say which one you mean in reports and charts; mixing them up makes a change look ten times smaller or bigger than it was."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Values in a query string must be URL-encoded: a raw `&` or `#` inside a value cuts it short. Build URLs with `URLSearchParams` or `encodeURIComponent()`."

[[note]]
level = "beginner"
topic = "HTTP"
text = "The part of a URL after `#` is never sent to the server, so server code cannot read it. Use a query parameter for data the server needs."

[[note]]
level = "beginner"
topic = "HTTP"
text = "When sending JSON with `fetch`, pass `JSON.stringify(data)` as the body and set a `Content-Type: application/json` header. A plain object body is sent as the text `[object Object]`."

[[note]]
level = "beginner"
topic = "Observability"
text = "Showing raw error messages or stack traces to your users reveals file paths and library versions and confuses them. Show a friendly message with an error ID, and log the details with that ID on the server."

[[note]]
level = "beginner"
topic = "HTTP"
text = "Browsers cache a 301 redirect, often for a long time, so a mistaken one keeps redirecting visitors after you fix the server. Test new redirects as 302 until you are sure."

[[note]]
level = "beginner"
topic = "APIs"
text = "Large numeric IDs in JSON can exceed JavaScript's safe integer range and silently change when parsed: `9007199254740993` becomes `9007199254740992`. Use the string form of an ID when an API offers one."

[[note]]
level = "beginner"
topic = "APIs"
text = "Many APIs return lists one page at a time, so a single request may hold only the first page of results. Follow the API's pagination parameters or `Link` header until no pages remain."

[[note]]
level = "beginner"
topic = "APIs"
text = "HTTP status 429 means you are sending requests too fast. Slow down, and wait as long as the `Retry-After` header says when the API sends one, instead of retrying in a tight loop."

[[note]]
level = "beginner"
topic = "APIs"
text = "Some APIs, GraphQL servers in particular, report errors in the response body with a 200 status. Check the body for an `errors` field instead of trusting the status code alone."

[[note]]
level = "beginner"
topic = "Web"
text = "A `<script>` in the `<head>` runs before the page body exists, so `document.querySelector` returns `null`. Put the script at the end of `<body>`, or add `defer` to a script loaded with `src` (it does nothing on inline scripts)."

[[note]]
level = "beginner"
topic = "Web"
text = "If your CSS or JavaScript changes do not show up, the browser may be using a cached copy. In Chrome or Firefox, force a full reload with Ctrl+Shift+R (Cmd+Shift+R on macOS)."

[[note]]
level = "beginner"
topic = "Data"
text = "Placeholder values such as `0`, `-1` or `999` for missing data get summed and averaged as if they were real measurements, quietly skewing results. Store missing values as empty or `NULL`, and handle them explicitly."

[[note]]
level = "beginner"
topic = "Web"
text = "By default, CSS `width` does not include padding or border, so a `width: 100%` element with padding overflows its parent. Set `box-sizing: border-box` so they are included."

[[note]]
level = "beginner"
topic = "Web"
text = "Without `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">`, phones show your page as a zoomed-out desktop layout. Put it in the `<head>` of every page."

[[note]]
level = "beginner"
topic = "Web"
text = "Many browsers block module scripts and `fetch` on pages opened straight from disk (`file://`). Serve the folder over HTTP during development, for example with `python3 -m http.server`."

[[note]]
level = "beginner"
topic = "Web"
text = "A CORS error means the browser refused to let your page read a response from another origin. The fix is on the server, which must send the right headers; changing your `fetch` call cannot fix it."

[[note]]
level = "beginner"
topic = "Web"
text = "`localStorage` stores only strings, so saving an object stores `\"[object Object]\"`. Save `JSON.stringify(obj)` and read it back with `JSON.parse`."

[[note]]
level = "beginner"
topic = "Web"
text = "A relative URL inside a CSS file, like `url(img/bg.png)`, is resolved from the CSS file's location, not the page's. Adjust paths when your stylesheet lives in a subfolder."

[[note]]
level = "beginner"
topic = "Networking"
text = "An IP address starting with `169.254` means your computer got no address from the network's DHCP server and gave itself one that cannot reach the internet. Check the cable, the Wi-Fi connection or the router before debugging anything else."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "A clickable `<div>` cannot be reached with the Tab key or triggered with Enter, so keyboard users cannot use it. Use a real `<button>` for actions and a link for navigation."

[[note]]
level = "beginner"
topic = "HTTP"
text = "`fetch` throws a `TypeError` when you give a `GET` request a body, and servers or proxies that receive one may drop it; send filters as query parameters, or use `POST` when they don't fit in a URL."

[[note]]
level = "beginner"
topic = "Accessibility"
text = "Color alone does not reach everyone: a red border on an invalid field can be invisible to color-blind users. Add text as well, such as an error message next to the field."

[[note]]
level = "beginner"
topic = "Data"
text = "On Windows, a file open in Excel is locked, so a script that tries to overwrite or delete it fails with a permission error. Close the file in Excel first, or have the script write to a new file name."

[[note]]
level = "beginner"
topic = "Security"
text = "Checks in the browser, like form validation or a hidden admin button, are only for convenience: anyone can send requests to your server directly. Repeat every validation and permission check on the server."

[[note]]
level = "beginner"
topic = "Time"
text = "A loop that runs a task and then calls `sleep 60` drifts later every round, because the task's own run time adds to each minute. Use cron or a timer when a job must start on the minute."

[[note]]
level = "beginner"
topic = "Security"
text = "Passing user input to `eval()` in Python or JavaScript lets that user run any code in your program. Parse it with `int()`, `float()`, `json.loads()` or `JSON.parse()` instead."

[[note]]
level = "beginner"
topic = "Security"
text = "`chmod 777` makes a permission error go away by letting every user on the system change the file. Fix the owner with `chown`, or grant only what is needed, such as `chmod 644`."

[[note]]
level = "beginner"
topic = "Security"
text = "A password typed as a command argument, like `mysql -pSecret`, is saved in your shell history. Use `-p` on its own so the tool prompts for it."

[[note]]
level = "beginner"
topic = "DNS"
text = "A DNS record cannot point at a page or a path such as `example.com/blog`; it only maps names to addresses or to other names. To send visitors to a specific page, set up a redirect on a web server or at your host."

[[note]]
level = "beginner"
topic = "Databases"
text = "Changing a model class in Django or a similar ORM does not change the database table. Until you create and apply a migration, as with `python manage.py makemigrations` and then `migrate`, queries fail with missing-column errors."

[[note]]
level = "beginner"
topic = "APIs"
text = "A `fetch` response body can be read only once, so calling `response.json()` after `response.text()` throws a `TypeError`; read it once into a variable, or call `response.clone()` before the first read."

[[note]]
level = "beginner"
topic = "Time"
text = "`EST` means UTC-5 all year, so a summer meeting set for 9:00 EST is really 10:00 in New York, which is on EDT then. Write `ET`, a city name or an IANA zone such as `America/New_York` when you mean local time."

[[note]]
level = "beginner"
topic = "DNS"
text = "On a VPN or office network your computer may ask a company DNS server, which can answer differently from the public one, so a site works at home and fails at work. Compare `dig app.example.com` with `dig @1.1.1.1 app.example.com`."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "Committing `node_modules` bloats your repository with thousands of files that `npm install` can recreate, some built for your platform only. Add it to `.gitignore` before your first commit."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "`pip freeze > requirements.txt` run outside a virtual environment lists every package installed on your system, not just your project's. Create a virtual environment for each project first."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "The name you install is not always the name you import: `pip install Pillow` gives you `import PIL`, and `beautifulsoup4` gives `import bs4`. Check the package docs for the import name."

[[note]]
level = "beginner"
topic = "Databases"
text = "A password containing characters such as `@`, `:` or `/` breaks a database URL like `postgresql://user:pass@host/db`, because those characters have meaning in URLs. Percent-encode them, so `@` becomes `%40`."

[[note]]
level = "beginner"
topic = "Dependencies"
text = "If the current folder has no `package.json`, `npm install <pkg>` walks up the tree and may install into a parent folder that has one or a `node_modules` folder. Run `npm init` in your project first."

[[note]]
level = "beginner"
topic = "Versioning"
text = "Version numbers are not decimals: `1.10.0` is newer than `1.9.0`. Compare each part as a number, never the whole version as a string or a float."

[[note]]
level = "beginner"
topic = "Versioning"
text = "A caret range like `^1.2.3` in `package.json` accepts any later `1.x` release, so two installs can end up with different versions. Commit `package-lock.json` so everyone gets the same ones."

[[note]]
level = "beginner"
topic = "Testing"
text = "Wrapping test code in `try` and `except` so it cannot crash also stops it from failing: the assertion error gets caught and the test passes. Let exceptions propagate, or use `pytest.raises` when you expect one."

[[note]]
level = "beginner"
topic = "Testing"
text = "pytest only collects files named `test_*.py` or `*_test.py`, and functions whose names start with `test`. A test in `check_math.py` never runs, and nothing warns you."

[[note]]
level = "beginner"
topic = "Testing"
text = "A test that only prints a value passes no matter what it prints. Assert the expected result, so the test fails when the code breaks."

[[note]]
level = "beginner"
topic = "Testing"
text = "Remove `.only` before committing: `test.only` or `it.only` in Jest or Mocha runs just the marked tests and skips the rest without failing."

[[note]]
level = "beginner"
topic = "Observability"
text = "An uptime check that only loads your home page can stay green while sign-up or checkout is broken. Check each page or API that matters, and look for expected text in the response, not just a `200` status."

[[note]]
level = "beginner"
topic = "Testing"
text = "A test that uses the real current date can pass today and fail next month or at year end. Pass the date in as a parameter, or fix it in the test."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Naming a function without parentheses, as in `main` instead of `main()`, does not call it, and Python raises no error, so the program quietly does nothing. Make sure every call includes its parentheses."

[[note]]
level = "beginner"
topic = "Debugging"
text = "An empty handler such as `catch (e) {}` in JavaScript or `except Exception: pass` in Python hides the error, so the program fails later somewhere unrelated. Log the exception, or let it propagate."

[[note]]
level = "beginner"
topic = "Debugging"
text = "The DevTools console and Network tab are cleared whenever the page navigates, so an error logged just before a form submit or redirect vanishes before you can read it. Turn on Preserve log (Persist Logs in Firefox) to keep it."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Errors from bundled JavaScript point to lines in the generated bundle, such as `index-3f2a.js:1`, instead of your source files. Turn on source maps in your build tool so DevTools shows your original code."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Many programs read `.env` files and environment variables only once, at startup, so an edit to `.env` may do nothing until you restart the server or program."

[[note]]
level = "beginner"
topic = "Debugging"
text = "Printing a caught exception with `print(e)` shows only its message, which for a `KeyError` is just the missing key, like `'name'`, with no type or line number. Use `traceback.print_exc()`, or re-raise, to see the full traceback."

[[note]]
level = "beginner"
topic = "Regex"
text = "Regular expressions are not shell wildcards: in `grep 'file*.txt'`, the `*` repeats the `e` and the `.` matches any one character, so `file1.txt` does not match at all. Write `grep 'file.*\\.txt'` for what the wildcard meant."

[[note]]
level = "beginner"
topic = "Regex"
text = "The character range `[A-z]` is not just letters: between `Z` and `a` sit symbols such as `[`, `^` and `_`, so they match too. Write `[A-Za-z]` for ASCII letters."

[[note]]
level = "beginner"
topic = "Regex"
text = "Python's `re.match` only looks for a match at the start of the string, so `re.match('cat', 'concat')` returns `None`. Use `re.search` to find a match anywhere in the string."

[[note]]
level = "beginner"
topic = "Regex"
text = "Regular expressions are case-sensitive by default, so `re.search('error', line)` misses `ERROR` and `grep error` misses `Error`. Add `re.IGNORECASE` in Python, the `i` flag in JavaScript or `-i` in `grep` when case should not matter."

[[note]]
level = "beginner"
topic = "Regex"
text = "Alternation has the lowest precedence in a regex, so `^cat|dog$` means `^cat` or `dog$` and also matches `cat food` and `hotdog`. Group the choices, as in `^(cat|dog)$`, when the anchors should apply to both."

[[note]]
level = "beginner"
topic = "Unicode"
text = "A limit measured in bytes can reject text that looks short enough, because in UTF-8 a character such as `é` takes 2 bytes and `€` takes 3. Check `len(s.encode('utf-8'))` in Python when a byte limit applies."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Reversing a string with `s[::-1]` reverses code points, so an accent stored as a separate combining mark lands on the wrong letter, and emoji built from several code points fall apart. Reverse user-visible text only with a grapheme-aware library."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Code copied from web pages, documents or chat apps can contain look-alike characters, such as curly quotes or a no-break space, which Python reports as an `invalid character` or `invalid non-printable character`. Retype the line to replace them."

[[note]]
level = "beginner"
topic = "Unicode"
text = "Validating names with a pattern like `^[A-Za-z]+$` rejects real people, such as `José`, `Zoë` or `O'Brien`. Accept letters from any language, plus spaces, hyphens and apostrophes, or skip strict name validation altogether."

[[note]]
level = "beginner"
topic = "Time"
text = "Parsing a two-digit year makes the library guess the century: Python's `%y` turns `45` into 2045 but `70` into 1970. Ask for four-digit years, and store them that way."

[[note]]
level = "beginner"
topic = "Time"
text = "Cron runs jobs in the server's time zone, which is often UTC, so `0 9 * * *` may fire at 9:00 UTC instead of 9:00 where you live. Check the server's zone with `date` or `timedatectl` before scheduling."

[[note]]
level = "beginner"
topic = "Time"
text = "Adding a year by changing only the year fails for February 29: in Python, `date(2024, 2, 29).replace(year=2025)` raises `ValueError`. Decide what the date should become, such as February 28, and handle that case explicitly."

[[note]]
level = "beginner"
topic = "Time"
text = "In Python's `strftime`, `%m` is the month and `%M` is the minute, so `'%Y-%M-%d'` silently puts the minute where the month belongs. Double-check the case of every format code."

[[note]]
level = "beginner"
topic = "Time"
text = "Dates stored as text like `MM/DD/YYYY` do not sort or compare correctly: `'10/01/2024' < '9/30/2024'` is true, because strings compare character by character. Parse them into dates, or store them as `YYYY-MM-DD`."

[[note]]
level = "beginner"
topic = "Data"
text = "Averaging averages gives the wrong result when groups differ in size: a class of 2 averaging 90 and a class of 30 averaging 60 average about 61.9 together, not 75. Divide the sum of all values by the total count."

[[note]]
level = "beginner"
topic = "Data"
text = "Reading CSV columns by position, as in `row[2]`, breaks silently when someone adds or reorders a column. Read rows with `csv.DictReader` and look fields up by their header names instead."

[[note]]
level = "beginner"
topic = "Data"
text = "On Windows, writing a CSV with Python's `csv` module puts a blank line between rows unless you open the file with `newline=''`, as in `open('out.csv', 'w', newline='')`, which the `csv` docs ask for on every platform."

[[note]]
level = "beginner"
topic = "Data"
text = "CSV files saved with many European regional settings use `;` between fields and `,` as the decimal mark, so `3,5` means three and a half. Check the delimiter before you parse the file."

[[note]]
level = "beginner"
topic = "Data"
text = "When a JSON object repeats a key, as in `{\"id\": 1, \"id\": 2}`, both Python's `json.loads` and JavaScript's `JSON.parse` silently keep the last value. Check generated or merged JSON for duplicate keys, since the parser will not complain."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Running a program while your editor still has unsaved changes runs the old version on disk, which makes a fix look like it failed. Save first, or turn on auto save."

[[note]]
level = "beginner"
topic = "Tooling"
text = "VS Code can run a different Python than your terminal, so a package you installed looks missing. Run Python: Select Interpreter and pick the interpreter inside your project's virtual environment."

[[note]]
level = "beginner"
topic = "Tooling"
text = "Mixing tabs and spaces in Python indentation can raise `TabError`, and YAML does not allow tabs for indentation at all. Set your editor to insert spaces when you press Tab."

[[note]]
level = "beginner"
topic = "Tooling"
text = "A formatter or editor setting you did not notice can rewrite whole files, so your commit shows hundreds of changed lines and the real fix gets lost. Check `git diff` before committing."

[[note]]
level = "beginner"
topic = "Tooling"
text = "A globally installed tool, such as one from `npm install -g`, can be a different version from the one your project lists, so it behaves differently from your teammates' copy. Run the project's version with `npx <tool>` or an npm script."

[[note]]
level = "beginner"
topic = "Networking"
text = "`localhost` always means the computer the browser runs on, so a `localhost:3000` link you send a teammate opens their own machine, not your server. Share your machine's network address, or deploy the app somewhere reachable."

[[note]]
level = "beginner"
topic = "Networking"
text = "On Linux, only root can listen on ports below 1024 by default, so starting a server on port 80 fails with a permission error such as `EACCES`. Use a port like 8080 while developing."

[[note]]
level = "beginner"
topic = "Networking"
text = "Requesting a plain HTTP dev server over HTTPS fails with confusing TLS errors, such as `wrong version number` from curl, that look like certificate trouble but only mean the scheme is wrong. Check which one the server actually speaks."

[[note]]
level = "beginner"
topic = "Networking"
text = "A failed `ping` does not prove a server is down: many servers and cloud firewalls block ping while their web traffic works fine. Test the service you care about, for example with `curl`."

[[note]]
level = "beginner"
topic = "DNS"
text = "A domain and its `www` subdomain are separate DNS names, so a record for `example.com` does nothing for the `www` name. Create a record, often a `CNAME`, for each name people might type."

[[note]]
level = "beginner"
topic = "DNS"
text = "Do not make up domain names for local testing: `.dev` and `.app` are real top-level domains that browsers load only over HTTPS. Use `localhost`, or names ending in `.test`, which is reserved for testing."

[[note]]
level = "beginner"
topic = "Containers"
text = "On Linux, files a container creates in a mounted folder are often owned by root, so you cannot edit or delete them afterwards without `sudo`. Run the container as yourself with `--user \"$(id -u):$(id -g)\"`."

[[note]]
level = "beginner"
topic = "Databases"
text = "`sqlite3.connect('app.db')` resolves the file name from the current working directory and creates the file if it is missing, so running the script from another folder silently starts an empty database. Build the path from `__file__`."

[[note]]
level = "beginner"
topic = "Containers"
text = "A container runs the code that was copied in when its image was built, so editing files on your machine changes nothing inside it. Rebuild with `docker compose up --build`, or mount your folder as a volume while developing."

[[note]]
level = "beginner"
topic = "Containers"
text = "In `docker run -p 8080:80`, the first number is the port on your computer and the second is the port inside the container. Swapping them leaves the app unreachable."

[[note]]
level = "beginner"
topic = "Containers"
text = "A Dockerfile can only `COPY` files from inside the build context, the folder you pass to `docker build`, so `COPY ../shared ./shared` fails. Build from the parent folder instead, pointing at the Dockerfile with `-f`."

[[note]]
level = "beginner"
topic = "CI"
text = "Your CI configuration sets its own language version, which can differ from the one on your machine, so code using a newer Python or Node feature passes locally and fails in CI. Keep the two versions in sync."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "In GitHub Actions, `github.ref` holds the full name, such as `refs/heads/main`, so `if: github.ref == 'main'` never matches. Compare with `refs/heads/main`, or use `github.ref_name`, which holds just `main`."

[[note]]
level = "beginner"
topic = "APIs"
text = "JSON allows no comments and no trailing commas, so `{\"id\": 1,}` fails to parse; files that accept them, such as VS Code's settings, use a relaxed variant, not standard JSON."

[[note]]
level = "beginner"
topic = "GitHub Actions"
text = "Several commands under `run:` need a literal block, as in `run: |` with the commands on the lines below; without the `|`, YAML folds the lines together, so `npm ci` and `npm test` become the single command `npm ci npm test`."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "A recursive function whose base case is missing or never reached keeps calling itself until the program crashes, with `RecursionError` in Python. Make sure every call moves closer to the base case."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "Binary search only works on sorted data: on an unsorted list it returns wrong answers without raising any error. Sort the list first, or use a plain linear search."

[[note]]
level = "beginner"
topic = "Algorithms"
text = "`max()` and `min()` raise `ValueError` on an empty list, and `sum(xs) / len(xs)` raises `ZeroDivisionError`, so code that worked on sample data crashes on the first empty input. Check for the empty case, or pass `default=` to `max` and `min`."

[[note]]
level = "beginner"
topic = "Performance"
text = "Calling `f.read()` or `f.readlines()` on a huge file loads all of it into memory at once. Loop over the file object, as in `for line in f:`, to process one line at a time."

[[note]]
level = "beginner"
topic = "Performance"
text = "Printing on every pass of a loop that runs millions of times can make a program many times slower, because writing to the terminal is slow. Print a progress line every few thousand items, or a summary at the end."

[[note]]
level = "beginner"
topic = "Documentation"
text = "Replace placeholders from documentation, such as `<username>`, together with their angle brackets: the shell reads `<` and `>` as redirections, so the pasted command fails with a missing-file or syntax error."

[[note]]
level = "beginner"
topic = "Documentation"
text = "In a Markdown file such as `README.md`, a single line break inside a paragraph renders as a space, so lines you typed separately run together. Leave a blank line between paragraphs, or end a line with a backslash to force a break."

[[note]]
level = "beginner"
topic = "Code review"
text = "A green CI check only means the existing tests passed; if a pull request adds behavior without tests of its own, nothing has checked that behavior. Look for new or changed tests in the diff before approving."

[[note]]
level = "beginner"
topic = "Testing"
text = "In Jest, `expect({ id: 1 }).toBe({ id: 1 })` fails, because `toBe` checks that both sides are the very same object. Use `toEqual` to compare the contents of objects and arrays."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "An absolute path like `/home/ana/project/data.csv` in your code works only on your machine. Build paths relative to the project, for example from the script's own location."

[[note]]
level = "beginner"
topic = "Reproducibility"
text = "Jupyter notebooks keep variables from cells you ran earlier, even ones you have since edited or deleted, so a notebook can work for you and fail for anyone else. Restart the kernel and run all cells before sharing it."

[[note]]
level = "beginner"
topic = "Observability"
text = "A log message such as `Something went wrong` cannot be acted on when you read it later. Include what failed and the values involved, as in `failed to save order 42: disk full`."

[[note]]
level = "beginner"
topic = "SQL"
text = "String ranges in SQL compare whole values, so `WHERE name BETWEEN 'A' AND 'C'` misses `'Carol'`, which sorts after `'C'`. For names starting with A through C, write `name >= 'A' AND name < 'D'`."

[[note]]
level = "beginner"
topic = "Java"
text = "A Java `int` tops out at 2,147,483,647 and silently wraps to a negative number past it: `30 * 24 * 60 * 60 * 1000` gives `-1702967296`. Use `long`, as in `30L * 24 * 60 * 60 * 1000`."

[[note]]
level = "beginner"
topic = "Cloud"
text = "A server on a cloud virtual machine can be unreachable even though it is running, because the provider's firewall, such as an AWS security group, blocks incoming traffic by default. Open only the port you need."

[[note]]
level = "beginner"
topic = "Shell"
text = "Tutorials often show commands with a leading `$` for the prompt; copying the `$` too makes the shell report that a command named `$` was not found. Copy only the text after the prompt."

[[note]]
level = "beginner"
topic = "Debugging"
text = "The line that crashes is often not where the bug is: a missing or wrong value usually came from somewhere earlier. Trace the value back to where it was created instead of adding a check at the crash site."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "A tag like `@v4` can be moved to different code by its owner at any time. Pin third-party actions to a full commit SHA."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "A required check from a workflow skipped by a `paths` filter never reports, so the pull request waits forever. Keep required workflows unfiltered and skip the work with a job-level `if:` instead, since a skipped job counts as passing."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "By default, `pull_request` workflows for PRs from forks get no repository secrets and a read-only `GITHUB_TOKEN`. A step that needs a secret sees an empty string there, so skip it for forks or run it after merge."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Workflows triggered by Dependabot get a read-only `GITHUB_TOKEN` by default and can't read Actions secrets, only Dependabot secrets. Store what they need as Dependabot secrets, or the job fails only on dependency updates."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`exit` in a file that you `source` closes your interactive shell, because the file runs inside it rather than in a child process. Use `return` to leave a sourced file early."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "A `schedule` trigger only fires from the workflow file on the default branch, and `workflow_dispatch` works only once the file exists there. Adding either on a feature branch does nothing until it merges."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "The `secrets` context isn't available in `if:` conditions. Copy the secret into a job-level `env` variable and test `env.MY_SECRET != ''` instead."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Storing a running total, such as an order count on the customer row, next to the rows it summarizes lets the two drift apart after a failed write or a bug. Update both in one transaction, or recompute the total from the source rows."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Every `run` step starts a new shell, so `export` and `cd` don't carry over to the next step. Append `NAME=value` to the file in `$GITHUB_ENV` for later steps, and use `working-directory` instead of `cd`."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Without a `shell:` key, Linux and macOS `run` steps use `bash -e` without `pipefail`, so `npm test | tee test.log` passes even when tests fail. Set `shell: bash`, which adds `-o pipefail`."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "On Windows runners, `run` steps default to PowerShell, so Bash syntax in a cross-platform matrix fails only on those jobs. Set `shell: bash` on such steps or under `defaults.run`."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Commits, tags and pull requests created with the default `GITHUB_TOKEN` don't trigger other workflows, which prevents loops. Use a GitHub App or personal access token when a release bot must start CI."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "`actions/cache` never overwrites an existing key, so a fixed key like `deps` keeps restoring the first cache it saved. Put a hash of the lockfile, such as `hashFiles('package-lock.json')`, in the key."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "A matrix defaults to `fail-fast: true`, so the first failing job cancels the rest and hides whether they would have passed. Set `fail-fast: false` under `strategy` when you need results for every version."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "If a `push` trigger lists only `branches`, pushing a tag no longer runs the workflow. Add a `tags` filter as well when a release job depends on tag pushes."

[[note]]
level = "intermediate"
topic = "SQL"
text = "Comparing a timestamp column with a date, as in `WHERE created_at = '2024-05-01'`, matches only rows stamped at exactly midnight. Select a whole day with a range: `created_at >= '2024-05-01' AND created_at < '2024-05-02'`."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "Setting any key under `permissions:` sets every permission you don't list to `none`. Granting only `pull-requests: write` can break a job that also needed `contents: read` to check out a private repository."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "For `pull_request` events, `github.sha` is a temporary merge commit of the PR into its base branch, not the commit you pushed. Use `github.event.pull_request.head.sha` when you need the branch's own commit."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "With `continue-on-error: true`, a failed step's `conclusion` is `success` and only its `outcome` is `failure`. Check `steps.test.outcome` when a later step must react to the failure."

[[note]]
level = "intermediate"
topic = "GitHub Actions"
text = "A `pull_request` trigger without `types` runs only on `opened`, `synchronize` and `reopened`. A check that validates the PR title or labels won't rerun after edits unless you add `edited` or `labeled`."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "After a squash merge, `git branch -d` refuses to delete your local branch because its commits never reached `main` under their own hashes. Confirm the PR merged, then delete it with `git branch -D`."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Commits whose author email isn't added to your GitHub account don't link to your profile or count as your contributions. Check `git config user.email` in each repository, especially on a new machine."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Closing keywords like `Fixes #123` only close the issue when the pull request merges into the default branch. A PR into `develop` or a release branch leaves the issue open."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "In `CODEOWNERS`, the last matching pattern wins, so a catch-all `*` line at the bottom overrides every specific owner above it. Put broad rules first and specific paths after them."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "Rebase and merge on GitHub always creates new commit SHAs, even when a fast-forward was possible. Hashes quoted in review comments or local branches won't match what lands on `main`."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "`items.filter(Boolean)` still returns `(T | undefined)[]`, because `Boolean` is not a type guard; write `items.filter((x) => x !== undefined)`, which TypeScript 5.5 and later infer as one, or give the callback an explicit `x is T` return type."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Aliases from `~/.bashrc` do not exist in scripts: a non-interactive Bash neither reads that file nor expands aliases, so the script fails with `command not found`. Use functions or full commands in scripts."

[[note]]
level = "intermediate"
topic = "Code review"
text = "Files marked `linguist-generated` in `.gitattributes` are collapsed by default in GitHub's pull request diffs, so edits there are easy to miss. Mark only files that really are generated."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "Two services that each call the other during startup can never both come up after a full outage, since each waits for the other. Keep startup free of calls to peers, or make those calls optional."

[[note]]
level = "intermediate"
topic = "SQL"
text = "`WHERE id IN ()` is a syntax error in PostgreSQL and MySQL, so code that builds an `IN` list from an empty array crashes on the empty case. Check for it first, or in PostgreSQL pass one array parameter with `id = ANY($1)`."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git commit -a` stages modified and deleted files but skips new ones, so the commit can reference a file you never added. Run `git status` first, or `git add` new files explicitly."

[[note]]
level = "intermediate"
topic = "Web"
text = "On phones, `height: 100vh` is the viewport height with the browser's toolbars hidden, so a full-screen section overflows while they show; use `100dvh`, which follows the visible area, or `100svh` for the smallest size."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git log -- path` only lists commits made under the file's current name. Add `--follow` to trace a single file's history back through renames."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git blame` credits whoever last touched a line, which is often a mass reformatting commit. List such commits in a file and pass it with `--ignore-revs-file`, or set `blame.ignoreRevsFile`."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`systemctl enable myapp` only makes the service start at boot; it does not start it now, so it stays down until the next reboot. Run `systemctl enable --now myapp` to do both in one step."

[[note]]
level = "intermediate"
topic = "Git"
text = "Commits made on a detached `HEAD` belong to no branch, and once you switch away only the reflog can find them. Run `git switch -c` with a new branch name to keep them."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Logging an error at every layer it passes through turns one failure into five log lines, inflating error counts and burying the useful one. Add context as the error propagates, and log it once where it is handled."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git diff main..feature` compares the two branch tips, so newer commits on `main` show up as reversed changes. Use `git diff main...feature` to see only what `feature` changed since it branched."

[[note]]
level = "intermediate"
topic = "Git"
text = "When `git stash pop` hits a conflict, the stash entry is kept rather than dropped. After resolving, run `git stash drop`, or the stale entry can be applied again by mistake later."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git clone` leaves submodule directories empty, and by default `git pull` doesn't move submodules to the commits the parent repository records. Run `git submodule update --init --recursive` after cloning or pulling."

[[note]]
level = "intermediate"
topic = "Git"
text = "In `.gitignore`, `build/` ignores every directory named `build` at any depth, including `src/build/`. Write `/build/` to match only the one beside that `.gitignore` file."

[[note]]
level = "intermediate"
topic = "Git"
text = "A `!` rule in `.gitignore` can't re-include a file whose parent directory is excluded. Ignore `logs/*` instead of `logs/`, and then `!logs/.gitkeep` works."

[[note]]
level = "intermediate"
topic = "Git"
text = "Git doesn't record renames; it infers them from content similarity. Rename a file and rewrite most of it in one commit, and history shows a deletion plus a new file. Commit the rename separately first."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git add .` only stages changes under your current directory, so running it from a subfolder misses edits elsewhere. Use `git add -A` to stage the whole working tree."

[[note]]
level = "intermediate"
topic = "Git"
text = "Hooks in `.git/hooks` aren't committed or cloned, so teammates never run them. Keep hooks in a tracked directory and point Git at it with `git config core.hooksPath`."

[[note]]
level = "intermediate"
topic = "SQL"
text = "PostgreSQL folds unquoted names to lowercase, so a table created as `\"Users\"` by an ORM or a GUI tool must be quoted in every query: `SELECT * FROM Users` looks for `users`. Stick to lowercase names."

[[note]]
level = "intermediate"
topic = "Web"
text = "`form.submit()` skips both the `submit` event and built-in validation, so your submit handlers and `required` checks never run; call `form.requestSubmit()` to submit as if the user had clicked the submit button."

[[note]]
level = "intermediate"
topic = "Git"
text = "`git rebase` drops merge commits by default and replays the merged commits as one linear series. Pass `--rebase-merges` when you need to keep the branch's merge structure."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Adding yourself to a group, as in `sudo usermod -aG docker $USER`, has no effect on shells that are already open, because group membership is read at login. Log out and back in, or start a shell with `newgrp docker`."

[[note]]
level = "intermediate"
topic = "CI"
text = "YAML reads an unquoted `3.10` as the number 3.1, so a CI matrix entry meant for Python 3.10 asks for version 3.1. Quote version numbers in YAML, as in `'3.10'`."

[[note]]
level = "intermediate"
topic = "Linux"
text = "In `find . -name '*.png' -o -name '*.jpg' -print`, the implied AND binds tighter than `-o`, so `-print` applies only to the `.jpg` test and PNG files never print. Group the tests: `find . \\( -name '*.png' -o -name '*.jpg' \\) -print`."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Every recipe line in a Makefile must start with a tab character, so an editor that turns tabs into spaces makes `make` fail with `missing separator`. Configure your editor to keep tabs in Makefiles, for example through `.editorconfig`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "A pipeline's exit status is the last command's, so `mysqldump app | gzip > backup.gz` succeeds even when the dump fails. Add `set -o pipefail` so a failure in any stage fails the whole pipeline."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`local out=$(cmd)` returns the status of `local`, which is 0, so `set -e` and `$?` never see `cmd` fail. Declare with `local out` first, then assign `out=$(cmd)` on its own line."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`while read line` trims leading and trailing whitespace and treats backslashes as escapes. Use `while IFS= read -r line` to get every line exactly as written."

[[note]]
level = "intermediate"
topic = "Shell"
text = "A `while read` loop skips a final line with no trailing newline, because `read` returns nonzero at end of file even though it filled the variable. Add `|| [[ -n $line ]]` to the loop condition."

[[note]]
level = "intermediate"
topic = "Shell"
text = "In Bash, the loop in `cmd | while read -r line; do ...; done` runs in a subshell, so variables you set inside it are gone afterward. Feed the loop with `done < <(cmd)` to keep them."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`[ -n $var ]` is true even when `var` is empty: it collapses to `[ -n ]`, a test of the non-empty string `-n`. Quote the variable, as in `[ -n \"$var\" ]`."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "`jq '.user.name'` prints `null` and exits 0 when the key is missing, so a typo in a path slips through a script unnoticed. Add `-e`, which makes `jq` exit nonzero when the last result is `null` or `false`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "When a glob matches nothing, Bash passes it through as literal text, so `for f in *.csv` runs once with `f` set to `*.csv`. Enable `shopt -s nullglob` or check `[[ -e $f ]]` inside the loop."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "`watch ls -l | grep log` pipes the screen output of `watch` itself into `grep`, not the output of `ls`, and garbles the display. Quote the whole pipeline instead, as in `watch 'ls -l | grep log'`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`sort` follows the current locale, so the same input can sort differently on two machines, and `comm` or `join` then miss matches. Use `LC_ALL=C sort` when the order must be stable."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "In `~/.ssh/config`, the first value found for each option wins, so a `Host *` block at the top overrides the specific host entries below it. Put general defaults at the end of the file."

[[note]]
level = "intermediate"
topic = "Regex"
text = "In a character class, a hyphen between two characters forms a range, so `[\\w.-_]` allows everything from `.` to `_`, including `/`, `:` and `\\`, and accepts `../etc/passwd`. Put the hyphen last, as in `[\\w._-]`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Bash reads numbers with a leading zero as octal, so arithmetic on `$(date +%m)` fails in August and September with `value too great for base`. Force base 10 with `$(( 10#$month + 1 ))`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`grep` exits 1 when nothing matches, so under `set -e` a line like `count=$(grep -c TODO file)` ends the script when the count is 0. Add `|| true` where no match is a normal outcome."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Inside `[ ]`, `>` is a redirection, not a comparison: `[ \"$a\" > \"$b\" ]` creates a file named after `$b` and only tests that `$a` is non-empty. Use `-gt` for numbers, or `[[ $a > $b ]]` for string order."

[[note]]
level = "intermediate"
topic = "Shell"
text = "`ssh` inside a `while read` loop consumes the rest of the loop's input, so only the first line gets processed. Use `ssh -n`, or redirect its input from `/dev/null`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "A script saved with Windows line endings fails with errors like `bad interpreter` or `$'\\r': command not found`, because Bash treats the carriage return as part of each line. Convert it with `dos2unix` and add `*.sh text eol=lf` to `.gitattributes`."

[[note]]
level = "intermediate"
topic = "Shell"
text = "Inside `[[ ]]`, an unquoted right-hand side of `==` is a glob pattern, so `[[ $name == $input ]]` matches anything when `input` is `*`. Quote it, as in `\"$input\"`, for a literal comparison."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Cron runs jobs with a minimal `PATH` and without your shell profile, so commands that work in your terminal fail there with `command not found`. Use absolute paths, or set `PATH` at the top of the crontab."

[[note]]
level = "intermediate"
topic = "Linux"
text = "In a crontab line, an unescaped `%` becomes a newline and everything after it is fed to the command as input, so `date +%F` breaks. Escape it as `\\%` or move the command into a script."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Mixing units across metrics, such as one service reporting latency in milliseconds and another in seconds, makes shared dashboards and alerts wrong by a factor of 1,000. Use base units and put the unit in the name, as in `request_duration_seconds`."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`No space left on device` with gigabytes free usually means the filesystem ran out of inodes, often from millions of tiny cache or session files. Check `df -i` as well as `df -h`."

[[note]]
level = "intermediate"
topic = "Linux"
text = "A relative symlink target is resolved from the link's own directory, not from where you ran `ln -s`, so `ln -s config/app.yml /etc/app.yml` points at `/etc/config/app.yml`. Use an absolute target, or GNU `ln -sr` to compute the relative path."

[[note]]
level = "intermediate"
topic = "Linux"
text = "Services started by systemd don't read `~/.bashrc` or `/etc/profile`, so variables exported there are missing at runtime. Set them in the unit with `Environment=` or `EnvironmentFile=`."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`chmod -R 755` makes every file executable, not just directories. Use `chmod -R u=rwX,go=rX`; capital `X` adds execute only to directories and files that already had it."

[[note]]
level = "intermediate"
topic = "Linux"
text = "When the Linux OOM killer stops a process, it sends `SIGKILL`, so the process can't log anything or clean up. If a process vanishes without a trace, check `dmesg` or `journalctl -k` for an out-of-memory message."

[[note]]
level = "intermediate"
topic = "Linux"
text = "`sudo` resets most environment variables and may use its own `secure_path`, so `sudo mytool` can miss your exports or fail to find binaries on your `PATH`. Pass variables explicitly or use full paths."

[[note]]
level = "intermediate"
topic = "SQL"
text = "With `ONLY_FULL_GROUP_BY` disabled, MySQL accepts `SELECT team, name, MAX(score) FROM players GROUP BY team` and returns `name` from an arbitrary row of each team, not the top scorer. Keep the mode on, and use a window function to get whole rows."

[[note]]
level = "intermediate"
topic = "Linux"
text = "GNU `xargs` runs the command once even when its input is empty, so `find . -name '*.tmp' | xargs ls -l` lists the current directory when nothing matches. Add `-r` to skip the run on empty input."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Safari with VoiceOver can stop announcing a `<ul>` as a list once CSS sets `list-style: none`, so users lose the item count; add `role=\"list\"` to lists whose structure matters, such as navigation menus."

[[note]]
level = "intermediate"
topic = "Regex"
text = "When a pattern contains capturing groups, Python's `re.findall` returns the groups instead of the whole matches: `re.findall(r'(\\d+)px', '4px 8px')` gives `['4', '8']`, and two groups give tuples. Use `(?:...)` for grouping you do not want returned."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Rolling back the application does not undo changes made outside it, such as a config value, a feature flag or a database migration, so the problem can outlive the rollback. Check what else changed along with the release."

[[note]]
level = "intermediate"
topic = "SQL"
text = "In PostgreSQL, a multi-row `INSERT ... ON CONFLICT DO UPDATE` fails with `command cannot affect row a second time` when the same key appears twice in the batch. Deduplicate the rows before sending them."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Copying the whole source tree before installing dependencies invalidates the install layer on every code change. Copy the lockfile, install, then copy the rest, so the dependency layer stays cached."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Putting `apt-get update` and `apt-get install` in separate `RUN` steps lets Docker reuse a cached, stale package index, so installs fail or pull old versions. Run them together in one `RUN` joined with `&&`."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "A `disabled` button leaves the tab order, so keyboard and screen reader users may never find it or learn why it is unavailable; consider `aria-disabled=\"true\"`, which keeps it focusable, and say what is missing."

[[note]]
level = "intermediate"
topic = "Regex"
text = "`\\b` needs a letter, digit or underscore on one side, so `\\bC\\+\\+\\b` never matches `I like C++`: there is no boundary between `+` and a space or the end of the text. Use lookarounds instead, as in `(?<!\\w)C\\+\\+(?!\\w)`."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Inside a container, `localhost` means the container itself, so `localhost:5432` won't reach a database on your host or in another container. Use the Compose service name for containers, or `host.docker.internal` where available for the host."

[[note]]
level = "intermediate"
topic = "Containers"
text = "A server listening on `127.0.0.1` inside a container is unreachable through a published port. Bind it to `0.0.0.0` in the container and limit exposure with the host address in `-p` instead."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Bind-mounting your project over `/app` hides everything the image put there, including the `node_modules` installed during the build. Mount a separate volume at `/app/node_modules`, or install dependencies when the container starts."

[[note]]
level = "intermediate"
topic = "Containers"
text = "In Compose, `depends_on` only waits for the dependency's container to start, not for the service inside to be ready. Add a `healthcheck` to the database and use `condition: service_healthy`."

[[note]]
level = "intermediate"
topic = "Containers"
text = "An image built on an Apple silicon Mac is `arm64` by default and fails on `amd64` servers with `exec format error`. Build with `--platform linux/amd64`, or publish a multi-platform image."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Alerts routed to a person rather than to a rotation go unanswered when that person is asleep, on leave or gone from the company. Route pages to an on-call schedule, and review routing when people change teams."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "A container that exceeds its memory limit is killed (`OOMKilled`), but one that hits its CPU limit is only throttled and slows down. Check both limits when pods restart or latency climbs."

[[note]]
level = "intermediate"
topic = "Databases"
text = "MySQL closes connections that sit idle longer than `wait_timeout`, eight hours by default, so a pool that keeps idle connections overnight hands out dead ones in the morning. Set the pool's maximum connection lifetime below that, or test connections before use."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "Environment variables loaded from a ConfigMap are read only when a container starts, so editing the ConfigMap changes nothing in running pods. Restart them, for example with `kubectl rollout restart`."

[[note]]
level = "intermediate"
topic = "Networking"
text = "`localhost` may resolve to IPv6 `::1` before `127.0.0.1`, so a client gets `connection refused` from a server that listens only on IPv4. Connect to `127.0.0.1` explicitly, or have the server listen on both."

[[note]]
level = "intermediate"
topic = "Networking"
text = "Each tool reads proxy variables its own way: curl ignores an uppercase `HTTP_PROXY`, and `NO_PROXY` entries such as CIDR ranges or leading wildcards work in some clients but not others. Test every tool you run behind a proxy."

[[note]]
level = "intermediate"
topic = "DNS"
text = "A wildcard record such as `*.example.com` does not cover `example.com` itself, and it stops applying to any name that has records of its own: add a `TXT` record at `api.example.com` and the wildcard's `A` answer for that name disappears."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Logging expected events such as a 404 or a failed form validation at `ERROR` floods error dashboards with noise that hides real faults. Keep `ERROR` for failures someone should act on, and log routine rejections at a lower level."

[[note]]
level = "intermediate"
topic = "DNS"
text = "A CNAME can't share its name with other records, so you can't put one on a zone apex like `example.com`, which needs SOA and NS records. Use an A record or your DNS provider's apex alias feature."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Adding app instances during an incident where the database is the bottleneck makes things worse: each new instance opens more connections and sends more queries to the struggling database. Find the bottleneck before you scale out."

[[note]]
level = "intermediate"
topic = "Architecture"
text = "An in-process cache lives separately in each server, so after a write, different instances can serve different values until each copy expires. Keep TTLs short for data that changes, or invalidate through a shared cache or a broadcast message."

[[note]]
level = "intermediate"
topic = "DNS"
text = "In a DNS zone file, a name without a trailing dot is relative to the zone, so in the `example.com` zone a target written as `lb.example.com` becomes `lb.example.com.example.com.`. End fully qualified names with a dot."

[[note]]
level = "intermediate"
topic = "Python"
text = "A mutable default like `def add(item, bucket=[])` is created once, so every call that omits `bucket` shares and grows the same list. Default to `None` and create the list inside the function."

[[note]]
level = "intermediate"
topic = "Python"
text = "Lambdas created in a loop look up the loop variable when they're called, not when they're defined, so `[lambda: i for i in range(3)]` all return 2. Bind the current value with a default argument: `lambda i=i: i`."

[[note]]
level = "intermediate"
topic = "Python"
text = "`a is b` compares identity, and CPython caches small integers, so it can be `True` for 256 and `False` for 257 with equal values. Use `==` for values and keep `is` for `None` and sentinels."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Adding a `role` replaces an element's native semantics, so `<h2 role=\"button\">` is no longer a heading in the page outline; nest the elements instead, as in `<h2><button>Details</button></h2>`."

[[note]]
level = "intermediate"
topic = "Python"
text = "`Decimal(0.1)` inherits the float's binary rounding error and equals `0.1000000000000000055511...`, not 0.1. Build decimals from strings, as in `Decimal(\"0.1\")`, so the value is exactly what you wrote."

[[note]]
level = "intermediate"
topic = "Python"
text = "`json` turns dictionary keys into strings, so `{1: \"a\"}` comes back from a round trip as `{\"1\": \"a\"}` and integer lookups fail. Convert keys after loading, or use string keys from the start."

[[note]]
level = "intermediate"
topic = "Python"
text = "`json.dumps` writes `NaN` and `Infinity` by default, which aren't valid JSON, so strict parsers in other languages reject the output. Pass `allow_nan=False` to fail early, or replace such values with `None`."

[[note]]
level = "intermediate"
topic = "Python"
text = "Python's `//` and `%` round toward negative infinity, so `-7 // 2` is -4 and `-7 % 2` is 1, while C, Java and Go truncate and give -3 and -1. When porting such code, handle negative operands explicitly; `int(a / b)` goes through a float and is wrong for large integers."

[[note]]
level = "intermediate"
topic = "Python"
text = "`strip`, `lstrip` and `rstrip` remove any of the given characters, not a substring, so `\"download.md\".rstrip(\".md\")` returns `\"downloa\"`. Use `removesuffix` or `removeprefix` instead."

[[note]]
level = "intermediate"
topic = "Python"
text = "The name bound by `except ValueError as e:` is deleted when the block ends, so using `e` afterward raises `NameError`. Assign it to another variable inside the block if you need it later."

[[note]]
level = "intermediate"
topic = "Python"
text = "`bool(\"False\")` is `True`, since every non-empty string is truthy, so a flag read from an environment variable is on whenever it's set. Compare the lowercased value against explicit strings like `\"1\"` or `\"true\"`."

[[note]]
level = "intermediate"
topic = "Python"
text = "A stray trailing comma turns a value into a tuple: `timeout = 30,` makes `timeout` equal `(30,)`, and the error only shows up where the value is used. Watch for commas at the end of assignment lines."

[[note]]
level = "intermediate"
topic = "Python"
text = "`assert (x > 0, \"x must be positive\")` asserts a non-empty tuple, which is always true, so the check never fails. Drop the parentheses: `assert x > 0, \"x must be positive\"`."

[[note]]
level = "intermediate"
topic = "Python"
text = "`logging.basicConfig()` does nothing if the root logger already has handlers, which an imported module may have added, so your level and format are silently ignored. Call it first thing, or pass `force=True`."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "GNU `tr` works on bytes, not characters, so `tr 'é' 'e'` replaces each of the two UTF-8 bytes of `é` separately, printing `ee`, and corrupts other accented letters that share a byte, such as `à`. Use `sed` for non-ASCII text."

[[note]]
level = "intermediate"
topic = "Python"
text = "`[[0] * 3] * 3` creates three references to one inner list, so setting `grid[0][0]` changes every row. Build nested lists with a comprehension: `[[0] * 3 for _ in range(3)]`."

[[note]]
level = "intermediate"
topic = "Testing"
text = "`self.assertTrue(result, expected)` passes whenever `result` is truthy, because the second argument is only the failure message. Use `assertEqual` to compare two values."

[[note]]
level = "intermediate"
topic = "Networking"
text = "An IPv6 address needs square brackets when a port follows it, as in `[2001:db8::1]:8080`, because its own colons would otherwise be read as the port separator; code that builds addresses by joining strings often gets this wrong."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "Python randomizes string hashing per process, so iterating over a set of strings can give a different order on every run. Sort before writing output that tests, caches or generated files depend on."

[[note]]
level = "intermediate"
topic = "Security"
text = "`os.path.join(\"uploads\", name)` returns just `name` when it's an absolute path like `/etc/passwd`, discarding the base directory, and `pathlib` does the same. Reject absolute paths and `..` in user-supplied names."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "`\"²\".isdigit()` is `True`, but `int(\"²\")` raises `ValueError`, so an `isdigit()` check doesn't guarantee a parseable number. Use `isdecimal()`, or simply try `int()` and handle the error."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`const sorted = items.sort()` also reorders `items`, because `sort` works in place and returns the same array; copy first with `[...items].sort()` or use `items.toSorted()`."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Environment variables are always strings in Node, so `FEATURE_ENABLED=false` arrives as `\"false\"`, which is truthy, and `if (process.env.FEATURE_ENABLED)` still runs; compare against an exact string like `'true'`."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`typeof null` is `\"object\"`, so a guard like `typeof x === \"object\"` lets `null` through and the next property access throws. Check `x !== null` as well."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "The global `isNaN(\"abc\")` is `true` because it converts its argument to a number first. Use `Number.isNaN`, which is `true` only for the actual `NaN` value."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "In JavaScript's `Date`, months are zero-based (`new Date(2024, 1, 1)` is February 1), `getDay()` returns the weekday, and `getYear()` the year minus 1900. Use `getDate()` for the day and `getFullYear()` for the year."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`JSON.stringify` drops `undefined` and function properties, turns `NaN` and `Infinity` into `null`, and writes a `Map` or `Set` as `{}`. Convert such values explicitly before sending or storing data."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`Array(3).map((_, i) => i)` returns an array of empty slots, because `map` skips holes. Use `Array.from({ length: 3 }, (_, i) => i)` to build a filled array."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Object keys that look like integers are always listed first, in ascending numeric order, whatever order you inserted them. Use a `Map` when insertion order matters for such keys."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`str.replace(\"-\", \"+\")` replaces only the first match when the pattern is a string. Use `replaceAll`, or a regular expression with the `g` flag, to change every occurrence."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`Number(\"\")` and `Number(\" \")` are 0, not `NaN`, so an empty form field passes a numeric check. Test for a blank string before converting."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "A numeric `enum` compiles to an object with reverse mappings, so `Object.keys(Status)` returns the numbers as strings alongside the names; iterate a string enum or an `as const` array instead."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`(1.005).toFixed(2)` returns `\"1.00\"`, because 1.005 is stored as slightly less than that. Keep money in integer cents, or use a decimal library, instead of rounding with `toFixed`."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`if (list.indexOf(x))` is false when `x` is the first element and true when it's missing, because `indexOf` returns 0 or -1. Use `list.includes(x)` for membership tests."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`items.forEach(async item => { await save(item) })` doesn't wait for the saves: the next line runs immediately and failures go unhandled. Use `for...of` with `await`, or `await Promise.all(items.map(save))`."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "An `async` function always returns a promise, so `if (isAllowed(user))` is always true when `isAllowed` is async. Await the result before testing it."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "`try { saveAsync() } catch {}` doesn't catch a rejection from a promise you didn't await; the error escapes as an unhandled rejection. Put `await` in front of the call inside the `try`."

[[note]]
level = "intermediate"
topic = "Time"
text = "`new Date(\"2024-01-15\")` is parsed as UTC midnight but `new Date(\"2024-01-15T00:00\")` as local midnight, so a date-only string can display as the previous day west of UTC. Parse date-only values explicitly."

[[note]]
level = "intermediate"
topic = "Time"
text = "`d.setMonth(d.getMonth() + 1)` on January 31 lands on March 2 or 3, because February 31 overflows into March. Clamp the day to the target month's length when adding months."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "The `Function` type accepts any function and returns `any` when called, so wrong arguments go unchecked; spell the signature out instead, such as `(id: string) => Promise<void>`."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Under `\"module\": \"nodenext\"`, relative imports in ES modules must name the output file, so you write `import { x } from './util.js'` even though the source file on disk is `util.ts`."

[[note]]
level = "intermediate"
topic = "Regex"
text = "A JavaScript regex with the `g` or `y` flag keeps `lastIndex` between calls, so reusing it with `test()` alternates between `true` and `false` on matching input. Drop the flag for tests, or reset `lastIndex` to 0."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Default `sort()` orders strings by UTF-16 code units, so `\"B\"` comes before `\"a\"` and `\"é\"` after `\"z\"`. Use `localeCompare` or `Intl.Collator` for text people will read."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Characters outside the Basic Multilingual Plane, including most emoji, count as 2 in JavaScript's `length`, which measures UTF-16 code units. Length limits and `slice` can split them; use `[...str]` or `Intl.Segmenter` instead."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "In browser devtools, `console.log(obj)` keeps a live reference, so expanding it later shows the object's current state, not its state when logged. Log a snapshot with `JSON.stringify(obj)` when values change quickly."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "A type assertion like `JSON.parse(body) as User` checks nothing at runtime, so malformed data flows on and fails somewhere far away. Validate external input with a runtime schema before giving it a type."

[[note]]
level = "intermediate"
topic = "Web"
text = "Flex items default to `min-width: auto`, so a long word, URL or wide child keeps an item from shrinking and pushes the layout sideways; set `min-width: 0` on the item to let it shrink."

[[note]]
level = "intermediate"
topic = "Web"
text = "`position: sticky` appears to do nothing when an ancestor has `overflow: hidden`, `auto` or `scroll`, because the element then sticks within that ancestor instead of the page; remove the overflow or move the element."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Excess property checks only apply to object literals, so an object built earlier with a misspelled optional field, like `colour` for `color`, still type-checks when its other properties match. Pass literals directly where typos are likely."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "`paths` aliases in `tsconfig.json` only affect type checking; `tsc` emits imports like `@app/utils` unchanged, so Node can't resolve them at runtime. Configure the same aliases in your bundler or runtime, or use relative imports."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "`// @ts-ignore` silences every error on the next line, including ones introduced later. Prefer `// @ts-expect-error`, which itself becomes an error once the line stops failing."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "Bundlers such as esbuild and swc strip TypeScript types without checking them, so a build can succeed with type errors. Run `tsc --noEmit` as a separate CI step."

[[note]]
level = "intermediate"
topic = "Databases"
text = "MySQL stores tables as files named after them, so table names are case-sensitive on Linux but not by default on Windows or macOS. A query that works on a laptop can fail in production; pick one case and use it everywhere."

[[note]]
level = "intermediate"
topic = "Go"
text = "Writing to a map declared with `var m map[string]int` panics, because the zero value of a map is `nil`; reading from it quietly works. Create maps with `make` or a literal before storing anything."

[[note]]
level = "intermediate"
topic = "Go"
text = "A `defer f.Close()` inside a loop runs only when the whole function returns, so a loop over thousands of files keeps them all open. Move the loop body into its own function, or close each file explicitly."

[[note]]
level = "intermediate"
topic = "Go"
text = "Appending to a sub-slice like `b := a[:2]` can overwrite `a[2]`, because both share one backing array while capacity remains. Use a full slice expression, `a[:2:2]`, or copy the elements first."

[[note]]
level = "intermediate"
topic = "Go"
text = "`encoding/json` skips unexported struct fields, so a field named `name` is never written or filled, and no error tells you. Capitalize the field and add a tag such as `json:\"name\"` to control the key."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Integer overflow panics in debug builds but silently wraps in release builds, so an overflow that would fail loudly in tests produces wrong numbers in production. Use `checked_add` or `wrapping_add` to state what you want."

[[note]]
level = "intermediate"
topic = "Rust"
text = "`as` casts between integer types truncate without warning: `300_i32 as u8` is 44. Use `u8::try_from(x)`, which returns an error when the value doesn't fit."

[[note]]
level = "intermediate"
topic = "Rust"
text = "Slicing a `String` by byte range, as in `&s[0..1]`, panics when the index falls inside a multi-byte character like `é`. Use `chars()` or `char_indices()` to find valid boundaries."

[[note]]
level = "intermediate"
topic = "Java"
text = "`==` on `Integer` objects compares references, and only values from -128 to 127 are cached by default, so `a == b` is `true` for 127 but `false` for 128. Compare boxed numbers with `equals`."

[[note]]
level = "intermediate"
topic = "Java"
text = "`new BigDecimal(\"1.0\").equals(new BigDecimal(\"1.00\"))` is `false`, because `equals` also compares scale. Use `compareTo(...) == 0` to compare values, and take care with `BigDecimal` keys in hash-based collections."

[[note]]
level = "intermediate"
topic = "Java"
text = "`Collectors.toMap` throws `IllegalStateException` on a duplicate key, so a stream that worked on test data fails on real data. Pass a merge function as the third argument to decide which value wins."

[[note]]
level = "intermediate"
topic = "C"
text = "`strncpy` doesn't add a terminating `'\\0'` when the source is as long as the buffer, so later string functions read past the end. Terminate the buffer yourself, or use `snprintf(dst, sizeof dst, \"%s\", src)`."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "`Content-Length` counts bytes, not characters, so setting it from `body.length` cuts off responses that contain non-ASCII text; use `Buffer.byteLength(body)` in Node, or let your framework set the header."

[[note]]
level = "intermediate"
topic = "C"
text = "Comparing signed and unsigned integers converts the signed one to unsigned, so `-1 < 1u` is false. Compile with `-Wall -Wextra`, which makes GCC and Clang warn about such comparisons, and keep both sides the same type."

[[note]]
level = "intermediate"
topic = "SQL"
text = "`NOT IN (SELECT ...)` returns no rows at all if the subquery yields a single `NULL`. Use `NOT EXISTS` with a correlated subquery, or filter the `NULL` values out."

[[note]]
level = "intermediate"
topic = "Databases"
text = "MySQL's default `utf8mb4` collations ending in `_ai_ci` ignore accents as well as case, so `'resume' = 'résumé'` is true and a unique index rejects the second as a duplicate. Use an accent-sensitive or binary collation where that matters."

[[note]]
level = "intermediate"
topic = "SQL"
text = "`SUM`, `AVG` and `MAX` return `NULL`, not 0, when no rows match, and the `NULL` then spreads through any arithmetic. Wrap them, as in `COALESCE(SUM(amount), 0)`, when you need a number."

[[note]]
level = "intermediate"
topic = "Data"
text = "pandas `read_csv` treats strings such as `NA`, `N/A`, `null` and `NaN` as missing values by default, so Namibia's country code `NA` turns into a gap. Pass `keep_default_na=False` and list your real markers in `na_values`."

[[note]]
level = "intermediate"
topic = "SQL"
text = "`SELECT 1/2` returns 0 in PostgreSQL and SQL Server, where integer division truncates, but 0.5000 in MySQL. Cast one operand, as in `1.0 * a / b`, when you expect a fraction."

[[note]]
level = "intermediate"
topic = "Data"
text = "`df[df.age > 30]['score'] = 0` in pandas assigns to a temporary copy, so `df` does not change. Select and assign in one `.loc` call, as in `df.loc[df.age > 30, 'score'] = 0`."

[[note]]
level = "intermediate"
topic = "Databases"
text = "SQLite enforces foreign keys only after `PRAGMA foreign_keys = ON`, and the setting lasts for one connection. Run it on every new connection, or orphaned rows go in unnoticed."

[[note]]
level = "intermediate"
topic = "Data"
text = "Taking the first rows of a file or table as a sample, as with `head(10000)`, picks whatever order the data happens to be stored in, often the oldest records or a single region. Draw a random sample instead, such as `df.sample(n=10000, random_state=0)`."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Each app instance opens its own connection pool, so 20 instances with a pool of 20 need 400 connections, far above PostgreSQL's default `max_connections` of 100. Size pools against the total, or add a pooler."

[[note]]
level = "intermediate"
topic = "Databases"
text = "Reads sent to a replica can miss a write made a moment earlier on the primary, because replication lags. Read from the primary right after a write when the user expects to see their own change."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Python's `requests` has no default timeout, so a call to a server that stops responding can block forever. Pass `timeout=` on every call, such as `timeout=(3.05, 30)` for the connect and read limits."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Tooltips made only with the `title` attribute never appear for keyboard or touch users and are read inconsistently by screen readers; put essential information in visible text instead."

[[note]]
level = "intermediate"
topic = "Accessibility"
text = "Blocking paste in password or one-time-code fields breaks password managers and fails WCAG 2.2's accessible authentication criterion; let users paste into every field."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Cross-origin JavaScript can read only a few safelisted response headers, so a custom header such as `X-Total-Count` looks missing until the server lists it in `Access-Control-Expose-Headers`."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Webhook providers can deliver the same event more than once and out of order. Record processed event IDs to ignore repeats, and check timestamps or versions before applying an update."

[[note]]
level = "intermediate"
topic = "Web"
text = "CORS is enforced only by browsers: it stops other sites' scripts from reading your responses, but does nothing against `curl` or a server-side caller. Protect APIs with authentication, not with an allowed-origins list."

[[note]]
level = "intermediate"
topic = "Web"
text = "A `<button>` inside a `<form>` defaults to `type=\"submit\"`, so a button meant only to open a menu also submits the form. Give such buttons `type=\"button\"`."

[[note]]
level = "intermediate"
topic = "Web"
text = "Scripts loaded with `async` run as soon as each one arrives, in no fixed order, so a script that depends on another can run first and fail. Use `defer`, which keeps document order, for dependent scripts."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "Form-encoded data treats `+` as a space, and most query-string parsers do too, so an unencoded `+` in `?email=a+b@example.com` arrives as `a b@example.com`; encode it as `%2B`."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Adding a required field to a request body breaks every existing client that doesn't send it yet; add new request fields as optional, with a server-side default for clients that leave them out."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Paginating on a non-unique sort key such as `created_at` can skip or repeat items that share a value at a page boundary; add a unique tiebreaker such as the ID to both the sort and the cursor."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "Python's `isalpha()` is true for letters in every script, so `'é'.isalpha()`, `'ж'.isalpha()` and `'中'.isalpha()` all return `True`. If a field really allows only `a` to `z`, also require `s.isascii()`."

[[note]]
level = "intermediate"
topic = "Networking"
text = "A server restarted right after stopping can fail with `address already in use` while its old connections sit in `TIME_WAIT`. Setting `SO_REUSEADDR` on the listening socket, as many servers already do, lets it bind again."

[[note]]
level = "intermediate"
topic = "Security"
text = "Tokens in URLs leak into server and proxy logs, browser history and `Referer` headers. Send credentials in an `Authorization` header or a request body, never in the query string."

[[note]]
level = "intermediate"
topic = "Security"
text = "Assigning user input to `element.innerHTML` lets injected markup, such as an `img` tag with an `onerror` handler, run scripts in your page. Use `textContent` for text, and sanitize any HTML you must render."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "A JWT's payload is only base64url-encoded, so anyone holding the token can read it. Never put secrets in claims, and always verify the signature with a fixed algorithm before trusting the contents."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "`SELECT ... FOR UPDATE` in autocommit mode locks the rows only until that statement's own implicit commit, which happens at once. Run it after `BEGIN`, so the lock lasts until you write the change and commit."

[[note]]
level = "intermediate"
topic = "Cryptography"
text = "`requests.get(url, verify=False)` turns off certificate checks, so anyone on the network path can impersonate the server. Point `verify` at your internal CA bundle instead of disabling it."

[[note]]
level = "intermediate"
topic = "HTTP"
text = "nginx silently drops request headers whose names contain underscores, such as `X_API_KEY`, unless `underscores_in_headers on` is set, so a header that works locally vanishes behind the proxy; use hyphens in header names."

[[note]]
level = "intermediate"
topic = "Unicode"
text = "In JavaScript, `String.fromCharCode(0x1F600)` keeps only the low 16 bits and returns the wrong character. Use `String.fromCodePoint` for code points above `0xFFFF`, and `codePointAt` rather than `charCodeAt` to read them."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "In npm, `^1.4.2` allows any `1.x` release from 1.4.2 up, but `^0.4.2` allows only `0.4.x`, because caret ranges treat the first non-zero part as the major version. Expect different upgrades for 0.x packages."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "In pip, `~=1.4.2` means `>=1.4.2, ==1.4.*`, not any 1.x release; it's `~=1.4` that allows 1.5 and later. Check which part the operator pins before relying on it."

[[note]]
level = "intermediate"
topic = "Dependencies"
text = "A library's lockfile is ignored by the projects that depend on it, so your tests can pass on pinned versions while users resolve newer ones. Also run the library's tests in CI against freshly resolved dependencies."

[[note]]
level = "intermediate"
topic = "Versioning"
text = "`git tag` sorts names as plain strings, so `v1.10.0` is listed before `v1.9.0` and `git tag | tail -1` doesn't give the latest release. Use `git tag --sort=v:refname`, or `-v:refname` for newest first."

[[note]]
level = "intermediate"
topic = "Testing"
text = "`mock.patch(\"app.utils.send_email\")` doesn't affect `app.orders` if it already did `from app.utils import send_email`, because that module holds its own reference. Patch the name where it's looked up: `app.orders.send_email`."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Comparing floats with `==` in tests fails on results like `0.1 + 0.2`, which is `0.30000000000000004`. Use `pytest.approx`, `math.isclose` or your framework's tolerance-based assertion."

[[note]]
level = "intermediate"
topic = "Testing"
text = "An unconfigured `Mock` method returns another `Mock`, which is truthy, so code like `if client.is_allowed(user):` takes the true branch in every test. Set `return_value` on each method your code branches on."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "While you sit at a breakpoint, the other side of the program's connections, locks and leases keeps counting down, so errors that appear after you resume may come from the pause itself, not from the bug you are chasing."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Python buffers `stdout` when it isn't a terminal, so in containers and CI your prints can show up late or vanish in a crash. Set `PYTHONUNBUFFERED=1`, run `python -u`, or log to `stderr`."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "In a chained Python traceback, the error printed last is often just a consequence; the first one, above \"During handling of the above exception\", is usually the root cause. Read the chain from the top."

[[note]]
level = "intermediate"
topic = "CI"
text = "macOS and Windows file systems are usually case-insensitive, so `import './Utils'` works locally but fails on a Linux CI runner when the file is `utils.js`. Match the case exactly, and enable a lint rule that checks it."

[[note]]
level = "intermediate"
topic = "CI"
text = "Automatically retrying failed tests turns real race conditions into green builds, and the flakiness grows unnoticed. If you retry, record and report every retried test so someone fixes the cause."

[[note]]
level = "intermediate"
topic = "DNS"
text = "A single string in a `TXT` record holds at most 255 characters, so a long DKIM key must be split into several quoted strings within one record; some DNS providers reject or truncate a longer single string instead of splitting it."

[[note]]
level = "intermediate"
topic = "Cloud"
text = "The AWS CLI and SDKs take credentials from environment variables before your config files, so a stale `AWS_ACCESS_KEY_ID` in your shell overrides the profile you think you're using. Check with `aws sts get-caller-identity`."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "An exception raised inside a `threading.Thread` target is printed to stderr and the thread just ends: the main thread never sees it, and `join()` returns normally. Use `concurrent.futures`, where `future.result()` re-raises it."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Errors from a proxy or gateway in front of an API, such as a `502` or `504`, often arrive as an HTML page, so calling `response.json()` on them throws; check the status and `Content-Type` before parsing the body."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Loading a list with an ORM and then touching a relation on each item issues one query per row, the N+1 pattern, which is fast in tests and slow on real data. Use your ORM's eager loading, such as a join or prefetch."

[[note]]
level = "intermediate"
topic = "Performance"
text = "`logging.debug(f\"state: {big_obj}\")` builds the string even when debug logging is off. Pass arguments instead, as in `logging.debug(\"state: %s\", big_obj)`, so formatting only happens if the record is emitted."

[[note]]
level = "intermediate"
topic = "Time"
text = "MySQL's `TIMESTAMP` type only covers 1970 to January 19, 2038, so birth dates before 1970 and expiry dates past 2038 are rejected or stored as zero dates. Use `DATETIME` for values outside that range."

[[note]]
level = "intermediate"
topic = "Observability"
text = "Graphing a raw counter like `http_requests_total` shows an ever-growing line that drops to zero on each restart. Wrap it in `rate()` or `increase()`, which handle resets and show how fast it is actually growing."

[[note]]
level = "intermediate"
topic = "Incidents"
text = "Changing several things at once during an incident, such as a config tweak, a restart and a rollback, leaves you unsure which one helped. Make one change at a time and note when you made it."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "A session-level `pg_advisory_lock` in PostgreSQL stays held until you unlock it or the connection closes, so through a connection pool a missed unlock outlives the request. Prefer `pg_advisory_xact_lock`, which releases at commit or rollback."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "In Python, `counter += 1` isn't atomic even with the GIL, because it's a separate read, add and write, so threads can lose updates. Protect shared counters with a `threading.Lock`."

[[note]]
level = "intermediate"
topic = "Concurrency"
text = "Calling `time.sleep` or other blocking code inside an `asyncio` coroutine freezes the whole event loop, stalling every other task. Use `await asyncio.sleep`, and move blocking calls to a thread with `asyncio.to_thread`."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "`list.pop(0)` and `list.insert(0, x)` in Python shift every element, so a queue built on a list slows down as it grows. Use `collections.deque`, whose `popleft` and `appendleft` take constant time."

[[note]]
level = "intermediate"
topic = "Algorithms"
text = "`itertools.groupby` starts a new group whenever the key changes, so on unsorted input the same key appears in several groups. Sort by the same key first, or collect the items into a `dict` of lists."

[[note]]
level = "intermediate"
topic = "Testing"
text = "Tests that start servers on fixed ports such as 8080 collide when the suite runs in parallel or something else holds the port. Bind to port 0 so the operating system picks a free one, and read the assigned port back."

[[note]]
level = "intermediate"
topic = "Regex"
text = "An unescaped `.` matches any character, so the pattern `example.com` also matches `exampleXcom`. Escape it as `\\.`, or use `re.escape` when building a pattern from literal text."

[[note]]
level = "intermediate"
topic = "Regex"
text = "Greedy quantifiers grab as much as they can: `<.*>` on `<b>bold</b>` matches the whole string, not one tag. Use a lazy `.*?` or a negated class like `[^>]*`, and a real parser for HTML."

[[note]]
level = "intermediate"
topic = "Time"
text = "In Java's `DateTimeFormatter`, `YYYY` is the week-based year, so `YYYY-MM-dd` formats December 30, 2024 as `2025-12-30`. Use `yyyy` (or `uuuu`) for the calendar year."

[[note]]
level = "intermediate"
topic = "Time"
text = "`BETWEEN '2024-01-01' AND '2024-01-31'` on a timestamp column stops at midnight on January 31, missing almost the whole last day. Use a half-open range: `>= '2024-01-01' AND < '2024-02-01'`."

[[note]]
level = "intermediate"
topic = "Documentation"
text = "Setup steps in a README go stale silently: a renamed script or a new required environment variable breaks onboarding while CI stays green. Run the documented commands in CI or a fresh container on a schedule."

[[note]]
level = "intermediate"
topic = "Performance"
text = "Many database drivers load a query's entire result into memory before your loop sees the first row, even if you iterate row by row. For large exports, use a server-side cursor, such as a named cursor in psycopg, which fetches in batches."

[[note]]
level = "intermediate"
topic = "APIs"
text = "Retrying a `400` or `422` just repeats a request that will fail the same way; retry network errors, `429` and most `5xx` responses, and report other `4xx` errors to the caller with the server's message."

[[note]]
level = "intermediate"
topic = "Time"
text = "Cron step values restart at each hour or day boundary, so `*/7 * * * *` runs at minutes 0, 7 and so on up to 56, then again at 0 only four minutes later. Use steps that divide evenly into 60 or 24, or a scheduler with true intervals."

[[note]]
level = "intermediate"
topic = "Tooling"
text = "Teammates on different formatter or linter versions keep reformatting the same lines back and forth, cluttering every diff. Pin the tool versions in the project's dev dependencies or hook configuration."

[[note]]
level = "intermediate"
topic = "Teams"
text = "Decisions made in direct messages or calls vanish when people leave or forget, and new teammates repeat old debates. Summarize each decision and its reason in the issue, pull request or design doc."

[[note]]
level = "intermediate"
topic = "Debugging"
text = "Libraries such as `python-dotenv` and Node's `dotenv` do not override variables already set in the environment by default, so a stale `export` in your shell silently beats the value in `.env`. Check with `env | grep NAME`."

[[note]]
level = "intermediate"
topic = "Kubernetes"
text = "A Service whose `selector` doesn't exactly match the pod labels gets no endpoints, so connections fail even though every pod is healthy. `kubectl describe service` then lists no endpoints."

[[note]]
level = "intermediate"
topic = "Networking"
text = "When small requests work over a VPN or tunnel but large responses hang, suspect an MTU problem: oversized packets are dropped silently somewhere on the path. Lower the MTU or enable MSS clamping on the tunnel."

[[note]]
level = "intermediate"
topic = "Performance"
text = "`ORDER BY RAND() LIMIT 1` in MySQL, or `ORDER BY random()` in PostgreSQL, gives every row a random number and sorts the whole table just to pick one. On large tables, pick a random ID in range, or use `TABLESAMPLE` in PostgreSQL."

[[note]]
level = "intermediate"
topic = "Code review"
text = "A pull request that deletes, skips or loosens tests can pass CI while quietly removing coverage. Read the test diff as closely as the code, and ask why any assertion was weakened."

[[note]]
level = "intermediate"
topic = "Reproducibility"
text = "`FROM python:3` or any other floating tag pulls whatever the tag points to on the day you build, so the same Dockerfile produces different images over time. Pin a specific version tag, or a digest."

[[note]]
level = "intermediate"
topic = "Linux"
text = "With `rsync`, a trailing slash on the source changes the result: `rsync -a src/ dest/` copies the contents of `src`, while `rsync -a src dest/` creates `dest/src`. Double-check it before adding `--delete`."

[[note]]
level = "intermediate"
topic = "Containers"
text = "Docker's default `json-file` log driver keeps every line a container writes with no size limit, so a chatty container can fill the disk. Set the `max-size` and `max-file` log options, or use the `local` driver."

[[note]]
level = "intermediate"
topic = "GitHub"
text = "GitHub rejects a push that contains any file over 100 MB, even when a later commit in the same push deletes it. Remove the file from the branch's history before pushing, and keep large binaries in Git LFS."

[[note]]
level = "intermediate"
topic = "JavaScript"
text = "Passing a method as a callback, as in `setTimeout(obj.save, 100)`, loses its `this`, so it fails or acts on the wrong object. Bind it with `obj.save.bind(obj)` or wrap it in an arrow function."

[[note]]
level = "intermediate"
topic = "TypeScript"
text = "`Object.keys(obj)` is typed as `string[]`, not as the object's keys, because objects can carry extra properties at runtime. Indexing back with those keys fails under `strict`; iterate with `Object.entries` or narrow the key."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "`pull_request_target` runs with your repository's secrets and a write token. Never check out and run a fork's code in it."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "`hashFiles()` returns an empty string when its pattern matches no files, so after a lockfile is renamed or moved, a key like `deps-${{ hashFiles('**/poetry.lock') }}` quietly becomes constant. Check that the pattern still matches, or fail the job on an empty hash."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Values in `github.event.inputs` are always strings, so a boolean `workflow_dispatch` input arrives as `'false'` and `if: github.event.inputs.deploy` is then true. Use the `inputs` context, which keeps booleans, or compare with `== 'true'`."

[[note]]
level = "advanced"
topic = "Git"
text = "In `includeIf \"gitdir:~/work/\"`, the trailing slash matters: with it the rule covers every repository under `~/work`, while `gitdir:~/work` without it matches almost nothing. Check which file set a value with `git config --show-origin user.email`."

[[note]]
level = "advanced"
topic = "Shell"
text = "In Bash, `source lib.sh` without a slash searches `PATH` before the current directory, so a different `lib.sh` on your `PATH` can be loaded instead. Source files by an explicit path, such as one built from `${BASH_SOURCE[0]}`."

[[note]]
level = "advanced"
topic = "Shell"
text = "Bash evaluates the operands of `-eq` inside `[[ ]]`, and everything in `$(( ))`, as arithmetic expressions, so an untrusted value like `a[$(id)]` runs a command. Check that input is a plain number, for example with `[[ $x =~ ^[0-9]+$ ]]`, before using it there."

[[note]]
level = "advanced"
topic = "Linux"
text = "`mv` within one file system is an atomic rename, but across file systems it copies and then deletes, so a reader can see a half-written file and a crash can leave both copies. Write temporary files on the same file system as their destination."

[[note]]
level = "advanced"
topic = "Shell"
text = "Bash reads a script in pieces while it runs, so editing a long-running script in place can make the running copy execute a mix of old and new lines. Deploy script changes by writing a new file and renaming it over the old one."

[[note]]
level = "advanced"
topic = "Go"
text = "`append` inside a function returns a new slice header, so unless you return the result or pass a pointer to the slice, the caller never sees the added elements. Return the updated slice and have callers assign it."

[[note]]
level = "advanced"
topic = "C"
text = "Passing a plain `char` above 127 to `isalpha`, `toupper` or the other `<ctype.h>` functions is undefined behavior where `char` is signed, as on x86. Cast to `unsigned char` first, as in `isalpha((unsigned char)c)`."

[[note]]
level = "advanced"
topic = "SQL"
text = "Binding parameters does not stop `%` and `_` in user input from acting as wildcards inside a `LIKE` pattern, so a search for `a_b` also matches `axb`. Escape them and declare the escape character with `ESCAPE`."

[[note]]
level = "advanced"
topic = "Databases"
text = "In PostgreSQL with a non-C collation, a plain B-tree index on a text column cannot serve `LIKE 'abc%'` prefix searches. Create the index with the `text_pattern_ops` operator class, and confirm with `EXPLAIN` that the query uses it."

[[note]]
level = "advanced"
topic = "Shell"
text = "`cmd &> /dev/null` is Bash shorthand; in a `#!/bin/sh` script run by dash it parses as `cmd &` followed by an empty redirection, so the command runs in the background and its output still appears. Write `cmd > /dev/null 2>&1`."

[[note]]
level = "advanced"
topic = "Security"
text = "Decompressing untrusted input without a size limit lets a small archive or gzip request body expand to gigabytes and exhaust memory or disk. Cap the decompressed size, and for archives the number of entries, while streaming."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Deterministic encryption, where the same plaintext always yields the same ciphertext, reveals which records share a value, such as the same diagnosis or salary. Use randomized encryption unless you need equality lookups, and accept that leak knowingly if you do."

[[note]]
level = "advanced"
topic = "Containers"
text = "Kubernetes ignores the Dockerfile `HEALTHCHECK` instruction, so an image that relies on it gets no health checking in a cluster. Define liveness and readiness probes in the pod spec instead."

[[note]]
level = "advanced"
topic = "Linux"
text = "On NFS, `O_APPEND` is not atomic, because the client works out the end of the file itself, so processes on different machines appending to one shared log can overwrite each other's lines. Give each host its own file, or ship logs to a collector."

[[note]]
level = "advanced"
topic = "Networking"
text = "A listening socket's backlog is capped by `net.core.somaxconn`, so during bursts of new connections Linux drops SYNs and clients stall in retransmission for a second or more. Raise the backlog in both the application's `listen()` call and the sysctl."

[[note]]
level = "advanced"
topic = "DNS"
text = "Using `.local` for internal hostnames collides with multicast DNS, so macOS and many Linux systems resolve those names through mDNS and lookups fail or time out. Use a subdomain of a domain you own, or `home.arpa` for home networks."

[[note]]
level = "advanced"
topic = "Time"
text = "Adding 24 hours is not the same as adding one day across a daylight saving change: the result lands an hour off in local time. Do calendar arithmetic with a time zone-aware library, in the user's zone."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Calling `chunk.toString()` on each chunk of a Node.js stream can split a multibyte UTF-8 character across chunks and corrupt it. Use `stream.setEncoding('utf8')` or a `StringDecoder`, which hold back partial characters."

[[note]]
level = "advanced"
topic = "Regex"
text = "In JavaScript, `\\w` and `\\b` cover only ASCII letters, digits and underscore, even with the `u` flag, so `/\\bcafé\\b/u` does not match `café`. Use Unicode property escapes such as `\\p{L}` with the `u` flag."

[[note]]
level = "advanced"
topic = "Linux"
text = "A systemd service with `PrivateTmp=yes` gets its own `/tmp`, backed by a hidden `systemd-private-*` directory on the host, so other programs looking in `/tmp` never see its files, and they are deleted when it stops. Exchange files through a directory such as `/var/lib/myapp`."

[[note]]
level = "advanced"
topic = "Tooling"
text = "With `make -j`, output from parallel recipes interleaves, so the last error on screen is often not the one that failed first. Add GNU make's `-O` (`--output-sync`) to print each target's output as one block."

[[note]]
level = "advanced"
topic = "Java"
text = "`BigDecimal.equals` compares scale as well as value, so `1.0` and `1.00` are not equal and become different keys in a `HashMap`. Use `compareTo` for numeric equality, or normalize with `stripTrailingZeros()`."

[[note]]
level = "advanced"
topic = "Rust"
text = "`v.sort_by(|a, b| a.partial_cmp(b).unwrap())` panics as soon as the data contains a NaN, because `partial_cmp` returns `None` for it. Sort floats with `f64::total_cmp`, which defines an order for every value."

[[note]]
level = "advanced"
topic = "Tooling"
text = "Exporting `LD_LIBRARY_PATH` in your shell profile makes every program you start search those directories first, so an unrelated tool can load an incompatible `libssl` or `libstdc++` and crash. Set it only in a wrapper for the program that needs it, or build with an rpath."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Single-file transpilers such as esbuild, SWC and Babel cannot tell whether a re-exported name is only a type, so `export { User } from './types'` can emit an import that fails at runtime. Use `export type`, and enable `isolatedModules` so `tsc` flags it."

[[note]]
level = "advanced"
topic = "Testing"
text = "Timeout, retry and partial-failure paths rarely run in tests, so their bugs surface first during an incident. Inject faults such as delays, dropped connections and error responses in tests to exercise those paths."

[[note]]
level = "advanced"
topic = "Regex"
text = "A negated class such as `[^\"]*` also matches newlines, even in engines where `.` does not, so a pattern meant for one quoted string can run across line breaks. Add the newline to the class, as in `[^\"\\n]*`, to stay on one line."

[[note]]
level = "advanced"
topic = "CI"
text = "Parallel CI jobs that share one external database, bucket or test account interfere with each other and fail at random. Give each job its own namespace, such as a unique schema, key prefix or account."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Packages whose install scripts download prebuilt binaries fetch files that your lockfile's integrity hashes never cover, so a compromised download host bypasses your pinning. Prefer packages that ship binaries inside the package, or mirror and verify the downloads."

[[note]]
level = "advanced"
topic = "Regex"
text = "`find -regex` must match the entire path, including the leading `./`, so `find . -regex 'test.*\\.py'` finds nothing. Write `-regex '.*/test.*\\.py'`, or use `-name 'test*.py'`, which matches only the file name."

[[note]]
level = "advanced"
topic = "Web"
text = "Chromium-based browsers reject a cookie marked `SameSite=None` that lacks the `Secure` attribute, so a cross-site embed or third-party login that depends on it quietly stops receiving the cookie. Always pair `SameSite=None` with `Secure`."

[[note]]
level = "advanced"
topic = "APIs"
text = "In a JSON `PATCH`, an absent field and a field set to `null` usually mean different things (leave alone versus clear), but many deserializers map both to the same null value. Use a type that can tell them apart, and test both cases."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Calling a non-critical service, such as analytics or recommendations, synchronously in the request path makes its outages and slowdowns your own. Call it asynchronously, or with a short timeout and a fallback."

[[note]]
level = "advanced"
topic = "Observability"
text = "Spans from different hosts are timed with each host's own clock, so clock skew can make a child span appear to start before its parent or outlast the whole request. Keep clocks synchronized, and read cross-host timings with that in mind."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "`create_before_destroy` fails for resources whose names must be unique, such as a bucket or a security group name, because the replacement is created while the old one still holds the name. Use a name prefix or a generated suffix."

[[note]]
level = "advanced"
topic = "Cloud"
text = "An availability zone can fail as a unit, so running every replica, or your only NAT gateway, in one zone creates a single point of failure. Spread replicas and zonal dependencies across zones."

[[note]]
level = "advanced"
topic = "Git"
text = "`git stash pop` brings staged changes back as unstaged ones unless you pass `--index`, so a carefully staged partial commit is flattened into the working tree. Use `git stash pop --index` when the staging area matters."

[[note]]
level = "advanced"
topic = "Linux"
text = "PIDs are recycled, so a PID read from a stale pid file can belong to an unrelated process by the time you signal it. Check that the process is the one you expect before killing it, or let a supervisor such as systemd track it."

[[note]]
level = "advanced"
topic = "Python"
text = "Starting a child with `stdout=subprocess.PIPE` and then calling `wait()` deadlocks once the child fills the pipe buffer and blocks on its next write. Use `communicate()` or `subprocess.run()`, which read the output while waiting."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Java and JavaScript compare strings by UTF-16 code units, while Python, Go and Rust compare by code point, so emoji and other characters above U+FFFF sort before U+E000 to U+FFFF in one and after in the other. Services that merge or page through sorted keys then disagree."

[[note]]
level = "advanced"
topic = "C"
text = "`atoi` returns 0 both for `\"0\"` and for text that is not a number, and out-of-range input is undefined behavior. Parse with `strtol`, and check `errno` and the end pointer."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "If a pod is restarted or recreated, all of its init containers run again, so an init step that migrates a database or registers the pod somewhere must be safe to repeat. Make init work idempotent."

[[note]]
level = "advanced"
topic = "Security"
text = "Rendering user input as a template, rather than passing it as data to a fixed template, gives attackers the template engine's features and often code execution (server-side template injection). Never build template source from user input."

[[note]]
level = "advanced"
topic = "Databases"
text = "PostgreSQL can switch a prepared statement to a generic plan after five executions, and with skewed data that plan can be far slower for some parameter values. Compare `EXPLAIN` output across executions, and set `plan_cache_mode` if the generic plan hurts."

[[note]]
level = "advanced"
topic = "Shell"
text = "Bash runs a trap only after the current foreground command finishes, so a script waiting in `sleep 3600` does not react to `SIGTERM` until the sleep ends. Wait with `sleep 3600 & wait $!` instead, which a trapped signal interrupts."

[[note]]
level = "advanced"
topic = "Containers"
text = "Minimal base images often lack time zone data, so setting `TZ` has no effect and zone conversions fall back to UTC or fail. Install `tzdata` in the image, or bundle zone data with your runtime."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Hash tables keyed by attacker-controlled strings can be forced into worst-case collisions when the hash function is predictable, turning each insert into a linear scan. Use a keyed hash such as SipHash for untrusted keys."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "`actions/cache` saves the cache in a post step that runs only when the job succeeds, so a job that keeps failing after an expensive install never saves anything and every run starts cold. Save explicitly with `actions/cache/save` in a step that runs even on failure."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Writing untrusted multi-line text to `$GITHUB_OUTPUT` with a fixed delimiter such as `EOF` lets content containing that delimiter end the value early and define outputs of its own. Generate a random delimiter for every write."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "A step `if:` without a status function is implicitly combined with `success()`, so a cleanup step guarded by `if: env.CLEANUP == 'true'` never runs after an earlier failure. Write `if: always() && env.CLEANUP == 'true'` instead."

[[note]]
level = "advanced"
topic = "Git"
text = "Commit author and committer dates come from the committer's own clock and can be set to anything with `GIT_AUTHOR_DATE` and `GIT_COMMITTER_DATE`, so they prove nothing about when code was written. Use server-side push records when timing matters."

[[note]]
level = "advanced"
topic = "Git"
text = "A shallow clone made with `--depth` often cannot be pushed to a new remote: the push is rejected with `shallow update not allowed` because history is missing. Run `git fetch --unshallow` before mirroring or pushing to a fresh repository."

[[note]]
level = "advanced"
topic = "Shell"
text = "With `set -o pipefail`, `producer | head -n 1` can fail the script: `head` exits early, the producer is killed by `SIGPIPE`, and its status 141 becomes the pipeline's status. Handle that status or avoid early-exit readers in strict scripts."

[[note]]
level = "advanced"
topic = "Shell"
text = "In Bash, `**` is not recursive unless `shopt -s globstar` is set: without it, `**/*.py` behaves like `*/*.py` and matches only one directory level. Enable the option, or use `find`, when you need every level."

[[note]]
level = "advanced"
topic = "Linux"
text = "`select()` cannot watch file descriptors numbered `FD_SETSIZE` (1024 on Linux) or higher, and `FD_SET` on one writes past the end of the set, so raising `ulimit -n` can corrupt memory in old code. Use `poll` or `epoll` instead."

[[note]]
level = "advanced"
topic = "Linux"
text = "Killing a shell script's PID leaves the commands it started running as orphans. Signal the whole process group with `kill -- -PGID`, or have the script trap the signal and stop its children."

[[note]]
level = "advanced"
topic = "Python"
text = "`threading.local` values are shared by every coroutine running on the same event loop thread, so per-request state stored there leaks between concurrent requests. Use `contextvars.ContextVar` in async code."

[[note]]
level = "advanced"
topic = "Python"
text = "Passing a `pytz` zone as `tzinfo=` to `datetime()` attaches that zone's oldest offset, local mean time such as -04:56 for New York, not the offset in force on that date. Attach `pytz` zones with `localize()`, or use `zoneinfo`, which works with `tzinfo=`."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Text length limits count different units per database: characters in PostgreSQL and MySQL, bytes in Oracle by default and in SQL Server's `varchar`. A name with accented letters that fits before a migration can fail to insert after it, so check the length semantics first."

[[note]]
level = "advanced"
topic = "Time"
text = "A leap second is written `23:59:60`, as in `2016-12-31T23:59:60Z`, which is valid UTC, yet Python's `datetime` and many other libraries reject a seconds value of 60. Decide how ingestion handles such timestamps, for example by clamping them to `:59`."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "`readonly` and `ReadonlyArray` are checked only at compile time and only one level deep, so nested objects stay mutable and JavaScript callers can change anything. Deep-freeze or copy data that must not change at runtime."

[[note]]
level = "advanced"
topic = "Go"
text = "In Go, `json:\",omitempty\"` never omits a struct-typed field, even at its zero value, yet it drops `false`, 0 and empty strings that may be meaningful. Use pointer fields when absent and zero must differ."

[[note]]
level = "advanced"
topic = "Go"
text = "`encoding/json` marshals a nil slice as `null` but an empty slice as `[]`, so clients that expect an array can break on `null`. Initialize with `[]T{}` or `make([]T, 0)` when the field must always be an array."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "In PostgreSQL, an `INSERT` whose unique key matches a row inserted by a still-open transaction waits for that transaction to commit or roll back, so one long transaction that inserted a key stalls every other writer of that key."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Synchronizing on a `String` literal or a boxed `Integer` in Java can share the lock with unrelated code, because string literals are interned and small `Integer` values are cached. Lock on a `private final Object` instead."

[[note]]
level = "advanced"
topic = "Java"
text = "`volatile` guarantees visibility, not atomicity, so `count++` on a volatile field still loses updates when threads race. Use an `AtomicLong`, a `LongAdder` or a lock."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "Sequence IDs are assigned at insert, not at commit, so a row with a lower ID can become visible after higher ones. A consumer polling `WHERE id > last_seen_id` then skips it forever; read changes through CDC, or re-scan a safety window."

[[note]]
level = "advanced"
topic = "C"
text = "`memcpy` with overlapping source and destination is undefined behavior, and optimized library versions do copy in orders that corrupt the data. Use `memmove` whenever the two regions might overlap."

[[note]]
level = "advanced"
topic = "SQL"
text = "With `ORDER BY` in a window, the default frame ends at the current row, so `last_value()` returns the current row's value and running totals group tied rows together. Spell the frame out, as in `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`."

[[note]]
level = "advanced"
topic = "SQL"
text = "Adding `DISTINCT` to hide duplicate rows usually masks a join that fans out, and aggregates such as `SUM` over that join are still inflated. Fix the join condition, or aggregate before joining."

[[note]]
level = "advanced"
topic = "Databases"
text = "In Redis, a plain `SET` on an existing key discards its time to live, so updating a cached value turns it into a key that never expires. Pass `KEEPTTL`, or set the expiry again in the same command."

[[note]]
level = "advanced"
topic = "Databases"
text = "SQLite depends on file locking that is often unreliable on network file systems such as NFS, so concurrent access there can corrupt the database. Keep SQLite files on a local disk, and use a client-server database when several machines need the data."

[[note]]
level = "advanced"
topic = "HTTP"
text = "Reverse proxies such as nginx buffer upstream responses by default, so server-sent events and streamed output arrive in bursts or only at the end. Disable buffering for those routes, for example with `proxy_buffering off` or an `X-Accel-Buffering: no` response header."

[[note]]
level = "advanced"
topic = "SQL"
text = "A PostgreSQL query with a selective filter and `ORDER BY created_at DESC LIMIT 10` may walk an index on `created_at`, expecting matches soon; when matches are rare, it reads most of the table. An index on the filter column plus `created_at` avoids that gamble."

[[note]]
level = "advanced"
topic = "Security"
text = "Login, signup and password reset forms that respond differently, in wording or timing, to known and unknown accounts let attackers enumerate your users. Return the same message and do comparable work either way."

[[note]]
level = "advanced"
topic = "Security"
text = "Locking an account after a few failed logins lets anyone who knows a username lock that user out on demand, again and again. Slow down repeated failures per account and per source, with delays or a challenge, instead of a hard lockout."

[[note]]
level = "advanced"
topic = "Databases"
text = "PostgreSQL's `TRUNCATE` is not MVCC-safe: once it commits, a concurrent transaction whose snapshot was taken before it sees the table as empty. Use `DELETE` when long-running readers may still be using the table."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Using one key for several purposes, such as both encryption and a MAC, or with two different algorithms, lets a weakness in one use undermine the other. Derive a separate key for each purpose from a master key with a KDF such as HKDF."

[[note]]
level = "advanced"
topic = "Containers"
text = "Files added with `COPY` are owned by root unless you pass `--chown`, so an image that switches to a non-root `USER` cannot write to them at runtime. Use `COPY --chown=app:app`, and keep writable paths separate from code."

[[note]]
level = "advanced"
topic = "Containers"
text = "`ENV` values persist into every container started from the image, so a build-only setting such as `DEBIAN_FRONTEND=noninteractive` also changes runtime behavior. Set it with `ARG`, or inline on the `RUN` line that needs it."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "An `emptyDir` volume with `medium: Memory` is RAM-backed, and files written there count against the container's memory limit, so a growing scratch file gets the pod OOM-killed. Set a `sizeLimit` and budget memory for it."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Automatic database failover tuned to react within seconds can flip roles on a brief network blip, and each flip risks lost writes and broken client connections. Require sustained failure before failing over, and make failback a manual decision."

[[note]]
level = "advanced"
topic = "Networking"
text = "A service that listens on a port inside Linux's ephemeral range (`net.ipv4.ip_local_port_range`) can fail to start when an outgoing connection happens to hold that port. Choose listening ports outside the range, or reserve them with `net.ipv4.ip_local_reserved_ports`."

[[note]]
level = "advanced"
topic = "Networking"
text = "TCP delivers a byte stream, not messages: one `recv` can return half a message or two messages at once. Frame your protocol with a length prefix or a delimiter, and loop until a whole message has arrived."

[[note]]
level = "advanced"
topic = "DNS"
text = "The glibc resolver waits 5 seconds for a nameserver before trying the next, so a dead first entry in `/etc/resolv.conf` adds seconds to lookups. Remove unreachable servers, and tune `options timeout:` and `attempts:`."

[[note]]
level = "advanced"
topic = "Time"
text = "Time zone abbreviations are ambiguous: `CST` can mean US Central, China or Cuba Standard Time, and `IST` India, Ireland or Israel. Store and exchange IANA zone names or numeric offsets, never abbreviations."

[[note]]
level = "advanced"
topic = "Unicode"
text = "A UTF-8 byte order mark at the start of a script breaks its `#!` line, and many JSON parsers reject a leading BOM. Configure editors and generators to write UTF-8 without a BOM."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Virtualized lists render only the rows near the viewport, so browser find, screen reader navigation and item counts see only a fragment; set `aria-setsize` and `aria-posinset` on each row, and offer search or paging."

[[note]]
level = "advanced"
topic = "Performance"
text = "Microbenchmarks mislead when the compiler removes code whose result is unused or the JIT has not warmed up yet. Use a harness such as JMH, Go's `testing.B` or the `criterion` crate for Rust, and consume every result."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "A read-write lock that prefers readers can starve writers indefinitely under steady read traffic, so updates stall. Check your lock's fairness policy, and use a fair or writer-preferring lock where writes must get through."

[[note]]
level = "advanced"
topic = "Testing"
text = "Tests marked skip or expected-to-fail stay that way long after the reason is gone, quietly shrinking what the suite checks. Require a reason and a tracking issue for each, and review them regularly, for example with `pytest -rsx`."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Many systems set the core file size limit to 0, so a crashing process leaves no core dump to inspect. Check `ulimit -c` and `/proc/sys/kernel/core_pattern` before you need one; on systemd hosts, `coredumpctl` lists captured dumps."

[[note]]
level = "advanced"
topic = "CI"
text = "CI jobs often run as root, so tests of file permissions and access errors pass in CI and fail on developer machines, or the other way around. Run tests as an unprivileged user, as your service runs in production."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "If a package maintainer's email domain expires, an attacker can register it, reset the registry account's password and publish a malicious release. Watch critical dependencies for maintainer changes, and favor registries that enforce two-factor authentication."

[[note]]
level = "advanced"
topic = "Web"
text = "Allowing a whole CDN host in `script-src` lets an attacker load any script served from it, including old library versions with known bypasses. Prefer nonces or hashes, with `'strict-dynamic'` for scripts that load other scripts."

[[note]]
level = "advanced"
topic = "APIs"
text = "Rate limiting by client IP lumps together everyone behind a corporate proxy or a mobile carrier's NAT, so one busy office can lock out many unrelated users. Limit by API key or account where you can, and keep per-IP limits generous."

[[note]]
level = "advanced"
topic = "Observability"
text = "Prometheus scrapes on an interval, so a batch job that starts and exits between scrapes never has its metrics collected. Push results from short-lived jobs to a Pushgateway, or record them somewhere durable."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "`runs-on: ubuntu-latest` moves to a new Ubuntu release when GitHub updates the label, changing preinstalled tool versions under builds that used to pass. Pin a versioned runner image for builds that must stay stable, and upgrade on purpose."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Workflows triggered by `pull_request` do not run while the pull request has a merge conflict, so its checks go missing or stay stale until the conflict is resolved. Resolve conflicts before trusting what CI reports for it."

[[note]]
level = "advanced"
topic = "Git"
text = "After a squash merge, Git keeps no record that the branch was merged, so if you keep committing on that branch and merge it again, its old changes come along and conflict wherever the target has since changed those lines. Start new work from the updated target."

[[note]]
level = "advanced"
topic = "Performance"
text = "A JVM heap set just above 32 GB can hold fewer objects than one just below it: past that size the JVM stops using compressed 32-bit object pointers, so every reference doubles in size. Stay under the threshold or go well beyond it."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Health checks that do real work, such as a database query per probe, multiply load with every instance and load balancer, and during an incident they can be what tips the database over. Keep probes cheap, and cache dependency checks."

[[note]]
level = "advanced"
topic = "Shell"
text = "`(( i++ ))` returns status 1 when the old value of `i` is 0, so under `set -e` the first increment exits the script. Use `i=$((i + 1))` instead."

[[note]]
level = "advanced"
topic = "Linux"
text = "Linux limits inotify watches per user (`fs.inotify.max_user_watches`), so file watchers in editors, build tools and test runners can miss changes or fail with `ENOSPC` in large trees. Raise the limit, or exclude directories such as `node_modules`."

[[note]]
level = "advanced"
topic = "Linux"
text = "POSIX `fcntl` locks belong to the process and are released when it closes any descriptor for that file, even one a library opened briefly, so a lock can silently vanish. On Linux, use `flock` or open file description locks (`F_OFD_SETLK`) instead."

[[note]]
level = "advanced"
topic = "Python"
text = "A generator abandoned partway through runs its `finally` blocks and `with` exits only when it is closed or garbage-collected, so files or locks opened inside it can stay held. Close it explicitly, or wrap it in `contextlib.closing()`."

[[note]]
level = "advanced"
topic = "Python"
text = "In Python, `1`, `1.0` and `True` are equal and hash alike, so `{1: 'a', True: 'b'}` holds a single key whose value is `'b'`. Keep dictionary keys to one type, especially when they come from parsed data."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "`setInterval` with an async callback starts the next run on schedule even if the previous one is still awaiting, so slow runs pile up and overlap. Schedule the next run with `setTimeout` after the current one finishes."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "In Node.js, an `EventEmitter` that emits `'error'` with no listener throws it, which crashes the process when a stream or socket fails. Attach an `'error'` handler to every stream, socket and emitter you create."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Without `exactOptionalPropertyTypes`, an optional property `name?: string` also accepts an explicit `undefined`, so `'name' in obj` can be true while the value is missing. Enable the flag when absent and undefined must mean different things."

[[note]]
level = "advanced"
topic = "Go"
text = "`os.Exit` and `log.Fatal` end the program immediately without running deferred functions, so flushes and cleanup in `defer` never happen. Put the work in a function that returns an error, and call `os.Exit` in `main` only after it returns."

[[note]]
level = "advanced"
topic = "Go"
text = "Calling `wg.Add(1)` inside the new goroutine races with `wg.Wait()`, which may return before that goroutine has registered. Call `Add` before the `go` statement."

[[note]]
level = "advanced"
topic = "Rust"
text = "In `tokio::select!`, the branches that lose are dropped mid-flight, so a future that is not cancellation-safe, such as one that has read half a message, loses that data. Check each branch's cancellation safety, or move the work into a spawned task."

[[note]]
level = "advanced"
topic = "APIs"
text = "In Node's `fetch`, a response whose body you never read or cancel keeps its connection busy, so a loop that checks only `res.status` can stall once the pool runs out; consume the body or call `res.body?.cancel()`."

[[note]]
level = "advanced"
topic = "Java"
text = "`parallelStream()` runs on the JVM-wide common `ForkJoinPool`, so blocking I/O inside it can starve every other parallel stream in the process. Keep parallel streams for CPU-bound work."

[[note]]
level = "advanced"
topic = "C"
text = "`strtok` keeps its position in hidden static state, so nested tokenizing loops, or two threads using it at once, corrupt each other's results. Use `strtok_r`, which keeps that state in a variable you pass in."

[[note]]
level = "advanced"
topic = "C"
text = "Operands narrower than `int` are promoted to `int`, so multiplying two `uint16_t` values near 65535 overflows a signed `int`, which is undefined behavior. Cast one operand to `uint32_t` before multiplying."

[[note]]
level = "advanced"
topic = "SQL"
text = "In PostgreSQL, `INSERT ... ON CONFLICT DO NOTHING RETURNING id` returns no row when the row already exists, so code expecting an ID gets nothing. Select the existing row afterward, or use `DO UPDATE` so `RETURNING` has a row to return."

[[note]]
level = "advanced"
topic = "SQL"
text = "In PostgreSQL, `now()` returns the start time of the current transaction, so every row written in a long transaction gets the same timestamp. Use `clock_timestamp()` when you need the actual time of each statement or row."

[[note]]
level = "advanced"
topic = "Databases"
text = "InnoDB's default `REPEATABLE READ` locks the gaps between index records during locking reads and updates, so concurrent inserts into a scanned range block or deadlock. Expect it when many sessions insert near the same keys, and consider `READ COMMITTED`."

[[note]]
level = "advanced"
topic = "Databases"
text = "Inserting rows with explicit IDs into a PostgreSQL serial or identity column does not advance its sequence, so later inserts fail with duplicate key errors. Reset the sequence with `setval` after bulk loads or restores."

[[note]]
level = "advanced"
topic = "HTTP"
text = "curl sends `Expect: 100-continue` before large request bodies and waits up to a second for the server's go-ahead, so a server or proxy that ignores the header adds that delay to every upload. Send `-H 'Expect:'` to turn it off."

[[note]]
level = "advanced"
topic = "HTTP"
text = "nginx closes a proxied request when the backend sends nothing for `proxy_read_timeout`, 60 seconds by default, so slow reports fail with a `504` while the backend keeps working. Raise it for those routes, or make the work asynchronous."

[[note]]
level = "advanced"
topic = "Security"
text = "An OAuth callback that does not check a `state` value bound to the user's session can be fed an attacker's authorization code, logging the victim into the attacker's account. Generate `state` for each login attempt and verify it, and use PKCE."

[[note]]
level = "advanced"
topic = "Security"
text = "Writing user input into logs unescaped lets an attacker insert newlines that forge extra entries, or terminal escape sequences that act on whoever views the log. Escape control characters, or log structured fields such as JSON."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Worker processes started with `fork` inherit NumPy's global random state, used by `np.random.rand`, and it is not reseeded, so every worker draws the same numbers. Give each worker its own `np.random.default_rng` with a distinct seed."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "Certificate validity, TOTP codes and JWT `exp` and `nbf` claims all depend on the local clock, so a host with a skewed clock rejects valid credentials or accepts expired ones. Keep time synchronized and allow only a small, explicit leeway."

[[note]]
level = "advanced"
topic = "Containers"
text = "Containers on Docker's default `bridge` network cannot reach each other by name; only user-defined networks provide name resolution between containers. Create one with `docker network create` and attach both containers."

[[note]]
level = "advanced"
topic = "Time"
text = "JavaScript's `getTimezoneOffset()` returns minutes to add to local time to reach UTC, so it is positive west of UTC: New York in winter gives `300`, not `-300`. Code that treats it as the zone's UTC offset shifts every time by twice the offset."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "If a container sets a limit but no request, Kubernetes sets the request equal to the limit, so pods reserve far more than they use and nodes look full. Set requests explicitly to typical usage."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Cleanup jobs that delete whatever an API no longer lists will delete everything when that API returns an empty list during an outage. Make them refuse to act when the deletion set is unusually large, and require a human to confirm."

[[note]]
level = "advanced"
topic = "Networking"
text = "A TCP connection whose peer vanished, after a crash or a network cut, can stay open on your side indefinitely if you only wait to read, so a blocking read hangs forever. Set read timeouts on every socket and client."

[[note]]
level = "advanced"
topic = "Networking"
text = "A NAT gateway can hold only a limited number of connections to any one destination address and port, so many workers calling one external API can exhaust its source ports and fail intermittently. Reuse connections, and add NAT addresses if needed."

[[note]]
level = "advanced"
topic = "DNS"
text = "An `MX` or `NS` record must name a host with its own address records, not an alias defined by a CNAME, and some mail servers reject or mishandle mail for domains that break this rule. Point them at the final host name."

[[note]]
level = "advanced"
topic = "Time"
text = "MySQL converts `TIMESTAMP` values from the session time zone to UTC on write and back on read, while `DATETIME` is stored as written, so the same row reads differently on connections with different `time_zone` settings. Set the session time zone explicitly."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Truncating a UTF-8 string at a byte limit can split a multibyte character and produce invalid text that later fails to decode. Cut at a character boundary by backing up over continuation bytes, which match `10xxxxxx`."

[[note]]
level = "advanced"
topic = "Regex"
text = "In Ruby, `^` and `$` match at every line boundary, so a validation like `/^\\d+$/` accepts a string with a malicious second line. Use `\\A` and `\\z` to anchor to the whole string."

[[note]]
level = "advanced"
topic = "Performance"
text = "CPU frequency scaling and turbo boost change clock speed with temperature and load, so back-to-back benchmark runs on one laptop can differ by tens of percent. Benchmark on a quiet machine with a fixed frequency, and repeat each run."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "If an Ansible play fails after a task notified a handler, the handler does not run, and on the next run that task reports no change, so the service never restarts with the new config. Use `--force-handlers` or `force_handlers: true`."

[[note]]
level = "advanced"
topic = "Containers"
text = "An image built `FROM scratch` has no CA certificates, so a static binary in it usually fails TLS connections with an unknown-authority error. Copy `/etc/ssl/certs/ca-certificates.crt` in from a builder stage."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Debugging an optimized build shows variables as optimized out and steps through lines out of order. Reproduce with `-O0 -g` or `-Og`, and keep in mind that some bugs only appear with optimization."

[[note]]
level = "advanced"
topic = "CI"
text = "In GitLab CI, jobs whose `rules` match both branch pushes and merge request events run twice for each push, once in a branch pipeline and once in a merge request pipeline. Add `workflow: rules` that pick one pipeline type."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "Setting a random seed does not make parallel or GPU computations reproducible: thread scheduling and nondeterministic GPU kernels still change the results. Enable your framework's deterministic mode, and fix thread counts, when results must match exactly."

[[note]]
level = "advanced"
topic = "Versioning"
text = "In SemVer, pre-release identifiers made only of digits compare numerically, but others compare as ASCII text, so `1.0.0-rc9` sorts after `1.0.0-rc10`. Separate the number with a dot: `rc.9`, `rc.10`."

[[note]]
level = "advanced"
topic = "Releases"
text = "Deleting the previous release's hashed asset files during a deploy breaks users who still have the old HTML open or cached, because it references those files. Keep old assets available for a while after each release."

[[note]]
level = "advanced"
topic = "Tooling"
text = "If a file named `test` or `clean` exists, `make test` treats the target as up to date and does nothing. Declare targets that do not produce files in `.PHONY`."

[[note]]
level = "advanced"
topic = "Code review"
text = "Moving code and changing it in the same commit buries the real change inside a large move in the diff. Move in one commit and modify in the next, or review with `git diff --color-moved` to see what actually changed."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "`setTimeout` stores its delay as a 32-bit signed integer, so a delay above 2147483647 ms (about 24.8 days) fires almost immediately. Chain shorter timers when you need to wait longer."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "Express 4 does not catch errors from `async` route handlers, so a rejected promise skips your error middleware and leaves the request hanging or crashes the process. Wrap handlers so rejections reach `next(err)`, or use a version that handles promises."

[[note]]
level = "advanced"
topic = "Git"
text = "With `rerere.enabled`, Git reapplies a recorded conflict resolution automatically, including a wrong one. After fixing a bad resolution, run `git rerere forget <path>` so it is not replayed next time."

[[note]]
level = "advanced"
topic = "Go"
text = "A panic in any goroutine crashes the whole program, and `recover` works only in a deferred call on that same goroutine, so an HTTP middleware's recover does not protect goroutines a handler starts. Recover inside each goroutine that might panic."

[[note]]
level = "advanced"
topic = "Shell"
text = "`wait` with no arguments returns 0 even if background jobs failed. Save each `$!` and call `wait \"$pid\"` for each job to collect its exit status."

[[note]]
level = "advanced"
topic = "Shell"
text = "`sort -k2` sorts on everything from the second field to the end of the line, not on the second field alone, so later fields break ties in ways you did not ask for. Write `-k2,2`, and `-k2,2n` for numbers."

[[note]]
level = "advanced"
topic = "Linux"
text = "`nice` lowers only CPU priority, so a low-priority backup can still saturate the disk and stall your database. Add `ionice -c3` (idle class), and check that your disk's I/O scheduler honors I/O priorities."

[[note]]
level = "advanced"
topic = "Linux"
text = "On many distributions `/tmp` is a RAM-backed `tmpfs` that is emptied at every boot, so large or long-lived files there consume memory and vanish on reboot. Use `/var/tmp` for temporary data that must survive a reboot."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "Service containers and job containers work only on Linux runners, so a workflow that declares `services:` fails on the macOS and Windows jobs of a cross-platform matrix. Run those services another way there, or test them on Linux only."

[[note]]
level = "advanced"
topic = "Python"
text = "Daemon threads are stopped abruptly when the interpreter exits, without running `finally` blocks or flushing their work, so a background writer started with `daemon=True` can lose data. Use a normal thread and join it during shutdown."

[[note]]
level = "advanced"
topic = "JavaScript"
text = "`readable.pipe(writable)` neither forwards errors nor closes the other stream when one fails, so a failed source can leave the destination open and leak a file handle. Use `stream.pipeline()`, which propagates errors and destroys every stream in the chain."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "Setting `lib` to a newer ECMAScript version lets you call APIs such as `Array.prototype.at` even where your runtimes lack them; TypeScript does not polyfill, so the code type-checks and then throws where the method is missing. Match `lib` to your oldest runtime."

[[note]]
level = "advanced"
topic = "Go"
text = "`json.Unmarshal` ignores unknown fields and leaves missing ones at their zero values, so a misspelled key yields a silent zero. Use a `Decoder` with `DisallowUnknownFields`, and pointer fields where absent must differ from zero."

[[note]]
level = "advanced"
topic = "Rust"
text = "Reference cycles of `Rc` or `Arc` are never freed, because each value keeps the other's count above zero. Use `Weak` for back-references such as parent pointers."

[[note]]
level = "advanced"
topic = "Java"
text = "Changing a field that `hashCode` uses after putting an object into a `HashMap` or `HashSet` strands it in the wrong bucket, where `get`, `contains` and `remove` can no longer find it. Use immutable keys."

[[note]]
level = "advanced"
topic = "Java"
text = "`SimpleDateFormat` is not thread-safe, and one instance shared across threads produces wrong dates without throwing. Use the immutable `DateTimeFormatter` from `java.time`."

[[note]]
level = "advanced"
topic = "C"
text = "Shifting by the width of the type or more, as in `x << 32` for a 32-bit `x`, is undefined behavior, and x86 masks the count so it can act like `x << 0`. Check the shift amount before shifting."

[[note]]
level = "advanced"
topic = "SQL"
text = "In MySQL, comparing a string column to a number, as in `WHERE code = 123`, converts each row's value to a number, so the index is skipped and a value like `'123abc'` matches. Compare against a string literal."

[[note]]
level = "advanced"
topic = "Rust"
text = "A thread that panics while holding a `std::sync::Mutex` poisons it, so every later `lock().unwrap()` panics too and one failure spreads through the program. Decide deliberately whether to recover the data with `PoisonError::into_inner`."

[[note]]
level = "advanced"
topic = "HTTP"
text = "nginx rejects request bodies larger than `client_max_body_size`, 1 MB by default, with a `413`, so uploads that work against the app directly fail behind the proxy. Set the limit deliberately for upload routes."

[[note]]
level = "advanced"
topic = "Security"
text = "Validating input before it is decoded or normalized lets encoded forms slip through: `%2e%2e%2f` passes a check for `../` and turns into `../` at a later decoding step. Decode and normalize completely first, then validate the final value."

[[note]]
level = "advanced"
topic = "Java"
text = "`Collections.unmodifiableList` returns a read-only view, not a copy, so later changes to the underlying list still show through it. Use `List.copyOf` when you need an immutable snapshot."

[[note]]
level = "advanced"
topic = "Cryptography"
text = "`openssl enc` without `-pbkdf2` derives the key from the password with a single fast hash, so files it encrypts are cheap to brute-force. Pass `-pbkdf2` with a high `-iter`, or use a tool designed for file encryption."

[[note]]
level = "advanced"
topic = "Containers"
text = "Every `RUN` after an `ARG` declaration sees the value as an environment variable, so a value that changes on every build, such as a commit hash or a date, invalidates the cache for all of those steps. Declare such arguments just before the step that uses them."

[[note]]
level = "advanced"
topic = "Testing"
text = "Wrapping each test in a transaction that is rolled back means nothing ever commits, so deferred constraints, commit hooks and anything reading from another connection are never exercised. Keep some tests that commit for real against a disposable database."

[[note]]
level = "advanced"
topic = "Testing"
text = "`coverage.py` measures only the process it starts unless configured otherwise, so code that runs in subprocesses or `multiprocessing` workers shows as never executed. Enable parallel mode and subprocess measurement, then run `coverage combine`."

[[note]]
level = "advanced"
topic = "Java"
text = "Java `int` and `long` arithmetic wraps silently on overflow, so a total of large values can turn negative without any error. Use `Math.addExact` and `Math.multiplyExact`, which throw on overflow, wherever it can happen."

[[note]]
level = "advanced"
topic = "DNS"
text = "nginx resolves a hostname in `proxy_pass` once at startup and keeps using those addresses, so a backend whose IP changes becomes unreachable. Use a `resolver` directive with a variable in `proxy_pass` to re-resolve by TTL."

[[note]]
level = "advanced"
topic = "Time"
text = "A cron entry for day 31, as in `0 0 31 * *`, runs only in the seven months that have one, and entries for day 29 or 30 skip February in most or all years. Schedule monthly jobs on day 1, or check for the last day inside the script."

[[note]]
level = "advanced"
topic = "Unicode"
text = "Linux file names are arbitrary bytes, not necessarily valid UTF-8, so a program that decodes every name strictly crashes on the first odd file. Handle undecodable names, for example with Python's `os.fsencode` and `os.fsdecode`, which round-trip them."

[[note]]
level = "advanced"
topic = "Regex"
text = "Passing a flag as the fourth positional argument of `re.sub`, as in `re.sub(p, r, s, re.IGNORECASE)`, sets `count` instead of `flags`, so matching stays case-sensitive and at most two matches are replaced. Pass `flags=re.IGNORECASE` by keyword."

[[note]]
level = "advanced"
topic = "Performance"
text = "When a popular cache entry expires, every request misses at once and they all hit the database together (a cache stampede). Refresh entries before expiry, add jitter to TTLs, or let one request recompute while the rest wait."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Autoscaling on CPU does nothing for a service that waits on I/O or a connection pool: latency climbs while CPU stays low. Scale on the signal that saturates first, such as concurrency or queue depth."

[[note]]
level = "advanced"
topic = "Testing"
text = "An assertion inside a callback or promise handler that never runs lets the test pass without checking anything. Await the promise in the test, and in Jest declare the expected count with `expect.assertions(n)`."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Debug output written with `printf` to a pipe or file is buffered, so when the program crashes the last lines, often the ones you need, never appear. Write it to `stderr`, which is unbuffered, or flush after each line."

[[note]]
level = "advanced"
topic = "CI"
text = "A commit message containing `[skip ci]` suppresses `push` and `pull_request` workflows in GitHub Actions, so required checks stay pending and block the merge. Keep skip markers out of commits that must be checked."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "Pinning an action to a commit SHA does not pin what it fetches: a composite action can reference other actions by tag, and its scripts can download tools at run time. Review what a pinned action pulls in when it runs."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "`pip install -r requirements.txt` with ranged or unpinned entries resolves fresh versions on every build, so two builds of the same commit can differ. Pin the whole tree with hashes, for example with `pip-compile --generate-hashes`."

[[note]]
level = "advanced"
topic = "Web"
text = "Cross-origin requests with a JSON body or a custom header trigger a preflight `OPTIONS` request first, adding a round trip unless the server sends `Access-Control-Max-Age` so the browser can cache the answer. Measure preflight cost on chatty APIs."

[[note]]
level = "advanced"
topic = "APIs"
text = "Tightening validation on an existing field, such as a shorter maximum length or a stricter format, breaks clients that relied on the old limits even though the schema looks unchanged. Treat it as a breaking change."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Acknowledging a queue message as soon as it arrives, before the work is done, loses it if the consumer crashes mid-task. Acknowledge only after the work has been committed."

[[note]]
level = "advanced"
topic = "Observability"
text = "In Prometheus, take `rate()` of each counter before aggregating with `sum()`. Summing raw counters first, for example in a recording rule, turns one instance's restart into a fake counter reset and a false spike."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Ansible `command` and `shell` tasks run on every play and always report changed unless you add `creates`, `removes` or `changed_when`, so playbooks are not idempotent. Prefer a purpose-built module where one exists."

[[note]]
level = "advanced"
topic = "Architecture"
text = "A circuit breaker that counts client errors such as `400` or `404` as failures can trip on one caller's bad requests and cut everyone off from a healthy service. Count only timeouts, connection errors and server errors."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Computing a midpoint as `(lo + hi) / 2` overflows with fixed-width integers when both indexes are large, a bug that sat in widely used binary search code for years. Write `lo + (hi - lo) / 2`."

[[note]]
level = "advanced"
topic = "Data"
text = "In pandas, an integer column with any missing value becomes `float64`, so large IDs lose precision and print with a trailing `.0`. Use the nullable `Int64` dtype, or read ID columns as strings."

[[note]]
level = "advanced"
topic = "Versioning"
text = "A Go module at major version 2 or later must end its module path with the major version, such as `/v2`; tagging `v2.0.0` without updating `go.mod` leaves users unable to require it as v2."

[[note]]
level = "advanced"
topic = "Releases"
text = "Switching all traffic from blue to green at once drops in-flight requests, and sessions held in the old instances' memory disappear. Drain connections before the switch, and keep session state outside the application servers."

[[note]]
level = "advanced"
topic = "Debugging"
text = "A long garbage-collection pause stops every application thread, so the process misses heartbeats and lease renewals and looks dead to its peers although nothing crashed. Check GC logs for long pauses before blaming the network."

[[note]]
level = "advanced"
topic = "Incidents"
text = "Restarting a misbehaving service can erase the evidence you need, such as stuck thread state, heap contents and in-memory logs. When it takes only seconds, capture a thread dump or core file before restarting."

[[note]]
level = "advanced"
topic = "Rust"
text = "Cargo unifies features across the dependency graph, so a feature that one crate enables is on for every crate that uses that dependency, and a feature that removes behavior breaks the others. Keep features additive."

[[note]]
level = "advanced"
topic = "Debugging"
text = "Profiling a JIT-compiled runtime such as Node or the JVM with Linux `perf` shows its frames as raw addresses or `[unknown]` unless the runtime writes a perf map, such as Node's `--perf-basic-prof` flag."

[[note]]
level = "advanced"
topic = "Observability"
text = "Trace context usually lives in thread-local or async-local storage, so work handed to a thread pool, queue or callback loses it and shows up as a separate, orphaned trace. Pass the context along explicitly, or use your tracing library's executor wrappers."

[[note]]
level = "advanced"
topic = "TypeScript"
text = "By default, TypeScript drops an import whose names are used only as types, so a module imported that way for its side effects, such as registering plugins, never runs. Import side-effect modules with a bare `import './register'`."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "A check-then-act sequence, such as reading a key and inserting it if missing, races even when each individual call is thread-safe. Make the whole sequence atomic, for example with `ConcurrentHashMap.computeIfAbsent` in Java or a lock around both steps."

[[note]]
level = "advanced"
topic = "Concurrency"
text = "After `fork()` in a multithreaded program, the child has only the thread that called it, and a lock another thread held stays locked forever. Call only async-signal-safe functions in the child before `exec`, or avoid forking threaded processes."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "A linked list often loses to an array even for insertions in the middle, because following pointers misses the CPU cache while arrays are scanned sequentially. Measure before choosing a structure by its Big-O alone."

[[note]]
level = "advanced"
topic = "Performance"
text = "Two threads updating different variables that share a cache line slow each other down as the line bounces between cores (false sharing). Pad or align hot per-thread counters to separate cache lines."

[[note]]
level = "advanced"
topic = "Performance"
text = "A second run of an I/O benchmark reads from the page cache and looks far faster than the first. Drop caches between runs, as root with `sync` and then `echo 3 > /proc/sys/vm/drop_caches`, or measure warm and cold cases on purpose."

[[note]]
level = "advanced"
topic = "Java"
text = "`String.format(\"%.2f\", x)` uses the default locale, so on a German system it writes `3,14` and breaks any CSV, JSON or SQL built from it. Pass `Locale.ROOT` when the output is meant for machines."

[[note]]
level = "advanced"
topic = "Web"
text = "Browsers cap each cookie at about 4 KB and silently drop larger ones, so a session cookie that grows, such as a JWT with many claims, suddenly stops being stored and users are logged out. Keep cookies small and store data server-side."

[[note]]
level = "advanced"
topic = "Regex"
text = "In JavaScript, `String.prototype.replace` interprets `$&`, `$1` and `$$` in the replacement string even when the pattern is a plain string, so user-supplied replacement text can be mangled. Pass a function as the replacement to insert text literally."

[[note]]
level = "advanced"
topic = "Time"
text = "When both the day-of-month and day-of-week fields of a cron entry are restricted, cron runs the job when either matches, so `0 0 1 * 1` runs on the 1st and on every Monday. Check the second condition inside the script if you need both."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "A positive `tabindex` pulls an element ahead of the natural tab order, so keyboard navigation jumps around the page unpredictably. Use only `tabindex=\"0\"` or `tabindex=\"-1\"`, and fix the DOM order instead."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "Maven settles version conflicts by taking the declaration nearest to your project, not the highest version, so a transitive dependency can be silently downgraded below what another library needs. Pin shared versions in `dependencyManagement`."

[[note]]
level = "advanced"
topic = "Observability"
text = "PromQL's `rate()` assumes a counter, so applied to a gauge such as queue length it treats every drop as a counter reset and returns nonsense. Use `deriv()` or `delta()` for gauges."

[[note]]
level = "advanced"
topic = "Kubernetes"
text = "Client-side `kubectl apply` stores the whole manifest in a `last-applied-configuration` annotation, which fails once it exceeds the 256 KB annotation size limit, as large CRDs do. Use `kubectl apply --server-side` for such objects."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Amazon S3 `ListObjectsV2` returns at most 1,000 keys per call, so code that ignores the continuation token silently processes only the first page. Use the SDK's paginator for every list call."

[[note]]
level = "advanced"
topic = "Debugging"
text = "When a fix seems to have no effect, confirm that the running code is the code you built: a stale cache, an old container image or a second instance can keep serving the old version. Log the build commit at startup."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Temporary cloud credentials, such as an assumed role's session, expire after a set time, so a long batch job that reads them once at startup fails partway through. Use SDK credential providers that refresh automatically instead of copying keys into the environment."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "A Bloom filter's false-positive rate climbs steeply once it holds more items than it was sized for, and entries cannot be removed. Size it for the maximum item count and target rate, and rebuild it when you outgrow that."

[[note]]
level = "advanced"
topic = "GitHub Actions"
text = "A step with `continue-on-error: true` lets its job succeed even when that step fails, so a broken linter or security scan can go unnoticed for months. Use it only for experimental steps, and report their results somewhere people look."

[[note]]
level = "advanced"
topic = "DNS"
text = "If secondary nameservers cannot reach the primary for longer than the zone's SOA `expire` value, they stop answering for the zone entirely, so a long primary outage takes the secondaries down with it. Set `expire` to weeks, not hours."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "Consistent hashing with a single point per server on the ring spreads keys unevenly, so some servers can carry several times the load of others. Place many virtual nodes per server to even out the distribution."

[[note]]
level = "advanced"
topic = "Supply chain"
text = "A lockfile protects you only until someone regenerates it: an update command or a bot pull request can pull in a freshly published malicious version. Review lockfile diffs like code, and prefer versions that have been public for a few days."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "npm can install two copies of the same package at different versions, and then `instanceof` checks and module-level singletons fail across them. Check with `npm ls <package>`, and deduplicate with `npm dedupe` or aligned version ranges."

[[note]]
level = "advanced"
topic = "Dependencies"
text = "`replace` directives in a Go module's `go.mod` apply only when it is the main module, so a library that relies on one works in its own tests and breaks for its users. Fix the dependency upstream, or require a fixed version instead."

[[note]]
level = "advanced"
topic = "Web"
text = "An `<iframe sandbox>` that grants both `allow-scripts` and `allow-same-origin` to content from your own origin lets that content remove its own sandbox, so it protects nothing. Serve untrusted content that needs scripts from a separate origin."

[[note]]
level = "advanced"
topic = "Web"
text = "Pages that perform sensitive actions can be loaded in an invisible frame on another site and clicked through (clickjacking). Send `Content-Security-Policy: frame-ancestors 'self'`, or `X-Frame-Options: DENY` for older browsers."

[[note]]
level = "advanced"
topic = "Algorithms"
text = "A Java comparator that is not consistent, such as one that returns random results or mishandles ties or `NaN`, can make `Collections.sort` throw an `IllegalArgumentException` or leave the list misordered. Keep comparisons consistent and transitive."

[[note]]
level = "advanced"
topic = "Data"
text = "Oracle Database treats an empty string as `NULL`, so `WHERE name = ''` matches nothing and `NOT NULL` columns reject empty strings. Code ported from PostgreSQL or MySQL misbehaves on empty values unless you handle them explicitly."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Message queues deliver at least once in practice, so consumers see duplicates after retries, redeliveries or consumer rebalances. Make handlers idempotent rather than relying on exactly-once settings."

[[note]]
level = "advanced"
topic = "Architecture"
text = "Caching error responses or not-found results with the same long TTL as normal data turns a brief failure into a long one, since callers keep getting the cached error after the backend recovers. Give negative entries short TTLs."

[[note]]
level = "advanced"
topic = "Observability"
text = "A dashboard that averages a metric across all hosts can look healthy while one host fails every request. Break graphs down by instance, or plot the maximum next to the average."

[[note]]
level = "advanced"
topic = "Code review"
text = "When a pull request changes both the code and the tests that cover it, a passing build proves little, since the tests may have been edited to match a bug. Review test changes as carefully as code changes."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Terraform needs `for_each` and `count` keys at plan time, so deriving them from attributes of resources created in the same run fails with an error that the value cannot be determined until apply. Build keys from input variables or static values."

[[note]]
level = "advanced"
topic = "Infrastructure as code"
text = "Terraform providers fall back to environment variables and local profiles when the configuration does not pin them, so the same code can plan against a different cloud account on another machine. Pin the expected account, for example with `allowed_account_ids`."

[[note]]
level = "advanced"
topic = "Cloud"
text = "An IAM policy with `\"Action\": \"s3:*\"` on `\"Resource\": \"*\"` grants deleting objects and rewriting bucket policies on every bucket in the account, not just reads. Scope actions and resources to what the workload actually uses."

[[note]]
level = "advanced"
topic = "Cloud"
text = "Autoscaling reacts only after load has risen, and new instances take time to boot and warm up, so a sudden spike is served by whatever is already running. Keep headroom, or scale ahead of known peaks."

[[note]]
level = "advanced"
topic = "Data"
text = "JSON parsers disagree about duplicate keys: most keep the last value, some report an error and some return every pair, so two services can read the same payload differently. Reject duplicate keys at trust boundaries."

[[note]]
level = "advanced"
topic = "Data"
text = "JSON allows escapes such as `\\ud800` for an unpaired UTF-16 surrogate, which has no valid UTF-8 encoding, so a document one parser accepts can make another fail or insert replacement characters. Reject lone surrogates at the boundary."

[[note]]
level = "advanced"
topic = "Data"
text = "Files saved as UTF-8 by Excel often begin with a byte order mark, so the first header reads as `\\ufeffid` instead of `id` and lookups by column name fail. Open such files with `encoding='utf-8-sig'` in Python."

[[note]]
level = "advanced"
topic = "Tooling"
text = "In a Makefile recipe, `$VAR` is expanded by make before the shell sees it, so `$HOME` becomes the value of the make variable `H` followed by `OME`. Write `$$HOME` to pass a literal dollar sign to the shell."

[[note]]
level = "advanced"
topic = "Tooling"
text = "`make` decides what to rebuild from file timestamps, so copying files with preserved timestamps, or building on a share whose clock is skewed, can leave stale outputs that look up to date. Run a clean build before releases and whenever results look inconsistent."

[[note]]
level = "advanced"
topic = "DNS"
text = "On hosts running systemd-resolved, `/etc/resolv.conf` usually points at the local stub `127.0.0.53`, which means nothing inside a container's own network namespace. Give containers and cluster DNS servers `/run/systemd/resolve/resolv.conf`, which lists the real upstreams."

[[note]]
level = "advanced"
topic = "Networking"
text = "On a Linux host with two interfaces, strict reverse path filtering (`rp_filter=1`) drops packets that arrive on an interface it would not use to reply, so traffic from a second network silently disappears. Use policy routing, or loose mode (`2`)."

[[note]]
level = "advanced"
topic = "Accessibility"
text = "Client-side route changes in a single-page app do not move focus or announce the new page, so screen reader users are left on the link they activated. After navigation, move focus to the new page's main heading or announce its title."

[[note]]
level = "advanced"
topic = "Releases"
text = "A feature flag that stays in the code after launch leaves two code paths to maintain, and flipping it years later exercises the one nobody has run. Remove flags once the rollout is complete."

[[note]]
level = "advanced"
topic = "Reproducibility"
text = "A lock file generated on one platform or Python version can leave out packages that only another needs, such as a Windows-only or version-specific dependency, so installs elsewhere fail or drift. Generate locks for every target, or use a tool that produces universal locks."

[[note]]
level = "advanced"
topic = "Versioning"
text = "Changing a default value, such as a timeout, page size or sort order, breaks callers who relied on it even though no signature changed. Treat default changes as breaking in your version numbers and release notes."

[[note]]
level = "professional"
topic = "Testing"
text = "A test that passes on retry still failed once. Retries hide flakiness until it reaches production; fix the cause, or track it with an owner and a date."

[[note]]
level = "professional"
topic = "Incidents"
text = "The engineer debugging an incident should not also be writing the status updates. Name an incident commander and a communications lead early, or updates stall while everyone stares at graphs."

[[note]]
level = "professional"
topic = "Networking"
text = "Pooled and keep-alive connections never look up DNS again, so after a service moves to new addresses, clients keep sending traffic to the old ones until those connections close. Cap connection lifetime so pools reconnect regularly."

[[note]]
level = "professional"
topic = "DNS"
text = "DNS round robin does no health checking: a dead server's address stays in the answers until someone removes it, and clients that cached it keep trying until the TTL runs out. Put a health-checked load balancer in front of anything critical."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Bucketing users with the same hash for every experiment, such as `hash(user_id) % 100 < 10`, puts the same users in the treatment group of every test, so experiments contaminate each other. Hash the user ID together with a per-experiment salt."

[[note]]
level = "professional"
topic = "Security"
text = "Clients control what they send in `X-Forwarded-For`, so the leftmost address can be anything. Trust only the entries appended by your own proxies, reading from the right, before using it for rate limits or audit logs."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Small buffers from `Buffer.from()` or `Buffer.allocUnsafe()` can be slices of a shared 8 KB pool, so `buf.buffer` may be the whole pool, not just your bytes; code that sends, stores or hashes `buf.buffer` without applying `byteOffset` and `length` can leak unrelated data."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Updating a ConfigMap does not change environment variables in running pods, which read them once at start, and mounted files update only after a delay, never through `subPath`. Roll the Deployment when its config changes."

[[note]]
level = "professional"
topic = "Containers"
text = "In shell form, `CMD node server.js` runs under `/bin/sh -c`, and the shell may not pass SIGTERM on, so every stop waits for the kill timeout. Use the exec form, `CMD [\"node\", \"server.js\"]`, so your process receives signals directly."

[[note]]
level = "professional"
topic = "Cloud"
text = "Many cloud quotas are set per account and per region, so a standby region you rarely use still has the default limits. Check instance, IP address and API quotas where you would fail over, before an outage forces you to scale there."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Terraform state stores resource attributes in plain text, including generated passwords and private keys. Keep it in a remote backend with encryption, locking and tight access control, and keep `terraform.tfstate` out of Git."

[[note]]
level = "professional"
topic = "Performance"
text = "Closed-loop load generators wait for each response before sending the next request, so when the server stalls they slow down with it and report latency that is far too good. Use a tool that sends requests at a fixed arrival rate."

[[note]]
level = "professional"
topic = "Releases"
text = "A rollback is only safe if the old version can read the data the new version wrote. Ship code that can read a new format one release before any code starts writing it."

[[note]]
level = "professional"
topic = "Teams"
text = "When only one person can operate a system, every vacation is a risk and every incident waits on them. Put that system in the on-call rotation and pair on its changes until at least two others can run it alone."

[[note]]
level = "professional"
topic = "Networking"
text = "Linux sends the first TCP keepalive probe only after two idle hours by default (`net.ipv4.tcp_keepalive_time`), while NAT gateways and load balancers drop idle flows much sooner. Enable keepalives with a shorter interval on long-lived connections."

[[note]]
level = "professional"
topic = "Observability"
text = "An error-ratio alert divides by zero when a service gets no traffic, and the resulting `NaN` never compares as true in PromQL, so `errors / requests > 0.05` stays silent exactly when traffic has stopped. Alert on missing traffic separately."

[[note]]
level = "professional"
topic = "JavaScript"
text = "Carrying on after an `uncaughtException` leaves a Node process in an unknown state, with half-finished work and leaked resources; log the error, stop taking traffic, exit and let your supervisor start a fresh process."

[[note]]
level = "professional"
topic = "JavaScript"
text = "On serverless platforms, module-level variables survive between invocations on a warm instance, so a value one request stores there, such as the current user, leaks into the next; keep per-request data inside the handler."

[[note]]
level = "professional"
topic = "Concurrency"
text = "A scheduled job defined inside the application runs once per replica, so scaling to ten pods sends ten copies of the nightly email. Run schedules from one place, such as a Kubernetes `CronJob`, or take a lease before running."

[[note]]
level = "professional"
topic = "Time"
text = "Measuring durations with wall-clock time breaks when the clock is stepped: timeouts can fire early or late, and elapsed times can go negative. Use a monotonic clock, such as `time.monotonic()` in Python or `System.nanoTime()` in Java."

[[note]]
level = "professional"
topic = "Shell"
text = "No `trap` runs when a script is killed with `SIGKILL`, as the OOM killer and `systemctl kill -s KILL` do, so the lock files and temporary directories it meant to clean up stay behind. Make startup code detect and clear stale locks from earlier runs."

[[note]]
level = "professional"
topic = "JavaScript"
text = "A top-level `await` in an ES module holds up every module that imports it, so a slow network call there delays the whole app's startup, or hangs it for good if the promise never settles."

[[note]]
level = "professional"
topic = "Dependencies"
text = "A range like `^1.4.0` accepts any future 1.x release, including one pushed from a hijacked maintainer account. In CI and production, install with `npm ci` or your tool's frozen-lockfile mode so new versions arrive only through reviewed lockfile changes."

[[note]]
level = "professional"
topic = "Shell"
text = "`ssh host cmd args` joins the arguments into one string that the remote shell parses again, so values containing spaces, quotes or `;` are split or executed there. Quote each value for the remote side, for example with Bash's `printf '%q'`, or pass data on stdin."

[[note]]
level = "professional"
topic = "Shell"
text = "`ssh host 'nohup job &'` can hang until the job finishes, because the job still holds the session's output streams open. Redirect all three, as in `ssh host 'nohup job > job.log 2>&1 < /dev/null &'`, so SSH can exit at once."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Reusing a nonce with the same AES-GCM key leaks the XOR of the two plaintexts and lets an attacker forge messages. Use a counter or a random 96-bit nonce, and rotate keys long before random nonces risk colliding."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Distinct counts do not add up: summing daily unique users over a week counts everyone who came back on several days more than once. Recount over the whole period, or merge HyperLogLog sketches rather than adding their estimates."

[[note]]
level = "professional"
topic = "Algorithms"
text = "A fixed-window rate limit of 100 requests per minute lets a client send 200 in two seconds: 100 at the end of one window and 100 at the start of the next. Use a sliding window or a token bucket where bursts matter."

[[note]]
level = "professional"
topic = "Code review"
text = "GitHub keeps a pull request's approvals when new commits are pushed unless branch protection dismisses stale approvals. Without that setting, code can merge that no reviewer has seen."

[[note]]
level = "professional"
topic = "Documentation"
text = "A runbook that has never been run usually fails at step one: a renamed dashboard, a retired command, a credential nobody has. Walk through runbooks during game days or on-call handoffs and fix them while nothing is on fire."

[[note]]
level = "professional"
topic = "Debugging"
text = "A regression that appears with every deploy may come from the restart itself, such as cold caches, JIT warm-up or a reconnect storm, rather than from the new code. Restart the old version the same way before you start bisecting commits."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "An unpinned `apt-get install` in a Dockerfile builds a different image whenever the mirror updates, so rebuilding an old commit does not reproduce the old image. Pin package versions where it matters and keep built images; a rebuild is not a rollback."

[[note]]
level = "professional"
topic = "Linux"
text = "Upgrading glibc, as happens when you move a database host to a new distribution release, can change how text sorts, which corrupts PostgreSQL indexes built with the old order. Plan a `REINDEX` of affected text indexes as part of the upgrade."

[[note]]
level = "professional"
topic = "Linux"
text = "With `Type=simple`, systemd considers a service started as soon as its process is launched, so units ordered `After=` it start before it can accept connections. Use `Type=notify` in services that support it, or have dependents retry until it is ready."

[[note]]
level = "professional"
topic = "GitHub"
text = "Removing someone from a private repository does not remove the clones on their machines. Treat any secret that was ever committed to that repository as exposed and rotate it when access is revoked."

[[note]]
level = "professional"
topic = "Debugging"
text = "Core dumps and heap dumps contain whatever was in memory: tokens, keys, customer data. Store them with the same access controls as production data, and keep them out of tickets and chat."

[[note]]
level = "professional"
topic = "Tooling"
text = "Git hooks run only on machines where they are installed, and `git commit --no-verify` skips them anyway. Run the same checks in CI as the enforced gate, and treat local hooks as fast feedback."

[[note]]
level = "professional"
topic = "Web"
text = "A third-party script tag runs with full access to your page, including form fields and session data. Prefer pinned vendor files with an `integrity` attribute (Subresource Integrity), or self-host them."

[[note]]
level = "professional"
topic = "Go"
text = "Go's `http.DefaultClient`, used by `http.Get`, has no timeout, so one slow upstream can pile up goroutines until the service stalls. Create an `http.Client` with `Timeout` set, or pass a context with a deadline."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Kafka clients do not all hash keys alike: the Java client's default partitioner uses murmur2, while librdkafka-based clients default to CRC32, so one key can land on different partitions depending on the producer's language. Set librdkafka's `partitioner` to `murmur2_random`."

[[note]]
level = "professional"
topic = "TypeScript"
text = "Raising `target` to `ES2022` or later turns on `useDefineForClassFields`, so a subclass field redeclared as `name!: string` now resets the value its base class set and shadows base accessors; write `declare name: string` for type-only redeclarations."

[[note]]
level = "professional"
topic = "JavaScript"
text = "A long synchronous task in Node.js, such as parsing a huge JSON body or calling `crypto.pbkdf2Sync`, blocks the event loop and stalls every other request on that process. Set body size limits and use the async APIs."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Status dashboards that show health only as red and green are hard to read for colorblind on-call engineers. Pair color with text, icons or position so an outage is obvious to everyone on the rotation."

[[note]]
level = "professional"
topic = "Linux"
text = "With `KillMode=process`, systemd stops only a unit's main process, so worker processes it forked keep running after a stop or restart and pile up alongside the new ones. Keep the default `control-group` unless you shut the children down yourself."

[[note]]
level = "professional"
topic = "Algorithms"
text = "Sharding with `hash(key) % N` remaps almost every key when N changes, so adding one cache node empties most of the cache at once. Use consistent or rendezvous hashing so a resize moves only a small share of keys."

[[note]]
level = "professional"
topic = "Incidents"
text = "When the last deploy is a plausible cause, roll it back before debugging it. A hotfix written under pressure adds untested change to a system you already do not understand; restore service first, then investigate."

[[note]]
level = "professional"
topic = "Observability"
text = "An alert on a metric that stops reporting never fires, because there is no data to cross the threshold. Add alerts for missing data, such as `absent()` in Prometheus, for every signal an alert depends on."

[[note]]
level = "professional"
topic = "Architecture"
text = "With cache-aside, a reader that misses can load the old value from the database, stall while a writer updates the row and deletes the cache key, then put its stale value back into the cache. Bound the damage with TTLs, or use versioned or leased entries."

[[note]]
level = "professional"
topic = "Databases"
text = "With asynchronous replication, a failover can lose the last transactions the old primary acknowledged. Know your replication mode, measure lag, and decide in advance whether a failover may drop writes or must wait."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "A deleted pod receives SIGTERM while its endpoint is still being removed from load balancers, so it can get new requests after shutdown starts. Keep serving for a few seconds, for example with a `preStop` sleep, before closing listeners."

[[note]]
level = "professional"
topic = "Tooling"
text = "GNU `sort` spills large inputs to temporary files in `$TMPDIR` or `/tmp`, so sorting a big file on a production host can fill that disk, or eat memory where `/tmp` is a tmpfs. Point it at roomy storage with `-T` and cap its buffer with `-S`."

[[note]]
level = "professional"
topic = "Incidents"
text = "Pages that need no action train responders to ignore pages. Every page should be urgent and actionable; demote everything else to a ticket or a dashboard, and review noisy alerts after each rotation."

[[note]]
level = "professional"
topic = "Incidents"
text = "A status page hosted on the same infrastructure, DNS or cloud account as your product goes down with it. Host it independently so you can still tell customers what is happening."

[[note]]
level = "professional"
topic = "Incidents"
text = "Declaring recovery when the error graph drops can be premature: queues, retries and caches may still be draining, and the backlog can trigger a second failure. Keep watching until backlogs are empty and metrics hold steady."

[[note]]
level = "professional"
topic = "Incidents"
text = "When a service comes back, every client retries at once and can knock it straight over again. Use exponential backoff with jitter in clients, and readmit traffic gradually with rate limits or load shedding after an outage."

[[note]]
level = "professional"
topic = "Incidents"
text = "Postmortem action items without an owner and a due date quietly expire, and the same incident happens again. Track them in the normal backlog and review their status in a recurring meeting."

[[note]]
level = "professional"
topic = "Testing"
text = "A load test driven from one machine often measures that machine: its CPU, ephemeral ports or connection pool run out before your service does. Watch the load generator's own resources, and spread the load across several hosts."

[[note]]
level = "professional"
topic = "Debugging"
text = "During an incident, check whether an error in the logs also appeared last week before chasing it. Many services log harmless errors all the time, and following one of them can burn the first hour of an outage."

[[note]]
level = "professional"
topic = "Incidents"
text = "A postmortem that ends at 'human error' stops before the useful part. Ask what let one mistaken command cause an outage, and fix the missing guardrail, review or alert rather than blaming the person."

[[note]]
level = "professional"
topic = "Debugging"
text = "A single trace or slow request can be unrepresentative, and fixes built on one example often miss the real cause. Before acting, check how many slow requests share the pattern, for example by grouping traces by their slowest span."

[[note]]
level = "professional"
topic = "SQL"
text = "With statement-based binary logging, MySQL replicas re-execute statements such as `UPDATE ... LIMIT` without `ORDER BY`, or ones calling `UUID()`, and can change different rows or store different values than the primary. Use row-based logging."

[[note]]
level = "professional"
topic = "Observability"
text = "Prometheus estimates histogram quantiles by interpolating within buckets, so if your SLO threshold falls inside a wide bucket, the reported p99 can be far off. Put a bucket boundary exactly at each latency threshold you alert on."

[[note]]
level = "professional"
topic = "TypeScript"
text = "`const enum` members are inlined as literal values wherever they are used, so after a library changes one, every consumer compiled against the old version keeps the old value until it rebuilds; export plain objects or string unions from public APIs."

[[note]]
level = "professional"
topic = "Tooling"
text = "`jq` reads a whole JSON document into memory before filtering it, so running it on a multi-gigabyte export can exhaust RAM on a shared host. Use `jq --stream`, or produce newline-delimited JSON that tools can process one record at a time."

[[note]]
level = "professional"
topic = "Observability"
text = "Logging full request or response objects sends tokens, passwords and personal data into a store that many people can read and that keeps it for months. Log an allowlist of fields and redact the rest at the source."

[[note]]
level = "professional"
topic = "Observability"
text = "An error count without the request count cannot tell a traffic spike from a failure spike. Alert on the error ratio, and fall back to absolute counts only for low-traffic services where ratios are noisy."

[[note]]
level = "professional"
topic = "Observability"
text = "Alerting on causes such as CPU or memory pages people for load that users never notice, and misses failures that do not move those graphs. Page on user-facing symptoms like errors and latency, and keep cause metrics for diagnosis."

[[note]]
level = "professional"
topic = "Architecture"
text = "Splitting a monolith into services that still share one database gives you network calls and partial failures without independent deploys. Give each service ownership of its data, or keep the monolith."

[[note]]
level = "professional"
topic = "Architecture"
text = "In a synchronous chain, availabilities multiply: a request that needs five services at 99.9% each is only about 99.5% available when their failures are independent. Cut hard dependencies, add fallbacks, or make calls asynchronous."

[[note]]
level = "professional"
topic = "Architecture"
text = "With at-least-once delivery, the usual guarantee from message brokers, consumers will see some messages twice after a redelivery. Make handlers idempotent, for example by recording processed message IDs in the same transaction as the effect."

[[note]]
level = "professional"
topic = "Architecture"
text = "A system that survives peak load only with a warm cache turns every cache flush, restart or failover into an outage. Load-test with a cold cache, and coalesce concurrent misses so a stampede cannot flatten the database."

[[note]]
level = "professional"
topic = "Architecture"
text = "Kafka orders messages only within a partition, so events for one entity spread across partitions can be processed out of order. Choose the partition key by the entity whose order matters, such as the account ID."

[[note]]
level = "professional"
topic = "Architecture"
text = "Last-writer-wins replication across regions silently discards one of two concurrent updates. If both regions accept writes to the same records, design explicit conflict resolution or give each record a single home region for writes."

[[note]]
level = "professional"
topic = "Architecture"
text = "An unbounded queue hides overload until memory runs out or latency reaches minutes. Bound every queue, reject or shed work when it is full, and alert on the age of the oldest item, not only the length."

[[note]]
level = "professional"
topic = "Networking"
text = "Without RPKI route origin validation, another network can announce your IP prefixes, by mistake or on purpose, and attract your traffic. Publish ROAs for your prefixes and check that your upstream providers validate routes."

[[note]]
level = "professional"
topic = "Databases"
text = "Long-running and idle-in-transaction sessions in PostgreSQL stop `VACUUM` from removing dead rows, and tables bloat. Watch `pg_stat_activity` for old `xact_start` values and set `idle_in_transaction_session_timeout`."

[[note]]
level = "professional"
topic = "Databases"
text = "If autovacuum cannot freeze old rows, PostgreSQL eventually stops accepting writes to protect against transaction ID wraparound. Monitor `age(datfrozenxid)` for each database and act long before it nears the limit."

[[note]]
level = "professional"
topic = "SQL"
text = "A query on a partitioned table that does not filter on the partition key has to scan every partition, so a table partitioned by date makes lookups by customer slower, not faster. Choose the key that your hottest queries filter on."

[[note]]
level = "professional"
topic = "SQL"
text = "PostgreSQL views run with their owner's privileges by default, so a view owned by the table owner or a superuser shows every row to anyone allowed to query it, bypassing row-level security. Create such views `WITH (security_invoker = true)`."

[[note]]
level = "professional"
topic = "Databases"
text = "PostgreSQL logical replication copies row changes but not schema changes, so a column added only on the publisher makes the subscriber's apply worker fail while lag grows. Apply DDL to subscribers first when adding columns."

[[note]]
level = "professional"
topic = "Databases"
text = "A 32-bit `integer` primary key tops out at 2,147,483,647, and busy tables reach it sooner than anyone expects, at which point inserts fail. Use `bigint` for new ID columns; widening a large table later is a painful migration."

[[note]]
level = "professional"
topic = "Databases"
text = "If `synchronous_standby_names` requires a standby that goes down and no other qualifies, every commit on the PostgreSQL primary waits indefinitely. Use a quorum such as `ANY 1 (s1, s2)` with at least two standbys, and alert on sync state."

[[note]]
level = "professional"
topic = "Databases"
text = "In MySQL, `utf8` is a three-byte encoding that cannot store characters outside the Basic Multilingual Plane, such as emoji. Use `utf8mb4` for columns, tables and connections, or those inserts will fail or be mangled."

[[note]]
level = "professional"
topic = "Security"
text = "JWTs stay valid until they expire, so logging a user out or disabling an account does not revoke tokens already issued. Keep access tokens short-lived and check session state or a revocation list for sensitive actions."

[[note]]
level = "professional"
topic = "Security"
text = "A CORS policy that reflects any `Origin` while sending `Access-Control-Allow-Credentials: true` lets every website make authenticated requests as your users. Compare origins against an explicit allowlist."

[[note]]
level = "professional"
topic = "Security"
text = "Removing someone from SSO does not always revoke the personal access tokens, SSH keys or API keys they created in each tool. Include those in offboarding, and prefer tools that tie tokens to SSO sessions."

[[note]]
level = "professional"
topic = "Security"
text = "Wildcard IAM permissions granted temporarily during an incident or a launch rarely get removed. Put an expiry date on elevated grants and review access against what the logs show is actually used."

[[note]]
level = "professional"
topic = "Databases"
text = "After a database failover or restart, every application instance reconnects and refills its pool at the same moment, and the burst of new connections, each with authentication and TLS setup, can overload the fresh primary. Add jittered backoff to reconnects."

[[note]]
level = "professional"
topic = "Supply chain"
text = "An SBOM stored as a build artifact that nobody indexes does not help when a critical vulnerability lands and you must find every service using a library within hours. Load SBOMs into a system you can query across all services."

[[note]]
level = "professional"
topic = "Supply chain"
text = "Lockfile diffs are rarely read, yet a changed `resolved` URL or `integrity` hash in `package-lock.json` can point a package at a different tarball. Review lockfile changes, or check in CI that every resolved URL uses your registry."

[[note]]
level = "professional"
topic = "Supply chain"
text = "A valid signature proves who published an artifact, not that the code is safe; a compromised maintainer account or build system signs malware too. Combine signature checks with build provenance and review of what changed."

[[note]]
level = "professional"
topic = "Networking"
text = "With cross-zone load balancing off, each load balancer node sends traffic only to targets in its own zone, so a zone with fewer healthy instances gets overloaded. Keep instance counts even across zones, or turn cross-zone balancing on."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "A container that exceeds its memory limit is killed by the kernel OOM killer with no warning, often mid-request. Size limits from observed peaks, and cap heaps and caches inside the app below the limit."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "CPU limits are enforced per scheduling period, so a bursty service can be throttled while the node has idle cores, adding latency spikes. Check `container_cpu_cfs_throttled_periods_total` before blaming the code."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "If a Deployment manifest sets `replicas` and an autoscaler also manages it, every `kubectl apply` resets the count, scaling you down mid-peak. Remove `replicas` from manifests for autoscaled workloads."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "Without topology spread constraints or anti-affinity, the scheduler may place every replica on the same node or zone, and one failure takes them all. Spread replicas explicitly and add a PodDisruptionBudget for drains."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "The default `imagePullPolicy` is `IfNotPresent` for any tag other than `latest`, so pushing new content under an existing tag leaves nodes running the old cached image. Use immutable tags or deploy by digest."

[[note]]
level = "professional"
topic = "TypeScript"
text = "When one package imports another's `.ts` source through `paths`, those files are checked with the importing package's compiler options, so a looser consumer hides errors the owner's stricter settings would catch; use project references instead."

[[note]]
level = "professional"
topic = "Tooling"
text = "Scripts that parse the human-readable output of tools like `ip`, `df` or `systemctl status` break when an upgrade or another locale changes the layout. Ask for machine-readable output instead, such as `ip -j addr`, `df --output=pcent` or `systemctl show -p ActiveState --value`."

[[note]]
level = "professional"
topic = "DNS"
text = "Very short TTLs make every client depend on your DNS provider moment to moment: with a 30-second TTL, an outage at the provider becomes your outage within a minute. Use short TTLs only where fast failover needs them."

[[note]]
level = "professional"
topic = "Data"
text = "Metrics averaged over current users, such as satisfaction or tenure, improve on their own as unhappy users leave, because the people who churned drop out of the data. Report by signup cohort, and include churned users."

[[note]]
level = "professional"
topic = "Containers"
text = "Alpine images use musl instead of glibc, so prebuilt glibc binaries will not run, and DNS resolution and memory allocation can behave differently. Test on the base image you ship, and switch to a glibc-based slim image if behavior differs."

[[note]]
level = "professional"
topic = "Containers"
text = "Container runtimes turn every line written to stdout into a separate log record, so a multiline stack trace reaches your log system as dozens of events, interleaved with other requests. Log each event as one line of JSON, or configure multiline parsing in the collector."

[[note]]
level = "professional"
topic = "Containers"
text = "A container that sizes its heap or thread pools from the host's CPUs and memory, rather than its own limits, overcommits badly on a large node. Check that your runtime reads cgroup limits, and set heap sizes explicitly if in doubt."

[[note]]
level = "professional"
topic = "Cloud"
text = "Many clouds bill traffic between availability zones, so a chatty service calling replicas in other zones can cost more than its servers. Check cross-zone data transfer in the bill and prefer zone-local routing where your platform supports it."

[[note]]
level = "professional"
topic = "Cloud"
text = "Spot and preemptible instances can be reclaimed with little notice, often in bulk when capacity tightens. Spread them across instance types and zones, handle the termination notice, and keep on-demand capacity for the baseline."

[[note]]
level = "professional"
topic = "Cloud"
text = "Cloud IAM changes are eventually consistent, so a role or policy created a moment ago may not work yet, and scripts that use it immediately fail intermittently. Retry with backoff after IAM changes instead of adding fixed sleeps."

[[note]]
level = "professional"
topic = "Cloud"
text = "On AWS Lambda, the concurrency limit is shared by all functions in an account and region, so one runaway function can throttle the others. Reserve concurrency for critical functions and cap the noisy ones."

[[note]]
level = "professional"
topic = "Cloud"
text = "A multi-region failover plan that needs the failed region's control plane, its DNS API, IAM or console, cannot run when that region is down. Rehearse failover with the primary region treated as completely unreachable."

[[note]]
level = "professional"
topic = "Cloud"
text = "Billing alerts arrive after the money is spent, and a runaway loop against a paid API can burn a month's budget overnight. Put hard quotas or rate limits on expensive services, not only budget notifications."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Renaming a resource in Terraform plans a destroy and a create, which for a database means data loss. Use a `moved` block or `terraform state mv` so Terraform knows it is the same object."

[[note]]
level = "professional"
topic = "TypeScript"
text = "With `declaration` output on, an exported value whose inferred type lives in another package's nested dependency fails with an error that it cannot be named without a reference to that path; annotate the export with a type you import directly."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "`terraform apply` without a saved plan computes a fresh plan, which may differ from the one that was reviewed if anything changed in between. Save it with `terraform plan -out=tfplan` and apply exactly that file."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "`prevent_destroy` only protects a resource while its block exists in the configuration; delete the block and Terraform destroys the resource without complaint. Enable provider-side deletion protection on critical data as well."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Changes made by hand in the cloud console drift from your Terraform code, and the next apply can revert them, emergency fixes included. Run scheduled plans to detect drift, and fold manual changes back into code."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "Without a committed `.terraform.lock.hcl`, a fresh `terraform init` can pick up a new provider release, and behavior changes between runs of the same code. Commit the lock file and upgrade providers deliberately."

[[note]]
level = "professional"
topic = "Infrastructure as code"
text = "`terraform apply -target` leaves the rest of the configuration unapplied, and routine use hides dependency and drift problems. Keep it for recovering from mistakes, then run a full plan to confirm nothing else is pending."

[[note]]
level = "professional"
topic = "Data"
text = "Testing twenty metrics at a 0.05 significance level gives about a 64% chance that at least one looks significant by pure chance. Name the primary metric before the experiment starts, and correct for multiple comparisons on the rest."

[[note]]
level = "professional"
topic = "Performance"
text = "When a request fans out to 100 backends, the chance that at least one is slower than its own p99 is about 63%, so the tail becomes the common case. Hedge requests, cap fan-out, or make stragglers optional."

[[note]]
level = "professional"
topic = "Performance"
text = "By Little's law, requests in flight equal throughput times latency, so when a dependency slows from 50 ms to 500 ms, the same traffic needs ten times the connections and threads. Size pools and timeouts for the slow case."

[[note]]
level = "professional"
topic = "Performance"
text = "A load test that replays one user or a small key set runs from hot caches and hot rows, and reports throughput production will never see. Use realistic key distributions and data volumes."

[[note]]
level = "professional"
topic = "Performance"
text = "Autoscaling takes minutes to add capacity, while traffic can double in seconds. Keep enough headroom to absorb a spike until new instances are ready, and shed load gracefully in the gap."

[[note]]
level = "professional"
topic = "Performance"
text = "A single hot key, such as a celebrity account or a global counter, overloads one shard no matter how many shards you add. Find hot keys from traffic data and split, replicate or cache them specifically."

[[note]]
level = "professional"
topic = "Releases"
text = "A global config push skips the canary your code deploys get, so a bad value reaches every server at once. Roll config changes out in stages with the same health checks and automatic rollback as code."

[[note]]
level = "professional"
topic = "Releases"
text = "A canary that gets 1% of traffic for five minutes may not see enough requests to reveal a regression, especially on rare paths. Size canary traffic and duration so the metrics you gate on are statistically meaningful."

[[note]]
level = "professional"
topic = "Releases"
text = "Feature flags that are never removed become permanent configuration, doubling the paths you must test and hiding dead code. Give each flag an owner and a removal date when you create it."

[[note]]
level = "professional"
topic = "Releases"
text = "A mobile app release cannot be rolled back on users' phones, and old versions keep calling your API long after you ship a fix. Keep the server compatible with every version still in use, and ship a remote kill switch for risky features."

[[note]]
level = "professional"
topic = "Releases"
text = "When the flag service is unreachable and nothing is cached, SDKs typically return the default passed in code, so a default of `true` can switch a risky feature on for everyone during an outage. Choose defaults that are safe, not convenient."

[[note]]
level = "professional"
topic = "Releases"
text = "Blue-green deployments switch code instantly but share one database, so both versions must work with the schema at every moment. Separate schema changes from code changes and keep each step backward compatible."

[[note]]
level = "professional"
topic = "Releases"
text = "Batching weeks of changes into one release makes a failure hard to attribute and the rollback huge. Ship smaller changes more often so each release has a short list of suspects."

[[note]]
level = "professional"
topic = "Teams"
text = "When a metric such as deploy frequency or story points becomes a target, teams optimize the number instead of the outcome. Use delivery metrics to find problems, not to rank teams or people."

[[note]]
level = "professional"
topic = "Teams"
text = "Services and alerts without a named owning team decay: nobody upgrades them, and pages go to whoever is around. Keep an ownership registry, and give orphans an owner before the next incident does it for you."

[[note]]
level = "professional"
topic = "Documentation"
text = "Decisions made in chat threads and hallway conversations are lost, and new people reopen them months later. Record significant ones as short architecture decision records kept next to the code."

[[note]]
level = "professional"
topic = "Teams"
text = "On-call that routinely pages people at night burns them out and drives away your most experienced engineers. Track pages per shift, fix the top sources, and compensate on-call time."

[[note]]
level = "professional"
topic = "Regex"
text = "Prometheus anchors regex label matchers, so `{path=~\"/api\"}` matches only the exact value `/api`, and a dashboard or alert meant to cover every API route quietly selects almost nothing. Write `/api.*` for a prefix."

[[note]]
level = "professional"
topic = "Teams"
text = "System boundaries tend to mirror team boundaries, so a reorg quietly redraws your architecture. Plan team structure and service ownership together, or the org chart will decide your interfaces for you."

[[note]]
level = "professional"
topic = "DNS"
text = "With split-horizon DNS, the internal and external views of a zone are separate copies, and a record added to one but not the other breaks only for people on one side of the network. Generate both views from a single source."

[[note]]
level = "professional"
topic = "Data"
text = "Checking an A/B test every day and stopping as soon as the p-value dips below 0.05 inflates the false-positive rate well above 5%. Fix the sample size in advance, or use a sequential test designed for repeated looks."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "Archives record each file's permission bits, and build machines with different `umask` settings create files with different modes, so the same commit yields tarballs with different checksums. Set the modes explicitly when packaging, as GNU tar's `--mode` does."

[[note]]
level = "professional"
topic = "Web"
text = "Over HTTP/1.1, each open `EventSource` holds one of the browser's six connections per host, so a user with several tabs of your app can exhaust them and stall every other request to that host; serve server-sent events over HTTP/2."

[[note]]
level = "professional"
topic = "Networking"
text = "Nagle's algorithm combined with delayed ACKs can add tens of milliseconds or more to small request-response exchanges. Set `TCP_NODELAY` on latency-sensitive sockets that send small writes."

[[note]]
level = "professional"
topic = "Networking"
text = "Overlapping private CIDR ranges cannot be peered or routed together, and renumbering a live network is painful. Allocate non-overlapping ranges for every VPC, office and partner link from one plan before you need to connect them."

[[note]]
level = "professional"
topic = "DNS"
text = "Resolvers cache negative answers too, for as long as the zone's SOA negative TTL allows, so a name looked up before it existed can keep failing after you create it. Create records before anything queries them."

[[note]]
level = "professional"
topic = "Regex"
text = "In nginx, regex `location` blocks are tried in the order they appear and the first match wins, unlike prefix locations, where the longest match wins. A broad regex placed above a specific one silently captures its requests, so order them from most to least specific."

[[note]]
level = "professional"
topic = "Web"
text = "An `unload` event listener, often left by an old analytics snippet, keeps pages out of the back/forward cache in many browsers, so every Back click becomes a full reload; listen for `pagehide` or `visibilitychange` instead."

[[note]]
level = "professional"
topic = "DNS"
text = "`dig` sends queries straight to a DNS server and ignores `/etc/hosts` and `nsswitch.conf`, so it can disagree with what your application sees. On Linux, `getent hosts` follows the same lookup path as glibc programs."

[[note]]
level = "professional"
topic = "DNS"
text = "An expired DNSSEC signature or a mismatched DS record makes validating resolvers return SERVFAIL for your entire domain. Automate re-signing, monitor signature expiry, and follow the documented order when rolling keys."

[[note]]
level = "professional"
topic = "DNS"
text = "SPF allows at most 10 DNS lookups during evaluation, and each `include:` counts, so adding one more email vendor can make SPF fail for all your mail. Count lookups, including nested includes, before adding a sender."

[[note]]
level = "professional"
topic = "Web"
text = "Safari caps cookies created with `document.cookie` at seven days, so a remember-me or consent cookie set from JavaScript expires far sooner than you asked; set long-lived cookies from the server with `Set-Cookie`."

[[note]]
level = "professional"
topic = "HTTP"
text = "Large or numerous cookies can exceed a proxy's header size limit, and those users get `400` or `431` errors that nobody else can reproduce. Keep cookies small, scope them by path and domain, and watch header sizes at the edge."

[[note]]
level = "professional"
topic = "HTTP"
text = "Returning `200 OK` with an error in the body hides failures from load balancers, caches, retries and dashboards that key on status codes. Use the right `4xx` or `5xx` status even when the body explains the error."

[[note]]
level = "professional"
topic = "Web"
text = "Browser extensions and built-in page translation rewrite the DOM, so frameworks that assume they own it can throw `removeChild` or hydration errors that only some users hit; reproduce with translation turned on before dismissing such reports."

[[note]]
level = "professional"
topic = "APIs"
text = "By Hyrum's law, clients depend on every observable behavior of your API, including field order, error text and timing. Treat any change as potentially breaking, and roll out behavior changes with the same care as schema changes."

[[note]]
level = "professional"
topic = "APIs"
text = "Adding a value to an enum in a response breaks clients that switch over it exhaustively or reject unknown values. Document from the start that new values may appear, and test clients against a value they have never seen."

[[note]]
level = "professional"
topic = "APIs"
text = "Webhook deliveries can arrive twice, late and out of order, and anyone can POST to your endpoint. Verify the signature, deduplicate by event ID, and fetch current state from the API instead of trusting the event order."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Untagged PDFs reach screen readers as one unstructured stream of text, and scanned ones as nothing at all; publish key documents as HTML, or export tagged PDFs and check their reading order."

[[note]]
level = "professional"
topic = "APIs"
text = "You cannot safely deprecate an endpoint if you do not know who calls it. Require client identification, such as an API key or a `User-Agent` convention, and log usage per endpoint well before announcing a removal."

[[note]]
level = "professional"
topic = "Accessibility"
text = "Vendor widgets such as cookie consent banners and chat bubbles can trap keyboard focus or hide the page from screen readers, and they appear on every page; test them like your own code before rolling them out."

[[note]]
level = "professional"
topic = "Concurrency"
text = "A lock with a TTL does not stop a client that paused, for garbage collection or a slow disk, from acting after its lease expired and another client took over. Pass a fencing token that increases with each grant, and have storage reject stale ones."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Check-then-insert logic, such as 'if no user has this email, create one', races across instances and creates duplicates. Enforce uniqueness with a database constraint and handle the conflict error, or use an upsert."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Two transactions that update the same rows in different orders can deadlock, and the database aborts one of them. Update rows in a consistent order, for example sorted by primary key, and retry transactions that fail with a deadlock error."

[[note]]
level = "professional"
topic = "Kubernetes"
text = "A Kubernetes CronJob can occasionally create two jobs for one scheduled time, or none, for example after controller restarts or missed deadlines. Make scheduled jobs idempotent, and set `concurrencyPolicy: Forbid` if runs must not overlap."

[[note]]
level = "professional"
topic = "Concurrency"
text = "Without a version check, two users can read the same record and the second save silently overwrites the first. Include a version column in the `WHERE` clause of each update and treat zero affected rows as a conflict."

[[note]]
level = "professional"
topic = "Concurrency"
text = "When slow report queries and fast user requests share one connection pool, a burst of reports takes every connection and the site stalls. Give each workload its own pool, a bulkhead sized for its traffic."

[[note]]
level = "professional"
topic = "Concurrency"
text = "If a job runs longer than the queue's visibility timeout, the message reappears and a second worker starts the same job while the first is still running. Extend the timeout while working, or set it above the worst-case runtime."

[[note]]
level = "professional"
topic = "Concurrency"
text = "A `GET` followed by a `SET` on a shared Redis counter loses increments when two clients interleave. Use atomic commands such as `INCR`, or a Lua script, for read-modify-write on shared keys."

[[note]]
level = "professional"
topic = "Time"
text = "Cron schedules in a zone with daylight saving time can skip or repeat jobs during the transition hour, and implementations differ in how they handle it. Run servers and schedulers in UTC, and convert to local time only for display."

[[note]]
level = "professional"
topic = "Regex"
text = "PHP's `preg_match` returns `false`, not `0`, when it hits `pcre.backtrack_limit`, so code that treats any falsy result as no match lets that input through a blocklist check. Compare the result with `=== 1`, and check `preg_last_error()`."

[[note]]
level = "professional"
topic = "Time"
text = "Hosts with drifting clocks reject valid TLS certificates and tokens, or accept expired ones, and the errors look like authentication bugs. Monitor clock offset on every machine and alert when NTP synchronization is lost."

[[note]]
level = "professional"
topic = "Time"
text = "Mixing NTP servers that smear leap seconds with servers that step them leaves your fleet up to a second apart around the event. Use one kind of time source consistently across the fleet."

[[note]]
level = "professional"
topic = "Time"
text = "Container images, and runtimes such as the JVM, carry their own copy of the time zone database, so an old build computes local times with outdated rules after a country changes its offset. Rebuild and update regularly so zone data stays current."

[[note]]
level = "professional"
topic = "Time"
text = "Timestamps from different machines cannot reliably order events that happen close together, because clocks drift apart by milliseconds or more. Use sequence numbers, logical clocks or a single ordering authority when order matters."

[[note]]
level = "professional"
topic = "Time"
text = "A daily report cut at midnight UTC splits each customer's local day in two, and the totals never match what they see. Decide which time zone defines a day for each report and store it with the aggregation."

[[note]]
level = "professional"
topic = "Testing"
text = "Mocks encode your assumptions about a dependency, so tests keep passing after the real service changes its behavior. Back mocks with contract tests, or run a subset of tests against the real dependency."

[[note]]
level = "professional"
topic = "Testing"
text = "Tests that run on SQLite while production runs PostgreSQL miss differences in types, constraints, locking and SQL dialect. Run integration tests against the same database engine and major version, for example in a container."

[[note]]
level = "professional"
topic = "Testing"
text = "Synthetic test traffic in production pollutes metrics, analytics and billing unless it is marked. Tag test requests and accounts at the source and filter them out of business reports."

[[note]]
level = "professional"
topic = "Testing"
text = "A staging environment with a tiny dataset hides slow queries, lock contention and migrations that take hours in production. Test migrations and heavy queries against a production-sized copy with sensitive data masked."

[[note]]
level = "professional"
topic = "Testing"
text = "Tests that pass only in a particular order share state through the database, globals or files, and break when someone parallelizes the suite. Run tests in random order in CI to expose hidden coupling early."

[[note]]
level = "professional"
topic = "Testing"
text = "A chaos experiment without a clear stop condition can grow from a test into an incident. Define the blast radius, the abort criteria and who can halt it before injecting any failure."

[[note]]
level = "professional"
topic = "Testing"
text = "Line coverage shows which code ran, not whether any assertion checked it, so a coverage target invites tests that execute code without testing it. Review what tests assert, and use mutation testing to measure it."

[[note]]
level = "professional"
topic = "CI"
text = "CI caches keyed on a branch name rather than the lockfile hash restore stale dependencies, so builds pass in CI that fail from scratch. Key caches on a hash of the lockfile, and run a cache-free build on a schedule."

[[note]]
level = "professional"
topic = "Observability"
text = "Latency recorded only for completed requests leaves out those that timed out or were dropped, so p99 can look better during an outage. Record durations for failures and timeouts too, and read latency next to the error rate."

[[note]]
level = "professional"
topic = "CI"
text = "`git describe` and version scripts fail or report the wrong version in shallow CI clones, which lack tags and history. Fetch tags and enough history, for example `fetch-depth: 0` with `actions/checkout`, in jobs that compute versions."

[[note]]
level = "professional"
topic = "CI"
text = "A pipeline that downloads the latest version of its tools on every run can break overnight without a single change in your repository. Pin the versions of compilers, linters and CLI tools the pipeline installs."

[[note]]
level = "professional"
topic = "Performance"
text = "PostgreSQL's JIT compilation, on by default, can add tens or hundreds of milliseconds to queries that the planner costs as expensive but that run quickly. If short queries slowed down, compare with `SET jit = off`, and raise `jit_above_cost` or disable JIT for OLTP."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Interpolating `${{ github.event.issue.title }}` directly into a `run:` script lets anyone who opens an issue inject shell commands. Pass untrusted values through an `env:` variable and reference it as a quoted shell variable."

[[note]]
level = "professional"
topic = "Accessibility"
text = "An accessibility overlay script cannot repair the inaccessible markup beneath it and can interfere with the assistive technology people already use; installing one does not make a site conform to WCAG."

[[note]]
level = "professional"
topic = "HTTP"
text = "`Retry-After` may hold either a number of seconds or an HTTP date, so a client that parses only integers treats a date as zero and retries at once; handle both forms, and cap the wait."

[[note]]
level = "professional"
topic = "Unicode"
text = "Case mapping can merge distinct characters: in Python, `'ı'.upper()` is `'I'` and the Kelvin sign `'\\u212a'.lower()` is `'k'`, so matching accounts by upper- or lowercased email lets a lookalike address hit someone else's account. Send resets only to the stored address."

[[note]]
level = "professional"
topic = "GitHub Actions"
text = "Secret masking in Actions logs only catches exact matches, so a secret that is base64-encoded, split or otherwise transformed prints in clear text. Register derived values with `::add-mask::` and avoid echoing secrets at all."

[[note]]
level = "professional"
topic = "HTTP"
text = "When a backend sends response headers larger than nginx's `proxy_buffer_size`, often because of big cookies, nginx answers `502` and logs `upstream sent too big header`; raise the buffer or shrink the headers."

[[note]]
level = "professional"
topic = "Observability"
text = "Counting every `4xx` as a success in an availability SLI hides failures that are really yours, such as a `429` from your own rate limiter or a `404` from a broken deploy. Decide per status code which ones count against the objective."

[[note]]
level = "professional"
topic = "Performance"
text = "Raising connection pool sizes when a database slows down usually makes it slower: more concurrent queries compete for the same CPU, locks and disk. Keep pools near what the database can actually run in parallel, and let requests queue in the app."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Pinning every dependency without an update process leaves you years behind, and the eventual upgrade spans several breaking changes at once. Automate small, regular update pull requests and merge them while the diffs are easy to review."

[[note]]
level = "professional"
topic = "Dependencies"
text = "A widely used package maintained by one volunteer can be abandoned, sold or hijacked. Watch maintainer activity and ownership changes for critical dependencies, and budget time to fork or replace them."

[[note]]
level = "professional"
topic = "Dependencies"
text = "A dependency upgrade can change its license, and a switch to a copyleft or source-available license may conflict with how you ship. Check licenses in CI on every lockfile change, not just at adoption."

[[note]]
level = "professional"
topic = "Dependencies"
text = "Where only one version of a package can be installed, as in Python, two libraries needing incompatible major versions of a shared dependency can block upgrades of both. Check a new dependency's transitive tree before adopting it."

[[note]]
level = "professional"
topic = "HTTP"
text = "`Vary: User-Agent` makes shared caches store a separate copy for every browser version string, which drives hit rates toward zero; normalize to a small device-class header at the edge and vary on that instead."

[[note]]
level = "professional"
topic = "Git"
text = "On case-insensitive file systems, the default on macOS and Windows, two files whose names differ only in case collide, and checkouts show phantom changes. Add a CI check that rejects paths differing only in case."

[[note]]
level = "professional"
topic = "Unicode"
text = "Normalize passwords to one Unicode form before hashing them, as NIST SP 800-63B recommends (NFKC or NFKD). Otherwise a password with an accented letter, typed on another device or keyboard, can arrive as different code points and fail to verify."

[[note]]
level = "professional"
topic = "Incidents"
text = "Giving customers a resolution time before you know the cause sets a deadline you will probably miss, and each missed estimate costs more trust than saying you do not know yet. Promise the time of the next update instead."

[[note]]
level = "professional"
topic = "Linux"
text = "Services started by systemd ignore `/etc/security/limits.conf`, which applies to login sessions, so raising the open file limit there does nothing for them. Set `LimitNOFILE=` in the unit file or a drop-in."

[[note]]
level = "professional"
topic = "Linux"
text = "With `Restart=always` and the default short `RestartSec=`, a crash-looping service quickly hits systemd's start rate limit and then stays down. Set a longer `RestartSec=` and tune `StartLimitBurst=` and `StartLimitIntervalSec=` deliberately."

[[note]]
level = "professional"
topic = "Linux"
text = "`sysctl -w` changes last only until the next reboot, so a tuning fix made during an incident silently disappears later. Persist settings in a file under `/etc/sysctl.d/` and manage it with the rest of your configuration."

[[note]]
level = "professional"
topic = "Linux"
text = "Under memory pressure, the Linux OOM killer picks the process with the highest badness score, which on a database host is often the database itself. Set `OOMScoreAdjust=` in the unit, or `oom_score_adj`, to protect critical processes."

[[note]]
level = "professional"
topic = "Linux"
text = "logrotate's `copytruncate` copies a log and then truncates it, so lines written between the two steps are lost. Prefer having the application reopen its log file on a signal, and use `copytruncate` only when it cannot."

[[note]]
level = "professional"
topic = "Linux"
text = "Transparent huge pages can cause latency spikes and memory bloat for databases and caches with sparse access patterns, and several of them recommend turning THP off. Check your datastore's guidance and set THP accordingly on its hosts."

[[note]]
level = "professional"
topic = "Unicode"
text = "Internationalized domain names reach DNS, TLS certificates and many logs as punycode (`xn--...`), while browsers and users see Unicode, so allowlists and comparisons that mix the two forms miss matches. Convert both sides to one form with an IDNA library first."

[[note]]
level = "professional"
topic = "Concurrency"
text = "A row that every request updates, such as a global counter or a shared balance, serializes those transactions on its row lock and caps throughput however big the database is. Spread the counter over several rows and sum them, or aggregate asynchronously."

[[note]]
level = "professional"
topic = "Cryptography"
text = "bcrypt uses only the first 72 bytes of a password, and many implementations silently drop the rest, so long passphrases, or a pepper appended at the end, may not count. Know your algorithm's input limits, or use Argon2id or scrypt, which have no such cutoff."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Encrypting data without recording which key encrypted it turns key rotation into a flag day. Store a key identifier with every ciphertext so old data stays readable while new data uses the new key."

[[note]]
level = "professional"
topic = "Cryptography"
text = "Certificates expire on a schedule nobody remembers, including internal CAs, intermediates and client certificates. Automate renewal, and monitor expiry dates from outside so a failed renewal pages someone weeks ahead."

[[note]]
level = "professional"
topic = "HTTP"
text = "nginx logs status `499` when the client closed the connection before the response was sent, so a rise in 499s means callers are timing out on you even though your application never logged an error."

[[note]]
level = "professional"
topic = "Cryptography"
text = "`verify=False` or `InsecureSkipVerify: true`, added to get past a certificate error in one environment, tends to ship everywhere. Fix the trust store or the certificate instead, and fail CI on any TLS verification bypass."

[[note]]
level = "professional"
topic = "Data"
text = "Floating-point addition is not associative, so summing the same values in a different order, such as across shards or parallel workers, gives different totals. Store money in integer minor units or decimal types, and aggregate them exactly."

[[note]]
level = "professional"
topic = "Data"
text = "A deletion request is not done when the row leaves the main database: copies live in backups, logs, caches, search indexes and the warehouse. Map where each kind of personal data flows so deletion can reach every copy."

[[note]]
level = "professional"
topic = "Data"
text = "Opening a CSV in a spreadsheet can silently turn IDs into dates, drop leading zeros and round long numbers. Share data that must round-trip in a typed format, or import it with columns explicitly set to text."

[[note]]
level = "professional"
topic = "Data"
text = "Making a new field required in an event schema breaks consumers that replay older events, which lack it, from the log. Evolve schemas compatibly, with optional fields and defaults, and enforce compatibility rules in a schema registry."

[[note]]
level = "professional"
topic = "Data"
text = "A backfill job that reads and writes as fast as it can competes with production traffic for the same database. Throttle backfills, run them in small batches, and watch replication lag while they run."

[[note]]
level = "professional"
topic = "SQL"
text = "`BETWEEN` includes both ends, so a range ending at midnight counts events at exactly midnight in two consecutive days. Use half-open ranges, `ts >= start AND ts < end`, for time windows."

[[note]]
level = "professional"
topic = "SQL"
text = "`LIMIT` without `ORDER BY` returns whichever rows the planner reaches first, and that can change between runs or after a plan change. Always order by a unique key when paging or picking a single row."

[[note]]
level = "professional"
topic = "APIs"
text = "Webhook senders usually wait only a few seconds for a `2xx` before retrying, and some disable endpoints that keep failing; acknowledge each delivery right away and do the slow processing from a queue."

[[note]]
level = "professional"
topic = "SQL"
text = "In PostgreSQL, a view defined with `SELECT *` fixes its column list at creation time, so columns added to the table later do not appear in the view. Recreate views after schema changes, or list columns explicitly."

[[note]]
level = "professional"
topic = "SQL"
text = "A `LIKE '%term'` search with a leading wildcard cannot use an ordinary B-tree index and scans the table. For substring search, use a trigram index (`pg_trgm` in PostgreSQL) or a search engine."

[[note]]
level = "professional"
topic = "Code review"
text = "A two-thousand-line pull request gets skimmed and approved, while a fifty-line one gets real scrutiny. Split changes into reviewable steps, and put mechanical changes such as renames in their own pull request."

[[note]]
level = "professional"
topic = "Code review"
text = "Reviewing only the diff misses what is not there: missing tests, callers of a changed function, and config that should have changed too. Check call sites and tests, not just the changed lines."

[[note]]
level = "professional"
topic = "Code review"
text = "When every review comment looks equally urgent, authors cannot tell a blocking bug from a style preference. Label comments as blocking or optional so critical issues get fixed and nitpicks do not stall merges."

[[note]]
level = "professional"
topic = "Documentation"
text = "Architecture diagrams drawn once describe the system someone intended, not the one running now, and they mislead engineers during incidents. Date every diagram and review it whenever the architecture changes."

[[note]]
level = "professional"
topic = "Documentation"
text = "Setup docs that only their original author ever followed drift silently, and each new hire rediscovers the missing steps. Have every new team member fix the onboarding guide as they work through it."

[[note]]
level = "professional"
topic = "Versioning"
text = "Under Semantic Versioning, `0.x` releases promise no stability, and npm's caret treats `^0.3.1` as `>=0.3.1 <0.4.0`. Expect breaking changes in minor bumps of 0.x dependencies and review them like major upgrades."

[[note]]
level = "professional"
topic = "Versioning"
text = "Exposing a dependency's types in your library's public API makes that dependency's major upgrade a breaking change for your users. Wrap third-party types at the boundary, or treat their major bumps as your own."

[[note]]
level = "professional"
topic = "Versioning"
text = "Moving a Git tag after a release was published leaves users and caches with different code under the same version. Treat published versions as immutable, and ship a new version number for any fix."

[[note]]
level = "professional"
topic = "APIs"
text = "Many gRPC implementations reject messages larger than 4 MB by default, so a response that grows with a customer's data fails with `RESOURCE_EXHAUSTED` for your biggest customers first; paginate or stream instead."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "A Maven build that leaves plugin versions unset takes them from the Maven release it runs on, so upgrading Maven or the CI image quietly changes the compiler, packaging and test plugins. Pin every plugin version in `pluginManagement`."

[[note]]
level = "professional"
topic = "Reproducibility"
text = "A build that fetches dependencies from public registries cannot be reproduced once a version is deleted or the registry is unreachable. Mirror the artifacts you depend on in a registry you control, and build releases from it."

[[note]]
level = "professional"
topic = "Time"
text = "A far-future sentinel such as `9999-12-31` overflows 64-bit nanosecond timestamps, which only reach the years 1677 to 2262, so code that stores times as nanoseconds, like Go's `UnixNano`, rejects or garbles it. Use null for open-ended validity."

[[note]]
level = "professional"
topic = "Shell"
text = "`set -e` does not fire in many places: inside `if` conditions, in `&&` and `||` lists, and in functions called from them. Check critical commands explicitly instead of relying on `set -e` alone."

[[note]]
level = "professional"
topic = "Time"
text = "Hourly partitions, file names or metric keys built from local time collide on the night clocks go back, when one local hour happens twice, so the second batch overwrites the first. Key anything that must be unique by UTC time."

[[note]]
level = "professional"
topic = "Unicode"
text = "The same visible text can be different code points: 'é' may be one precomposed character or 'e' plus a combining accent. Normalize to NFC before comparing, hashing or enforcing uniqueness on user input."

[[note]]
level = "professional"
topic = "Unicode"
text = "Usernames that mix scripts can impersonate others with lookalike characters, such as a Cyrillic 'а' in place of a Latin 'a'. Apply the confusable detection from Unicode Technical Standard #39, or restrict identifiers to one script."

[[note]]
level = "professional"
topic = "APIs"
text = "A rate limit counted in each server's memory lets a client through N times the quota when you run N replicas, and the real limit shifts every time you scale; count requests in a store all instances share."

[[note]]
level = "professional"
topic = "Architecture"
text = "Work that grows with the data, such as notifying every follower or recomputing every order of a customer, is harmless for most accounts and an outage for your largest one. Cap fan-out per request, and move large jobs to batched background work."

[[note]]
level = "professional"
topic = "GitHub"
text = "Repository administrators can bypass branch protection unless the rule is set to apply to them too. Turn on enforcement for administrators, and route real emergencies through a break-glass process that leaves an audit trail."

[[note]]
level = "professional"
topic = "GitHub"
text = "A classic personal access token with the `repo` scope is not tied to one repository: it can reach every private repository its owner can. Use fine-grained tokens or GitHub Apps limited to specific repositories for automation."

[[note]]
level = "professional"
topic = "Debugging"
text = "Attaching `strace -p` to a busy production process stops it at every system call, even ones filtered out of the output, and can slow it dramatically. Keep sessions short, or use lower-overhead tools such as `perf trace` or eBPF-based tracers."

[[note]]
level = "professional"
topic = "Debugging"
text = "Capturing with `tcpdump` on a busy host can drop packets and fill the disk. Use a capture filter, cap the size with `-c` or rotate files with `-C` and `-W`, and write to a volume with room to spare."

[[note]]
level = "professional"
topic = "Debugging"
text = "Turning on debug logging across a fleet during an incident can overload the log pipeline you need to diagnose it. Raise verbosity on one instance or for one request ID, and make it expire automatically."

[[note]]
level = "professional"
topic = "Tooling"
text = "An internal CLI that defaults to the production environment turns every forgotten flag into a production change. Make the target environment a required argument, and print it prominently before anything runs."

[[note]]
level = "professional"
topic = "Web"
text = "A service worker that caches the app shell can keep users on an old release for days after you deploy. Version the cache, call `skipWaiting()` deliberately, and give users a visible way to reload into the new version."

[[note]]
level = "professional"
topic = "Go"
text = "In Go, returning a nil pointer of a concrete type as an `error` produces a non-nil interface, so `err != nil` is true. Return a literal `nil` for success, never a typed nil pointer."
