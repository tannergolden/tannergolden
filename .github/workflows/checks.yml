# The gate on the code, not on the content. Runs the same two commands a
# contributor runs locally, and nothing else: no reusable workflow from
# tannergolden/standards is called here, because this repository is a
# documented exception to those standards (How-It-Works.md).
#
# A push made by the dispatch workflow uses the built-in token, and GitHub
# does not start workflows for pushes made with that token, so this runs on
# a person's push and on a pull request, never on a generated commit. That
# is the intended split: the content is checked by the code, the code is
# checked here.

name: '🚦 Checks'

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: '🧪 Lint & Test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🚦 Lint and test the dispatch code.'

      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🏷️ Checkout the badge kit'
        # The badge tests render through the real kit, at the same commit
        # the dispatch workflow uses. They skip when it is absent.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tannergolden/emblems
          ref: c30b6b52b36898e952b2a1d76f12525eef1ddbdf # Development, 2026-09-24
          path: .emblems
          persist-credentials: false

      - name: '🧰 Install the pinned tools'
        run: make setup

      - name: '🔍 Lint'
        run: make lint

      - name: '🧪 Test'
        env:
          EMBLEMS_KIT: .emblems/src/badge-kit.py
        run: make test

      - name: '📄 Verify the page regions'
        run: make check
