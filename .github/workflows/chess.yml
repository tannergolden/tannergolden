name: Chess

# The game on the profile: the owner, always White, against GitHub, anyone
# else, as Black. Every move reaches it from tannergolden/play's Move Intake:
# a player picks a move on the board, its link opens an issue there, and the
# intake starts this through the Official Arbiter with the move, the game and
# move it was picked at, the issue and who opened it. .github/scripts/chess.py
# plays it or turns it away, the Arbiter replies on the issue with which and
# why, and the Markdown run redraws the page.
#
# It only plays moves. The one clock for all four games, clock.yml, keeps
# the time: when the side to move has gone a week without moving, the Arbiter
# plays a random legal move for it, so no game stalls. A game ends only by the
# rules, at checkmate, stalemate or a draw FIDE makes automatic; its record
# goes into the Hall of Fame, and its final board stays up for two days before
# the next game's fresh board comes, with the owner to open it. The state
# lives in .github/chess, and every run sets the board, every legal move
# named, out between the chess markers of the page's settings, and the Hall
# of Fame of all four games between the hall markers, for the Markdown run to
# draw.
#
# Every input is written by a stranger, by way of an issue title. Each one
# reaches the script through an environment variable, never as an expression
# inside a script, and the script checks each again before it reads the board.
# Before that, the move is read back from its issue: it must be that issue's
# title, opened by that player, so a run started any other way plays nothing.
# A move with no issue is only ever the owner's own, run by hand.
#
# One move at a time, without a queue: GitHub keeps one run waiting in a
# concurrency group and cancels the rest, which would lose their replies. So
# runs here never wait. Each plays its move on the latest state and pushes,
# and a push that loses the race starts again from the state that won, where
# the move may now be stale and the reply says so.
#
# The commits are the bot's, so a move never counts as your contribution, and
# their messages never name an issue. Replying on tannergolden/play needs the
# Official Arbiter's PLAY_APP_CLIENT_ID variable and PLAY_APP_PRIVATE_KEY
# secret here; without them a move is still played, and its reply fails. The
# reply comes before the redraw, so a redraw that fails never swallows it, and
# each move's issue is locked once answered (.github/scripts/arbiter.sh): only
# the owner and the Arbiter write there after. A run that fails before the
# game rules on a move still answers its issue, and the owner hears of it
# once, in a notice that closes itself when moves go through again. The
# games' tests run when their code changes (games-tests.yml), not on every
# move.
on:
  workflow_dispatch:
    inputs:
      uci:
        description: 'The move in UCI, such as e2e4, or e7e8q for a promotion.'
        required: true
        type: string
      game:
        description: 'The game the move was picked in.'
        required: true
        type: string
      move_number:
        description: 'The move the board was on when it was picked, from 1 for White''s first.'
        required: true
        type: string
      issue:
        description: 'The issue in tannergolden/play the move came from, for the reply.'
        required: false
        default: ''
        type: string
      player:
        description: 'The login of whoever opened the issue.'
        required: false
        default: ''
        type: string
      player_id:
        description: 'Their numeric ID, the same after a change of login.'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  chess:
    name: '♟️ Chess'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # start the Markdown run that redraws the board
      contents: write # the game's state under .github/chess, and the board's and the Hall's lines in the settings
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] - the job pushes the game's state, and nothing that runs after it reads the checkout.

      # The move must be its issue's own: that title, opened by that player. Read with this run's token, which
      # reads the public play repository and writes nothing there.
      - name: '🔎 Read the move back from its issue'
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          UCI: ${{ inputs.uci }}
          GAME: ${{ inputs.game }}
          MOVE_NUMBER: ${{ inputs.move_number }}
          ISSUE: ${{ inputs.issue }}
          PLAYER_ID: ${{ inputs.player_id }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$UCI" ]; then
            echo "::error::No move was sent: this workflow only plays moves, and clock.yml keeps the time."
            exit 1
          fi
          if [ -z "$ISSUE" ]; then
            # A move with no issue is the owner's own, run by hand.
            [ "$ACTOR" = "$OWNER" ] && exit 0
            echo "::error::A move with no issue is the owner's alone to run, so nothing was played."
            exit 1
          fi
          [[ "$ISSUE" =~ ^[1-9][0-9]{0,15}$ ]] || exit 0 # malformed: the game turns it away itself
          # The author's ID on one line and the title on the next, trimmed as the intake reads it.
          { read -r author; read -r title; } < <(gh api "repos/$OWNER/play/issues/$ISSUE" --jq '.user.id, .title')
          if [ "$author" != "$PLAYER_ID" ] || [ "$title" != "chess: $UCI · game $GAME · move $MOVE_NUMBER" ]; then
            echo "::error::Issue #$ISSUE does not hold this move from this player, so nothing was played."
            exit 1
          fi

      # No setup-python on purpose: the scripts are stdlib only.
      - name: '♟️ Play the move'
        id: play
        env:
          UCI: ${{ inputs.uci }}
          GAME: ${{ inputs.game }}
          MOVE_NUMBER: ${{ inputs.move_number }}
          ISSUE: ${{ inputs.issue }}
          PLAYER: ${{ inputs.player }}
          PLAYER_ID: ${{ inputs.player_id }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$(git symbolic-ref --quiet --short HEAD)"
          for attempt in 1 2 3 4 5; do
            # Always from the latest state: a move decided on an older one may no longer stand.
            git fetch --quiet origin "$branch"
            git reset --quiet --hard "origin/$branch"
            : > "$RUNNER_TEMP/chess-outputs"
            GITHUB_OUTPUT="$RUNNER_TEMP/chess-outputs" python3 .github/scripts/chess.py .github/chess --out "$RUNNER_TEMP/chess"
            if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard -- .github/chess)" ]; then
              break # nothing to save: a move turned away
            fi
            git add -- .github/markdown.yaml
            if [ -d .github/chess ]; then git add -- .github/chess; fi # the game's folder comes with its first move
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --quiet -F "$RUNNER_TEMP/chess/commit.txt"
            if git push --quiet origin "HEAD:$branch"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not save the game to $branch after five attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done
          cat "$RUNNER_TEMP/chess-outputs" >> "$GITHUB_OUTPUT"

      - name: '🔑 Mint the reply token'
        id: app
        if: ${{ steps.play.outcome == 'success' && steps.play.outputs.issue != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PLAY_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLAY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: play
          permission-issues: write

      # Before the redraw, so a redraw that fails never keeps a player from hearing how their move went.
      - name: '💬 Reply on the move'
        if: ${{ steps.app.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ steps.play.outputs.issue }}
          PLAY: ${{ github.repository_owner }}/play
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/arbiter.sh
          say "$ISSUE" "$RUNNER_TEMP/chess/comment.md"
          settle

      - name: '🖌️ Redraw the board'
        if: ${{ !cancelled() && steps.play.outcome == 'success' && steps.play.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run markdown.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      # A run that fails before the game rules on a move (the game, or its save) still answers the move's issue. The
      # owner hears of it once, in a notice the next move that goes through closes, however many moves it stops. A
      # move its issue doesn't hold was never a player's, so nothing is said for it.
      - name: '🔑 Mint the token for the failure notice'
        id: app-failed
        if: ${{ failure() && inputs.issue != '' && steps.issue.outcome != 'failure' && steps.play.outcome != 'success' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PLAY_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLAY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: play
          permission-issues: write

      - name: '🧯 Say the move was not ruled on'
        if: ${{ failure() && steps.app-failed.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-failed.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          UCI: ${{ inputs.uci }}
          OWNER: ${{ github.repository_owner }}
          PLAY: ${{ github.repository_owner }}/play
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/arbiter.sh
          [[ "$ISSUE" =~ ^[1-9][0-9]{0,15}$ ]] || exit 0
          move='this move'
          if [[ "$UCI" =~ ^[a-h][1-8][a-h][1-8][qrbn]?$ ]]; then move="\`$UCI\`"; fi
          down="$(desk arbiter-outage "🧯 The Arbiter is down" "$(printf '%s\n%s %s\n' \
            "🧯 **The Arbiter is down**, so moves aren't being ruled on." \
            "@$OWNER, [this run]($RUN_URL) failed before it could rule on one. Every move it stops links here," \
            "and nobody is pinged again; this closes itself when a move goes through.")")"
          printf '%s\n%s %s\n' "⚠️ **The Arbiter couldn't rule on $move**, so nothing was played." \
            "It's being looked into in [#$down](https://github.com/$PLAY/issues/$down): try the same move again from" \
            "[the board](https://github.com/$OWNER) once that's closed." \
            > "$RUNNER_TEMP/failed.md"
          say "$ISSUE" "$RUNNER_TEMP/failed.md"
