# NOT installed from tannergolden/standards, and not a stub. This is the one
# workflow this profile runs, and How-It-Works.md records the three places it
# departs from those standards and why: a scheduled job that pushes to the
# default branch, and logic living here rather than being called by
# reference.
#
# WHAT ONE RUN DOES. It reads state/schedule.json. If a dispatch or a
# page refresh is due inside the coming hour, it sleeps until that exact
# second, does it, draws the next moment from an exponential distribution
# using the operating system's entropy source, and looks again. A moment
# already past, because a cron was skipped, is handled at once. When nothing
# is due, the run ends in seconds. The mean wait between entries is one
# number in src/config.py.
#
# The cron fires on the hour. GitHub's scheduler is most congested there and
# a run can be delayed by several minutes or dropped, which an off-hour
# minute avoids; this job can afford that. Nothing is due AT the cron. The
# run reads the schedule, and if a moment falls inside the coming hour it
# sleeps until that exact second, so a late start moves when the run begins
# and not when the dispatch lands. A dropped hour is picked up by the next
# one, because a moment already past is handled at once.
#
# EGRESS. The harden step audits rather than blocks, per the action's own
# guidance: audit first, then block with the allowlist the audit reveals.
# The endpoints this job is expected to reach, for that allowlist:
#   api.github.com, raw.githubusercontent.com, github.com,
#   hacker-news.firebaseio.com, lobste.rs, endoflife.date,
#   blog.rust-lang.org, feed.infoq.com, feeds.arstechnica.com,
#   feeds.bbci.co.uk, feeds.npr.org, github.blog, go.dev, hacks.mozilla.org,
#   kubernetes.io, nodejs.org, pythoninsider.blogspot.com,
#   spectrum.ieee.org, www.cisa.gov, www.phoronix.com, www.postgresql.org,
#   www.theguardian.com, www.theregister.com
#
# Kept true by tests/workflow-shape.py, which reads the registry and the
# support clock and fails if this list drifts from what the code fetches.

name: '📡 Dispatch'

on:
  schedule:
    - cron: '0 * * * *' # hourly: the run decides whether anything is due
  workflow_dispatch:
    inputs:
      mode:
        description: 'tick: what is due this hour. dispatch: one dispatch now. refresh: the page now. probe: try every source, write nothing'
        type: choice
        options: [tick, dispatch, refresh, probe]
        default: tick

concurrency:
  # One writer, ever. A run that is asleep waiting for its moment holds the
  # group, and the next hourly run queues behind it rather than committing
  # beside it. Never cancelled: cancelling a sleeping run would lose the
  # moment it was waiting for. A probe writes nothing, so it takes a group
  # of its own rather than wait behind a sleeping writer.
  group: ${{ github.workflow }}-${{ inputs.mode == 'probe' && 'probe' || 'write' }}
  cancel-in-progress: false

# The ceiling for every job below. Written out rather than inherited, because a
# repository set to read-only caps every write scope the same invisible way.
permissions: {}

jobs:
  write:
    name: '📡 Send what is due'
    # No branch guard, deliberately. A scheduled run only ever fires on the
    # default branch, which is the branch the page renders from; GitHub
    # enforces that. A manual dispatch on any other branch is a REHEARSAL:
    # it fetches, writes and commits exactly as a real run would, and then
    # does not push (DISPATCH_NO_PUSH below), reporting the commits it made
    # in the run summary instead. Pushing them would put state files on a
    # branch that the hourly runs on the default branch keep moving, and
    # every one of them would conflict at merge.
    runs-on: ubuntu-latest
    # A run sleeps up to an hour; the margin covers a slow source afterwards.
    timeout-minutes: 80
    permissions:
      contents: write # commit the entry and push it
    env:
      # AUTHOR AND COMMITTER ARE DIFFERENT PEOPLE ON PURPOSE. The author is the
      # account owner, set in src/config.py, which is what the contribution
      # graph reads. The committer is the Actions identity, so the commit
      # object also records that a machine performed the write.
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      # '1' for a dispatch anywhere but the default branch: a rehearsal
      # commits and stops. Gated on the event first, because
      # github.event.repository is NOT present on a schedule event, and a
      # bare comparison would have read as 'not the default branch' on
      # every hourly run and never pushed anything.
      DISPATCH_NO_PUSH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch && '1' || '' }}
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '📡 Dispatches: sends whatever is due this hour, at the second it is due.'

      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: a rebase before push needs the merge base, and
          # a shallow clone cannot supply one once the branch has moved.
          fetch-depth: 0
          # The push at the end of the run uses this token. A read-only job
          # would drop it; this one exists to write.
          persist-credentials: true # zizmor: ignore[artipacked] - this job pushes

      - name: '🏷️ Checkout the badge kit'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tannergolden/emblems
          ref: 5b00d969c0ea1c963ff949de2554da5dbe5ab7d0 # Development, 2026-09-20
          path: .emblems
          persist-credentials: false

      - name: '📡 Send what is due'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_MODE: ${{ inputs.mode || 'tick' }}
          EMBLEMS_KIT: .emblems/src/badge-kit.py
        # Inputs travel through env, never interpolated into the script body:
        # a ${{ }} expansion inside run is a shell-injection sink.
        run: python3 src/dispatches.py --mode "$DISPATCH_MODE"
