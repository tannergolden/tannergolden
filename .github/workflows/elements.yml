name: Elements

# Draws the README's elements with the banners' elements kit, all in the
# page's blackprint: the schematic under About Me (.github/elements.yml),
# the two latest-release placards (.github/releases.json) and the two good
# first issue placards (.github/good-first-issue.json). It runs after every
# Markdown run, so the drawings keep up with the kit that run used; a run
# that finds nothing moved commits nothing. Each pick has a day of its own, at 09:30 EST (14:30
# UTC), between the badges (08:00 EST) and the trophies (16:00 EST): the
# latest releases on Wednesdays and the good first issues on Fridays. An
# edit to the schematic's data file redraws it straight away.
# The commit is the bot's, so a redraw never counts as your contribution,
# and its message never names an issue: a reference in a commit message
# would land on that issue's timeline.
on:
  schedule:
    - cron: '30 14 * * 3' # Wednesday, 09:30 EST: the latest releases
    - cron: '30 14 * * 5' # Friday, 09:30 EST: the good first issues
  workflow_run: # zizmor: ignore[dangerous-triggers] - only follows the banners' colour: it checks out this repository's default branch and takes nothing from the run that triggered it.
    workflows: [Markdown]
    types: [completed]
  push:
    paths:
      - '.github/elements.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: elements-${{ github.ref }}
  cancel-in-progress: false

jobs:
  elements:
    name: '📐 Elements'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the drawings and README blocks it redraws
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] - the job pushes the drawings, and nothing else runs after it.

      # No setup-python on purpose: the scripts are stdlib only.
      - name: '🧪 Check the pickers'
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_issue.py'
          python3 -m unittest discover -s .github/scripts -p 'test_releases.py'

      # Each pick runs on its own day's schedule, and on a manual run; following the colour and a
      # schematic edit just redraw.
      - name: '📦 Pick the latest releases'
        if: github.event.schedule == '30 14 * * 3' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }} # read-only use: public repositories and their releases
        run: python3 .github/scripts/releases.py .github/releases.json

      - name: '🌿 Pick the good first issues'
        if: github.event.schedule == '30 14 * * 5' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }} # read-only use: GitHub's search API, for its higher rate limit
        run: python3 .github/scripts/issue.py .github/good-first-issue.json

      - name: '📐 Draw the schematic'
        uses: tannergolden/banners/elements@v1 # zizmor: ignore[unpinned-uses] - first-party action on its moving major, the way every stub calls it.
        with:
          mode: render
          data: .github/elements.yml

      # Each data file draws into its own folder: a render prunes drawings its data file does not name.
      - name: '📐 Draw the release placards'
        if: hashFiles('.github/releases.json') != ''
        uses: tannergolden/banners/elements@v1 # zizmor: ignore[unpinned-uses] - first-party action on its moving major, the way every stub calls it.
        with:
          mode: render
          data: .github/releases.json
          out: assets/releases

      - name: '📐 Draw the issue placards'
        if: hashFiles('.github/good-first-issue.json') != ''
        uses: tannergolden/banners/elements@v1 # zizmor: ignore[unpinned-uses] - first-party action on its moving major, the way every stub calls it.
        with:
          mode: render
          data: .github/good-first-issue.json
          out: assets/issues

      - name: '💾 Commit when a drawing moved'
        shell: bash
        run: |
          set -euo pipefail
          for path in README.md .github/releases.json .github/good-first-issue.json assets/elements assets/releases assets/issues; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing moved"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(elements): 📐 redraw the elements' \
              -m "Week $(date -u +%V) of $(date -u +%G). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Another workflow may have pushed since the checkout: rebase onto it and try again.
          branch="$(git symbolic-ref --quiet --short HEAD)"
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push to $branch after three attempts"
          exit 1
