name: '📝 Markdown'

# The stub tannergolden/markdown's README gives every page, with this page's
# choices: profile mode, the medieval collection's Illuminated all year, and the
# holiday sets on. It draws the whole page in one run and one commit: the
# header and footer, the badges, the schematic and the placards, and the
# trophy case. Once a day at 05:00 UTC, which is midnight EST, so the page's
# day, and a holiday's set with it, changes over at the page's own midnight.
# Picks starts it too, as soon as it has picked new placards, and so do the
# games: every move that changes a board, and the clock on any tick that
# changed one.
#
# `theme` is the page's one theme, and every part is drawn in it, except while
# a holiday's set is up around its day (`holidays`). Everything else the page
# sets is in .github/markdown.yaml.
on:
  schedule:
    - cron: '0 5 * * *' # 00:00 EST
  workflow_dispatch:

# One drawing at a time. Every move redraws the page, in any of the four
# games, and two runs at once would each push the boards as they stood when
# they began, so the older could land last and leave the page a move behind,
# every link on it stale. A run that starts while one is drawing waits for
# it, then draws the page as it is by then; GitHub keeps only the newest
# waiting run, which is the one needed.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  markdown:
    permissions:
      contents: write # the images, the README's blocks and the lock
      pull-requests: write # only used with commit: pr
    uses: tannergolden/markdown/.github/workflows/markdown.yml@v1 # zizmor: ignore[unpinned-uses] - first-party workflow on its moving major, the way every stub calls it.
    with:
      mode: profile
      theme: medieval-illuminated # the page's one theme: the medieval collection's Illuminated, all year
      holidays: 'true' # each holiday's set takes the page around its day, then hands it back
    # The one secret the kit takes, and nothing else: the page's other secrets, such as the Arbiter's key, stay here.
    secrets:
      MARKDOWN_TOKEN: ${{ secrets.MARKDOWN_TOKEN }}
