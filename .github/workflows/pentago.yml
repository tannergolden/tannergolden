name: Pentago

# Pentago on the profile, the second tier of its four games: six holes by six
# in four quarters that turn, where a move sets a marble and then turns any
# quarter a quarter turn, and five in a row wins. The owner always plays White
# and GitHub, anyone else, Black. Every game opens under the Ghost Rule: the
# Arbiter draws the side that sets the first ghost, a marble that is nobody's,
# the other side sets the second, and then the Arbiter draws the side that
# sets the first marble. Every move, a ghost's included, reaches it from
# tannergolden/play's Move Intake: a player picks a hole and a turn on the
# board, its link opens an issue there, and the intake starts this through the
# Official Arbiter with the move, the game and move it was picked at, the
# issue and who opened it. game.yml, which the three games beside chess share,
# plays it or turns it away, replies on the issue with which and why, closes
# it as `played` or `turned away` in the game's milestone, such as
# `Pentago · game 1`, and redraws the page. This only plays moves: clock.yml
# keeps every game's time. The state lives in .github/pentago.
on:
  workflow_dispatch:
    inputs:
      move:
        description: 'The hole and its turn, such as e4-ur-cw, or a ghost''s hole, such as b5.'
        required: true
        type: string
      game:
        description: 'The game the move was picked in.'
        required: true
        type: string
      move_number:
        description: 'The move the board was on when it was picked, from 1 for the first ghost.'
        required: true
        type: string
      issue:
        description: 'The issue in tannergolden/play the move came from, for the reply.'
        required: false
        default: ''
        type: string
      player:
        description: 'The login of whoever opened the issue.'
        required: false
        default: ''
        type: string
      player_id:
        description: 'Their numeric ID, the same after a change of login.'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  pentago:
    name: '🌀 Pentago'
    permissions:
      actions: write # start the Markdown run that redraws the board
      contents: write # the game's state under .github/pentago, and the board's lines in the settings
    uses: ./.github/workflows/game.yml # zizmor: ignore[self-repository] - actionlint, which lints these too, rejects the $/ form; ./ is this same file at this same commit.
    with:
      key: pentago
      move: ${{ inputs.move }}
      game: ${{ inputs.game }}
      move_number: ${{ inputs.move_number }}
      issue: ${{ inputs.issue }}
      player: ${{ inputs.player }}
      player_id: ${{ inputs.player_id }}
    secrets:
      PLAY_APP_PRIVATE_KEY: ${{ secrets.PLAY_APP_PRIVATE_KEY }}
