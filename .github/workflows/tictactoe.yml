name: Tic-Tac-Toe

# Tic-Tac-Toe on the profile, the first tier of its four games: a duel on nine
# cells. The owner always plays X and GitHub, anyone else, O. The Arbiter
# opens every game, for a side drawn at random, with a random cell, so that
# side's mark goes down first. Every move reaches it from tannergolden/play's
# Move Intake: a player picks a move on the board, its link opens an issue
# there, and the intake starts this through the Official Arbiter with the
# move, the game and move it was picked at, the issue and who opened it.
# game.yml, which the three games beside chess share, plays it or turns it
# away, replies on the issue with which and why, and redraws the page. This
# only plays moves: clock.yml keeps every game's time. The state lives in
# .github/tictactoe.
on:
  workflow_dispatch:
    inputs:
      move:
        description: 'The cell, such as b2.'
        required: true
        type: string
      game:
        description: 'The game the move was picked in.'
        required: true
        type: string
      move_number:
        description: 'The move the board was on when it was picked, from 1 for the first.'
        required: true
        type: string
      issue:
        description: 'The issue in tannergolden/play the move came from, for the reply.'
        required: false
        default: ''
        type: string
      player:
        description: 'The login of whoever opened the issue.'
        required: false
        default: ''
        type: string
      player_id:
        description: 'Their numeric ID, the same after a change of login.'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  tictactoe:
    name: '❌ Tic-Tac-Toe'
    permissions:
      actions: write # start the Markdown run that redraws the board
      contents: write # the game's state under .github/tictactoe, and the board's lines in the settings
    uses: ./.github/workflows/game.yml # zizmor: ignore[self-repository] - actionlint, which lints these too, rejects the $/ form; ./ is this same file at this same commit.
    with:
      key: tictactoe
      move: ${{ inputs.move }}
      game: ${{ inputs.game }}
      move_number: ${{ inputs.move_number }}
      issue: ${{ inputs.issue }}
      player: ${{ inputs.player }}
      player_id: ${{ inputs.player_id }}
    secrets:
      PLAY_APP_PRIVATE_KEY: ${{ secrets.PLAY_APP_PRIVATE_KEY }}
