<text x="16" y="29"><tspan class="p">❯</tspan> 👋🏻 Hello World!</text>
<text x="16" y="58"><tspan class="p">❯</tspan> 🏗️ Keep the right way easy</text>
<text x="16" y="87"><tspan class="p">❯</tspan> 🩺 Notice it before the pager does</text>
<text x="16" y="116"><tspan class="p">❯</tspan> 🪵 The context in one place</text>
