<svg xmlns="http://www.w3.org/2000/svg" width="443" height="134" viewBox="0 0 443 134" role="img" aria-labelledby="t d">
<title id="t">A terminal, and what it has been typing</title>
<desc id="d">👋🏻 Hello World! / 🧹 Untangling what people forget / 🧭 Written rules over heroics / 🗺️ Set up with one flag / 🪵 The whole story in one query / 🔗 No action without a review / 📮 A change that arrives tested / 🛠️ Fix the cause, not the symptom / 🧰 Choices I would make again / 🩺 Catch it before the pager does / 🧩 Pieces that fit by contract / 🏗️ Leave the safe way easy / 🎯 Covers exactly what it claims</desc>
<defs>
