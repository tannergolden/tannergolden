<svg xmlns="http://www.w3.org/2000/svg" width="455" height="134" viewBox="0 0 455 134" role="img" aria-labelledby="t d">
<title id="t">A terminal, and what it has been typing</title>
<desc id="d">👋🏻 Hello World! / 🤖 No human wrote this sentence / 🪄 No implicit steps in the build / 🧩 Repos that fit one job each / 🛠️ Fix the class, not the ticket / 🗃️ Scripts where everyone looks / 🏗️ Leave the right way easy / 🩺 See it before the pager does / 🔬 Results that survive review / 🪞 Document before anyone asks / 🧭 Written rules over cleverness / 📮 A feature that arrives reviewed / 💡 The fix obvious in the log</desc>
<defs>
