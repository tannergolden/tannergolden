<svg xmlns="http://www.w3.org/2000/svg" width="455" height="134" viewBox="0 0 455 134" role="img" aria-labelledby="t d">
<title id="t">A terminal, and what it has been typing</title>
<desc id="d">👋🏻 Hello World! / 🔬 Claims that survive a rerun / 💤 Builds that wait until morning / 🏗️ Keep the safe way easy / 🧰 Conventions I would pick again / 🏷️ Every build carries a version / 🎯 Covers exactly what was asked / 🪞 Lint before the pager rings / 🪵 The context in one place / 🧯 A fix without a heroic night / 📊 Numbers you can rerun later / 📖 Standards nobody can ignore / 🪄 No surprises in the build</desc>
<defs>
<filter id="g" x="-10%" y="-45%" width="120%" height="190%" color-interpolation-filters="sRGB">
