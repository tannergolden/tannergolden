# --- Test Suite Configuration ---
#
# THE TEST FILES ARE KEBAB-CASE, like the rest of this account's
# repositories, and two settings below exist solely to support that.
# `python_files = *.py` collects them without the `test_` prefix pytest
# expects by default, and `--import-mode=importlib` loads them, because a
# hyphenated file name is not a valid module identifier and the default
# prepend mode cannot import it.
#
# `pythonpath` puts `src/` on the path so a test imports the modules the
# workflow runs, rather than a copy.
#
# ---

[pytest]
testpaths = tests
pythonpath = src tests
python_files = *.py
addopts = --strict-markers --strict-config -ra --import-mode=importlib
xfail_strict = true
filterwarnings =
    error
